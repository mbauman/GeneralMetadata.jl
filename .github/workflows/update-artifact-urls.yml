name: Update artifact URLs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'
  pull_request:
    paths:
      - 'scripts/update_artifact_urls.jl'

permissions:
  contents: write

jobs:
  update-artifact-urls:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref || github.ref_name }}
        fetch-depth: 0

    - name: Setup Julia
      uses: julia-actions/setup-julia@v1
      with:
        version: '1'

    - name: Install Julia dependencies
      run: |
        julia --project=. -e 'using Pkg; Pkg.instantiate()'

    - name: Update artifact URLs
      run: |
        julia --project=. scripts/update_artifact_urls.jl
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Check for changes
      id: git-check
      run: |
        [[ $(git ls-files --others --modified --exclude-standard) ]] && echo "changes=true" >> $GITHUB_OUTPUT || echo "no changes"

    - name: Commit and push changes
      if: steps.git-check.outputs.changes == 'true'
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add .
        git commit -m "[automatic] update artifact URLs - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        current_branch="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
        git pull --rebase origin $current_branch
        git push origin HEAD:"$current_branch"
