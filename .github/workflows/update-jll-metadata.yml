name: Update JLL metadata

on:
  workflow_dispatch:
  schedule:
    # Run at 1 AM UTC every day
    - cron: '0 1 * * *'
  pull_request:
    paths:
      - 'scripts/update_jll_metadata.jl'

permissions:
  contents: write

jobs:
  update-jll-metadata:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup juliaup with the necessary release channels
      run: |
        curl -fsSL https://install.julialang.org | sh -s -- --yes
        source ~/.julia/juliaup/juliaup-init.bash
        juliaup add release-1.12
        juliaup add release-1.7
        juliaup add 1.4.1
        juliaup add 1.4.0
        juliaup add 1.3.0

    - name: Install Julia dependencies
      run: |
        julia --project=. -e 'using Pkg; Pkg.instantiate()'

    - name: Update JLL metadata
      run: |
        julia --project=. scripts/update_jll_metadata.jl
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Check for changes
      id: git-check
      run: |
        [[ $(git ls-files --others --modified --exclude-standard) ]] && echo "changes=true" >> $GITHUB_OUTPUT || echo "no changes"

    - name: Commit and push changes
      if: steps.git-check.outputs.changes == 'true'
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add .
        git commit -m "Update JLL metadata - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        git push
