name: Update metadata

on:
  workflow_dispatch:
  schedule:
    # Run at midnight UTC every day
    - cron: '0 0 * * *'
  pull_request:
    paths:
      - 'scripts/update_metadata.jl'
      - 'scripts/update_metadata.jl'
      - 'src/GeneralMetadata.jl'
      - '.github/workflows/update-metadata.yml'

permissions:
  contents: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        ref: ${{ github.head_ref || github.ref_name }}

    - name: Setup Julia
      uses: julia-actions/setup-julia@v1
      with:
        version: '1'

    - name: Install Julia dependencies
      run: |
        julia --project=. -e 'using Pkg; Pkg.instantiate()'

    - name: Update metadata
      run: |
        julia --project=. scripts/update_metadata.jl
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Check for changes
      id: git-check
      run: |
        [[ $(git ls-files --others --modified --exclude-standard) ]] && echo "changes=true" >> $GITHUB_OUTPUT || echo "no changes"

    - name: Commit and push changes
      if: steps.git-check.outputs.changes == 'true'
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add .
        git commit -m "[automatic] update metadata - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        git push
