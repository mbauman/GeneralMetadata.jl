name = "Qhull"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """# initial setup\ncd $WORKSPACE/srcdir/qhull*/\nexport CMAKE_ARGS=\"-DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release\"\n\n# begin the build process\ncd build\n\n# Generate makefiles\ncmake $CMAKE_ARGS -G \"Unix Makefiles\" .. && cmake $CMAKE_ARGS ..\n\n# Run the build script\nmake -j${nproc}\n\n# Install Qhull\nmake install\n"""
version = "v2019.1.0"

