augment_platform_block = """using Base.BinaryPlatforms\nusing Libdl: dlopen, dlsym\n\nfunction augment_llvm!(platform::Platform)\n    haskey(platform, \"llvm_version\") && return platform\n\n    llvm_version = Base.libllvm_version\n    # does our LLVM build use assertions?\n    llvm_assertions = try\n        dlsym(dlopen(Base.libllvm_path()), \"_ZN4llvm24DisableABIBreakingChecksE\")\n        false\n    catch\n        true\n    end\n    platform[\"llvm_version\"] = if llvm_assertions\n        \"$(llvm_version.major).asserts\"\n    else\n        \"$(llvm_version.major)\"\n    end\n    return platform\nend\n\naugment_platform!(platform::Platform) = augment_llvm!(platform)\n"""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = true
name = "Qt6Tools"
platforms = ["x86_64-linux-musl-cxx11-llvm_version+20", "x86_64-linux-musl-cxx11-llvm_version+20.asserts"]
script = """cd $WORKSPACE/srcdir\n\nmkdir build\ncd build/\nqtsrcdir=`ls -d ../qttools-*`\n\nrm /usr/lib/libexpat.so.1\n\nif [[ \"${target}\" == *apple-darwin* ]]; then\n    apple_sdk_root=$WORKSPACE/srcdir/MacOSX14.0.sdk\n    sed -i \"s!/opt/$target/$target/sys-root!$apple_sdk_root!\" $CMAKE_TARGET_TOOLCHAIN\n    sed -i \"s!/opt/$target/$target/sys-root!$apple_sdk_root!\" /opt/bin/$bb_full_target/$target-clang++\n    export MACOSX_DEPLOYMENT_TARGET=12\nfi\n\ncase \"$bb_full_target\" in\n\n    x86_64-linux-musl*)\n        cmake -G Ninja \\\n            -DCMAKE_INSTALL_PREFIX=${prefix} \\\n            -DCMAKE_FIND_ROOT_PATH=$prefix \\\n            -DCMAKE_BUILD_TYPE=Release \\\n            $qtsrcdir\n    ;;\n\n    *mingw*)\n        cmake -G Ninja \\\n            -DQT_HOST_PATH=$host_prefix \\\n            -DCMAKE_INSTALL_PREFIX=${prefix} \\\n            -DCMAKE_FIND_ROOT_PATH=$prefix \\\n            -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n            -DCMAKE_BUILD_TYPE=Release \\\n            $qtsrcdir\n    ;;\n\n    *)\n        cmake -G Ninja \\\n            -DQT_HOST_PATH=$host_prefix \\\n            -DCMAKE_INSTALL_PREFIX=${prefix} \\\n            -DCMAKE_FIND_ROOT_PATH=$prefix \\\n            -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n            -DQT_NO_APPLE_SDK_AND_XCODE_CHECK=ON \\\n            -DCMAKE_BUILD_TYPE=Release \\\n            $qtsrcdir\n    ;;\n\nesac\n\ncmake --build . --parallel ${nproc}\ncmake --install .\ninstall_license $WORKSPACE/srcdir/qt*-src-*/LICENSES/LGPL-3.0-only.txt\n"""
version = "v6.8.2"

