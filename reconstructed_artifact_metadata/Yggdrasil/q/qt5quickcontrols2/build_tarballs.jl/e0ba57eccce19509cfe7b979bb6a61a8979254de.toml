julia_compat = "1.0"
lazy_artifacts = false
name = "Qt5QuickControls2"
platforms = ["aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-unknown-freebsd", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-apple-darwin"]
script = """# We need to make sure qmake is a copy and not a symlink for the Qt installation paths to be correct:\nprefixqmake=$(which qmake)\nrealqmake=$(readlink $prefixqmake)\nrm $prefixqmake\ncp $bindir/$realqmake $prefixqmake\n\ncase \"$target\" in\n    *apple-darwin*)\n        ln -s $libdir/QtCore.framework/Headers $includedir/QtCore\n        export QT_MAC_SDK_NO_VERSION_CHECK=1        \n        ;;\nesac\n\ncd $WORKSPACE/srcdir\nmkdir build\ncd build/\n\nqtsrcdir=`ls -d ../qtquickcontrols2-*`\n\nqmake $qtsrcdir\nmake -j${nproc}\n\n# It appends the root path here with the qmake dir, which is /workspace/artifacts/blah...\nmake INSTALL_ROOT=$PWD/dummyroot install\nrsync -ua dummyroot/workspace/*/destdir/* $prefix\n\ninstall_license $qtsrcdir/LICENSE.LGPL3\n\ncase \"$target\" in\n    *apple-darwin*)\n        rm $includedir/QtCore\n        ;;\nesac\n"""
version = "v5.15.2"

