platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\ncd qoco\n\ncmake -B build \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DQOCO_BUILD_TYPE=Release \\\n    -DQOCO_ALGEBRA_BACKEND=builtin \\\n    -DENABLE_TESTING=OFF \\\n    -DBUILD_QOCO_DEMO=OFF \\\n    -DBUILD_QOCO_BENCHMARK_RUNNER=OFF \\\n    -DCMAKE_C_STANDARD=99\n\ncmake --build build --parallel ${nproc}\ncmake --install build\n"""
