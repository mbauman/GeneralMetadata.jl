name = "QuantumEspresso"
platforms = ["i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran3", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "armv7l-linux-gnueabihf-libgfortran3", "armv7l-linux-gnueabihf-libgfortran4", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran3", "powerpc64le-linux-gnu-libgfortran4", "powerpc64le-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran3", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran3", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran3", "aarch64-linux-musl-libgfortran4", "aarch64-linux-musl-libgfortran5", "armv7l-linux-musleabihf-libgfortran3", "armv7l-linux-musleabihf-libgfortran4", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin-libgfortran3", "x86_64-apple-darwin-libgfortran4", "x86_64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran3", "x86_64-unknown-freebsd-libgfortran4", "x86_64-unknown-freebsd-libgfortran5"]
script = """cd qe-*\natomic_patch -p1 ../patches/0000-pass-host-to-configure.patch\n\nexport BLAS_LIBS=\"-L${libdir} -lopenblas\"\nexport LAPACK_LIBS=\"-L${libdir} -lopenblas\"\nexport FFTW_INCLUDE=${includedir}\nexport FFT_LIBS=\"-L${libdir} -lfftw3\"\nexport FC=mpif90\nexport CC=mpicc\nexport LD=\n\nflags=(--enable-parallel=yes)\nif [ \"${nbits}\" == 64 ]; then\n    # Enable Libxc support only on 64-bit platforms\n    atomic_patch -p1 ../patches/0001-libxc-prefix.patch\n    flags+=(--with-libxc=yes --with-libxc-prefix=${prefix})\nfi\n\nif [[ \"${target}\" == powerpc64le-linux-gnu ]]; then\n    # No scalapack binary available on PowerPC\n    flags+=(--with-scalapack=no)\nelse\n    export SCALAPACK_LIBS=\"-L${libdir} -lscalapack\"\n    flags+=(--with-scalapack=yes)\nfi\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} ${flags[@]}\nmake all \"${make_args[@]}\" -j $nproc\nmake install\n# Manually make all binary executables...executable.  Sigh\nchmod +x \"${bindir}\"/*\n"""
version = "v6.7.0"

