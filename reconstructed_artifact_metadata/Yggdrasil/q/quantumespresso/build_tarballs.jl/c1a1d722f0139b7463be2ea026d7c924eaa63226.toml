platforms = ["i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran3", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "armv7l-linux-gnueabihf-libgfortran3", "armv7l-linux-gnueabihf-libgfortran4", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran3", "powerpc64le-linux-gnu-libgfortran4", "powerpc64le-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran3", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran3", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran3", "aarch64-linux-musl-libgfortran4", "aarch64-linux-musl-libgfortran5", "armv7l-linux-musleabihf-libgfortran3", "armv7l-linux-musleabihf-libgfortran4", "armv7l-linux-musleabihf-libgfortran5", "x86_64-unknown-freebsd-libgfortran3", "x86_64-unknown-freebsd-libgfortran4", "x86_64-unknown-freebsd-libgfortran5"]
script = """    cd qe-*\n    atomic_patch -p1 ../patches/0000-pass-host-to-configure.patch\n\n    export BLAS_LIBS=\"-L${libdir} -lopenblas\"\n    export LAPACK_LIBS=\"-L${libdir} -lopenblas\"\n    export FFTW_INCLUDE=${includedir} FFT_LIBS=\"-L${libdir} -lfftw3\"\n    export MPIF90=mpif90\n    export CC=mpicc\n    ./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} \\\n        --enable-parallel=yes --with-scalapack=no \\\n        --with-libxc=no\n    make all \"${make_args[@]}\" -j $nproc MPIF90=mpif90 CC=mpicc\n    make install\n"""
version = "v6.7.0"

