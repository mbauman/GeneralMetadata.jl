augment_platform_block = ""
init_block = """ENV[\"QT_PLUGIN_PATH\"] = qt6plugins_dir\nENV[\"__EGL_VENDOR_LIBRARY_DIRS\"] = get(ENV, \"__EGL_VENDOR_LIBRARY_DIRS\", \"/usr/share/glvnd/egl_vendor.d\")\n"""
julia_compat = "1.6"
lazy_artifacts = false
name = "Qt6Wayland"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-unknown-freebsd"]
script = """# Need newer cmake from JLL\napk del cmake\n\ncd $WORKSPACE/srcdir\n\nmkdir build\ncd build/\nqtsrcdir=`ls -d ../qtwayland-*`\n\natomic_patch -p1 -d \"${qtsrcdir}\" ../patches/freebsd.patch\n\ncase \"$bb_full_target\" in\n\n    x86_64-linux-musl-libgfortran5-cxx11)\n        cmake -G Ninja \\\n            -DCMAKE_INSTALL_PREFIX=${prefix} \\\n            -DCMAKE_FIND_ROOT_PATH=$prefix \\\n            -DCMAKE_BUILD_TYPE=Release \\\n            $qtsrcdir\n    ;;\n\n    *)\n        cmake -G Ninja \\\n            -DQT_HOST_PATH=$host_prefix \\\n            -DCMAKE_INSTALL_PREFIX=${prefix} \\\n            -DCMAKE_FIND_ROOT_PATH=$prefix \\\n            -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n            -DCMAKE_BUILD_TYPE=Release \\\n            $qtsrcdir\n        # Fix needed for aarch64:\n        sed -i 's!/workspace/destdir/bin/wayland-scanner!/workspace/x86_64-linux-musl-cxx11/destdir/bin/wayland-scanner!' CMakeCache.txt\n    ;;\n\nesac\n\ncmake --build . --parallel ${nproc}\ncmake --install .\ninstall_license $WORKSPACE/srcdir/qt*-src-*/LICENSES/LGPL-3.0-only.txt\n"""
version = "v6.10.2"

