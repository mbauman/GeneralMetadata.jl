name = "Kokkos"
platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd ${WORKSPACE}/srcdir/kokkos\n\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    export MACOSX_DEPLOYMENT_TARGET=10.13\n    pushd ${WORKSPACE}/srcdir/MacOSX10.*.sdk\n    rm -rf /opt/${target}/${target}/sys-root/System\n    cp -a usr/* \"/opt/${target}/${target}/sys-root/usr/\"\n    cp -a System \"/opt/${target}/${target}/sys-root/\"\n    popd\nfi\n\ncmake -B build \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DCMAKE_CXX_STANDARD=17 \\\n    -DKokkos_ENABLE_OPENMP=ON \\\n    -DKokkos_ENABLE_SERIAL=ON\n\ncmake --build build --parallel ${nproc}\ncmake --install build\n\ninstall_license LICENSE\n"""
version = "v4.3.0"

