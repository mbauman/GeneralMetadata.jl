init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Kokkos"
platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11", "aarch64-apple-darwin"]
script = """cd $WORKSPACE/srcdir/kokkos-*\n\nOPENMP_FLAG=()\n\n#inspired by https://github.com/JuliaPackaging/Yggdrasil/blob/b15a45949bf007072af7a2f335fe6e49165f7627/E/Entwine/build_tarballs.jl#L31-L40\nif [[ ${target} == *-linux-musl* ]]; then\n    atomic_patch -p1 ${WORKSPACE}/srcdir/patches/disable-stacktrace-macro.patch\n\nelif [[  ${target} == *-mingw*  ]]; then\n    atomic_patch -p1 ${WORKSPACE}/srcdir/patches/mingw-lowercase-windows-include.patch\n\nelif [[  ${target} == *-apple-*  ]]; then\n# Apple's Clang does not support OpenMP? - taken from AMRex build_tarballs.jl\n    OPENMP_FLAG+=(-DKokkos_ENABLE_OPENMP=OFF)\nelse\n    OPENMP_FLAG+=(-DKokkos_ENABLE_OPENMP=ON)\nfi\n\nmkdir build\ncd build/\n\ncmake .. \\\n-DCMAKE_INSTALL_PREFIX=$prefix \\\n-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n-DCMAKE_BUILD_TYPE=Release \\\n-DBUILD_SHARED_LIBS=ON \\\n\"${OPENMP_FLAG[@]}\"\n\nmake -j${nproc}\nmake install\n\n"""
version = "v3.5.0"

