name = "kalign"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/kalign*/\nmkdir build && cd build\n\n# avoid autodetection (because we are cross-compiling)\nif [[ \"${target}\" == x86_64-* || \"${target}\" == i686-* ]]; then\n    CMAKE_EXTRA_FLAGS=\"-DHAVE_SSE=ON -DHAVE_AVX=ON -DHAVE_AVX2=ON\"\nelse\n    CMAKE_EXTRA_FLAGS=\"-DHAVE_SSE=OFF -DHAVE_AVX=OFF -DHAVE_AVX2=OFF\"\nfi\necho \"CMAKE_EXTRA_FLAGS=$CMAKE_EXTRA_FLAGS\"\n\ncmake .. \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=RELEASE \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DBUILD_TESTING=OFF \\\n    -DUSE_OPENMP=ON \\\n    ${CMAKE_EXTRA_FLAGS}\nmake -j${nproc}\nmake install\ninstall_license ../COPYING\n"""
version = "v3.4.0"

