augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "JlrsLedger"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/jlrs_ledger\n\nif [[ \"${target}\" == *-musl ]]; then \n    rust_flags=\"-C target-feature=-crt-static\"\nfi\n\nRUSTFLAGS=$rust_flags cargo build --release --verbose\n\ninstall_license LICENSE\nif [[ \"${target}\" == *-mingw* ]]; then\n    install -Dvm 0755 \"target/${rust_target}/release/jlrs_ledger.${dlext}\" \"${libdir}/libjlrs_ledger.${dlext}\"\nelse\n    install -Dvm 0755 \"target/${rust_target}/release/libjlrs_ledger.${dlext}\" \"${libdir}/libjlrs_ledger.${dlext}\"\nfi\n"""
version = "v0.0.1"

[[products]]
dir_paths = []
dlopen_flags = ["RTLD_GLOBAL"]
dont_dlopen = false
libnames = ["libjlrs_ledger"]
type = "lib"
variable_name = "libjlrs_ledger"

