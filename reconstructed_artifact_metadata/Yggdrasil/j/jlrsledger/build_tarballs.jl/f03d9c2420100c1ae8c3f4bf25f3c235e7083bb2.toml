version-minor = 0
version-patch = 0

[[products]]
dir_paths = []
dlopen_flags = ["RTLD_GLOBAL"]
dont_dlopen = false
libnames = ["libjlrs_ledger"]
type = "lib"
variable_name = "libjlrs_ledger"

