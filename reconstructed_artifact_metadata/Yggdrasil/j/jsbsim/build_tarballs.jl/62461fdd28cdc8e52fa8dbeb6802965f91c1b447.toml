init_block = ""
julia_compat = "1.5"
lazy_artifacts = false
name = "JSBSim"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "x86_64-apple-darwin", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/jsbsim\nsed -ri 's/PROJECT_VERSION_PATCH\\s\"6\"/PROJECT_VERSION_PATCH \"5\"/g' CMakeLists.txt\nmkdir build && cd build\nFLAGS=()\nif [[ \"${target}\" == *-mingw* ]]; then\n    FLAGS+=(-DCMAKE_CXX_FLAGS_RELEASE=\"-D_POSIX_C_SOURCE\")\nfi\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_FIND_ROOT_PATH=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_DOCS=OFF \\\n    -DBUILD_PYTHON_MODULE=OFF \\\n    -DBUILD_JULIA_PACKAGE=ON \\\n    -DJulia_PREFIX=${prefix} \\\n    \"${FLAGS[@]}\" \\\n    ..\ncmake --build . --target JSBSimJL -- -j${nproc}\ninstall_license $WORKSPACE/srcdir/jsbsim/COPYING\ncp julia/*JSBSimJL*.$dlext $libdir/.\n"""
version = "v1.1.5"

[[dependencies]]
name = "libjulia_jll"
type = "builddependency"
version-major = 1
version-minor = 5
version-patch = 3
[[dependencies]]
name = "libcxxwrap_julia_jll"
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["libJSBSimJL"]
type = "lib"
variable_name = "libJSBSimJL"

