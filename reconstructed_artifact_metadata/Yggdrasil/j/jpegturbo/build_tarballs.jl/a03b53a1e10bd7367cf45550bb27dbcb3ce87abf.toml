augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "JpegTurbo"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libjpeg-turbo*\n\n# Explicitly link against libm, this is necessary on older glibc systems\natomic_patch -p1 $WORKSPACE/srcdir/patches/libjpeg-turbo-toplevel-libm.patch\natomic_patch -p1 $WORKSPACE/srcdir/patches/libjpeg-turbo-sharedlib-libm.patch\n\noptions=(\n    -DCMAKE_INSTALL_PREFIX=${prefix}\n    -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\"\n    -DCMAKE_POSITION_INDEPENDENT_CODE=ON\n)\n\nif [[ $target == riscv64-* ]]; then\n    # Disable SIMD to avoid build error\n    options+=(-DWITH_SIMD=OFF)\nfi\n\ncmake -Bbuild \"${options[@]}\"\ncmake --build build --parallel ${nproc}\ncmake --install build\n"""
version = "v3.2.0"

