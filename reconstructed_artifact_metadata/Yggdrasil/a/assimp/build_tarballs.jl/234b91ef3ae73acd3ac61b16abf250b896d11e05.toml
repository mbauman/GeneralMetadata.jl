name = "assimp"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """# Need newer cmake from JLL\napk del cmake\n\ncd $WORKSPACE/srcdir\ncd assimp/\nmkdir build && cd build\ncmake .. -DCMAKE_INSTALL_PREFIX=$prefix -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DASSIMP_BUILD_ASSIMP_TOOLS=false \\\n    -DASSIMP_BUILD_TESTS=false \\\n    -DASSIMP_INSTALL_PDB=false \\\n    -DASSIMP_DOUBLE_PRECISION=false \\\n    -DINJECT_DEBUG_POSTFIX=false \\\n    -DASSIMP_WARNINGS_AS_ERRORS=OFF \\\n\nmake -j${nproc}\nmake install\ninstall_license ../LICENSE\n"""
version = "v6.0.4"

