dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "argp_standalone"
platforms = ["i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/argp-*/\nCFLAGS=\"-fPIC\" ./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\ninstall_license $WORKSPACE/srcdir/LICENSE\ninstall -D -m644 argp.h ${includedir}/argp.h\ninstall -D -m755 libargp.a ${libdir}/libargp.a\n"""
version = "v1.3.1"

[[products]]
paths = ["lib/libargp.a"]
type = "file"
variable_name = "libargp"
[[products]]
paths = ["include/argp.h"]
type = "file"
variable_name = "argp_h"

