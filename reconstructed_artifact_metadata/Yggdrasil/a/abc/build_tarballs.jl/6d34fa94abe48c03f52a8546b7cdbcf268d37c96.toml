augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "ABC"
platforms = ["x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin"]
script = """cd ${WORKSPACE}/srcdir/abc\n\ninstall -Dv abc.rc ${prefix}/abc.rc\n\n# select compiler based on target platform\n# ABC on Apple platforms can be compiled using clang instead of gcc,\n# while clang fails on Linux\nif [[ \"${target}\" == *-apple-* ]]; then\n    CC=clang\n    CXX=clang++\nelse\n    CC=gcc\n    CXX=g++\nfi\n\nEXFLGS=\"\\\n-fPIC \\\n-Wall \\\n-Wno-unused-function \\\n-Wno-write-strings \\\n-Wno-sign-compare \\\n-Wno-unused-but-set-variable \\\n-DSIZEOF_INT=4 \\\n-DABC_USE_CUDD=1 \\\n-DABC_USE_PTHREADS \\\n-DABC_USE_STDINT_H=1 \\\n-DSIZEOF_VOID_P=8 \\\n-DSIZEOF_LONG=8 \\\n\"\n\n# make libabc.so\nmake -j${nproc} CC=${CC} CXX=${CXX} CFLAGS+=\"${EXFLGS}\" libabc.so\n# the abc Makefile always makes a .so  Fix that here.\ninstall -Dvm 755 \"libabc.so\" \"${libdir}/libabc.${dlext}\"\n\nmake -j${nproc} CC=${CC} CXX=${CXX} CFLAGS+=\"${EXFLGS}\"\ninstall -Dvm 755 \"abc${exeext}\" \"${bindir}/abc${exeext}\"\ninstall_license copyright.txt\nexit\n"""
version = "v1.1.2"

