platforms = ["x86_64-linux-gnu-cxx11-mpi+mpiabi", "aarch64-linux-gnu-cxx11-mpi+mpiabi", "powerpc64le-linux-gnu-cxx11-mpi+mpiabi", "riscv64-linux-gnu-cxx11-mpi+mpiabi", "x86_64-linux-musl-cxx11-mpi+mpiabi", "aarch64-linux-musl-cxx11-mpi+mpiabi", "x86_64-apple-darwin-mpi+mpiabi", "aarch64-apple-darwin-mpi+mpiabi", "x86_64-unknown-freebsd-mpi+mpiabi", "aarch64-unknown-freebsd-mpi+mpiabi", "x86_64-linux-gnu-cxx11-mpi+mpich", "aarch64-linux-gnu-cxx11-mpi+mpich", "powerpc64le-linux-gnu-cxx11-mpi+mpich", "riscv64-linux-gnu-cxx11-mpi+mpich", "x86_64-linux-musl-cxx11-mpi+mpich", "aarch64-linux-musl-cxx11-mpi+mpich", "x86_64-apple-darwin-mpi+mpich", "aarch64-apple-darwin-mpi+mpich", "x86_64-unknown-freebsd-mpi+mpich", "aarch64-unknown-freebsd-mpi+mpich", "x86_64-linux-gnu-cxx11-mpi+mpitrampoline", "aarch64-linux-gnu-cxx11-mpi+mpitrampoline", "powerpc64le-linux-gnu-cxx11-mpi+mpitrampoline", "riscv64-linux-gnu-cxx11-mpi+mpitrampoline", "x86_64-apple-darwin-mpi+mpitrampoline", "aarch64-apple-darwin-mpi+mpitrampoline", "x86_64-unknown-freebsd-mpi+mpitrampoline", "aarch64-unknown-freebsd-mpi+mpitrampoline", "x86_64-linux-gnu-cxx11-mpi+openmpi", "aarch64-linux-gnu-cxx11-mpi+openmpi", "powerpc64le-linux-gnu-cxx11-mpi+openmpi", "riscv64-linux-gnu-cxx11-mpi+openmpi", "x86_64-linux-musl-cxx11-mpi+openmpi", "aarch64-linux-musl-cxx11-mpi+openmpi", "x86_64-apple-darwin-mpi+openmpi", "aarch64-apple-darwin-mpi+openmpi", "x86_64-unknown-freebsd-mpi+openmpi", "aarch64-unknown-freebsd-mpi+openmpi"]
script = """macos_sdk_version=11.0\nmacosx_deployment_target=11.0\n# Move the SDK tarball out of `srcdir` on all platforms: any extra entry\n# in there defeats the automatic installation of license files, which\n# expects `srcdir` to contain a single top-level source directory.\nmv ${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz ${WORKSPACE}/\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    # Extract SDK. Also outside of `srcdir`, for the same reason.\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    tar \\\n        --extract \\\n        --file=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=${WORKSPACE} \\\n        --warning=no-unknown-keyword\n    old_sdkroot=${SDKROOT}\n    new_sdkroot=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk\n    # Make sure libc++ header files are available at `usr/include/c++/v1`.\n    # Some SDKs ship their own (e.g. 15.0), which we leave alone; for those\n    # that don't, symlink the ones from the default SDK. Note we symlink\n    # the `v1` subdirectory rather than the whole `c++` directory: some\n    # SDKs (e.g. 10.13) contain `usr/include/c++/4.2.1` (but no `v1`), and\n    # symlinking `c++` onto that existing directory would silently create\n    # a nested `c++/c++` link, so libc++ headers like <new> are not found.\n    if [[ ! -d ${new_sdkroot}/usr/include/c++/v1 ]]; then\n        mkdir -p ${new_sdkroot}/usr/include/c++\n        ln -sT ${old_sdkroot}/usr/include/c++/v1 ${new_sdkroot}/usr/include/c++/v1\n    fi\n    # In the build environment `usr/local` of the default sys-root is a\n    # symlink to the destdir prefix, which puts the header files of the\n    # dependencies on the compilers' default search path. No SDK ships a\n    # `usr/local`, so replicate that symlink in the new SDK. `-T` makes\n    # this fail loudly should some SDK ship a `usr/local` after all,\n    # instead of silently creating a nested `usr/local/local` link.\n    ln -sT ${old_sdkroot}/usr/local ${new_sdkroot}/usr/local\n    # Fix toolchain files\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" ${MESON_TARGET_TOOLCHAIN} ${CMAKE_TARGET_TOOLCHAIN}\n    # Fix compiler wrappers\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" $(find /opt/bin/${target}* -type f -print)\n    SDKROOT=${new_sdkroot}\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd ${WORKSPACE}/srcdir/ADIOS2\n\n# Don't define clock_gettime on macOS\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/clock_gettime.patch\n# Declare `arm8_rt_call_link`. See <https://github.com/ornladios/ADIOS2/issues/3925>.\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/arm8_rt_call_link.patch\n# Declare `htons`. See <https://github.com/ornladios/ADIOS2/issues/3926>.\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/htons.patch\n# Correct library dependencies\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/cmakelists.patch\n# Correct C includes\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/cinttypes.patch\n\n# pkg-config is very slow because `abseil_cpp` installed about 200 `*.pc` files.\n# Pretend that `protobuf` does not require `abseil_cpp`.\nmv /workspace/destdir/lib/pkgconfig/protobuf.pc /workspace/destdir/lib/pkgconfig/protobuf.pc.orig\nsed -e 's/Requires/# Requires/' /workspace/destdir/lib/pkgconfig/protobuf.pc.orig >/workspace/destdir/lib/pkgconfig/protobuf.pc\n\n# Fortran is not supported with Clang\n# We need `-DADIOS2_Blosc2_PREFER_SHARED=ON` because of <https://github.com/ornladios/ADIOS2/issues/3924>.\ncmakeopts=(\n    -DCMAKE_BUILD_TYPE=Release\n    -DCMAKE_FIND_ROOT_PATH=${prefix}\n    -DCMAKE_INSTALL_PREFIX=${prefix}\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\n    -DBUILD_SHARED_LIBS=ON\n    -DBUILD_TESTING=OFF\n    -DADIOS2_BUILD_EXAMPLES=OFF\n    -DADIOS2_Blosc2_PREFER_SHARED=ON\n    -DADIOS2_HAVE_ZFP_CUDA=OFF\n    -DADIOS2_INSTALL_GENERATE_CONFIG=OFF\n    -DADIOS2_USE_Blosc2=ON\n    -DADIOS2_USE_CUDA=OFF\n    -DADIOS2_USE_EXTERNAL_NLOHMANN_JSON=ON\n    -DADIOS2_USE_EXTERNAL_PUGIXML=ON\n    -DADIOS2_USE_EXTERNAL_YAMLCPP=ON\n    -DADIOS2_USE_Fortran=OFF\n    -DADIOS2_USE_MPI=ON\n    -DADIOS2_USE_PNG=ON\n    -DADIOS2_USE_SZ3=ON\n    -DADIOS2_USE_ZFP=ON\n    -DADIOS2_USE_ZeroMQ=ON\n    -DMPI_HOME=${prefix}\n    -DFFS_FLOAT_FORMAT_TEST=\"0\"\n    -DFFS_FLOAT_FORMAT_TEST__TRYRUN_OUTPUT=\"Format_IEEE_754_littleendian\"   # or \"Format_IEEE_754_bigendian\"\n)\n\nif [[ ${bb_full_target} == *microsoftmpi* ]]; then\n    # Microsoft MPI need special care\n    cmakeopts+=(\n        -DMPI_C_ADDITIONAL_INCLUDE_DIRS=\n        -DMPI_C_LIBRARIES=$l{ibdir}/msmpi.dll\n        -DMPI_CXX_ADDITIONAL_INCLUDE_DIRS=\n        -DMPI_CXX_LIBRARIES=${libdir}/msmpi.dll\n        -DMPI_Fortran_ADDITIONAL_INCLUDE_DIRS=\n        -DMPI_Fortran_LIBRARIES=${libdir}/msmpi.dll\n    )\nfi\n\nif [[ ${bb_full_target} == *mpich* ]]; then\n    # This feature only works with MPICH\n    cmakeopts+=(\n        -DADIOS2_HAVE_MPI_CLIENT_SERVER_EXITCODE=0\n        -DADIOS2_HAVE_MPI_CLIENT_SERVER_EXITCODE__TRYRUN_OUTPUT=\n    )\nelse\n    cmakeopts+=(\n        -DADIOS2_HAVE_MPI_CLIENT_SERVER_EXITCODE=1\n        -DADIOS2_HAVE_MPI_CLIENT_SERVER_EXITCODE__TRYRUN_OUTPUT=\n    )\nfi\n\n# DataMan\nif [[ ${target} != *-mingw* ]]; then\n    cmakeopts+=(-DADIOS2_USE_DataMan=ON)\nfi\n\n# HDF5\nif [[ ${target} != *-mingw* ]]; then\n    # On Windows, enabling HDF5 leads to the error: `H5VolReadWrite.c:(.text+0x5eb): undefined reference to `H5Pget_fapl_mpio'`\n    # We do not build HDF5 for musl\n    cmakeopts+=(-DADIOS2_USE_HDF5=ON)\nelse\n    cmakeopts+=(-DADIOS2_USE_HDF5=OFF)\nfi\n\n# MGARD\nif [[ ${target} != *-mingw* ]]; then\n    cmakeopts+=(-DADIOS2_USE_MGARD=ON)\nfi\n\n# SST\nif [[ ${target} != *-mingw* && ${target} != *-musl* ]]; then\n    cmakeopts+=(\n        -DADIOS2_USE_SST=ON\n        -DADIOS2_SST_HAVE_MPI_DP_HEURISTICS_PASSED_EXITCODE=1   # we assume it fails\n        -DADIOS2_SST_HAVE_MPI_DP_HEURISTICS_PASSED_EXITCODE__TRYRUN_OUTPUT=\n    )\nelse\n    cmakeopts+=(-DADIOS2_USE_SST=OFF)\nfi\n\nexport MPITRAMPOLINE_CC=${CC}\nexport MPITRAMPOLINE_CXX=${CXX}\nexport MPITRAMPOLINE_FC=${FC}\n\ncmake -Bbuild -GNinja ${cmakeopts[@]}\n\n# Something is wrong with the generated `build.ninja` file on Darwin, don't know why\nif [[ ${target} == *-darwin* ]]; then\n    sed -i -e 's+-lffi+-L/workspace/destdir/lib -lffi+' build/build.ninja\nfi\n\ncmake --build build --parallel ${nproc}\ncmake --install build\ninstall_license Copyright.txt LICENSE\n"""
version = "v202.1200.100"

