platforms = ["x86_64-linux-gnu-libgfortran3-cxx03", "x86_64-linux-gnu-libgfortran4-cxx03", "x86_64-linux-gnu-libgfortran5-cxx03", "x86_64-linux-gnu-libgfortran3-cxx11", "x86_64-linux-gnu-libgfortran4-cxx11", "x86_64-linux-gnu-libgfortran5-cxx11", "aarch64-linux-gnu-libgfortran3-cxx03", "aarch64-linux-gnu-libgfortran4-cxx03", "aarch64-linux-gnu-libgfortran5-cxx03", "aarch64-linux-gnu-libgfortran3-cxx11", "aarch64-linux-gnu-libgfortran4-cxx11", "aarch64-linux-gnu-libgfortran5-cxx11", "powerpc64le-linux-gnu-libgfortran3-cxx03", "powerpc64le-linux-gnu-libgfortran4-cxx03", "powerpc64le-linux-gnu-libgfortran5-cxx03", "powerpc64le-linux-gnu-libgfortran3-cxx11", "powerpc64le-linux-gnu-libgfortran4-cxx11", "powerpc64le-linux-gnu-libgfortran5-cxx11", "x86_64-linux-musl-libgfortran3-cxx03", "x86_64-linux-musl-libgfortran4-cxx03", "x86_64-linux-musl-libgfortran5-cxx03", "x86_64-linux-musl-libgfortran3-cxx11", "x86_64-linux-musl-libgfortran4-cxx11", "x86_64-linux-musl-libgfortran5-cxx11", "aarch64-linux-musl-libgfortran3-cxx03", "aarch64-linux-musl-libgfortran4-cxx03", "aarch64-linux-musl-libgfortran5-cxx03", "aarch64-linux-musl-libgfortran3-cxx11", "aarch64-linux-musl-libgfortran4-cxx11", "aarch64-linux-musl-libgfortran5-cxx11", "x86_64-apple-darwin-libgfortran4", "x86_64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran3-cxx03", "x86_64-unknown-freebsd-libgfortran4-cxx03", "x86_64-unknown-freebsd-libgfortran5-cxx03", "x86_64-unknown-freebsd-libgfortran3-cxx11", "x86_64-unknown-freebsd-libgfortran4-cxx11", "x86_64-unknown-freebsd-libgfortran5-cxx11", "x86_64-w64-mingw32-libgfortran3-cxx03", "x86_64-w64-mingw32-libgfortran4-cxx03", "x86_64-w64-mingw32-libgfortran5-cxx03", "x86_64-w64-mingw32-libgfortran3-cxx11", "x86_64-w64-mingw32-libgfortran4-cxx11", "x86_64-w64-mingw32-libgfortran5-cxx11"]
script = """cd $WORKSPACE/srcdir\ncd ADIOS2-2.7.1\n# See <https://github.com/ornladios/ADIOS2/issues/2705>\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/gettid.patch\n# PR <https://github.com/ornladios/ADIOS2/pull/2712>\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/ndims.patch\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/shlwapi.patch\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/sockaddr_in.patch\nmkdir build\ncd build\nif [[ \"$target\" == *-apple-* ]]; then\n    # Set up a wrapper script for the assembler. GCC's assembly output\n    # isn't accepted by the LLVM assembler.\n    as=$(which as)\n    mv \"$as\" \"$as.old\"\n    export AS=\"$as.old\"\n    ln -s \"$WORKSPACE/srcdir/scripts/as.llvm\" \"$as\"\nfi\narchopts=\nif [[ \"$target\" == x86_64-w64-mingw32 ]]; then\n    # - The MSMPI Fortran bindings are missing a function; see\n    #   <https://github.com/microsoft/Microsoft-MPI/issues/7>\n    echo 'void __guard_check_icall_fptr(unsigned long ptr) {}' >cfg_stub.c\n    gcc -c cfg_stub.c\n    ar -crs libcfg_stub.a cfg_stub.o\n    cp libcfg_stub.a $prefix/lib\n    # - cmake's auto-detection for MPI doesn't work on Windows.\n    # - The SST and Table ADIOS2 components don't build on Windows\n    #   (reported in <https://github.com/ornladios/ADIOS2/issues/2705>)\n    export FFLAGS=\"-I$prefix/src -I$prefix/include -fno-range-check\"\n    archopts=\"-DMPI_HOME=$prefix -DMPI_GUESS_LIBRARY_NAME=MSMPI -DMPI_C_LIBRARIES=msmpi64 -DMPI_CXX_LIBRARIES=msmpi64 -DMPI_Fortran_LIBRARIES='msmpifec64;msmpi64;cfg_stub' -DADIOS2_USE_SST=OFF -DADIOS2_USE_Table=OFF\"\nelif [[ \"$target\" == *-mingw* ]]; then\n    archopts=\"-DMPI_HOME=$prefix -DMPI_GUESS_LIBRARY_NAME=MSMPI -DADIOS2_USE_SST=OFF -DADIOS2_USE_Table=OFF\"\nfi\ncmake -DCMAKE_INSTALL_PREFIX=$prefix -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN%.*}_gcc.cmake -DCMAKE_BUILD_TYPE=Release -DADIOS2_BUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF ${archopts} ..\nmake -j${nproc}\nmake -j${nproc} install\ninstall_license ../Copyright.txt ../LICENSE\n"""
version = "v2.7.1"

