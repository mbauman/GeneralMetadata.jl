name = "avr_binutils"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/binutils-*\n./configure --prefix=${prefix} \\\n    --target=avr \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --disable-dependency-tracking \\\n    --disable-werror \\\n    --disable-gprof \\\n    --disable-gprofng \\\n    --disable-gas \\\n    --disable-gold \\\n    --disable-ar \\\n    --disable-avr-ar \\\n    --disable-libbfd \\\n    --disable-avr-libbfd \\\n    --disable-libctf \\\n    --disable-avr-libctf \\\n    --disable-size \\\n    --disable-nls \\\n    --enable-shared\nmake -j${nprocs}\nmake install\n"""
version = "v2.40.0"

