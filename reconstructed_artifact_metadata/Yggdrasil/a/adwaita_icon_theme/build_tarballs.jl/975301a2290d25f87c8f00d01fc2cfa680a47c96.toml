dependencies = ["hicolor_icon_theme_jll"]
name = "adwaita_icon_theme"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/adwaita-icon-theme-*/\n\n# Install native gtk+3.0 so that we get `gtk-encode-symbolic-svg`\napk add gtk+3.0 librsvg\n./autogen.sh --prefix=$prefix --host=$target\n./configure --prefix=$prefix --host=$target\nmake -j${nproc}\nmake install\n"""
version = "v3.33.92"

[[products]]
paths = ["share/icons"]
type = "file"
variable_name = "adwaita_icons_dir"

