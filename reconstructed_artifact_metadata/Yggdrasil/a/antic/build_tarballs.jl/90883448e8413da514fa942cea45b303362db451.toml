init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "Antic"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\ncd antic*/\nif [[ ${target} == *musl* ]]; then\n   export CFLAGS=-D_GNU_SOURCE=1;\nelif [[ ${target} == *mingw* ]]; then\n   sed -i -e \"s#/lib\\>#/$(basename ${libdir})#g\" configure\n   extraflags=--build=MINGW${nbits};\nfi\n./configure --prefix=$prefix --disable-static --enable-shared --with-gmp=$prefix --with-mpfr=$prefix --with-flint=$prefix ${extraflags}\nmake -j${nproc}\nmake install LIBDIR=$(basename ${libdir})\n"""
version = "v0.2.3"

