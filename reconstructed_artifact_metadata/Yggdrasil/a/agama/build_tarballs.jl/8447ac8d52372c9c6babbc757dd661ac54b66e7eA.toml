augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Agama"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin"]
script = """cd $WORKSPACE/srcdir/Agama\n\n# Make the Makefile.local\necho \"\nLINK = \\$(CXX)\n\nCOMPILE_FLAGS_ALL += -fPIC -fopenmp -Wall -O2 \nLINK_FLAGS_ALL += -fopenmp\nCOMPILE_FLAGS_ALL += -std=c++11\n\nCOMPILE_FLAGS_LIB += -I${includedir}\nLINK_FLAGS_LIB_AND_EXE_STATIC += -L${libdir} -lgsl -lgslcblas\n\" > Makefile.local\n\n# Generate the library\nmake -j${nproc} \"libagama.${dlext}\" LIBNAME_SHARED=\"libagama.${dlext}\"\n\n# Install\ninstall -Dvm 755 libagama.${dlext} -t ${libdir}\n"""
version = "v1.1.0"

