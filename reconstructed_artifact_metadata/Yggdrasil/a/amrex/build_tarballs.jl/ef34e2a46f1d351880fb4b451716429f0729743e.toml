script = """macos_sdk_version=14.0\nmacosx_deployment_target=14.0\n# Move the SDK tarball out of `srcdir` on all platforms: any extra entry\n# in there defeats the automatic installation of license files, which\n# expects `srcdir` to contain a single top-level source directory.\nmv ${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz ${WORKSPACE}/\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    # Extract SDK. Also outside of `srcdir`, for the same reason.\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    tar \\\n        --extract \\\n        --file=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=${WORKSPACE} \\\n        --warning=no-unknown-keyword\n    old_sdkroot=${SDKROOT}\n    new_sdkroot=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk\n    # Make sure libc++ header files are available at `usr/include/c++/v1`.\n    # Some SDKs ship their own (e.g. 15.0), which we leave alone; for those\n    # that don't, symlink the ones from the default SDK. Note we symlink\n    # the `v1` subdirectory rather than the whole `c++` directory: some\n    # SDKs (e.g. 10.13) contain `usr/include/c++/4.2.1` (but no `v1`), and\n    # symlinking `c++` onto that existing directory would silently create\n    # a nested `c++/c++` link, so libc++ headers like <new> are not found.\n    if [[ ! -d ${new_sdkroot}/usr/include/c++/v1 ]]; then\n        mkdir -p ${new_sdkroot}/usr/include/c++\n        ln -sT ${old_sdkroot}/usr/include/c++/v1 ${new_sdkroot}/usr/include/c++/v1\n    fi\n    # In the build environment `usr/local` of the default sys-root is a\n    # symlink to the destdir prefix, which puts the header files of the\n    # dependencies on the compilers' default search path. No SDK ships a\n    # `usr/local`, so replicate that symlink in the new SDK. `-T` makes\n    # this fail loudly should some SDK ship a `usr/local` after all,\n    # instead of silently creating a nested `usr/local/local` link.\n    ln -sT ${old_sdkroot}/usr/local ${new_sdkroot}/usr/local\n    # Fix toolchain files\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" ${MESON_TARGET_TOOLCHAIN} ${CMAKE_TARGET_TOOLCHAIN}\n    # Fix compiler wrappers\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" $(find /opt/bin/${target}* -type f -print)\n    SDKROOT=${new_sdkroot}\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd ${WORKSPACE}/srcdir/amrex\n\n# Correct HDF5 compiler wrappers\nperl -pi -e 's+-I/workspace/srcdir/hdf5-1[.]14[.]./src/H5FDsubfiling++' $(which h5pcc)\n\nif [[ \"${target}\" == *-apple-* ]]; then\n    # AMReX unconditionally uses `std::ostringstream::view()` (C++20, P2495), which\n    # is not yet available in the libc++/libstdc++ headers shipped with some of\n    # our cross toolchains even though the compiler itself accepts `-std=c++20`.\n    # Replace it with the equivalent (if slightly less efficient) `.str()`, which\n    # has been available since C++98 and works everywhere.\n    for f in Src/Base/AMReX_Print.H Src/Base/AMReX_VisMF.cpp Src/Base/AMReX_VisMF.H \\\n             Src/Base/AMReX_FabArrayUtility.H Src/Base/AMReX_ParmParse.cpp \\\n             Src/Base/AMReX.cpp Src/Base/AMReX_Utility.cpp; do\n        sed -i 's/\\.view()/\\.str()/g' \"${f}\"\n    done\nfi\n\nif [[ \"${target}\" == *-apple-* ]]; then\n    # Install libdispatch. This is required for the MacOS linker.\n    # It should probably have been put into the root file system.\n    # This requires GCC 14 or later.\n    apk add libdispatch libdispatch-dev --repository=http://dl-cdn.alpinelinux.org/alpine/v3.17/community\nfi\n\nif [[ \"${target}\" == *-apple-* ]]; then\n    if grep -q MPICH_NAME ${prefix}/include/mpi.h; then\n        # MPICH's pkgconfig file \"mpich.pc\" lists these options:\n        #     Libs:     -framework OpenCL -Wl,-flat_namespace -Wl,-commons,use_dylibs -L${libdir} -lmpi -lpmpi -lm    -lpthread\n        #     Cflags:   -I${includedir}\n        # cmake doesn't know how to handle the \"-framework OpenCL\" option\n        # and wants to use \"-framework\" as a stand-alone option. This fails,\n        # and cmake concludes that MPI is not available.\n        mpiopts=\"-DMPI_C_ADDITIONAL_INCLUDE_DIRS='' -DMPI_C_LIBRARIES='-Wl,-flat_namespace;-Wl,-commons,use_dylibs;-lmpi;-lpmpi' -DMPI_CXX_ADDITIONAL_INCLUDE_DIRS='' -DMPI_CXX_LIBRARIES='-Wl,-flat_namespace;-Wl,-commons,use_dylibs;-lmpi;-lpmpi'\"\n    fi\nelif [[ \"${target}\" == x86_64-w64-mingw32 ]]; then\n    mpiopts=\"-DMPI_HOME=${prefix} -DMPI_GUESS_LIBRARY_NAME=MSMPI -DMPI_C_LIBRARIES=msmpi64 -DMPI_CXX_LIBRARIES=msmpi64\"\nelif [[ \"${target}\" == *-mingw* ]]; then\n    mpiopts=\"-DMPI_HOME=${prefix} -DMPI_GUESS_LIBRARY_NAME=MSMPI\"\nelse\n    mpiopts=\nfi\n\nif [[ \"${target}\" == *-mingw32* ]]; then\n    # AMReX requires a parallel HDF5 library\n    hdf5opts=\"-DAMReX_HDF5=OFF\"\nelse\n    hdf5opts=\"-DAMReX_HDF5=ON\"\nfi\n\nexport MPITRAMPOLINE_CC=${CC}\nexport MPITRAMPOLINE_CXX=${CXX}\nexport MPITRAMPOLINE_FC=${FC}\n\ncmake \\\n    -B build \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=RelWithDebInfo \\\n    -DAMReX_FORTRAN=ON \\\n    -DAMReX_MPI=ON \\\n    -DAMReX_OMP=ON \\\n    -DAMReX_PARTICLES=ON \\\n    -DBUILD_SHARED_LIBS=ON \\\n    ${hdf5opts} \\\n    ${mpiopts}\ncmake --build build --parallel ${nproc}\ncmake --install build\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    # Move all shared libraries to `${libdir}`.\n    # Ref: <https://github.com/JuliaPackaging/Yggdrasil/issues/7968>.\n    mv -v ${prefix}/lib/*.${dlext} ${libdir}/.\nfi\n\ninstall_license LICENSE\n"""
