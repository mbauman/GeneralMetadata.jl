name = "Atomsk"
platforms = ["i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran5", "armv6l-linux-gnueabihf-libgfortran5", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran5", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran5"]
script = """cd $WORKSPACE/srcdir/atomsk\n\nexport ATOMSKLIB=$libdir/libatomsk.$dlext\nexport LAPACK=-lopenblas\nif [[ \"$target\" == *mingw* ]]; then\n    export LDFLAGS=\"-L${libdir}\"\nfi\ncd src\n\n# The makefile doesn't handle parallel builds\nmake shared=yes clib\ninstall -Dvm 755 \"atomsk${exeext}\" -t \"${bindir}\"\n"""
