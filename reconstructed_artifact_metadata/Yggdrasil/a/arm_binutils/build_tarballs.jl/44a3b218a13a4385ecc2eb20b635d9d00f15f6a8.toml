name = "arm_binutils"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/binutils-*\n# for building as\napk update\napk add --upgrade texinfo\n./configure --prefix=${prefix} \\\n    --target=arm-none-eabi \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --with-gas \\\n    --disable-dependency-tracking \\\n    --disable-werror \\\n    --disable-gprof \\\n    --disable-gprofng \\\n    --disable-gold \\\n    --disable-ar \\\n    --disable-arm-none-eabi-ar \\\n    --disable-libbfd \\\n    --disable-arm-none-eabi-libbfd \\\n    --disable-libctf \\\n    --disable-arm-none-eabi-libctf \\\n    --disable-size \\\n    --disable-arm-none-eabi-size \\\n    --disable-nls \\\n    --disable-arm-none-eabi-nls \\\n    --enable-shared\nmake -j${nprocs}\nmake install\nrm **/config.cache\n./configure --prefix=${prefix} \\\n    --target=arm-none-eabihf \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --with-gas \\\n    --disable-dependency-tracking \\\n    --disable-werror \\\n    --disable-gprof \\\n    --disable-gprofng \\\n    --disable-gold \\\n    --disable-arm \\\n    --disable-arm-none-eabihf-ar \\\n    --disable-libbfd \\\n    --disable-arm-none-eabihf-libbfd \\\n    --disable-libctf \\\n    --disable-arm-none-eabihf-libctf \\\n    --disable-size \\\n    --disable-arm-none-eabihf-size \\\n    --disable-nls \\\n    --disable-arm-none-eabihf-nls \\\n    --enable-shared\nmake -j${nprocs}\nmake install\n"""
version = "v2.41.0"

