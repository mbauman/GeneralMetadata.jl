dependencies = ["Glib_jll"]
name = "ATK"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/atk-*/\nmkdir build && cd build\n\n# Get a local gettext for msgfmt cross-building\napk add gettext\n\nmeson .. -Dintrospection=false --cross-file=\"${MESON_TARGET_TOOLCHAIN}\"\nninja -j${nproc}\nninja install\n"""
version = "v2.34.1"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libatk-1", "libatk-1.0"]
type = "lib"
variable_name = "libatk"

