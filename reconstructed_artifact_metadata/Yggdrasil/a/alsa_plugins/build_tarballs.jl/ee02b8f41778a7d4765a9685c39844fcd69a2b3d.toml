augment_platform_block = ""
init_block = """ENV[\"ALSA_PLUGIN_DIR\"] = get(ENV, \"ALSA_PLUGIN_DIR\", joinpath(artifact_dir, \"lib\", \"alsa-lib\"))\n"""
julia_compat = "1.6"
lazy_artifacts = false
name = "alsa_plugins"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir\ncd alsa-plugins-*\n# FFmpeg 9.0 removed AVCodec.sample_fmts (deprecated since lavc 61.13.100) in\n# favor of avcodec_get_supported_config(); patch the a52 plugin accordingly.\n# Uptream issue is <https://github.com/alsa-project/alsa-plugins/issues/64>.\natomic_patch -p1 $WORKSPACE/srcdir/patches/ffmpeg9-sample_fmts.patch\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake\nmake install\n"""
version = "v1.2.14"

