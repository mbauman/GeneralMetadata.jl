julia_compat = "1.6"
lazy_artifacts = false
name = "AWSCRT"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/awscrt\nmkdir build && cd build\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n\t-DCMAKE_PREFIX_PATH=${prefix} \\\n\t-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n\t-DCMAKE_BUILD_TYPE=Release \\\n\t..\ncmake --build . -j${nproc} --target install\n\ninstall_license /usr/share/licenses/APL2\n"""
version = "v0.1.3"

