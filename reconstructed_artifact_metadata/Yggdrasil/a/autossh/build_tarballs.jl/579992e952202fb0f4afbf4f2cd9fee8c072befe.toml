augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "autossh"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/autossh*\n\nif [[ \"${target}\" == *bsd* ]]; then\n    # the configure couldn't correctly check this on BSD\n    conf_args=\"ac_cv_have_decl___progname=yes\"\nelse\n    conf_args=\"\"\nfi\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} \\\n    ac_cv_func_malloc_0_nonnull=yes ac_cv_func_realloc_0_nonnull=yes \\\n    ac_cv_path_ssh=ssh \\\n    $conf_args\n\nmake -j${nproc}\nmake install\n\n# If exists, LICENSE file will be auto installed\nhead -n 22 autossh.c | tail -n 16 | sed -E 's/^ \\* ?//' > LICENSE\n"""
version = "v1.4.0"

[[products]]
binnames = ["autossh"]
type = "exe"
variable_name = "autossh"

