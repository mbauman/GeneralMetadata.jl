init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "ArbitraryLinearPlasmaSolver"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir\ncd ALPS\n\n# Fix hardcoded BLAS/LAPACK in all Makefile.am files\nsed -i 's/-llapack -lblas/$(LAPACK_LIBS) $(BLAS_LIBS)/g' distribution/Makefile.am\nsed -i 's/-llapack -lblas/$(LAPACK_LIBS) $(BLAS_LIBS)/g' interpolation/Makefile.am\n\nautoreconf -fi\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --with-blas=\"-lblastrampoline\" --with-lapack=\"-lblastrampoline\" FC=mpifort\nmake\nmake install\n"""
version = "v1.1.2"

