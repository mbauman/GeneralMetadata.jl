dependencies = ["Gettext_jll"]
name = "Ncurses"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/ncurses-*/\n\n# We need to run the native \"tic\" program\napk add ncurses\n\nCONFIG_FLAGS=\"\"\nif [[ ${target} == x86_64-apple-darwin14 ]]; then\n    CONFIG_FLAGS=\"${CONFIG_FLAGS} --disable-stripping\"\nelif [[ \"${target}\" == *-mingw* ]]; then\n    CONFIG_FLAGS=\"--enable-sp-funcs --enable-term-driver\"\n    export CFLAGS=\"-lintl -liconv\"\nfi\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} \\\n    --with-shared \\\n    --with-normal \\\n    --without-debug \\\n    --without-ada \\\n    --without-cxx-binding \\\n    --enable-widec \\\n    --enable-pc-files \\\n    --disable-rpath \\\n    --enable-colorfgbg \\\n    --enable-ext-colors \\\n    --enable-ext-mouse \\\n    --enable-warnings \\\n    --enable-assertions \\\n    --enable-database \\\n    ${CONFIG_FLAGS}\nmake -j${nproc}\nmake install\n\n# Remove duplicates that don't work on case-insensitive filesystems\nrm -f  ${prefix}/share/terminfo/2/2621a\nrm -rf ${prefix}/share/terminfo/a\nrm -rf ${prefix}/share/terminfo/e\nrm -f  ${prefix}/share/terminfo/h/hp2621a\nrm -f  ${prefix}/share/terminfo/h/hp70092a\nrm -rf ${prefix}/share/terminfo/l\nrm -rf ${prefix}/share/terminfo/m\nrm -rf ${prefix}/share/terminfo/n\nrm -rf ${prefix}/share/terminfo/p\nrm -rf ${prefix}/share/terminfo/q\nrm -rf ${prefix}/share/terminfo/X\n\n# Install pc files and fool packages looking for non-wide-character ncurses\nfor lib in ncurses form panel menu; do\n    if [[ \"${target}\" == *-mingw* ]]; then\n        # O Windows, Windows, wherefore art thou Windows?\n        abiver=6\n    fi\n    install -Dm644 \"misc/${lib}w.pc\" \"${prefix}/lib/pkgconfig/${lib}w.pc\"\n    ln -s \"${lib}w.pc\" \"${prefix}/lib/pkgconfig/${lib}.pc\"\n    ln -s \"lib${lib}w${abiver}.${dlext}\" \"${libdir}/lib${lib}${abiver}.${dlext}\"\ndone\nln -s ncursesw ${prefix}/include/ncurses\n"""
version = "v6.1.0"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libform", "libform6"]
type = "lib"
variable_name = "libform"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libmenu", "libmenu6"]
type = "lib"
variable_name = "libmenu"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libncurses", "libncurses6"]
type = "lib"
variable_name = "libncurses"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libpanel", "libpanel6"]
type = "lib"
variable_name = "libpanel"

