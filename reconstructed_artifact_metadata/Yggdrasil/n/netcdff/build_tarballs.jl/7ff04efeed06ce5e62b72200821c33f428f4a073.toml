name = "NetCDFF"
platforms = ["i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran5", "armv6l-linux-gnueabihf-libgfortran5", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran5", "riscv64-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran5", "armv6l-linux-musleabihf-libgfortran5", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran5", "aarch64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran5"]
script = """cd $WORKSPACE/srcdir/netcdf-fortran*\n\nif [[ ${target} == x86_64-linux-musl ]]; then\n    # see\n    # https://github.com/JuliaPackaging/Yggdrasil/blob/48af117395188f48d361a46ea929ee7563d9c2e4/A/ADIOS2/build_tarballs.jl\n\n    # HDF5 needs libcurl, and it needs to be the BinaryBuilder libcurl, not the system libcurl.\n    # MPI needs libevent, and it needs to be the BinaryBuilder libevent, not the system libevent.\n    rm /usr/lib/libcurl.*\n    rm /usr/lib/libevent*\n    rm /usr/lib/libnghttp2.*\nfi\n\nexport CPPFLAGS=\"-I${includedir}\"\nexport LDFLAGS=\"-L${libdir} -lnetcdf\"\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    # Manually build shared library for Windows\n    ${FC} -shared -fPIC -o ${libdir}/libnetcdff.${dlext} -Wl,$(flagon --whole-archive) ${prefix}/lib/libnetcdff.a -Wl,$(flagon --no-whole-archive) -lnetcdf\nfi\n\n# Remove static libraries\nrm ${prefix}/lib/*.a\n"""
