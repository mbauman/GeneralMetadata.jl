script = """cd $WORKSPACE/srcdir/normd_noexpat/\n\nfor p in ../patches/*.patch; do\n    atomic_patch -p1 \"${p}\"\ndone\n\nmake -j${nproc} CFLAGS=\"-O2 -std=c99\"\ninstall -Dvm 755 normd \"${bindir}/normd${exeext}\"\n"""
