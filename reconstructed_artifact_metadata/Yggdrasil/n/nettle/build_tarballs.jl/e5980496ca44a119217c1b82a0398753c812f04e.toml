init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Nettle"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/nettle-*/\natomic_patch -p1 ../patches/alloca.patch\n# Include patch for finding definition of `AT_HWCAP2` within the Linux\n# kernel headers, rather than the glibc headers, since our glibc is too old\natomic_patch -p1 ../patches/AT_HWCAP2-linux_headers.patch\n\n# Force c99 mode\nexport CFLAGS=\"${CFLAGS} -std=c99\"\n\nupdate_configure_scripts\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --with-include-path=${includedir}\nmake -j${nproc} SUBDIRS=\"tools\"\nmake install    SUBDIRS=\"tools\"\ninstall_license COPYING*\n"""
version = "v3.7.2"

