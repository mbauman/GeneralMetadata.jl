type = "exe"
variable_name = "ocloc"
[[products]]
dir_paths = ["lib/intel-opencl", "lib64/intel-opencl"]
dlopen_flags = []
dont_dlopen = false
libnames = ["libigdrcl"]
type = "lib"
variable_name = "libigdrcl"
[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
