init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "NativeFileDialog"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin"]
script = """cd $WORKSPACE/srcdir/nativefiledialog/src/\nif [[ \"${target}\" == *-mingw* ]]; then\n    c++ nfd_common.c nfd_win.cpp -lole32 -luuid -Iinclude -O2 -Wall -Wextra -fno-exceptions -shared -o \"${libdir}/libnfd.${dlext}\"\nelif [[ \"${target}\" == *-apple* ]]; then\n    cc nfd_cocoa.m nfd_common.c -framework Foundation -framework AppKit -Iinclude -O2 -Wall -Wextra -fno-exceptions -fPIC -shared -o \"${libdir}/libnfd.${dlext}\"\nelse\n    cc nfd_common.c nfd_gtk.c -Iinclude `pkg-config --cflags --libs gtk+-3.0` -O2 -Wall -Wextra -fno-exceptions -fPIC -shared -o \"${libdir}/libnfd.${dlext}\"\nfi\n"""
version = "v1.1.6"

