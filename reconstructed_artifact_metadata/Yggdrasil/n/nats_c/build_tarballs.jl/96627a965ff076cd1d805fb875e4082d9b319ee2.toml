name = "nats_c"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\n\n# Fix \"cannot finding openssl\" under Windows\nif [[ ${target} == x86_64-w64-mingw32 ]]; then\n    export OPENSSL_ROOT_DIR=${prefix}/lib64/\nfi\n\ncd nats.c/\natomic_patch -p1 ../patches/freebsd_include.diff\nsed -i 's/Ws2_32/ws2_32/g' CMakeLists.txt\nmkdir build\ncd build\ncmake -DCMAKE_INSTALL_PREFIX=$prefix -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release -DNATS_BUILD_EXAMPLES=OFF -DNATS_BUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF ..\nmake -j${nproc}\nmake install\n"""
version = "v3.6.1"

