augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "NodeJS_24"
platforms = ["x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "powerpc64le-linux-gnu-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/\ncp -vr ${target}/*/* ${prefix}/.\ncd ${prefix}\nif [[ \"${target}\" == *-mingw* ]]; then\n    for file in node.exe npm npm.cmd npx npx.cmd; do\n        install -Dvm 0755 \"${file}\" \"${bindir}/${file}\"\n    done\n    mv -v node_modules \"${bindir}/.\"\nfi\ninstall_license LICENSE\n"""
version = "v24.18.0"

[[products]]
binnames = ["node"]
type = "exe"
variable_name = "node"
[[products]]
paths = ["bin/npm"]
type = "file"
variable_name = "npm"
[[products]]
paths = ["bin/npx"]
type = "file"
variable_name = "npx"

