script = """cd ${WORKSPACE}/srcdir/\ncp -r ${target}/*/* ${prefix}/.\ncd ${prefix}\nif [[ \"${target}\" == *-mingw* ]]; then\n    for file in node.exe npm npm.cmd npx npx.cmd; do\n        install -Dvm 0755 \"${file}\" \"${bindir}/${file}\"\n    done\n    mv node_modules \"${bindir}/.\"\nfi\ninstall_license LICENSE\n"""
