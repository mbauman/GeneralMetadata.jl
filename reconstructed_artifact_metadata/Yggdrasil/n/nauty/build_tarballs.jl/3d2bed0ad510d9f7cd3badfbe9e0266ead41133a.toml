augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "nauty"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd ${WORKSPACE}/srcdir/nauty*\n\n# Remove misleading libtool files \nrm -f ${prefix}/lib/*.la\n\n# Patch based on one from Debian: add autotools build system which creates a\n# shared library; compared to the Debian version, a bunch of things we don't\n# need have been removed (perhaps even more should be removed?)\nsed -e \"s/@INJECTVER@/2.6.12/\" < ../patches/autotoolization.patch > ../patches/autotoolization2.patch\natomic_patch -p1 ../patches/autotoolization2.patch\n\nrm -f makefile*\nmkdir -p m4\nautoreconf -vi\n\nexport CPPFLAGS=\"${CPPFLAGS} -I${prefix}/include\"\nexport LDFLAGS=\"${LDFLAGS} -L${prefix}/lib\"\n\n./configure \\\n    --prefix=$prefix \\\n    --build=${MACHTYPE} \\\n    --host=$target \\\n    --enable-shared \\\n    --disable-static\n\nmake -j${nproc}\nmake install\n\ninstall_license COPYRIGHT\n"""
version = "v2.6.13"

