dependencies = []
name = "NUMA"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir\ncd numactl-*\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc} numademo_CFLAGS=\"-O3 -funroll-loops\"\nmake install\ninstall_license LICENSE.*\n"""
version = "v2.0.13"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libnuma"]
type = "lib"
variable_name = "libnuma"
[[products]]
binnames = ["numactl"]
type = "exe"
variable_name = "numactl"
[[products]]
binnames = ["numastat"]
type = "exe"
variable_name = "numastat"

[[sources]]
