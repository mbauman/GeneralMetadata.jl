augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "rcodesign"
platforms = ["x86_64-linux-gnu", "aarch64-linux-gnu", "powerpc64le-linux-gnu", "x86_64-linux-musl", "aarch64-linux-musl", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "x86_64-w64-mingw32"]
script = """macos_sdk_version=11.0\nmacosx_deployment_target=11.0\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    # Extract SDK\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    tar \\\n        --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=${WORKSPACE}/srcdir \\\n        --warning=no-unknown-keyword\n    old_sdkroot=${SDKROOT}\n    new_sdkroot=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk\n    # Point to C++ header files (these are not shipped with the SDK)\n    ln -s ${old_sdkroot}/usr/include/c++ ${new_sdkroot}/usr/include/c++\n    # Fix toolchain files\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" ${MESON_TARGET_TOOLCHAIN} ${CMAKE_TARGET_TOOLCHAIN}\n    # Fix compiler wrappers\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" $(find /opt/bin/${target}* -type f -print)\n    SDKROOT=${new_sdkroot}\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\n    if [[ \"${target}\" == \"aarch64-apple-darwin\"* ]]; then\n        # aws-lc requires the NEON and crypto extensions to be statically\n        # enabled on Apple aarch64 (every Apple Silicon CPU has them, but\n        # this clang does not enable them for bare arm64-apple-macosx).\n        export CFLAGS=\"${CFLAGS} -march=armv8-a+crypto\"\n    fi\n\n    if [[ \"${target}\" == *\"freebsd\"* ]]; then\n        # liblzma's vendored xz needs the XSI namespace for gettimeofday(),\n        # but _XOPEN_SOURCE hides the BSD APIs aws-lc uses (getentropy,\n        # minherit), so hand aws-lc-sys a flag set without the define --\n        # its builder prefers AWS_LC_SYS_CFLAGS over CFLAGS.\n        export CFLAGS=\"${CFLAGS} -D_XOPEN_SOURCE=700\"\n        export AWS_LC_SYS_CFLAGS=\"-U_XOPEN_SOURCE\"\n    fi\n\n    cd $WORKSPACE/srcdir/apple-platform-rs/\n    cargo build --release --locked --package apple-codesign --features aws-kms --target-dir ${WORKSPACE}/tmp\n\n    install_license apple-codesign/LICENSE\n    install -Dvm 755 \"${WORKSPACE}/tmp/${rust_target}/release/rcodesign${exeext}\" \"${bindir}/rcodesign${exeext}\"\n"""
version = "v0.29.0"

[[products]]
binnames = ["rcodesign"]
type = "exe"
variable_name = "rcodesign"

