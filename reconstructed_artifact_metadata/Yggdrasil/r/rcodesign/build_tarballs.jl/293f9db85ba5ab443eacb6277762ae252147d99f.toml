name = "rcodesign"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "x86_64-w64-mingw32"]
script = """if [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    #install a newer SDK which supports `kSecKeyAlgorithmRSASignatureMessagePSSSHA256`\n    pushd $WORKSPACE/srcdir/MacOSX11.*.sdk\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/*\n    cp -ra usr/* \"/opt/${target}/${target}/sys-root/usr/.\"\n    cp -ra System \"/opt/${target}/${target}/sys-root/.\"\n    popd\nfi\ncd $WORKSPACE/srcdir/PyOxidizer-apple-codesign-*/apple-codesign/\ncargo build --release\ninstall -Dvm 755 \"../target/${rust_target}/release/rcodesign${exeext}\" \"${bindir}/rcodesign${exeext}\"\ninstall_license ../LICENSE\n"""
version = "v0.17.0"

