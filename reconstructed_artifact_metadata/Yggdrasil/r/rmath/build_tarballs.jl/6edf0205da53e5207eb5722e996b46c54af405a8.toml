augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Rmath"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/Rmath-julia*\n# The whole `USEGCC`/`USECLANG` business is wrong and backword. Until this this fixed upstream\n# (https://github.com/JuliaStats/Rmath-julia/issues/47),\n# we have to set `USEGCC`/`USECLANG` ourselves.\nif [[ ${target} == *-apple-* ]] || [[ ${target} == *-freebsd* ]]; then\n   USECLANG=1\n   USEGCC=0\nelse\n   USECLANG=0\n   USEGCC=1\nfi\nmake -j${nproc} USECLANG=${USECLANG} USEGCC=${USEGCC}\nmkdir -p \"${libdir}\"\nmv src/libRmath-julia.* \"${libdir}\"\n"""
version = "v0.4.2"

