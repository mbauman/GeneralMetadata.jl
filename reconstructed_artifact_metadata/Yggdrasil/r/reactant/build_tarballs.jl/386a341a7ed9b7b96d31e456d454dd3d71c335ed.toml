augment_platform_block = """using Base.BinaryPlatforms\nusing Libdl\nconst Reactant_UUID = Base.UUID(\"0192cb87-2b54-54ad-80e0-3be72ad8a3c0\")\nconst preferences = Base.get_preferences(Reactant_UUID)\nBase.record_compiletime_preference(Reactant_UUID, \"mode\")\nBase.record_compiletime_preference(Reactant_UUID, \"gpu\")\n\nconst mode_preference = if haskey(preferences, \"mode\")\n    expected = (\"opt\", \"dbg\")\n    if isa(preferences[\"mode\"], String) && preferences[\"mode\"] in expected\n        preferences[\"mode\"]\n    else\n        @error \"Mode preference is not valid; expected $(join(expected, \", \", \", or \")), but got '$(preferences[\"debug\"])'\"\n        nothing\n    end\nelse\n    nothing\nend\n\nconst gpu_preference = if haskey(preferences, \"gpu\")\n    expected = (\"none\", \"cuda\", \"rocm\")\n    if isa(preferences[\"gpu\"], String) && preferences[\"gpu\"] in expected\n        preferences[\"gpu\"]\n    else\n        @error \"GPU preference is not valid; expected $(join(expected, \", \", \", or \")), but got '$(preferences[\"gpu\"])'\"\n        nothing\n    end\nelse\n    nothing\nend\n\nconst gpu_version_preference = if haskey(preferences, \"gpu_version\")\n    expected = (\"none\", \"12.9\", \"13.0\", \"7.1\")\n    if isa(preferences[\"gpu_version\"], String) && preferences[\"gpu_version\"] in expected\n        preferences[\"gpu_version\"]\n    else\n        @error \"GPU version preference is not valid; expected $(join(expected, \", \", \", or \")), but got '$(preferences[\"gpu_version\"])'\"\n        nothing\n    end\nelse\n    nothing\nend\n\n# adapted from `cudaRuntimeGetVersion` in CUDA_Runtime_jll\nfunction cuDriverGetVersion(library_handle)\n    function_handle = Libdl.dlsym(library_handle, \"cuDriverGetVersion\"; throw_error=false)\n    if function_handle === nothing\n        @debug \"CUDA Driver library seems invalid (does not contain 'cuDriverGetVersion')\"\n        return nothing\n    end\n    version_ref = Ref{Cint}()\n    status = ccall(function_handle, Cint, (Ptr{Cint},), version_ref)\n    if status != 0\n        @debug \"Call to 'cuDriverGetVersion' failed with status $(status)\"\n        return nothing\n    end\n    major, ver = divrem(version_ref[], 1000)\n    minor, patch = divrem(ver, 10)\n    version = VersionNumber(major, minor, patch)\n    @debug \"Detected CUDA Driver version $(version)\"\n    return version\nend\n\nfunction amdDriverInitialized()::Bool\n    amdgpu_module_path = \"/sys/module/amdgpu\"\n\n    # First, check if the driver's module directory exists.\n    if isdir(amdgpu_module_path)\n        initstate_path = joinpath(amdgpu_module_path, \"initstate\")\n\n        if isfile(initstate_path)\n            # Case 1: The driver is a loadable module.\n            # We need to read its state to see if it's 'live'.\n            # The `open...do` block ensures the file is closed automatically.\n            return open(initstate_path) do file\n                contains(read(file, String), \"live\")\n            end\n        else\n            # Case 2: The directory exists but `initstate` does not.\n            # This implies the driver is built into the kernel and is active.\n            return true\n        end\n    end\n\n    # If the directory doesn't exist, the driver isn't available.\n    return false\nend\n\n\nfunction augment_platform!(platform::Platform)\n\n    mode = get(ENV, \"REACTANT_MODE\", something(mode_preference, \"opt\"))\n    if !haskey(platform, \"mode\")\n        platform[\"mode\"] = mode\n    end\n\n    # \"none\" is for no gpu, but use \"nothing\" here to distinguish the case where the\n    # user explicitly asked for no GPU in the preferences.\n    gpu = something(gpu_preference, \"undecided\")\n\n    gpu_version_tag = something(gpu_version_preference, \"none\")\n\n    # Don't do GPU discovery on platforms for which we don't have GPU builds.\n    # Keep this in sync with list of platforms for which we actually build with GPU support.\n    if !Sys.isapple(platform) && !Sys.iswindows()\n\n        cuname = if Sys.iswindows()\n            Libdl.find_library(\"nvcuda\")\n        else\n            Libdl.find_library([\"libcuda.so.1\", \"libcuda.so\"])\n        end\n\n        # if we've found a system driver, put a dependency on it,\n        # so that we get recompiled if the driver changes.\n        if cuname != \"\" && gpu == \"undecided\"\n            handle = Libdl.dlopen(cuname)\n            current_cuda_version = cuDriverGetVersion(handle)\n            path = Libdl.dlpath(handle)\n            Libdl.dlclose(handle)\n\n            if gpu_version_tag == \"none\" && current_cuda_version isa VersionNumber\n                if v\"12\" <= current_cuda_version < v\"13\"\n                    gpu_version_tag = \"12.9\"\n                elseif v\"13.0\" <= current_cuda_version < v\"14\"\n                    gpu_version_tag = \"13.0\"\n                else\n                    @warn \"CUDA version $(current_cuda_version) in $(path) not supported with this version of Reactant (min supported: 12)\"\n                end\n            end\n\n            if gpu_version_tag != \"none\"\n                @debug \"Adding include dependency on $(path)\"\n                Base.include_dependency(path)\n                gpu = \"cuda\"\n            end\n        end\n\n        # if we've found a system driver, put a dependency on it,\n        # so that we get recompiled if the driver changes.\n\tif amdDriverInitialized() && gpu == \"undecided\"\n            #roname = \"\"\n            #handle = Libdl.dlopen(roname)\n            #path = Libdl.dlpath(handle)\n            #Libdl.dlclose(handle)\n\t    gpu_version_tag = \"7.1\"\n\n            #@debug \"Adding include dependency on $(path)\"\n            #Base.include_dependency(path)\n            gpu = \"rocm\"\n        end\n\n    end\n\n    # If gpu option is still \"undecided\" (no preference expressed) at this point, then\n    # make it \"none\" (no GPU support).\n    if gpu == \"undecided\"\n        gpu = \"none\"\n    end\n\n    gpu = get(ENV, \"REACTANT_GPU\", gpu)\n    if !haskey(platform, \"gpu\")\n        platform[\"gpu\"] = gpu\n    end\n\n    gpu_version_tag = get(ENV, \"REACTANT_GPU_VERSION\", gpu_version_tag)\n    if !haskey(platform, \"gpu_version\")\n        platform[\"gpu_version\"] = gpu_version_tag\n    end\n\n    return platform\nend\n\n"""
init_block = ""
julia_compat = "1.10"
lazy_artifacts = true
name = "Reactant"
platforms = ["x86_64-linux-gnu-cxx11-gpu_version+none-gpu+none-mode+opt", "aarch64-linux-gnu-cxx11-gpu_version+none-gpu+none-mode+opt", "x86_64-apple-darwin-gpu_version+none-gpu+none-mode+opt", "aarch64-apple-darwin-gpu_version+none-gpu+none-mode+opt", "x86_64-w64-mingw32-cxx11-gpu_version+none-gpu+none-mode+opt", "x86_64-apple-darwin-gpu_version+none-gpu+none-mode+dbg", "aarch64-apple-darwin-gpu_version+none-gpu+none-mode+dbg", "x86_64-linux-gnu-cxx11-gpu_version+12.9-gpu+cuda-mode+opt", "aarch64-linux-gnu-cxx11-gpu_version+12.9-gpu+cuda-mode+opt", "x86_64-linux-gnu-cxx11-gpu_version+13.0-gpu+cuda-mode+opt", "aarch64-linux-gnu-cxx11-gpu_version+13.0-gpu+cuda-mode+opt", "x86_64-linux-gnu-cxx11-gpu_version+7.1-gpu+rocm-mode+opt"]
script = ["""MODE=opt\nHERMETIC_CUDA_VERSION=none\n# Don't use ccache on Yggdrasil, doesn't seem to work.\nUSE_CCACHE=true\nENZYME_JAX_COMMIT=\nHERMETIC_ROCM_VERSION=none\ncd ${WORKSPACE}/srcdir\ntar xzf OpenJDK21U-jdk_x64_alpine-linux_hotspot_21.0.7_6.tar.gz\ntar xzf Bazel.v*.tar.gz\n\nif [[ \"${bb_full_target}\" == *gpu+cuda* ]]; then\n    if [[ \"${target}\" == aarch64-linux-gnu ]]; then\n       tar xf cuda_nvcc*tar.xz\n    fi\nfi\n\nexport JAVA_HOME=\"${PWD}/jdk-21.0.7+6\"\nexport BAZEL=\"${PWD}/bin/bazel\"\n\ncd Reactant.jl/deps/ReactantExtra\n\necho Clang version: $(clang --version)\necho GCC version: $(gcc --version)\n\nGCC_VERSION=$(gcc --version | head -1 | awk '{ print $3 }')\nGCC_MAJOR_VERSION=$(echo \"${GCC_VERSION}\" | cut -d. -f1)\n\n# Change Enzyme-JAX commit, necessary in CI of that repository.\nif [[ -n \"${ENZYME_JAX_COMMIT}\" ]]; then\n   sed -i.bak 's/ENZYMEXLA_COMMIT = \".*\"/ENZYMEXLA_COMMIT = \"'${ENZYME_JAX_COMMIT}'\"/' WORKSPACE\nfi\n\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    cd ${WORKSPACE}/srcdir\n    tar xf MacOSX*.sdk.tar.xz\n    cd -\n    # Compiling LLVM components within XLA requires macOS SDK 10.14\n    # and then we use `std::reinterpret_pointer_cast` in ReactantExtra\n    # which requires macOS SDK 11.3.\n    # Install a newer SDK which supports C++20\n    pushd $WORKSPACE/srcdir/MacOSX12.*.sdk\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/*\n    cp -ra usr/* \"/opt/${target}/${target}/sys-root/usr/.\"\n    cp -ra System \"/opt/${target}/${target}/sys-root/.\"\n    popd\n    export MACOSX_DEPLOYMENT_TARGET=12.3\nfi\n\nif [[ \"${bb_full_target}\" == *gpu+rocm* ]]; then\n    cd ${WORKSPACE}/srcdir\n    tar xzf therock-dist-linux-*.tar.gz\n    cd -\n\n    export ROCM_PATH=$WORKSPACE/srcdir\n\n    mv $ROCM_PATH/lib/libhiprtc-builtins.so.7.1.25442-19ae9ff849 $ROCM_PATH/lib/libhiprtc-builtins.so.7.1.25442\n    rm $ROCM_PATH/lib/libhiprtc-builtins.so.7\n    ln -s $ROCM_PATH/lib/libhiprtc-builtins.so.7.1.25442 $ROCM_PATH/lib/libhiprtc-builtins.so.7\n    mv $ROCM_PATH/lib/libhiprtc.so.7.1.25442-19ae9ff849 $ROCM_PATH/lib/libhiprtc.so.7.1.25442\n    rm $ROCM_PATH/lib/libhiprtc.so.7\n    ln -s $ROCM_PATH/lib/libhiprtc.so.7.1.25442 $ROCM_PATH/lib/libhiprtc.so.7\n    mv $ROCM_PATH/lib/libamdhip64.so.7.1.25442-19ae9ff849 $ROCM_PATH/lib/libamdhip64.so.7.1.25442\n    rm $ROCM_PATH/lib/libamdhip64.so.7\n    ln -s $ROCM_PATH/lib/libamdhip64.so.7.1.25442 $ROCM_PATH/lib/libamdhip64.so.7\n\n    ln -s $ROCM_PATH/lib/llvm/amdgcn $ROCM_PATH/amdgcn\n    mv $ROCM_PATH/bin/hipcc{,.real}\n    mv $ROCM_PATH/lib/llvm/bin/llvm-link{,.real}\n    mv $ROCM_PATH/lib/llvm/bin/opt{,.real}\n    echo \"#!/bin/bash\" > $ROCM_PATH/lib/llvm/bin/llvm-link\n    echo \"#!/bin/bash\" > $ROCM_PATH/lib/llvm/bin/opt\n    echo \"LD_LIBRARY_PATH=\\\"$LD_LIBRARY_PATH\\\" $ROCM_PATH/lib/llvm/bin/llvm-link.real \\$@\" >> $ROCM_PATH/lib/llvm/bin/llvm-link\n    echo \"LD_LIBRARY_PATH=\\\"$LD_LIBRARY_PATH\\\" $ROCM_PATH/lib/llvm/bin/opt.real \\$@\" >> $ROCM_PATH/lib/llvm/bin/opt\n    chmod +x $ROCM_PATH/lib/llvm/bin/opt\n    chmod +x $ROCM_PATH/lib/llvm/bin/llvm-link\n    cp `which clang` $ROCM_PATH/bin/hipcc\n    sed -i \"s,/opt/x86_64-linux-musl/bin/clang,$ROCM_PATH/bin/hipcc.real,g\" $ROCM_PATH/bin/hipcc\n    sed -i -e \"s,PRE_FLAGS+=( -nostdinc++ ),PRE_FLAGS+=( -nostdinc++ -isystem/workspace/bazel_root/097636303b1142f44508c1d8e3494e4b/external/local_config_rocm/rocm/rocm_dist/lib/llvm/lib/clang/22/include/cuda_wrappers -isystem/workspace/bazel_root/097636303b1142f44508c1d8e3494e4b/external/local_config_rocm/rocm/rocm_dist/lib/llvm/lib/clang/22/include),g\" $ROCM_PATH/bin/hipcc\n    sed -i -e \"s,export LD_LIBRARY_PATH,POST_FLAGS+=( --rocm-path=$ROCM_PATH -B $ROCM_PATH/lib/llvm/bin); export LD_LIBRARY_PATH,g\" $ROCM_PATH/bin/hipcc\nfi\n\nmkdir -p .local/bin\nexport LOCAL=\"`pwd`/.local/bin\"\nexport PATH=\"$LOCAL:$PATH\"\n\nln -s `which ar` /usr/bin/ar\n\nmkdir .bazhome\nexport HOME=`pwd`/.bazhome\n\nmkdir .tmp\nexport TMPDIR=`pwd`/.tmp\nexport TMP=$TMPDIR\nexport TEMP=$TMPDIR\nexport BAZEL_CXXOPTS=\"-std=c++17\"\nBAZEL_FLAGS=()\nBAZEL_BUILD_FLAGS=(-c $MODE)\n\n# don't run out of temporary space\nBAZEL_FLAGS+=(--output_user_root=$WORKSPACE/bazel_root)\nBAZEL_FLAGS+=(--server_javabase=$JAVA_HOME)\n# BAZEL_FLAGS+=(--extra_toolchains=@local_jdk//:all)\n\nBAZEL_BUILD_FLAGS+=(--jobs ${nproc})\n\n# Use ccache to speedup re-builds\nBAZEL_BUILD_FLAGS+=(--action_env=USE_CCACHE=${USE_CCACHE} --action_env=CCACHE_DIR=${CCACHE_DIR})\nBAZEL_BUILD_FLAGS+=(--action_env=CCACHE_NOHASHDIR=yes)\n# # Set `SUPER_VERBOSE` to a non empty string to make the compiler wrappers more\n# # verbose. Useful for debugging.\n# BAZEL_BUILD_FLAGS+=(--action_env=SUPER_VERBOSE=true)\n\nBAZEL_BUILD_FLAGS+=(--verbose_failures)\nBAZEL_BUILD_FLAGS+=(--cxxopt=-std=c++17 --host_cxxopt=-std=c++17)\nBAZEL_BUILD_FLAGS+=(--cxxopt=-DTCP_USER_TIMEOUT=0)\nBAZEL_BUILD_FLAGS+=(--check_visibility=false)\nBAZEL_BUILD_FLAGS+=(--build_tag_filters=-jlrule)\nBAZEL_BUILD_FLAGS+=(--experimental_cc_shared_library)\nBAZEL_BUILD_FLAGS+=(--toolchain_resolution_debug='@bazel_tools//tools/cpp:toolchain_type')\n\n# Always link with lld\nBAZEL_BUILD_FLAGS+=(--linkopt=-fuse-ld=lld)\n\n# Disable enabled-by-default TensorFlow features that we don't care about.\nBAZEL_BUILD_FLAGS+=(--define=no_aws_support=true)\nBAZEL_BUILD_FLAGS+=(--define=no_gcp_support=true)\nBAZEL_BUILD_FLAGS+=(--define=no_hdfs_support=true)\nBAZEL_BUILD_FLAGS+=(--define=no_kafka_support=true)\nBAZEL_BUILD_FLAGS+=(--define=no_ignite_support=true)\nBAZEL_BUILD_FLAGS+=(--define=grpc_no_ares=true)\n\nBAZEL_BUILD_FLAGS+=(--define=llvm_enable_zlib=false)\nBAZEL_BUILD_FLAGS+=(--verbose_failures)\n\nBAZEL_BUILD_FLAGS+=(--action_env=TMP=$TMPDIR --action_env=TEMP=$TMPDIR --action_env=TMPDIR=$TMPDIR --sandbox_tmpfs_path=$TMPDIR)\nBAZEL_BUILD_FLAGS+=(--host_action_env=TMP=$TMPDIR --host_action_env=TEMP=$TMPDIR --host_action_env=TMPDIR=$TMPDIR)\nBAZEL_BUILD_FLAGS+=(--host_cpu=k8)\nBAZEL_BUILD_FLAGS+=(--host_platform=//:linux_x86_64)\nBAZEL_BUILD_FLAGS+=(--host_crosstool_top=@//:ygg_host_toolchain_suite)\n\n# `using_clang` comes from Enzyme-JAX, to handle clang-specific options.\nBAZEL_BUILD_FLAGS+=(--define=using_clang=true)\n\nif [[ \"${bb_full_target}\" == *gpu+none* ]]; then\n    BAZEL_BUILD_FLAGS+=(--crosstool_top=@//:ygg_cross_compile_toolchain_suite)\nfi\n\n# BAZEL_BUILD_FLAGS+=(--extra_execution_platforms=@xla//tools/toolchains/cross_compile/config:linux_x86_64)\n\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n   BAZEL_CPU=darwin\nelif [[ \"${target}\" == aarch64-apple-darwin* ]]; then\n   BAZEL_CPU=darwin_arm64\nelif [[ \"${target}\" == x86_64-linux-* ]]; then\n   BAZEL_CPU=k8\nelif [[ \"${target}\" == aarch64-linux-* ]]; then\n   BAZEL_CPU=aarch64\nelif [[ \"${target}\" == x86_64-w64-mingw32* ]]; then\n   BAZEL_CPU=x64_windows\nelif [[ \"${target}\" == aarch64-mingw32* ]]; then\n   BAZEL_CPU=arm64_windows\nfi\n\necho \"register_toolchains(\\\"//:cc_toolchain_for_ygg_host\\\")\" >> WORKSPACE\n\nif [[ \"${target}\" == *-darwin* ]]; then\n\tBAZEL_BUILD_FLAGS+=(--config=macos)\n    BAZEL_BUILD_FLAGS+=(--define=gcc_linux_x86_32_1=false)\n    BAZEL_BUILD_FLAGS+=(--define=gcc_linux_x86_64_1=false)\n    BAZEL_BUILD_FLAGS+=(--define=gcc_linux_x86_64_2=false)\n    BAZEL_BUILD_FLAGS+=(--define=gcc_linux_aarch64=false)\n    BAZEL_BUILD_FLAGS+=(--define=gcc_linux_ppc64=false)\n    BAZEL_BUILD_FLAGS+=(--define=gcc_linux_s390x=false)\n    BAZEL_BUILD_FLAGS+=(--apple_platform_type=macos)\n    BAZEL_BUILD_FLAGS+=(--define=no_nccl_support=true)\n    BAZEL_BUILD_FLAGS+=(--define=build_with_mkl=false --define=enable_mkl=false --define=build_with_mkl_aarch64=false)\n    BAZEL_BUILD_FLAGS+=(--@xla//xla/tsl/framework/contraction:disable_onednn_contraction_kernel=True)\n\n    rm /opt/*apple*/bin/clang-8\n    rm /opt/*apple*/bin/clang\n\n    sed -i.bak1 -e \"/__cpp_lib_hardware_interference_size/d\" \\\n                    /opt/*apple*/*apple*/sys-root/usr/include/c++/v1/version\n\n    if [[ \"${target}\" == x86_64* ]]; then\n        BAZEL_BUILD_FLAGS+=(--platforms=@//:darwin_x86_64)\n        BAZEL_BUILD_FLAGS+=(--cpu=${BAZEL_CPU})\n        echo \"register_toolchains(\\\"//:cc_toolchain_for_ygg_darwin_x86\\\")\" >> WORKSPACE\n    elif [[ \"${target}\" == aarch64-* ]]; then\n        BAZEL_BUILD_FLAGS+=(--platforms=@//:darwin_arm64)\n        BAZEL_BUILD_FLAGS+=(--cpu=${BAZEL_CPU})\n        echo \"register_toolchains(\\\"//:cc_toolchain_for_ygg_darwin_arm64\\\")\" >> WORKSPACE\n    fi\n    BAZEL_BUILD_FLAGS+=(--linkopt=-twolevel_namespace)\n    BAZEL_BUILD_FLAGS+=(--define=clang_macos_x86_64=true)\n    BAZEL_BUILD_FLAGS+=(--define HAVE_LINK_H=0)\n    BAZEL_BUILD_FLAGS+=(--macos_minimum_os=${MACOSX_DEPLOYMENT_TARGET})\n    BAZEL_BUILD_FLAGS+=(--action_env=MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET})\n    BAZEL_BUILD_FLAGS+=(--host_action_env=MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET})\n    BAZEL_BUILD_FLAGS+=(--repo_env=MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET})\n    BAZEL_BUILD_FLAGS+=(--test_env=MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET})\n    BAZEL_BUILD_FLAGS+=(--incompatible_remove_legacy_whole_archive)\n    BAZEL_BUILD_FLAGS+=(--nolegacy_whole_archive)\nfi\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    sed -i 's/noincompatible_enable_cc_toolchain_resolution/incompatible_enable_cc_toolchain_resolution/' .bazelrc\n    BAZEL_BUILD_FLAGS+=(--compiler=mingw-gcc)\n    BAZEL_BUILD_FLAGS+=(--copt=-D_USE_MATH_DEFINES)\n    BAZEL_BUILD_FLAGS+=(--copt=-DPTHREADPOOL_USE_PTHREADS=1)\n    BAZEL_BUILD_FLAGS+=(--copt=-DWIN32_LEAN_AND_MEAN)\n    BAZEL_BUILD_FLAGS+=(--copt=-DNOGDI)\n    if [[ \"${target}\" == x86_64* ]]; then\n        BAZEL_BUILD_FLAGS+=(--platforms=@//:win_x86_64)\n        BAZEL_BUILD_FLAGS+=(--cpu=${BAZEL_CPU})\n        echo \"register_toolchains(\\\"//:cc_toolchain_for_ygg_win_x86\\\")\" >> WORKSPACE\n    elif [[ \"${target}\" == aarch64-* ]]; then\n        BAZEL_BUILD_FLAGS+=(--platforms=@//:win_arm64)\n        BAZEL_BUILD_FLAGS+=(--cpu=${BAZEL_CPU})\n        echo \"register_toolchains(\\\"//:cc_toolchain_for_ygg_win_arm64\\\")\" >> WORKSPACE\n    fi\nfi\n\nif [[ \"${target}\" == *-linux-* ]]; then\n    sed -i \"s/getopts \\\"/getopts \\\"p/g\" /sbin/ldconfig\n    mkdir -p .local/bin\n    echo \"#!/bin/sh\" > .local/bin/ldconfig\n    echo \"\" >> .local/bin/ldconfig\n    chmod +x .local/bin/ldconfig\n    export PATH=\"`pwd`/.local/bin:$PATH\"\n    BAZEL_BUILD_FLAGS+=(--copt=-Wno-error=cpp)\n\n    if [[ \"${target}\" == x86_64-* ]]; then\n        BAZEL_BUILD_FLAGS+=(--platforms=@//:linux_x86_64)\n        echo \"register_toolchains(\\\"//:cc_toolchain_for_ygg_x86\\\")\" >> WORKSPACE\n    elif [[ \"${target}\" == aarch64-* ]]; then\n        BAZEL_BUILD_FLAGS+=(--platforms=@//:linux_aarch64)\n        BAZEL_BUILD_FLAGS+=(--cpu=${BAZEL_CPU})\n        BAZEL_BUILD_FLAGS+=(--@xla//xla/tsl/framework/contraction:disable_onednn_contraction_kernel=True)\n        echo \"register_toolchains(\\\"//:cc_toolchain_for_ygg_aarch64\\\")\" >> WORKSPACE\n    fi\nfi\n\nif [[ \"${target}\" == aarch64-* ]]; then\n    BAZEL_BUILD_FLAGS+=(--copt=-D__ARM_FEATURE_AES=1)\n    BAZEL_BUILD_FLAGS+=(--copt=-D__ARM_NEON=1)\n    BAZEL_BUILD_FLAGS+=(--copt=-D__ARM_FEATURE_SHA2=1)\n    BAZEL_BUILD_FLAGS+=(--copt=-DDNNL_ARCH_GENERIC=1)\n    BAZEL_BUILD_FLAGS+=(--define=@xla//build_with_mkl_aarch64=true)\nfi\n\nif [[ \"${bb_full_target}\" == *gpu+cuda* ]]; then\n    BAZEL_BUILD_FLAGS+=(--repo_env=HERMETIC_CUDA_VERSION=\"${HERMETIC_CUDA_VERSION}\")\n    if [[ \"${HERMETIC_CUDA_VERSION}\" == *13.* ]]; then\n    \tBAZEL_BUILD_FLAGS+=(--config=cuda13)\n    else\n    \tBAZEL_BUILD_FLAGS+=(--config=cuda12)\n    fi\n\n    if [[ \"${target}\" != x86_64-linux-gnu ]]; then\n        # This is the standard `LD_LIBRARY_PATH` we have in our environment + `/usr/lib/csl-glibc-x86_64` to be able to run host `nvcc`/`ptxas`/`fatbinary` during compilation.