julia_compat = "1.6"
lazy_artifacts = false
name = "RocksDB"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd rocksdb\n\n# Apply patch for aarch\nif [[ \"${target}\" == aarch* ]]; then\n    atomic_patch -p1 ${WORKSPACE}/srcdir/patches/arm64.patch\nfi\n\nmkdir build && cd build\n\n# Resolve: error: aligned allocation function of type 'void *(std::size_t, std::align_val_t)' is only available on macOS 10.13 or newer\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    echo \"Installing newer MacOS 10.15 SDK\"\n    export MACOSX_DEPLOYMENT_TARGET=10.15\n    # ...and install a newer SDK which supports `std::filesystem`\n    pushd $WORKSPACE/srcdir/MacOSX10.*.sdk\n    rm -rf /opt/${target}/${target}/sys-root/System\n    cp -ra usr/* \"/opt/${target}/${target}/sys-root/usr/.\"\n    cp -ra System \"/opt/${target}/${target}/sys-root/.\"\n    popd\nfi\n\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DWITH_GFLAGS=0 \\\n    -DROCKSDB_BUILD_SHARED=1 \\\n    -DPORTABLE=1 \\\n    -DWITH_TOOLS=0 \\\n    -DWITH_TESTS=0 \\\n    -DWITH_BENCHMARK_TOOLS=0 \\\n    -DCMAKE_BUILD_TYPE=Release ..\n\ncmake --build . --parallel ${nproc}\ncmake --install .\n\ninstall_license ../LICENSE.apache ../LICENSE.leveldb\n"""
version = "v8.9.1"

