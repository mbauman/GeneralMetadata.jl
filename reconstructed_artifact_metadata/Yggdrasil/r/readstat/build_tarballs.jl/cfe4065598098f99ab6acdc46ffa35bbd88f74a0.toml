dependencies = ["Libiconv_jll", "Zlib_jll"]
name = "ReadStat"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """# Add `gettext` for `autogen.sh`\napk add gettext-dev\n\n# GCC builds complain about string truncation, but we don't care\nif [[ ${target} != *apple* ]] && [[ ${target} != *freebsd* ]]; then\n    export CFLAGS=\"${CFLAGS} -Wno-stringop-truncation\"\nfi\n\n# Windows doesn't search ${prefix}/include?\nexport CPPFLAGS=\"${CPPFLAGS} -I${prefix}/include\"\n\ncd $WORKSPACE/srcdir/ReadStat/\n./autogen.sh\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\n"""
version = "v1.1.1"

[[products]]
binnames = ["readstat"]
type = "exe"
variable_name = "readstat"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libreadstat"]
type = "lib"
variable_name = "libreadstat"

[[sources]]
"https://github.com/WizardMac/ReadStat.git" = "51f743d0d31a761d1739865f56e0978178e7a6a8"
