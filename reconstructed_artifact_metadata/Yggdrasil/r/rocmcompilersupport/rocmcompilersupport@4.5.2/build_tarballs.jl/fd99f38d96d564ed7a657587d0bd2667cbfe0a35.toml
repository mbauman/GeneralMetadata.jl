name = "ROCmCompilerSupport"
platforms = ["x86_64-linux-gnu-cxx11", "x86_64-linux-musl-cxx11"]
script = """cd ${WORKSPACE}/srcdir/ROCm-CompilerSupport*/lib/comgr\n\nmkdir build && cd build\n\nCC=${WORKSPACE}/srcdir/rocm-clang \\\nCXX=${WORKSPACE}/srcdir/rocm-clang++ \\\ncmake -DCMAKE_PREFIX_PATH=${prefix} \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DLLVM_DIR=${prefix}/llvm/lib/cmake/llvm \\\n      -DLLD_DIR=${prefix}/llvm/lib/cmake/lld \\\n      -DClang_DIR=${prefix}/llvm/lib/cmake/clang \\\n      -DROCM_DIR=${prefix} \\\n      -DBUILD_TESTING:BOOL=OFF \\\n      ..\n\nmake -j${nproc}\nmake install\n\ninstall_license ${WORKSPACE}/srcdir/ROCm-CompilerSupport*/LICENSE.txt\n"""
version = "v4.5.2"

