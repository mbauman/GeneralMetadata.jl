dependencies = ["Ncurses_jll"]
name = "Readline"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/readline-*/\n\nexport CPPFLAGS=\"-I${prefix}/include\"\nif [[ \"${target}\" == *-mingw* ]]; then\n    # Only on Windows the library name embeds the ABI version\n    export NCURSES_ABI_VER=6\n    export LDFLAGS=\"-L${libdir}\"\nfi\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --with-curses\nmake -j${nproc} SHLIB_LIBS=\"-lncurses${NCURSES_ABI_VER}\"\nmake install\n"""
version = "v8.0.0"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libhistory", "libhistory8"]
type = "lib"
variable_name = "libhistory"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libreadline", "libreadline8"]
type = "lib"
variable_name = "libreadline"

[[sources]]
"https://ftp.gnu.org/gnu/readline/readline-8.0.tar.gz" = "e339f51971478d369f8a053a330a190781acb9864cf4c541060f12078948e461"
