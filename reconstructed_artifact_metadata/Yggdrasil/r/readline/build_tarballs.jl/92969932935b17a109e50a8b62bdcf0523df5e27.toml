init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Readline"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/readline-*/\n\natomic_patch -p0 ${WORKSPACE}/srcdir/readline81-001\n# Patch from https://aur.archlinux.org/cgit/aur.git/tree/fix_signal.diff?h=mingw-w64-readline\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/mingw-fix_signal.patch\n\nexport CPPFLAGS=\"-I${includedir}\"\nif [[ \"${target}\" == *-mingw* ]]; then\n    # Only on Windows the library name embeds the ABI version\n    export NCURSES_ABI_VER=6\nfi\nif [[ \"${target}\" == *-mingw* ]] || [[ \"${target}\" == *-freebsd* ]]; then\n    export LDFLAGS=\"-L${libdir}\"\nfi\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --with-curses\nmake -j${nproc} SHLIB_LIBS=\"-lncurses${NCURSES_ABI_VER}\"\nmake install\ninstall_license COPYING\n"""
version = "v8.1.1"

