init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "ROCmDeviceLibs"
platforms = ["x86_64-linux-gnu", "x86_64-linux-musl"]
script = """cd ${WORKSPACE}/srcdir/ROCm-Device-Libs*/\nmkdir build && cd build\n\n# we set CMAKE_TOOLCHAIN_FILE because it builds a host executable for use in the build process\n# we don't ship any executable code, so this is ok\ncmake -DCMAKE_PREFIX_PATH=${prefix} \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DCMAKE_TOOLCHAIN_FILE=${CMAKE_HOST_TOOLCHAIN} \\\n      ..\nmake -j${nproc}\nmake install\n"""
version = "v4.0.0"

[[dependencies]]
compat = ""
name = "Zlib_jll"
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0

[[products]]
paths = ["amdgcn/bitcode/"]
type = "file"
variable_name = "bitcode_path"

