augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "RDKit"
platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd ${WORKSPACE}/srcdir/rdkit\n\n# Windows build fails to link a test, despite the fact we don't want tests.\natomic_patch -p1 ../patches/do-not-build-cffi-test.patch\n\nFLAGS=()\nif [[ \"${target}\" == *-mingw* ]]; then\n    FLAGS+=(-DRDK_BUILD_THREADSAFE_SSS=OFF)\nfi\n\nmkdir build\ncd build\ncmake \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DRDK_INSTALL_INTREE=OFF \\\n    -DRDK_BUILD_INCHI_SUPPORT=ON \\\n    -DRDK_BUILD_PYTHON_WRAPPERS=OFF \\\n    -DRDK_BUILD_CFFI_LIB=ON \\\n    -DRDK_BUILD_FREETYPE_SUPPORT=ON \\\n    -DRDK_BUILD_CPP_TESTS=OFF \\\n    -DRDK_BUILD_SLN_SUPPORT=OFF \\\n    -DRDK_TEST_MULTITHREADED=OFF \\\n    \"${FLAGS[@]}\" \\\n    ..\nmake -j${nproc}\nmake install\n"""
version = "v2022.9.5"

