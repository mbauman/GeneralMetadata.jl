augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "GnuPG"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/gnupg-*\n# `time_t` is used without including <time.h>\natomic_patch -p1 ../patches/time_t.patch\n# Use Windows LDAP\nFLAGS=(LDAPLIBS=\"-lwldap32\")\nif [[ \"${target}\" == *86*-linux-gnu ]]; then\n    # We have an old glibc which doesn't have `IN_EXCL_UNLINK`\n    FLAGS+=(ac_cv_func_inotify_init=no)\n    # Add -lrt dependency to fix the error\n    #     undefined reference to `clock_gettime'\n    atomic_patch -p1 ../patches/intel-linux-gnu-add-rt-lib.patch\nfi\n./configure --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    \"${FLAGS[@]}\"\nmake -j${nproc}\nmake install\n"""
version = "v2.5.21"

