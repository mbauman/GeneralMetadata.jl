augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Gettext"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/gettext-*\n\nexport CFLAGS=\"-O2\"\nexport CPPFLAGS=\"-I${includedir}\"\nexport LDFLAGS=\"-L${libdir}\"\n\n# Reported as <https://savannah.gnu.org/bugs/?67987>\natomic_patch -p1 ../patches/progreloc.patch\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    # Do not export multi-byte string functions.\n    # These functions are defined in a system library, and if we not re-export them,\n    # there would be duplicate definitions.\n    export LDFLAGS=\"-Wl,--exclude-symbols,mbrtowc:mbrlen:mbsrtowcs:wcsrtombs:mbtowc:wctomb\"\nfi\n\n./configure --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --disable-static \\\n    --enable-relocatable \\\n    --with-libiconv-prefix=${prefix} \\\n    am_cv_lib_iconv=yes \\\n    am_cv_func_iconv=yes\nmake -j${nproc}\nmake install\n"""
version = "v1.0.0"

