augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "GtkSourceView"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/gtksourceview-*/\n\n# We need to run native `xmllint` and `glib-compile-resources`\napk add libxml2-utils glib-dev gtk-update-icon-cache\n\n# Don't build broken tests\natomic_patch -p1 ../patches/meson_build_no_tests.patch\n\n# host version needs to be used\nrm -f /workspace/destdir/bin/gtk4-update-icon-cache\n\nmkdir build && cd build\n\nMESON_FLAGS=(-Dintrospection=disabled -Dvapi=false)\n\n# buildtype=plain disables stack-protector-strong, needed for this platform\nif [[ \"${target}\" == i686-linux-musl ]]; then\n    MESON_FLAGS+=(--buildtype=plain)\nfi\n\nmeson .. \\\n    \"${MESON_FLAGS[@]}\" \\\n    --cross-file=\"${MESON_TARGET_TOOLCHAIN}\"\nninja -j${nproc}\nninja install\n"""
version = "v5.10.0"

