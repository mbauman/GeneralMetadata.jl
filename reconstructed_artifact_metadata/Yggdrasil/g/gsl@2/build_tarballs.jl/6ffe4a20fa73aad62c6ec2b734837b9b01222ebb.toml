dependencies = []
name = "GSL"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/gsl-*/\nupdate_configure_scripts\n\n# We need to massage configure script to convince it to build the shared library\n# for PowerPC.\nif [[ \"${target}\" == powerpc64le-* ]]; then\n    autoreconf -vi\nfi\n\n./configure --prefix=$prefix --host=${target}\nmake -j${nproc}\nmake install\n"""
version = "v2.6.0"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libgsl"]
type = "lib"
variable_name = "libgsl"

[[sources]]
"http://ftp.gnu.org/gnu/gsl/gsl-2.6.tar.gz" = "b782339fc7a38fe17689cb39966c4d821236c28018b6593ddb6fd59ee40786a8"
