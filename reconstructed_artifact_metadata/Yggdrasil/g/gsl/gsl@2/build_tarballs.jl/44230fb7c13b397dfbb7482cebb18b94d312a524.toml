julia_compat = "1.6"
lazy_artifacts = false
name = "GSL"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/gsl-*/\nif [[ \"${target}\" == aarch64-apple-darwin* ]]; then\n    # aclocal.m4 has some lines where it expects `MACOSX_DEPLOYMENT_TARGET` to be up to\n    # version 10.  Let's pretend to be 10.16, as many tools do to make old build systems\n    # happy.\n    export MACOSX_DEPLOYMENT_TARGET=\"10.16\"\nfi\n\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/0001-remove-unknown-ld-option.patch\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --disable-static\nmake -j${nproc}\nmake install\n"""
version = "v2.8.0"

