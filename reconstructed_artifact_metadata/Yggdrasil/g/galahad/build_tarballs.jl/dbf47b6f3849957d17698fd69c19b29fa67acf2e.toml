augment_platform_block = ""
init_block = ""
julia_compat = "1.9"
lazy_artifacts = false
name = "GALAHAD"
platforms = ["x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran5", "powerpc64le-linux-gnu-libgfortran5", "riscv64-linux-gnu-libgfortran5", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran5", "aarch64-unknown-freebsd-libgfortran5", "x86_64-w64-mingw32-libgfortran5"]
script = """# Update Ninja\ncp ${host_prefix}/bin/ninja /usr/bin/ninja\n\ncd ${WORKSPACE}/srcdir/GALAHAD\n\nif [[ \"${target}\" == *mingw* ]]; then\n  LBT=\"blastrampoline-5\"\n  HWLOC=\"hwloc-15\"\nelse\n  LBT=\"blastrampoline\"\n  HWLOC=\"hwloc\"\nfi\n\nQUADRUPLE=\"true\"\nif [[ \"${target}\" == *arm* ]] || [[ \"${target}\" == *aarch64-linux* ]] || [[ \"${target}\" == *aarch64-unknown-freebsd* ]] || [[ \"${target}\" == *powerpc64le-linux-gnu* ]] || [[ \"${target}\" == *riscv64* ]]; then\n    QUADRUPLE=\"false\"\nfi\n\nmeson setup builddir_int32 --cross-file=${MESON_TARGET_TOOLCHAIN%.*}_gcc.meson \\\n                           --prefix=$prefix \\\n                           -Dint64=false \\\n                           -Dlibhwloc=$HWLOC \\\n                           -Dlibblas=$LBT \\\n                           -Dliblapack=$LBT \\\n                           -Dlibsmumps=smumps \\\n                           -Dlibdmumps=dmumps \\\n                           -Dlibcutest_single=cutest_single \\\n                           -Dlibcutest_double=cutest_double \\\n                           -Dlibcutest_quadruple= \\\n                           -Dlibcutest_modules=$prefix/modules \\\n                           -Dsingle=true \\\n                           -Ddouble=true \\\n                           -Dquadruple=false \\\n                           -Dbinaries=true \\\n                           -Dtests=false \\\n                           -Dlibhsl=hsl_subset \\\n                           -Dlibhsl_modules=$prefix/modules\n\nmeson compile -C builddir_int32\n\nmeson setup builddir_int64 --cross-file=${MESON_TARGET_TOOLCHAIN%.*}_gcc.meson \\\n                           --prefix=$prefix \\\n                           -Dint64=true \\\n                           -Dlibhwloc=$HWLOC \\\n                           -Dlibblas=$LBT \\\n                           -Dliblapack=$LBT \\\n                           -Dlibsmumps= \\\n                           -Dlibdmumps= \\\n                           -Dlibcutest_single= \\\n                           -Dlibcutest_double= \\\n                           -Dlibcutest_quadruple= \\\n                           -Dlibcutest_modules=$prefix/modules \\\n                           -Dsingle=true \\\n                           -Ddouble=true \\\n                           -Dquadruple=false \\\n                           -Dbinaries=false \\\n                           -Dtests=false \\\n                           -Dlibhsl=hsl_subset_64 \\\n                           -Dlibhsl_modules=$prefix/modules\n\nmeson compile -C builddir_int64\n\nif [[ \"$QUADRUPLE\" == \"true\" ]]; then\n    meson setup builddir_quad_int32 --cross-file=${MESON_TARGET_TOOLCHAIN%.*}_gcc.meson \\\n                                    --prefix=$prefix \\\n                                    -Dint64=false \\\n                                    -Dlibhwloc=$HWLOC \\\n                                    -Dlibblas= \\\n                                    -Dliblapack= \\\n                                    -Dlibsmumps= \\\n                                    -Dlibdmumps= \\\n                                    -Dlibcutest_single=cutest_single \\\n                                    -Dlibcutest_double=cutest_double \\\n                                    -Dlibcutest_quadruple= \\\n                                    -Dlibcutest_modules=$prefix/modules \\\n                                    -Dsingle=false \\\n                                    -Ddouble=false \\\n                                    -Dquadruple=true \\\n                                    -Dbinaries=false \\\n                                    -Dtests=false \\\n                                    -Dlibhsl=hsl_subset \\\n                                    -Dlibhsl_modules=$prefix/modules\n\n    meson compile -C builddir_quad_int32\n\n    meson setup builddir_quad_int64 --cross-file=${MESON_TARGET_TOOLCHAIN%.*}_gcc.meson \\\n                                    --prefix=$prefix \\\n                                    -Dint64=true \\\n                                    -Dlibhwloc=$HWLOC \\\n                                    -Dlibblas= \\\n                                    -Dliblapack= \\\n                                    -Dlibsmumps= \\\n                                    -Dlibdmumps= \\\n                                    -Dlibcutest_single= \\\n                                    -Dlibcutest_double= \\\n                                    -Dlibcutest_quadruple= \\\n                                    -Dlibcutest_modules=$prefix/modules \\\n                                    -Dsingle=false \\\n                                    -Ddouble=false \\\n                                    -Dquadruple=true \\\n                                    -Dbinaries=false \\\n                                    -Dtests=false \\\n                                    -Dlibhsl=hsl_subset_64 \\\n                                    -Dlibhsl_modules=$prefix/modules\n\n    meson compile -C builddir_quad_int64\nfi\n\nmeson install -C builddir_int32\nmeson install -C builddir_int64\nif [[ \"$QUADRUPLE\" == \"true\" ]]; then\n    meson install -C builddir_quad_int32\n    meson install -C builddir_quad_int64\nfi\n"""
version = "v5.3.0"

