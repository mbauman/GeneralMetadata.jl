name = "GALAHAD"
platforms = ["i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "armv6l-linux-gnueabihf-libgfortran4", "armv6l-linux-gnueabihf-libgfortran5", "armv7l-linux-gnueabihf-libgfortran4", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran4", "powerpc64le-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran4", "aarch64-linux-musl-libgfortran5", "armv6l-linux-musleabihf-libgfortran4", "armv6l-linux-musleabihf-libgfortran5", "armv7l-linux-musleabihf-libgfortran4", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin-libgfortran4", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran4", "x86_64-unknown-freebsd-libgfortran5", "aarch64-unknown-freebsd-libgfortran4", "aarch64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran4", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran4", "x86_64-w64-mingw32-libgfortran5"]
script = """# Update Ninja\ncp ${host_prefix}/bin/ninja /usr/bin/ninja\n\ncd ${WORKSPACE}/srcdir/GALAHAD\n\nif [[ \"${target}\" == *mingw* ]]; then\n  LBT=\"blastrampoline-5\"\n  HWLOC=\"hwloc-15\"\nelse\n  LBT=\"blastrampoline\"\n  HWLOC=\"hwloc\"\nfi\n\nmeson setup builddir_int32 --cross-file=${MESON_TARGET_TOOLCHAIN%.*}_gcc.meson \\\n                           --prefix=$prefix \\\n                           -Dint64=false \\\n                           -Dlibhwloc=$HWLOC \\\n                           -Dlibblas=$LBT \\\n                           -Dliblapack=$LBT \\\n                           -Dlibsmumps=smumps \\\n                           -Dlibdmumps=dmumps \\\n                           -Dlibhsl=hsl_subset \\\n                           -Dlibhsl_modules=$prefix/modules\n\nmeson compile -C builddir_int32\nmeson install -C builddir_int32\n\nmeson setup builddir_int64 --cross-file=${MESON_TARGET_TOOLCHAIN%.*}_gcc.meson \\\n                           --prefix=$prefix \\\n                           -Dint64=true \\\n                           -Dlibhwloc=$HWLOC \\\n                           -Dlibblas=$LBT \\\n                           -Dliblapack=$LBT \\\n                           -Dlibsmumps= \\\n                           -Dlibdmumps= \\\n                           -Dlibhsl=hsl_subset_64 \\\n                           -Dlibhsl_modules=$prefix/modules\n\nmeson compile -C builddir_int64\nmeson install -C builddir_int64\n"""
version = "v5.0.2"

