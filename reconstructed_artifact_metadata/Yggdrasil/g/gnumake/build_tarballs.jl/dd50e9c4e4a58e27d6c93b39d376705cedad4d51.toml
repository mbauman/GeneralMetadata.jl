augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "GNUMake"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/make*\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/make-4.3_undef-HAVE_STRUCT_DIRENT_D_TYPE.patch\nif [[ \"${target}\" == *-mingw* ]]; then\n    cp $WORKSPACE/srcdir/Makefile GNUmakefile\n    mkdir -p ${prefix}/lib\n    mkdir -p ${bindir}\n    cp src/config.h.W32 src/config.h\n    cp lib/glob.in.h lib/glob.h\n    cp lib/fnmatch.in.h lib/fnmatch.h\n    \n    make -j${nproc}\nelse\n    ./configure --build=${MACHTYPE} --prefix=$prefix --host=${target}\n    make -j${nproc}\n    make install\nfi\ninstall_license COPYING\n"""
version = "v4.4.1"

[[products]]
binnames = ["make"]
type = "exe"
variable_name = "make"

