dependencies = ["GEOS_jll", "PROJ_jll", "Zlib_jll", "SQLite_jll", "LibCURL_jll"]
name = "GDAL"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "arm-linux-gnueabihf-cxx03", "arm-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "arm-linux-musleabihf-cxx03", "arm-linux-musleabihf-cxx11", "x86_64-apple-darwin14-cxx03", "x86_64-apple-darwin14-cxx11", "x86_64-unknown-freebsd11.1-cxx03", "x86_64-unknown-freebsd11.1-cxx11", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/gdal-*/\n\nif [[ ${target} == *mingw* ]]; then\n    export LDFLAGS=\"-L${libdir}\"\n    # Apply patch to customise PROJ library\n    atomic_patch -p1 \"$WORKSPACE/srcdir/patches/configure_ac_proj_libs.patch\"\n    autoreconf -vi\n    export PROJ_LIBS=\"proj_6_3\"\nelif [[ \"${target}\" == powerpc64le-* ]]; then\n    # Need to remember to link against libpthread and libdl\n    export LDFLAGS=\"-lpthread -ldl\"\nfi\n\n# Clear out `.la` files since they're often wrong and screw us up\nrm -f ${prefix}/lib/*.la\n\n./configure --prefix=$prefix --host=$target \\\n    --with-geos=${bindir}/geos-config \\\n    --with-proj=$prefix \\\n    --with-libz=$prefix \\\n    --with-sqlite3=$prefix \\\n    --with-curl=${bindir}/curl-config \\\n    --with-python=no \\\n    --enable-shared \\\n    --disable-static\n\nmake -j${nproc}\nmake install\n"""
sources = [{"https://github.com/OSGeo/gdal/releases/download/v3.0.3/gdal-3.0.3.tar.gz" = "fe9bbe1cd4f74a4917dec9585a91d9018d3a3b61e379aa9a1b709e278dde11d6"}, "./bundled"]
version = "v3.0.3"

