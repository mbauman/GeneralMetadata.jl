script = """macos_sdk_version=10.15\nmacosx_deployment_target=10.15\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    # Extract SDK\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    tar \\\n        --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=${WORKSPACE}/srcdir \\\n        --warning=no-unknown-keyword\n    old_sdkroot=${SDKROOT}\n    new_sdkroot=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk\n    # Point to C++ header files (these are not shipped with the SDK)\n    ln -s ${old_sdkroot}/usr/include/c++ ${new_sdkroot}/usr/include/c++\n    # Fix toolchain files\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" ${MESON_TARGET_TOOLCHAIN} ${CMAKE_TARGET_TOOLCHAIN}\n    # Fix compiler wrappers\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" $(find /opt/bin/${target}* -type f -print)\n    SDKROOT=${new_sdkroot}\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd $WORKSPACE/srcdir/gdal\n\natomic_patch -p1 ../patches/bsd-environ-undefined-fix.patch\n# Some of our Linux build environments are too old to define `O_TMPFILE`; define it manually\natomic_patch -p1 ../patches/tmpfile.patch\n\nif [[ \"${target}\" == *-freebsd* ]]; then\n    # Our FreeBSD libc has `environ` as undefined symbol, so the linker will\n    # complain if this symbol is used in the built library, even if this won't\n    # be a problem at runtime. The flag `-undefined` allows having undefined symbols.\n    # The flag `-lexecinfo` fixes \"undefined reference to `backtrace'\".\n    export LDFLAGS=\"-lexecinfo -undefined\"\nfi\n\nCMAKE_FLAGS=(\n    -B build\n    -DCMAKE_INSTALL_PREFIX=${prefix}\n    -DCMAKE_BUILD_TYPE=Release\n    -DCMAKE_FIND_ROOT_PATH=${prefix}\n    -DCMAKE_PREFIX_PATH=${prefix}\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\n    -DBUILD_CSHARP_BINDINGS=OFF\n    -DBUILD_JAVA_BINDINGS=OFF\n    -DBUILD_PYTHON_BINDINGS=OFF\n    -DGDAL_ENABLE_DRIVER_HDF4=ON\n    -DGDAL_USE_BLOSC=ON\n    -DGDAL_USE_CURL=ON\n    -DGDAL_USE_EXPAT=ON\n    -DGDAL_USE_GEOS=ON\n    -DGDAL_USE_GEOTIFF=ON\n    -DGDAL_USE_HDF4=ON\n    -DGDAL_USE_HDF5=ON\n    -DGDAL_USE_LERC=ON\n    -DGDAL_USE_LIBLZMA=ON\n    -DGDAL_USE_LIBXML2=ON\n    -DGDAL_USE_LZ4=ON\n    -DGDAL_USE_NETCDF=ON\n    -DGDAL_USE_OPENJPEG=ON\n    -DGDAL_USE_PNG=ON\n    -DGDAL_USE_POSTGRESQL=ON\n    -DGDAL_USE_QHULL=ON\n    -DGDAL_USE_SQLITE3=ON\n    -DGDAL_USE_TIFF=ON\n    -DGDAL_USE_WEBP=ON\n    -DGDAL_USE_ZLIB=ON\n    -DGDAL_USE_ZSTD=ON\n    -DGIF_LIBRARY=${libdir}/libgif.${dlext}\n    -DPCRE2-8_LIBRARY=${libdir}/libpcre2-8.${dlext}\n    -DPCRE2_INCLUDE_DIR=${includedir}\n    -DPostgreSQL_INCLUDE_DIR=${includedir}\n    -DPostgreSQL_LIBRARY=${libdir}/libpq.${dlext}\n)\n\n# Use Arrow only if available\nif [ -e \"${libdir}/libarrow.${dlext}\" ]; then\n    CMAKE_FLAGS+=(\n        -DGDAL_USE_ARROW=ON\n        -DGDAL_USE_PARQUET=ON\n    )\nfi\n\n# Use grok only if available\nif [ -e \"${libdir}/libgrokj2k.${dlext}\" ]; then\n    CMAKE_FLAGS+=(-DGDAL_USE_GROK=ON)\nfi\n\n# For run-time CPU detection on x86_64-apple\n# (avoid `ld64.lld: error: undefined symbol: __cpu_model`)\nif [[ \"${target}\" == x86_64-apple-* ]]; then\n    # Disable AVX2 unconditionally\n    sed -i -e 's/__builtin_cpu_supports(\"[a-z0-9]*\")/false/' gcore/gdaldataset.cpp port/cpl_cpu_features.cpp\nfi\n\n# Disable gif on Windows\nif [[ \"${target}\" == *mingw* ]]; then\n    CMAKE_FLAGS+=(-DGDAL_USE_GIF=OFF)   # Would break GDAL on Windows as of Giflib_jll v5.2.2 (#8781)\nfi\n\ncmake ${CMAKE_FLAGS[@]}\ncmake --build build --parallel ${nproc}\ncmake --install build\n\ninstall_license LICENSE.TXT\n"""
