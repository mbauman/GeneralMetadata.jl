init_block = ""
julia_compat = "~1.0, ~1.1, ~1.2, ~1.3, ~1.4, ~1.5"
lazy_artifacts = false
name = "GDAL"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/gdal-*/\n\nif [[ ${target} == *mingw* ]]; then\n    export LDFLAGS=\"-L${libdir}\"\n    # Apply patch to customise PROJ library\n    atomic_patch -p1 \"$WORKSPACE/srcdir/patches/configure_ac_proj_libs.patch\"\n    autoreconf -vi\n    export PROJ_LIBS=\"proj_7_2\"\nelif [[ \"${target}\" == *-linux-* ]]; then\n    # Hint to find libstdc++, required to link against C++ libs when using C compiler\n    if [[ \"${nbits}\" == 32 ]]; then\n        export CFLAGS=\"-Wl,-rpath-link,/opt/${target}/${target}/lib\"\n    else\n        export CFLAGS=\"-Wl,-rpath-link,/opt/${target}/${target}/lib64\"\n    fi\n    # Use same flags also for GEOS\n    atomic_patch -p1 \"$WORKSPACE/srcdir/patches/geos-m4-extra-cflags.patch\"\n    export EXTRA_GEOS_CFLAGS=\"${CFLAGS}\"\n    if [[ \"${target}\" == powerpc64le-* ]]; then\n        atomic_patch -p1 \"$WORKSPACE/srcdir/patches/sqlite3-m4-extra-libs.patch\"\n        export EXTRA_GEOS_LIBS=\"${EXTRA_GEOS_LIBS} -lm\"\n        export EXTRA_SQLITE3_LIBS=\"-lm\"\n        # libpthread and libldl are needed for libgdal, so let's always use them\n        export LDFLAGS=\"$LDFLAGS -lpthread -ldl\"\n    fi\n    autoreconf -vi\nfi\n\n# Clear out `.la` files since they're often wrong and screw us up\nrm -f ${prefix}/lib/*.la\n\n./configure --help\n./configure --prefix=$prefix --host=$target \\\n    --with-geos=${bindir}/geos-config \\\n    --with-proj=$prefix \\\n    --with-tiff=$prefix \\\n    --with-geotiff=$prefix \\\n    --with-libz=$prefix \\\n    --with-expat=$prefix \\\n    --with-zstd=$prefix \\\n    --with-sqlite3=$prefix \\\n    --with-curl=${bindir}/curl-config \\\n    --with-openjpeg \\\n    --with-python=no \\\n    --enable-shared \\\n    --disable-static\n# Make sure that some important libraries are found\ngrep \"HAVE_GEOS='yes'\" config.log\ngrep \"HAVE_SQLITE='yes'\" config.log\ngrep \"CURL_SETTING='yes'\" config.log\ngrep \"ZSTD_SETTING='yes'\" config.log\ngrep \"HAVE_EXPAT='yes'\" config.log\n\nmake -j${nproc}\nmake install\n"""
version = "v300.201.100"

