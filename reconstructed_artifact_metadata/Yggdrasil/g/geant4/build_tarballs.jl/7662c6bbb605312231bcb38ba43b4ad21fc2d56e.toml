augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Geant4"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin"]
script = """cd $WORKSPACE/srcdir/geant4-*/\n\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    # Install a newer SDK which supports `std::filesystem`\n    pushd $WORKSPACE/srcdir/MacOSX10.*.sdk\n    rm -rf /opt/${target}/${target}/sys-root/System\n    cp -ra usr/* \"/opt/${target}/${target}/sys-root/usr/.\"\n    cp -ra System \"/opt/${target}/${target}/sys-root/.\"\n    export MACOSX_DEPLOYMENT_TARGET=10.15\n    popd\nfi\n\nmkdir build && cd build\nFLAGS=()\nif [[ \"${target}\" != *-apple-* ]]; then\n    FLAGS=(-DGEANT4_USE_OPENGL_X11=ON)\nfi\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DCMAKE_CXX_STANDARD=17 \\\n      -DGEANT4_INSTALL_DATA=ON \\\n      -DGEANT4_USE_GDML=ON \\\n      -DGEANT4_BUILD_TLS_MODEL=global-dynamic \\\n      \"${FLAGS[@]}\" \\\n    ..\nmake -j${nproc}\nmake install\n\ninstall_license ../LICENSE\n"""
version = "v11.2.0"

