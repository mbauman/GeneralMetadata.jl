julia_compat = "1.6"
lazy_artifacts = false
name = "Gnuplot"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/gnuplot-*\n\nif [[ \"${target}\" == \"${MACHTYPE}\" ]]; then\n    # Delete system libexpat to avoid confusion\n    rm /usr/lib/libexpat.so*\nelif [[ \"${target}\" == *-mingw* ]]; then\n    # Apply patch from https://github.com/msys2/MINGW-packages/blob/5dcff9fd637714972b113c6d3fbf6db17e9b707a/mingw-w64-gnuplot/01-gnuplot.patch\n    atomic_patch -p1 ../patches/01-gnuplot.patch\n    autoreconf -fiv\nfi\n\nexport LIBS='-liconv -lffi'\nif [[ ${target} == aarch64-apple-* ]]; then  # FIXES the undefined symbol: __divdc3 error\n    export LDFLAGS=\"-L${libdir}/darwin -lclang_rt.osx\"\nfi\n\nunset args\nargs+=(--disable-wxwidgets)\n\n# FIXME: no Qt Tools artifacts available for these platforms (missing either uic or lrelease)\ncase \"$target\" in\n    *-musl*|*-freebsd*|riscv64-linux-gnu*|aarch64-apple-darwin*|arm-linux-gnueabihf*)\n        args+=(--with-qt=no);;\nesac\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} ${args[@]}\n\nmake -C src -j${nproc}\nmake -C src install\n# add a fake `gnuplot_fake` executable, in order to determine `GNUPLOT_DRIVER_DIR` in `Gaston.jl`\nmkdir -p $prefix/libexec/gnuplot/6.0\ntouch $prefix/libexec/gnuplot/6.0/gnuplot_fake$exeext\nchmod +x $prefix/libexec/gnuplot/6.0/gnuplot_fake$exeext\n"""
version = "v6.0.3001"

