name = "gdk_pixbuf"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/gdk-pixbuf-*/\nmkdir build && cd build\n\nFLAGS=()\nif [[ \"${target}\" == x86_64-linux-gnu ]]; then\n    FLAGS+=(-Dintrospection=enabled)\nfi\n\nmeson .. \\\n    -Dman=false \\\n    -Dinstalled_tests=false \\\n    -Dgio_sniffing=false \\\n    \"${FLAGS[@]}\" \\\n    --cross-file=\"${MESON_TARGET_TOOLCHAIN}\"\nninja -j${nproc}\nninja install\n\n# Cleanup `loaders.cache` file, we're going to generate a new one on the user's machine\nfind ${prefix}/lib -name loaders.cache -delete\n"""
version = "v2.42.10"

