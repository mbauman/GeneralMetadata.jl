init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "gdk_pixbuf"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/gdk-pixbuf-*/\nmkdir build && cd build\n\nFLAGS=()\nif [[ \"${target}\" == *-apple-* ]] || [[ \"${target}\" == *-mingw* ]]; then\n    FLAGS+=(-Dx11=false)\nfi\n\nmeson .. \\\n    -Dgir=false \\\n    -Dman=false \\\n    -Dinstalled_tests=false \\\n    -Dgio_sniffing=false \\\n    \"${FLAGS[@]}\" \\\n    --cross-file=\"${MESON_TARGET_TOOLCHAIN}\"\nninja -j${nproc}\nninja install\n\n# Cleanup `loaders.cache` file, we're going to generate a new one on the user's machine\nfind ${prefix}/lib -name loaders.cache -delete\n"""
version = "v2.42.6"

