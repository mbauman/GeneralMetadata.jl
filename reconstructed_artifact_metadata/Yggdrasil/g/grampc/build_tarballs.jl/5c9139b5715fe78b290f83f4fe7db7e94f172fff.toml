init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "GRAMPC"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """    cd $WORKSPACE/srcdir/grampc_julia_wrapper\n\n    mkdir -p build\n    cd build\n\n    cmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n          -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n          -DCMAKE_C_FLAGS=\"-I${prefix}/include\" \\\n          -DCMAKE_BUILD_TYPE=Release \\\n          ../\n\n    make -j${nproc}\n    make install\n\n    # Copy the library's license file\n    install_license $WORKSPACE/srcdir/grampc_julia_wrapper/src_GRAMPC/LICENSE.txt \n"""
version = "v2.2.0"

