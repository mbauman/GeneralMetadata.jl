dependencies = []
lazy_artifacts = false
name = "GoogleCodeSearch"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\ninstall_license codesearch/LICENSE\nmkdir gsc\ncd gsc\ngo mod init github.com/m\ngo get -d -v github.com/google/codesearch@v1.2.0\nmkdir -p \"${bindir}\"\ngo build -o \"${bindir}/csearch${exeext}\" github.com/google/codesearch/cmd/csearch\ngo build -o \"${bindir}/cindex${exeext}\" github.com/google/codesearch/cmd/cindex\n"""
version = "v1.2.0"

[[products]]
binnames = ["csearch"]
type = "exe"
variable_name = "csearch"
[[products]]
binnames = ["cindex"]
type = "exe"
variable_name = "cindex"

