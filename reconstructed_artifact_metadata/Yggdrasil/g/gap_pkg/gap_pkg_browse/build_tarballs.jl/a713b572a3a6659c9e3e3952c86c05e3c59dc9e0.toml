init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "GAP_pkg_browse"
platforms = ["x86_64-linux-gnu", "aarch64-linux-gnu", "powerpc64le-linux-gnu", "x86_64-linux-musl", "aarch64-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-freebsd"]
script = """# HACK WORKAROUND GAP_jll deficiencies\n# TODO: tweak for mac build\nif [[ \"${target}\" == *darwin* ]]; then\n  cp gac-darwin ${prefix}/share/gap/gac\nelse\n  cp gac ${prefix}/share/gap/gac\nfi\nchmod a+x ${prefix}/share/gap/gac\ncp sysinfo.gap ${prefix}/share/gap/\n\n# ensure #including src/compiled.h or src/profile.h from GAP_jll works\nln -s . ${prefix}/include/gap/src\ncd Browse*\n\n# HACK to fool the Browse build system\nln -s sysinfo.gap ${prefix}/share/gap/sysinfo.gap-default64\n\n./configure ${prefix}/share/gap\nmake -j${nproc} CFLAGS=\"-I$prefix/include/ncurses\"\n\n# revert the HACK\nrm -f ${prefix}/share/gap/sysinfo.gap-default64\n\n# copy the loadable module\nmkdir -p ${prefix}/lib/gap/\ncp bin/*/*.so ${prefix}/lib/gap/\n\ninstall_license /usr/share/licenses/GPL3\nrm -rf ${prefix}/include\nrm -rf ${prefix}/share/gap\n"""
version = "v100.800.1200"

[[dependencies]]
compat = "~400.1191.1"
name = "GAP_jll"
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0
[[dependencies]]
compat = "~400.1191.0"
name = "GAP_lib_jll"
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0

[[products]]
paths = ["lib/gap/ncurses.so"]
type = "file"
variable_name = "ncurses"

