script = """# HACK WORKAROUND GAP_jll deficiencies\n# TODO: tweak for mac build\nif [[ \"${target}\" == *darwin* ]]; then\n  cp gac-darwin ${prefix}/share/gap/gac\nelse\n  cp gac ${prefix}/share/gap/gac\nfi\nchmod a+x ${prefix}/share/gap/gac\ncp sysinfo.gap ${prefix}/share/gap/\n\n# ensure #including src/compiled.h or src/profile.h from GAP_jll works\nln -s . ${prefix}/include/gap/src\ncd GAP.jl/pkg/JuliaInterface\n./configure --with-gaproot=${prefix}/share/gap\nmake -j${nproc} CFLAGS=\"-I${includedir}\"\n\n# copy the loadable module\nmkdir -p ${prefix}/lib/gap\ncp bin/*/*.so ${prefix}/lib/gap/\n\n# copy the sources, too, so that we can later compare them\ncp -r src ${prefix}/\n\ninstall_license ../../LICENSE\nrm -rf ${prefix}/include\nrm -rf ${prefix}/share/gap\n"""
