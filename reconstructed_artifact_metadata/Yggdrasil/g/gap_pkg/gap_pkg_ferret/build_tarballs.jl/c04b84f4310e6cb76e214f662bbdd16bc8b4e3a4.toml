init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "GAP_pkg_ferret"
platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd"]
script = """# HACK WORKAROUND GAP_jll deficiencies\n# TODO: tweak for mac build\nif [[ \"${target}\" == *darwin* ]]; then\n  cp gac-darwin ${prefix}/share/gap/gac\nelse\n  cp gac ${prefix}/share/gap/gac\nfi\nchmod a+x ${prefix}/share/gap/gac\ncp sysinfo.gap ${prefix}/share/gap/\n\n# ensure #including src/compiled.h or src/profile.h from GAP_jll works\nln -s . ${prefix}/include/gap/src\ncd ferret*\n\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/0001-Replace-u_int32_t-uint32_t.patch\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --with-gaproot=${prefix}/share/gap\nmake -j${nproc}\n\n# copy the loadable module\nmkdir -p ${prefix}/lib/gap/\ncp bin/*/*.so ${prefix}/lib/gap/\n\ninstall_license LICENSE\nrm -rf ${prefix}/include\nrm -rf ${prefix}/share/gap\n"""
version = "v100.0.501"

[[dependencies]]
compat = "~400.1191.1"
name = "GAP_jll"
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0
[[dependencies]]
compat = "~400.1191.0"
name = "GAP_lib_jll"
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0

[[products]]
paths = ["lib/gap/ferret.so"]
type = "file"
variable_name = "ferret"

