augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "GettextRuntime"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/gettext-*\n\n# Reported as <https://savannah.gnu.org/bugs/?67987>\natomic_patch -p1 ../patches/progreloc.patch\n\ncd gettext-runtime\n\n./configure --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --disable-static \\\n    --enable-relocatable \\\n    --with-libiconv-prefix=${prefix} \\\n    --with-included-libintl \\\n    am_cv_lib_iconv=yes \\\n    am_cv_func_iconv=yes\nmake -j${nproc}\nmake install\n\n# Multiple licenses are required\ncp ../COPYING toplevel-COPYING\ncp intl/COPYING.LIB intl-COPYING.LIB\ninstall_license COPYING toplevel-COPYING intl-COPYING.LIB\n"""
version = "v1.0.0"

