name = "GDB"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """apk add texinfo\ncd $WORKSPACE/srcdir/gdb-*/\nCONFIGURE_FLAGS=(--prefix=${prefix} --build=${MACHTYPE} --host=${target})\nCONFIGURE_FLAGS+=(--with-expat)\nif [[ ${target} != *mingw* ]]; then\n    # Python_jll is not yet available for Windows\n    CONFIGURE_FLAGS+=(--with-python=${WORKSPACE}/srcdir/python-cross-configure.sh)\nfi\n./configure ${CONFIGURE_FLAGS[@]}\nmake -j${nproc} all\nmake install\n"""
version = "v12.1.0"

