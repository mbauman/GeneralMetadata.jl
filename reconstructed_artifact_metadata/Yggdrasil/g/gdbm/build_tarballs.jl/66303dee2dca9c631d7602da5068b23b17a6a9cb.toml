lazy_artifacts = false
name = "Gdbm"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\ncd gdbm-1.18.1/\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    atomic_patch -p1 ../patches/gdbm-1.15-win32.patch\nfi\n\nif [[ \"${target}\" == powerpc64le-* ]] || [[ \"${target}\" == *-mingw* ]]; then\n    # Install `autopoint` and other tools needed by `autoreconf`\n    apk add gettext-dev\n    # Rebuild the configure script to convince it to build the shared library\n    autoreconf -vi\nfi\n\nexport CPPFLAGS=\"-I${includedir}\"\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --disable-static --with-libiconv-prefix=${prefix}\nmake -j${nproc}\nmake install\n"""
version = "v1.18.1"

