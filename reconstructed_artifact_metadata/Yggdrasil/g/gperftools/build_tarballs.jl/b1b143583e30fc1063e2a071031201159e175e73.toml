lazy_artifacts = false
name = "gperftools"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "x86_64-apple-darwin14-cxx03", "x86_64-apple-darwin14-cxx11", "x86_64-unknown-freebsd11.1-cxx03", "x86_64-unknown-freebsd11.1-cxx11"]
script = """cd $WORKSPACE/srcdir/gperftools*/\n\n# Remove misleading libtool files\nrm -f ${prefix}/lib/*.la\nrm -f /opt/${target}/${target}/lib*/*.la\nrm -f /opt/${MACHTYPE}/${MACHTYPE}/lib*/*.la\n\nif [[ \"${target}\" == *-linux-* ]]; then\n    # https://github.com/gperftools/gperftools/blob/e5f77d6485bd2f6ce43862e3e57118b1bb97d30a/README\n    export CXXFLAGS=\"-fno-builtin-malloc -fno-builtin-calloc -fno-builtin-realloc -fno-builtin-free\"\nelif [[ \"${target}\" == *-apple-* ]]; then\n    # https://github.com/Homebrew/homebrew-core/blob/5e8ab5f092bd4dfe9658bab6d86150e26a326de3/Formula/gperftools.rb#L28\n    export CXXFLAGS=-D_XOPEN_SOURCE\nelif [[ \"${target}\" == *-freebsd* ]]; then\n    # Fix the error\n    #   undefined reference to `backtrace_symbols'\n    export LDFLAGS=\"-lexecinfo\"\nfi\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\n"""
version = "v2.7.0"

