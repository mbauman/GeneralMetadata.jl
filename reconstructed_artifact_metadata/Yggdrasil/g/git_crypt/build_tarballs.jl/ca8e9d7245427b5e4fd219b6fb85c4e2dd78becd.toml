dependencies = ["OpenSSL_jll"]
name = "git_crypt"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/git-crypt-*/\nmake CPPFLAGS=\"-I${prefix}/include\" LDFLAGS=\"-L${libdir} -lcrypto\"\nmake install PREFIX=$prefix\nif [ $target = \"x86_64-w64-mingw32\" ] || [ $target = \"i686-w64-mingw32\" ]; then\n    mv $bindir/git-crypt $bindir/git-crypt.exe\nfi\n"""
version = "v0.6.0"

[[products]]
binnames = ["git-crypt"]
type = "exe"
variable_name = "git_crypt"

[[sources]]
"https://github.com/AGWA/git-crypt/archive/0.6.0.tar.gz" = "777c0c7aadbbc758b69aff1339ca61697011ef7b92f1d1ee9518a8ee7702bb78"
