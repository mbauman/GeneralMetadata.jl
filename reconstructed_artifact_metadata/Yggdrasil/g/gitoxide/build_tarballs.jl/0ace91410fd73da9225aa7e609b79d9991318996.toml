name = "gitoxide"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "x86_64-unknown-freebsd", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/gitoxide*/\ncargo build --release\ninstall -Dvm 755 \"target/${rust_target}/release/ein${exeext}\" \"${bindir}/ein${exeext}\"\ninstall -Dvm 755 \"target/${rust_target}/release/gix${exeext}\" \"${bindir}/gix${exeext}\"\ninstall_license LICENSE-*\n"""
version = "v0.11.0"

