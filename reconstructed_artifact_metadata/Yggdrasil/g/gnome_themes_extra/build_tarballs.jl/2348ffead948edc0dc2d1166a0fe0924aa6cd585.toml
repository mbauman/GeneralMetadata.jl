dependencies = ["GTK3_jll", "Librsvg_jll"]
name = "Gnome_themes_extra"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/gnome-themes-extra-*/\napk add intltool\n\nFLAGS=()\nif [[ \"${target}\" == *-mingw* ]]; then\n    FLAGS+=(ac_cv_path_GTK_UPDATE_ICON_CACHE=gtk-update-icon-cache.exe)\nfi\n\n./configure --prefix=${prefix} --host=${target} \\\n    --disable-gtk2-engine \\\n    \"${FLAGS[@]}\"\nmake -j${nproc}\nmake install\n"""
version = "v3.28.0"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libadwaita"]
type = "lib"
variable_name = "libadwaita"

