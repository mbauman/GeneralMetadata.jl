name = "GLEW"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/glew-*\nEXTRA_VARS=()\nif [[ \"${target}\" == *-linux-* ]] || [[ \"${target}\" == *-freebsd* ]]; then\n    # On Linux and FreeBSD this variable by default does `-L/usr/lib`\n    EXTRA_VARS+=(LDFLAGS.EXTRA=\"\")\nelif [[ \"${target}\" == *-mingw* ]]; then\n    # On MinGW targets this is incorrectly detected as \"msys\"\n    EXTRA_VARS+=(SYSTEM=\"mingw\")\nfi\n\nmake INCLUDE=\"-Iinclude -I${includedir}\" \\\n    GLEW_DEST=\"${prefix}\" \\\n    \"${EXTRA_VARS[@]}\" \\\n    install\n"""
version = "v2.2.0"

