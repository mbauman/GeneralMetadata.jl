dependencies = []
name = "GMP"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/gmp-*\n\n# Update config.status\nupdate_configure_scripts\n\n# Patch `configure` to include `$LDFLAGS` in its tests.  This is necessary on FreeBSD.\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/configure.patch\n\n# Include Julia-carried patches\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/gmp_alloc_overflow_func.patch\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/gmp-exception.patch\n\nflags=(--enable-cxx --enable-shared --disable-static)\n\n# On x86_64 architectures, build fat binary\nif [[ ${proc_family} == intel ]]; then\n    flags+=(--enable-fat)\nfi\n\n./configure --prefix=$prefix --host=$target ${flags[@]}\nmake -j${nproc}\nmake install\n\n# On Windows, we need to make sure that the non-versioned dll names exist too\nif [[ ${target} == *mingw* ]]; then\n    cp -v ${prefix}/bin/libgmp-*.dll ${prefix}/bin/libgmp.dll\nfi\n"""
sources = [{"https://gmplib.org/download/gmp/gmp-6.1.2.tar.bz2" = "5275bb04f4863a13516b2f39392ac5e272f5e1bb8057b18aec1c9b79d73d8fb2"}, "./bundled"]
version = "v6.1.2"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libgmp"]
type = "lib"
variable_name = "libgmp"
