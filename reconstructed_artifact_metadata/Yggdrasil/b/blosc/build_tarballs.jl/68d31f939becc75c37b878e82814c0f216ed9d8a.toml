platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin14-cxx03", "x86_64-apple-darwin14-cxx11", "x86_64-unknown-freebsd11.1-cxx03", "x86_64-unknown-freebsd11.1-cxx11", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/c-blosc-*\nmkdir build\ncd build\nCMAKE_FLAGS=(-DCMAKE_INSTALL_PREFIX=$prefix -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release)\nCMAKE_FLAGS+=(-DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF)\nCMAKE_FLAGS+=(-DBUILD_STATIC=OFF)\nCMAKE_FLAGS+=(-DCMAKE_SHARED_LIBRARY_LINK_C_FLAGS=\"\")\nCMAKE_FLAGS+=(-DCMAKE_SHARED_LIBRARY_LINK_CXX_FLAGS=\"\")\nCMAKE_FLAGS+=(-DPREFER_EXTERNAL_ZLIB=ON)\nCMAKE_FLAGS+=(-DPREFER_EXTERNAL_ZSTD=ON)\nCMAKE_FLAGS+=(-DPREFER_EXTERNAL_LZ4=ON)\n#CMAKE_FLAGS+=(-DPREFER_EXTERNAL_SNAPPY=ON)\ncmake ${CMAKE_FLAGS[@]} ..\nmake -j${nproc}\nmake install\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    # Manually move dlls from lib/ to bin/\n    mv ${prefix}/lib/*.${dlext} ${libdir}\nfi\n\ninstall_license ../LICENSES/*.txt\n"""
version = "v1.14.3"

