dependencies = []
lazy_artifacts = false
name = "breakpad"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "x86_64-apple-darwin14-cxx03", "x86_64-apple-darwin14-cxx11", "x86_64-unknown-freebsd11.1-cxx03", "x86_64-unknown-freebsd11.1-cxx11", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd ${WORKSPACE}/srcdir/breakpad\n\n# Apply old glibc patch for aarch64\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/glibc_aarch64.patch\"\n\n# Link necessary subprojects into their appropriate locations\nln -s ${WORKSPACE}/srcdir/linux-syscall-support src/third_party/lss\n./configure --prefix=${prefix} --host=${target} --build=${MACHTYPE}\nmake -j${nproc}\nmake install\ninstall_license LICENSE\n"""
version = "v2020.2.21"

