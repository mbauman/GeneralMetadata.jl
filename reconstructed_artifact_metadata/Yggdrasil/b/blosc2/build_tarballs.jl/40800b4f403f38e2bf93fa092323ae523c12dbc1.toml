augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Blosc2"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/c-blosc2/\n\n# Blosc2 mis-detects whether the system headers provide `_xsetbv`\n# (probably on several platforms), and on `x86_64-w64-mingw32` the\n# functions have incompatible return types (although both are 64-bit\n# integers).\natomic_patch -p1 ../patches/_xsetbv.patch\n\nmkdir build && cd build\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_TESTS=OFF \\\n    -DBUILD_BENCHMARKS=OFF \\\n    -DBUILD_EXAMPLES=OFF \\\n    -DBUILD_STATIC=OFF \\\n    -DCMAKE_SHARED_LIBRARY_LINK_C_FLAGS=\"\" \\\n    -DPREFER_EXTERNAL_ZLIB=ON \\\n    -DPREFER_EXTERNAL_ZSTD=ON \\\n    -DPREFER_EXTERNAL_LZ4=ON \\\n    ..\nmake -j${nproc}\nmake install\ninstall_license ../LICENSES/*.txt\n"""
version = "v2.9.2"

