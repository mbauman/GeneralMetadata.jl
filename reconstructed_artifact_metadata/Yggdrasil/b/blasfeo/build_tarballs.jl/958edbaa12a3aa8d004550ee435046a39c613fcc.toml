augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "blasfeo"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/blasfeo\nmkdir build\ncd build/\ncmake \\\n    -D TARGET=GENERIC \\\n    -D MF=PANELMAJ \\\n    -D LA=HIGH_PERFORMANCE \\\n    -D CMAKE_INSTALL_PREFIX=${prefix} \\\n    -D CMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -D CMAKE_BUILD_TYPE=Release \\\n    -D BUILD_SHARED_LIBS=ON \\\n    ..\n\necho \"Finished cmake config\"\nif [[ \"${target}\" == *-linux-* ]]; then \n    echo \"System is Linux\"\n    cmake -D CMAKE_C_FLAGS=\"-lrt\" ..\nfi\necho \"Finished first conditional\"\nif [[ \"${target}\" == *-apple-* ]]; then \n    echo \"Setting RPATH\"\n    cmake -D CMAKE_MACOSX_RPATH=1 ..\nfi\n\ncmake --build . --target install -j${nproc}\n"""
version = "v0.1.3"

