init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "bliss"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir\ncd bliss-0.73\nif [[ \"${target}\" == *mingw* ]]; then\n  atomic_patch -p1 ../patches/notimer.patch\nfi\n# build with GMP and store this information\nsed -i -e 's/^namespace bliss/#define BLISS_USE_GMP\\n\\nnamespace bliss/' defs.hh\nmake -j${nproc} lib_gmp CFLAGS=\"-I$prefix/include -O3 -fPIC -I.\" LDFLAGS=\"$LDFLAGS -L$libdir\" CC=\"$CXX\"\n# there is no target for a shared library\n$CXX -shared -o libbliss.$dlext *.og $LDFLAGS -L$libdir -lgmp\nmkdir -p $prefix/include/bliss\nmkdir -p $libdir\ninstall -p -m 0644 -t $prefix/include/bliss *.hh\ninstall -p libbliss.$dlext $libdir\n"""
version = "v0.73.1"

