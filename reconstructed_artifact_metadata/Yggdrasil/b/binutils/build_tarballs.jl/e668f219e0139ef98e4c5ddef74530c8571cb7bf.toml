script = """cd ${WORKSPACE}/srcdir/binutils-*/\n\n./configure --prefix=${prefix} \\\n    --target=${target} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --disable-dependency-tracking \\\n    --enable-deterministic-archives \\\n    --disable-werror \\\n    --disable-gprof \\\n    --disable-gprofng \\\n    --disable-gas \\\n    --disable-gold \\\n    --disable-ld \\\n    --enable-install-libbfd \\\n    --enable-install-libctf \\\n    --enable-install-libiberty \\\n    --enable-plugins \\\n    --enable-targets=${target} \\\n    --disable-nls \\\n    --enable-64-bit-bfd \\\n    --disable-static \\\n    --enable-shared\n\nmake -j${nproc}\nmake install\n"""
version = "v2.39.0"

