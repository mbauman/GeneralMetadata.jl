julia_compat = "1.6"
lazy_artifacts = false
name = "Binutils"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """cd ${WORKSPACE}/srcdir/binutils-*\n\n./configure --prefix=${prefix} \\\n    --target=${target} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --disable-dependency-tracking \\\n    --enable-deterministic-archives \\\n    --disable-werror \\\n    --disable-gprof \\\n    --disable-gprofng \\\n    --disable-gas \\\n    --disable-gold \\\n    --disable-ld \\\n    --enable-install-libbfd \\\n    --enable-install-libctf \\\n    --enable-install-libiberty \\\n    --enable-plugins \\\n    --enable-targets=${target} \\\n    --disable-nls \\\n    --enable-64-bit-bfd \\\n    --disable-static \\\n    --enable-shared\n\nmake -j${nproc}\nmake install\n\n# Install the `-fPIC` version of `libiberty.a` (which we built) but which isn't installed by default,\n# overwriting the non-pic version which was installed\nif test -f ${prefix}/lib64/libiberty.a; then\n    install -Dvm 755 libiberty/pic/libiberty.a ${prefix}/lib64/libiberty.a\nelif test -f ${prefix}/lib/libiberty.a; then\n    install -Dvm 755 libiberty/pic/libiberty.a ${prefix}/lib/libiberty.a\nelse\n    exit 1\nfi\n"""
version = "v2.44.0"

