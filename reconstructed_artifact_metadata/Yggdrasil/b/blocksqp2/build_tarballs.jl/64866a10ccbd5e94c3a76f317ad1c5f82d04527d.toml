augment_platform_block = ""
init_block = ""
julia_compat = "1.9"
lazy_artifacts = false
name = "blockSQP2"
platforms = ["x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-w64-mingw32-cxx11"]
script = """\nif [[ \"${target}\" == *-apple-* ]]; then\n    mount -t tmpfs -o size=2G tmpfs \"/opt/${target}/${target}/sys-root\"\nfi\n\nmacos_sdk_version=26.1\nmacosx_deployment_target=26.1\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    # extract the tarball into the sys-root so all compilers pick it up\n    # automatically, and use --warning=no-unknown-keyword to hide harmless\n    # warnings about unsupported pax header keywords like \"SCHILY.fflags\"\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        --warning=no-unknown-keyword \\\n        MacOSX${macos_sdk_version}.sdk/System \\\n        MacOSX${macos_sdk_version}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\n    \napk del cmake\ncd ${WORKSPACE}/srcdir/blockSQP2\nmv CMake/CMakeListsBinaryBuilderjl.cmake CMakeLists.txt\n\nLOBSUFFIX=\"\"\n\nmkdir build && cd build\ncmake \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_FIND_ROOT_PATH=$prefix \\\n    -DCMAKE_PREFIX_PATH=$prefix \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCBLAS_SUFFIX=\"$LOBSUFFIX\" \\\n    -DINCLUDE_DIR=${includedir} \\\n    -DMUMPS_LIBRARIES=\"${libdir}/libdmumps.${dlext}\" \\\n    -DMUMPS_COMMON_LIBRARY=\"${libdir}/libmumps_common.${dlext}\" \\\n    -DMUMPS_PORD_LIBRARY=\"${libdir}/libpord.${dlext}\" \\\n    -DMUMPS_MPISEQ_LIBRARY=\"${libdir}/libmpiseq.${dlext}\" \\\n    -S .. \\\n    -B .\nmake\nmake install\ninstall_license ${WORKSPACE}/srcdir/blockSQP2/LICENSE\nmkdir ${prefix}/share/licenses/blockSQP\ncp ${WORKSPACE}/srcdir/blockSQP2/blockSQP2/LICENSE ${prefix}/share/licenses/blockSQP/LICENSE\n\nmkdir ${prefix}/share/licenses/qpOASES \ncp ${WORKSPACE}/srcdir/blockSQP2/blockSQP2/dep/modified_qpOASES/LICENSE ${prefix}/share/licenses/qpOASES/LICENSE\n"""
version = "v0.1.2"

