name = "BerkeleyDB"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/db-*/docs\n# see https://stackoverflow.com/questions/64707079/berkeley-db-make-install-fails-on-linux \nmkdir bdb-sql\nmkdir gsg_db_server\ncd ../dist\n\n# update configure for powerpc\nif [[ \"${target}\" == powerpc64le-* ]]; then\n    sed -i s/elf64ppc/elf64lppc/ configure\nfi\n\ncd ../build_unix\n../dist/configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\n"""
version = "v18.1.41"

