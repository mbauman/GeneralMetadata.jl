init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "BlueZ"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir\ncd bluez-*\n# Hint to find libstc++, required to link against C++ libs when using C compiler\nif [[ \"${target}\" == *-linux-* ]]; then\n    if [[ \"${nbits}\" == 32 ]]; then\n        export CFLAGS=\"-Wl,-rpath-link,/opt/${target}/${target}/lib\";\n    else\n        export CFLAGS=\"-Wl,-rpath-link,/opt/${target}/${target}/lib64\";\n    fi;\nfi\n# linux/if_alg doesn't seem to work; prevent configure from finding it\nsed -i -e \"s~ linux/if_alg.h~~\" configure.ac \nautoconf\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --disable-systemd --enable-library\nmake\nmake install\n"""
version = "v5.54.0"

