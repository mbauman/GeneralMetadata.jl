augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "bitshuffle"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd \"${WORKSPACE}/srcdir/bitshuffle\"\n\n# Configure\nCFLAGS=\"-std=c99 -fPIC -O3 -DZSTD_SUPPORT\"\nLDFLAGS=\nLIBS=\"-llz4 -lzstd\"\n\n# Build\ncd src\n${CC} ${CFLAGS} ${LDFLAGS} --shared -o libbitshuffle.${dlext} bitshuffle.c bitshuffle_core.c iochain.c ${LIBS}\ncd ..\n\n# Install\ninstall -Dvm 644 src/bitshuffle.h \"${includedir}/bitshuffle.h\"\ninstall -Dvm 644 src/bitshuffle_core.h \"${includedir}/bitshuffle_core.h\"\ninstall -Dvm 755 src/libbitshuffle.${dlext} \"${libdir}/libbitshuffle.${dlext}\"\n"""
version = "v0.5.2"

