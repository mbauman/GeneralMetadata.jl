dependencies = ["Zlib_jll", "libpng_jll", "JpegTurbo_jll", "Libtiff_jll"]
name = "ImageMagick"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/ImageMagick6*/\n./configure --prefix=$prefix --host=$target --without-x --disable-openmp --disable-installed --disable-dependency-tracking --without-frozenpaths --without-perl\nmake -j${nproc}\nmake install\n"""
version = "v6.9.10-12"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libMagickWand"]
type = "lib"
variable_name = "libwand"

