augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = true
name = "IntelOpenMP"
platforms = ["x86_64-linux-gnu", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\nunzip -d intel_openmp-$target intel_openmp-$target.whl\n\nif [[ ${target} == *x86_64-w64-mingw* ]]; then\n    install -Dvm 755 intel_openmp-${target}/intel_openmp-*.data/data/Library/bin/* -t \"${libdir}\"\n\n    # These import libraries go inside the actual lib folder, not the bin folder with the DLLs\n    install -Dv intel_openmp-${target}/intel_openmp-*.data/data/Library/lib/libiomp5md.lib -t \"${prefix}/lib/\"\n    install -Dv intel_openmp-${target}/intel_openmp-*.data/data/Library/lib/libiompstubs5md.lib -t \"${prefix}/lib/\"\nfi\nif [[ ${target} == *x86_64-linux-gnu* ]]; then\n    install -Dvm 755 intel_openmp-${target}/intel_openmp-*.data/data/lib/*.${dlext} -t \"${libdir}\"\nfi\ninstall_license intel_openmp-${target}/intel_openmp-*.dist-info/LICENSE.txt\ninstall_license intel_openmp-${target}/intel_openmp-*.data/data/share/doc/compiler/licensing/openmp/third-party-programs.txt\n"""
version = "v2025.0.4"

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["libiomp5", "libiomp5md"]
type = "lib"
variable_name = "libiomp"

