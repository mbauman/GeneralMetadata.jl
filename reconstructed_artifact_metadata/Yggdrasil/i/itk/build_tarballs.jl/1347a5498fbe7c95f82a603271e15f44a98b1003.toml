name = "ITK"
platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/ITK*\nmkdir build/\ncmake -B build -S . \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DBUILD_SHARED_LIBS:BOOL=ON \\\n    -DITK_USE_SYSTEM_EXPAT:BOOL=ON \\\n    -DITK_USE_SYSTEM_FFTW:BOOL=ON \\\n    -DITK_USE_SYSTEM_HDF5:BOOL=ON \\\n    -DITK_USE_SYSTEM_JPEG:BOOL=ON \\\n    -DITK_USE_SYSTEM_TIFF:BOOL=ON \\\n    -DITK_USE_SYSTEM_PNG:BOOL=ON \\\n    -DITK_USE_SYSTEM_EIGEN:BOOL=ON \\\n    -DITK_USE_SYSTEM_ZLIB:BOOL=ON \\\n    -DQNANHIBIT_VALUE:BOOL=0 \\\n    -DQNANHIBIT_VALUE__TRYRUN_OUTPUT:STRING=0 \\\n    -DVXL_HAS_SSE2_HARDWARE_SUPPORT:STRING=1 \\\n    -DVCL_HAS_LFS:STRING=1 \\\n    -DDOUBLE_CONVERSION_CORRECT_DOUBLE_OPERATIONS:STRING=1 \\\n    -DHAVE_CLOCK_GETTIME_RUN:STRING=0\ncmake --build build --parallel ${nproc}\ncmake --install build\ninstall_license ${WORKSPACE}/srcdir/ITK/LICENSE\n"""
version = "v5.3.0"

