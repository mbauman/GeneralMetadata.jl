julia_compat = "1.6"
lazy_artifacts = false
name = "IRL"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd ${WORKSPACE}/srcdir/interface-reconstruction-library\n\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/abseil-static-pic.patch\n\nmkdir build && cd build\ncmake .. \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DCMAKE_POSITION_INDEPENDENT_CODE=ON \\\n    -DEigen3_DIR=${prefix}/share/eigen3/cmake\n\ncmake --build . --target irl_c -j${nproc}\n\nmkdir -p ${libdir} ${includedir}\ninstall -Dvm755 libirl.${dlext} ${libdir}/libirl.${dlext}\ninstall -Dvm755 libirl_c.${dlext} ${libdir}/libirl_c.${dlext}\n\ncp -rv ../irl ${includedir}/\nfind ${includedir}/irl -type f ! -name '*.h' ! -name '*.tpp' -print -delete\n"""
version = "v0.1.0"

