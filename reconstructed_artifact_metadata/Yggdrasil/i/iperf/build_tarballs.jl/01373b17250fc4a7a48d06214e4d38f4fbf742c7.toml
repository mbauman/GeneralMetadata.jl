dependencies = []
name = "iperf"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1"]
script = """cd $WORKSPACE/srcdir/iperf-*\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --disable-profiling\nmake -j${nproc}\nmake install\n"""
version = "v3.7.0"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libiperf"]
type = "lib"
variable_name = "libiperf"
[[products]]
binnames = ["iperf3"]
type = "exe"
variable_name = "iperf"

