name = "igraph"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/igraph*\n\nif [[ \"${target}\" == *mingw* ]]; then\n    LBT=blastrampoline-5\nelse\n    LBT=blastrampoline\nfi\n\nCONF_FLAGS=\"\\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DIGRAPH_ENABLE_LTO=AUTO \\\n    -DIGRAPH_ENABLE_TLS=ON \\\n    -DIGRAPH_USE_INTERNAL_BLAS=OFF \\\n    -DIGRAPH_USE_INTERNAL_LAPACK=OFF \\\n    -DIGRAPH_USE_INTERNAL_ARPACK=OFF \\\n    -DIGRAPH_USE_INTERNAL_GLPK=OFF \\\n    -DIGRAPH_USE_INTERNAL_GMP=OFF \\\n    -DIGRAPH_USE_INTERNAL_PLFIT=ON \\\n    -DIGRAPH_GLPK_SUPPORT=ON \\\n    -DIGRAPH_GRAPHML_SUPPORT=ON \\\n    -DIGRAPH_OPENMP_SUPPORT=ON \\\n    -DBLA_VENDOR=blastrampoline -DBLAS_LIBRARIES=\"${LBT}\" -DLAPACK_LIBRARIES=\"${LBT}\" \\\n    -DBUILD_TESTING=OFF\" # adapted from https://github.com/msys2/MINGW-packages/blob/master/mingw-w64-igraph due to issues on Windows\"\nBB_FLAGS=\"-DCMAKE_INSTALL_PREFIX=$prefix -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\"\ncmake -B build -DCMAKE_BUILD_TYPE=Release ${BB_FLAGS} ${CONF_FLAGS}\n\ninstall_license COPYING\n\ncmake --build build --parallel ${nproc}\ncmake --install build\n"""
version = "v0.10.15"

