init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "OpenFAST"
platforms = ["i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran3", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "powerpc64le-linux-gnu-libgfortran3", "powerpc64le-linux-gnu-libgfortran4", "powerpc64le-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran3", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran3", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "x86_64-apple-darwin-libgfortran3", "x86_64-apple-darwin-libgfortran4", "x86_64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran3", "x86_64-unknown-freebsd-libgfortran4", "x86_64-unknown-freebsd-libgfortran5"]
script = """cd $WORKSPACE/srcdir/openfast-*/\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    atomic_patch -p1 ${WORKSPACE}/srcdir/patches/mingw-lowercase-windows-include.patch\nfi\n\nmkdir build && cd build\n\ncmake .. \\\n-DCMAKE_INSTALL_PREFIX=${prefix} \\\n-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n-DCMAKE_BUILD_TYPE=Debug \\\n-DBUILD_SHARED_LIBS=ON \\\n-DBUILD_FASTFARM=OFF \\\n-DORCA_DLL_LOAD=OFF \\\n-DOPENMP=ON \\\n-DBLAS_LIBRARIES=\"${libdir}/libopenblas.${dlext}\" \\\n-DLAPACK_LIBRARIES=\"${libdir}/libopenblas.${dlext}\"\n\n#WARNING: compiling this locally can go crazy and lock up your machine, using only 2 jobs and Debug version to make it behave\nmake -j2\nmake install\n"""
version = "v3.0.0"

