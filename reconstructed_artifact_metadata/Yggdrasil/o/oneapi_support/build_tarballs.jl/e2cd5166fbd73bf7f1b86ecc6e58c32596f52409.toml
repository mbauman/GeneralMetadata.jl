augment_platform_block = ""
init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "oneAPI_Support"
platforms = ["x86_64-linux-gnu"]
script = """install_license \"info/licenses/license.txt\"\n\n# install dependencies in the prefix\n# NOTE: these dependencies _should_ be packaged as JLLs we can depend on,\n#       but that's just a lot of work and not worth it for this single build.\nmkdir -p ${libdir} ${includedir}\nmv lib/clang/*/include/CL ${includedir}\nrm -rf lib/clang\ncp -r include/* ${includedir}\nfor lib in mkl_sycl mkl_intel_ilp64 mkl_sequential mkl_core sycl \\\n           pi_level_zero pi_opencl OpenCL svml irng imf intlc; do\n    cp -a lib/lib${lib}*.so* ${libdir}\ndone\n\ncd oneAPI.jl/deps\n\nCMAKE_FLAGS=()\n# Release build for best performance\nCMAKE_FLAGS+=(-DCMAKE_BUILD_TYPE=RelWithDebInfo)\n# Install things into $prefix\nCMAKE_FLAGS+=(-DCMAKE_INSTALL_PREFIX=${prefix})\n# Explicitly use our cmake toolchain file and tell CMake we're cross-compiling\n# XXX: use the Clang version to work around an issue with the SYCL headers\nCMAKE_FLAGS+=(-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN%.*}_clang.cmake)\nCMAKE_FLAGS+=(-DCMAKE_CROSSCOMPILING:BOOL=ON)\ncmake -B build -S . -GNinja ${CMAKE_FLAGS[@]}\n\nninja -C build -j ${nproc} install\n\n# remove build-time dependencies we don't need\nrm -rf ${includedir}\n"""
version = "v0.2.0"

[[dependencies]]
compat = ""
name = "oneAPI_Level_Zero_Headers_jll"
platforms = ["any"]
top_level = false
type = "builddependency"
version-major = 0
version-minor = 0
version-patch = 0
[[dependencies]]
compat = ""
name = "oneAPI_Level_Zero_Loader_jll"
platforms = ["any"]
top_level = false
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["liboneapi_support"]
type = "lib"
variable_name = "liboneapi_support"

