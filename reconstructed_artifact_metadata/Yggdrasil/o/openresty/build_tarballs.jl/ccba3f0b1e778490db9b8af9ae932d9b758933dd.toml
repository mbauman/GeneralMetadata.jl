dependencies = []
init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "Openresty"
platforms = ["x86_64-linux-gnu", "x86_64-linux-musl"]
script = """cd $WORKSPACE/srcdir/openresty-*/\nexport SUPER_VERBOSE=1\n./configure --prefix=${prefix} \\\n    --with-cc=$CC \\\n    --with-zlib=$WORKSPACE/srcdir/zlib-1.2.11 \\\n    --with-openssl=$WORKSPACE/srcdir/openssl-1.1.1l \\\n    --with-pcre=$WORKSPACE/srcdir/pcre-8.43 \\\n    --with-pcre-jit\nmake\nmake install\nrm ${bindir}/openresty\nln -s ../nginx/sbin/nginx ${bindir}/openresty\ninstall_license $prefix/COPYRIGHT\n"""
version = "v1.19.9"

[[products]]
binnames = ["openresty"]
type = "exe"
variable_name = "openresty"
[[products]]
binnames = ["opm"]
type = "exe"
variable_name = "opm"
[[products]]
binnames = ["resty"]
type = "exe"
variable_name = "resty"
[[products]]
paths = ["luajit"]
type = "file"
variable_name = "luajit_dir"
[[products]]
paths = ["lualib"]
type = "file"
variable_name = "lualib_dir"
[[products]]
paths = ["nginx"]
type = "file"
variable_name = "nginx_dir"

