init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "Openresty"
platforms = ["x86_64-linux-gnu", "x86_64-linux-musl"]
script = """cd $WORKSPACE/srcdir/openresty-*/\nexport SUPER_VERBOSE=1\n./configure --prefix=${prefix} \\\n    --with-cc=$CC \\\n    --with-zlib=$WORKSPACE/srcdir/zlib-1.3.2 \\\n    --with-openssl=$WORKSPACE/srcdir/openssl-3.5.5 \\\n    --with-pcre=$WORKSPACE/srcdir/pcre2-10.47 \\\n    --with-pcre-jit\nmake\nmake install\ninstall_license $prefix/COPYRIGHT\n"""
version = "v1.29.203"

