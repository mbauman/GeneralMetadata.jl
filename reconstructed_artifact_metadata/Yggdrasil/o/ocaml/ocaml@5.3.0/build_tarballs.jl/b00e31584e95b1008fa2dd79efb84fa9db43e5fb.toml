augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "OCaml"
platforms = ["x86_64-linux-gnu", "x86_64-linux-musl", "x86_64-w64-mingw32", "x86_64-apple-darwin", "aarch64-apple-darwin"]
script = """cd $WORKSPACE/srcdir\n\nif [[ \"${target}\" == *-darwin* ]] || [[ \"${target}\" == *-mingw* ]]; then\n    # For Windows / macOS just use the prebuilt library\n    cp -r ocaml-5.3.0-${target}/*/* ${prefix}/.\n    cd ocaml\n    install_license LICENSE\nelse\n    # Otherwise, do a proper build\n    cd ocaml\n    for f in ${WORKSPACE}/srcdir/patches/*.patch; do\n        atomic_patch -p1 ${f}\n    done\n    ./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\n    make -j${nproc}\n    make install\nfi\n\nfor bin in $(file ${bindir}/* | grep \"a ${bindir}/ocamlrun script\" | cut -d: -f1); do\n    # Fix shebang of ocamlrun scripts to not hardcode\n    # a path of the build environment\n    sed -i \"s?${bindir}/ocamlrun?/usr/bin/env ocamlrun?\" \"${bin}\"\ndone\n"""
version = "v5.3.0"

[[products]]
binnames = ["ocamlopt.opt"]
type = "exe"
variable_name = "ocamlopt"
[[products]]
binnames = ["ocamlc.opt"]
type = "exe"
variable_name = "ocamlc"
[[products]]
binnames = ["ocamlrun"]
type = "exe"
variable_name = "ocamlrun"

