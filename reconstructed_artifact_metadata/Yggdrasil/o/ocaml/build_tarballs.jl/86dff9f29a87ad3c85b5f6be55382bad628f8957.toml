augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "OCaml"
platforms = ["x86_64-linux-gnu", "x86_64-linux-musl"]
script = """cd $WORKSPACE/srcdir\ncd ocaml\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\nfor bin in $(file ${bindir}/* | grep \"a ${bindir}/ocamlrun script\" | cut -d: -f1); do\n    # Fix shebang of ocamlrun scripts to not hardcode\n    # a path of the build environment\n    sed -i \"s?${bindir}/ocamlrun?/usr/bin/env ocamlrun?\" \"${bin}\"\ndone\n"""
version = "v5.3.0"

[[products]]
binnames = ["ocamlopt.opt"]
type = "exe"
variable_name = "ocamlopt"
[[products]]
binnames = ["ocamlc.opt"]
type = "exe"
variable_name = "ocamlc"

