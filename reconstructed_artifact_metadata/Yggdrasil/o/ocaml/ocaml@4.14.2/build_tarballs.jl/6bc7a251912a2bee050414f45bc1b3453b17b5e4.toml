augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "OCaml"
platforms = ["x86_64-linux-gnu", "i686-linux-gnu", "x86_64-linux-musl", "i686-linux-musl"]
script = """cd $WORKSPACE/srcdir\ncd ocaml\nfor f in ${WORKSPACE}/srcdir/patches/*.patch; do\n    atomic_patch -p1 ${f}\ndone\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\nfor bin in $(file ${bindir}/* | grep \"a ${bindir}/ocamlrun script\" | cut -d: -f1); do\n    # Fix shebang of ocamlrun scripts to not hardcode\n    # a path of the build environment\n    sed -i \"s?${bindir}/ocamlrun?/usr/bin/env ocamlrun?\" \"${bin}\"\ndone\n"""
version = "v4.14.2"

[[products]]
binnames = ["ocamlopt.opt"]
type = "exe"
variable_name = "ocamlopt"
[[products]]
binnames = ["ocamlc.opt"]
type = "exe"
variable_name = "ocamlc"
[[products]]
binnames = ["ocamlrun"]
type = "exe"
variable_name = "ocamlrun"

