init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "openPMD_api"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd-cxx03", "x86_64-unknown-freebsd-cxx11", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir\ncd openPMD-api-0.13.4\nmkdir build\ncd build\nif [[ \"$target\" == *-apple-* ]]; then\n    # Set up a wrapper script for the assembler. GCC's assembly\n    # output isn't accepted by the LLVM assembler.\n    as=$(which as)\n    mv \"$as\" \"$as.old\"\n    export AS=\"$as.old\"\n    ln -s \"$WORKSPACE/srcdir/scripts/as.llvm\" \"$as\"\nfi\nmpiopts=\nif [[ \"$target\" == x86_64-w64-mingw32 ]]; then\n    mpiopts=\"-DMPI_HOME=$prefix -DMPI_GUESS_LIBRARY_NAME=MSMPI -DMPI_C_LIBRARIES=msmpi64 -DMPI_CXX_LIBRARIES=msmpi64\"\nelif [[ \"$target\" == *-mingw* ]]; then\n    mpiopts=\"-DMPI_HOME=$prefix -DMPI_GUESS_LIBRARY_NAME=MSMPI\"\nfi\ncmake -DCMAKE_INSTALL_PREFIX=$prefix -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN%.*}_gcc.cmake -DCMAKE_BUILD_TYPE=Release ${mpiopts} ..\nmake -j${nproc}\nmake -j${nproc} install\ninstall_license ../COPYING*\n"""
version = "v0.13.4"

