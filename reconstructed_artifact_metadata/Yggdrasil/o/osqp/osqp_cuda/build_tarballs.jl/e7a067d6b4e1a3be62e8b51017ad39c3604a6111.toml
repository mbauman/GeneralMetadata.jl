script = ["""export CUDAARCHS=\"75;80;86;89\"\n## CUDA setup\n# nvcc writes to /tmp, which is a small tmpfs in our sandbox.\n# make it use the workspace instead\nexport TMPDIR=${WORKSPACE}/tmpdir\nmkdir ${TMPDIR}\n\nexport CUDA_HOME=${WORKSPACE}/destdir/cuda;\nexport PATH=$PATH:$CUDA_HOME/bin\nexport CUDACXX=$CUDA_HOME/bin/nvcc\n\nln -s ${WORKSPACE}/destdir/cuda/lib ${WORKSPACE}/destdir/cuda/lib64\n# OSQP requires CMake > 3.18, the base image has 3.17.2 currently, so use the JLL-provided CMake\napk del cmake\n\ncd $WORKSPACE/srcdir/osqp\ngit submodule update --init --recursive\n\n# Apply any patches\nfor p in ${WORKSPACE}/srcdir/patches/*.patch; do\n    atomic_patch -p1 \"${p}\" || true\ndone\nOSQP_VERSION=\"1.0.0\"\nOSQP_ALGEBRA=\"cuda\"\nOSQP_LIB_SUFFIX=\"cuda_double\"\nOSQP_FLOAT=OFF\nBUILD_DIR=\"build-double\"\nmkdir $BUILD_DIR\ncmake \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DOSQP_BUILD_UNITTESTS=OFF \\\n    -DOSQP_VERSION=$OSQP_VERSION \\\n    -DOSQP_BUILD_SHARED_LIB=ON \\\n    -DOSQP_BUILD_STATIC_LIB=OFF \\\n    -DOSQP_ALGEBRA_BACKEND=$OSQP_ALGEBRA \\\n    -DOSQP_USE_FLOAT=$OSQP_FLOAT \\\n    -DOSQP_LIB_SUFFIX=$OSQP_LIB_SUFFIX \\\n    -B $BUILD_DIR \\\n    -S .\ncmake --build $BUILD_DIR\ncmake --install $BUILD_DIR\nOSQP_VERSION=\"1.0.0\"\nOSQP_ALGEBRA=\"cuda\"\nOSQP_LIB_SUFFIX=\"cuda_single\"\nOSQP_FLOAT=ON\nBUILD_DIR=\"build-single\"\nmkdir $BUILD_DIR\ncmake \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DOSQP_BUILD_UNITTESTS=OFF \\\n    -DOSQP_VERSION=$OSQP_VERSION \\\n    -DOSQP_BUILD_SHARED_LIB=ON \\\n    -DOSQP_BUILD_STATIC_LIB=OFF \\\n    -DOSQP_ALGEBRA_BACKEND=$OSQP_ALGEBRA \\\n    -DOSQP_USE_FLOAT=$OSQP_FLOAT \\\n    -DOSQP_LIB_SUFFIX=$OSQP_LIB_SUFFIX \\\n    -B $BUILD_DIR \\\n    -S .\ncmake --build $BUILD_DIR\ncmake --install $BUILD_DIR\n""", """export CUDAARCHS=\"75;80;86;89;90\"\n## CUDA setup\n# nvcc writes to /tmp, which is a small tmpfs in our sandbox.\n# make it use the workspace instead\nexport TMPDIR=${WORKSPACE}/tmpdir\nmkdir ${TMPDIR}\n\nexport CUDA_HOME=${WORKSPACE}/destdir/cuda;\nexport PATH=$PATH:$CUDA_HOME/bin\nexport CUDACXX=$CUDA_HOME/bin/nvcc\n\nln -s ${WORKSPACE}/destdir/cuda/lib ${WORKSPACE}/destdir/cuda/lib64\n# OSQP requires CMake > 3.18, the base image has 3.17.2 currently, so use the JLL-provided CMake\napk del cmake\n\ncd $WORKSPACE/srcdir/osqp\ngit submodule update --init --recursive\n\n# Apply any patches\nfor p in ${WORKSPACE}/srcdir/patches/*.patch; do\n    atomic_patch -p1 \"${p}\" || true\ndone\nOSQP_VERSION=\"1.0.0\"\nOSQP_ALGEBRA=\"cuda\"\nOSQP_LIB_SUFFIX=\"cuda_double\"\nOSQP_FLOAT=OFF\nBUILD_DIR=\"build-double\"\nmkdir $BUILD_DIR\ncmake \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DOSQP_BUILD_UNITTESTS=OFF \\\n    -DOSQP_VERSION=$OSQP_VERSION \\\n    -DOSQP_BUILD_SHARED_LIB=ON \\\n    -DOSQP_BUILD_STATIC_LIB=OFF \\\n    -DOSQP_ALGEBRA_BACKEND=$OSQP_ALGEBRA \\\n    -DOSQP_USE_FLOAT=$OSQP_FLOAT \\\n    -DOSQP_LIB_SUFFIX=$OSQP_LIB_SUFFIX \\\n    -B $BUILD_DIR \\\n    -S .\ncmake --build $BUILD_DIR\ncmake --install $BUILD_DIR\nOSQP_VERSION=\"1.0.0\"\nOSQP_ALGEBRA=\"cuda\"\nOSQP_LIB_SUFFIX=\"cuda_single\"\nOSQP_FLOAT=ON\nBUILD_DIR=\"build-single\"\nmkdir $BUILD_DIR\ncmake \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DOSQP_BUILD_UNITTESTS=OFF \\\n    -DOSQP_VERSION=$OSQP_VERSION \\\n    -DOSQP_BUILD_SHARED_LIB=ON \\\n    -DOSQP_BUILD_STATIC_LIB=OFF \\\n    -DOSQP_ALGEBRA_BACKEND=$OSQP_ALGEBRA \\\n    -DOSQP_USE_FLOAT=$OSQP_FLOAT \\\n    -DOSQP_LIB_SUFFIX=$OSQP_LIB_SUFFIX \\\n    -B $BUILD_DIR \\\n    -S .\ncmake --build $BUILD_DIR\ncmake --install $BUILD_DIR\n""", """export CUDAARCHS=\"75;80;86;89;90;