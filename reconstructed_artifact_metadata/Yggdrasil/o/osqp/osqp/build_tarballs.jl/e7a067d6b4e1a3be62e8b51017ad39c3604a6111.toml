augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "OSQP"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """# OSQP requires CMake > 3.18, the base image has 3.17.2 currently, so use the JLL-provided CMake\napk del cmake\n\ncd $WORKSPACE/srcdir/osqp\ngit submodule update --init --recursive\n\n# Apply any patches\nfor p in ${WORKSPACE}/srcdir/patches/*.patch; do\n    atomic_patch -p1 \"${p}\" || true\ndone\nOSQP_VERSION=\"1.0.0\"\nOSQP_ALGEBRA=\"builtin\"\nOSQP_LIB_SUFFIX=\"builtin_double\"\nOSQP_FLOAT=OFF\nBUILD_DIR=\"build-double\"\nmkdir $BUILD_DIR\ncmake \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DOSQP_BUILD_UNITTESTS=OFF \\\n    -DOSQP_VERSION=$OSQP_VERSION \\\n    -DOSQP_BUILD_SHARED_LIB=ON \\\n    -DOSQP_BUILD_STATIC_LIB=OFF \\\n    -DOSQP_ALGEBRA_BACKEND=$OSQP_ALGEBRA \\\n    -DOSQP_USE_FLOAT=$OSQP_FLOAT \\\n    -DOSQP_LIB_SUFFIX=$OSQP_LIB_SUFFIX \\\n    -B $BUILD_DIR \\\n    -S .\ncmake --build $BUILD_DIR\ncmake --install $BUILD_DIR\nOSQP_VERSION=\"1.0.0\"\nOSQP_ALGEBRA=\"builtin\"\nOSQP_LIB_SUFFIX=\"builtin_single\"\nOSQP_FLOAT=ON\nBUILD_DIR=\"build-single\"\nmkdir $BUILD_DIR\ncmake \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DOSQP_BUILD_UNITTESTS=OFF \\\n    -DOSQP_VERSION=$OSQP_VERSION \\\n    -DOSQP_BUILD_SHARED_LIB=ON \\\n    -DOSQP_BUILD_STATIC_LIB=OFF \\\n    -DOSQP_ALGEBRA_BACKEND=$OSQP_ALGEBRA \\\n    -DOSQP_USE_FLOAT=$OSQP_FLOAT \\\n    -DOSQP_LIB_SUFFIX=$OSQP_LIB_SUFFIX \\\n    -B $BUILD_DIR \\\n    -S .\ncmake --build $BUILD_DIR\ncmake --install $BUILD_DIR\n"""
version = "v100.0.0"

