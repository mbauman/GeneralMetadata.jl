script = """cd ${WORKSPACE}/srcdir/otf2-*\n\nautoreconf -fvi\n./configure \\\n    --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --enable-shared \\\n    --disable-static \\\n    --without-python \\\n    --disable-doc \\\n    --disable-doxygen-doc \\\n    --disable-doxygen-dot \\\n    --disable-doxygen-html \\\n    --disable-doxygen-rtf\n\nmake -j${nproc}\nmake install V=1\n"""
