name = "Octave"
platforms = ["i686-linux-gnu-libgfortran5-cxx11", "x86_64-linux-gnu-libgfortran5-cxx11", "aarch64-linux-gnu-libgfortran5-cxx11", "armv6l-linux-gnueabihf-libgfortran5-cxx11", "armv7l-linux-gnueabihf-libgfortran5-cxx11", "powerpc64le-linux-gnu-libgfortran5-cxx11", "riscv64-linux-gnu-libgfortran5-cxx11", "i686-linux-musl-libgfortran5-cxx11", "x86_64-linux-musl-libgfortran5-cxx11", "aarch64-linux-musl-libgfortran5-cxx11", "armv6l-linux-musleabihf-libgfortran5-cxx11", "armv7l-linux-musleabihf-libgfortran5-cxx11", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran5", "aarch64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran5-cxx11", "x86_64-w64-mingw32-libgfortran5-cxx11"]
script = """macos_sdk_version=10.14\nmacosx_deployment_target=10.14\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    # extract the tarball into the sys-root so all compilers pick it up\n    # automatically, and use --warning=no-unknown-keyword to hide harmless\n    # warnings about unsupported pax header keywords like \"SCHILY.fflags\"\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        --warning=no-unknown-keyword \\\n        MacOSX${macos_sdk_version}.sdk/System \\\n        MacOSX${macos_sdk_version}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd ${WORKSPACE}/srcdir/octave*\n\napk add texinfo\n\nexport CPPFLAGS=\"-I${includedir}\"\nexport TMPDIR=${WORKSPACE}/tmpdir\nmkdir -p ${TMPDIR}\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    LBT=\"blastrampoline-5\"\nelse\n    LBT=\"blastrampoline\"\nfi\n\n# Base configure flags\nFLAGS=(\n    --prefix=\"${prefix}\"\n    --build=${MACHTYPE}\n    --host=\"${target}\"\n    --enable-shared\n    --disable-static\n    --with-blas=\"-L${libdir} -l${LBT}\"\n    --with-lapack=\"-L${libdir} -l${LBT}\"\n    # Pretend to cross-compile all the time so that `configure` doesn't run programs built against libblastrampoline\n    cross_compiling=yes\n)\n\n./configure \"${FLAGS[@]}\"\nmake -j${nproc}\nmake install\n\ninstall_license COPYING\n"""
version = "v11.1.0"

