name = "Octave"
platforms = ["i686-linux-gnu-libgfortran5-cxx03", "i686-linux-gnu-libgfortran5-cxx11", "x86_64-linux-gnu-libgfortran5-cxx03", "x86_64-linux-gnu-libgfortran5-cxx11", "aarch64-linux-gnu-libgfortran5-cxx03", "aarch64-linux-gnu-libgfortran5-cxx11", "armv6l-linux-gnueabihf-libgfortran5-cxx03", "armv6l-linux-gnueabihf-libgfortran5-cxx11", "armv7l-linux-gnueabihf-libgfortran5-cxx03", "armv7l-linux-gnueabihf-libgfortran5-cxx11", "powerpc64le-linux-gnu-libgfortran5-cxx03", "powerpc64le-linux-gnu-libgfortran5-cxx11", "i686-linux-musl-libgfortran5-cxx03", "i686-linux-musl-libgfortran5-cxx11", "x86_64-linux-musl-libgfortran5-cxx03", "x86_64-linux-musl-libgfortran5-cxx11", "aarch64-linux-musl-libgfortran5-cxx03", "aarch64-linux-musl-libgfortran5-cxx11", "armv6l-linux-musleabihf-libgfortran5-cxx03", "armv6l-linux-musleabihf-libgfortran5-cxx11", "armv7l-linux-musleabihf-libgfortran5-cxx03", "armv7l-linux-musleabihf-libgfortran5-cxx11", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran5", "aarch64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran5-cxx03", "i686-w64-mingw32-libgfortran5-cxx11", "x86_64-w64-mingw32-libgfortran5-cxx03", "x86_64-w64-mingw32-libgfortran5-cxx11"]
script = """cd $WORKSPACE/srcdir/octave*\n\natomic_patch -p0 ../patches/freebsd_sig_atomic_t.patch\n\napk add texinfo\n\nexport CPPFLAGS=\"-I${includedir}\"\nexport TMPDIR=${WORKSPACE}/tmpdir\nmkdir -p ${TMPDIR}\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    LBT=\"blastrampoline-5\"\nelse\n    LBT=\"blastrampoline\"\nfi\n\n# Base configure flags\nFLAGS=(\n    --prefix=\"$prefix\"\n    --build=${MACHTYPE}\n    --host=\"${target}\"\n    --enable-shared\n    --disable-static\n    --with-blas=\"-L${libdir} -l${LBT}\"\n    --with-lapack=\"-L${libdir} -l${LBT}\"\n)\n\n./configure \"${FLAGS[@]}\"\nmake -j${nproc}\nmake install\n"""
version = "v9.4.0"

