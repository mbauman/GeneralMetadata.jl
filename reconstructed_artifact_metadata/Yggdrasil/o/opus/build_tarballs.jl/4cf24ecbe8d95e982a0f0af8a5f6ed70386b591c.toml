platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/opus-*/\n\n# On musl, disable stack protection (https://www.openwall.com/lists/musl/2018/09/11/2)\nif [[ ${target} == *musl* ]]; then\n    STACK_PROTECTOR=\"--disable-stack-protector\"\nfi\n\n./configure --prefix=$prefix --host=$target --build=${MACHTYPE} \\\n            --disable-static \\\n            --enable-custom-modes \\\n            ${STACK_PROTECTOR}\nmake -j${nproc}\nmake install\n"""
version = "v1.3.1"

