 "i686-w64-mingw32-cxx11-julia_version+1.13.0", "x86_64-w64-mingw32-cxx11-julia_version+1.13.0", "i686-linux-gnu-cxx11-julia_version+1.14.0", "x86_64-linux-gnu-cxx11-julia_version+1.14.0", "aarch64-linux-gnu-cxx11-julia_version+1.14.0", "powerpc64le-linux-gnu-cxx11-julia_version+1.14.0", "x86_64-linux-musl-cxx11-julia_version+1.14.0", "aarch64-linux-musl-cxx11-julia_version+1.14.0", "x86_64-apple-darwin-julia_version+1.14.0", "aarch64-apple-darwin-julia_version+1.14.0", "x86_64-unknown-freebsd-julia_version+1.14.0", "i686-w64-mingw32-cxx11-julia_version+1.14.0", "x86_64-w64-mingw32-cxx11-julia_version+1.14.0"]
script = """cd $WORKSPACE/srcdir\n\natomic_patch -p1 -d opencv_contrib patches/julia-bindings-upstream-contrib.patch\n\nmkdir build && cd build\nexport USE_QT=\"ON\"\n\n# Qt 6.10 requires CMake >= 3.22; use CMake_jll from the host prefix\napk del cmake\n\nif [[ \"${target}\" == *-apple-* ]] || [[ \"${target}\" == *-freebsd* ]]; then\n    atomic_patch -p1 -d../opencv ../patches/atomic_fix.patch\nfi\n\natomic_patch -p1 -d../opencv ../patches/vsx_power10_paren.patch\n\nif [[ \"${target}\" == *-w64-* ]]; then\n    export CXXFLAGS=\"-Wa,-mbig-obj\"\nfi\n\n# x86_64-apple-darwin shard sys-root is macOS 10.10; AVFoundation (10.13+)\n# and Qt 6.10's UniformTypeIdentifiers (11.0+) aren't available there.\nEXTRA_CMAKE=\"\"\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    EXTRA_CMAKE=\"-DWITH_AVFOUNDATION=OFF\"\n    export USE_QT=\"OFF\"\nfi\n\ncmake -DCMAKE_FIND_ROOT_PATH=${prefix} \\\n      -DJulia_PREFIX=${prefix} \\\n      -DWITH_JULIA=ON \\\n      -DJulia_FOUND=ON \\\n      -DHAVE_JULIA=ON \\\n      -DJulia_WORD_SIZE=${nbits} \\\n      -DJulia_INCLUDE_DIRS=${includedir}/julia \\\n      -DJulia_LIBRARY_DIR=${libdir} \\\n      -DJulia_LIBRARY=${libdir}/libjulia.${dlext} \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DCMAKE_CXX_STANDARD=11 \\\n      -DBUILD_TESTS=OFF \\\n      -DBUILD_PERF_TESTS=OFF \\\n      -DBUILD_EXAMPLES=OFF \\\n      -DHAVE_CXX_FVISIBILITY_HIDDEN=OFF \\\n      -DHAVE_CXX_FVISIBILITY_INLINES_HIDDEN=OFF \\\n      -DWITH_KLEIDICV=OFF \\\n      -DWITH_QT=${USE_QT} \\\n      -DOPENCV_EXTRA_MODULES_PATH=../opencv_contrib/modules \\\n      -DBUILD_LIST=core,imgproc,imgcodecs,highgui,videoio,dnn,features2d,objdetect,calib3d,video,gapi,stitching,julia \\\n      ${EXTRA_CMAKE} \\\n      ../opencv/\n\nmake -j${nproc}\nmake install\n\ncp lib/libopencv_julia.* ${libdir}/.\ncp -R OpenCV ${prefix}\n\ninstall_license ../opencv/{LICENSE,COPYRIGHT}\n"""
version = "v4.13.0"

