dependencies = ["Ogg_jll", "Opus_jll", "OpenSSL_jll"]
name = "opusfile"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\ncd opusfile-*\n\nif [[ \"${target}\" == *mingw* ]]; then\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/no-openssl-wincert.patch\"\nfi\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --with-pic\nmake -j${nproc}\nmake install\n"""
sources = [{"https://downloads.xiph.org/releases/opus/opusfile-0.11.tar.gz" = "74ce9b6cf4da103133e7b5c95df810ceb7195471e1162ed57af415fabf5603bf"}, "./bundled"]
version = "v0.11.0"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libopusurl"]
type = "lib"
variable_name = "libopusurl"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libopusfile"]
type = "lib"
variable_name = "libopusfile"
