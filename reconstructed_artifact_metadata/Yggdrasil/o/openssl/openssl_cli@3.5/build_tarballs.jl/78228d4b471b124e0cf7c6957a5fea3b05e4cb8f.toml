augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "OpenSSL_CLI"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """# Copy the openssl executable from OpenSSL_jll\ninstall -Dvm 755 \"${bindir}/openssl${exeext}\" \"${bindir}/openssl${exeext}\"\n\n# Install the license from OpenSSL_jll\ninstall_license ${prefix}/share/licenses/OpenSSL/LICENSE*\n"""
sources = []
version = "v3.5.6"

[[dependencies]]
compat = "~3.5.6"
name = "OpenSSL_jll"
platforms = ["any"]
top_level = false
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0

[[products]]
binnames = ["openssl"]
type = "exe"
variable_name = "openssl"
