dependencies = []
name = "OpenSpecFun"
platforms = ["i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran3", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "arm-linux-gnueabihf-libgfortran3", "arm-linux-gnueabihf-libgfortran4", "arm-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran3", "powerpc64le-linux-gnu-libgfortran4", "powerpc64le-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran3", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran3", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran3", "aarch64-linux-musl-libgfortran4", "aarch64-linux-musl-libgfortran5", "arm-linux-musleabihf-libgfortran3", "arm-linux-musleabihf-libgfortran4", "arm-linux-musleabihf-libgfortran5", "x86_64-apple-darwin14-libgfortran3", "x86_64-apple-darwin14-libgfortran4", "x86_64-apple-darwin14-libgfortran5", "x86_64-unknown-freebsd11.1-libgfortran3", "x86_64-unknown-freebsd11.1-libgfortran4", "x86_64-unknown-freebsd11.1-libgfortran5", "i686-w64-mingw32-libgfortran3", "i686-w64-mingw32-libgfortran4", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran3", "x86_64-w64-mingw32-libgfortran4", "x86_64-w64-mingw32-libgfortran5"]
script = """cd $WORKSPACE/srcdir\ncd openspecfun-*/\n\n# It needs to be told it's on Windows\nif [[ ${target} == *mingw* ]]; then\n    OS=WINNT\n    libdir=$prefix/bin\nelif [[ ${target} == *darwin* ]]; then\n    OS=Darwin\nfi\n\n# Build it\nmake OS=${OS} CC=\"$CC\" CXX=\"$CXX\" FC=\"$FC\" -j${nproc}\n\n# Install it\nmake install OS=${OS} prefix=$prefix\n"""
version = "v0.5.3"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libopenspecfun"]
type = "lib"
variable_name = "libopenspecfun"

