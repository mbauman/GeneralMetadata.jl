augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "OpenPolicyAgent"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """# opa requires goversioninfo if building for Windows\n# it uses this tool as part of the build process so we need to build it for linux, not windows\n# however the BB go wrapper script sets windows in it, so we have to use the underlying go command\nif [[ \"${target}\" == *-w64-* ]]; then\n    cd $WORKSPACE/srcdir/goversioninfo/\n    GOOS=linux GOEXE=\"\" GOARCH=amd64 /opt/x86_64-linux-musl/go/bin/go install ./cmd/goversioninfo\n    export PATH=$PATH:$GOPATH/bin\nfi\n\ncd $WORKSPACE/srcdir/opa/\nCGO_ENABLED=0 WASM_ENABLED=0 make build\nmkdir -p $bindir\ninstall -Dvm 755 opa_* $bindir/opa${exeext}\ninstall_license LICENSE\n"""
version = "v1.5.1"

[[products]]
binnames = ["opa"]
type = "exe"
variable_name = "opa"

