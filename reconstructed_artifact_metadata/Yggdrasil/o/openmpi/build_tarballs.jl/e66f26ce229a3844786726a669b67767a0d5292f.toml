dependencies = []
name = "OpenMPI"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1"]
script = """# Enter the funzone\ncd ${WORKSPACE}/srcdir/openmpi-*\n\n./configure --prefix=$prefix --host=$target --enable-shared=yes --enable-static=no --disable-mpi-fortran\n\n# Build the library\nmake \"${flags[@]}\" -j${nproc}\n\n# Install the library\nmake \"${flags[@]}\" install\n\n"""
version = "v4.0.2"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libmpi"]
type = "lib"
variable_name = "libmpi"

[[sources]]
"https://download.open-mpi.org/release/open-mpi/v4.0/openmpi-4.0.2.tar.gz" = "662805870e86a1471e59739b0c34c6f9004e0c7a22db068562d5388ec4421904"
