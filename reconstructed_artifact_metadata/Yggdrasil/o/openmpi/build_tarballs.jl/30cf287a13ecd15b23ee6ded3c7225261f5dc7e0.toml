julia_compat = "1.6"
lazy_artifacts = false
name = "OpenMPI"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-apple-darwin", "armv6l-linux-musleabihf"]
script = """# Enter the funzone\ncd ${WORKSPACE}/srcdir/openmpi-*\n\nif [[ \"${target}\" == *-freebsd* ]]; then\n    # Help compiler find `complib/cl_types.h`.\n    export CPPFLAGS=\"-I/opt/${target}/${target}/sys-root/include/infiniband\"\nfi\n\n./configure --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --enable-shared=yes \\\n    --enable-static=no \\\n    --disable-mpi-fortran \\\n    --without-cs-fs\n\n# Build the library\nmake -j${nproc}\n\n# Install the library\nmake install\n"""
version = "v4.1.1"

