augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "OpenSSH"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\n\ninstall_license openssh-portable/LICENCE\nPRODUCTS=(ssh${exeext} ssh-add${exeext} ssh-keygen${exeext} ssh-keyscan${exeext} ssh-agent${exeext} scp${exeext})\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    cd \"${target}/OpenSSH-Win${nbits}\"\nelse\n    cd openssh-portable\n\n    # Remove OpenSSL from the sysroot to avoid confusion\n    rm -f /opt/${target}/${target}/sys-root/usr/lib/libcrypto.*\n    rm -f /opt/${target}/${target}/sys-root/usr/lib/libssl.*\n    rm -f /lib/libcrypto.so*\n    rm -f /usr/lib/libcrypto.so*\n\n    export CPPFLAGS=\"-I${includedir}\"\n    autoreconf -vi\n    ./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\n    make -j${nproc} \"${PRODUCTS[@]}\"\nfi\n\nmkdir -p ${bindir}\nfor binary in \"${PRODUCTS[@]}\"; do\n    install -c -m 0755 $binary ${bindir}/$binary\ndone\n"""
version = "v8.9.0"

