name = "OCCT"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd ${WORKSPACE}/srcdir/OCCT\nif [[ ${target} == *musl* ]]; then\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/OSD_MemInfo.cxx.patch\"\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/OSD_signal.cxx.patch\"\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/Standard_StackTrace.cxx.patch\"\nelif [[ ${target} == *mingw* ]]; then\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/CMakeLists.txt.patch\"\nelif [[ ${target} == *freebsd* ]]; then\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/Standard_CString.cxx.patch\"\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/Standard_StackTrace.cxx.patch\"\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/STEPConstruct_AP203Context.cxx.patch\"\nfi\nmkdir build\ncd build\ncmake -Wno-dev .. \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_LIBRARY_TYPE=Shared \\\n    -DBUILD_MODULE_Draw=0 \\\n    -DBUILD_MODULE_Visualization=0 \\\n    -DBUILD_MODULE_ApplicationFramework=0\nmake -j${nproc}\nmake install\ninstall_license ../LICENSE_LGPL_21.txt ../OCCT_LGPL_EXCEPTION.txt\n"""
version = "v7.9.3"

