name = "OpenFHE_int128"
platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/openfhe-development/\n\n# Set proper install directories for libraries on Windows\nif [[ \"${target}\" == *-mingw* ]]; then\n  atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/windows-fix-cmake-libdir.patch\"\nfi\n\nmkdir build && cd build\n\ncmake .. \\\n  -DCMAKE_INSTALL_PREFIX=$prefix \\\n  -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DWITH_BE2=ON \\\n  -DWITH_BE4=ON \\\n  -DBUILD_UNITTESTS=OFF \\\n  -DBUILD_BENCHMARKS=OFF \\\n  -DNATIVE_SIZE=128\nmake -j${nproc}\nmake install\n"""
version = "v1.2.3"

