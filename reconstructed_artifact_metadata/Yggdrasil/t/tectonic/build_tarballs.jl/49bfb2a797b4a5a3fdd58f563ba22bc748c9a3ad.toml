script = """cd $WORKSPACE/srcdir/tectonic-*/\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    export RUSTFLAGS=\"-Clink-args=-L${libdir}\"\nfi\n\ncargo build --release --locked --features external-harfbuzz\ncp target/${rust_target}/release/tectonic${exeext} ${bindir}/\n"""
version = "v0.9.0"

