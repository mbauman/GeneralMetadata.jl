init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "TDLib"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11"]
script = """apk add gperf\ncd td/\ninstall_license LICENSE_1_0.txt\nsed -i 's|TD_HAS_MMSG 1|TD_HAS_MMSG 0|' tdutils/td/utils/port/config.h  # otherwise not compatible with old glibc\nmkdir build\ncd build\ncmake -DCMAKE_BUILD_TYPE=Release -DZLIB_LIBRARY=$libdir -DZLIB_INCLUDE_DIR=$includedir ..\nfor f in $(grep -l $(find . -name link.txt) -e 'opt/bin/c++')\ndo\n    # without this flag it cannot find libz\n    sed -i ' 1 s/$/ -lz/' $f\ndone\ncmake --build . -j${nproc}\ncp libtdjson.${dlext} $libdir/libtdjson.${dlext}\n"""
version = "v1.6.10"

[[dependencies]]
name = "OpenSSL_jll"
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0
[[dependencies]]
name = "Zlib_jll"
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["libtdjson"]
type = "lib"
variable_name = "libtdjson"

