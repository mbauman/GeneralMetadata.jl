name = "TempestRemap"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd ${WORKSPACE}/srcdir/tempestremap*\n\nexport CPPFLAGS=\"-I${includedir}\"\nexport LDFLAGS=\"-L${libdir}\"\nexport LDFLAGS_MAKE=\"${LDFLAGS}\"\nif [[ \"${target}\" == *-mingw* ]]; then\n    LDFLAGS_MAKE+=\" -no-undefined\"\nfi\n\nif [[ \"${target}\" == aarch64-apple-darwin* ]]; then\n    # aclocal.m4 has some lines where it expects `MACOSX_DEPLOYMENT_TARGET` to be up to\n    # version 10.  Let's pretend to be 10.16, as many tools do to make old build systems\n    # happy.\n    export MACOSX_DEPLOYMENT_TARGET=\"10.16\"\nfi\nCONFIGURE_OPTIONS=\"\"\n\nautoreconf -fiv\nmkdir -p build && cd build\n\n../configure \\\n  --prefix=${prefix} \\\n  --host=${target} \\\n  --with-blas=openblas \\\n  --with-lapack=openblas \\\n  --with-netcdf=${prefix} \\\n  --enable-shared \\\n  --disable-static\n\nmake LDFLAGS=\"${LDFLAGS_MAKE}\" -j${nproc} all\nmake install\n\ninstall_license ../LICENSE\n"""
version = "v2.2.0"

