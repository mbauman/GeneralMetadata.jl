name = "TempestRemap"
platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "x86_64-apple-darwin"]
script = """cd ${WORKSPACE}/srcdir/tempestremap*\n\nexport CPPFLAGS=\"-I${includedir}\"\nexport LDFLAGS=\"-L${libdir}\"\nexport LDFLAGS_MAKE=\"${LDFLAGS}\"\nCONFIGURE_OPTIONS=\"\"\n\nautoreconf -fiv\nmkdir -p build && cd build\n\n../configure \\\n  --prefix=${prefix} \\\n  --host=${target} \\\n  --with-blas=blastrampoline \\\n  --with-lapack=blastrampoline \\\n  --with-netcdf=${prefix} \\\n  --with-hdf5=${prefix} \\\n  --enable-shared \\\n  --disable-static\n\nmake LDFLAGS=\"${LDFLAGS_MAKE}\" -j${nproc} all\nmake install\n\ninstall_license ../LICENSE\n"""
version = "v2.1.1"

