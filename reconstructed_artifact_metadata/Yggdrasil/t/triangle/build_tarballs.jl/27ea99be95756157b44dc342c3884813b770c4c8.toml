augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Triangle"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """\ncd $WORKSPACE/srcdir/Triangle\n\nmkdir -p \"${libdir}\"\n\nGENERICFLAGS=(-DREAL=double  -DTRILIBRARY  -DNDEBUG -DNO_TIMER -DEXTERNAL_TEST)\n\nif [[ \"${target}\" == x86_64-w64-mingw32 ]]; then\n    ARCHFLAGS=(-DULONG=\"unsigned long long\")\nelse\n    ARCHFLAGS=(-DULONG=\"unsigned long\")\nfi\n\n$CC \"${ARCHFLAGS[@]}\"  \"${GENERICFLAGS[@]}\" -O3 -fPIC -shared -o \"${libdir}/libtriangle.${dlext}\" triangle.c triwrapjulia.c\n\n# Triangle's struct layout depends on REAL.  libtriangle is built with\n# REAL=double; prepend a default to triangle.h so header consumers match\n# that ABI without having to define REAL themselves.\nmkdir -p ${includedir}\n{\n    echo '#ifndef REAL'\n    echo '#define REAL double'\n    echo '#endif'\n    cat triangle.h\n} > ${includedir}/triangle.h\n\ninstall_license README\n"""
version = "v1.6.3"

