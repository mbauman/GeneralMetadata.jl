name = "TOPCOM"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-apple-darwin", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/topcom-*\nfor f in ../patches/*.patch; do\n    atomic_patch -p1 ${f}\ndone\nif [[ $target == *mingw* ]]; then\n    # unfortunately we cannot used shared libraries on windows because of circular dependencies\n    # until this improves the following extra ldflag is not needed\n    # sed -i '/_la_LDFLAGS/ s/$/ -no-undefined/g' lib-src/Makefile.am lib-src-reg/Makefile.am\n    libopts=\"--enable-static --disable-shared\"\nelse\n    libopts=\"--enable-shared --disable-static\"\nfi\nautoreconf -vi\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} CPPFLAGS=\"-I${includedir}/cddlib -I${includedir}\" $libopts\nmake -j${nproc}\nmake install\n"""
version = "v0.17.8"

