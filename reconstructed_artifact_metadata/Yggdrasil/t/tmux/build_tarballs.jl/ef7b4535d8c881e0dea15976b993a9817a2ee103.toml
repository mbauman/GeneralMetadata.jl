dependencies = ["libevent_jll", "Ncurses_jll"]
name = "tmux"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1"]
script = """cd $WORKSPACE/srcdir/tmux-*/\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\n\n"""
version = "v3.0.0-a"

[[products]]
binnames = ["tmux"]
type = "exe"
variable_name = "tmux"

