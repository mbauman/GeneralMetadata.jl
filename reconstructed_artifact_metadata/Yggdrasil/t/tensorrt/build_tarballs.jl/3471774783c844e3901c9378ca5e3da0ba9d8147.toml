dlopen_flags = []
dont_dlopen = false
libnames = ["libnvonnxparser", "nvonnxparser"]
type = "lib"
variable_name = "libnvonnxparser"
[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["libnvparsers", "nvparsers"]
type = "lib"
variable_name = "libnvparsers"
[[products]]
binnames = ["trtexec"]
type = "exe"
variable_name = "trtexec"

