augment_platform_block = ""
init_block = ""
julia_compat = "1.0"
lazy_artifacts = true
name = "TensorRT"
platforms = ["x86_64-linux-gnu-cuda+10.2", "x86_64-w64-mingw32-cuda+10.2", "aarch64-linux-gnu-cuda+10.2", "x86_64-linux-gnu-cuda+11.0", "x86_64-w64-mingw32-cuda+11.0", "x86_64-linux-gnu-cuda+11.1", "x86_64-w64-mingw32-cuda+11.1", "x86_64-linux-gnu-cuda+11.2", "x86_64-w64-mingw32-cuda+11.2", "x86_64-linux-gnu-cuda+11.3", "powerpc64le-linux-gnu-cuda+11.3", "x86_64-w64-mingw32-cuda+11.3", "aarch64-linux-gnu-cuda+11.3"]
script = """cd ${WORKSPACE}/srcdir\n\nif [[ ${bb_full_target} == aarch64-linux-gnu*cuda+10.2 ]]; then\n    apk add dpkg\n    ls *.deb | xargs -Ideb_file dpkg-deb -x deb_file tmp\n    mkdir -p $bindir $includedir $libdir\n    install -Dv --mode=755 tmp/usr/src/tensorrt/bin/* $bindir\n    install -Dv --mode=644 tmp/usr/include/$target/* $includedir\n    install -Dv --mode=755 tmp/usr/lib/$target/*.so* $libdir\n    install_license tmp/usr/share/doc/libnvinfer8/copyright\nelse\n    mkdir -p ${bindir} ${libdir} ${includedir}\n    cd TensorRT*\n    mv bin/* ${bindir}\n    mv include/* ${includedir}\n    mv lib/*.${dlext}* ${libdir}\n\n    if [[ ${target} == x86_64-w64-mingw32 ]]; then\n        chmod +x ${bindir}/*.{dll,exe}\n        install_license doc/TensorRT-SLA.pdf \n    else\n        install_license doc/pdf/TensorRT-SLA.pdf \n    fi\nfi\n"""
version = "v8.0.1"

[[dependencies]]
compat = "8.2"
name = "CUDNN_jll"
platforms = ["any"]
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0

