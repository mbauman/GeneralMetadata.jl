augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "TypeDBDriverClib"
platforms = ["x86_64-linux-gnu", "aarch64-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/typedb-driver\n\n# c/Cargo.toml (auto-generated by TypeDB's Bazel sync tool) does not declare\n# crate-type = [\"cdylib\"].  Patch it in-place so that `cargo build` produces\n# a C-ABI shared library (.dylib/.so/.dll).\nsed -i 's/path = \"src\\/lib.rs\"/path = \"src\\/lib.rs\"\\ncrate-type = [\"cdylib\"]/' c/Cargo.toml\n\n# typedb-protocol (a git dependency) has a build.rs that calls tonic_build\n# which invokes protoc.  Make the host protoc binary visible to prost-build.\nexport PROTOC=$(which protoc)\n\n# BinaryBuilder sets `rust_target` for cross-compilation.\ncargo build --release -p typedb_driver_clib\n\ninstall -Dvm 755 \"target/${rust_target}/release\"/*typedb_driver_clib.${dlext} -t  \"${libdir}\"\n"""
version = "v3.8.1"

[[dependencies]]
compat = ""
name = "protoc_jll"
platforms = ["any"]
top_level = false
type = "hostdependency"
version-major = 0
version-minor = 0
version-patch = 0

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["libtypedb_driver_clib", "typedb_driver_clib"]
type = "lib"
variable_name = "libtypedb_driver_clib"

