name = "Thermopack"
platforms = ["i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran5", "armv6l-linux-gnueabihf-libgfortran5", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran5", "riscv64-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran5", "armv6l-linux-musleabihf-libgfortran5", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran5", "aarch64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran5"]
script = """cd ${WORKSPACE}/srcdir/thermopack\n\n# Patch CMakeLists.txt to remove architecture-specific flags (not allowed by BinaryBuilder)\nsed -i 's/-march=x86-64 -msse2//g' CMakeLists.txt\nsed -i 's/-arch arm64 -fno-expensive-optimizations//g' CMakeLists.txt\n# Remove static libquadmath flag (not supported on all platforms)\nsed -i 's/-static-libquadmath//g' src/CMakeLists.txt\n\n# Create build directory\nmkdir build\ncd build\n\n# Configure with CMake\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBLAS_LIBRARIES=\"-L${libdir} -lopenblas\" -DLAPACK_LIBRARIES=\"-L${libdir} -lopenblas\" ..\n\n# Build\nmake -j${nproc}\nmake install\n\n# Install manually (thermopack's CMake install doesn't respect CMAKE_INSTALL_PREFIX)\ncp -v thermopack/libthermopack.${dlext} ${libdir}/\ninstall_license ../LICENSE-MIT ../LICENSE-APACHE\n"""
version = "v2.2.4"

