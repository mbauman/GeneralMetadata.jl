lazy_artifacts = false
name = "Torch"
platforms = ["x86_64-linux-gnu-cxx11"]
script = """cd $WORKSPACE/srcdir\n\nmv cudnn $prefix\nmv libtorch/share/* $prefix/share/\nmv libtorch/lib/* $prefix/lib/\nrm -r libtorch/lib\nrm -r libtorch/share\nmv libtorch/* $prefix\nrm -r libtorch\n\nmkdir -p /usr/local/cuda/lib64\ncd /usr/local/cuda/lib64\nln -s ${prefix}/cuda/lib64/libcudart.so libcudart.so\nln -s ${prefix}/cuda/lib64/libnvToolsExt.so libnvToolsExt.so\n\ncd $WORKSPACE/srcdir/Torch.jl/build\nmkdir build && cd build\ncmake -DCMAKE_PREFIX_PATH=$prefix -DTorch_DIR=$prefix/share/cmake/Torch -DCUDA_TOOLKIT_ROOT_DIR=$prefix/cuda ..\ncmake --build .\n\nmkdir -p \"${libdir}\"\ncp -r $WORKSPACE/srcdir/Torch.jl/build/build/*.${dlext} \"${libdir}\"\nrm -rf $prefix/cuda\ninstall_license ${WORKSPACE}/srcdir/Torch.jl/LICENSE\n"""
version = "v1.4.0"

[[dependencies]]
name = "CUDA_full_jll"
type = "builddependency"
version-major = 10
version-minor = 1
version-patch = 243
[[dependencies]]
name = "CompilerSupportLibraries_jll"
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0

