dependencies = []
name = "XZ"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """if [ ${target} = \"x86_64-w64-mingw32\" ]; then\n    mkdir -p ${WORKSPACE}/destdir/bin/\n    cp bin_x86-64/liblzma.dll ${WORKSPACE}/destdir/bin/\nelif [ ${target} = \"i686-w64-mingw32\" ]; then\n    mkdir -p ${WORKSPACE}/destdir/bin/\n    cp bin_i686/liblzma.dll ${WORKSPACE}/destdir/bin/\nelse\n    cd $WORKSPACE/srcdir/xz-*\n    ./configure --prefix=${prefix} --host=${target} --with-pic CFLAGS=\"${CFLAGS} -fPIC\" CXXFLAGS=\"${CXXFLAGS} -fPIC\"\n    make -j${nproc}\n    make install\nfi\n"""
version = "v5.2.4"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["liblzma"]
type = "lib"
variable_name = "liblzma"

