dependencies = ["Xorg_scrnsaverproto_jll", "Xorg_libXext_jll", "Xorg_util_macros_jll"]
name = "Xorg_libXScrnSaver"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-unknown-freebsd11.1"]
script = """cd $WORKSPACE/srcdir/libXScrnSaver-*/\nCPPFLAGS=\"-I${prefix}/include\"\n# When compiling for things like ppc64le, we need newer `config.sub` files\nupdate_configure_scripts\n./configure --prefix=${prefix} --host=${target} --enable-malloc0returnsnull=no\nmake -j${nproc}\nmake install\n"""
version = "v1.2.3"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libXss"]
type = "lib"
variable_name = "libXScrnSaver"

