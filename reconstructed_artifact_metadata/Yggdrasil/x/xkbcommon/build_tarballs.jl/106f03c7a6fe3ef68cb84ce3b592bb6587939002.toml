dependencies = ["Xorg_xkeyboard_config_jll", "Xorg_libxcb_jll", "Wayland_jll", "Wayland_protocols_jll"]
name = "xkbcommon"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/libxkbcommon-*/\n\n# We need to run `wayland-scanner` on the host system\napk add wayland-dev\n\natomic_patch -p1 ../patches/meson_build.patch\natomic_patch -p1 ../patches/meson_options.patch\n\nmkdir build && cd build\nmeson .. --cross-file=\"${MESON_TARGET_TOOLCHAIN}\" \\\n    -Denable-docs=false \\\n    -Dnative-wayland-scanner=\"/usr/bin/wayland-scanner\"\nninja -j${nproc}\nninja install\n"""
sources = [{"https://xkbcommon.org/download/libxkbcommon-0.9.1.tar.xz" = "d4c6aabf0a5c1fc616f8a6a65c8a818c03773b9a87da9fbc434da5acd1199be0"}, "./bundled"]
version = "v0.9.1"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libxkbcommon"]
type = "lib"
variable_name = "libxkbcommon"
