init_block = ""
lazy_artifacts = false
name = "xkbcommon"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/libxkbcommon-*/\n\n# We need to run `wayland-scanner` on the host system\napk add wayland-dev\n\natomic_patch -p1 ../patches/meson_build.patch\natomic_patch -p1 ../patches/meson_options.patch\n\nmkdir build && cd build\nmeson .. --cross-file=\"${MESON_TARGET_TOOLCHAIN}\" \\\n    -Denable-docs=false \\\n    -Dnative-wayland-scanner=\"/usr/bin/wayland-scanner\"\nninja -j${nproc}\nninja install\n"""
version = "v0.9.1"

