dependencies = ["Xorg_xcb_util_jll"]
name = "Xorg_xcb_util_renderutil"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-unknown-freebsd11.1"]
script = """cd $WORKSPACE/srcdir/xcb-util-renderutil-*/\nCPPFLAGS=\"-I${prefix}/include\"\n# When compiling for things like ppc64le, we need newer `config.sub` files\nupdate_configure_scripts\n./configure --prefix=${prefix} --host=${target} --enable-malloc0returnsnull=no\nmake -j${nproc}\nmake install\n"""
version = "v0.3.9"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libxcb-render-util"]
type = "lib"
variable_name = "libxcb_render_util"

[[sources]]
"https://xcb.freedesktop.org/dist/xcb-util-renderutil-0.3.9.tar.bz2" = "c6e97e48fb1286d6394dddb1c1732f00227c70bd1bedb7d1acabefdd340bea5b"
