name = "XGBoost"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx03", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """# apple builds require a newer SDK (at least v12 to cover both x86_64 and aarch64) based on build info here:\n# https://github.com/dmlc/xgboost/blob/910c34b971b06861e66d3850714540b0697001e1/ops/pipeline/build-python-wheels-macos.sh#L14-L24\nif [[ $target == *\"apple-darwin\"* ]]; then\n    apple_sdk_root=$WORKSPACE/srcdir/MacOSX14.0.sdk\n    sed -i \"s!/opt/$bb_target/$bb_target/sys-root!$apple_sdk_root!\" $CMAKE_TARGET_TOOLCHAIN\n    sed -i \"s!/opt/$bb_target/$bb_target/sys-root!$apple_sdk_root!\" /opt/bin/$bb_full_target/$target-clang++\n    export MACOSX_DEPLOYMENT_TARGET=12\nfi\n\n# remove default cmake to use newer version from build dependency\napk del cmake\n\n# now build library\ncd ${WORKSPACE}/srcdir/xgboost\ngit submodule update --init\n\nmkdir build && cd build\ncmake .. -DCMAKE_INSTALL_PREFIX=${prefix} \\\n        -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\nmake -j${nproc}\n\n# move out of the build folder - the install script runs at the level of the xgboost directory\ncd ..\n# Manual installation, to avoid installing dmlc\n    for header in include/xgboost/*.h; do\n        install -Dv \"${header}\" \"${includedir}/xgboost/$(basename ${header})\"\n    done\n\nif [[ ${target} == *mingw* ]]; then\n    install -Dvm 0755 lib/xgboost.dll ${libdir}/xgboost.dll\nelse\n    install -Dvm 0755 lib/libxgboost.${dlext} ${libdir}/libxgboost.${dlext}\nfi\n\ninstall_license LICENSE\n"""
version = "v2.1.5"

