lazy_artifacts = false
name = "XGBoost"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin14-cxx03", "x86_64-apple-darwin14-cxx11", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd ${WORKSPACE}/srcdir/xgboost\n\ngit submodule init\ngit submodule update\n\n# Patch dmlc-core to use case-sensitive windows.h includes\n(cd dmlc-core && atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/dmlc_windows_h.patch\")\n\n# For Linux, build using CMake\nif [[ ${target} == *linux* ]]; then\n    (mkdir build; cd build; cmake .. -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\")\n    make -C build -j ${nproc}\nelse\n    if [[ ${target} == *mingw* ]]; then\n        # Target Windows specifically\n        EXTRA_FLAGS=(UNAME=Windows)\n    fi\n\n    # Otherwise, build with `make`, and do a minimal build\n    cp make/minimum.mk config.mk\n    make -j ${nproc} ${EXTRA_FLAGS[@]}\nfi\n\n# Install\nmkdir -p ${prefix}/{bin,include,lib}\ncp -ra include/xgboost ${prefix}/include/\ncp -a xgboost ${prefix}/bin/xgboost${exeext}\n\n# We also need to bundle `libgomp`, so snarf it from the\n# compiler support directory while we copy our main bundle of joy\nif [[ ${target} == *mingw* ]]; then\n    cp -a lib/xgboost.dll ${prefix}/bin\nelse\n    cp -a lib/libxgboost.${dlext} ${prefix}/lib\nfi\n"""
version = "v0.82.0"

