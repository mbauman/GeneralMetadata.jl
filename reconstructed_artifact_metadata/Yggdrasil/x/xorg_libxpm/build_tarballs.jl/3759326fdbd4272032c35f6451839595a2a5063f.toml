dependencies = ["X11_jll", "Xorg_xproto_jll", "Gettext_jll"]
name = "Xorg_libXpm"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-unknown-freebsd11.1"]
script = """cd $WORKSPACE/srcdir/libXpm-*/\n# We need a native xgettext\napk add gettext\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\n"""
version = "v3.5.13"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libXpm"]
type = "lib"
variable_name = "libXpm"

