name = "Xorg_libX11"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-unknown-freebsd11.1"]
script = """cd $WORKSPACE/srcdir/libX11-*/\nCPPFLAGS=\"-I${prefix}/include\"\n# When compiling for things like ppc64le, we need newer `config.sub` files\nupdate_configure_scripts\n./configure --prefix=${prefix} --host=${target} --enable-malloc0returnsnull=no\n# For some obscure reason, this Makefile may not get the value of CPPFLAGS\nsed -i \"s?CPPFLAGS = ?CPPFLAGS = ${CPPFLAGS}?\" src/util/Makefile\nmake -j${nproc}\nmake install\n"""
version = "v1.6.9"

