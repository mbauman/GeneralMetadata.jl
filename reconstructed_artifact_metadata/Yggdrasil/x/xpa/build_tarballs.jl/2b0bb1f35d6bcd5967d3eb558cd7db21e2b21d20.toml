dependencies = []
lazy_artifacts = false
name = "XPA"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/xpa\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j$(nproc)\nif [[ ${target} == *mingw* ]]; then\n    # Target Windows specifically until https://github.com/ericmandel/xpa/pull/11 is merged and released\n    # absolutely filthy hack edits generated Makefile manually\n    sed -i 's/$(INSTALL_PROGRAM) $$i$(EXE)/$(INSTALL_PROGRAM) $$i/' Makefile\nfi\nmake install\n"""
version = "v2.1.19"

