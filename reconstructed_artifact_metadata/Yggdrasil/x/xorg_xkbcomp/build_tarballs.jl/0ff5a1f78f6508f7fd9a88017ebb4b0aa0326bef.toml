dependencies = ["Xorg_libxkbfile_jll", "Xorg_util_macros_jll"]
name = "Xorg_xkbcomp"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-unknown-freebsd11.1"]
script = """cd $WORKSPACE/srcdir/xkbcomp-*\n./configure --prefix=${prefix} --host=${target}\nmake -j${nproc}\nmake install\n"""
version = "v1.4.2"

[[products]]
binnames = ["xkbcomp"]
type = "exe"
variable_name = "xkbcomp"

