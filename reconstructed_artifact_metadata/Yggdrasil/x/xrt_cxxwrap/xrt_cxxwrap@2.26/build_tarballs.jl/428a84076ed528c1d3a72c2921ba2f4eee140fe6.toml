name = "xrt_cxxwrap"
platforms = ["x86_64-linux-gnu-cxx11-julia_version+1.10.0", "x86_64-w64-mingw32-cxx11-julia_version+1.10.0", "x86_64-linux-gnu-cxx11-julia_version+1.11.1", "x86_64-w64-mingw32-cxx11-julia_version+1.11.1", "x86_64-linux-gnu-cxx11-julia_version+1.12.0", "x86_64-w64-mingw32-cxx11-julia_version+1.12.0", "x86_64-linux-gnu-cxx11-julia_version+1.13.0", "x86_64-w64-mingw32-cxx11-julia_version+1.13.0", "x86_64-linux-gnu-cxx11-julia_version+1.14.0", "x86_64-w64-mingw32-cxx11-julia_version+1.14.0"]
script = """XRT_VER_MM=2.26\ncd ${WORKSPACE}/srcdir/XRT.jl\ninstall_license LICENSE\ncd deps/xrt_cxxwrap\n\ncmake -S . -B build \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_PREFIX_PATH=${prefix} \\\n    -DJlCxx_DIR=${prefix}/lib/cmake/JlCxx \\\n    -DJulia_PREFIX=${prefix} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_CXX_STANDARD=17 \\\n    -DXILINX_XRT=${prefix} \\\n    -DLIB_UUID_DIR=${prefix} \\\n    -DLIB_BOOST_DIR=${prefix} \\\n    -DXRT_VERSION_NUMBER=${XRT_VER_MM}\n\nVERBOSE=ON cmake --build build --config Release --target install -- -j${nproc}\n"""
version = "v2.26.1"

