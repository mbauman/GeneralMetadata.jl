dependencies = ["Xorg_xcb_util_jll"]
name = "Xorg_xcb_util_wm"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-unknown-freebsd11.1"]
script = """cd $WORKSPACE/srcdir/xcb-util-wm-*/\nCPPFLAGS=\"-I${prefix}/include\"\n# When compiling for things like ppc64le, we need newer `config.sub` files\nupdate_configure_scripts\n./configure --prefix=${prefix} --host=${target} --enable-malloc0returnsnull=no\nmake -j${nproc}\nmake install\n"""
version = "v0.4.1"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libxcb-ewmh"]
type = "lib"
variable_name = "libxcb_ewmh"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libxcb-icccm"]
type = "lib"
variable_name = "libxcb_icccm"

