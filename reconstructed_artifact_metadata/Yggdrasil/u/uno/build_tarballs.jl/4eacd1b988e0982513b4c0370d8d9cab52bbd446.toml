julia_compat = "1.9"
lazy_artifacts = false
name = "Uno"
platforms = ["i686-linux-gnu-libgfortran5-cxx11", "x86_64-linux-gnu-libgfortran5-cxx11", "aarch64-linux-gnu-libgfortran5-cxx11", "armv6l-linux-gnueabihf-libgfortran5-cxx11", "armv7l-linux-gnueabihf-libgfortran5-cxx11", "powerpc64le-linux-gnu-libgfortran5-cxx11", "i686-linux-musl-libgfortran5-cxx11", "x86_64-linux-musl-libgfortran5-cxx11", "aarch64-linux-musl-libgfortran5-cxx11", "armv6l-linux-musleabihf-libgfortran5-cxx11", "armv7l-linux-musleabihf-libgfortran5-cxx11", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran5-cxx11", "x86_64-w64-mingw32-libgfortran5-cxx11"]
script = """cd $WORKSPACE/srcdir/Uno\nmkdir -p build\ncd build\n\nif [[ \"${target}\" == *mingw* ]]; then\n    LBT=blastrampoline-5\n    HIGHS_DIR=${prefix}/lib\nelse\n    LBT=blastrampoline\n    HIGHS_DIR=${libdir}\nfi\n\n# FortranCInterface_VERIFY fails on macOS, but it's not actually needed for the current build\nsed -i 's/FortranCInterface_VERIFY(CXX)/# FortranCInterface_VERIFY(CXX)/g' ../CMakeLists.txt\n\ncmake \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_PREFIX_PATH=${libdir} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DAMPLSOLVER=${libdir}/libasl.${dlext} \\\n    -DHIGHS_DIR=${HIGHS_DIR} \\\n    -DBQPD=${prefix}/lib/libbqpd.a \\\n    -DHSL=${libdir}/libhsl.${dlext} \\\n    -DBLA_VENDOR=\"libblastrampoline\" \\\n    -DMUMPS_INCLUDE_DIR=${includedir} \\\n    -DMETIS_INCLUDE_DIR=${includedir} \\\n    -DMUMPS_LIBRARY=\"${libdir}/libdmumps.${dlext}\" \\\n    -DMUMPS_COMMON_LIBRARY=\"${libdir}/libmumps_common.${dlext}\" \\\n    -DMUMPS_PORD_LIBRARY=\"${libdir}/libpord.${dlext}\" \\\n    -DMUMPS_MPISEQ_LIBRARY=\"${libdir}/libmpiseq.${dlext}\" \\\n    -DBLAS_LIBRARIES=\"${libdir}/lib${LBT}.${dlext}\" \\\n    -DLAPACK_LIBRARIES=\"${libdir}/lib${LBT}.${dlext}\" \\\n    -DBUILD_STATIC_LIBS=ON \\\n    -DBUILD_SHARED_LIBS=ON \\\n    ..\n\nmake uno_ampl -j${nproc}\nmake install\n\n# Uno\ninstall_license ${WORKSPACE}/srcdir/Uno/LICENSE\n\n# BQPD\ncp ${prefix}/share/licenses/BQPD/LICENSE ${WORKSPACE}/srcdir/Uno/LICENSE_BQPD\ninstall_license ${WORKSPACE}/srcdir/Uno/LICENSE_BQPD\n"""
version = "v2.3.1"

