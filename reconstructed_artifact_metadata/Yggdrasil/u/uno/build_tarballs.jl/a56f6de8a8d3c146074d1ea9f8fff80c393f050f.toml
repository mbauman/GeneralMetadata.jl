name = "Uno"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/Uno\nmkdir -p build\ncd build\n\nif [[ \"${target}\" == *mingw* ]]; then\n    LBT=blastrampoline-5\nelse\n    LBT=blastrampoline\nfi\n\nif [[ \"${target}\" == *apple* ]] || [[ \"${target}\" == *freebsd* ]]; then\n    OMP=omp\nelse\n    OMP=gomp\nfi\n\n# FortranCInterface_VERIFY fails on macOS, but it's not actually needed for the current build\nsed -i 's/FortranCInterface_VERIFY(CXX)/# FortranCInterface_VERIFY(CXX)/g' ../CMakeLists.txt\n\ncmake \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_PREFIX_PATH=${libdir} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -Damplsolver=${libdir}/libasl.${dlext} \\\n    -DBLA_VENDOR=\"libblastrampoline\" \\\n    -DMUMPS_INCLUDE_DIR=${includedir} \\\n    -DMETIS_INCLUDE_DIR=${includedir} \\\n    -DMUMPS_LIBRARY=\"${libdir}/libdmumps.${dlext}\" \\\n    -DMUMPS_COMMON_LIBRARY=\"${libdir}/libmumps_common.${dlext}\" \\\n    -DMUMPS_PORD_LIBRARY=\"${libdir}/libpord.${dlext}\" \\\n    -DMUMPS_MPISEQ_LIBRARY=\"${libdir}/libmpiseq.${dlext}\" \\\n    -DBLAS_LIBRARIES=\"${libdir}/lib${LBT}.${dlext}\" \\\n    -DLAPACK_LIBRARIES=\"${libdir}/lib${LBT}.${dlext}\" \\\n    ..\n\nmake -j${nproc}\n\n# Uno does not support `make install`. Manually copy for now.\ncp uno_ampl${exeext} ${bindir}/uno_ampl${exeext}\n\n# Currently, Uno does not provide a shared library. THis may bbe useful in future once it has a C API.\n# ${CXX} -shared $(flagon -Wl,--whole-archive) libuno.a $(flagon -Wl,--no-whole-archive) -o \"${libdir}/libuno.${dlext}\" -L${libdir} -l${OMP} -l${LBT} -ldmumps -lmetis\n"""
version = "v1.1.0"

