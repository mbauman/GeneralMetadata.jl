dependencies = []
lazy_artifacts = false
name = "utf8proc"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/utf8proc-*\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    make -j${nproc} libutf8proc.a\n    mkdir -p ${libdir} ${prefix}/include\n    cp utf8proc.h ${prefix}/include/\n    ar x libutf8proc.a\n    cc -shared -o \"${libdir}/libutf8proc.${dlext}\" *.o\nelse\n    make -j${nproc}\n    make install prefix=${prefix} libdir=${libdir}\nfi\n"""
version = "v2.4.0"

