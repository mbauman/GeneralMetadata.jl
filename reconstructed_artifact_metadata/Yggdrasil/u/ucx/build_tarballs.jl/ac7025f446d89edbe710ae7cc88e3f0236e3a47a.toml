name = "UCX"
platforms = ["x86_64-linux-gnu", "powerpc64le-linux-gnu"]
script = """cd $WORKSPACE/srcdir/ucx-*\n./configure --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --disable-debug \\\n    --disable-assertions \\\n    --disable-params-check \\\n    --enable-mt \\\n    --disable-static\n# For a bug in `src/uct/sm/cma/Makefile` that I did't have the time to look\n# into, we have to build with `V=1`\nmake -j${nproc} V=1\nmake install\n"""
version = "v1.7.0"

