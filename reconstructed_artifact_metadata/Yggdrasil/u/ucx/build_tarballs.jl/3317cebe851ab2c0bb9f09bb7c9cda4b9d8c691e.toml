init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "UCX"
platforms = ["x86_64-linux-gnu", "powerpc64le-linux-gnu"]
script = """cd $WORKSPACE/srcdir/ucx-*\n\nupdate_configure_scripts --reconf\n\n./configure --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --disable-debug \\\n    --disable-assertions \\\n    --disable-params-check \\\n    --disable-static \\\n    --disable-profiling \\\n    --enable-shared \\\n    --enable-mt \\\n    --enable-frame-pointer \\\n    --enable-cma \\\n    --with-rdmacm=${prefix} \\\n    --with-cuda=${prefix}/cuda\n\n# For a bug in `src/uct/sm/cma/Makefile` that I did't have the time to look\n# into, we have to build with `V=1`\nmake -j${nproc} V=1\nmake install\n"""
version = "v1.9.0"

