init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "UCX"
platforms = ["x86_64-linux-gnu", "aarch64-linux-gnu", "powerpc64le-linux-gnu"]
script = """cd $WORKSPACE/srcdir/ucx-*\n\n# Apply all our patches\nif [ -d $WORKSPACE/srcdir/patches ]; then\nfor f in $WORKSPACE/srcdir/patches/*.patch; do\n    echo \"Applying patch ${f}\"\n    atomic_patch -p1 ${f}\ndone\nfi\n\nupdate_configure_scripts --reconf\n\nFLAGS=()\nFLAGS+=(--prefix=${prefix})\nFLAGS+=(--build=${MACHTYPE})\nFLAGS+=(--host=${target})\nFLAGS+=(--disable-debug)\nFLAGS+=(--disable-assertions)\nFLAGS+=(--disable-params-check)\nFLAGS+=(--disable-static)\nFLAGS+=(--disable-profiling)\nFLAGS+=(--enable-shared)\nFLAGS+=(--enable-mt)\nFLAGS+=(--enable-frame-pointer)\nFLAGS+=(--enable-cma)\nFLAGS+=(--with-rdmacm=${prefix})\n\nif [[ \"${target}\" != *aarch64* ]]; then\n    FLAGS+=(--with-cuda=${prefix}/cuda)\nfi\n\nif [[ \"${target}\" == *x86_64* ]]; then\n    FLAGS+=(--with-rocm=${prefix})\nfi\n\n./configure ${FLAGS[@]}\n\n# For a bug in `src/uct/sm/cma/Makefile` that I did't have the time to look\n# into, we have to build with `V=1`\nmake -j${nproc} V=1\nmake install\n\ninstall_license LICENSE\n"""
version = "v1.11.2"

