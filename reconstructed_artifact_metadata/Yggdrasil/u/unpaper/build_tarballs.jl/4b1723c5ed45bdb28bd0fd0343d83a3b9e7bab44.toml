init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "unpaper"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin"]
script = """cd $WORKSPACE/srcdir/unpaper-*/\nif [[ \"${target}\" == *-mingw* ]]; then\n    # FFMPEG_jll installs the pkgconfig files in the wrong directory for Windows\n    export PKG_CONFIG_PATH=\"${PKG_CONFIG_PATH}:${libdir}/pkgconfig\"\n    # Give some hints to the linker\n    export LDFLAGS=\"-L${libdir}\"\n    export LIBAV_LIBS=\"-lavformat -lavutil -lavcodec\"\nfi\nupdate_configure_scripts\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\n"""
version = "v6.1.100"

