init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "USRPHardwareDriver"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-apple-darwin"]
script = """cd uhd/host\n\n#code generators, only needed at build time\napk add py3-mako py3-ruamel.yaml\n\nmkdir build && cd build\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DENABLE_EXAMPLES=OFF \\\n    -DENABLE_TESTS=OFF \\\n    -DENABLE_PYTHON_API=OFF \\\n    ..\nmake -j${nproc}\nmake install\n"""
version = "v4.1.0"

