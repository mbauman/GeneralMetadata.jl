augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "UserNSSandbox"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf"]
script = """cd ${WORKSPACE}/srcdir/Sandbox.jl/deps\nmkdir -p ${bindir}\nmake -j$(nproc)\ninstall -Dvm 755 userns_sandbox ${bindir}/sandbox\ninstall -Dvm 755 userns_overlay_probe ${bindir}/overlay_probe\ninstall_license /usr/share/licenses/MIT\n"""
version = "v2023.8.8"

[[products]]
binnames = ["sandbox"]
type = "exe"
variable_name = "sandbox"
[[products]]
binnames = ["overlay_probe"]
type = "exe"
variable_name = "overlay_probe"

