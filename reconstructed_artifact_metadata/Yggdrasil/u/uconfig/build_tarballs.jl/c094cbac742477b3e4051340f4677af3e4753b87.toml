julia_compat = "1.6"
lazy_artifacts = false
name = "uconfig"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/u-config*\n\ncase ${target} in\n    # These specific main files do not work\n    # aarch64-linux*) cc -Os -o pkg-config${exeext} main_linux_aarch64.c;;\n    # x86_64-linux*)  cc -Os -o pkg-config${exeext} main_linux_amd64.c;;\n    # i686-linux*)    cc -Os -o pkg-config${exeext} main_linux_i686.c;;\n    *-w64-*)        cc -Os -nostartfiles -o pkg-config${exeext} main_windows.c;;\n    *)              cc -Os -o pkg-config${exeext} main_posix.c;;\nesac\n\ninstall -Dvm 755 pkg-config${exeext} ${bindir}/pkg-config${exeext}\n\ninstall_license UNLICENSE\n"""
version = "v0.34.0"

