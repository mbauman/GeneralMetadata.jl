name = "wget2"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/wget2*\n\nif [[ ${target} == x86_64-linux-musl ]]; then\n    # Avoid finding the host Brotli libraries\n    rm /usr/lib/libbrotli*\nfi\n\nif [[ ${target} == *-w64-mingw32 ]]; then\n    # There is no pkgconfig info for OpenSSL on Windows\n    export OPENSSL_CFLAGS=\"-I${includedir}\"\n    export OPENSSL_LIBS=\"-L${libdir} -lssl\"\nfi\n\n./configure \\\n    --host=${target} \\\n    --build=${MACHTYPE} \\\n    --prefix=${prefix} \\\n    --disable-doc \\\n    --disable-manylibs \\\n    --enable-shared=yes \\\n    --enable-static=no \\\n    --with-brotlidec \\\n    --with-bzip2 \\\n    --with-libidn2 \\\n    --with-libpcre2 \\\n    --with-libpsl \\\n    --with-lzma \\\n    --with-ssl=openssl \\\n    --with-zlib \\\n    $(if [[ ${target} == *-w64-mingw32 ]]; then echo ' --without-zstd'; else echo ' --with-zstd'; fi) \\\n    --without-gpgme  \\\n    --without-libhsts \\\n    --without-libidn \\\n    --without-libmicrohttpd \\\n    --without-libnghttp2 \\\n    --without-libpcre \\\n    --without-lzip \\\n    --without-plugin-support\n\nmake -j${nproc}\nmake install\n"""
version = "v2.2.1"

