name = "wget2"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/wget2*\n\n./configure \\\n--prefix=${prefix} \\\n--build=${MACHTYPE} \\\n--host=${target} \\\n--enable-shared=yes \\\n--enable-static=no \\\n--without-libpsl \\\n--without-libhsts \\\n--without-libnghttp2 \\\n--without-bzip2 \\\n--without-gpgme  \\\n--without-lzma \\\n--without-brotlidec \\\n--without-lzip \\\n--without-libidn2 \\\n--without-libidn \\\n--without-libpcre2 \\\n--without-libpcre \\\n--without-libmicrohttpd \\\n--without-plugin-support \\\n--disable-doc \\\n--disable-manylibs\n\nmake -j${nproc}\nmake install\n\n"""
version = "v2.0.0"

