dependencies = []
name = "WCS"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/wcslib-*/\nif [[ \"${target}\" == *mingw* ]]; then\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/configure-mingw.patch\"\n    autoconf\n    export CFLAGS=\"${CFLAGS} -DNO_OLDNAMES\"\nfi\n./configure --prefix=$prefix --host=$target --disable-fortran --without-cfitsio --without-pgplot --disable-utils\nmake -j${nproc}\nmake install\n"""
sources = [{"https://cache.julialang.org/ftp://ftp.atnf.csiro.au/pub/software/wcslib/wcslib-6.4.tar.bz2" = "13c11ff70a7725563ec5fa52707a9965fce186a1766db193d08c9766ea107000"}, "./patches"]
version = "v6.4.0"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libwcs"]
type = "lib"
variable_name = "libwcs"
