name = "WaveFD"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/WaveFD.jl/src\n\nCXXFLAGS=\"-funroll-loops\"\nif [[ \"${target}\" == i686-linux-gnu || \"${target}\" == x86_64-linux-gnu || \"${target}\" == powerpc6rle-linux-gnu ]]; then\n    CXXFLAGS+=\" -D__FUNCTION_CLONES__\"\nfi\n\necho \"target=$target, CXXFLAGS=$CXXFLAGS\"\n\ncmake . -DCMAKE_CXX_FLAGS=\"${CXXFLAGS}\" -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN%.*}_gcc.cmake -DCMAKE_BUILD_TYPE=Release\nmake -j${nproc} VERBOSE=1\nmake install\n"""
version = "v0.3.0"

