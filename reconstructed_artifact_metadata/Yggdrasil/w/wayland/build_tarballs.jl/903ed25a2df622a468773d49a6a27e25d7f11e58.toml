init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Wayland"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/wayland-*/\n\n# We need to run `wayland-scanner` on the host system\napk add wayland-dev\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --disable-documentation --with-host-scanner\nmake -j${nproc}\nmake install\n"""
version = "v1.19.0"

