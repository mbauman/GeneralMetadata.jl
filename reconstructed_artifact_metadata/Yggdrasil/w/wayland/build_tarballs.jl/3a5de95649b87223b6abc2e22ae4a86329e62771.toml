julia_compat = "1.6"
lazy_artifacts = false
name = "Wayland"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/wayland-*/\n\nln -s `which wayland-scanner` $bindir\ncp $prefix/libdata/pkgconfig/* $prefix/lib/pkgconfig || true\n\nmkdir build-wayland\n\ncd build-wayland\nmeson .. \\\n    --cross-file=\"${MESON_TARGET_TOOLCHAIN}\" \\\n    -Ddocumentation=false\nninja -j${nproc}\nninja install\nrm -f $prefix/lib/pkgconfig/epoll-shim*.pc\n"""
version = "v1.21.0"

