dependencies = ["Expat_jll", "Libffi_jll", "XML2_jll"]
name = "Wayland"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/wayland-*/\n\n# We need to run `wayland-scanner` on the host system\napk add wayland-dev\n\natomic_patch -p1 ../patches/Makefile_in.patch\n./configure --prefix=${prefix} --host=${target} --disable-documentation --with-host-scanner\nmake -j${nproc}\nmake install\n"""
sources = [{"https://wayland.freedesktop.org/releases/wayland-1.17.0.tar.xz" = "72aa11b8ac6e22f4777302c9251e8fec7655dc22f9d94ee676c6b276f95f91a4"}, "./bundled"]
version = "v1.17.0"

[[products]]
binnames = ["wayland-scanner"]
type = "exe"
variable_name = "wayland_scanner"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libwayland-client"]
type = "lib"
variable_name = "libwayland_client"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libwayland-cursor"]
type = "lib"
variable_name = "libwayland_cursor"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libwayland-egl"]
type = "lib"
variable_name = "libwayland_egl"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libwayland-server"]
type = "lib"
variable_name = "libwayland_server"
