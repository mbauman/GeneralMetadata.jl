name = "Emoslib"
platforms = ["i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran3", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "armv6l-linux-gnueabihf-libgfortran3", "armv6l-linux-gnueabihf-libgfortran4", "armv6l-linux-gnueabihf-libgfortran5", "armv7l-linux-gnueabihf-libgfortran3", "armv7l-linux-gnueabihf-libgfortran4", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran3", "powerpc64le-linux-gnu-libgfortran4", "powerpc64le-linux-gnu-libgfortran5", "x86_64-apple-darwin-libgfortran3", "x86_64-apple-darwin-libgfortran4", "x86_64-apple-darwin-libgfortran5"]
script = """cd libemos-*-Source\n\n# This is a cross build, we can't do native compilation.\nsed -i 's/-mtune=native//' CMakeLists.txt\n\n# This should really be a check on the GCC version, but it's easier to test the\n# target name\nif [[ \"${target}\" == aarch64-apple-* ]]; then\n    # Fix error\n    #   Type mismatch between actual argument at (1) and actual argument at (2) (REAL(8)/REAL(4)).\n    export FFLAGS=\"-fallow-argument-mismatch\"\nfi\n\nmkdir build ; cd build\ncmake \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DENABLE_ECCODES=ON \\\n    -DGRIB_API_LIBRARIES=${libdir}/libeccodes.${dlext} \\\n    -DGRIB_API_INCLUDE_DIRS=${includedir} \\\n    ..\nmake -j${nproc}\nmake install\ninstall_license ../LICENSE\n"""
version = "v4.5.9"

