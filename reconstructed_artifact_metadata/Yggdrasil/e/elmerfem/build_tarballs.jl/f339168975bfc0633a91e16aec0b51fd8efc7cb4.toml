augment_platform_block = ""
init_block = "ENV[\"ELMER_HOME\"] = artifact_dir"
julia_compat = "1.9"
lazy_artifacts = false
name = "elmerfem"
platforms = ["i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran5", "powerpc64le-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran5"]
script = """mkdir build && cd build\n\nif [[ \"${target}\" == *mingw* ]]; then\n  LBT=\"-L${libdir} -lblastrampoline-5\"\nelse\n  LBT=\"-L${libdir} -lblastrampoline\"\nfi\n\ncmake ../elmerfem \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DWITH_CONTRIB=ON \\\n    -DWITH_LUA=ON \\\n    -DWITH_OpenMP=ON \\\n    -DWITH_MPI=OFF \\\n    -DBLAS_LIBRARIES=\"${LBT}\" \\\n    -DLAPACK_LIBRARIES=\"${LBT}\" \\\n    -DHOMEBREW_PREFIX=\"unused\" \\\n    -Wno-dev\nmake -j${nproc}\nmake install\n\ninstall_license ../elmerfem/LICENSE.md\n"""
version = "v9.0.20231229"

