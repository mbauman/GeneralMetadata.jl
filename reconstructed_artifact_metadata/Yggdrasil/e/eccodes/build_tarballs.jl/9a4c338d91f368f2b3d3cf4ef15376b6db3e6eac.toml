name = "eccodes"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/eccodes-*-Source\nif [[ ${target} = *-mingw* ]] ; then\n    chmod +x cmake/ecbuild_windows_replace_symlinks.sh\n    atomic_patch -p1 /workspace/srcdir/patches/windows.patch\nelse\n    atomic_patch -p1 /workspace/srcdir/patches/unix.patch\nfi\nmkdir build\ncd build\nexport CFLAGS=\"-I${includedir}\"\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DENABLE_NETCDF=OFF \\\n    -DENABLE_PNG=ON \\\n    -DENABLE_PYTHON=OFF \\\n    -DENABLE_FORTRAN=OFF \\\n    -DENABLE_ECCODES_THREADS=ON \\\n    ..\nmake -j${nproc}\nmake install\ninstall_license ../LICENSE\n"""
version = "v2.19.1"

