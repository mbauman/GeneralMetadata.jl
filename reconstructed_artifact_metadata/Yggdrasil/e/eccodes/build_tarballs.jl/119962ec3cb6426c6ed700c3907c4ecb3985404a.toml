augment_platform_block = ""
init_block = """ENV[\"ECCODES_DEFINITION_PATH\"] = eccodes_definitions\n"""
julia_compat = "1.6"
lazy_artifacts = false
name = "eccodes"
platforms = ["x86_64-linux-gnu-libgfortran5-cxx11", "aarch64-linux-gnu-libgfortran5-cxx11", "powerpc64le-linux-gnu-libgfortran5-cxx11", "x86_64-linux-musl-libgfortran5-cxx11", "aarch64-linux-musl-libgfortran5-cxx11", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran5", "x86_64-w64-mingw32-libgfortran5-cxx11"]
script = """macos_sdk_version=11.1\nmacosx_deployment_target=10.14\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    # extract the tarball into the sys-root so all compilers pick it up\n    # automatically, and use --warning=no-unknown-keyword to hide harmless\n    # warnings about unsupported pax header keywords like \"SCHILY.fflags\"\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        --warning=no-unknown-keyword \\\n        MacOSX${macos_sdk_version}.sdk/System \\\n        MacOSX${macos_sdk_version}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd $WORKSPACE/srcdir/eccodes-*-Source\nif [[ ${target} = *-mingw* ]] ; then\n    chmod +x cmake/ecbuild_windows_replace_symlinks.sh\n    atomic_patch -p1 /workspace/srcdir/patches/windows.patch\nfi\natomic_patch -p1 /workspace/srcdir/patches/unix.patch\natomic_patch -p1 /workspace/srcdir/patches/kinds.patch\nmkdir build\ncd build\nexport CFLAGS=\"-I${includedir}\"\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DENABLE_EXAMPLES=OFF \\\n    -DENABLE_TESTS=OFF \\\n    -DENABLE_NETCDF=OFF \\\n    -DENABLE_PNG=ON \\\n    -DENABLE_FORTRAN=ON \\\n    -DENABLE_ECCODES_THREADS=ON \\\n    -DENABLE_AEC=ON $maccmakeargs \\\n    ..\nmake -j${nproc}\nmake install\ninstall_license ../LICENSE\n"""
version = "v2.45.0"

