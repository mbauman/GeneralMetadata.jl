dependencies = ["Zlib_jll", "Bzip2_jll", "XZ_jll"]
name = "Elfutils"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-unknown-freebsd11.1"]
script = """cd $WORKSPACE/srcdir/elfutils-*/\nCFLAGS=\"-Wno-error=unused-result\" CPPFLAGS=\"-I${prefix}/include\" ./configure --prefix=${prefix} --host=${target}\nmake -j${nproc}\nmake install\n"""
version = "v0.177.0"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libasm"]
type = "lib"
variable_name = "libasm"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libdw"]
type = "lib"
variable_name = "libdw"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libelf"]
type = "lib"
variable_name = "libelf"

