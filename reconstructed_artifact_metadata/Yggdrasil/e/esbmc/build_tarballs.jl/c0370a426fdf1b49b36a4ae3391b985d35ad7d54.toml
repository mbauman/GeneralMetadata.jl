script = """macos_sdk_version=14.5\nmacosx_deployment_target=10.15\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    # extract the tarball into the sys-root so all compilers pick it up\n    # automatically, and use --warning=no-unknown-keyword to hide harmless\n    # warnings about unsupported pax header keywords like \"SCHILY.fflags\"\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        --warning=no-unknown-keyword \\\n        MacOSX${macos_sdk_version}.sdk/System \\\n        MacOSX${macos_sdk_version}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd ${WORKSPACE}/srcdir/esbmc*\n\n# Apply cross-compilation patches\nfor f in ${WORKSPACE}/srcdir/patches/*.patch; do\n    atomic_patch -p1 \"${f}\"\ndone\n\n# On macOS, llvm-ranlib doesn't support -no_warning_for_no_symbols and -c\n# flags that CMake adds on Darwin. Create a wrapper that strips them.\nRANLIB_FLAGS=\"\"\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    real_ranlib=$(which ${target}-ranlib)\n    cat > /tmp/ranlib_wrapper <<WRAPPER\n#!/bin/bash\nargs=()\nfor arg in \"\\$@\"; do\n    case \"\\$arg\" in\n        -no_warning_for_no_symbols|-c) ;;\n        *) args+=(\"\\$arg\") ;;\n    esac\ndone\nexec \"${real_ranlib}\" \"\\${args[@]}\"\nWRAPPER\n    chmod +x /tmp/ranlib_wrapper\n    RANLIB_FLAGS=\"-DCMAKE_RANLIB=/tmp/ranlib_wrapper\"\nfi\n\nmkdir build && cd build\ncmake .. \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DENABLE_Z3=ON \\\n    -DENABLE_SMTLIB=ON \\\n    -DZ3_DIR=${prefix} \\\n    -DLLVM_DIR=${prefix}/lib/cmake/llvm \\\n    -DClang_DIR=${prefix}/lib/cmake/clang \\\n    -DESBMC_BUNDLE_LIBC=OFF \\\n    -DENABLE_SOLIDITY_FRONTEND=OFF \\\n    -DENABLE_JIMPLE_FRONTEND=OFF \\\n    -DENABLE_PYTHON_FRONTEND=OFF \\\n    -DENABLE_GOTO_CONTRACTOR=OFF \\\n    -DBUILD_TESTING=OFF \\\n    -DENABLE_REGRESSION=OFF \\\n    -DDOWNLOAD_DEPENDENCIES=OFF \\\n    -DFETCHCONTENT_FULLY_DISCONNECTED=ON \\\n    -DFETCHCONTENT_SOURCE_DIR_FMT=${WORKSPACE}/srcdir/fmt \\\n    -DCMAKE_EXE_LINKER_FLAGS=\"-lpthread\" \\\n    -DCCACHE_FOUND=CCACHE_FOUND-NOTFOUND \\\n    ${RANLIB_FLAGS}\ncmake --build . --parallel ${nproc}\ncmake --install .\n\ninstall_license ${WORKSPACE}/srcdir/esbmc*/COPYING\n"""
version = "v8.0.0"

