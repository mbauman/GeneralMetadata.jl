name = "SLATEC"
platforms = ["i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran3", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "armv7l-linux-gnueabihf-libgfortran3", "armv7l-linux-gnueabihf-libgfortran4", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran3", "powerpc64le-linux-gnu-libgfortran4", "powerpc64le-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran3", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran3", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran3", "aarch64-linux-musl-libgfortran4", "aarch64-linux-musl-libgfortran5", "armv7l-linux-musleabihf-libgfortran3", "armv7l-linux-musleabihf-libgfortran4", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin-libgfortran3", "x86_64-apple-darwin-libgfortran4", "x86_64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran3", "x86_64-unknown-freebsd-libgfortran4", "x86_64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran3", "i686-w64-mingw32-libgfortran4", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran3", "x86_64-w64-mingw32-libgfortran4", "x86_64-w64-mingw32-libgfortran5", "aarch64-apple-darwin-libgfortran5", "armv6l-linux-gnueabihf-libgfortran3", "armv6l-linux-gnueabihf-libgfortran4", "armv6l-linux-gnueabihf-libgfortran5", "armv6l-linux-musleabihf-libgfortran3", "armv6l-linux-musleabihf-libgfortran4", "armv6l-linux-musleabihf-libgfortran5"]
script = """cd $WORKSPACE/srcdir/slatec/src\n\n# Manually set LAPACK and BLAS libraries\necho \"list( REMOVE_ITEM SLATEC_SOURCE_FILES \\${BLAS_SOURCE_FILES} )\" >> CMakeLists.txt\necho \"list( APPEND SLATEC_SOURCE_FILES \\${RETAINED_BLAS_SOURCE_FILES} )\" >> CMakeLists.txt\necho \"list( REMOVE_ITEM SLATEC_SOURCE_FILES \\${EXCLUDE_FROM_SHARED} )\" >> CMakeLists.txt\necho \"include(\\$ENV{prefix}/lib/cmake/lapack-3.9.0/lapack-config.cmake)\" >> CMakeLists.txt\necho \"include(\\$ENV{prefix}/lib/cmake/openblas/OpenBLASConfig.cmake)\" >> CMakeLists.txt\necho \"add_library( slatec_shared SHARED \\${SLATEC_SOURCE_FILES} )\" >> CMakeLists.txt\necho \"target_link_libraries( slatec_shared \\${LAPACK_LIBRARIES} \\${OpenBLAS_LIBRARIES})\" >> CMakeLists.txt\necho \"set_target_properties( slatec_shared PROPERTIES OUTPUT_NAME slatec )\" >> CMakeLists.txt\necho \"install( TARGETS slatec_shared LIBRARY DESTINATION lib )\" >> CMakeLists.txt\n\nif [[ \"${target}\" == aarch64-apple-* ]]; then\n    # Fix issue due to GCC 10+.\n    #     [  2%] Building Fortran object src/CMakeFiles/slatec_shared.dir/dwnlsm.f.o\n    #     cd /workspace/srcdir/slatec/build/src && /opt/bin/aarch64-apple-darwin20-libgfortran5-cxx11/aarch64-apple-darwin20-gfortran --sysroot=/opt/aarch64-apple-darwin20/aarch64-apple-darwin20/sys-root -Dslatec_shared_EXPORTS  -O3 -DNDEBUG -O3 -fPIC   -c /workspace/srcdir/slatec/src/dwnlsm.f -o CMakeFiles/slatec_shared.dir/dwnlsm.f.o\n    #     /workspace/srcdir/slatec/src/dwnlsm.f:440:28:\n    #\n    #       119 |       CALL DCOPY (N, 1.D0, 0, D, 1)\n    #           |                     2\n    #     ......\n    #       440 |          CALL DCOPY (NSOLN, Z, 1, X, 1)\n    #           |                            1\n    #     Error: Rank mismatch between actual argument at (1) and actual argument at (2) (scalar and rank-1)\n    #     /workspace/srcdir/slatec/src/dwnlsm.f:608:25:\n    #\n    #       119 |       CALL DCOPY (N, 1.D0, 0, D, 1)\n    #           |                     2\n    #     ......\n    #       608 |       CALL DCOPY (NSOLN, Z, 1, X, 1)\n    #           |                         1\n    #     Error: Rank mismatch between actual argument at (1) and actual argument at (2) (scalar and rank-1)\n    export FFLAGS=\"-fallow-argument-mismatch\"\nfi\n\nmkdir ../build\ncd ../build/\n# Above on the fly added CMake code buils shared library with OpenBLAS\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DUSE_OPTIMIZED_BLAS=0 \\\n    -DBUILD_SHARED_LIBRARY=0 \\\n    ..\nmake -j${nproc}\nmake install\n\ninstall_license ../../LICENSE\n"""
version = "v4.1.0"

