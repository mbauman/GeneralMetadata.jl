augment_platform_block = ""
init_block = ""
julia_compat = "1.9"
lazy_artifacts = false
name = "SCIP_PaPILO"
platforms = ["i686-linux-gnu-libgfortran5-cxx11", "x86_64-linux-gnu-libgfortran5-cxx11", "aarch64-linux-gnu-libgfortran5-cxx11", "armv6l-linux-gnueabihf-libgfortran5-cxx11", "armv7l-linux-gnueabihf-libgfortran5-cxx11", "powerpc64le-linux-gnu-libgfortran5-cxx11", "i686-linux-musl-libgfortran5-cxx11", "x86_64-linux-musl-libgfortran5-cxx11", "aarch64-linux-musl-libgfortran5-cxx11", "armv6l-linux-musleabihf-libgfortran5-cxx11", "armv7l-linux-musleabihf-libgfortran5-cxx11", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran5-cxx11", "x86_64-w64-mingw32-libgfortran5-cxx11"]
script = """macos_sdk_version=10.13\nmacosx_deployment_target=10.13\n# Move the SDK tarball out of `srcdir` on all platforms: any extra entry\n# in there defeats the automatic installation of license files, which\n# expects `srcdir` to contain a single top-level source directory.\nmv ${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz ${WORKSPACE}/\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    # Extract SDK. Also outside of `srcdir`, for the same reason.\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    tar \\\n        --extract \\\n        --file=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=${WORKSPACE} \\\n        --warning=no-unknown-keyword\n    old_sdkroot=${SDKROOT}\n    new_sdkroot=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk\n    # Make sure libc++ header files are available at `usr/include/c++/v1`.\n    # Some SDKs ship their own (e.g. 15.0), which we leave alone; for those\n    # that don't, symlink the ones from the default SDK. Note we symlink\n    # the `v1` subdirectory rather than the whole `c++` directory: some\n    # SDKs (e.g. 10.13) contain `usr/include/c++/4.2.1` (but no `v1`), and\n    # symlinking `c++` onto that existing directory would silently create\n    # a nested `c++/c++` link, so libc++ headers like <new> are not found.\n    if [[ ! -d ${new_sdkroot}/usr/include/c++/v1 ]]; then\n        mkdir -p ${new_sdkroot}/usr/include/c++\n        ln -sT ${old_sdkroot}/usr/include/c++/v1 ${new_sdkroot}/usr/include/c++/v1\n    fi\n    # In the build environment `usr/local` of the default sys-root is a\n    # symlink to the destdir prefix, which puts the header files of the\n    # dependencies on the compilers' default search path. No SDK ships a\n    # `usr/local`, so replicate that symlink in the new SDK. `-T` makes\n    # this fail loudly should some SDK ship a `usr/local` after all,\n    # instead of silently creating a nested `usr/local/local` link.\n    ln -sT ${old_sdkroot}/usr/local ${new_sdkroot}/usr/local\n    # Fix toolchain files\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" ${MESON_TARGET_TOOLCHAIN} ${CMAKE_TARGET_TOOLCHAIN}\n    # Fix compiler wrappers\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" $(find /opt/bin/${target}* -type f -print)\n    SDKROOT=${new_sdkroot}\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd scipoptsuite*\n\n# for soplex threadlocal\nexport CXXFLAGS=\"-DTHREADLOCAL=''\"\n\n# Enable large file support on mingw\nif [[ \"${target}\" == *-mingw* ]]; then\n    export CXXFLAGS=\"-Wa,-mbig-obj\"\nfi\n\n# Patch to fix linking with gfortran's library on mingw\n# https://github.com/JuliaPackaging/Yggdrasil/pull/8224#issuecomment-2034941690\natomic_patch -p0 $WORKSPACE/srcdir/patches/papilo_cmake.patch\n\nmkdir build\ncd build/\ncmake -DCMAKE_INSTALL_PREFIX=$prefix\\\n  -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\\\n  -DCMAKE_BUILD_TYPE=Release\\\n  -DZIMPL=OFF\\\n  -DUG=0\\\n  -DAMPL=0\\\n  -DGCG=0\\\n  -DBOOST=ON\\\n  -DMPFR=ON\\\n  -DSYM=snauty\\\n  -DTPI=tny\\\n  -DIPOPT_DIR=${prefix} \\\n  -DIPOPT_LIBRARIES=${libdir} \\\n  -DBLISS_INCLUDE_DIR=${includedir} \\\n  -DBLISS_LIBRARY=bliss \\\n  -DBUILD_TESTING=OFF \\\n  ..\nmake -j${nproc} scip\nmake papilo-executable\n\nmake install\ncp bin/papilo${exeext} \"${bindir}/papilo${exeext}\"\n\nmkdir -p ${prefix}/share/licenses/SCIP_PaPILO\nmv -v ${prefix}/share/licenses/scip ${prefix}/share/licenses/SCIP_PaPILO\nmv -v ${prefix}/share/licenses/soplex ${prefix}/share/licenses/SCIP_PaPILO\nmv -v ${prefix}/share/licenses/papilo ${prefix}/share/licenses/SCIP_PaPILO\n"""
version = "v1000.0.300"

