augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Soup3"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libsoup-*/\ninstall_license COPYING\n\nmkdir build_glib && cd build_glib\nmeson --cross-file=\"${MESON_TARGET_TOOLCHAIN}\" \\\n    --buildtype=release \\\n    -Dtls_check=false \\\n    -Dtests=false \\\n    -Ddocs=disabled \\\n    -Dsysprof=disabled \\\n    ..\n\nif [[ \"${target}\" != *darwin* ]]; then\n    # https://github.com/rbgirshick/py-faster-rcnn/issues/706\n    sed -i \"s/-R/-Wl,-rpath=/\" build.ninja\nfi\n\nif [[ \"${target}\" == *86*-linux-gnu* ]]; then\n    # https://stackoverflow.com/questions/2418157/c-error-undefined-reference-to-clock-gettime-and-clock-settime\n    sed -i 's/$ARGS -o $out $in $LINK_ARGS/$ARGS -o $out $in $LINK_ARGS -lrt/' build.ninja\nfi\n\nninja -j${nproc}\nninja install\n"""
version = "v3.2.1"

