init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "SSGraphBLAS"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """# Compile GraphBLAS\ncd $WORKSPACE/srcdir/GraphBLAS-*/build\ncmake .. -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DUSER_NONE=1\n\nmake -j${nproc} install\n\nif [[ ! -f \"${libdir}/libgraphblas.${dlext}\" ]]; then\n    # For mysterious reasons, the shared library is not installed\n    # when building for Windows\n    mkdir -p \"${libdir}\"\n    cp \"libgraphblas.${dlext}\" \"${libdir}\"\nfi\n"""
version = "v4.0.3"

