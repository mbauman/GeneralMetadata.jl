augment_platform_block = """using Base.BinaryPlatforms\n\ntry\n    using CUDA_Runtime_jll\ncatch\n    # during initial package installation, CUDA_Runtime_jll may not be available.\n    # in that case, we just won't select an artifact.\nend\n\n# can't use Preferences for the same reason\nconst CUDA_Runtime_jll_uuid = Base.UUID(\"76a88914-d11a-5bdc-97e0-2f5a05c973a2\")\nconst preferences = Base.get_preferences(CUDA_Runtime_jll_uuid)\nBase.record_compiletime_preference(CUDA_Runtime_jll_uuid, \"version\")\nBase.record_compiletime_preference(CUDA_Runtime_jll_uuid, \"local\")\nconst local_toolkit = something(tryparse(Bool, get(preferences, \"local\", \"false\")), false)\n\nfunction cuda_comparison_strategy(_a::String, _b::String, a_requested::Bool, b_requested::Bool)\n    # if we're using a local toolkit, we can't use artifacts\n    if local_toolkit\n        return false\n    end\n\n    # if either isn't a version number (e.g. \"none\"), perform a simple equality check\n    a = tryparse(VersionNumber, _a)\n    b = tryparse(VersionNumber, _b)\n    if a === nothing || b === nothing\n        return _a == _b\n    end\n\n    # if both b and a requested, then we fall back to equality\n    if a_requested && b_requested\n        return Base.thisminor(a) == Base.thisminor(b)\n    end\n\n    # otherwise, do the comparison between the the single version cap and the single version:\n    function is_compatible(artifact::VersionNumber, host::VersionNumber)\n        if host >= v\"11.0\"\n            # enhanced compatibility, semver-style\n            artifact.major == host.major &&\n            Base.thisminor(artifact) <= Base.thisminor(host)\n        else\n            Base.thisminor(artifact) == Base.thisminor(host)\n        end\n    end\n    if a_requested\n        is_compatible(b, a)\n    else\n        is_compatible(a, b)\n    end\nend\n\nfunction augment_platform!(platform::Platform)\n    if !@isdefined(CUDA_Runtime_jll)\n        # don't set to nothing or Pkg will download any artifact\n        platform[\"cuda\"] = \"none\"\n    end\n\n    if !haskey(platform, \"cuda\")\n        CUDA_Runtime_jll.augment_platform!(platform)\n    end\n    BinaryPlatforms.set_compare_strategy!(platform, \"cuda\", cuda_comparison_strategy)\n\n    # store the fact that we're using a local CUDA toolkit, for debugging purposes\n    platform[\"cuda_local\"] = string(local_toolkit)\n\n    return platform\nend"""
init_block = ""
julia_compat = "1.11"
lazy_artifacts = true
name = "SuiteSparse_GPU"
platforms = ["x86_64-linux-gnu-cuda+11.4", "x86_64-linux-gnu-cuda+11.5", "x86_64-linux-gnu-cuda+11.6", "x86_64-linux-gnu-cuda+11.7", "x86_64-linux-gnu-cuda+11.8", "x86_64-linux-gnu-cuda+12.0", "x86_64-linux-gnu-cuda+12.1", "x86_64-linux-gnu-cuda+12.2", "x86_64-linux-gnu-cuda+12.3"]
script = """cd $WORKSPACE/srcdir/SuiteSparse\n\n# Needs cmake >= 3.22 provided by jll\napk del cmake\n\n# Ensure CUDA is on the path\nexport CUDA_HOME=${WORKSPACE}/destdir/cuda;\nexport PATH=$PATH:$CUDA_HOME/bin\nexport CUDACXX=$CUDA_HOME/bin/nvcc\n\n# nvcc thinks the libraries are located inside lib64, but the SDK actually has them in lib\nln -s ${CUDA_HOME}/lib ${CUDA_HOME}/lib64\n\n# Disable OpenMP as it will probably interfere with blas threads and Julia threads\nFLAGS+=(INSTALL=\"${prefix}\" INSTALL_LIB=\"${libdir}\" INSTALL_INCLUDE=\"${prefix}/include\" CFOPENMP=)\n\nBLAS_NAME=blastrampoline\nif [[ \"${target}\" == *-mingw* ]]; then\n    BLAS_LIB=${BLAS_NAME}-5\nelse\n    BLAS_LIB=${BLAS_NAME}\nfi\n\n# Enable CUDA\nFLAGS+=(CUDA_PATH=\"$prefix/cuda\")\n\nif [[ ${bb_full_target} == *-sanitize+memory* ]]; then\n    # Install msan runtime (for clang)\n    cp -rL ${libdir}/linux/* /opt/x86_64-linux-musl/lib/clang/*/lib/linux/\nfi\n\nif [[ ${nbits} == 64 ]]; then\n    CMAKE_OPTIONS=(\n        -DBLAS64_SUFFIX=\"_64\"\n        -DSUITESPARSE_USE_64BIT_BLAS=YES\n    )\nelse\n    CMAKE_OPTIONS=(\n        -DSUITESPARSE_USE_64BIT_BLAS=NO\n    )\nfi\n\nPROJECTS_TO_BUILD=\"cholmod;spqr\"\n\ncmake -DCMAKE_BUILD_TYPE=Release \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n      -DCMAKE_RELEASE_POSTFIX=\"_cuda\" \\\n      -DBUILD_STATIC_LIBS=OFF \\\n      -DBUILD_TESTING=OFF \\\n      -DSUITESPARSE_ENABLE_PROJECTS=${PROJECTS_TO_BUILD} \\\n      -DSUITESPARSE_DEMOS=OFF \\\n      -DSUITESPARSE_USE_STRICT=ON \\\n      -DSUITESPARSE_USE_CUDA=ON \\\n      -DSUITESPARSE_USE_FORTRAN=OFF \\\n      -DSUITESPARSE_USE_OPENMP=OFF \\\n      -DSUITESPARSE_USE_SYSTEM_SUITESPARSE_CONFIG=ON \\\n      -DSUITESPARSE_USE_SYSTEM_AMD=ON \\\n      -DSUITESPARSE_USE_SYSTEM_COLAMD=ON \\\n      -DSUITESPARSE_USE_SYSTEM_CAMD=ON \\\n      -DSUITESPARSE_USE_SYSTEM_CCOLAMD=ON \\\n      -DCHOLMOD_PARTITION=ON \\\n      -DBLAS_FOUND=1 \\\n      -DBLAS_LIBRARIES=\"${libdir}/lib${BLAS_LIB}.${dlext}\" \\\n      -DBLAS_LINKER_FLAGS=\"${BLAS_LIB}\" \\\n      -DBLA_VENDOR=\"${BLAS_NAME}\" \\\n      -DLAPACK_LIBRARIES=\"${libdir}/lib${BLAS_LIB}.${dlext}\" \\\n      -DLAPACK_LINKER_FLAGS=\"${BLAS_LIB}\" \\\n      \"${CMAKE_OPTIONS[@]}\" \\\n      .\n\nmake -j${nproc}\nmake install\n\ninstall_license LICENSE.txt\n"""
version = "v7.5.0"

