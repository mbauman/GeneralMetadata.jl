augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "CXSparse"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/SuiteSparse\nFLAGS+=(INSTALL=\"${prefix}\" INSTALL_LIB=\"${libdir}\" INSTALL_INCLUDE=\"${prefix}/include\" CFOPENMP=)\n\nif [[ ${target} == *mingw32* ]]; then\n    FLAGS+=(UNAME=Windows)\n    FLAGS+=(LDFLAGS=\"${LDFLAGS} -L${libdir} -shared\")\nelse\n    FLAGS+=(UNAME=\"$(uname)\")\n    FLAGS+=(LDFLAGS=\"${LDFLAGS} -L${libdir}\")\nfi\n\nmake -j${nproc} -C CXSparse \"${FLAGS[@]}\" library CFOPENMP=\"$CFOPENMP\"\nmake -j${nproc} -C CXSparse \"${FLAGS[@]}\" install CFOPENMP=\"$CFOPENMP\"\n\ninstall_license LICENSE.txt\n"""
version = "v5.10.1"

