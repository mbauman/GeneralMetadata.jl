dependencies = []
init_block = ""
lazy_artifacts = false
name = "SuiteSparse32"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/SuiteSparse-*\n\n# Disable OpenMP as it will probably interfere with blas threads and Julia threads\nFLAGS+=(INSTALL=\"${prefix}\" INSTALL_LIB=\"${libdir}\" INSTALL_INCLUDE=\"${prefix}/include\" CFOPENMP=)\n\nFLAGS+=(LDFLAGS=\"${LDFLAGS} -L${libdir}\")\nif [[ ${target} == *mingw32* ]]; then\n    FLAGS+=(UNAME=Windows)\nelse\n    FLAGS+=(UNAME=\"$(uname)\")\nfi\n\nmkdir -p ${prefix}/include\nmake -j${nproc} -C SuiteSparse_config \"${FLAGS[@]}\" config\nfor proj in SuiteSparse_config AMD BTF COLAMD KLU; do\n    make -j${nproc} -C $proj \"${FLAGS[@]}\" static CFOPENMP=\"$CFOPENMP\"\n    [[ -d ${proj}/Include ]] && cp ${proj}/Include/*.h ${prefix}/include\ndone\n\n# Move the static libraries into place\nmkdir -p $libdir\npat=\"*.a\"\nif [[ ${target} == *mingw32* ]]; then\n    pat=\"*.lib\"\nfi\nfind . -name \"$pat\" -exec mv {} ${libdir} \\;\n\ninstall_license LICENSE.txt\n"""
version = "v5.4.0"

[[products]]
paths = ["lib/libsuitesparseconfig.a", "bin/libsuitesparseconfig.lib"]
type = "file"
variable_name = "libsuitesparseconfig_a"
