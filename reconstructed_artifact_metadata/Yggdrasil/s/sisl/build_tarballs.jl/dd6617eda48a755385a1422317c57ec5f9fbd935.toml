julia_compat = "1.6"
lazy_artifacts = false
name = "SISL"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/SISL-*\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    #this is derived directly from https://github.com/SINTEF-Geometry/SISL/pull/6, if that ever get merged this can be removed\n    atomic_patch -p1 ${WORKSPACE}/srcdir/patches/mingw-cmake-patch.patch\nfi\n\nmkdir build\ncd build\n\ncmake .. \\\n-DCMAKE_INSTALL_PREFIX=${prefix} \\\n-Dsisl_INSTALL_PREFIX=${prefix} \\\n-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n-DCMAKE_BUILD_TYPE=Release \\\n-DBUILD_SHARED_LIBS=ON\n\nmake -j${nproc}\nmake install\n\n"""
version = "v4.6.0"

