augment_platform_block = """    using Base.BinaryPlatforms\n    # Can't use Preferences since we might be running this very early with a non-existing Manifest\nMPIPreferences_UUID = Base.UUID(\"3da0fdf6-3ccc-4f1b-acd9-58baa6c99267\")\nconst preferences = Base.get_preferences(MPIPreferences_UUID)\n\n# Keep logic in sync with MPIPreferences.jl\nfunction augment_mpi!(platform)\n    # Doesn't need to be `const` since we depend on MPIPreferences so we\n    # invalidate the cache when it changes.\n    # Note: MPIPreferences uses `Sys.iswindows()` without the `platform` argument.\n    binary = get(preferences, \"binary\", Sys.iswindows(platform) ? \"MicrosoftMPI_jll\" : \"MPICH_jll\")\n\n    abi = if binary == \"system\"\n        let abi = get(preferences, \"abi\", nothing)\n            if abi === nothing\n                error(\"MPIPreferences: Inconsistent state detected, binary set to system, but no ABI set.\")\n            else\n                abi\n            end\n        end\n    elseif binary == \"MicrosoftMPI_jll\"\n        \"MicrosoftMPI\"\n    elseif binary == \"MPICH_jll\"\n        \"MPICH\"\n    elseif binary == \"OpenMPI_jll\"\n        \"OpenMPI\"\n    elseif binary == \"MPItrampoline_jll\"\n        \"MPItrampoline\"\n    else\n        error(\"Unknown binary: $binary\")\n    end\n\n    if !haskey(platform, \"mpi\")\n        platform[\"mpi\"] = abi\n    end\n    return platform\nend\n\n    augment_platform!(platform::Platform) = augment_mpi!(platform)\n"""
init_block = ""
julia_compat = "1.9"
lazy_artifacts = false
name = "SIRIUS"
platforms = ["x86_64-linux-gnu-libgfortran5-cxx03-mpi+mpich", "x86_64-linux-gnu-libgfortran5-cxx11-mpi+mpich", "aarch64-linux-gnu-libgfortran5-cxx03-mpi+mpich", "aarch64-linux-gnu-libgfortran5-cxx11-mpi+mpich", "aarch64-apple-darwin-libgfortran5-mpi+mpich", "x86_64-linux-gnu-libgfortran5-cxx03-mpi+openmpi", "x86_64-linux-gnu-libgfortran5-cxx11-mpi+openmpi", "aarch64-linux-gnu-libgfortran5-cxx03-mpi+openmpi", "aarch64-linux-gnu-libgfortran5-cxx11-mpi+openmpi", "aarch64-apple-darwin-libgfortran5-mpi+openmpi"]
script = """apk del cmake\n\ncd $WORKSPACE/srcdir/SIRIUS\n\n#For GSL to be correctly linked to cblas\nexport LDFLAGS=\"-lgsl -lgslcblas -lblastrampoline\"\n\nCMAKE_ARGS=\"-DSIRIUS_CREATE_FORTRAN_BINDINGS=ON \\\n            -DSIRIUS_USE_OPENMP=ON \\\n            -DSIRIUS_USE_PUGIXML=ON \\\n            -DSIRIUS_USE_MEMORY_POOL=OFF \\\n            -DSIRIUS_BUILD_APPS=OFF \\\n            -DSIRIUS_USE_PROFILER=OFF \\\n            -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n            -DCMAKE_FIND_ROOT_PATH='${prefix}/lib/mpich;${prefix}' \\\n            -DCMAKE_INSTALL_PREFIX=$prefix \\\n            -DCMAKE_BUILD_TYPE=Release \\\n            -DBUILD_SHARED_LIBS=ON \\\n            -DMPI_C_COMPILER=$bindir/mpicc \\\n            -DMPI_CXX_COMPILER=$bindir/mpicxx\"\n\n#need to pass various results of CMake's try_run() for MPI compilers for succesful build\nCMAKE_ARGS=\"${CMAKE_ARGS} -DMPI_RUN_RESULT_C_libver_mpi_normal=0 \\\n                          -DMPI_RUN_RESULT_C_libver_mpi_normal__TRYRUN_OUTPUT='' \\\n                          -DMPI_RUN_RESULT_CXX_libver_mpi_normal=0 \\\n                          -DMPI_RUN_RESULT_CXX_libver_mpi_normal__TRYRUN_OUTPUT='' \\\n                          -DMPI_RUN_RESULT_Fortran_libver_mpi_F90_MODULE=0 \\\n                          -DMPI_RUN_RESULT_Fortran_libver_mpi_F90_MODULE__TRYRUN_OUTPUT='' \\\n                          -DMPI_RUN_RESULT_Fortran_libver_mpi_F08_MODULE=0 \\\n                          -DMPI_RUN_RESULT_Fortran_libver_mpi_F08_MODULE__TRYRUN_OUTPUT=''\"\n\ncmake -B build ${CMAKE_ARGS}\n\n#On MacOS, need to explicitly remove the -fallow-argument-mismatch flag, because not recognized by Clang\nif [[ \"${target}\" == *-apple* ]]; then\n   cmake -B build \"-DMPI_Fortran_COMPILE_OPTIONS=''\"\nfi\n\ncmake --build build --parallel ${nproc}\ncmake --install build\n"""
