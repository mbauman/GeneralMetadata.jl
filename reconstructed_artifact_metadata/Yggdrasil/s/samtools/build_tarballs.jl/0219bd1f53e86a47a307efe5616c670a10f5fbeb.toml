name = "samtools"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/samtools/\nautoheader\nautoconf -Wno-syntax\nif [[ \"${target}\" == x86_64-linux-musl ]]; then\n    # Need to pass `-lcurl -lnghttp2` because it's needed by libhts\n    # TODO: find a way to avoid this.\n    export LIBS=\"-lcurl -lnghttp2\"\nelif [[ \"${target}\" == *-freebsd* ]]; then\n     export CPPFLAGS=\"-I${includedir}\"\nfi\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\n"""
version = "v1.19.2"

