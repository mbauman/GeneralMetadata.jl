script = """cd $WORKSPACE/srcdir/samtools/\nautoheader\nautoconf -Wno-syntax\nexport CPPFLAGS=\"-I${includedir}\"\nif [[ \"${target}\" != *-darwin* ]]; then\n    # Need to pass `-lcurl` because it's needed by libhts\n    export LIBS=\"-lcurl\"\nfi\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\n"""
