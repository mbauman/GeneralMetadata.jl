name = "startin"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf"]
script = """cd $WORKSPACE/srcdir/startin/\ncargo build --features c_api --release -j${nproc}\nmkdir ${libdir}\nif [[ \"${target}\" == *-w64-mingw32* ]]; then\n    # Windows generates .dlls without the lib prefix\n    cp target/${rust_target}/release/startin.dll ${libdir}/libstartin.dll\nelse\n    cp target/${rust_target}/release/libstartin.${dlext} ${libdir}/libstartin.${dlext}\nfi\n"""
version = "v0.5.2"

