dependencies = []
name = "sais"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/sais-2.4.1/\nif [[ $nbits == 64 ]]; then\n  # modify the build to put sais and sais64 into the same library\n  build64=ON\n  sed -ri \\\n    -e \"s/sais sais.c/sais sais.c sais64.c/\" \\\n    -e \"s/sais PROPERTIES/sais PROPERTIES\\n  COMPILE_FLAGS \"-DSAIS_BUILD_64BIT\"/\" \\\n    lib/CMakeLists.txt\nelse\n  build64=OFF\nfi\nmkdir build && cd build/\ncmake -DCMAKE_INSTALL_PREFIX=$prefix -DCMAKE_TOOLCHAIN_FILE=$CMAKE_TARGET_TOOLCHAIN -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=OFF -DBUILD_SAIS64=$build64 ..\nmake -j$nproc\nmake install\n"""
version = "v2.4.1"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libsais"]
type = "lib"
variable_name = "libsais"

