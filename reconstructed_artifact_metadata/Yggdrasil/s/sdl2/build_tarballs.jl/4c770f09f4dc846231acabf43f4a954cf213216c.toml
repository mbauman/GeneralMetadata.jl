name = "SDL2"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/SDL*\n\nFLAGS=()\nif [[ \"${target}\" == *-linux-* ]] || [[ \"${target}\" == *-freebsd* ]]; then\n    FLAGS+=(--with-x)\n    if [[ \"${target}\" == *-freebsd* ]]; then\n        # Needed for libusb_* symbols\n        export LIBUSB_LIBS=\"-lusb\"\n    fi\nelif [[ \"${target}\" == *-apple-* ]]; then\n    # Link to libclang_rt.osx to resolve the symbol `___isPlatformVersionAtLeast`:\n    # <https://github.com/libsdl-org/SDL/issues/6491>.\n    export LDFLAGS=\"-L${libdir}/darwin -lclang_rt.osx\"\nfi\nif [[ \"${target}\" == riscv64-* ]]; then\n    # Newer compilers report a warning which is an error\n    FLAGS+=(CFLAGS=-Wno-error=incompatible-pointer-types)\nfi\nif [[ \"${target}\" == *musl* ]]; then\n    export LDFLAGS=-liconv\nfi\n\nmkdir build && cd build\n../configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} \\\n    --enable-shared \\\n    --disable-static \\\n    \"${FLAGS[@]}\"\n\nmake -j${nproc} V=1\nmake install V=1\ninstall_license ../LICENSE.txt\n"""
version = "v2.32.10"

