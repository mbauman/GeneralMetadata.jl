dependencies = ["Xorg_libX11_jll", "Xorg_libXcursor_jll", "Xorg_libXext_jll", "Xorg_libXinerama_jll", "Xorg_libXrandr_jll", "Xorg_libXScrnSaver_jll", "Libglvnd_jll"]
name = "SDL2"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/SDL2-*/\n\nif [[ \"${target}\" == i686-linux-* ]] || [[ \"${target}\" == arm-linux-* ]]; then\n    # Apply patch suggested at http://forums.libsdl.org/viewtopic.php?p=38887#38887\n    atomic_patch -p1 ../patches/opengl_es2_conflicting_type.patch\nfi\n\nFLAGS=()\nif [[ \"${target}\" == *-linux-* ]] || [[ \"${target}\" == *-freebsd* ]]; then\n    FLAGS+=(--with-x)\nfi\n\nexport CPPFLAGS=\"-I${prefix}/include\"\nexport LDFLAGS=\"-L${libdir}\"\n\n./configure --prefix=${prefix} --host=${target} \\\n    --enable-shared \\\n    --disable-static \\\n    \"${FLAGS[@]}\"\nmake -j${nproc}\nmake install\n"""
sources = [{"http://www.libsdl.org/release/SDL2-2.0.10.tar.gz" = "b4656c13a1f0d0023ae2f4a9cf08ec92fffb464e0f24238337784159b8b91d57"}, "./bundled"]
version = "v2.0.10"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libSDL2", "SDL2"]
type = "lib"
variable_name = "libsdl2"
