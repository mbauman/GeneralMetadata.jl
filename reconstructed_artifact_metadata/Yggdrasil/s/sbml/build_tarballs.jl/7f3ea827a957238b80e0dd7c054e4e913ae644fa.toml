script = """cd ${WORKSPACE}/srcdir/libsbml-*\nmkdir build\ncd build\ncmake \\\n  -DCMAKE_INSTALL_PREFIX=${prefix} \\\n  -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n  -DCMAKE_LIBRARY_PATH=${libdir} \\\n  -DCMAKE_INCLUDE_PATH=\"${includedir}/libxml2;${includedir}\" \\\n  -DENABLE_ARRAYS=ON \\\n  -DENABLE_COMP=ON \\\n  -DENABLE_DISTRIB=ON \\\n  -DENABLE_DYN=ON \\\n  -DENABLE_FBC=ON \\\n  -DENABLE_GROUPS=ON \\\n  -DENABLE_L3V2EXTENDEDMATH=ON \\\n  -DENABLE_LAYOUT=ON \\\n  -DENABLE_MULTI=ON \\\n  -DENABLE_QUAL=ON \\\n  -DENABLE_RENDER=ON \\\n  -DENABLE_REQUIREDELEMENTS=ON \\\n  -DENABLE_SPATIAL=ON \\\n  ..\nmake -j${nproc}\nmake install\n\n# Remove large static library.\nrm ${prefix}/lib/libsbml-static.a\n"""
version = "v5.19.0"

