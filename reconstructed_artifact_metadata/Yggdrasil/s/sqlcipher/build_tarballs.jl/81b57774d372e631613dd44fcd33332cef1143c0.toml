augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "SQLCipher"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin"]
script = """cd $WORKSPACE/srcdir/sqlcipher\n\n# use same flags as SQLite_jll\n# plus those provided at https://github.com/sqlcipher/sqlcipher\nexport CPPFLAGS=\"-DSQLITE_ENABLE_COLUMN_METADATA=1 \\\n                 -DSQLITE_ENABLE_UNLOCK_NOTIFY \\\n                 -DSQLITE_ENABLE_DBSTAT_VTAB=1 \\\n                 -DSQLITE_ENABLE_FTS3_TOKENIZER=1 \\\n                 -DSQLITE_SECURE_DELETE \\\n                 -DSQLITE_MAX_VARIABLE_NUMBER=250000 \\\n                 -DSQLITE_MAX_EXPR_DEPTH=10000\"\n./configure --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --enable-tempstore=yes \\\n    --disable-static \\\n    --enable-fts3 \\\n    --enable-fts4 \\\n    --enable-fts5 \\\n    --enable-rtree \\\n    --enable-json1 \\\n    CFLAGS=\"-DSQLITE_HAS_CODEC\" \\\n    LDFLAGS=\"-L${libdir}\" \\\n    LDFLAGS=\"-lcrypto\"\n\nmake -j${nproc}\nmake install\n\n# SQLCipher and SQLite licenses\ninstall_license LICENSE*\n"""
version = "v4.6.1"

