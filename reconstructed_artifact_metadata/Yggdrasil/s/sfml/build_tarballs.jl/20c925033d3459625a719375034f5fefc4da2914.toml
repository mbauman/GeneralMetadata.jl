init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "SFML"
platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-apple-darwin", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """# build SFML\ncd ${WORKSPACE}/srcdir\n\ncd SFML\nmkdir build && cd build\n\nCMAKE_FLAGS=\"-DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release\"\n\nif [[ \"${target}\" == *apple* ]]; then\nCMAKE_FLAGS=\"${CMAKE_FLAGS} -DSFML_DEPENDENCIES_INSTALL_PREFIX=${WORKSPACE}/destdir/Frameworks\"\nfi\n\nif [[ \"${target}\" == *mingw* ]] && [[ ${nbits} == 64 ]]; then\nCMAKE_FLAGS=\"${CMAKE_FLAGS} -DOPENAL_LIBRARY=${WORKSPACE}/srcdir/SFML/extlibs/bin/x64/openal32.dll\"\nfi\n\nif [[ \"${target}\" == *mingw* ]] && [[ ${nbits} == 32 ]]; then\nCMAKE_FLAGS=\"${CMAKE_FLAGS} -DOPENAL_LIBRARY=${WORKSPACE}/srcdir/SFML/extlibs/bin/x86/openal32.dll\"\nfi\n\ncmake .. ${CMAKE_FLAGS}\nmake\nmake install\ninstall_license ../license.md\n\n"""
version = "v2.5.1"

