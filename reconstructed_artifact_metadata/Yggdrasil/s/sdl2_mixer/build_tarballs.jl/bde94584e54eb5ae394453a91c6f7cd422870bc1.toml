dependencies = ["SDL2_jll", "libvorbis_jll", "FLAC_jll", "mpg123_jll"]
name = "SDL2_mixer"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/SDL2_mixer-*/\nexport CPPFLAGS=\"-I${prefix}/include\" \n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --with-pic \nmake -j${nproc}\nmake install\nif [[ \"${target}\" == *-freebsd* ]]; then\n    # We need to manually build the shared library for FreeBSD\n    cd \"${libdir}\"\n    ar x libSDL2_mixer.a\n    cc -shared -o libSDL2_mixer.${dlext} *.o\nfi\n"""
version = "v2.0.4"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libSDL2_mixer", "SDL2_mixer"]
type = "lib"
variable_name = "libsdl2_mixer"

[[sources]]
"http://www.libsdl.org/projects/SDL_mixer/release/SDL2_mixer-2.0.4.tar.gz" = "b4cf5a382c061cd75081cf246c2aa2f9df8db04bdda8dcdc6b6cca55bede2419"
