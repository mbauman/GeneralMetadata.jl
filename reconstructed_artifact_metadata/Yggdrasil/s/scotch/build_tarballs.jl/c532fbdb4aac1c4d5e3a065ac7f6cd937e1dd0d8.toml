julia_compat = "1.6"
lazy_artifacts = false
name = "SCOTCH"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/scotch*\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/scotch.patch\"\n\nmkdir -p src/dummysizes/build-host\ncd src/dummysizes/build-host\ncp ${WORKSPACE}/srcdir/patches/CMakeLists-dummysizes.txt ../CMakeLists.txt\n\nCC=${CC_BUILD} cmake .. \\\n    -DBUILD_PTSCOTCH=OFF \\\n    -DCMAKE_BUILD_TYPE=Release\n\nmake -j${nproc}\n\ncd ${WORKSPACE}/srcdir/scotch*\nmkdir build\ncd build\n\nFLAGS=\"\"\nif [[ \"${target}\" == *linux* ]]; then\n    FLAGS=\"-lrt\"\nfi\nif [[ \"${target}\" == *linux-musl* ]]; then\n    FLAGS=\"-lrt -D_GNU_SOURCE\"\nfi\nif [[ \"${target}\" == *freebsd* ]]; then\n    FLAGS=\"-Dcpu_set_t=cpuset_t -D__BSD_VISIBLE\"\nfi\n\nCFLAGS=$FLAGS cmake .. \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DINTSIZE=\"32\" \\\n    -DTHREADS=ON \\\n    -DMPI_THREAD_MULTIPLE=OFF \\\n    -DBUILD_PTSCOTCH=OFF \\\n    -DBUILD_LIBESMUMPS=ON \\\n    -DBUILD_LIBSCOTCHMETIS=ON \\\n    -DBUILD_DUMMYSIZES=OFF \\\n    -DINSTALL_METIS_HEADERS=OFF \\\n    -DLIBSCOTCHERR=scotcherr \\\n    -DENABLE_TESTS=OFF\n\nmake -j${nproc}\nmake install\n\ninstall_license ${WORKSPACE}/srcdir/scotch/LICENSE_en.txt\n"""
version = "v7.0.6"

