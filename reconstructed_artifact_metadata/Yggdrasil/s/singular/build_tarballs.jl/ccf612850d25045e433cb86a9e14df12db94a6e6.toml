init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "Singular"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd [Ss]ingular*\n\nfor f in ${WORKSPACE}/srcdir/patches/*.patch; do\n    atomic_patch -p1 ${f}\ndone\n\n#./autogen.sh\nexport CPPFLAGS=\"-I${prefix}/include\"\n./configure --prefix=$prefix --host=$target --build=${MACHTYPE} \\\n    --with-libparse \\\n    --enable-shared \\\n    --disable-static \\\n    --enable-p-procs-static \\\n    --disable-p-procs-dynamic \\\n    --enable-gfanlib \\\n    --with-readline=no \\\n    --with-gmp=$prefix \\\n    --with-flint=$prefix \\\n    --without-python\n\nmake -j${nproc}\nmake install\n"""
version = "v402.0.1"

