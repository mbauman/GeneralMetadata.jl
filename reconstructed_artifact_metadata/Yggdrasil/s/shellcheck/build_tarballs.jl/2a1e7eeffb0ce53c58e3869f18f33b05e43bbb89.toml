augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "ShellCheck"
platforms = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "riscv64-linux-gnu", "x86_64-linux-gnu", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/\n# In general, ARMv6 programs can run on ARMv7\nln -s armv6l-linux-gnueabihf arm-linux-gnueabihf\ninstall -Dvm 755 ${target}/shellcheck-v*/shellcheck${exeext} \"${bindir}/shellcheck${exeext}\"\ninstall_license ${target}/shellcheck-v*/LICENSE.txt\n"""
version = "v0.11.0"

[[products]]
binnames = ["shellcheck"]
type = "exe"
variable_name = "shellcheck"

