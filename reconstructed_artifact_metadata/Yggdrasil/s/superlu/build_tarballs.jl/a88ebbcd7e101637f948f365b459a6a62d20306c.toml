name = "SuperLU"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/superlu*\nmkdir build && cd build\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -Denable_internal_blaslib=OFF \\\n    -Denable_matlabmex=OFF \\\n    -Denable_tests=OFF \\\n    -Denable_doc=OFF \\\n    -Denable_single=ON \\\n    -Denable_double=ON \\\n    -Denable_complex=ON \\\n    -Denable_complex16=ON \\\n    -DTPL_BLAS_LIBRARIES=\"${libdir}/libopenblas.${dlext}\" \\\n    ..\nmake -j${nproc}\nmake install\nif [[ \"${target}\" == *-mingw* ]]; then\n    # Manually install the library\n    cp \"SRC/libsuperlu.${dlext}\" \"${libdir}/libsuperlu.${dlext}\"\nfi\n"""
version = "v5.3.0"

