julia_compat = "1.6"
lazy_artifacts = false
name = "SimpleBLE"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir\ninstall_license simpleble/LICENSE.md\n# Currently building for windows does not work I suspect \n# because we need MinGW 14 to have access to the right winrt\n# header files, so we download perbuilt binaries and use those\nif [[ ${target} == *mingw* ]]; then\n    if [[ ${target} == i686* ]]; then\n        cd windllx32/shared/bin/\n    else\n        cd windllx64/shared/bin/\n    fi\n    chmod +x simpleble.dll simplecble.dll\n    mkdir ${prefix}/bin || echo \"Its fine\"\n    cp -a simpleble.dll simplecble.dll ${prefix}/bin\nelse\n    cd simpleble/\n    cmake -S simplecble -B build_simplecble -DCMAKE_INSTALL_PREFIX=$prefix -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=TRUE\n    cmake --build build_simplecble --parallel ${nproc}\n    cd build_simplecble/\n    make install\nfi\n"""
version = "v0.12.1"

