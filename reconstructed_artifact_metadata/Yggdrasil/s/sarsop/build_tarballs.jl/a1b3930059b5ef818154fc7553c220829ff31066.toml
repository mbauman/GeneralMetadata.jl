augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "SARSOP"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir\ncd sarsop/src\nmake -j${nprocs} CC=${CC} CXX=${CXX} LINKER=${CXX} DESTDIR=${prefix}\nmake install DESTDIR=${prefix}\nif [[ \"${target}\" == *mingw* ]]; then\n    for file in ${prefix}/bin/*;\n    do\n        mv $file $file.exe\n    done\nfi\ninstall_license ${WORKSPACE}/srcdir/sarsop/license/*\nexit\n"""
version = "v0.96.1"

