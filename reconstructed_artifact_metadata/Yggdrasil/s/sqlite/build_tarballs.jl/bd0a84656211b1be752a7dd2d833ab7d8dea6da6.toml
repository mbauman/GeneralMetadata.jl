name = "SQLite"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/sqlite-autoconf-*\n\n# Use same flags as\n# https://github.com/archlinux/svntogit-packages/blob/packages/sqlite/trunk/PKGBUILD\nexport CPPFLAGS=\"-DSQLITE_ENABLE_COLUMN_METADATA=1 \\\n                 -DSQLITE_ENABLE_UNLOCK_NOTIFY \\\n                 -DSQLITE_ENABLE_DBSTAT_VTAB=1 \\\n                 -DSQLITE_ENABLE_FTS3_TOKENIZER=1 \\\n                 -DSQLITE_ENABLE_FTS3_PARENTHESIS \\\n                 -DSQLITE_SECURE_DELETE \\\n                 -DSQLITE_ENABLE_STMTVTAB \\\n                 -DSQLITE_MAX_VARIABLE_NUMBER=250000 \\\n                 -DSQLITE_MAX_EXPR_DEPTH=10000 \\\n                 -DSQLITE_ENABLE_MATH_FUNCTIONS \\\n                 -DSQLITE_USE_URI\"\n\n./configure --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=$target \\\n    --disable-static \\\n    --enable-fts3 \\\n    --enable-fts4 \\\n    --enable-fts5 \\\n    --enable-rtree\nmake -j${nproc}\nmake install\ninstall_license \"${WORKSPACE}/srcdir/LICENSE\"\n"""
version = "v3.53.2"

