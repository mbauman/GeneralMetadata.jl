init_block = ""
lazy_artifacts = false
name = "SQLite"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/sqlite-autoconf-*/\n\n# Use same flags as\n# https://git.archlinux.org/svntogit/packages.git/tree/trunk/PKGBUILD?h=packages/sqlite&id=d8b6ba561152179e943807054388462b7259e6df\nexport CPPFLAGS=\"-DSQLITE_ENABLE_COLUMN_METADATA=1 \\\n                 -DSQLITE_ENABLE_UNLOCK_NOTIFY \\\n                 -DSQLITE_ENABLE_DBSTAT_VTAB=1 \\\n                 -DSQLITE_ENABLE_FTS3_TOKENIZER=1 \\\n                 -DSQLITE_SECURE_DELETE \\\n                 -DSQLITE_MAX_VARIABLE_NUMBER=250000 \\\n                 -DSQLITE_MAX_EXPR_DEPTH=10000\"\n\n./configure --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=$target \\\n    --disable-static \\\n    --disable-amalgamation \\\n    --enable-fts3 \\\n    --enable-fts4 \\\n    --enable-fts5 \\\n    --enable-rtree \\\n    --enable-json1\nmake -j${nproc}\nmake install\ninstall_license \"${WORKSPACE}/srcdir/LICENSE\"\n"""
version = "v3.32.3"

