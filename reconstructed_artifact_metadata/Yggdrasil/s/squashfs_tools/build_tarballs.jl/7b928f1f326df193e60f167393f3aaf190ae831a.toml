init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "squashfs_tools"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu"]
