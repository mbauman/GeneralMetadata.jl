augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "strace"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu"]
script = """cd $WORKSPACE/srcdir/strace\n\n# Install GNU date so that bootstrap works\ncp ${host_bindir}/date /usr/local/bin/\n./bootstrap\n\n# Disable multiple personalities as our 64-bit compilers do not have 32-bit capabilities\n# Also build as a static executable so that the libc is embedded within `strace`.\n# Disable -Werror\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} \\\n            --enable-mpers=no \\\n            --disable-gcc-Werror \\\n            LDFLAGS='-static -pthread'\nmake -j${nproc}\nmake install\n"""
version = "v6.7.0"

