init_block = ""
lazy_artifacts = false
name = "Sundials"
platforms = ["i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran3", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "armv7l-linux-gnueabihf-libgfortran3", "armv7l-linux-gnueabihf-libgfortran4", "armv7l-linux-gnueabihf-libgfortran5", "i686-linux-musl-libgfortran3", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran3", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran3", "aarch64-linux-musl-libgfortran4", "aarch64-linux-musl-libgfortran5", "armv7l-linux-musleabihf-libgfortran3", "armv7l-linux-musleabihf-libgfortran4", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin14-libgfortran3", "x86_64-apple-darwin14-libgfortran4", "x86_64-apple-darwin14-libgfortran5", "x86_64-unknown-freebsd11.1-libgfortran3", "x86_64-unknown-freebsd11.1-libgfortran4", "x86_64-unknown-freebsd11.1-libgfortran5", "i686-w64-mingw32-libgfortran3", "i686-w64-mingw32-libgfortran4", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran3", "x86_64-w64-mingw32-libgfortran4", "x86_64-w64-mingw32-libgfortran5"]
script = """cd $WORKSPACE/srcdir/sundials*\n\n# Set up CFLAGS\nif [[ \"${target}\" == *-mingw* ]]; then\n    atomic_patch -p1 $WORKSPACE/srcdir/patches/Sundials_windows.patch\n    # Work around https://github.com/LLNL/sundials/issues/29\n    export CFLAGS=\"${CFLAGS} -DBUILD_SUNDIALS_LIBRARY\"\nelif [[ \"${target}\" == powerpc64le-* ]]; then\n    export CFLAGS=\"-Wl,-rpath-link,/opt/${target}/${target}/lib64\"\nfi\n\n# Set up LAPACK\nLAPACK_LIBRARIES=\"-lgfortran\"\nif [[ ${nbits} == 64 ]] && [[ ${target} != aarch64* ]]; then\n    atomic_patch -p1 $WORKSPACE/srcdir/patches/Sundials_Fortran.patch\n    LAPACK_LIBRARIES=\"${LAPACK_LIBRARIES} ${libdir}/libopenblas64_.${dlext}\"\nelse\n    LAPACK_LIBRARIES=\"${LAPACK_LIBRARIES} ${libdir}/libopenblas.${dlext}\"\nfi\nif [[ \"${target}\" == i686-* ]] || [[ \"${target}\" == x86_64-* ]]; then\n    LAPACK_LIBRARIES=\"${LAPACK_LIBRARIES} -lquadmath\"\nelif [[ \"${target}\" == powerpc64le-* ]]; then\n    LAPACK_LIBRARIES=\"${LAPACK_LIBRARIES} -lgomp -ldl -lm -lpthread\"\nfi\n\n# Build\nmkdir build && cd build\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n    -DEXAMPLES_ENABLE_C=OFF \\\n    -DKLU_ENABLE=ON -DKLU_INCLUDE_DIR=\"$prefix/include\" -DKLU_LIBRARY_DIR=\"$libdir\" \\\n    -DLAPACK_ENABLE=ON -DLAPACK_LIBRARIES:STRING=\"${LAPACK_LIBRARIES}\" \\\n    ..\nmake -j${nproc}\nmake install\n\n# Move libraries to ${libdir} on Windows\nif [[ \"${target}\" == *-mingw* ]]; then\n    mv ${prefix}/lib/libsundials_*.${dlext} \"${libdir}\"\nfi\n"""
version = "v5.2.0"

