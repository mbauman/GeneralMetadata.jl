dependencies = ["SDL2_jll", "libwebp_jll", "JpegTurbo_jll", "libpng_jll", "Libtiff_jll"]
name = "SDL2_image"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/SDL2_image-*/\nexport CPPFLAGS=\"-I${prefix}/include\"\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --with-pic\nmake -j${nproc}\nmake install\nif [[ \"${target}\" == *-freebsd* ]]; then\n    # We need to manually build the shared library for FreeBSD\n    cd \"${libdir}\"\n    ar x libSDL2_image.a\n    cc -shared -o libSDL2_image.${dlext} *.o\nfi\n"""
version = "v2.0.5"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libSDL2_image", "SDL2_image"]
type = "lib"
variable_name = "libsdl2_image"

