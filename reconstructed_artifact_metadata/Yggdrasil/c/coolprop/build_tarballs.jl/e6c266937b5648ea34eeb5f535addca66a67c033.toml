platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """macos_sdk_version=11.0\nmacosx_deployment_target=10.14\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        MacOSX${macos_sdk_version}.sdk/System \\\n        MacOSX${macos_sdk_version}.sdk/usr\n    if [[ \"${target}\" == aarch64-apple-darwin* ]] &&\n       [[ \"${macosx_deployment_target}\" == 10.* ]]; then\n        export MACOSX_DEPLOYMENT_TARGET=11.0\n    else\n        export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\n    fi\nfi\ncd $WORKSPACE/srcdir\n\nsed -i 's/Windows/windows/' source/dev/Tickets/60.cpp\nsed -i 's/Windows/windows/' source/src/CPfilepaths.cpp\n# Do not add `-m32`/`-m64` flags\nsed -i 's/-m${BITNESS}//' source/CMakeLists.txt\n\nmkdir build\ncd build\ncmake -DCMAKE_INSTALL_PREFIX=$prefix -DCMAKE_FIND_ROOT_PATH=$prefix -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release -DCOOLPROP_SHARED_LIBRARY=ON ../source/\nVERBOSE=ON cmake --build . --config Release --target CoolProp -- -j${nproc}\ninstall -Dvm 0755 \"libCoolProp.${dlext}\" \"${libdir}/libCoolProp.${dlext}\"\ninstall_license $WORKSPACE/srcdir/source/LICENSE\n"""
version = "v7.2.0"

