dependencies = []
name = "Chemfiles"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/chemfiles-*/\nmkdir build && cd build\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON ..\natomic_patch -p1 ../../patches/fileno_posix.patch\nmake -j${nproc}\nmake install\n"""
sources = [{"https://github.com/chemfiles/chemfiles/archive/0.9.2.tar.gz" = "f0a40c8934cffdc8321bed79ded4cb4de5d5366d1f503a95467e294384521e82"}, "./bundled"]
version = "v0.9.2"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libchemfiles"]
type = "lib"
variable_name = "libchemfiles"
