augment_platform_block = ""
init_block = ""
julia_compat = "1.10"
lazy_artifacts = false
name = "cimnodes_editor"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir\ngit -C cimnodes_editor submodule update --init --recursive --depth 1\n\n# Regenerate cimnodes_editor with comments\ncd cimnodes_editor/generator\nsed -i \"s|g++ \"\\$TARGETS\"|${HOSTCC} \"\\$TARGETS\"|\" generator.sh\nbash ./generator.sh -t comments\ncd $WORKSPACE/srcdir\n\nmkdir build && cd build\ncmake .. -DCMAKE_INSTALL_PREFIX=${prefix} \\\n         -DCMAKE_PREFIX_PATH=${prefix} \\\n         -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n         -DCMAKE_BUILD_TYPE=Release\nmake -j${nproc}\nmake install\n\n# Copy generator files\ninstall -Dvm 644 ../cimnodes_editor/generator/output/*.json -t ${prefix}/share/cimnodes_editor\n\ninstall_license ../cimnodes_editor/imgui-node-editor/LICENSE\n"""
version = "v0.9.3"

