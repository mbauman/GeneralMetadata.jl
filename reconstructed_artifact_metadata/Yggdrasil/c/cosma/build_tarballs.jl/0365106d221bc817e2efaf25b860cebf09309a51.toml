lazy_artifacts = false
name = "COSMA"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin14-cxx03", "x86_64-apple-darwin14-cxx11", "x86_64-unknown-freebsd11.1-cxx03", "x86_64-unknown-freebsd11.1-cxx11"]
script = """cd $WORKSPACE/srcdir\n\nif [[ \"$nbits\" == \"64\" ]] && [[ \"$target\" != aarch64-* ]]; then\n    BLAS_LAPACK_LIB=\"$libdir/libopenblas64_.$dlext\"\n\n    # Fix suffixes for 64-bit OpenBLAS\n    SYMB_DEFS=()\n    for sym in cblas_sgemm cblas_dgemm cblas_cgemm cblas_zgemm; do\n        SYMB_DEFS+=(\"-D${sym}=${sym}64_\")\n    done\n    export CXXFLAGS=\"${SYMB_DEFS[@]}\"\nelse\n    BLAS_LAPACK_LIB=\"$libdir/libopenblas.$dlext\"\nfi\n\nif [[ \"$target\" == x86_64-apple-darwin14 ]] || [[ \"$target\" == x86_64-unknown-freebsd11.1 ]]; then\n    OMP_LIB=`find $libdir -iname 'libgomp*'`\n    OPENMP_CMAKE_FLAGS=\"-DOpenMP_CXX_FLAGS=-fopenmp=libgomp -DOpenMP_CXX_LIB_NAMES=gomp -DOpenMP_gomp_LIBRARY=$OMP_LIB\"\n    OMP_HEADER=`find / -name omp.h 2>/dev/null  | head -n1`\n    mkdir include\n    cp $OMP_HEADER include/\n    export CPATH=$PWD/include\nelse\n    OPENMP_CMAKE_FLAGS=\nfi\n\nmkdir build\ncd build\n\ncmake ../cosma \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCOSMA_WITH_TESTS=OFF \\\n    -DCOSMA_WITH_APPS=OFF \\\n    -DCOSMA_WITH_BENCHMARKS=OFF \\\n    -DCOSMA_WITH_INSTALL=ON \\\n    -DCOSMA_WITH_PROFILING=OFF \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DCOSMA_BLAS=OPENBLAS \\\n    -DCOSMA_SCALAPACK=OFF \\\n    -DMPI_CXX_COMPILER=$bindir/mpicxx \\\n    -DMPI_C_COMPILER=$bindir/mpicc \\\n    -DOPENBLAS_LIBRARIES=$BLAS_LAPACK_LIB \\\n    -DOPENBLAS_INCLUDE_DIR=$includedir \\\n    $OPENMP_CMAKE_FLAGS\n\nmake -j$(nproc)\nmake install\n\ninstall_license ../cosma/LICENCE\n"""
version = "v2.2.0"

