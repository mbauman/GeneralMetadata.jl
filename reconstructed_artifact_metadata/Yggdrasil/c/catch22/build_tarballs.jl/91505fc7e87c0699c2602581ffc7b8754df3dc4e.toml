augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "catch22"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\ncd catch22/C/\necho -e 'CFLAGS = -fPIC\\nLDFLAGS = -shared\\nRM = rm -f\\nTARGET_LIB = \"lib${SRC_NAME}.${dlext}\"\\nSRCS = main.c CO_AutoCorr.c DN_Mean.c DN_Spread_Std.c DN_HistogramMode_10.c DN_HistogramMode_5.c DN_OutlierInclude.c FC_LocalSimple.c IN_AutoMutualInfoStats.c MD_hrv.c PD_PeriodicityWang.c SB_BinaryStats.c SB_CoarseGrain.c SB_MotifThree.c SB_TransitionMatrix.c SC_FluctAnal.c SP_Summaries.c butterworth.c fft.c helper_functions.c histcounts.c splinefit.c stats.c\\nOBJS = $(SRCS:.c=.o)\\n.PHONY: all\\nall: ${TARGET_LIB}\\n$(TARGET_LIB): $(OBJS);    $(CC) ${LDFLAGS} -o $@ $^\\n$(SRCS:.c=.d):%.d:%.c;$(CC) $(CFLAGS) -MM $< >$@\\ninclude $(SRCS:.c=.d)\\n.PHONY: clean\\nclean:-${RM} ${TARGET_LIB} ${OBJS} $(SRCS:.c=.d)' >> Makefile\nmake\nmkdir \"${libdir}\"\ncp \"./lib${SRC_NAME}.${dlext}\" \"${libdir}/lib${SRC_NAME}.${dlext}\"\n"""
version = "v0.3.1"

