augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "catch22"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir\ncd catch22/C/\necho -e 'CC = cc\nCFLAGS = -std=c11 -fPIC -Wall -Wextra -O2\nLDFLAGS = -shared -lm\nRM = rm -f\nTARGET_LIB = \"lib$(SRC_NAME).$(dlext)\"\n\nSRCS := $(shell find ./ -name \"*.c\" ! -name \"main.c\")\n\nOBJS = $(SRCS:.c=.o)\n.PHONY: all;\nall: ${TARGET_LIB}\n$(TARGET_LIB): $(OBJS)\n\t$(CC) -o $@ $^ $(LDFLAGS) $(FLAGS)\n.PHONY: clean\nclean:\n\t$(RM) $(TARGET_LIB) $(OBJS)\n.PHONY: install\ninstall:\n\tinstall -Dvm 755 \"./lib${SRC_NAME}.$(dlext)\" \"$(libdir)/lib$(SRC_NAME).$(dlext)\"\n' >> Makefile\nmake -j${nproc} FLAGS=\"${FLAGS}\"\nmake install\n"""
toplevel_block = ""
version = "v0.6.0"

