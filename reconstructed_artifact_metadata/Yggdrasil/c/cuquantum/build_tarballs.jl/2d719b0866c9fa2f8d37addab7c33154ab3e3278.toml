julia_compat = "1.6"
lazy_artifacts = false
name = "cuQuantum"
platforms = ["x86_64-linux-gnu", "aarch64-linux-gnu", "powerpc64le-linux-gnu"]
script = """cd ${WORKSPACE}/srcdir/${target}/cuquantum-*\n\nmkdir -p ${prefix}\ncp -var lib/ include/ ${prefix}/.\ncp -var pkg-config/ ${prefix}/lib/.\n\n# Fixup pkg-config files\nsed -i \\\n    -e \"s?^cudaroot=.*?cudaroot=${prefix}?\" \\\n    -e \"s?^libdir=.*?libdir=${libdir}?\" \\\n    -e \"s?^includedir=.*?includedir=${includedir}?\" \\\n    ${prefix}/lib/pkg-config/*.pc\n\n# Remove static libraries\nrm ${libdir}/*.a\n\n# Install license files\ninstall_license LICENSE docs/*\n"""
version = "v0.1.30"

