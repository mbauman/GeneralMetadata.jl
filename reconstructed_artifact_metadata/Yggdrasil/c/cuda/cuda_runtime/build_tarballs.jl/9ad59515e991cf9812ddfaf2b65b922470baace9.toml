script = ["""# rename directories, stripping the architecture and version suffix\nfor dir in *-archive; do\n    base=$(echo $dir | cut -d '-' -f 1)\n    mv $dir $base\ndone\n\n# license\ninstall_license cuda_cudart/LICENSE\n\n# binaries\nmkdir -p ${bindir} ${libdir} ${prefix}/lib ${prefix}/share\nif [[ ${target} == *-linux-gnu ]]; then\n    mv cuda_cudart/lib/libcudart.so* ${libdir}\n\n    mv cuda_cupti/lib/libcupti.so* ${libdir}\n    mv cuda_cupti/lib/libnvperf_host.so* ${libdir}\n    mv cuda_cupti/lib/libnvperf_target.so* ${libdir}\n\n    mv libcufft/lib/libcufft.so* libcufft/lib/libcufftw.so* ${libdir}\n\n    mv libcublas/lib/libcublas.so* libcublas/lib/libcublasLt.so* ${libdir}\n\n    mv libcusparse/lib/libcusparse.so* ${libdir}\n\n    mv libcusolver/lib/libcusolver.so* libcusolver/lib/libcusolverMg.so* ${libdir}\n\n    mv libcurand/lib/libcurand.so* ${libdir}\nelif [[ ${target} == x86_64-w64-mingw32 ]]; then\n    # starting with CUDA 13, there's an additionally `x64` subdirectory. remove it.\n    find . -name x64 -type d -execdir sh -c 'mv x64/* .' \\;\n\n    # older versions of the redist binaries had DLLs in the lib folder; correct that\n    for dir in */; do\n        mkdir -p $dir/bin $dir/lib\n        mv $dir/lib/*.dll $dir/bin || true\n    done\n\n    mv cuda_cudart/bin/cudart64_*.dll ${bindir}\n\n    mv cuda_cupti/bin/cupti64_*.dll ${bindir}\n    mv cuda_cupti/bin/nvperf_host.dll* ${libdir}\n    mv cuda_cupti/bin/nvperf_target.dll* ${libdir}\n\n    mv libcufft/bin/cufft64_*.dll libcufft/bin/cufftw64_*.dll ${bindir}\n\n    mv libcublas/bin/cublas64_*.dll libcublas/bin/cublasLt64_*.dll ${bindir}\n\n    mv libcusparse/bin/cusparse64_*.dll ${bindir}\n\n    mv libcusolver/bin/cusolver64_*.dll libcusolver/bin/cusolverMg64_*.dll ${bindir}\n\n    mv libcurand/bin/curand64_*.dll ${bindir}\n\n    # Fix permissions\n    chmod +x ${bindir}/*.dll\nfi\n""", """# First, find (true) CUDA toolkit directory in ~/.artifacts somewhere\nCUDA_ARTIFACT_DIR=$(dirname $(dirname $(realpath $prefix/cuda/bin/ptxas${exeext})))\ncd ${CUDA_ARTIFACT_DIR}\n\n# Clear out our prefix\nrm -rf ${prefix}/*\n\n# license\ninstall_license EULA.txt\n\n# headers\nmkdir -p ${prefix}/include\nmv include/* ${prefix}/include\nrm -rf ${prefix}/include/thrust\n\n# binaries\nmkdir -p ${bindir} ${libdir} ${prefix}/lib ${prefix}/share\nif [[ ${target} == *-linux-gnu ]]; then\n    # CUDA Runtime\n    mv lib64/libcudart.so* ${libdir}\n\n    # CUDA FFT Library\n    mv lib64/libcufft.so* lib64/libcufftw.so* ${libdir}\n\n    # CUDA BLAS Library\n    mv lib64/libcublas.so* lib64/libcublasLt.so* ${libdir}\n\n    # CUDA Sparse Matrix Library\n    mv lib64/libcusparse.so* ${libdir}\n\n    # CUDA Linear Solver Library\n    mv lib64/libcusolver.so* ${libdir}\n\n    # CUDA Linear Solver Multi GPU Library\n    if [[ $target != aarch64-linux-gnu ]]; then\n        mv lib64/libcusolverMg.so* ${libdir}\n    fi\n\n    # CUDA Random Number Generation Library\n    mv lib64/libcurand.so* ${libdir}\n\n    # CUDA Profiling Tools Interface (CUPTI) Library\n    mv extras/CUPTI/lib64/libcupti.so* ${libdir}\n\n    mv extras/CUPTI/lib64/libnvperf_host.so* ${libdir}\n    mv extras/CUPTI/lib64/libnvperf_target.so* ${libdir}\n\n    mv lib64/libnvrtc.so* ${libdir}\n    mv lib64/libnvrtc-builtins.so* ${libdir}\nelif [[ ${target} == x86_64-w64-mingw32 ]]; then\n    # CUDA Runtime\n    mv bin/cudart64_*.dll ${bindir}\n\n    # CUDA FFT Library\n    mv bin/cufft64_*.dll bin/cufftw64_*.dll ${bindir}\n\n    # CUDA BLAS Library\n    mv bin/cublas64_*.dll bin/cublasLt64_*.dll ${bindir}\n\n    # CUDA Sparse Matrix Library\n    mv bin/cusparse64_*.dll ${bindir}\n\n    # CUDA Linear Solver Library\n    mv bin/cusolver64_*.dll ${bindir}\n\n    # CUDA Linear Solver Nulti GPU Library\n    mv bin/cusolverMg64_*.dll ${bindir}\n\n    # CUDA Random Number Generation Library\n    mv bin/curand64_*.dll ${bindir}\n\n    # CUDA Profiling Tools Interface (CUPTI) Library\n    mv extras/CUPTI/lib64/cupti64_*.dll ${bindir}\n\n    mv extras/CUPTI/lib64/nvperf_host.dll* ${libdir}\n    mv extras/CUPTI/lib64/nvperf_target.dll* ${libdir}\n\n    mv bin/nvrtc64_* ${bindir}\n    mv bin/nvrtc-builtins64_* ${bindir}\n\n    # Fix permissions\n    chmod +x ${bindir}/*.dll\nfi\n"""]
