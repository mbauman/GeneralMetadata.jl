augment_platform_block = """using Base.BinaryPlatforms\n\nfunction _is_tegra()\n    if isfile(\"/etc/nv_tegra_release\")\n        return true\n    end\n    if isfile(\"/proc/device-tree/compatible\") &&\n        contains(read(\"/proc/device-tree/compatible\", String), \"tegra\")\n        return true\n    end\n    return false\nend\n\n# the NVIDIA Linux for Tegra release, e.g. v\"35.6.5\", or `nothing`\nfunction _l4t_version()\n    try\n        isfile(\"/etc/nv_tegra_release\") || return nothing\n        release = read(\"/etc/nv_tegra_release\", String)\n        m = match(r\"^# R(\\d+) \\(release\\), REVISION: ([0-9]+(?:\\.[0-9]+)*)\", release)\n        m === nothing && return nothing\n        return tryparse(VersionNumber, string(m.captures[1], \".\", m.captures[2]))\n    catch\n        return nothing\n    end\nend\n\n# The value of the `tegra` platform tag for the current host: \"none\" on non-Tegra\n# systems, or the L4T major version (the kernel-mode driver generation, e.g. \"35\"\n# for JetPack 5) bucketed into the generations we distinguish: \"32\" (JetPack 4 and\n# earlier: no compat driver exists), \"35\" (JetPack 5: compat drivers up to CUDA\n# 12.2), \"36\" (JetPack 6: up to CUDA 12.9), and \"38\" (JetPack 7 and later, and\n# unidentifiable L4T versions: no compat driver applies). Only \"35\" and \"36\" have\n# an artifact; the others match nothing, which is the point: a Tegra host must\n# never receive the SBSA compat driver. This function never throws.\nfunction _tegra_artifact_generation()\n    tegra = try\n        _is_tegra()\n    catch\n        false\n    end\n    tegra || return \"none\"\n\n    try\n        l4t = _l4t_version()\n        l4t === nothing && return \"38\"\n        if l4t.major < 35\n            return \"32\"\n        elseif l4t.major == 35\n            return \"35\"\n        elseif 36 <= l4t.major < 38\n            return \"36\"\n        else\n            return \"38\"\n        end\n    catch\n        return \"38\"\n    end\nend\n\nfunction augment_platform!(platform::Platform)\n    haskey(platform, \"tegra\") && return platform\n    platform[\"tegra\"] = _tegra_artifact_generation()\n    return platform\nend"""
dependencies = []
init_block = """\n    # manual use of preferences, as we can't depend on additional packages in JLLs.\n    CUDA_Driver_jll_uuid = Base.UUID(\"4ee394cb-3365-5eb0-8335-949819d2adfc\")\n    preferences = Base.get_preferences(CUDA_Driver_jll_uuid)\n    function parse_preference(val)\n        if isa(val, Bool)\n            val\n        elseif isa(val, String)\n            parsed = tryparse(Bool, val)\n            if parsed === nothing\n                @error \"CUDA compat preference is not valid; expected a boolean, but got '$val'\"\n                missing\n            else\n                parsed\n            end\n        else\n            @error \"CUDA compat preference is not valid; expected a boolean, but got '$val'\"\n            missing\n        end\n    end\n    compat_preference = if haskey(preferences, \"compat\")\n        parse_preference(preferences[\"compat\"])\n    elseif haskey(ENV, \"JULIA_CUDA_USE_COMPAT\")\n        parse_preference(ENV[\"JULIA_CUDA_USE_COMPAT\"])\n    else\n        missing\n    end\n    compat_forced = compat_preference === true\n\n    # if anything goes wrong, we keep using the system driver: `libcuda` already holds its\n    # name (set unconditionally in the module's toplevel block), and only gets replaced at\n    # the very end when we decide to load the forwards-compatible driver instead.\n    libcuda_system = Sys.iswindows() ? \"nvcuda\" : \"libcuda.so.1\"\n\n    # check if we even have an artifact\n    if @isdefined(libcuda_compat)\n        @debug \"Forward-compatible driver found at $libcuda_compat\"\n    else\n        @debug \"No forward-compatible driver available for your platform.\"\n        return\n    end\n\n    # check the user preference\n    if compat_preference !== missing\n        if !compat_preference\n            @debug \"User disallows using forward-compatible driver.\"\n            return\n        end\n    end\n\n    # check if the system driver is already loaded. in that case, we have to use it because\n    # the code that loaded it in the first place might have made assumptions based on it.\n    if Libdl.dlopen(libcuda_system, Libdl.RTLD_NOLOAD; throw_error=false) !== nothing\n        @debug \"System CUDA driver already loaded, continuing using it.\"\n        return\n    end\n\n    # collect the compat driver's dependent libraries. not every artifact declares\n    # every product (the L4T compat drivers lack the newer desktop-only libraries), so\n    # only reference those that exist. this is a global because dependents inspecting\n    # the driver we loaded need to preload the same list.\n    global libcuda_deps = String[]\n    for dep in [:libcuda_debugger, :libnvidia_nvvm, :libnvidia_ptxjitcompiler,\n                :libnvidia_gpucomp, :libnvidia_tileiras]\n        isdefined(@__MODULE__, dep) || continue\n        push!(libcuda_deps, getfield(@__MODULE__, dep))\n    end\n\n    # fetch driver details\n    compat_driver_task = @static if VERSION >= v\"1.12-\"\n        # XXX: avoid concurrent compilation (JuliaLang/julia#59834)\n        Threads.@spawn :samepool inspect_driver(libcuda_compat, libcuda_deps)\n    else\n        Threads.@spawn inspect_driver(libcuda_compat, libcuda_deps)\n    end\n    system_driver_task = @static if VERSION >= v\"1.12-\"\n        # XXX: avoid concurrent compilation (JuliaLang/julia#59834)\n        Threads.@spawn :samepool inspect_driver(libcuda_system; inspect_devices=true)\n    else\n        Threads.@spawn inspect_driver(libcuda_system; inspect_devices=true)\n    end\n    compat_driver_info = fetch(compat_driver_task)\n    if compat_driver_info === nothing\n        @debug \"Forwards-compatible driver is not usable (see above for details); using system driver.\"\n        return\n    end\n    @debug \"Forwards compatible driver version: $(compat_driver_info.version)\"\n    system_driver_info = fetch(system_driver_task)\n    if system_driver_info === nothing\n        @debug \"Could not query the system driver (see above for details); using system driver.\"\n        return\n    end\n    @debug \"System driver version: $(system_driver_info.version)\"\n\n    if !compat_forced\n        # The forwards-compatible driver is only useful when it is newer than\n        # the system driver.\n        if compat_driver_info.version <= system_driver_info.version\n            @debug \"Forwards-compatible driver is not newer than the system driver; using system driver.\"\n            return\n        end\n\n        # Newer driver branches can drop support for older hardware and then\n        # fail uncleanly at context creation. This was confirmed by NVIDIA for\n        # cuda-compat-13.2 on R580 kernels.\n        compat_min_cap = if compat_driver_info.version >= v\"13.1\"\n            v\"7.5\"      # r590 dropped Maxwell, Pascal and Volta\n        elseif compat_driver_info.version >= v\"12.0\"\n            v\"5.0\"      # r525 dropped Kepler\n        else\n            v\"3.5\"\n        end\n        unsupported = VersionNumber[]\n        for cap in system_driver_info.capabilities\n            if cap < compat_min_cap\n                push!(unsupported, cap)\n            end\n        end\n        if !isempty(unsupported)\n            @debug \"Forwards-compatible driver does not support devices with compute capability $(join(unsupported, \", \")); using system driver.\"\n            return\n        end\n    end\n\n    # finally, load the forwards-compatible driver\n    @debug \"Using forwards-compatible CUDA driver.\"\n    global libcuda = libcuda_compat\n\n    # load the driver and its dependencies; this should now always succeed\n    # as we've already verified that we can load it in a separate process.\n    for dep in libcuda_deps\n        Libdl.dlopen(dep; throw_error=true)\n    end\n    Libdl.dlopen(libcuda_compat; throw_error=true)\n"""
julia_compat = "1.10"
lazy_artifacts = false
name = "CUDA_Driver"
platforms = ["x86_64-linux-gnu-tegra+none", "aarch64-linux-gnu-tegra+none", "aarch64-linux-gnu-tegra+35", "aarch64-linux-gnu-tegra+36"]
script = """    # Build the driver inspection binary. We need -ldl for dlopen/dlsym/dlinfo, and\n    # -D_GNU_SOURCE to expose dlinfo/RTLD_DI_LINKMAP.\n    mkdir -p ${bindir}\n    ${CC} -std=c99 -O2 -D_GNU_SOURCE cuda_inspect_driver.c -ldl -o ${bindir}/cuda_inspect_driver${exeext}\n\n    # Install the forwards-compatible driver from the CUDA toolkit.\n    mkdir -p ${libdir}\n    cd ${WORKSPACE}/srcdir/cuda_compat*\n    install_license LICENSE\n    mv compat/* ${libdir}\n    # the L4T packages also contain MPS executables; keep those in bindir\n    mv ${libdir}/nvidia-cuda-mps-* ${bindir} 2>/dev/null || true\n"""
toplevel_block = """# The driver CUDA.jl and dependent JLLs should use: the system driver, unless `__init__`\n# decides to use the bundled forwards-compatible one and replaces this. Defined here, in\n# the JLL's `toplevel_block`, so that it exists on every platform -- also where no\n# artifact matches and there is no `__init__` -- and consumers can rely on it.\nglobal libcuda = Sys.iswindows() ? \"nvcuda\" : \"libcuda.so.1\"\n\n# `__init__` picks between the system driver and the bundled forwards-compatible one\n# based on this preference, and dependent JLLs bake the resulting driver into the\n# artifact they select. Base keys compile-time preferences by the recording module's own\n# UUID, so they cannot register it themselves; recording it here invalidates our cache,\n# and theirs along with it.\nBase.record_compiletime_preference(Base.UUID(\"4ee394cb-3365-5eb0-8335-949819d2adfc\"),\n                                   \"compat\")\n\n# inspect_driver(driver, deps=String[]; inspect_devices=false)\n#\n# Private helper for `__init__`: invoke the `cuda_inspect_driver` helper in a subprocess\n# to query a CUDA driver without dlopen'ing it in this process, which matters because\n# `__init__` compares two drivers and must not load the one it rejects. The helper\n# verifies the driver actually works by calling `cuInit` (dlopen and\n# `cuDriverGetVersion` succeed even on a driver that mismatches the loaded kernel-mode\n# driver). Returns `nothing` on failure, logging the helper's diagnostic at debug level\n# so that e.g. a driver failing `cuInit` can be told apart from one that failed to load;\n# otherwise a NamedTuple `(; path, version, capabilities)` where `path` is the resolved\n# absolute path to the driver, `version` is the driver's reported version, and\n# `capabilities` is a `Vector{VersionNumber}` of device compute capabilities -- empty\n# when `inspect_devices` is `false`.\nfunction inspect_driver(driver, deps=String[]; inspect_devices::Bool=false)\n    # the helper executable is an artifact product, which does not exist on platforms\n    # without a matching artifact (or before this module has been initialized).\n    @isdefined(cuda_inspect_driver_path) || return nothing\n    cmd = `$cuda_inspect_driver_path $driver $inspect_devices $deps`\n    out = IOBuffer()\n    err = IOBuffer()\n    proc = try\n        run(pipeline(ignorestatus(cmd); stdout=out, stderr=err))\n    catch _\n        # spawn failure (e.g. missing or non-executable helper)\n        @debug \"Could not launch the driver inspection helper for $driver\"\n        return nothing\n    end\n    if !success(proc)\n        reason = strip(String(take!(err)))\n        @debug \"Inspection of driver $driver failed\" * (isempty(reason) ? \"\" : \": $reason\")\n        return nothing\n    end\n    lines = readlines(seekstart(out))\n    if length(lines) < 2\n        @debug \"Inspection of driver $driver returned unexpected output\"\n        return nothing\n    end\n    path = lines[1]\n    version = tryparse(VersionNumber, lines[2])\n    if version === nothing\n        @debug \"Inspection of driver $driver reported an unparseable version: $(lines[2])\"\n        return nothing\n    end\n    capabilities = VersionNumber[]\n    if inspect_devices\n        for i in 3:length(lines)\n            cap = tryparse(VersionNumber, lines[i])\n            cap === nothing && continue\n            push!(capabilities, cap)\n        end\n    end\n    return (; path, version, capabilities)\nend\n\n# precompile the two calls `__init__` makes, plus the Base methods on their\n# process-spawning path that are only reached through dynamic dispatch\nprecompile(inspect_driver, (String, Vector{String}))\nprecompile(Core.kwcall, (@NamedTuple{inspect_devices::Bool}, typeof(inspect_driver), String))\nprecompile(Tuple{typeof(Base.cmd_gen), Tuple{Tuple{Base.Cmd}, Tuple{String}, Tuple{Bool}, Tuple{Array{String, 1}}}})\nprecompile(Tuple{typeof(Base.arg_gen), Bool})\nprecompile(Tuple{typeof(Base.push!), Array{Base.VersionNumber, 1}, Base.VersionNumber})\n"""
version = "v13.3.4"

