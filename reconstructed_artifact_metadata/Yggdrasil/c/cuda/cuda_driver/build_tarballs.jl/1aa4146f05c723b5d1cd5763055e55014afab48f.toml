name = "CUDA_Driver"
platforms = ["x86_64-linux-gnu", "aarch64-linux-gnu"]
script = """    # Build the driver inspection binary\n    mkdir -p ${bindir}\n    ${CC} -std=c99 -O2 cuda_inspect_driver.c -ldl -o ${bindir}/cuda_inspect_driver\n\n    mkdir -p ${libdir}\n\n    cd ${WORKSPACE}/srcdir/cuda_compat*\n\n    install_license LICENSE\n\n    mv compat/* ${libdir}\n"""
version = "v13.2.0"

