augment_platform_block = """using Base.BinaryPlatforms\n\ntry\n    using CUDA_Runtime_jll\ncatch\n    # during initial package installation, CUDA_Runtime_jll may not be available.\n    # in that case, we just won't select an artifact.\nend\n\n# can't use Preferences for the same reason\nconst CUDA_Runtime_jll_uuid = Base.UUID(\"76a88914-d11a-5bdc-97e0-2f5a05c973a2\")\nconst preferences = Base.get_preferences(CUDA_Runtime_jll_uuid)\nBase.record_compiletime_preference(CUDA_Runtime_jll_uuid, \"version\")\nBase.record_compiletime_preference(CUDA_Runtime_jll_uuid, \"local\")\n\nfunction augment_platform!(platform::Platform)\n    platform[\"cuda\"] = if @isdefined(CUDA_Runtime_jll)\n        cuda = cuda_toolkit_tag()\n        if cuda === nothing\n            \"none\"\n        else\n            # extract major version\n            cuda_version = parse(VersionNumber, cuda)\n            \"$(cuda_version.major)\"\n        end\n    else\n        \"none\"\n    end\n\n    return platform\nend\n"""
init_block = ["global cuda_version = v\"11.8\"", "global cuda_version = v\"12.9\"", "global cuda_version = v\"13.0\""]
julia_compat = "1.6"
lazy_artifacts = true
name = "CUDA_Compiler"
platforms = ["x86_64-linux-gnu-cuda+11", "aarch64-linux-gnu-cuda_platform+jetson-cuda+11", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+11", "x86_64-w64-mingw32-cuda+11", "x86_64-linux-gnu-cuda+12", "aarch64-linux-gnu-cuda_platform+jetson-cuda+12", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+12", "x86_64-w64-mingw32-cuda+12", "x86_64-linux-gnu-cuda+13", "aarch64-linux-gnu-cuda+13", "x86_64-w64-mingw32-cuda+13"]
script = """# rename directories, stripping the architecture and version suffix\nfor dir in *-archive; do\n    base=$(echo $dir | cut -d '-' -f 1)\n    mv $dir $base\ndone\n\n# license\ninstall_license cuda_nvcc/LICENSE\n\n# binaries\nmkdir -p ${bindir} ${libdir} ${prefix}/lib ${prefix}/share\nif [[ ${target} == *-linux-gnu ]]; then\n    mv cuda_cudart/lib/libcudadevrt.a ${libdir}\n\n    mkdir ${prefix}/share/libdevice\n    mv cuda_nvcc/bin/ptxas ${bindir}\n    mv cuda_nvcc/bin/nvlink ${bindir}\n    if [[ -d cuda_nvcc/nvvm ]]; then\n        mv cuda_nvcc/nvvm/libdevice/libdevice.10.bc ${prefix}/share/libdevice\n    else\n        mv libnvvm/nvvm/libdevice/libdevice.10.bc ${prefix}/share/libdevice\n    fi\n\n    mv cuda_nvdisasm/bin/nvdisasm ${bindir}\nelif [[ ${target} == x86_64-w64-mingw32 ]]; then\n    if [[ -d cuda_cudart/lib/x64 ]]; then\n        mv cuda_cudart/lib/x64/cudadevrt.lib ${prefix}/lib\n    else\n        mv cuda_cudart/lib/cudadevrt.lib ${prefix}/lib\n    fi\n\n    mkdir ${prefix}/share/libdevice\n    mv cuda_nvcc/bin/ptxas.exe ${bindir}\n    mv cuda_nvcc/bin/nvlink.exe ${bindir}\n    if [[ -d cuda_nvcc/nvvm ]]; then\n        mv cuda_nvcc/nvvm/libdevice/libdevice.10.bc ${prefix}/share/libdevice\n    else\n        mv libnvvm/nvvm/libdevice/libdevice.10.bc ${prefix}/share/libdevice\n    fi\n\n    mv cuda_nvdisasm/bin/nvdisasm.exe ${bindir}\n\n    # Fix permissions\n    chmod +x ${bindir}/*.exe\nfi\n"""
version = "v0.3.0"

