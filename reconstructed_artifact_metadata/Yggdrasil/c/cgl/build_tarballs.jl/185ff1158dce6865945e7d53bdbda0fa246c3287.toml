lazy_artifacts = false
name = "Cgl"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/Cgl*\nupdate_configure_scripts\n\n# Remove misleading libtool files\nrm -f ${prefix}/lib/*.la\n\nmkdir build\ncd build/\n\nexport CPPFLAGS=\"-I${prefix}/include -I${prefix}/include/coin\"\nif [[ ${target} == *mingw* ]]; then\n    export LDFLAGS=\"-L$prefix/bin\"\nelif [[ ${target} == *linux* ]]; then\n    export LDFLAGS=\"-ldl -lrt\"\nfi\n\n../configure --prefix=$prefix --with-pic --disable-pkg-config --build=${MACHTYPE} --host=${target} --enable-shared \\\n--enable-dependency-linking lt_cv_deplibs_check_method=pass_all \\\n--with-coinutils-lib=\"-lCoinUtils\" \\\n--with-osi-lib=\"-lOsi -lCoinUtils\" \\\n--with-osiclp-lib=\"-lOsiClp -lClp -lOsi -lCoinUtils\"\n\nmake -j${nproc}\nmake install\n"""
version = "v0.59.10"

