dependencies = []
name = "CImGui"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\nrm cimgui/CMakeLists.txt\nmv imgui wrapper/helper.c wrapper/helper.h wrapper/CMakeLists.txt cimgui/\nmkdir -p cimgui/build && cd cimgui/build\ncmake .. -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release\nmake -j${nproc}\nmake install\ninstall_license ../LICENSE ../imgui/LICENSE.txt\n"""
sources = [{"https://github.com/ocornut/imgui.git" = "bdce8336364595d1a446957a6164c97363349a53"}, {"https://github.com/cimgui/cimgui.git" = "d9e1d9a80d621cd96d9900ac340092853100416f"}, "./bundled"]
version = "v1.74.0"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libcimgui"]
type = "lib"
variable_name = "libcimgui"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libcimgui_helper"]
type = "lib"
variable_name = "libcimgui_helper"
