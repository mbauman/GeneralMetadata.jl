augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "CasADi"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/casadi\ninstall_license LICENSE.txt\nmkdir -p build\ncd build\n\nCXX_STANDARD=\"-std=c++11\"\nCMAKE_CXX_STANDARD=\"11\"\nif [[ \"${target}\" == *\"mingw\"* ]]; then\n    CXX_STANDARD=\"-std=c++14\"\n    CMAKE_CXX_STANDARD=\"14\"\nfi\n\nexport CXXFLAGS=\"-fPIC ${CXX_STANDARD}\"\nexport CFLAGS=\"${CFLAGS} -fPIC\"\n\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_INSTALL_BINDIR=${bindir} \\\n    -DCMAKE_INSTALL_LIBDIR=${libdir} \\\n    -DCMAKE_INSTALL_INCLUDEDIR=${includedir} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_CXX_STANDARD=${CMAKE_CXX_STANDARD} \\\n    -DWITH_IPOPT=ON \\\n    -DWITH_EXAMPLES=OFF \\\n    -DWITH_DEEPBIND=OFF \\\n    ..\n\nmake -j ${nproc}\nmake install\n\n# Build amplexe\ncd $WORKSPACE/srcdir\nc++ main.cpp -o \"${bindir}/amplexe${exeext}\" \\\n    -I\"${includedir}\" \\\n    -L\"${libdir}\" \\\n    -lcasadi ${CXX_STANDARD}\n"""
version = "v3.7.2"

