name = "cddlib"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/*\nsed -i '/^libcddgmp_la_LDFLAGS/ s/$/  $(CDD_LDFLAGS)/' lib-src/Makefile.gmp.am\n./bootstrap # needed because we are building a commit and not a release\nCPPFLAGS=-I${prefix}/include ./configure --prefix=${prefix} --host=${target}\ncd lib-src # Call make in the lib-src subfolder to avoid building the doc folder since pdflatex is not installed\nmake -j${nproc}\nmake install\n"""
version = "v0.94.10"

