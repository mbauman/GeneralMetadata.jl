dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "CImGuiPack"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/cimgui-pack\ngit submodule update --init --recursive\nmkdir build && cd build\ncmake .. -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release\nmake -j${nproc}\nmake install\ninstall_license ../cimgui/LICENSE ../cimgui/imgui/LICENSE.txt ../cimplot/LICENSE ../cimplot/implot/LICENSE ../cimnodes/imnodes/LICENSE.md\n"""
version = "v0.1.2"

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["libcimgui"]
type = "lib"
variable_name = "libcimgui"
[[products]]
paths = ["share/compile_commands.json"]
type = "file"
variable_name = "compile_commands"

