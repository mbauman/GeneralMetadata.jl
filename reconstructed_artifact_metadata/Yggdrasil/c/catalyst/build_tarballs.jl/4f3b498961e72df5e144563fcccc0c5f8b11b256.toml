dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Catalyst"
platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "x86_64-apple-darwin", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd ${WORKSPACE}/srcdir/catalyst*\nrm -rf build && mkdir build && cd build\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DCATALYST_BUILD_SHARED_LIBS=ON \\\n      -DCATALYST_BUILD_STUB_IMPLEMENTATION=ON \\\n      -DCATALYST_BUILD_TESTING=OFF \\\n      -DCATALYST_BUILD_TOOLS=ON \\\n      -DCATALYST_USE_MPI=OFF \\\n      ..\nmake -j${nproc}\nmake install\n# install catalyst-replay to bindir\nmkdir -vp $bindir\ncp -v ./bin/catalyst_replay* $bindir\n"""
version = "v0.1.0"

