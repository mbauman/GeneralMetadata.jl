augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "CGNS"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/CGNS*\n\nif [[ ${target} == x86_64-linux-musl ]]; then\n    # HDF5 needs libcurl, and it needs to be the BinaryBuilder libcurl, not the system libcurl\n    rm /usr/lib/libcurl.*\n    rm /usr/lib/libnghttp2.*\nfi\n\n# Correct HDF5 compiler wrappers\nperl -pi -e 's+-I/workspace/srcdir/hdf5-1.14.0/src/H5FDsubfiling++' $(which h5pcc)\n\nmkdir build && cd build\nH5LIB=\"\"\nif [[ \"${target}\" == *-mingw* ]]; then\n    H5LIB=\"-DHDF5_hdf5_LIBRARY_RELEASE=$(ls ${WORKSPACE}/destdir/bin/libhdf5-*.${dlext})\"\nfi\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n      ${H5LIB} ..\nmake -j${nproc}\nmake install\n"""
version = "v4.3.1"

