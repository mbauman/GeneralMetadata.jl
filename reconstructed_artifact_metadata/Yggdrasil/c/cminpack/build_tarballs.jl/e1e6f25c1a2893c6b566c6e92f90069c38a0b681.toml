augment_platform_block = ""
init_block = ""
julia_compat = "1.9"
lazy_artifacts = false
name = "cminpack"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """\n# We need a newer version of CMake to support libblastrampoline\napk del cmake\n\ncd $WORKSPACE/srcdir/cminpack\n\noptions=(\n    -DCMAKE_INSTALL_PREFIX=${prefix}\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\n    -DCMAKE_BUILD_TYPE=Release\n    -DBUILD_SHARED_LIBS=ON\n    -DBUILD_EXAMPLES=OFF\n    -DBLA_VENDOR=libblastrampoline\n    -DUSE_BLAS=ON\n)\n\nif [[ ${target} == *-apple-* ]]; then\n    # cminpack calls Fortran functions without declaring them\n    options+=(\n        -DCMAKE_C_FLAGS=-Wno-error=implicit-function-declaration\n    )\nfi\n\n# Build single precision library\ncmake -B build_s -DCMINPACK_PRECISION=\"s\" \"${options[@]}\"\ncmake --build build_s --parallel ${nproc}\ncmake --install build_s\n\n# Build double precision library\ncmake -B build_d -DCMINPACK_PRECISION=\"d\" \"${options[@]}\"\ncmake --build build_d --parallel ${nproc}\ncmake --install build_d\n\ninstall_license CopyrightMINPACK.txt\n"""
version = "v1.3.11"

