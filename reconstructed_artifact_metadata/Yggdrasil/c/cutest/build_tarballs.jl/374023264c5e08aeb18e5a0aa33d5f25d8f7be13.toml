dependencies = []
lazy_artifacts = false
name = "CUTEst"
platforms = ["i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran3", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "armv7l-linux-gnueabihf-libgfortran3", "armv7l-linux-gnueabihf-libgfortran4", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran3", "powerpc64le-linux-gnu-libgfortran4", "powerpc64le-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran3", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran3", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran3", "aarch64-linux-musl-libgfortran4", "aarch64-linux-musl-libgfortran5", "armv7l-linux-musleabihf-libgfortran3", "armv7l-linux-musleabihf-libgfortran4", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin14-libgfortran3", "x86_64-apple-darwin14-libgfortran4", "x86_64-apple-darwin14-libgfortran5", "x86_64-unknown-freebsd11.1-libgfortran3", "x86_64-unknown-freebsd11.1-libgfortran4", "x86_64-unknown-freebsd11.1-libgfortran5"]
script = """echo \"building for ${target}\"\n\n# setup\nmkdir -p ${prefix}/libexec\nmkdir -p ${bindir}\nmkdir -p ${libdir}\ncp -r ARCHDefs-2.0.3x ${prefix}/libexec/\ncp -r SIFDecode-2.0.3 ${prefix}/libexec/\ncp -r CUTEst-2.0.3 ${prefix}/libexec/\nexport ARCHDEFS=${prefix}/libexec/ARCHDefs-2.0.3x\nexport SIFDECODE=${prefix}/libexec/SIFDecode-2.0.3\nexport CUTEST=${prefix}/libexec/CUTEst-2.0.3\n\n# build SIFDecode\ncd $SIFDECODE\n\nif [[ \"${target}\" == *-linux* || \"${target}\" == *-freebsd* ]]; then\n  echo \"6\" > sifdecode.opts   # PC64\n  echo \"2\" >> sifdecode.opts  # Linux\n  echo \"5\" >> sifdecode.opts  # gfortran\nelif [[ \"${target}\" == *-apple* ]]; then\n  echo \"13\" > sifdecode.opts  # macOS\n  echo \"2\" >> sifdecode.opts  # gfortran\nelif [[ \"${target}\" == *-mingw* ]]; then\n  cd $ARCHDEFS\n  cd $SIFDECODE\n  echo \"6\" > sifdecode.opts   # PC64\n  echo \"1\" >> sifdecode.opts  # Windows\n  echo \"3\" >> sifdecode.opts  # gfortran\nfi\necho \"nny\" >> sifdecode.opts\n./install_sifdecode < sifdecode.opts\n\n# build CUTEst\ncd $CUTEST\nif [[ \"${target}\" == *-linux* || \"${target}\" == *-freebsd* ]]; then\n  echo \"6\" > cutest.opts   # PC64\n  echo \"2\" >> cutest.opts  # Linux\n  echo \"5\" >> cutest.opts  # gfortran\n  echo \"2\" >> cutest.opts  # build all tools except Matlab\n  echo \"7\" >> cutest.opts  # gcc\n  export MYARCH=pc64.lnx.gfo\nelif [[ \"${target}\" == *-apple* ]]; then\n  echo \"13\" > cutest.opts  # macOS\n  echo \"2\" >> cutest.opts  # gfortran\n  echo \"2\" >> cutest.opts  # build all tools except Matlab\n  echo \"5\" >> cutest.opts  # gcc\n  export MYARCH=mac64.osx.gfo\nelif [[ \"${target}\" == *-mingw* ]]; then\n  echo \"5\" > cutest.opts   # PC64\n  echo \"1\" >> cutest.opts  # Windows\n  echo \"3\" >> cutest.opts  # gfortran\n  echo \"2\" >> cutest.opts  # build all tools except Matlab\n  echo \"5\" >> cutest.opts  # gcc\n  export MYARCH=pc64.mgw.gfo\nfi\necho \"nnydy\" >> cutest.opts\n./install_cutest < cutest.opts\n\n# build shared libs\nall_load=\"--whole-archive\"\nnoall_load=\"--no-whole-archive\"\nextra=\"\"\nif [[ \"${target}\" == *-apple-* ]]; then\n    all_load=\"-all_load\"\n    noall_load=\"-noall_load\"\n    extra=\"-Wl,-undefined -Wl,dynamic_lookup -headerpad_max_install_names\"\nfi\ncd $CUTEST/objects/$MYARCH/double\ngfortran -fPIC -shared ${extra} -Wl,${all_load} libcutest.a -Wl,${noall_load} -o libcutest_double.${dlext}\ncd $CUTEST/objects/$MYARCH/single\ngfortran -fPIC -shared ${extra} -Wl,${all_load} libcutest.a -Wl,${noall_load} -o libcutest_single.${dlext}\n\nln -s $SIFDECODE/bin/sifdecoder ${bindir}/\nln -s $SIFDECODE/objects/$MYARCH/double/slct ${bindir}/\nln -s $SIFDECODE/objects/$MYARCH/double/clsf ${bindir}/\ninstall_license $CUTEST/lgpl-3.0.txt\n"""
version = "v0.2.0"

[[products]]
binnames = ["sifdecoder"]
type = "exe"
variable_name = "sifdecoder"
[[products]]
binnames = ["slct"]
type = "exe"
variable_name = "slct"
[[products]]
binnames = ["clsf"]
type = "exe"
variable_name = "clsf"

