augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "CUTEst"
platforms = ["x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran5", "powerpc64le-linux-gnu-libgfortran5", "riscv64-linux-gnu-libgfortran5", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran5", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran5", "aarch64-unknown-freebsd-libgfortran5", "x86_64-w64-mingw32-libgfortran5"]
script = """# Update Ninja\ncp ${host_prefix}/bin/ninja /usr/bin/ninja\n\nQUADRUPLE=\"true\"\nif [[ \"${target}\" == *arm* ]] || [[ \"${target}\" == *i686* ]] || [[ \"${target}\" == *aarch64-linux* ]] || [[ \"${target}\" == *aarch64-unknown-freebsd* ]] || [[ \"${target}\" == *powerpc64le-linux-gnu* ]] || [[ \"${target}\" == *riscv64* ]]; then\n    QUADRUPLE=\"false\"\nfi\n\nmkdir ${includedir}\ncd ${WORKSPACE}/srcdir/CUTEst\n\nmeson setup builddir --cross-file=${MESON_TARGET_TOOLCHAIN%.*}_gcc.meson \\\n                     --prefix=$prefix \\\n                     -Dquadruple=${QUADRUPLE}\n\nmeson compile -C builddir\nmeson install -C builddir\n\nmeson setup builddir_shared --cross-file=${MESON_TARGET_TOOLCHAIN%.*}_gcc.meson \\\n                            --prefix=$prefix \\\n                            -Dquadruple=${QUADRUPLE} \\\n                            -Ddefault_library=shared\n\nmeson compile -C builddir_shared\nmeson install -C builddir_shared\n\ninstall_license lgpl-3.0.txt\n"""
version = "v2.6.0"

