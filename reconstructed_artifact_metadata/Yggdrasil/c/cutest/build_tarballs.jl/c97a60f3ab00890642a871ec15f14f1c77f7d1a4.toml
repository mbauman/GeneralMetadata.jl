name = "CUTEst"
platforms = ["i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran3", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "armv6l-linux-gnueabihf-libgfortran3", "armv6l-linux-gnueabihf-libgfortran4", "armv6l-linux-gnueabihf-libgfortran5", "armv7l-linux-gnueabihf-libgfortran3", "armv7l-linux-gnueabihf-libgfortran4", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran3", "powerpc64le-linux-gnu-libgfortran4", "powerpc64le-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran3", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran3", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran3", "aarch64-linux-musl-libgfortran4", "aarch64-linux-musl-libgfortran5", "armv6l-linux-musleabihf-libgfortran3", "armv6l-linux-musleabihf-libgfortran4", "armv6l-linux-musleabihf-libgfortran5", "armv7l-linux-musleabihf-libgfortran3", "armv7l-linux-musleabihf-libgfortran4", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin-libgfortran3", "x86_64-apple-darwin-libgfortran4", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran4", "x86_64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran3", "i686-w64-mingw32-libgfortran4", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran3", "x86_64-w64-mingw32-libgfortran4", "x86_64-w64-mingw32-libgfortran5"]
script = """echo \"building for ${target}\"\n\n# setup\nmkdir -p ${bindir}\nmkdir -p ${libdir}\n\ncp -r ARCHDefs ${prefix}\ncp -r SIFDecode ${prefix}\ncp -r CUTEst ${prefix}\n\nexport ARCHDEFS=${prefix}/ARCHDefs\nexport SIFDECODE=${prefix}/SIFDecode\nexport CUTEST=${prefix}/CUTEst\n\n# ARCHDefs requires tput\napk update\napk add ncurses\n\n# build SIFDecode\ncd $SIFDECODE\nif [[ \"${target}\" == *-linux* || \"${target}\" == *-freebsd* || \"${target}\" == *-mingw* ]]; then\n  echo \"6\" > sifdecode.opts   # PC64\n  echo \"2\" >> sifdecode.opts  # Linux\n  echo \"6\" >> sifdecode.opts  # gfortran\nelif [[ \"${target}\" == *-apple* ]]; then\n  echo \"13\" > sifdecode.opts  # macOS\n  echo \"2\" >> sifdecode.opts  # gfortran\nfi\necho \"nny\" >> sifdecode.opts\n./install_sifdecode < sifdecode.opts\n\n# build CUTEst\ncd $CUTEST\nif [[ \"${target}\" == *-linux* || \"${target}\" == *-freebsd* || \"${target}\" == *-mingw* ]]; then\n  echo \"6\" > cutest.opts   # PC64\n  echo \"2\" >> cutest.opts  # Linux\n  echo \"6\" >> cutest.opts  # gfortran\n  echo \"2\" >> cutest.opts  # build all tools except Matlab\n  echo \"8\" >> cutest.opts  # gcc\n  export MYARCH=pc64.lnx.gfo\nelif [[ \"${target}\" == *-apple* ]]; then\n  echo \"13\" > cutest.opts  # macOS\n  echo \"2\" >> cutest.opts  # gfortran\n  echo \"2\" >> cutest.opts  # build all tools except Matlab\n  echo \"5\" >> cutest.opts  # gcc\n  export MYARCH=mac64.osx.gfo\nfi\necho \"nnydy\" >> cutest.opts\n./install_cutest < cutest.opts\n\n# Static libraries\ncp $CUTEST/objects/$MYARCH/single/libcutest.a $prefix/lib/libcutest_single.a\ncp $CUTEST/objects/$MYARCH/double/libcutest.a $prefix/lib/libcutest_double.a\n\n# Shared libraries\nif [[ \"${target}\" != *mingw* ]]; then\n    extra=\"\"\n    if [[ \"${target}\" == *-apple-* ]]; then\n        extra=\"-Wl,-undefined -Wl,dynamic_lookup -headerpad_max_install_names\"\n    fi\n    cd $CUTEST/objects/$MYARCH/single\n    gfortran -fPIC -shared ${extra} $(flagon -Wl,--whole-archive) libcutest.a $(flagon -Wl,--no-whole-archive) -o ${libdir}/libcutest_single.${dlext}\n    cd $CUTEST/objects/$MYARCH/double\n    gfortran -fPIC -shared ${extra} $(flagon -Wl,--whole-archive) libcutest.a $(flagon -Wl,--no-whole-archive) -o ${libdir}/libcutest_double.${dlext}\nfi\n\ncp $ARCHDEFS/bin/helper_functions ${bindir}/helper_functions\ncp $SIFDECODE/bin/sifdecoder ${bindir}/sifdecoder\ninstall_license $CUTEST/lgpl-3.0.txt\n"""
version = "v2.0.7"

