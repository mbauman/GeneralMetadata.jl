name = "CUTEst"
platforms = ["i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "armv6l-linux-gnueabihf-libgfortran4", "armv6l-linux-gnueabihf-libgfortran5", "armv7l-linux-gnueabihf-libgfortran4", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran4", "powerpc64le-linux-gnu-libgfortran5", "riscv64-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran4", "aarch64-linux-musl-libgfortran5", "armv6l-linux-musleabihf-libgfortran4", "armv6l-linux-musleabihf-libgfortran5", "armv7l-linux-musleabihf-libgfortran4", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin-libgfortran4", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran4", "x86_64-unknown-freebsd-libgfortran5", "aarch64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran4", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran4", "x86_64-w64-mingw32-libgfortran5"]
script = """# Update Ninja\ncp ${host_prefix}/bin/ninja /usr/bin/ninja\n\nQUADRUPLE=\"true\"\nif [[ \"${target}\" == *arm* ]] || [[ \"${target}\" == *i686* ]] || [[ \"${target}\" == *aarch64-linux* ]] || [[ \"${target}\" == *aarch64-unknown-freebsd* ]] || [[ \"${target}\" == *powerpc64le-linux-gnu* ]] || [[ \"${target}\" == *riscv64* ]]; then\n    QUADRUPLE=\"false\"\nfi\n\nmkdir ${includedir}\ncd ${WORKSPACE}/srcdir/CUTEst\n\nmeson setup builddir --cross-file=${MESON_TARGET_TOOLCHAIN%.*}_gcc.meson \\\n                     --prefix=$prefix \\\n                     -Dquadruple=${QUADRUPLE}\n\nmeson compile -C builddir\nmeson install -C builddir\n\nif [[ \"${target}\" != *i686-w64-mingw32* ]]; then\n    meson setup builddir_shared --cross-file=${MESON_TARGET_TOOLCHAIN%.*}_gcc.meson \\\n                                --prefix=$prefix \\\n                                -Dquadruple=${QUADRUPLE} \\\n                                -Ddefault_library=shared\n\n    meson compile -C builddir_shared\n    meson install -C builddir_shared\nfi\n\ninstall_license lgpl-3.0.txt\n"""
version = "v2.5.2"

