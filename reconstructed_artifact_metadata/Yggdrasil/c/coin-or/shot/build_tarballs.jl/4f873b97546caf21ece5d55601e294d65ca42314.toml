name = "SHOT"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11", "aarch64-apple-darwin", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11"]
script = """cd $WORKSPACE/srcdir/SHOT\ngit submodule update --init --recursive\n# Disable run_source_test in CppAD\natomic_patch -p1 ../patches/CppAD.patch\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    # Work around the issue\n    #     /workspace/srcdir/SHOT/src/Model/../Model/Simplifications.h:1370:26: error: 'value' is unavailable: introduced in macOS 10.14\n    #                     optional.value()->coefficient *= -1.0;\n    #                              ^\n    #     /opt/x86_64-apple-darwin14/x86_64-apple-darwin14/sys-root/usr/include/c++/v1/optional:947:27: note: 'value' has been explicitly marked unavailable here\n    #         constexpr value_type& value() &\n    #                               ^\n    export CXXFLAGS=\"-mmacosx-version-min=10.15\"\n    # ...and install a newer SDK which supports `std::filesystem`\n    pushd $WORKSPACE/srcdir/MacOSX10.*.sdk\n    rm -rf /opt/${target}/${target}/sys-root/System\n    cp -ra usr/* \"/opt/${target}/${target}/sys-root/usr/.\"\n    cp -ra System \"/opt/${target}/${target}/sys-root/.\"\n    popd\nelif [[ \"${target}\" == aarch64-apple-darwin* ]]; then\n    # TODO: we need to fix this in the compiler wrappers\n    export CXXFLAGS=\"-mmacosx-version-min=11.0\"\nelif [[ ${target} == *mingw* ]]; then\n    export LDFLAGS=\"-L${libdir}\"\nfi\n\nmkdir -p build\ncd build\n\ncmake \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DHAS_CBC=on \\\n    -DCBC_DIR=${prefix} \\\n    -DHAS_IPOPT=on \\\n    -DIPOPT_DIR=${prefix} \\\n    -DHAS_AMPL=on \\\n    -DGENERATE_EXE=on \\\n    ..\n\nmake -j${nproc}\nmake install\n\ninstall_license ../LICENSE\n"""
version = "v100.100.0"

