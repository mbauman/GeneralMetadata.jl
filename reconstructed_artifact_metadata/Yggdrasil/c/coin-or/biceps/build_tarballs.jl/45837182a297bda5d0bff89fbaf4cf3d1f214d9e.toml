script = """export CPPFLAGS=\"${CPPFLAGS} -I${includedir} -I${includedir}/coin\"\nif [[ \"${target}\" == *mingw* ]]; then\n    export LDFLAGS=\"-L${bindir}\"\nelif [[ \"${target}\" == *linux* ]]; then\n    export LDFLAGS=\"-ldl -lrt\"\nfi\n\ncd $WORKSPACE/srcdir/CHiPPS-BiCePS\nrm -f ${prefix}/lib/*.la\nupdate_configure_scripts\nsed -i s/elf64ppc/elf64lppc/ configure\nmkdir build\ncd build\n../configure \\\n    --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --with-pic \\\n    --disable-pkg-config \\\n    --disable-debug \\\n    --disable-dependency-tracking \\\n    --enable-shared \\\n    lt_cv_deplibs_check_method=pass_all \\\n    --with-coinutils-lib=\"-lCoinUtils\" \\\n    --with-osi-lib=\"-lOsi\" \\\n    --with-clp-lib=\"-lClp -lOsiClp\" \\\n    --with-cgl-lib=\"-lCgl\" \\\n    --with-alps-lib=\"-lAlps -lCoinUtils\" \\\n    --with-coindepend-lib=\"-lCgl -lClp -lOsi -lCoinUtils\"\nmake -j${nproc}\nmake install\n"""
version = "v0.9400.400"

