ran3-cxx03", "x86_64-apple-darwin14-libgfortran4-cxx03", "x86_64-apple-darwin14-libgfortran5-cxx03", "x86_64-apple-darwin14-libgfortran3-cxx11", "x86_64-apple-darwin14-libgfortran4-cxx11", "x86_64-apple-darwin14-libgfortran5-cxx11", "i686-w64-mingw32-libgfortran3-cxx03", "i686-w64-mingw32-libgfortran4-cxx03", "i686-w64-mingw32-libgfortran5-cxx03", "i686-w64-mingw32-libgfortran3-cxx11", "i686-w64-mingw32-libgfortran4-cxx11", "i686-w64-mingw32-libgfortran5-cxx11", "x86_64-w64-mingw32-libgfortran3-cxx03", "x86_64-w64-mingw32-libgfortran4-cxx03", "x86_64-w64-mingw32-libgfortran5-cxx03", "x86_64-w64-mingw32-libgfortran3-cxx11", "x86_64-w64-mingw32-libgfortran4-cxx11", "x86_64-w64-mingw32-libgfortran5-cxx11"]
script = """cd $WORKSPACE/srcdir/Clp*\n\n# Remove misleading libtool files\nrm -f ${prefix}/lib/*.la\nrm -f /opt/${target}/${target}/lib*/*.la\nupdate_configure_scripts\n\nmkdir build\ncd build/\n\nexport CPPFLAGS=\"${CPPFLAGS} -DNDEBUG -I${prefix}/include -I$prefix/include/coin\"\nexport CXXFLAGS=\"${CXXFLAGS} -std=c++11\"\nif [[ ${target} == *mingw* ]]; then\n    export LDFLAGS=\"-L$prefix/bin\"\nelif [[ ${target} == *linux* ]]; then\n    export LDFLAGS=\"-ldl -lrt\"\nfi\n\nif [[ ${target} == *aarch64* ]] || [[ ${target} == *arm* ]]; then\n   export CPPFLAGS=\"${CPPFLAGS} -D__arm__\"\nfi\n\n../configure --prefix=$prefix --with-pic --disable-pkg-config --build=${MACHTYPE} --host=${target} \\\n--disable-debug --disable-dependency-tracking \\\n--enable-shared lt_cv_deplibs_check_method=pass_all \\\n--with-blas=\"-lopenblas\" --with-lapack=\"-openblas\" \\\n--with-coinutils-lib=\"-lCoinUtils\" \\\n--with-osi-lib=\"-lOsi -lCoinUtils\" \\\n--with-mumps-lib=\"-L${prefix}/lib -ldmumps -lzmumps -lcmumps -lsmumps -lmumps_common -lmpiseq -lpord -lmetis -lopenblas -lgfortran -lpthread\" \\\n--with-mumps-incdir=\"${prefix}/include/mumps_seq\" \\\n--with-metis-lib=\"-L${prefix}/lib -lmetis\" --with-metis-incdir=\"${prefix}/include\"\n\nmake -j${nproc}\nmake install\n"""
version = "v1.17.6"

