", "armv7l-linux-musleabihf-libgfortran4-cxx03", "armv7l-linux-musleabihf-libgfortran5-cxx03", "armv7l-linux-musleabihf-libgfortran3-cxx11", "armv7l-linux-musleabihf-libgfortran4-cxx11", "armv7l-linux-musleabihf-libgfortran5-cxx11", "x86_64-apple-darwin14-libgfortran3-cxx03", "x86_64-apple-darwin14-libgfortran4-cxx03", "x86_64-apple-darwin14-libgfortran5-cxx03", "x86_64-apple-darwin14-libgfortran3-cxx11", "x86_64-apple-darwin14-libgfortran4-cxx11", "x86_64-apple-darwin14-libgfortran5-cxx11", "i686-w64-mingw32-libgfortran3-cxx03", "i686-w64-mingw32-libgfortran4-cxx03", "i686-w64-mingw32-libgfortran5-cxx03", "i686-w64-mingw32-libgfortran3-cxx11", "i686-w64-mingw32-libgfortran4-cxx11", "i686-w64-mingw32-libgfortran5-cxx11", "x86_64-w64-mingw32-libgfortran3-cxx03", "x86_64-w64-mingw32-libgfortran4-cxx03", "x86_64-w64-mingw32-libgfortran5-cxx03", "x86_64-w64-mingw32-libgfortran3-cxx11", "x86_64-w64-mingw32-libgfortran4-cxx11", "x86_64-w64-mingw32-libgfortran5-cxx11"]
script = """cd $WORKSPACE/srcdir/Cbc*\n\n# Remove misleading libtool files\nrm -f ${prefix}/lib/*.la\nrm -f /opt/${target}/${target}/lib*/*.la\nupdate_configure_scripts\n\n# old and custom autoconf\nsed -i s/elf64ppc/elf64lppc/ configure\n\n# Apply patch related to https://github.com/JuliaOpt/Cbc.jl/issues/117 and https://github.com/coin-or/Cbc/issues/267\n(cd Cbc/src && atomic_patch -p0 $WORKSPACE/srcdir/patches/no_lp.patch)\n\nmkdir build\ncd build/\n\nexport CPPFLAGS=\"${CPPFLAGS} -DNDEBUG -I${prefix}/include -I$prefix/include/coin\"\nif [[ ${target} == *mingw* ]]; then\n    export LDFLAGS=\"-L$prefix/bin\"\nelif [[ ${target} == *linux* ]]; then\n    export LDFLAGS=\"-ldl -lrt\"\nfi\n\n../configure --prefix=$prefix --build=${MACHTYPE} --host=${target} \\\n--with-pic --disable-pkg-config --disable-debug \\\n--enable-shared lt_cv_deplibs_check_method=pass_all \\\n--with-blas-lib=\"-lopenblas\" --with-lapack-lib=\"-lopenblas\" \\\n--with-metis-lib=\"-lmetis\" \\\n--with-coinutils-lib=\"-lCoinUtils\" \\\n--with-osi-lib=\"-lOsi -lCoinUtils\" \\\n--with-clp-lib=\"-lClp -lOsiClp -lCoinUtils\" \\\n--with-cgl-lib=\"-lCgl -lClp -lOsiClp -lOsi -lCoinUtils\" \\\n--with-coindepend-lib=\"-lCgl -lClp -lOsiClp -lOsi -lCoinUtils\" \\\n--enable-cbc-parallel\n\nmake -j${nproc}\nmake install\n"""
version = "v2.10.3"

