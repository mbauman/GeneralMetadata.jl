script = """cd $WORKSPACE/srcdir/Cbc*\n\n# Remove misleading libtool files\nrm -f ${prefix}/lib/*.la\nupdate_configure_scripts\n\n# old and custom autoconf\nsed -i s/elf64ppc/elf64lppc/ configure\n\nmkdir build\ncd build/\n\nexport CPPFLAGS=\"${CPPFLAGS} -DNDEBUG -I${includedir} -I${includedir}/coin\"\nif [[ ${target} == *mingw* ]]; then\n    export LDFLAGS=\"-L$prefix/bin\"\nelif [[ ${target} == *linux* ]]; then\n    export LDFLAGS=\"-ldl -lrt\"\nfi\n\n../configure \\\n    --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --with-pic \\\n    --disable-pkg-config \\\n    --disable-debug \\\n    --enable-shared \\\n    lt_cv_deplibs_check_method=pass_all \\\n    --with-asl-lib=\"-lasl\" \\\n    --with-blas-lib=\"-lopenblas\" \\\n    --with-lapack-lib=\"-lopenblas\" \\\n    --with-clp-lib=\"-lClp\" \\\n    --with-coindepend-lib=\"-lCgl -lOsiClp -lClp -lOsi -lCoinUtils\" \\\n    --enable-cbc-parallel\n\nmake -j${nproc}\nmake install\n"""
version = "v200.1000.500"

