dependencies = []
init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "CSPICE"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\ncd cspice\ncp -r $WORKSPACE/srcdir/cmake .\nmv cmake/CMakeLists.txt .\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/dskx02.patch\"\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/subpnt.patch\"\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/inquire.patch\"\nmkdir build\ncd build\ncmake -DCMAKE_INSTALL_PREFIX=$prefix -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release ..\nmake -j${nproc}\nmake install\ninstall_license ${WORKSPACE}/srcdir/license/LICENSE\n"""
version = "v66.1.0"

