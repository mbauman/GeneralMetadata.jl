lazy_artifacts = false
name = "CovidSim"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/covid-sim/\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    atomic_patch -p1 ../patches/0001-fix-lib-cases.patch\nfi\n\nmkdir build && cd build/\n# Build with GCC also for FreeBSD and macOS to use libgomp\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN%.*}_gcc.cmake \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    ../src\nmake -j${nprocs}\nmkdir -p \"${bindir}\"\ncp \"CovidSim${exeext}\" \"${bindir}/\"\n"""
version = "v0.8.0"

