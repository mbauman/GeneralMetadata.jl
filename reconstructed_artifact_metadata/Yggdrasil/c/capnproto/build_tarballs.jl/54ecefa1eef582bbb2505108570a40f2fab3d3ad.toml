dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["libcapnp", "libcapnp-0-7"]
type = "lib"
variable_name = "libcapnp"
[[products]]
binnames = ["capnp"]
type = "exe"
variable_name = "capnp"

