script = """cd $WORKSPACE/srcdir/cppcheck/\n\nmkdir build && cd build\n\ncmake -DCMAKE_INSTALL_PREFIX=$prefix \\\n      -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DBUILD_GUI=OFF \\\n      -DUSE_MATCHCOMPILER=OFF \\\n      -DDISABLE_DMAKE=ON \\\n      -DBUILD_TESTS=OFF \\\n      -DHAVE_RULES=ON \\\n      ..\nmake -j${nproc}\nmake install\n"""
