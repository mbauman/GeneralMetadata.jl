script = ["""export CUDA_ARCHS=\"50;60;70;80\"\ncd $WORKSPACE/srcdir/finufft*/\napk del cmake\n\n# CUDA compilation can run out of storage\nmkdir $WORKSPACE/tmpdir\nexport TMPDIR=$WORKSPACE/tmpdir\n\nexport CUDA_PATH=\"$prefix/cuda\"\nln -s $prefix/cuda/lib $prefix/cuda/lib64\n\nmkdir build && cd build\ncmake .. \\\n    -DCMAKE_PREFIX_PATH=\"${prefix}\" \\\n    -DCMAKE_INSTALL_PREFIX=\"${prefix}\" \\\n    -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DFINUFFT_FFTW_SUFFIX=\"\" \\\n    -DFINUFFT_USE_CPU=OFF \\\n    -DFINUFFT_USE_CUDA=ON \\\n    -DCMAKE_CUDA_ARCHITECTURES=\"${CUDA_ARCHS}\" \\\n    -DFINUFFT_STATIC_LINKING=\"OFF\"\ncmake --build . --parallel $nproc\ncmake --install .\n\nunlink $prefix/cuda/lib64\n""", """export CUDA_ARCHS=\"60;70;80\"\ncd $WORKSPACE/srcdir/finufft*/\napk del cmake\n\n# CUDA compilation can run out of storage\nmkdir $WORKSPACE/tmpdir\nexport TMPDIR=$WORKSPACE/tmpdir\n\nexport CUDA_PATH=\"$prefix/cuda\"\nln -s $prefix/cuda/lib $prefix/cuda/lib64\n\nmkdir build && cd build\ncmake .. \\\n    -DCMAKE_PREFIX_PATH=\"${prefix}\" \\\n    -DCMAKE_INSTALL_PREFIX=\"${prefix}\" \\\n    -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DFINUFFT_FFTW_SUFFIX=\"\" \\\n    -DFINUFFT_USE_CPU=OFF \\\n    -DFINUFFT_USE_CUDA=ON \\\n    -DCMAKE_CUDA_ARCHITECTURES=\"${CUDA_ARCHS}\" \\\n    -DFINUFFT_STATIC_LINKING=\"OFF\"\ncmake --build . --parallel $nproc\ncmake --install .\n\nunlink $prefix/cuda/lib64\n""", """export CUDA_ARCHS=\"60;70;80;90\"\ncd $WORKSPACE/srcdir/finufft*/\napk del cmake\n\n# CUDA compilation can run out of storage\nmkdir $WORKSPACE/tmpdir\nexport TMPDIR=$WORKSPACE/tmpdir\n\nexport CUDA_PATH=\"$prefix/cuda\"\nln -s $prefix/cuda/lib $prefix/cuda/lib64\n\nmkdir build && cd build\ncmake .. \\\n    -DCMAKE_PREFIX_PATH=\"${prefix}\" \\\n    -DCMAKE_INSTALL_PREFIX=\"${prefix}\" \\\n    -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DFINUFFT_FFTW_SUFFIX=\"\" \\\n    -DFINUFFT_USE_CPU=OFF \\\n    -DFINUFFT_USE_CUDA=ON \\\n    -DCMAKE_CUDA_ARCHITECTURES=\"${CUDA_ARCHS}\" \\\n    -DFINUFFT_STATIC_LINKING=\"OFF\"\ncmake --build . --parallel $nproc\ncmake --install .\n\nunlink $prefix/cuda/lib64\n""", """export CUDA_ARCHS=\"75;80-real;90-real;100-real;110-real;120-real\"\ncd $WORKSPACE/srcdir/finufft*/\napk del cmake\n\n# CUDA compilation can run out of storage\nmkdir $WORKSPACE/tmpdir\nexport TMPDIR=$WORKSPACE/tmpdir\n\nexport CUDA_PATH=\"$prefix/cuda\"\nln -s $prefix/cuda/lib $prefix/cuda/lib64\n\nmkdir build && cd build\ncmake .. \\\n    -DCMAKE_PREFIX_PATH=\"${prefix}\" \\\n    -DCMAKE_INSTALL_PREFIX=\"${prefix}\" \\\n    -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DFINUFFT_FFTW_SUFFIX=\"\" \\\n    -DFINUFFT_USE_CPU=OFF \\\n    -DFINUFFT_USE_CUDA=ON \\\n    -DCMAKE_CUDA_ARCHITECTURES=\"${CUDA_ARCHS}\" \\\n    -DFINUFFT_STATIC_LINKING=\"OFF\"\ncmake --build . --parallel $nproc\ncmake --install .\n\nunlink $prefix/cuda/lib64\n"""]
