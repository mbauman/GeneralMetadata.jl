lazy_artifacts = false
name = "CompilerSupportLibraries"
platforms = ["i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran5", "armv6l-linux-gnueabihf-libgfortran5", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran5", "riscv64-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran5", "armv6l-linux-musleabihf-libgfortran5", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran5", "aarch64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran5"]
script = ["""AATRIPLET=i686-linux-gnu\nWINDOWS_STATICLIBS=true\nUNIX_STATICLIBS=false\nPREFERRED_GCC_VERSION=13.0.0\nVERSION=10102\n# Start by extracting LatestLibraries\ntar -zxvf ${WORKSPACE}/srcdir/LatestLibraries*.tar.gz -C ${prefix}\n\n# Make sure expansions aren't empty\nshopt -s nullglob\n\n# copy out all the libraries we can find except libstdc++ and libgomp,\n# which we copied out in the extraction step above.\nfor lib in /opt/${target}/${target}/lib*/*.${dlext}*; do\n    if [[ \"${lib}\" != *libstdc++* ]] && [[ \"${lib}\" != *libgomp* ]]; then\n        cp -uav \"${lib}\" \"${libdir}/\"\n    fi\ndone\n\n# libwinpthread is a special snowflake and is only within `bin` for some reason\nif [[ ${target} == *mingw* ]]; then\n    cp -uav /opt/${target}/${target}/sys-root/bin/*.${dlext}* ${libdir}/\n    if [[ \"${WINDOWS_STATICLIBS}\" == \"true\" ]]; then\n        # From v1.1.0 of CSL we move the Windows `*.a` files to a subdir of `${prefix}/lib`.\n        # See <https://github.com/JuliaLang/julia/issues/48081>.\n        if [[ \"${VERSION}\" -ge 10100 ]]; then\n           destdir=\"${prefix}/lib/gcc/${AATRIPLET}/${PREFERRED_GCC_VERSION%.*.*}\"\n        else\n           destdir=\"${prefix}/lib\"\n        fi\n        # Install also some static and import libraries, needed for linking of pkgimages\n        # and for direct ld links of Windows executables and DLLs.\n        for lib in libadvapi32.a libdbghelp.a libgcc.a libgcc_s.a libiphlpapi.a libkernel32.a libmingwex.a \\\n                   libmingw32.a libmsvcrt.a libmsvcrt-os.a libmoldname.a libntdll.a libole32.a libpsapi.a libsecur32.a \\\n                   libshell32.a libssp.a libuser32.a libuserenv.a libuuid.a libwinmm.a libws2_32.a \\\n                   libpthread.dll.a libssp.dll.a dllcrt2.o crt2.o crt2u.o crtbegin.o crtend.o; do\n            qfind \"/opt/${target}\" -name \"${lib}\" -exec install -Dvm 0644 '{}' \"${destdir}/${lib}\" \\;\n        done\n    fi\nfi\nif [[ \"${UNIX_STATICLIBS}\" == \"true\" ]] && [[ ${target} != *mingw* ]]; then\n    destdir=\"${prefix}/lib/gcc/${AATRIPLET}/${PREFERRED_GCC_VERSION%.*.*}\"\n    qfind \"/opt/${target}\" -name \"libgcc.a\" -exec install -Dvm 0644 '{}' \"${destdir}/libgcc.a\" \\;\n    if [[ ${target} == *linux* ]] || [[ ${target} == *freebsd* ]]; then\n        for lib in crti.o crtn.o crtbeginS.o crtendS.o; do\n            qfind \"/opt/${target}\" -name \"${lib}\" -exec install -Dvm 0644 '{}' \"${destdir}/${lib}\" \\;\n        done\n        if [[ ${target} == *-linux-gnu* ]]; then\n            qfind \"/opt/${target}\" -name \"libc_nonshared.a\" -exec install -Dvm 0644 '{}' \"${destdir}/libc_nonshared.a\" \\;\n        fi\n    fi\nfi\n\n# Delete .a and .py files, we don't want those.\nrm -f ${libdir}/*.a ${libdir}/*.py\n\n# Delete any `.so` files that are not ELF files, since they're mostly likely linker scripts.\n# Keep the `libgcc_s.so` linker script though so that `gcc -shared` can pick up `libgcc.a`\n# via `-shared-libgcc` / `-lgcc_s` (c.f. JuliaLang/julia#61824)\nfor f in ${libdir}/*.so; do\n    if [[ \"$(basename \"$f\")\" == \"libgcc_s.so\" ]]; then\n        continue\n    fi\n    if [[ \"$(file -b \"$(realpath \"$f\")\")\" != ELF* ]]; then\n        rm -vf \"$f\"\n    fi\ndone\n\n# change permissions so that rpath succeeds\nfor l in ${libdir}/*; do\n    chmod 0755 \"${l}\"\ndone\n\n# libgcc_s.X.dylib receives special treatment for now.  We need to reset the dylib id,\n# but we don't want to run a full audit, so we do it ourselves.\nif [[ ${target} == *apple* ]]; then\n    for libgcc_s in ${libdir}/libgcc_s.*.dylib; do\n        LIBGCC_NAME=$(basename \"${libgcc_s}\")\n        install_name_tool -id @rpath/${LIBGCC_NAME} \"${libdir}/${LIBGCC_NAME}\"\n        if [[ \"${LIBGCC_NAME}\" == \"libgcc_s.1.dylib\" ]] && [[ \"${PREFERRED_GCC_VERSION%.*.*}\" -ge 12 ]]; then\n            # GCC 12 on x86_64-apple-darwin changed the ABI of libgcc_s from 1 to 1.1, but keeping a compatibility shim\n            # called libgcc_s.1.dylib which forwards all calls to libgcc_s.1.1.dylib.  We have to manually fix the path\n            # of the dependency because the auditor won't do it: <https://github.com/JuliaPackaging/BinaryBuilder.jl/issues/1243>.\n            install_name_tool -change \"/workspace/destdir/${target}/lib/libgcc_s.1.1.dylib\" \"@rpath/libgcc_s.1.1.dylib\" \"${libdir}/${LIBGCC_NAME}\"\n        fi\n    done\nfi\n\n# Remove extraneous libraries\nrm -f ${libdir}/{libiconv,libxml2,libz}*.${dlext}*\n\n# Install license (we license these all as GPL3, since they're from GCC)\ninstall_license /usr/share/licenses/GPL-3.0+\n""", """AATRIPLET=x86_64-linux-gnu\nWINDOWS_STATICLIBS=true\nUNIX_STATICLIBS=false\nPREFERRED_GCC_VERSION=13.0.0\nVERSION=10102\n# Start by extracting LatestLibraries\ntar -zxvf ${WORKSPACE}/srcdir/LatestLibraries*.tar.gz -C ${prefix}\n\n# Make sure expansions aren't empty\nshopt -s nullglob\n\n# copy out all the libraries we can find except libstdc++ and libgomp,\n# which we copied out in the extraction step above.\nfor lib in /opt/${target}/${target}/lib*/*.${dlext}*; do\n    if [[ \"${lib}\" != *libstdc++* ]] && [[ \"${lib}\" != *libgomp* ]]; then\n        cp -uav \"${lib}\" \"${libdir}/\"\n    fi\ndone\n\n# libwinpthread is a special snowflake and is only within `bin` for some reason\nif [[ ${target} == *mingw* ]]; then\n    cp -uav /opt/${target}/${target}/sys-root/bin/*.${dlext}* ${libdir}/\n    if [[ \"${WINDOWS_STATICLIBS}\" == \"true\" ]]; then\n        # From v1.1.0 of CSL we move the Windows `*.a` files to a subdir of `${prefix}/lib`.\n        # See <https://github.com/JuliaLang/julia/issues/48081>.\n        if [[ \"${VERSION}\" -ge 10100 ]]; then\n           destdir=\"${prefix}/lib/gcc/${AATRIPLET}/${PREFERRED_GCC_VERSION%.*.*}\"\n        else\n           destdir=\"${prefix}/lib\"\n        fi\n        # Install also some static and import libraries, needed for linking of pkgimages\n        # and for direct ld links of Windows executables and DLLs.\n        for lib in libadvapi32.a libdbghelp.a libgcc.a libgcc_s.a libiphlpapi.a libkernel32.a libmingwex.a \\\n                   libmingw32.a libmsvcrt.a libmsvcrt-os.a libmoldname.a libntdll.a libole32.a libpsapi.a libsecur32.a \\\n                   libshell32.a libssp.a libuser32.a libuserenv.a libuuid.a libwinmm.a libws2_32.a \\\n                   libpthread.dll.a libssp.dll.a dllcrt2.o crt2.o crt2u.o crtbegin.o crtend.o; do\n            qfind \"/opt/${target}\" -name \"${lib}\" -exec install -Dvm 0644 '{}' \"${destdir}/${lib}\" \\;\n        done\n    fi\nfi\nif [[ \"${UNIX_STATICLIBS}\" == \"true\" ]] && [[ ${target} != *mingw* ]]; then\n    destdir=\"${prefix}/lib/gcc/${AATRIPLET}/${PREFERRED_GCC_VERSION%.*.*}\"\n    qfind \"/opt/${target}\" -name \"libgcc.a\" -exec install -Dvm 0644 '{}' \"${destdir}/libgcc.a\" \\;\n    if [[ ${target} == *linux* ]] || [[ ${target} == *freebsd* ]]; then\n        for lib in crti.o crtn.o crtbeginS.o crtendS.o; do\n            qfind \"/opt/${target}\" -name \"${lib}\" -exec install -Dvm 0644 '{}' \"${destdir}/${lib}\" \\;\n        done\n        if [[ ${target} == *-linux-gnu* ]]; then\n            qfind \"/opt/${target}\" -name \"libc_nonshared.a\" -exec install -Dvm 0644 '{}' \"${destdir}/libc_nonshared.a\" \\;\n        fi\n    fi\nfi\n\n# Delete .a and .py files, we don't want those.\nrm -f ${libdir}/*.a ${libdir}/*.py\n\n# Delete any `.so` files that are not ELF files, since they're mostly likely linker scripts.\n# Keep the `libgcc_s.so` linker script though so that `gcc -shared` can pick up `libgcc.a`\n# via `-shared-libgcc` / `-lgcc_s` (c.f. JuliaLang/julia#61824)\nfor f in ${libdir}/*.so; do\n    if [[ \"$(basename \"$f\")\" == \"libgcc_s.so\" ]]; then\n        continue\n    fi\n    if [[ \"$(file -b \"$(realpath \"$f\")\")\" != ELF* ]]; then\n        rm -vf \"$f\"\n    fi\ndone\n\n# change permissions so that rpath succeeds\nfor l in ${libdir}/*; do\n    chmod 0755 \"${l}\"\ndone\n\n# libgcc_s.X.dylib receives special treatment for now.  We need to reset the dylib id,\n# but we don't want to run a full audit, so we do it ourselves.\nif [[ ${target} == *apple* ]]; then\n    for libgcc_s in ${libdir}/libgcc_s.*.dylib; do\n        LIBGCC_NAME=$(basename \"${libgcc_s}\")\n        install_name_tool -id @rpath/${LIBGCC_NAME} \"${libdir}/${LIBGCC_NAME}\"\n        if [[ \"${LIBGCC_NAME}\" == \"libgcc_s.1.dylib\" ]] && [[ \"${PREFERRED_GCC_VERSION%.*.*}\" -ge 12 ]]; then\n            # GCC 12 on x86_64-apple-darwin changed the ABI of libgcc_s from 1 to 1.1, but keeping a compatibility shim\n            # called libgcc_s.1.dylib which forwards all calls to libgcc_s.1.1.dylib.  We have to manually fix the path\n            # of the dependency because the auditor won't do it: <https://github.com/JuliaPackaging/BinaryBuilder.jl/issues/1243>.\n            install_name_tool -change \"/workspace/destdir/${target}/lib/libgcc_s.1.1.dylib\" \"@rpath/libgcc_s.1.1.dylib\" \"${libdir}/${LIBGCC_NAME}\"\n        fi\n    done\nfi\n\n# Remove extraneous libraries\nrm -f ${libdir}/{libiconv,libxml2,libz}*.${dlext}*\n\n# Install license (we license these all as GPL3, since they're from GCC)\ninstall_license /usr/share/licenses/GPL-3.0+\n""", """AATRIPLET=aarch64-linux-gnu\nWINDOWS_STATICLIBS=true\nUNIX_STATICLIBS=false\nPREFERRED_GCC_VERSION=13.0.0\nVERSION=10102\n# Start by extracting LatestLibraries\ntar -zxvf ${WORKSPACE}/srcdir/LatestLibraries*.tar.gz -C ${prefix}\n\n# Make sure expansions aren't empty\nshopt -s nullglob\n\n# copy out all the libraries we can find except libstdc++ and libgomp,\n# which we copied out in the extraction step above.\nfor lib in /opt/${target}/${target}/lib*/*.${dlext}*; do\n    if [[ \"${lib}\" != *libstdc++* ]] && [[ \"${lib}\" != *libgomp* ]]; then\n        cp -uav \"${lib}\" \"${libdir}/\"\n    fi\ndone\n\n# libwinpthread is a special snowflake and is only within `bin` for some reason\nif [[ ${target} == *mingw* ]]; then\n    cp -uav /opt/${target}/${target}/sys-root/bin/*.${dlext}* ${libdir}/\n    if [[ \"${WINDOWS_STATICLIBS}\" == \"true\" ]]; then\n        # From v1.1.0 of CSL we move the Windows `*.a` files to a subdir of `${prefix}/lib`.\n        # See <https://github.com/JuliaLang/julia/issues/48081>.\n        if [[ \"${VERSION}\" -ge 10100 ]]; then\n           destdir=\"${prefix}/lib/gcc/${AATRIPLET}/${PREFERRED_GCC_VERSION%.*.*}\"\n        else\n           destdir=\"${prefix}/lib\"\n        fi\n        # Install also some static and import libraries, needed for linking of pkgimages\n        # and for direct ld links of Windows executables and DLLs.\n        for lib in libadvapi32.a libdbghelp.a libgcc.a libgcc_s.a libiphlpapi.a libkernel32.a libmingwex.a \\\n                   libmingw32.a libmsvcrt.a libmsvcrt-os.a libmoldname.a libntdll.a libole32.a libpsapi.a libsecur32.a \\\n                   libshell32.a libssp.a libuser32.a libuserenv.a libuuid.a libwinmm.a libws2_32.a \\\n                   libpthread.dll.a libssp.dll.a dllcrt2.o crt2.o crt2u.o crtbegin.o crtend.o; do\n            qfind \"/opt/${target}\" -name \"${lib}\" -exec install -Dvm 0644 '{}' \"${destdir}/${lib}\" \\;\n        done\n    fi\nfi\nif [[ \"${UNIX_STATICLIBS}\" == \"true\" ]] && [[ ${target} != *mingw* ]]; then\n    destdir=\"${prefix}/lib/gcc/${AATRIPLET}/${PREFERRED_GCC_VERSION%.*.*}\"\n    qfind \"/opt/${target}\" -name \"libgcc.a\" -exec install -Dvm 0644 '{}' \"${destdir}/libgcc.a\" \\;\n    if [[ ${target} == *linux* ]] || [[ ${target} == *freebsd* ]]; then\n        for lib in crti.o crtn.o crtbeginS.o crtendS.o; do\n            qfind \"/opt/${target}\" -name \"${lib}\" -exec install -Dvm 0644 '{}' \"${destdir}/${lib}\" \\;\n        done\n        if [[ ${target} == *-linux-gnu* ]]; then\n            qfind \"/opt/${target}\" -name \"libc_nonshared.a\" -exec install -Dvm 0644 '{}' \"${destdir}/libc_nonshared.a\" \\;\n        fi\n    fi\nfi\n\n# Delete .a and .py files, we don't want those.\nrm -f ${libdir}/*.a ${libdir}/*.py\n\n# Delete any `.so` files that are not ELF files, since they're mostly likely linker scripts.\n# Keep the `libgcc_s.so` linker script though so that `gcc -shared` can pick up `libgcc.a`\n# via `-shared-libgcc` / `-lgcc_s` (c.f. JuliaLang/julia#61824)\nfor f in ${libdir}/*.so; do\n    if [[ \"$(basename \"$f\")\" == \"libgcc_s.so\" ]]; then\n        continue\n    fi\n    if [[ \"$(file -b \"$(realpath \"$f\")\")\" != ELF* ]]; then\n        rm -vf \"$f\"\n    fi\ndone\n\n# change permissions so that rpath succeeds\nfor l in ${libdir}/*; do\n    chmod 0755 \"${l}\"\ndone\n\n# libgcc_s.X.dylib receives special treatment for now.  We need to reset the dylib id,\n# but we don't want to run a full audit, so we do it ourselves.\nif [[ ${target} == *apple* ]]; then\n    for libgcc_s in ${libdir}/libgcc_s.*.dylib; do\n        LIBGCC_NAME=$(basename \"${libgcc_s}\")\n        install_name_tool -id @rpath/${LIBGCC_NAME} \"${libdir}/${LIBGCC_NAME}\"\n        if [[ \"${LIBGCC_NAME}\" == \"libgcc_s.1.dylib\" ]] && [[ \"${PREFERRED_GCC_VERSION%.*.*}\" -ge 12 ]]; then\n            # GCC 12 on x86_64-apple-darwin changed the ABI of libgcc_s from 1 to 1.1, but keeping a compatibility shim\n            # called libgcc_s.1.dylib which forwards all calls to libgcc_s.1.1.dylib.  We have to manually fix the path\n            # of the dependency because the auditor won't do it: <https://github.com/JuliaPackaging/BinaryBuilder.jl/issues/1243>.\n            install_name_tool -change \"/workspace/destdir/${target}/lib/libgcc_s.1.1.dylib\" \"@rpath/libgcc_s.1.1.dylib\" \"${libdir}/${LIBGCC_NAME}\"\n        fi\n    done\nfi\n\n# Remove extraneous libraries\nrm -f ${libdir}/{libiconv,libxml2,libz}*.${dlext}*\n\n# Install license (we license these all as GPL3, since they're from GCC)\ninstall_license /usr/share/licenses/GPL-3.0+\n""", """AATRIPLET=arm-linux-gnueabihf\nWINDOWS_STATICLIBS=true\nUNIX_STATICLIBS=false\nPREFERRED_GCC_VERSION=13.0.0\nVERSION=10102\n# Start by extracting LatestLibraries\ntar -zxvf ${WORKSPACE}/srcdir/LatestLibraries*.tar.gz -C ${prefix}\n\n# Make sure expansions aren't empty\nshopt -s nullglob\n\n# copy out all the libraries we can find except libstdc++ and libgomp,\n# which we copied out in the extraction step above.\nfor lib in /opt/${target}/${target}/lib*/*.${dlext}*; do\n    if [[ \"${lib}\" != *libstdc++* ]] && [[ \"${lib}\" != *libgomp* ]]; then\n        cp -uav \"${lib}\" \"${libdir}/\"\n    fi\ndone\n\n# libwinpthread is a special snowflake and is only within `bin` for some reason\nif [[ ${target} == *mingw* ]]; then\n    cp -uav /opt/${target}/${target}/sys-root/bin/*.${dlext}* ${libdir}/\n    if [[ \"${WINDOWS_STATICLIBS}\" == \"true\" ]]; then\n        # From v1.1.0 of CSL we move the Windows `*.a` files to a subdir of `${prefix}/lib`.\n        # See <https://github.com/JuliaLang/julia/issues/48081>.\n        if [[ \"${VERSION}\" -ge 10100 ]]; then\n           destdir=\"${prefix}/lib/gcc/${AATRIPLET}/${PREFERRED_GCC_VERSION%.*.*}\"\n        else\n           destdir=\"${prefix}/lib\"\n        fi\n        # Install also some static and import libraries, needed for linking of pkgimages\n        # and for direct ld links of Windows executables and DLLs.\n        for lib in libadvapi32.a libdbghelp.a libgcc.a libgcc_s.a libiphlpapi.a libkernel32.a libmingwex.a \\\n                   libmingw32.a libmsvcrt.a libmsvcrt-os.a libmoldname.a libntdll.a libole32.a libpsapi.a libsecur32.a \\\n                   libshell32.a libssp.a libuser32.a libuserenv.a libuuid.a libwinmm.a libws2_32.a \\\n                   libpthread.dll.a libssp.dll.a dllcrt2.o crt2.o crt2u.o crtbegin.o crtend.o; do\n            qfind \"/opt/${target}\" -name \"${lib}\" -exec install -Dvm 0644 '{}' \"${destdir}/${lib}\" \\;\n        done\n    fi\nfi\nif [[ \"${UNIX_STATICLIBS}\" == \"true\" ]] && [[ ${target} != *mingw* ]]; then\n    destdir=\"${prefix}/lib/gcc/${AATRIPLET}/${PREFERRED_GCC_VERSION%.*.*}\"\n    qfind \"/opt/${target}\" -name \"libgcc.a\" -exec install -Dvm 0644 '{}' \"${dest