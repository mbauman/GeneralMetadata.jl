platforms = ["i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran3", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "armv6l-linux-gnueabihf-libgfortran3", "armv6l-linux-gnueabihf-libgfortran4", "armv6l-linux-gnueabihf-libgfortran5", "armv7l-linux-gnueabihf-libgfortran3", "armv7l-linux-gnueabihf-libgfortran4", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran3", "powerpc64le-linux-gnu-libgfortran4", "powerpc64le-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran3", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran3", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran3", "aarch64-linux-musl-libgfortran4", "aarch64-linux-musl-libgfortran5", "armv6l-linux-musleabihf-libgfortran3", "armv6l-linux-musleabihf-libgfortran4", "armv6l-linux-musleabihf-libgfortran5", "armv7l-linux-musleabihf-libgfortran3", "armv7l-linux-musleabihf-libgfortran4", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin-libgfortran3", "x86_64-apple-darwin-libgfortran4", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran3", "x86_64-unknown-freebsd-libgfortran4", "x86_64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran3", "i686-w64-mingw32-libgfortran4", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran3", "x86_64-w64-mingw32-libgfortran4", "x86_64-w64-mingw32-libgfortran5"]
script = """WINDOWS_STATICLIBS=true\nPREFERRED_GCC_VERSION=12.0.0\n# Start by extracting LatestLibraries\ntar -zxvf ${WORKSPACE}/srcdir/LatestLibraries*.tar.gz -C ${prefix}\n\n# Make sure expansions aren't empty\nshopt -s nullglob\n\n# copy out all the libraries we can find except libstdc++ and libgomp,\n# which we copied out in the extraction step above.\nfor lib in /opt/${target}/${target}/lib*/*.${dlext}*; do\n    if [[ \"${lib}\" != *libstdc++* ]] && [[ \"${lib}\" != *libgomp* ]]; then\n        cp -uav \"${lib}\" \"${libdir}/\"\n    fi\ndone\n\n# libwinpthread is a special snowflake and is only within `bin` for some reason\nif [[ ${target} == *mingw* ]]; then\n    cp -uav /opt/${target}/${target}/sys-root/bin/*.${dlext}* ${libdir}/\n    if [[ \"${WINDOWS_STATICLIBS}\" == \"true\" ]]; then\n        # Install also some static libraries, needed for linking\n        for lib in libmsvcrt.a libgcc.a libgcc_s.a libssp.a; do\n            qfind \"/opt/${target}\" -name \"${lib}\" -exec install -Dvm 0644 '{}' \"${prefix}/lib/${lib}\" \\;\n        done\n    fi\nfi\n\n# Delete .a and .py files, we don't want those.\nrm -f ${libdir}/*.a ${libdir}/*.py\n\n# Delete any `.so` files that are not ELF files, since they're mostly likely linker scripts\nfor f in ${libdir}/*.so; do\n    if [[ \"$(file -b \"$(realpath \"$f\")\")\" != ELF* ]]; then\n        rm -vf \"$f\"\n    fi\ndone\n\n# change permissions so that rpath succeeds\nfor l in ${libdir}/*; do\n    chmod 0755 \"${l}\"\ndone\n\n# libgcc_s.X.dylib receives special treatment for now.  We need to reset the dylib id,\n# but we don't want to run a full audit, so we do it ourselves.\nif [[ ${target} == *apple* ]]; then\n    for libgcc_s in ${libdir}/libgcc_s.*.dylib; do\n        LIBGCC_NAME=$(basename \"${libgcc_s}\")\n        install_name_tool -id @rpath/${LIBGCC_NAME} \"${libdir}/${LIBGCC_NAME}\"\n        if [[ \"${LIBGCC_NAME}\" == \"libgcc_s.1.dylib\" ]] && [[ \"${PREFERRED_GCC_VERSION%.*.*}\" -ge 12 ]]; then\n            # GCC 12 on x86_64-apple-darwin changed the ABI of libgcc_s from 1 to 1.1, but keeping a compatibility shim\n            # called libgcc_s.1.dylib which forwards all calls to libgcc_s.1.1.dylib.  We have to manually fix the path\n            # of the dependency because the auditor won't do it: <https://github.com/JuliaPackaging/BinaryBuilder.jl/issues/1243>.\n            install_name_tool -change \"/workspace/destdir/${target}/lib/libgcc_s.1.1.dylib\" \"@rpath/libgcc_s.1.1.dylib\" \"${libdir}/${LIBGCC_NAME}\"\n        fi\n    done\nfi\n\n# Remove extraneous libraries\nrm -f ${libdir}/{libiconv,libxml2,libz}*.${dlext}*\n\n# Install license (we license these all as GPL3, since they're from GCC)\ninstall_license /usr/share/licenses/GPL-3.0+\n"""
version = "v1.0.1"

