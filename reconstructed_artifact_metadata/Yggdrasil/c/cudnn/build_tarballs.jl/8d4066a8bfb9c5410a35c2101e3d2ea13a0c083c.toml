julia_compat = "1.0"
lazy_artifacts = true
name = "CUDNN"
platforms = ["x86_64-linux-gnu-cuda+10.2", "x86_64-w64-mingw32-cuda+10.2", "aarch64-linux-gnu-cuda+10.2", "x86_64-linux-gnu-cuda+11.0", "powerpc64le-linux-gnu-cuda+11.0", "x86_64-w64-mingw32-cuda+11.0", "aarch64-linux-gnu-cuda+11.0", "x86_64-linux-gnu-cuda+11.1", "powerpc64le-linux-gnu-cuda+11.1", "x86_64-w64-mingw32-cuda+11.1", "aarch64-linux-gnu-cuda+11.1", "x86_64-linux-gnu-cuda+11.2", "powerpc64le-linux-gnu-cuda+11.2", "x86_64-w64-mingw32-cuda+11.2", "aarch64-linux-gnu-cuda+11.2", "x86_64-linux-gnu-cuda+11.3", "powerpc64le-linux-gnu-cuda+11.3", "x86_64-w64-mingw32-cuda+11.3", "aarch64-linux-gnu-cuda+11.3", "x86_64-linux-gnu-cuda+11.4", "powerpc64le-linux-gnu-cuda+11.4", "x86_64-w64-mingw32-cuda+11.4", "aarch64-linux-gnu-cuda+11.4"]
script = """mkdir -p ${libdir} ${prefix}/include\n\ncd ${WORKSPACE}/srcdir\nif [[ ${target} == powerpc64le-linux-gnu ]]; then\n    cd cuda/targets/ppc64le-linux\n    find .\n\n    install_license NVIDIA_SLA_cuDNN_Support.txt\n\n    mv lib/libcudnn*.so* ${libdir}\n    mv include/* ${prefix}/include\nelif [[ ${target} == aarch64-linux-gnu && ${bb_full_target} == aarch64-linux-gnu-*-cuda+10.2 ]]; then\n    apk add dpkg\n    dpkg-deb -x libcudnn8_*.deb .\n    dpkg-deb -x libcudnn8-dev_*.deb .\n    mv -nv ./usr/include/aarch64-linux-gnu/* ${includedir}\n    mv -nv ./usr/lib/aarch64-linux-gnu/libcudnn*.so* ${libdir}\n    install_license ./usr/share/doc/libcudnn8/copyright\nelif [[ ${target} == *-linux-gnu ]]; then\n    cd cuda\n    find .\n\n    install_license NVIDIA_SLA_cuDNN_Support.txt\n\n    mv lib64/libcudnn*.so* ${libdir}\n    mv include/* ${prefix}/include\nelif [[ ${target} == x86_64-w64-mingw32 ]]; then\n    cd cuda\n    find .\n\n    install_license NVIDIA_SLA_cuDNN_Support.txt\n\n    mv bin/cudnn*64_*.dll ${libdir}\n    mv include/* ${prefix}/include\n\n    mv ../dll_x64/zlibwapi.dll ${libdir}\n\n    # fixup\n    chmod +x ${libdir}/*.dll\nfi\n"""
version = "v8.2.1"

