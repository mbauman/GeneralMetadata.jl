init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "MPFR"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/mpfr-*\n./configure --prefix=$prefix --host=$target --enable-shared --disable-static --with-gmp=${prefix} --enable-thread-safe --enable-shared-cache --disable-float128 --disable-decimal-float\nmake -j${nproc}\nmake install\n\n# On Windows, make sure non-versioned filename exists...\nif [[ ${target} == *mingw* ]]; then\n    cp -v ${prefix}/bin/libmpfr-*.dll ${prefix}/bin/libmpfr.dll\nfi\n"""
version = "v4.1.1"

[[dependencies]]
name = "GMP_jll"
type = "dependency"
version-major = 6
version-minor = 2
version-patch = 0

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["libmpfr"]
type = "lib"
variable_name = "libmpfr"

