dependencies = ["GMP_jll"]
name = "MPFR"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/mpfr-*\n./configure --prefix=$prefix --host=$target --enable-shared --disable-static --with-gmp=${prefix}\nmake -j${nproc}\nmake install\n\n# On Windows, make sure non-versioned filename exists...\nif [[ ${target} == *mingw* ]]; then\n    cp -v ${prefix}/bin/libmpfr-*.dll ${prefix}/bin/libmpfr.dll\nfi\n"""
version = "v4.0.2"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libmpfr"]
type = "lib"
variable_name = "libmpfr"

[[sources]]
"https://www.mpfr.org/mpfr-current/mpfr-4.0.2.tar.xz" = "1d3be708604eae0e42d578ba93b390c2a145f17743a744d8f3f8c2ad5855a38a"
