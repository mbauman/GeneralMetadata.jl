init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "manifold"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/manifold\n\n# Fix CMake for Clipper2 on Windows\n# Sent upstream in https://github.com/elalish/manifold/pull/815\natomic_patch -p1 $WORKSPACE/srcdir/patches/cmake_import_lib.patch\n\nmkdir build\ncd build/\ngit submodule update --init --recursive\ncmake .. \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DMANIFOLD_PAR=NONE \\\n    -DMANIFOLD_TEST=OFF \\\n    -DBUILD_TEST_CGAL=OFF \\\n    -DMANIFOLD_PYBIND=OFF \\\n    -DMANIFOLD_JSBIND=OFF \\\n    -DMANIFOLD_EXPORT=OFF \\\n    -DBUILD_SHARED_LIBS=ON\ncmake --build . --parallel ${nproc}\ncmake --install .\n"""
version = "v2.4.5"

