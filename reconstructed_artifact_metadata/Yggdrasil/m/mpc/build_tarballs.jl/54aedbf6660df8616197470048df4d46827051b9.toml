dependencies = ["GMP_jll", "MPFR_jll"]
name = "MPC"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/mpc-*\n./configure --prefix=$prefix --host=$target --enable-shared --disable-static --with-gmp=${prefix} --with-mpfr=${prefix}\nmake -j${nproc}\nmake install\n\n# On Windows, make sure non-versioned filename exists...\nif [[ ${target} == *mingw* ]]; then\n    cp -v ${prefix}/bin/libmpc-*.dll ${prefix}/bin/libmpc.dll\nfi\n"""
version = "v1.1.0"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libmpc"]
type = "lib"
variable_name = "libmpc"

[[sources]]
"https://ftp.gnu.org/gnu/mpc/mpc-1.1.0.tar.gz" = "6985c538143c1208dcb1ac42cedad6ff52e267b47e5f970183a3e75125b43c2e"
