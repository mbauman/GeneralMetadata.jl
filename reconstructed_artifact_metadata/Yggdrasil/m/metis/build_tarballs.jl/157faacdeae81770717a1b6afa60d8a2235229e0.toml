dependencies = []
name = "METIS"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/metis-5.1.0/\nif [ $target = \"x86_64-w64-mingw32\" ] || [ $target = \"i686-w64-mingw32\" ]; then\n    atomic_patch -p1 $WORKSPACE/srcdir/patches/0001-mingw-w64-does-not-have-sys-resource-h.patch\n    atomic_patch -p1 $WORKSPACE/srcdir/patches/0002-mingw-w64-do-not-use-reserved-double-underscored-names.patch\n    atomic_patch -p1 $WORKSPACE/srcdir/patches/0003-WIN32-Install-RUNTIME-to-bin.patch\n    atomic_patch -p1 $WORKSPACE/srcdir/patches/0004-Fix-GKLIB_PATH-default-for-out-of-tree-builds.patch\nfi\nmkdir -p build\ncd build/\ncmake $WORKSPACE/srcdir/metis-5.1.0/ \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n    -DCMAKE_VERBOSE_MAKEFILE=1 \\\n    -DGKLIB_PATH=$WORKSPACE/srcdir/metis-5.1.0/GKlib \\\n    -DSHARED=1\nmake -j${nproc} install\n"""
sources = [{"http://glaros.dtc.umn.edu/gkhome/fetch/sw/metis/metis-5.1.0.tar.gz" = "76faebe03f6c963127dbb73c13eab58c9a3faeae48779f049066a21c087c5db2"}, "./bundled"]
version = "v5.1.0"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libmetis"]
type = "lib"
variable_name = "libmetis"
