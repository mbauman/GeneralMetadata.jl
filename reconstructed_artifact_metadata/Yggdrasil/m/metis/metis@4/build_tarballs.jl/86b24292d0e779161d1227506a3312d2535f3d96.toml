name = "METIS4"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """if [[ \"${target}\" == *-mingw* ]]; then\n  COPTIONS=\"${COPTIONS} -D__VC__\"  # to resolve missing srand48/drand48 symbols\nfi\n\n# build libmetis.a\ncd $WORKSPACE/srcdir/metis-*\nfor f in ${WORKSPACE}/srcdir/patches/*.patch; do\n  atomic_patch -p1 ${f}\ndone\ncd Lib\nmake -j${nproc} COPTIONS=\"${COPTIONS} -fPIC\"\ncd ..\n\nif [[ \"${target}\" == *apple* ]]; then\n    SONAME=\"-install_name\"\nelse\n    SONAME=\"-soname\"\nfi\n\nmkdir -p $libdir\nmkdir -p $includedir\ncp Lib/metis.h $includedir\n$CC -shared -Wl,$SONAME,libmetis4.${dlext} $(flagon -Wl,--whole-archive) libmetis.a $(flagon -Wl,--no-whole-archive) -o ${libdir}/libmetis4.${dlext}\n"""
version = "v400.0.301"

