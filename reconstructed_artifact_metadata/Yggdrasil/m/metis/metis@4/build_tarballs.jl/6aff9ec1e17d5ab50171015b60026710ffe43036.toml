dependencies = []
lazy_artifacts = false
name = "METIS"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """all_load=\"--whole-archive\"\nnoall_load=\"--no-whole-archive\"\nCOPTIONS=\"-fPIC\"\nif [[ \"${target}\" == *-apple-* ]]; then\n  all_load=\"-all_load\"\n  noall_load=\"-noall_load\"\nfi\nif [[ \"${target}\" == *-mingw* ]]; then\n  COPTIONS=\"${COPTIONS} -D__VC__\"  # to resolve missing srand48/drand48 symbols\nfi\n\n# build libmetis.a\ncd $WORKSPACE/srcdir/metis-4.0.3\nfor f in ${WORKSPACE}/srcdir/patches/*.patch; do\n  atomic_patch -p1 ${f}\ndone\ncd Lib\nmake -j${nproc} COPTIONS=\"${COPTIONS}\"\ncd ..\n\n# make a shared lib\ncc -fPIC -shared -Wl,${all_load} libmetis.a -Wl,${noall_load} -o libmetis.${dlext}\n\nmkdir -p ${libdir}\nmv libmetis.${dlext} ${libdir}\n"""
version = "v4.0.3"

