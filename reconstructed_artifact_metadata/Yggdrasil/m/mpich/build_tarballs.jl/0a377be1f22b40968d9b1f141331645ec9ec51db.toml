dependencies = []
name = "MPICH"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1"]
script = """# Enter the funzone\ncd ${WORKSPACE}/srcdir/mpich-*\n\n#export CROSS_F77_SIZEOF_INTEGER=4\n./configure --prefix=$prefix --host=$target --enable-shared=yes --enable-static=no --disable-fortran\n\n# Build the library\nmake \"${flags[@]}\" -j${nproc}\n\n# Install the library\nmake \"${flags[@]}\" install\n"""
version = "v3.3.2"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libmpi"]
type = "lib"
variable_name = "libmpi"

[[sources]]
"https://www.mpich.org/static/downloads/3.3.2/mpich-3.3.2.tar.gz" = "4bfaf8837a54771d3e4922c84071ef80ffebddbb6971a006038d91ee7ef959b9"
