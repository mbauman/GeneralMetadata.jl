augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = true
name = "micromamba"
platforms = ["x86_64-linux-gnu", "aarch64-linux-gnu", "powerpc64le-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-w64-mingw32"]
script = """# unpack the tarball (BinaryBuilder does not natively support bzip2 so we do this ourselves)\ncd $WORKSPACE/srcdir\nmkdir micromamba\ncd micromamba\ntar xjf ../micromamba-$target.tar.bz2\n\n# install the binary\nif [[ $target = *-w64-* ]]; then\n    install -Dvm 755 Library/bin/micromamba.exe \"${bindir}/micromamba.exe\"\nelse\n    install -Dvm 755 bin/micromamba \"${bindir}/micromamba\"\nfi\n\n# install the licenses\ninstall_license info/licenses/*\n"""
version = "v1.3.1"

[[products]]
binnames = ["micromamba"]
type = "exe"
variable_name = "micromamba"

