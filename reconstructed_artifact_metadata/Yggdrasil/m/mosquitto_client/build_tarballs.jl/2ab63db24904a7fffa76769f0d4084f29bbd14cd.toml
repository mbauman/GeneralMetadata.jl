name = "mosquitto_client"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/mosquitto/\n\n# Fix \"cannot finding openssl\" under Windows\nif [[ ${target} == x86_64-w64-mingw32 ]]; then\n    export OPENSSL_ROOT_DIR=${prefix}/lib64/\nfi\n\nmkdir build && cd build\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DDOCUMENTATION=OFF \\\n    -DWITH_CJSON=OFF \\\n    -DWITH_BROKER=OFF \\\n    -DWITH_APPS=OFF \\\n    -DWITH_PLUGINS=OFF \\\n    ..\nmake -j${nproc}\nmake install\ninstall_license ../LICENSE.txt\n"""
version = "v2.0.15"

