nux-musl-libgfortran5-cxx11-julia_version+1.13.0-mpi+openmpi", "x86_64-apple-darwin-libgfortran5-julia_version+1.13.0-mpi+openmpi", "aarch64-apple-darwin-libgfortran5-julia_version+1.13.0-mpi+openmpi", "x86_64-unknown-freebsd-libgfortran5-julia_version+1.13.0-mpi+openmpi", "aarch64-unknown-freebsd-libgfortran5-julia_version+1.13.0-mpi+openmpi", "i686-linux-gnu-libgfortran5-cxx11-julia_version+1.14.0-mpi+openmpi", "x86_64-linux-gnu-libgfortran5-cxx11-julia_version+1.14.0-mpi+openmpi", "aarch64-linux-gnu-libgfortran5-cxx11-julia_version+1.14.0-mpi+openmpi", "powerpc64le-linux-gnu-libgfortran5-cxx11-julia_version+1.14.0-mpi+openmpi", "riscv64-linux-gnu-libgfortran5-cxx11-julia_version+1.14.0-mpi+openmpi", "x86_64-linux-musl-libgfortran5-cxx11-julia_version+1.14.0-mpi+openmpi", "aarch64-linux-musl-libgfortran5-cxx11-julia_version+1.14.0-mpi+openmpi", "x86_64-apple-darwin-libgfortran5-julia_version+1.14.0-mpi+openmpi", "aarch64-apple-darwin-libgfortran5-julia_version+1.14.0-mpi+openmpi", "x86_64-unknown-freebsd-libgfortran5-julia_version+1.14.0-mpi+openmpi", "aarch64-unknown-freebsd-libgfortran5-julia_version+1.14.0-mpi+openmpi"]
script = """macos_sdk_version=14.5\nmacosx_deployment_target=14.5\n# Move the SDK tarball out of `srcdir` on all platforms: any extra entry\n# in there defeats the automatic installation of license files, which\n# expects `srcdir` to contain a single top-level source directory.\nmv ${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz ${WORKSPACE}/\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    # Extract SDK. Also outside of `srcdir`, for the same reason.\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    tar \\\n        --extract \\\n        --file=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=${WORKSPACE} \\\n        --warning=no-unknown-keyword\n    old_sdkroot=${SDKROOT}\n    new_sdkroot=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk\n    # Make sure libc++ header files are available at `usr/include/c++/v1`.\n    # Some SDKs ship their own (e.g. 15.0), which we leave alone; for those\n    # that don't, symlink the ones from the default SDK. Note we symlink\n    # the `v1` subdirectory rather than the whole `c++` directory: some\n    # SDKs (e.g. 10.13) contain `usr/include/c++/4.2.1` (but no `v1`), and\n    # symlinking `c++` onto that existing directory would silently create\n    # a nested `c++/c++` link, so libc++ headers like <new> are not found.\n    if [[ ! -d ${new_sdkroot}/usr/include/c++/v1 ]]; then\n        mkdir -p ${new_sdkroot}/usr/include/c++\n        ln -sT ${old_sdkroot}/usr/include/c++/v1 ${new_sdkroot}/usr/include/c++/v1\n    fi\n    # In the build environment `usr/local` of the default sys-root is a\n    # symlink to the destdir prefix, which puts the header files of the\n    # dependencies on the compilers' default search path. No SDK ships a\n    # `usr/local`, so replicate that symlink in the new SDK. `-T` makes\n    # this fail loudly should some SDK ship a `usr/local` after all,\n    # instead of silently creating a nested `usr/local/local` link.\n    ln -sT ${old_sdkroot}/usr/local ${new_sdkroot}/usr/local\n    # Fix toolchain files\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" ${MESON_TARGET_TOOLCHAIN} ${CMAKE_TARGET_TOOLCHAIN}\n    # Fix compiler wrappers\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" $(find /opt/bin/${target}* -type f -print)\n    SDKROOT=${new_sdkroot}\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\n\ncd $WORKSPACE/srcdir/musica\n\n# Needs cmake >= 3.24 provided by jll\napk del cmake\n\n# Update Ninja — the sandbox's built-in ninja (1.9) is too old for Fortran support\ncp ${host_prefix}/bin/ninja /usr/bin/ninja\n\nif [[ \"${target}\" == *-apple-* ]]; then\n    # Install libdispatch. This is required for the MacOS linker.\n    # It should probably have been put into the root file system.\n    # This requires GCC 14 or later.\n    apk add libdispatch libdispatch-dev --repository=http://dl-cdn.alpinelinux.org/alpine/v3.17/community\nfi\n\n# Configure MUSICA with Julia wrapper enabled\ncmake -B build -G Ninja \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_PREFIX_PATH=\"${prefix}\" \\\n    -DJulia_PREFIX=${prefix} \\\n    -DMUSICA_BUILD_C_CXX_INTERFACE=ON \\\n    -DMUSICA_ENABLE_JULIA=ON \\\n    -DMUSICA_ENABLE_MICM=ON \\\n    -DMUSICA_ENABLE_TUVX=ON \\\n    -DMUSICA_ENABLE_CARMA=OFF \\\n    -DMUSICA_ENABLE_TESTS=OFF \\\n    -DMUSICA_ENABLE_INSTALL=ON \\\n    -DMUSICA_BUILD_SHARED_LIBS=ON \\\n    -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \\\n    -DTUVX_BUILD_CLI=OFF\n\ncmake --build build --parallel ${nproc}\ncmake --install build\n\ninstall_license LICENSE\n\n# On Windows, CMake installs DLLs for LIBRARY targets to lib/ instead of bin/\n# BinaryBuilder requires all DLLs to be in bin/\nif [[ \"${target}\" == *-mingw* ]]; then\n    mv -vf \"${prefix}/lib/\"*.dll \"${libdir}/\" || true\nfi\n"""
