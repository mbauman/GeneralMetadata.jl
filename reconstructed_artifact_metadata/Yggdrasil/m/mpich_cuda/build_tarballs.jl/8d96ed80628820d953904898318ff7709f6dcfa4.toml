platforms = ["x86_64-linux-gnu-libgfortran5-mpi+mpich-cuda+11.8", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+jetson-cuda+11.8", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+sbsa-cuda+11.8", "x86_64-linux-gnu-libgfortran5-mpi+mpich-cuda+12.0", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+jetson-cuda+12.0", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+sbsa-cuda+12.0", "x86_64-linux-gnu-libgfortran5-mpi+mpich-cuda+12.1", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+jetson-cuda+12.1", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+sbsa-cuda+12.1", "x86_64-linux-gnu-libgfortran5-mpi+mpich-cuda+12.2", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+jetson-cuda+12.2", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+sbsa-cuda+12.2", "x86_64-linux-gnu-libgfortran5-mpi+mpich-cuda+12.3", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+sbsa-cuda+12.3", "x86_64-linux-gnu-libgfortran5-mpi+mpich-cuda+12.4", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+jetson-cuda+12.4", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+sbsa-cuda+12.4", "x86_64-linux-gnu-libgfortran5-mpi+mpich-cuda+12.5", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+jetson-cuda+12.5", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+sbsa-cuda+12.5", "x86_64-linux-gnu-libgfortran5-mpi+mpich-cuda+12.6", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+jetson-cuda+12.6", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+sbsa-cuda+12.6", "x86_64-linux-gnu-libgfortran5-mpi+mpich-cuda+12.8", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+jetson-cuda+12.8", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+sbsa-cuda+12.8", "x86_64-linux-gnu-libgfortran5-mpi+mpich-cuda+12.9", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+jetson-cuda+12.9", "aarch64-linux-gnu-libgfortran5-mpi+mpich-cuda_platform+sbsa-cuda+12.9"]
script = """################################################################################\n# Install MPICH\n################################################################################\n\n# Enter the funzone\ncd ${WORKSPACE}/srcdir/mpich*\n\n# Necessary operations to cross compile CUDA from x86_64 to aarch64\nif [[ \"${target}\" == aarch64-linux-* ]]; then\n\n   # Add /usr/lib/csl-musl-x86_64 to LD_LIBRARY_PATH to be able to use host nvcc\n   export LD_LIBRARY_PATH=\"/usr/lib/csl-musl-x86_64:/usr/lib/csl-glibc-x86_64:${LD_LIBRARY_PATH}\"\n   \n   # Make sure we use host CUDA executable by copying from the x86_64 CUDA redist\n   NVCC_DIR=(/workspace/srcdir/cuda_nvcc-*-archive)\n   rm -rf ${prefix}/cuda/bin\n   cp -r ${NVCC_DIR}/bin ${prefix}/cuda/bin\n   \n   rm -rf ${prefix}/cuda/nvvm/bin\n   cp -r ${NVCC_DIR}/nvvm/bin ${prefix}/cuda/nvvm/bin\n\n   export NVCC_PREPEND_FLAGS=\"-ccbin='${CXX}'\"\nfi\n\n\nexport CUDA_HOME=${prefix}/cuda;\nexport CUDACXX=$CUDA_HOME/bin/nvcc\nexport CUDA_LIB=${CUDA_HOME}/lib\nexport CUDA_INCLUDE=${CUDA_HOME}/include\n\n# - Do not install doc and man files which contain files which clashing names on\n#   case-insensitive file systems:\n#   * https://github.com/JuliaPackaging/Yggdrasil/pull/315\n#   * https://github.com/JuliaPackaging/Yggdrasil/issues/6344\n# - `--enable-fast=all,O3` leads to very long compile times for the\n#   file `src/mpi/coll/mpir_coll.c`. It seems we need to avoid\n#   `alwaysinline`.\n\nconfigure_flags=(\n    --build=${MACHTYPE}\n    --disable-dependency-tracking\n    --disable-doc\n    --enable-fast=ndebug,O3\n    --enable-static=no\n    --host=${target}\n    --prefix=${prefix}\n    --with-device=ch4\n    --with-hwloc=${prefix}\n    --with-cuda-include=${CUDA_INCLUDE}\n    --with-cuda-lib=${CUDA_LIB}\n)\n\n# Define some obscure undocumented variables needed for cross compilation of\n# the Fortran bindings.  See for example\n# * https://stackoverflow.com/q/56759636/2442087\n# * https://github.com/pmodels/mpich/blob/d10400d7a8238dc3c8464184238202ecacfb53c7/doc/installguide/cfile\nexport CROSS_F77_SIZEOF_INTEGER=4\nexport CROSS_F77_SIZEOF_REAL=4\nexport CROSS_F77_SIZEOF_DOUBLE_PRECISION=8\nexport CROSS_F77_SIZEOF_LOGICAL=4\nexport CROSS_F77_TRUE_VALUE=1\nexport CROSS_F77_FALSE_VALUE=0\n\nif [[ ${nbits} == 32 ]]; then\n    export CROSS_F90_ADDRESS_KIND=4\nelse\n    export CROSS_F90_ADDRESS_KIND=8\nfi\nexport CROSS_F90_OFFSET_KIND=8\nexport CROSS_F90_INTEGER_KIND=4\nexport CROSS_F90_INTEGER_MODEL=9\nexport CROSS_F90_REAL_MODEL=6,37\nexport CROSS_F90_DOUBLE_MODEL=15,307\nexport CROSS_F90_ALL_INTEGER_MODELS=2,1,4,2,9,4,18,8,\nexport CROSS_F90_INTEGER_MODEL_MAP={2,1,1},{4,2,2},{9,4,4},{18,8,8},\n\n./configure \"${configure_flags[@]}\"\n\n# Remove empty `-l` flags from libtool\n# (Why are they there? They should not be.)\n# Run the command several times to handle multiple (overlapping) occurrences.\nsed -i 's/\"-l /\"/g;s/ -l / /g;s/-l\"/\"/g' libtool\nsed -i 's/\"-l /\"/g;s/ -l / /g;s/-l\"/\"/g' libtool\nsed -i 's/\"-l /\"/g;s/ -l / /g;s/-l\"/\"/g' libtool\n\n# Build the library\nmake -j${nproc}\n\n# Install the library\nmake install\n\n# Install the license\ninstall_license $WORKSPACE/srcdir/mpich*/COPYRIGHT\n"""
version = "v4.3.2"

