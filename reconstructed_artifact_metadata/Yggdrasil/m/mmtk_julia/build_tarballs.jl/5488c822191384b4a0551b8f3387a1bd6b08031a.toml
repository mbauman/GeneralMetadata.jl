augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "mmtk_julia"
platforms = ["x86_64-linux-gnu"]
script = """cd $WORKSPACE/srcdir/mmtk-julia/\n# do a non-moving build until we support moving Immix\nMMTK_MOVING=0 make release \n\n# Install\ninstall -Dvm 755 \"mmtk/target/${rust_target}/release/libmmtk_julia.${dlext}\" -t \"${libdir}\"\ninstall -Dvm 644 \"mmtk/api/mmtk.h\" \"${includedir}/mmtk.h\"\ninstall -Dvm 644 \"mmtk/api/mmtkMutator.h\" \"${includedir}/mmtkMutator.h\"\n"""
version = "v0.30.4"

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = true
libnames = ["libmmtk_julia"]
type = "lib"
variable_name = "libmmtk_julia"
[[products]]
paths = ["include/mmtk.h"]
type = "file"
variable_name = "mmtk_h"
[[products]]
paths = ["include/mmtkMutator.h"]
type = "file"
variable_name = "mmtkMutator_h"

