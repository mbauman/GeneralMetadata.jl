dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "MbedTLS"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/mbedtls\n\natomic_patch -p1 ../patches/fix_incorrect_EOF_check.patch\n\n# llvm-ranlib gets confused, use the binutils one\nif [[ \"${target}\" == *apple* ]]; then\n    ln -sf /opt/${target}/bin/${target}-ranlib /opt/bin/ranlib\n    ln -sf /opt/${target}/bin/${target}-ranlib /opt/bin/${target}-ranlib\nfi\n\n# enable MD4\nsed \"s|//#define MBEDTLS_MD4_C|#define MBEDTLS_MD4_C|\" -i include/mbedtls/config.h\n\nmkdir build && cd build\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n    -DCMAKE_C_STANDARD=99 \\\n    -DUSE_SHARED_MBEDTLS_LIBRARY=On \\\n    ..\nmake -j${nproc} && make install\n\nif [[ \"${target}\" == *mingw* ]]; then\n    # For some reason, the build system doesn't set the `.dll` files as\n    # executable, which prevents them from being loaded.  Also, we need\n    # to explicitly use `${prefix}/lib` here because the build system\n    # is a simple one, and blindly uses `/lib`, even on Windows.\n    chmod +x ${prefix}/lib/*.dll\nfi\n"""
version = "v2.24.0"

