dependencies = []
name = "MbedTLS"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/mbedtls\nmkdir -p $prefix/lib\n\n# llvm-ranlib gets confused, use binutils\nif [[ \"${target}\" == *apple* ]]; then\n    ln -sf /opt/${target}/bin/${target}-ranlib /opt/bin/ranlib\nfi\ncmake -DCMAKE_INSTALL_PREFIX=$prefix -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" -DUSE_SHARED_MBEDTLS_LIBRARY=On\nmake -j${nproc} && make install\n"""
version = "v2.16.0"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libmbedcrypto"]
type = "lib"
variable_name = "libmbedcrypto"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libmbedx509"]
type = "lib"
variable_name = "libmbedx509"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libmbedtls"]
type = "lib"
variable_name = "libmbedtls"

[[sources]]
"https://github.com/ARMmbed/mbedtls.git" = "fb1972db23da39bd11d4f9c9ea6266eee665605b"
