augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "MParT"
platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd"]
script = """# Override compiler ID to silence the horrible \"No features found\" cmake error\n\ncd $WORKSPACE/srcdir\nmkdir MParT/build && cd MParT/build\n\nif [[ \"${target}\" == *-freebsd* ]]; then\n    export LDFLAGS=\"-lexecinfo\"\nfi\n\ncmake -DCMAKE_INSTALL_PREFIX=$prefix \\\n  -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n  -DCMAKE_CXX_FLAGS=\"-I${includedir}/eigen3 -fopenmp\" \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DMPART_BUILD_TESTS=OFF \\\n  -DMPART_PYTHON=OFF \\\n  -DMPART_JULIA=ON \\\n  -DJulia_PREFIX=${prefix} \\\n  ..\n\nmake -j${nprocs} install\n"""
version = "v0.2.1"

