augment_platform_block = """using Base.BinaryPlatforms\n\ntry\n    using CUDA_Runtime_jll\ncatch\n    # during initial package installation, CUDA_Runtime_jll may not be available.\n    # in that case, we just won't select an artifact.\nend\n\n# can't use Preferences for the same reason\nconst CUDA_Runtime_jll_uuid = Base.UUID(\"76a88914-d11a-5bdc-97e0-2f5a05c973a2\")\nconst preferences = Base.get_preferences(CUDA_Runtime_jll_uuid)\nBase.record_compiletime_preference(CUDA_Runtime_jll_uuid, \"version\")\nBase.record_compiletime_preference(CUDA_Runtime_jll_uuid, \"local\")\nconst local_toolkit = something(tryparse(Bool, get(preferences, \"local\", \"false\")), false)\n\nfunction cuda_comparison_strategy(_a::String, _b::String, a_requested::Bool, b_requested::Bool)\n    # if we're using a local toolkit, we can't use artifacts\n    if local_toolkit\n        return false\n    end\n\n    # if either isn't a version number (e.g. \"none\"), perform a simple equality check\n    a = tryparse(VersionNumber, _a)\n    b = tryparse(VersionNumber, _b)\n    if a === nothing || b === nothing\n        return _a == _b\n    end\n\n    # if both b and a requested, then we fall back to equality\n    if a_requested && b_requested\n        return Base.thisminor(a) == Base.thisminor(b)\n    end\n\n    # otherwise, do the comparison between the the single version cap and the single version:\n    function is_compatible(artifact::VersionNumber, host::VersionNumber)\n        if host >= v\"11.0\"\n            # enhanced compatibility, semver-style\n            artifact.major == host.major &&\n            Base.thisminor(artifact) <= Base.thisminor(host)\n        else\n            Base.thisminor(artifact) == Base.thisminor(host)\n        end\n    end\n    if a_requested\n        is_compatible(b, a)\n    else\n        is_compatible(a, b)\n    end\nend\n\nfunction augment_platform!(platform::Platform)\n    if !@isdefined(CUDA_Runtime_jll)\n        # don't set to nothing or Pkg will download any artifact\n        platform[\"cuda\"] = \"none\"\n    end\n\n    if !haskey(platform, \"cuda\")\n        CUDA_Runtime_jll.augment_platform!(platform)\n    end\n    BinaryPlatforms.set_compare_strategy!(platform, \"cuda\", cuda_comparison_strategy)\n\n    return platform\nend"""
init_block = ""
julia_compat = "1.8"
lazy_artifacts = false
name = "MAGMA"
platforms = ["x86_64-linux-gnu-cxx11-cuda+12.8", "aarch64-linux-gnu-cxx11-cuda_platform+jetson-cuda+12.8", "aarch64-linux-gnu-cxx11-cuda_platform+sbsa-cuda+12.8", "x86_64-linux-gnu-cxx11-cuda+12.9", "aarch64-linux-gnu-cxx11-cuda_platform+jetson-cuda+12.9", "aarch64-linux-gnu-cxx11-cuda_platform+sbsa-cuda+12.9", "x86_64-linux-gnu-cxx11-cuda+13.0", "aarch64-linux-gnu-cxx11-cuda+13.0", "x86_64-linux-gnu-cxx11-cuda+13.1", "aarch64-linux-gnu-cxx11-cuda+13.1", "x86_64-linux-gnu-cxx11-cuda+13.2", "aarch64-linux-gnu-cxx11-cuda+13.2"]
script = """cd $WORKSPACE/srcdir\n\nexport TMPDIR=${WORKSPACE}/tmpdir # we need a lot of tmp space\nmkdir -p ${TMPDIR}\n\nPTROPT=\"\"\n\n# Necessary operations to cross compile CUDA from x86_64 to aarch64\nif [[ \"${target}\" == aarch64-linux-* ]]; then\n\n   # Add /usr/lib/csl-musl-x86_64 to LD_LIBRARY_PATH to be able to use host nvcc\n   export LD_LIBRARY_PATH=\"/usr/lib/csl-musl-x86_64:/usr/lib/csl-glibc-x86_64:${LD_LIBRARY_PATH}\"\n   \n   # Make sure we use host CUDA executable by copying from the x86_64 CUDA redist\n   NVCC_DIR=(/workspace/srcdir/cuda_nvcc-*-archive)\n   rm -rf ${prefix}/cuda/bin\n   cp -r ${NVCC_DIR}/bin ${prefix}/cuda/bin\n\n   # From CUDA v13 on, nvvm is not distributed in the NVCC redist anymore\n   if [[ \"${bb_full_target}\" == *cuda+13* ]]; then\n      NVVM_DIR=(/workspace/srcdir/libnvvm-*-archive)\n   else\n      NVVM_DIR=${NVCC_DIR}\n   fi\n   rm -rf ${prefix}/cuda/nvvm/bin\n   cp -r ${NVVM_DIR}/nvvm/bin ${prefix}/cuda/nvvm/bin\n\n   # Workaround failed execution of sizeptr in cross-compile builds\n   PTROPT=\"PTRSIZE=8\"\nfi\n\nexport CUDADIR=${prefix}/cuda\nexport PATH=${PATH}:${CUDADIR}/bin\nexport CUDACXX=${CUDADIR}/bin/nvcc\n\n# This flag reduces the size of the compiled binaries; if\n# they become over 2GB (e.g. due to targeting too many\n# compute_XX), linking fails.\n# See: https://github.com/NixOS/nixpkgs/pull/220402\nexport NVCC_PREPEND_FLAGS+=' -Xfatbin=-compress-all'\n\ncd magma*\ncp ../make.inc .\n\n# Patch to _64_ suffixes\natomic_patch -p1 ../0001-mangle-to-ILP64.patch\n\nmake ${PTROPT} -j${nproc} sparse-shared\nmake ${PTROPT} install prefix=${prefix}\n\ninstall_license COPYRIGHT\n\n# ensure products directory is clean\nrm -rf ${CUDADIR}\n"""
version = "v2.10.0"

