script = """mkdir -p ${libdir}\ncd $WORKSPACE/srcdir/MUMPS*\n\nmakefile=\"Makefile.G95.PAR\"\ncp Make.inc/${makefile} Makefile.inc\n\n# Add `-fallow-argument-mismatch` if supported\n: >empty.f\nif gfortran -c -fallow-argument-mismatch empty.f >/dev/null 2>&1; then\n    FFLAGS=(\"-fallow-argument-mismatch\")\nfi\nrm -f empty.*\n\nif [[ \"${target}\" == *apple* ]]; then\n    SONAME=\"-install_name\"\nelse\n    SONAME=\"-soname\"\nfi\n\nif [[ \"${target}\" == *mingw* ]]; then\n  BLAS_LAPACK=\"-L${libdir} -lblastrampoline-5\"\nelse\n  BLAS_LAPACK=\"-L${libdir} -lblastrampoline\"\nfi\n\nif [[ \"${target}\" == *apple* ]] || [[ \"${target}\" == *freebsd* ]]; then\n    OMP=omp\nelif [[ \"${target}\" == *mingw* ]]; then\n    OMP=gomp-1\nelse\n    OMP=gomp\nfi\n\nMPILIBS=()\nif [[ ${bb_full_target} == *microsoftmpi* ]]; then\n    MPILIBS=(-lmsmpi)\nelif [[ ${bb_full_target} == *mpiabi* ]]; then\n    MPILIBS=(-lmpif -lmpi_abi)\nelif [[ ${bb_full_target} == *mpich* ]]; then\n    MPILIBS=(-lmpifort -lmpi)\nelif [[ ${bb_full_target} == *mpitrampoline* ]]; then\n    MPILIBS=(-lmpitrampoline)\nelif [[ ${bb_full_target} == *openmpi* ]]; then\n    MPILIBS=(-lmpi_usempif08 -lmpi_usempi_ignore_tkr -lmpi_mpifh -lmpi)\nfi\n\nEXTRA_LDFLAGS=()\nif [[ \"${target}\" == *x86_64-w64-mingw* ]]; then\n    # On mingw/x86_64, cross-DLL references to un-`dllimport`ed data symbols are\n    # resolved via mingw's 32-bit runtime pseudo-relocations. Under high-entropy\n    # ASLR two DLLs can map >2 GB apart, overflowing the 32-bit fixup and aborting\n    # at load: \"32 bit pseudo relocation ... out of range\". Disabling the runtime\n    # pseudo-relocs fixes the crash and keeps ASLR fully enabled. (The link would\n    # fail here if any such data import genuinely needed a runtime fixup.)\n    EXTRA_LDFLAGS+=(\"-Wl,--disable-runtime-pseudo-reloc\")\nfi\n\n# Override MPItrampoline's built-in compiler paths\nexport MPITRAMPOLINE_CC=cc\nexport MPITRAMPOLINE_CXX=c++\nexport MPITRAMPOLINE_FC=gfortran\n\nif [[ \"${target}\" == *mingw32* ]]; then\n    MPICC=gcc\n    MPIFC=gfortran\n    MPIFL=gfortran\nelse\n    MPICC=mpicc\n    MPIFC=mpifort\n    MPIFL=mpifort\nfi\n\nLSCOTCH=\"-L${libdir} -lesmumps -lscotch\"\nFSCOTCH=\"-Dscotch\"\n\n### PTSCOTCH ###\n# LSCOTCH=\"-lptesmumps -lptscotch -lptscotcherr\"\n# FSCOTCH=\"-Dptscotch\"\n\nmake_args+=(PLAT=\"par\" \\\n            OPTF=\"-O3 -fopenmp\" \\\n            OPTL=\"-O3 -l${OMP} ${EXTRA_LDFLAGS[*]}\" \\\n            OPTC=\"-O3 -fopenmp\" \\\n            CDEFS=-DAdd_ \\\n            LMETISDIR=\"${libdir}\" \\\n            IMETIS=\"-I${includedir}\" \\\n            LMETIS=\"-L${libdir} -lparmetis -lmetis\" \\\n            LSCOTCHDIR=${libdir} \\\n            ISCOTCH=\"-I${includedir}\" \\\n            LSCOTCH=\"${LSCOTCH}\" \\\n            ORDERINGSF=\"-Dmetis -Dpord -Dparmetis ${FSCOTCH}\" \\\n            LIBEXT_SHARED=\".${dlext}\" \\\n            SHARED_OPT=\"-shared\" \\\n            SONAME=\"${SONAME}\" \\\n            CC=\"${MPICC} ${CFLAGS[@]}\" \\\n            FC=\"${MPIFC} ${FFLAGS[@]}\" \\\n            FL=\"${MPIFL}\" \\\n            RANLIB=\"echo\" \\\n            LPORD=\"-L./PORD/lib -lpordpar\" \\\n            LIBBLAS=\"${BLAS_LAPACK}\" \\\n            LAPACK=\"${BLAS_LAPACK}\" \\\n            SCALAP=\"-L${libdir} -lscalapack32\" \\\n            INCPAR=\"-I${includedir}\" \\\n            LIBPAR=\"-L${libdir} -lscalapack32 ${BLAS_LAPACK} ${MPILIBS[*]}\")\n\nmake -j${nproc} allshared \"${make_args[@]}\"\n\ncp include/*.h ${includedir}\ncp lib/*.${dlext} ${libdir}\n"""
