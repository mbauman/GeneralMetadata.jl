name = "MUMPS_seq"
platforms = ["i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran5", "armv6l-linux-gnueabihf-libgfortran5", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran5", "riscv64-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran5", "armv6l-linux-musleabihf-libgfortran5", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran5", "aarch64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran5"]
script = """mkdir -p ${libdir}\ncd $WORKSPACE/srcdir/MUMPS*\n\nmakefile=\"Makefile.G95.SEQ\"\ncp Make.inc/${makefile} Makefile.inc\n\n# Add `-fallow-argument-mismatch` if supported\n: >empty.f\nFFLAGS=()\nif gfortran -c -fallow-argument-mismatch empty.f >/dev/null 2>&1; then\n    FFLAGS+=(\"-fallow-argument-mismatch\")\nfi\nrm -f empty.*\n\nif [[ \"${target}\" == *apple* ]]; then\n    SONAME=\"-install_name\"\nelse\n    SONAME=\"-soname\"\nfi\n\nif [[ \"${target}\" == *mingw* ]]; then\n  BLAS_LAPACK=\"-L${libdir} -lblastrampoline-5\"\nelse\n  BLAS_LAPACK=\"-L${libdir} -lblastrampoline\"\nfi\n\nmake_args+=(OPTF=\"-O3\"\n            OPTL=\"-O3\"\n            OPTC=\"-O3\"\n            CDEFS=-DAdd_\n            LMETISDIR=${libdir}\n            IMETIS=-I${includedir}\n            LMETIS=\"-L${libdir} -lmetis\"\n            ORDERINGSF=\"-Dpord -Dmetis\"\n            LIBEXT_SHARED=\".${dlext}\"\n            SHARED_OPT=\"-shared\"\n            SONAME=\"${SONAME}\"\n            CC=\"$CC ${CFLAGS[@]}\"\n            FC=\"gfortran ${FFLAGS[@]}\"\n            FL=\"gfortran\"\n            RANLIB=\"echo\"\n            LIBBLAS=\"${BLAS_LAPACK}\"\n            LAPACK=\"${BLAS_LAPACK}\")\n\nmake -j${nproc} allshared \"${make_args[@]}\"\n\nmkdir ${includedir}/libseq\ncp include/*.h ${includedir}\ncp libseq/*.h ${includedir}/libseq\ncp lib/*.${dlext} ${libdir}\n"""
version = "v500.900.100"

