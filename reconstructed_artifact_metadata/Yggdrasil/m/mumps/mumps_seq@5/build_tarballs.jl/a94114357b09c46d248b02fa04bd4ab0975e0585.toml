name = "MUMPS_seq"
platforms = ["i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran3", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "armv6l-linux-gnueabihf-libgfortran3", "armv6l-linux-gnueabihf-libgfortran4", "armv6l-linux-gnueabihf-libgfortran5", "armv7l-linux-gnueabihf-libgfortran3", "armv7l-linux-gnueabihf-libgfortran4", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran3", "powerpc64le-linux-gnu-libgfortran4", "powerpc64le-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran3", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran3", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran3", "aarch64-linux-musl-libgfortran5", "armv6l-linux-musleabihf-libgfortran3", "armv6l-linux-musleabihf-libgfortran4", "armv6l-linux-musleabihf-libgfortran5", "armv7l-linux-musleabihf-libgfortran3", "armv7l-linux-musleabihf-libgfortran4", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin-libgfortran3", "x86_64-apple-darwin-libgfortran4", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran3", "x86_64-unknown-freebsd-libgfortran4", "x86_64-unknown-freebsd-libgfortran5", "aarch64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran3", "i686-w64-mingw32-libgfortran4", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran3", "x86_64-w64-mingw32-libgfortran4", "x86_64-w64-mingw32-libgfortran5"]
script = """mkdir -p ${libdir}\ncd $WORKSPACE/srcdir/MUMPS*\n\nmakefile=\"Makefile.G95.SEQ\"\ncp Make.inc/${makefile} Makefile.inc\n\n# Add `-fallow-argument-mismatch` if supported\n: >empty.f\nFFLAGS=()\nif gfortran -c -fallow-argument-mismatch empty.f >/dev/null 2>&1; then\n    FFLAGS+=(\"-fallow-argument-mismatch\")\nfi\nrm -f empty.*\n\nif [[ \"${target}\" == *apple* ]]; then\n    SONAME=\"-install_name\"\nelse\n    SONAME=\"-soname\"\nfi\n\nif [[ \"${target}\" == *mingw* ]]; then\n  BLAS_LAPACK=\"-L${libdir} -lblastrampoline-5\"\nelse\n  BLAS_LAPACK=\"-L${libdir} -lblastrampoline\"\nfi\n\nmake_args+=(OPTF=\"-O3\"\n            OPTL=\"-O3\"\n            OPTC=\"-O3\"\n            CDEFS=-DAdd_\n            LMETISDIR=${libdir}\n            IMETIS=-I${includedir}\n            LMETIS=\"-L${libdir} -lmetis\"\n            ORDERINGSF=\"-Dpord -Dmetis\"\n            LIBEXT_SHARED=\".${dlext}\"\n            SHARED_OPT=\"-shared\"\n            SONAME=\"${SONAME}\"\n            CC=\"$CC ${CFLAGS[@]}\"\n            FC=\"gfortran ${FFLAGS[@]}\"\n            FL=\"gfortran\"\n            RANLIB=\"echo\"\n            LIBBLAS=\"${BLAS_LAPACK}\"\n            LAPACK=\"${BLAS_LAPACK}\")\n\nmake -j${nproc} allshared \"${make_args[@]}\"\n\nmkdir ${includedir}/libseq\ncp include/*.h ${includedir}\ncp libseq/*.h ${includedir}/libseq\ncp lib/*.${dlext} ${libdir}\n\n# 64-bit integer version of MUMPS\nmake clean\nfor sym in isamax idamax ilaenv slamch dlamch \\\n           saxpy scopy sgemm sgemv sgesvd slarfg sorgqr sormqr sscal sswap strsv strsm strtrs snrm2 \\\n           daxpy dcopy dgemm dgemv dgesvd dlarfg dorgqr dormqr dscal dswap dtrsv dtrsm dtrtrs dnrm2 \\\n           caxpy ccopy cgemm cgemv cgesvd clarfg cungqr cunmqr cscal cswap ctrsv ctrsm ctrtrs scnrm2 \\\n           zaxpy zcopy zgemm zgemv zgesvd zlarfg zungqr zunmqr zscal zswap ztrsv ztrsm ztrtrs dznrm2\ndo\n    FFLAGS+=(\"-D${sym}=${sym}_64\")\ndone\nFFLAG=\"${FFLAGS[@]}\"\nmake_args_64+=(PLAT=\"64\"\n               OPTF=\"-O3 -fdefault-integer-8 -ffixed-line-length-none\"\n               OPTL=\"-O3\"\n               OPTC=\"-O3 -DINTSIZE64\"\n               CDEFS=-DAdd_\n               LMETISDIR=\"${libdir}/metis/metis_Int64_Real32/lib\"\n               IMETIS=\"-I${libdir}/metis_Int64_Real32/include\"\n               LMETIS=\"-L${libdir}/metis/metis_Int64_Real32/lib -lmetis_Int64_Real32\"\n               ORDERINGSF=\"-Dpord -Dmetis\"\n               LIBEXT_SHARED=\".${dlext}\"\n               SHARED_OPT=\"-shared\"\n               SONAME=\"${SONAME}\"\n               CC=\"$CC ${CFLAGS[@]}\"\n               FC=\"gfortran $FFLAG\"\n               FL=\"gfortran\"\n               RANLIB=\"echo\"\n               LPORD=\"-L./PORD/lib -lpord64\"\n               LIBBLAS=\"${BLAS_LAPACK}\"\n               LAPACK=\"${BLAS_LAPACK}\")\n\nmake -j${nproc} allshared \"${make_args_64[@]}\"\ncp lib/*.${dlext} ${libdir}\n"""
version = "v500.800.100"

