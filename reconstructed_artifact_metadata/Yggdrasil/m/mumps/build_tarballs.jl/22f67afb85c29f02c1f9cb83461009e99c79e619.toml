platforms = ["i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran3", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "armv7l-linux-gnueabihf-libgfortran3", "armv7l-linux-gnueabihf-libgfortran4", "armv7l-linux-gnueabihf-libgfortran5", "i686-linux-musl-libgfortran3", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran3", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran3", "aarch64-linux-musl-libgfortran4", "aarch64-linux-musl-libgfortran5", "armv7l-linux-musleabihf-libgfortran3", "armv7l-linux-musleabihf-libgfortran4", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin14-libgfortran3", "x86_64-apple-darwin14-libgfortran4", "x86_64-apple-darwin14-libgfortran5", "x86_64-unknown-freebsd11.1-libgfortran3", "x86_64-unknown-freebsd11.1-libgfortran4", "x86_64-unknown-freebsd11.1-libgfortran5"]
script = """mkdir -p ${libdir}\ncd $WORKSPACE/srcdir/MUMPS_5.2.1\n\nOPENBLAS=(-lopenblas)\nif [[ ${nbits} == 64 ]] && [[ ${target} != aarch64* ]]; then\n  OPENBLAS=(-lopenblas64_)\nfi\n\nmakefile=\"Makefile.G95.PAR\"\ncp Make.inc/${makefile} Makefile.inc\n\nmake_args+=(OPTF=-O\n            CDEFS=-DAdd_\n            LMETISDIR=/workspace/destdir/lib\n            IMETIS=/workspace/destdir/include\n            LMETIS=\"-lparmetis -lmetis\"\n            ORDERINGSF=\"-Dpord -Dparmetis\"\n            CC=\"mpicc -fPIC\"\n            FC=\"mpif90 -fPIC\"\n            FL=\"mpif90 -fPIC\"\n            SCALAP=-lscalapack\n            INCPAR=  # Let MPI compilers fill in the blanks\n            LIBPAR=-lscalapack\n            LIBBLAS=${OPENBLAS})\n\nif [[ \"${target}\" == *-apple* ]]; then\n  make_args+=(RANLIB=echo)\nfi\n\n# NB: parallel build fails\nmake alllib \"${make_args[@]}\"\n\n# build shared libs\nall_load=\"--whole-archive\"\nnoall_load=\"--no-whole-archive\"\nextra=\"\"\nif [[ \"${target}\" == *-apple-* ]]; then\n    all_load=\"-all_load\"\n    noall_load=\"-noall_load\"\n    extra=\"-Wl,-undefined -Wl,dynamic_lookup -headerpad_max_install_names\"\nfi\n\ncd lib\nlibs=(-lparmetis -lmetis -lscalapack ${OPENBLAS})\nmpif90 -fPIC -shared -Wl,${all_load} libpord.a ${libs[@]} -Wl,${noall_load} ${extra[@]} -o libpord.${dlext}\ncp libpord.${dlext} ${libdir}\n\nlibs+=(-L${libdir} -lpord)\nmpif90 -fPIC -shared -Wl,${all_load} libmumps_common.a ${libs[@]} -Wl,${noall_load} ${extra[@]} -o libmumps_common.${dlext}\ncp libmumps_common.${dlext} ${libdir}\n\nlibs+=(-lmumps_common)\nfor libname in cmumps dmumps smumps zmumps\ndo\n  mpif90 -fPIC -shared -Wl,${all_load} lib${libname}.a ${libs[@]} -Wl,${noall_load} ${extra[@]} -o lib${libname}.${dlext}\ndone\ncp *.${dlext} ${libdir}\ncd ..\n\ncp include/* ${prefix}/include\n"""
version = "v5.2.1"

