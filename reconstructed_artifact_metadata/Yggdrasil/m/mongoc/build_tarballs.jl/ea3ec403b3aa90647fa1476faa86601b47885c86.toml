augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "MongoC"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\ncd mongo-c-driver\nsed -i \"s/Windows.h/windows.h/\" src/libmongoc/src/mongoc/mongoc-client.c\nsed -i \"s/WinDNS.h/windns.h/\" src/libmongoc/src/mongoc/mongoc-client.c\nsed -i \"s/Mstcpip.h/mstcpip.h/\" src/libmongoc/src/mongoc/mongoc-client.c\nsed -i \"s/Mstcpip.h/mstcpip.h/\" src/libmongoc/src/mongoc/mongoc-socket.c\nsed -i \"s/Dnsapi/dnsapi/\" build/cmake/ResSearch.cmake\nmkdir cmake-build\ncd cmake-build\n\nif [[ \"${nbits}\" == 32 ]]; then\n    export CFLAGS=\"-Wl,-rpath-link,/opt/${target}/${target}/lib\"\nelif [[ \"${target}\" != *-apple-* ]]; then\n    export CFLAGS=\"-Wl,-rpath-link,/opt/${target}/${target}/lib64\"\nfi\nif [[ \"${target}\" == *-mingw* ]]; then\n    export CFLAGS=\"$CFLAGS -D__USE_MINGW_ANSI_STDIO=1\"\nfi\n\ncmake \\\n    -DENABLE_AUTOMATIC_INIT_AND_CLEANUP=OFF \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DENABLE_SSL=OPENSSL \\\n    -DENABLE_SASL=OFF \\\n    -DENABLE_EXAMPLES=OFF \\\n    -DENABLE_TESTS=OFF \\\n    -DENABLE_UNINSTALL=OFF \\\n    -DENABLE_STATIC=OFF \\\n    -DENABLE_SNAPPY=ON \\\n    -DENABLE_MONGOC=ON \\\n    -DENABLE_BSON=ON \\\n    -DOPENSSL_ROOT_DIR=$prefix \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    ..\nmake -j${nproc}\nmake install\n\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    rm ${libdir}/libbson-1.0.0.dylib\n    rm ${libdir}/libmongoc-1.0.0.dylib\n    mv ${libdir}/libmongoc-1.0.0.0.0.dylib ${libdir}/libmongoc-1.0.0.dylib\n    mv ${libdir}/libbson-1.0.0.0.0.dylib ${libdir}/libbson-1.0.0.dylib\nfi\n"""
version = "v1.25.1"

