augment_platform_block = ""
init_block = ""
julia_compat = "1.7"
lazy_artifacts = false
name = "mlpack"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd ${WORKSPACE}/srcdir/mlpack-*/\n\n# On macOS, we need to compile with 10.14 as a target to work around\n# std::optional availability issues.\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    pushd ${WORKSPACE}/srcdir/MacOSX10.*.sdk\n    rm -rf /opt/${target}/${target}/sys-root/System\n    cp -ra usr/* \"/opt/${target}/${target}/sys-root/usr/.\"\n    cp -ra System \"/opt/${target}/${target}/sys-root/.\"\n    export MACOSX_DEPLOYMENT_TARGET=10.14\n    popd\nfi\n\nmkdir build && cd build\n\n# In order to convince mlpack to build Julia bindings, we have to use CMake\n# to specify the location of the Julia program.  But... it turns out that\n# all that CMake needs is some kind of executable program that prints the\n# version.  So we'll just create a crappy little script, since Julia may not\n# be available in the build environment.\necho \"#!/bin/bash\" > julia\necho \"echo \"Fake Julia version 1.9.4\"\" >> julia\nchmod +x julia\n\nFLAGS=(-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\n       -DCMAKE_CROSSCOMPILING=OFF\n       -DCMAKE_INSTALL_PREFIX=${prefix}\n       -DUSE_OPENMP=ON\n       -DBUILD_JULIA_BINDINGS=ON\n       -DBUILD_SHARED_LIBS=ON\n       -DJULIA_EXECUTABLE=\"${PWD}/julia\"\n       -DBUILD_CLI_EXECUTABLES=OFF\n       -DBUILD_GO_BINDINGS=OFF\n       -DBUILD_R_BINDINGS=OFF\n       -DBUILD_PYTHON_BINDINGS=OFF\n       -DBUILD_TESTS=OFF)\n\nif [[ \"${nbits}\" == 64 ]]; then\n    # We need to rename some functions for compatibility with Julia's OpenBLAS\n    SYMB_DEFS=()\n    for sym in cgbcon cgbsv cgbsvx cgbtrf cgbtrs cgecon cgees cgeev cgeevx cgehrd cgels cgelsd cgemm cgemv cgeqp3 cgeqrf cgesdd cgesv cgesvd cgesvx cgetrf cgetri cgetrs cgges cggev cgtsv cgtsvx cheev cheevd cherk clangb clange clanhe clansy cpbtrf cpocon cposv cposvx cpotrf cpotri cpotrs cpstrf ctrcon ctrsyl ctrtri ctrtrs cungqr dasum ddot dgbcon dgbsv dgbsvx dgbtrf dgbtrs dgecon dgees dgeev dgeevx dgehrd dgels dgelsd dgemm dgemv dgeqp3 dgeqrf dgesdd dgesv dgesvd dgesvx dgetrf dgetri dgetrs dgges dggev dgtsv dgtsvx dlahqr dlangb dlange dlansy dlarnv dnrm2 dorgqr dpbtrf dpocon dposv dposvx dpotrf dpotri dpotrs dpstrf dstedc dsyev dsyevd dsyrk dtrcon dtrevc dtrsyl dtrtri dtrtrs ilaenv sasum sdot sgbcon sgbsv sgbsvx sgbtrf sgbtrs sgecon sgees sgeev sgeevx sgehrd sgels sgelsd sgemm sgemv sgeqrf sgeqp3 sgesdd sgesv sgesvd sgesvx sgetrf sgetri sgetrs sgges sggev sgtsv sgtsvx slahqr slangb slange slansy slarnv snrm2 sorgqr spbtrf spocon sposv sposvx spotrf spotri spotrs spstrf sstedc ssyev ssyevd ssyrk strcon strevc strsyl strtri strtrs zgbcon zgbsv zgbsvx zgbtrf zgbtrs zgecon zgees zgeev zgeevx zgehrd zgels zgelsd zgemm zgemv zgeqp3 zgeqrf zgesdd zgesv zgesvd zgesvx zgetrf zgetri zgetrs zgges zggev zgtsv zgtsvx zheev zheevd zherk zlangb zlange zlanhe zlansy zpbtrf zpocon zposv zposvx zpotrf zpotri zpotrs zpstrf ztrcon ztrsyl ztrtri ztrtrs zungqr; do\n        SYMB_DEFS+=(\"-D${sym}=${sym}_64\")\n    done\n    export CXXFLAGS=\"${SYMB_DEFS[@]}\"\nfi\n\nif [[ $target == *powerpc* ]]; then\n    FLAGS+=(-DCMAKE_EXE_LINKER_FLAGS=\"-L/opt/${target}/${target}/lib${arch_ext}/ -lgomp -pthread -ldl\")\nfi\n\nif [[ $target == *apple* ]]; then\n    FLAGS+=(-DCMAKE_SYSTEM_NAME=\"Darwin\")\nelif [[ $target == *mingw* ]]; then\n    # We need to remove bigobj support, but we also need to force the linker\n    # to export all symbols because Windows DLLs have the concept of\n    # \"exported\" and \"not exported\" functions.\n    sed -i 's/-Wa,-mbig-obj/-Wl,--export-all-symbols/' ../CMakeLists.txt\n\n    # For Windows configuration, we need to manually specify the OpenBLAS\n    # libraries as CMake variables.\n    if [[ \"${nbits}\" == 64 ]]; then\n        arch_ext=\"64_\";\n    else\n        arch_ext=\"\";\n    fi\n    FLAGS+=(-DLAPACK_LIBRARY=${libdir}/libopenblas${arch_ext}.${dlext})\n    FLAGS+=(-DBLAS_LIBRARY=${libdir}/libopenblas${arch_ext}.${dlext})\nfi\n\nif [[ ${target} != *darwin* ]]; then\n    # Needed to find libgfortran for OpenBLAS.\n    export CXXFLAGS=\"-Wl,-rpath-link,/opt/${target}/${target}/lib -Wl,-rpath-link,/opt/${target}/${target}/lib64 ${CXXFLAGS}\"\nfi\n\n# Reduce number of cores used for builds on FreeBSD or ARM (they run out of\n# memory).\nif [[ $target == *freebsd* ]] || [[ $target == *arm* ]] || [[ $target == *mingw* ]]; then\n  nproc=1;\nfi\n\ncmake .. \"${FLAGS[@]}\"\nmake -j${nproc}\nmake install\n\nif [[ ${target} == *mingw* ]]; then\n    cp -v libmlpack_julia*.dll \"${libdir}\"\nelse\n    cp -v src/mlpack/bindings/julia/mlpack/src/*.${dlext} \"${libdir}\"\nfi\n\ninstall_license ../LICENSE.txt\n"""
version = "v4.5.0"

