julia_compat = "1.0"
lazy_artifacts = false
name = "mimalloc"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/mimalloc/\nif [[ \"${target}\" == i686-*-mingw* ]]; then\n    atomic_patch -p1 ../patches/mimalloc-redirect32.patch\nfi\nmkdir -p build && cd build\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DMI_BUILD_STATIC=OFF \\\n    -DMI_BUILD_OBJECT=OFF \\\n    -DMI_INSTALL_TOPLEVEL=ON \\\n    -DMI_BUILD_TESTS=OFF \\\n    ..\nmake -j ${nproc}\nmake -j ${nproc} install\n# Manually install the mimalloc-redirect lib for Windows\nif [[ \"${target}\" == i686-*-mingw* ]]; then\n    cp \"mimalloc-redirect32.${dlext}\" \"${libdir}/.\"\nelif [[ \"${target}\" == x86_64-*-mingw* ]]; then\n    cp \"mimalloc-redirect.${dlext}\" \"${libdir}/.\"\nfi\n"""
version = "v2.0.1"

