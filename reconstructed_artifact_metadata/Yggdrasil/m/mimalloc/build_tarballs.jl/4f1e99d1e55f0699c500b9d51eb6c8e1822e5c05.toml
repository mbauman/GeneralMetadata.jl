name = "mimalloc"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """if [[ \"${target}\" == *-linux-musl* ]]; then\n    # Musl doesn't support init-exec TLS\n    CMAKE_FLAGS=(-DMI_LOCAL_DYNAMIC_TLS=ON)\nfi\n\nCMAKE_FLAGS+=(-DMI_NO_OPT_ARCH=ON) # who doesn't love a double negative\nCMAKE_FLAGS+=(-DMI_WIN_REDIRECT=OFF) \n\ncd $WORKSPACE/srcdir/mimalloc\ncmake -B build -G Ninja \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DMI_BUILD_OBJECT=OFF \\\n    -DMI_INSTALL_TOPLEVEL=ON \\\n    -DMI_BUILD_TESTS=OFF \\\n    -DMI_OVERRIDE=OFF \\\n    \"${CMAKE_FLAGS[@]}\"\ncmake --build build --parallel ${nproc}\ncmake --install build\n"""
version = "v3.3.2"

