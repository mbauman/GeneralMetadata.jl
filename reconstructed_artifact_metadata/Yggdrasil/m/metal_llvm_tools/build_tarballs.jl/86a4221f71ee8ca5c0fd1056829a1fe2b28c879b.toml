augment_platform_block = """using Base.BinaryPlatforms\n\n    function augment_llvm!(platform::Platform)\n        haskey(platform, \"llvm_version\") && return platform\n\n        llvm_version = Base.libllvm_version\n        # does our LLVM build use assertions?\n        llvm_assertions = try\n            cglobal((:_ZN4llvm24DisableABIBreakingChecksE, Base.libllvm_path()), Cvoid)\n            false\n        catch\n            true\n        end\n        platform[\"llvm_version\"] = if llvm_assertions\n            \"$(llvm_version.major).asserts\"\n        else\n            \"$(llvm_version.major)\"\n        end\n        return platform\n    end\n\n\nfunction augment_platform!(platform::Platform)\n    augment_llvm!(platform)\nend"""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = true
name = "Metal_LLVM_Tools"
platforms = ["x86_64-apple-darwin-llvm_version+13", "aarch64-apple-darwin-llvm_version+13", "x86_64-apple-darwin-llvm_version+13.asserts", "aarch64-apple-darwin-llvm_version+13.asserts", "x86_64-apple-darwin-llvm_version+14", "aarch64-apple-darwin-llvm_version+14", "x86_64-apple-darwin-llvm_version+14.asserts", "aarch64-apple-darwin-llvm_version+14.asserts"]
script = """cd llvm-metal/llvm\nLLVM_SRCDIR=$(pwd)\n\ninstall_license LICENSE.TXT\n\n# The very first thing we need to do is to build llvm-tblgen for x86_64-linux-muslc\n# This is because LLVM's cross-compile setup is kind of borked, so we just\n# build the tools natively ourselves, directly.  :/\n\n# Build llvm-tblgen and llvm-config\nmkdir ${WORKSPACE}/bootstrap\npushd ${WORKSPACE}/bootstrap\nCMAKE_FLAGS=()\nCMAKE_FLAGS+=(-DLLVM_TARGETS_TO_BUILD:STRING=host)\nCMAKE_FLAGS+=(-DLLVM_HOST_TRIPLE=${MACHTYPE})\nCMAKE_FLAGS+=(-DCMAKE_BUILD_TYPE=Release)\nCMAKE_FLAGS+=(-DLLVM_ENABLE_PROJECTS='llvm')\nCMAKE_FLAGS+=(-DCMAKE_CROSSCOMPILING=False)\nCMAKE_FLAGS+=(-DCMAKE_TOOLCHAIN_FILE=${CMAKE_HOST_TOOLCHAIN})\ncmake -GNinja ${LLVM_SRCDIR} ${CMAKE_FLAGS[@]}\nninja -j${nproc} llvm-tblgen llvm-config\npopd\n\n# Let's do the actual build within the `build` subdirectory\nmkdir ${WORKSPACE}/build && cd ${WORKSPACE}/build\nCMAKE_FLAGS=()\n\n# Tell LLVM where our pre-built tblgen tools are\nCMAKE_FLAGS+=(-DLLVM_TABLEGEN=${WORKSPACE}/bootstrap/bin/llvm-tblgen)\nCMAKE_FLAGS+=(-DLLVM_CONFIG_PATH=${WORKSPACE}/bootstrap/bin/llvm-config)\n\n# Install things into $prefix\nCMAKE_FLAGS+=(-DCMAKE_INSTALL_PREFIX=${prefix})\n\n# Explicitly use our cmake toolchain file and tell CMake we're cross-compiling\nCMAKE_FLAGS+=(-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN})\nCMAKE_FLAGS+=(-DCMAKE_CROSSCOMPILING:BOOL=ON)\n\n# Release build for best performance\nCMAKE_FLAGS+=(-DCMAKE_BUILD_TYPE=Release)\n\n# Only build the Metal back-end\nCMAKE_FLAGS+=(-DLLVM_TARGETS_TO_BUILD=Metal)\n\n# Turn on ZLIB\nCMAKE_FLAGS+=(-DLLVM_ENABLE_ZLIB=ON)\n# Turn off XML2\nCMAKE_FLAGS+=(-DLLVM_ENABLE_LIBXML2=OFF)\n\n# Disable useless things like docs, terminfo, etc....\nCMAKE_FLAGS+=(-DLLVM_INCLUDE_DOCS=Off)\nCMAKE_FLAGS+=(-DLLVM_ENABLE_TERMINFO=Off)\nCMAKE_FLAGS+=(-DHAVE_HISTEDIT_H=Off)\nCMAKE_FLAGS+=(-DHAVE_LIBEDIT=Off)\n\ncmake -GNinja ${LLVM_SRCDIR} ${CMAKE_FLAGS[@]}\nninja -j${nproc} \\\n    tools/metallib-as/install \\\n    tools/metallib-dis/install\n"""
version = "v0.3.0"

