augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "MKL_Headers"
platforms = ["x86_64-linux-gnu", "i686-linux-gnu", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/mkl-include-$target\nif [[ $target == *-mingw* ]]; then\n    rsync -av Library/include/ ${includedir}\nelse\n    rsync -av include/ ${includedir}\nfi\ninstall_license info/licenses/*.txt\n\ncd $WORKSPACE/srcdir/mkl-devel-$target\nmkdir -p ${libdir}\nif [[ $target == *-mingw* ]]; then\n    # These toolchain files must still go inside the lib folder, not the ${libdir} folder\n    rsync -av Library/lib/ $WORKSPACE/destdir/lib\nelse\n    rsync -av lib/ ${libdir}\nfi\n"""
version = "v2024.0.0"

[[products]]
paths = ["include/mkl.h"]
type = "file"
variable_name = "include_mkl_h"

