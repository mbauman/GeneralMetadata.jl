name = "Mesa"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/mesa-*\n\napk add py3-mako py3-yaml py3-packaging\n\nMESA_FLAGS=(\n    -D b_ndebug=true\n    -D buildtype=release\n    -D strip=true\n    -D llvm=disabled\n    -D gallium-drivers=softpipe\n    -D vulkan-drivers=[]\n    -D gles1=disabled\n    -D gles2=disabled\n    -D shader-cache=disabled\n)\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    MESA_FLAGS+=(\n        -D platforms=windows\n        -D glx=disabled\n        -D egl=disabled\n        -D gbm=disabled\n    )\nelif [[ \"${target}\" == *-linux* ]] || [[ \"${target}\" == *-freebsd* ]]; then\n    MESA_FLAGS+=(\n        -D platforms=x11\n        -D glx=xlib\n        -D egl=disabled\n        -D gbm=disabled\n    )\nfi\n\nmeson setup build \"${MESA_FLAGS[@]}\" --cross-file=\"${MESON_TARGET_TOOLCHAIN}\"\nninja -C build -j${nproc}\nninja -C build install\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    mv ${prefix}/bin/opengl32.dll ${prefix}/bin/opengl32sw.dll\nfi\n\ninstall_license docs/license.rst\n"""
version = "v26.0.3"

