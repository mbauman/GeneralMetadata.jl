name = "mpif"
platforms = ["i686-linux-gnu-libgfortran5-mpi+mpiabi", "x86_64-linux-gnu-libgfortran5-mpi+mpiabi", "aarch64-linux-gnu-libgfortran5-mpi+mpiabi", "armv6l-linux-gnueabihf-libgfortran5-mpi+mpiabi", "armv7l-linux-gnueabihf-libgfortran5-mpi+mpiabi", "powerpc64le-linux-gnu-libgfortran5-mpi+mpiabi", "riscv64-linux-gnu-libgfortran5-mpi+mpiabi", "i686-linux-musl-libgfortran5-mpi+mpiabi", "x86_64-linux-musl-libgfortran5-mpi+mpiabi", "aarch64-linux-musl-libgfortran5-mpi+mpiabi", "armv6l-linux-musleabihf-libgfortran5-mpi+mpiabi", "armv7l-linux-musleabihf-libgfortran5-mpi+mpiabi", "x86_64-apple-darwin-libgfortran5-mpi+mpiabi", "aarch64-apple-darwin-libgfortran5-mpi+mpiabi", "x86_64-unknown-freebsd-libgfortran5-mpi+mpiabi", "aarch64-unknown-freebsd-libgfortran5-mpi+mpiabi"]
script = """cd ${WORKSPACE}/srcdir/mpif\ncmake_args=(\n    -DCMAKE_BUILD_TYPE=Release\n    -DCMAKE_INSTALL_PREFIX=${prefix}\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\n    -DBUILD_SHARED_LIBS=ON\n    -DMPI_HOME=${prefix}\n)\n# mpif's callback registry uses C11 atomics, and on AArch64 clang turns an\n# acq_rel compare-exchange into a call to __aarch64_cas4_acq_rel. That helper\n# is in compiler-rt's builtins or in libgcc >= 10, and neither is on the link\n# line: libmpif has Fortran sources, so CMake links it with gfortran, whose\n# libgcc here is GCC 9.1's. Inline the atomics instead -- they are cold.\n# https://github.com/eschnett/mpif/issues/5 -- drop this once mpif probes for it.\nif [[ \"${target}\" == aarch64-*freebsd* ]]; then\n    cmake_args+=(-DCMAKE_C_FLAGS=-mno-outline-atomics)\nfi\ncmake -Bbuild ${cmake_args[@]}\ncmake --build build --parallel ${nproc}\ncmake --install build\n"""
