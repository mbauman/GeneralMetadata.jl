platforms = ["x86_64-linux-gnu-libgfortran4-cxx03", "x86_64-linux-gnu-libgfortran5-cxx03", "x86_64-linux-gnu-libgfortran4-cxx11", "x86_64-linux-gnu-libgfortran5-cxx11", "x86_64-linux-musl-libgfortran4-cxx03", "x86_64-linux-musl-libgfortran5-cxx03", "x86_64-linux-musl-libgfortran4-cxx11", "x86_64-linux-musl-libgfortran5-cxx11", "x86_64-apple-darwin-libgfortran4", "x86_64-apple-darwin-libgfortran5", "x86_64-w64-mingw32-libgfortran4-cxx03", "x86_64-w64-mingw32-libgfortran5-cxx03", "x86_64-w64-mingw32-libgfortran4-cxx11", "x86_64-w64-mingw32-libgfortran5-cxx11"]
script = """cd $WORKSPACE/srcdir/maingo/\ngit remote set-url origin https://git.rwth-aachen.de/avt-svt/public/maingo.git\nmkdir build\ncd build\ngit submodule init\ngit submodule update -j 1\n\n\ncommon_cmake_options=\"-DCMAKE_BUILD_TYPE=Release \\\n                     -DMAiNGO_build_standalone=True \\\n                     -DMAiNGO_build_shared_c_api=True \\\n                     -DMAiNGO_build_parser=True \\\n                     -DMAiNGO_use_cplex=False \\\n                     -DMAiNGO_use_melon=False\"\n\n# GCC used because of https://github.com/JuliaPackaging/Yggdrasil/issues/7139\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    export MACOSX_DEPLOYMENT_TARGET=10.15\n    cmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n          -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN%.*}_gcc.cmake \\\n          ${common_cmake_options} \\\n          ..\nelse\n    cmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n          -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n          ${common_cmake_options} \\\n          ..\nfi\n\n\n\ncmake --build . --config Release --parallel ${nproc}\ninstall -Dvm 755 \"MAiNGO${exeext}\" \"${bindir}/MAiNGO${exeext}\"\ninstall -Dvm 755 \"MAiNGOcpp${exeext}\" \"${bindir}/MAiNGOcpp${exeext}\"\ninstall -Dvm 755 \"libmaingo-c-api.${dlext}\" \"${libdir}/libmaingo-c-api.${dlext}\"\ninstall_license ../LICENSE\n"""
version = "v0.7.2"

