julia_compat = "1.6"
lazy_artifacts = false
name = "MrBayes"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/MrBayes\ninstall_license ${WORKSPACE}/srcdir/MrBayes/COPYING\n\n## MPI VERSION\nif [[ \"$target\" == *-mingw* ]]; then\n    COMPILER=${target}-gcc\n    EXTRALIBS=\"-lm -lmsmpi -I${includedir} -L${libdir}\"\nelse\n    COMPILER=mpicc\n    EXTRALIBS=\"\"\nfi\n\nCC=$COMPILER \\\nLIBS=\"$EXTRALIBS\" \\\n./configure \\\n    --with-mpi \\\n    --prefix=$prefix \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --includedir=\"${includedir}\" \\\n    --libdir=\"${libdir}\"\n\nmake -j${nproc}\nmake install\ninstall -Dvm 755 $bindir/mb${exeext} $bindir/mb_MPI${exeext} \n\n## SEQUENTIAL VERSION\n./configure --prefix=$prefix --build=${MACHTYPE} --host=${target} --includedir=\"${includedir}\" --libdir=\"${libdir}\"\nmake -j${nproc}\nmake install\n"""
version = "v3.2.7"

