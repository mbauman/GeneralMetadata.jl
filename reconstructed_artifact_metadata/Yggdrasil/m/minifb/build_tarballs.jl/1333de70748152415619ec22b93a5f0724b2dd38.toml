julia_compat = "1.6"
lazy_artifacts = false
name = "MiniFB"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/minifb/\nsed -i -e 's/add_library(minifb STATIC/add_library(minifb SHARED/' \\\n    -e 's/-Wall/-I$ENV{includedir} -Wall/' \\\n    -e 's/Opengl32/opengl32/' \\\n    CMakeLists.txt\nsed -i -e 's?<gl/gl.h>?<GL/gl.h>?' src/gl/MiniFB_GL.c\nmkdir build && cd build\nif [[ \"$target}\" == *-musl* || \"${target}\" == *-freebsd* ]]; then\n    export CFLAGS=\"-I${includedir}\"\nfi\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DMINIFB_BUILD_EXAMPLES=OFF \\\n    -DMINIFB_AVOID_CPP_HEADERS=ON \\\n    ..\nmake -j${nproc}\ninstall -Dm 755 \"libminifb.${dlext}\" \"${libdir}/libminifb.${dlext}\"\ninstall_license ../LICENSE\n"""
version = "v0.2.1"

