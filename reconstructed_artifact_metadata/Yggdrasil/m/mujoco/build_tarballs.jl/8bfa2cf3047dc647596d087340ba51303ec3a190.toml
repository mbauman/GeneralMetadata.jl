augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "MuJoCo"
platforms = ["x86_64-linux-gnu", "aarch64-linux-gnu", "powerpc64le-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/mujoco\nif [[ \"${target}\" == *-mingw* ]]; then\n    atomic_patch -p1 ../patches/mingw.patch\nelif [[ \"${target}\" == *-apple-darwin* ]]; then\n    atomic_patch -p1 ../patches/macos.patch\nelse\n    atomic_patch -p1 ../patches/other.patch\nfi\nCPPFLAGS=\"-I${prefix}/include\"\nCXXFLAGS=\"-I${prefix}/include\"\ncmake \\\n  -DCMAKE_INSTALL_PREFIX=$prefix \\\n  -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DMUJOCO_BUILD_EXAMPLES=OFF \\\n  -DMUJOCO_BUILD_SIMULATE=OFF \\\n  -DMUJOCO_BUILD_TESTS=OFF \\\n  -DMUJOCO_TEST_PYTHON_UTIL=OFF \\\n  .\ncmake --build .\ncmake --install .\n"""
version = "v2.3.7"

