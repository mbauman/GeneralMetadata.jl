dependencies = []
lazy_artifacts = false
name = "zrl"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/zrl\nif [[ \"${target}\" == *-mingw* ]]; then\n    export CPP_DEFINES=\"-DIO_NOLOCK\"\nelse\n    export CPP_DEFINES=\"-DIO_UNLOCKED\"\nfi\nmake\nmkdir -p \"${bindir}\"\ncp zrle \"${bindir}/zrle${exeext}\"\ncp zrld \"${bindir}/zrld${exeext}\"\n"""
version = "v1.1.0"

[[products]]
binnames = ["zrle"]
type = "exe"
variable_name = "zrle"
[[products]]
binnames = ["zrld"]
type = "exe"
variable_name = "zrld"

