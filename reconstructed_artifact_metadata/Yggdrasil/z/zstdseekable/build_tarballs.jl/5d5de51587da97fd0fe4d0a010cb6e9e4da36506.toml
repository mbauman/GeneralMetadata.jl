name = "ZstdSeekable"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/zstd-*/contrib/seekable_format/\nFLAGS=(-O3 -g -fPIC -shared -DXXH_NAMESPACE=\"\" -L${libdir} -I${includedir} -I. -I../../lib/ -I../../lib/common/ -lzstd -lxxhash)\nSOURCES=(zstdseek_compress.c zstdseek_decompress.c)\nLIB=libzstd_seekable.${dlext}\n${CC} ${SOURCES[@]} -o ${LIB} ${FLAGS[@]}\ninstall -Dvm 644 zstd_seekable.h \"${includedir}/zstd_seekable.h\"  # might as well I guess?\ninstall -Dvm 755 ${LIB} \"${libdir}/${LIB}\"\ninstall_license ../../LICENSE\n"""
version = "v1.5.6"

