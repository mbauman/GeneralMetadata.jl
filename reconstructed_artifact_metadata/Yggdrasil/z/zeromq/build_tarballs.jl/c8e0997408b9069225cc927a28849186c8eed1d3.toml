dependencies = []
name = "ZeroMQ"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "arm-linux-gnueabihf-cxx03", "arm-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "arm-linux-musleabihf-cxx03", "arm-linux-musleabihf-cxx11", "x86_64-apple-darwin14-cxx03", "x86_64-apple-darwin14-cxx11", "x86_64-unknown-freebsd11.1-cxx03", "x86_64-unknown-freebsd11.1-cxx11", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """\ncd $WORKSPACE/srcdir/libzmq\nif [[ \"${target}\" == *-mingw* ]]; then\n    # Apply patch from\n    # https://github.com/msys2/MINGW-packages/blob/350ace4617661a4df7b9474c573b08325fa716c3/mingw-w64-zeromq/001-mingw-__except-fixes.patch\n    atomic_patch -p1 ../patches/001-mingw-__except-fixes.patch\nelif [[ \"${target}\" == *86*-linux-musl* ]]; then\n    pushd /opt/${target}/lib/gcc/${target}/*/include\n    # Fix bug in Musl C library, see\n    # https://github.com/JuliaPackaging/BinaryBuilder.jl/issues/387\n    atomic_patch -p0 $WORKSPACE/srcdir/patches/mm_malloc.patch\n    popd\nfi\nsh autogen.sh\n./configure --prefix=$prefix --host=${target} \\\n    --without-docs --disable-libunwind --disable-perf --disable-Werror \\\n    --disable-eventfd --without-gcov --disable-curve-keygen \\\n    CXXFLAGS=\"-g -O2 -fms-extensions\"\nmake -j${nproc}\nmake install\n"""
sources = [{"https://github.com/zeromq/libzmq.git" = "a84ffa12b2eb3569ced199660bac5ad128bff1f0"}, "./bundled"]
version = "v4.3.2"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libzmq"]
type = "lib"
variable_name = "libzmq"
