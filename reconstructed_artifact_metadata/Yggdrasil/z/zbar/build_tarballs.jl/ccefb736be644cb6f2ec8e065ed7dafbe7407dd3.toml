script = """cd $WORKSPACE/srcdir/zbar\nif [[ \"${target}\" != \"*mingw32*\" ]]; then\n    # install `autopoint`\n    apk update && apk add gettext-dev\nfi\ninstall_license COPYING LICENSE.md\nautoreconf -vfi\nupdate_configure_scripts\n./configure --with-x=disabled \\\n            --enable-pthread=yes \\\n            --enable-video=no \\\n            --with-jpeg=no \\\n            --with-imagemagick=yes \\\n            --with-python=no \\\n            --with-gtk=no \\\n            --with-qt=no \\\n            --prefix=${prefix} \\\n            --build=${MACHTYPE} \\\n            --host=${target}\nmake -j${nproc}\nmake install\n"""
