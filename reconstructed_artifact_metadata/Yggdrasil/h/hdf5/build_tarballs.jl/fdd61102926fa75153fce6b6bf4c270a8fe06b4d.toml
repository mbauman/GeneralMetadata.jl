dir_paths = []
dont_dlopen = false
libnames = ["libhdf5"]
type = "lib"
variable_name = "libhdf5"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libhdf5_hl"]
type = "lib"
variable_name = "libhdf5_hl"

