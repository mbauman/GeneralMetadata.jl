name = "HMMER"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/hmmer-*/\n\nexport CPPFLAGS=\"-I${includedir}\"\nupdate_configure_scripts\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} \\\n    --with-gsl --enable-threads --enable-sse\nmake -j${nproc}\nmake install\n\ncd easel && make install\nmv LICENSE LICENSE.easel\n\ninstall_license LICENSE.easel\ninstall_license ../LICENSE\n"""
