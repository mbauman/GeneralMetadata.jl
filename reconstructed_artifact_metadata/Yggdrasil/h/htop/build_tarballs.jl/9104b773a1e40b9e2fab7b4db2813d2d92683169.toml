dependencies = ["Ncurses_jll"]
name = "Htop"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/htop-*/\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\n"""
version = "v2.2.0"

[[products]]
binnames = ["htop"]
type = "exe"
variable_name = "htop"

