name = "htslib"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/htslib-*\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\n\n# Delete static library\nrm \"${prefix}/lib/libhts.a\"\n\n# On Windows, product files are renamed so that BB can find them.\nif [[ ${target} == *-mingw32 ]]; then\n    # Add .exe extension to executables.\n    for exefile in bgzip tabix htsfile; do\n        mv \"${bindir}/${exefile}\" \"${bindir}/${exefile}${exeext}\"\n    done\nfi\n"""
version = "v1.19.1"

