lazy_artifacts = false
name = "htslib"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/htslib-*\nexport CPPFLAGS=\"-I${prefix}/include\"\nexport CFLAGS=\"-I${prefix}/include\"\nexport LDFLAGS=-L${libdir}\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\n\n# On Windows, product files are renamed so that BB can find them.\nif [[ ${target} == *-mingw32 ]]; then\n    # Add .exe extension to executables.\n    for exefile in bgzip tabix htsfile; do\n        mv \"${bindir}/${exefile}\" \"${bindir}/${exefile}${exeext}\"\n    done\nfi\n"""
version = "v1.10.2"

