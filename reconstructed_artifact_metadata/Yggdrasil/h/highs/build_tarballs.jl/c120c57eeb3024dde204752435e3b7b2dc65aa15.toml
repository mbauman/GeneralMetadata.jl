augment_platform_block = ""
init_block = ""
julia_compat = "1.10"
lazy_artifacts = false
name = "HiGHS"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/HiGHS\n\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/fix-cli11.patch\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/fix-destroy.patch\n\n# Remove system CMake to use the jll version\napk del cmake\n\nrm -rf build\nmkdir build\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    LBT=blastrampoline-5\nelse\n    LBT=blastrampoline\nfi\n\ncmake -S . -B build \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DBUILD_TESTING=OFF \\\n    -DHIPO=ON \\\n    -DBUILD_SHARED_EXTRAS_LIB=OFF \\\n    -DBLA_VENDOR=blastrampoline \\\n    -DBLAS_LIBRARIES=\"${LBT}\"\n\nif [[ \"${target}\" == *-linux-* ]]; then\n    make -C build -j ${nproc}\nelse\n    if [[ \"${target}\" == *-mingw* ]]; then\n        cmake --build build --config Release\n    else\n        cmake --build build --config Release --parallel\n    fi\nfi\ncmake --install build\n\ninstall_license LICENSE.txt\n"""
version = "v1.15.1"

