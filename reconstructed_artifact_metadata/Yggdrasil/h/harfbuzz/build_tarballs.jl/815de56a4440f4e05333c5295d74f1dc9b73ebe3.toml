script = """cd $WORKSPACE/srcdir/harfbuzz-*/\nautoreconf -i -f\n./configure --prefix=$prefix --host=$target \\\n    --with-gobject=yes \\\n    --with-graphite2=yes \\\n    --with-glib=yes \\\n    --with-freetype=yes \\\n    --with-cairo=yes \\\n    --enable-gtk-doc-html=no\nmake -j${nproc}\nmake install\n"""
