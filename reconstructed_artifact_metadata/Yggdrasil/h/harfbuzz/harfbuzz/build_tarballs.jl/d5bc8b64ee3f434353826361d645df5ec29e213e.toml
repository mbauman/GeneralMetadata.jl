script = """cd $WORKSPACE/srcdir/harfbuzz-*/\nmkdir build && cd build\nmeson .. \\\n    --cross-file=\"${MESON_TARGET_TOOLCHAIN}\" \\\n    -Dcairo=enabled \\\n    -Dfreetype=enabled \\\n    -Dglib=enabled \\\n    -Dgobject=enabled \\\n    -Dgraphite=enabled \\\n    -Dintrospection=disabled \\\n    -Ddocs=disabled \\\n    -Dtests=disabled \\\n    -Dicu=auto \\\n    -Dicu_builtin=false \\\n    -Dcoretext=enabled\nninja -j${nproc}\nninja install\n"""
version = "v2.8.1"

