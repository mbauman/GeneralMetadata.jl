augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "HarfBuzz"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """ICU=false\ncd $WORKSPACE/srcdir/harfbuzz-*/\n\n# On MacOS, bypass broken check for CoreText\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    atomic_patch -p1 ../patches/coretext-check-bypass.patch\nfi\n\nmkdir build && cd build\nmeson .. \\\n    --cross-file=\"${MESON_TARGET_TOOLCHAIN}\" \\\n    --buildtype=release \\\n    -Dcairo=enabled \\\n    -Dfreetype=enabled \\\n    -Dglib=enabled \\\n    -Dgobject=enabled \\\n    -Dgraphite=enabled \\\n    -Dintrospection=disabled \\\n    -Ddocs=disabled \\\n    -Dtests=disabled \\\n    -Dicu=auto \\\n    -Dicu_builtin=false \\\n    -Dcoretext=enabled \\\n    -Dgdi=enabled \\\n    -Ddirectwrite=enabled\nninja -j${nproc}\nif [[ \"${ICU}\" == true ]]; then\n    # Manually install only ICU-related files\n    cp src/libharfbuzz-icu*${dlext}* ${libdir}/.\n    cp meson-private/harfbuzz-icu.pc ${prefix}/lib/pkgconfig/.\n    cp ../src/hb-icu.h ${includedir}/harfbuzz/.\nelse\n    ninja install\nfi\n"""
version = "v8.3.1"

