julia_compat = "1.6"
lazy_artifacts = false
name = "HarfBuzz_ICU"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """ICU=true\ncd $WORKSPACE/srcdir/harfbuzz-*/\n\n# On MacOS, bypass broken check for CoreText\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    atomic_patch -p1 ../patches/coretext-check-bypass.patch\nfi\n\n# We need C++20 for the `auto` in template parameters.\n# This is required when building the ICU bindings.\nmkdir build && cd build\nmeson .. \\\n    --cross-file=\"${MESON_TARGET_TOOLCHAIN}\" \\\n    --buildtype=release \\\n    -Dcpp_std=c++20 \\\n    -Dcairo=enabled \\\n    -Dfreetype=enabled \\\n    -Dglib=enabled \\\n    -Dgobject=enabled \\\n    -Dgraphite=enabled \\\n    -Dintrospection=disabled \\\n    -Ddocs=disabled \\\n    -Dtests=disabled \\\n    -Dicu=auto \\\n    -Dicu_builtin=false \\\n    -Dcoretext=enabled \\\n    -Dgdi=enabled \\\n    -Ddirectwrite=enabled\nninja -j${nproc}\nif [[ \"${ICU}\" == true ]]; then\n    # Remove directories with symbol files (they confuse the `cp` command below)\n    rm -rf src/libharfbuzz-icu*${dlext}*.p\n    # Manually install only ICU-related files\n    cp src/libharfbuzz-icu*${dlext}* ${libdir}/.\n    cp meson-private/harfbuzz-icu.pc ${prefix}/lib/pkgconfig/.\n    cp ../src/hb-icu.h ${includedir}/harfbuzz/.\nelse\n    ninja install\nfi\n"""
version = "v8.5.1"

