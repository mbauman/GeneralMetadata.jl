init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "HYPRE"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/hypre-*\ncd src/\n\nmkdir build\ncd build/\n\nCMAKE_FLAGS=()\n\n#help find mpi on mingw, subset of https://github.com/JuliaPackaging/Yggdrasil/blob/b4fdb545c3954cff218051d7520c7418991d3416/T/TauDEM/build_tarballs.jl#L28-L53\nif [[ \"$target\" == x86_64-w64-mingw32 ]]; then\n    CMAKE_FLAGS+=(\n        -DMPI_HOME=${prefix}\n        -DMPI_GUESS_LIBRARY_NAME=MSMPI\n    )\n    if [[ \"${target}\" == x86_64-* ]]; then\n        for lang in C CXX; do\n            CMAKE_FLAGS+=(-DMPI_${lang}_LIBRARIES=msmpi64)\n        done\n    fi\nfi\n\ncmake .. \\\n-DCMAKE_INSTALL_PREFIX=$prefix \\\n-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n-DCMAKE_BUILD_TYPE=Release \\\n-DHYPRE_ENABLE_SHARED=ON \\\n-DHYPRE_ENABLE_HYPRE_BLAS=ON \\\n-DHYPRE_ENABLE_HYPRE_LAPACK=ON \\\n-DHYPRE_ENABLE_CUDA_STREAMS=OFF \\\n-DHYPRE_ENABLE_CUSPARSE=OFF \\\n-DHYPRE_ENABLE_CURAND=OFF \\\n\"${CMAKE_FLAGS[@]}\"\n\nmake -j${nproc}\nmake install\n\n"""
version = "v2.23.0"

