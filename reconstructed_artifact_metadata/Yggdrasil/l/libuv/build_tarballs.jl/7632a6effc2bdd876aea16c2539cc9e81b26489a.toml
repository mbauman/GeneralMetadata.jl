julia_compat = "1.6"
lazy_artifacts = false
name = "LibUV"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/libuv/\n\n# Touch some files so that the build system doesn't attempt to re-run `autoconf`:\ntouch -c aclocal.m4\ntouch -c Makefile.in\ntouch -c configure\n\n# `--with-pic` isn't enough; we really really need -fPIC and -DPIC everywhere...\n# everywhere, especially on FreeBSD\n./configure --prefix=$prefix --host=$target --with-pic CFLAGS=\"${CFLAGS} -DPIC -fPIC\" CXXFLAGS=\"${CXXFLAGS} -DPIC -fPIC\"\nmake -j${nproc} V=1\nmake install\n"""
version = "v2.0.1"

