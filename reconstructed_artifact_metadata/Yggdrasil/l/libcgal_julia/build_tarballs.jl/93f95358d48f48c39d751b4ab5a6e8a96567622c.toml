dependencies = ["CGAL_jll", "libcxxwrap_julia_jll"]
name = "libcgal_julia"
platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11", "x86_64-apple-darwin14-cxx03", "x86_64-apple-darwin14-cxx11"]
script = """## pre-build setup\n# exit on error\nset -eu\n\n# HACK: download julia..\ncurl -Lo julia.tar.gz https://github.com/JuliaPackaging/JuliaBuilder/releases/download/v1.0.0-2/julia-1.0.0-$target.tar.gz\nmkdir julia && tar xf julia.tar.gz -C julia\nJulia_PREFIX=\"$PWD/julia\"\n\n## configure build\nmkdir -p build && cd build\n\ncmake ../libcgal-julia*/ \\\n  `# cmake specific` \\\n  -DCMAKE_TOOLCHAIN_FILE=\"$CMAKE_TARGET_TOOLCHAIN\" \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DCMAKE_CXX_FLAGS=\"-march=x86-64\" \\\n  -DCMAKE_FIND_ROOT_PATH=\"$prefix\" \\\n  -DCMAKE_INSTALL_PREFIX=\"$prefix\" \\\n  `# tell libcxxwrap-julia where julia is` \\\n  -DJulia_PREFIX=\"$Julia_PREFIX\"\n\n## and away we go..\nVERBOSE=ON cmake --build . --config Release --target install -- -j$nproc\n\ninstall_license ../libcgal-julia*/LICENSE\n\n# HACK: Apparently, this isn't a simple build system anymore..\ncase $target in\n  *mingw32*) mv \"$prefix/lib/\"*.dll \"$prefix/bin\" ;;\nesac\n"""
version = "v0.4.0"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libcgal_julia"]
type = "lib"
variable_name = "libcgal_julia"

