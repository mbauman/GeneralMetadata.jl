init_block = ""
lazy_artifacts = false
name = "libcgal_julia"
platforms = ["x86_64-unknown-freebsd11.1-cxx11", "aarch64-linux-gnu-cxx11", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "x86_64-apple-darwin14-cxx11", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """## pre-build setup\n# exit on error\nset -eu\n\nmacosflags=\ncase $target in\n  *apple-darwin*)\n    macosflags=\"-DCMAKE_CXX_COMPILER_ID=AppleClang\"\n    macosflags=\"$macosflags -DCMAKE_CXX_COMPILER_VERSION=10.0.0\"\n    macosflags=\"$macosflags -DCMAKE_CXX_STANDARD_COMPUTED_DEFAULT=11\"\n    ;;\nesac\n## configure build\ncmake . -B /tmp/build \\\n  `# cmake specific` \\\n  -DCMAKE_TOOLCHAIN_FILE=$CMAKE_TARGET_TOOLCHAIN \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DCMAKE_FIND_ROOT_PATH=$prefix \\\n  -DCMAKE_INSTALL_PREFIX=$prefix \\\n  $macosflags \\\n  `# tell jlcxx where julia is` \\\n  -DJulia_PREFIX=$prefix\n\n## and away we go..\nVERBOSE=ON cmake --build /tmp/build --config Release --target install -- -j$nproc\ninstall_license ./LICENSE\n"""
version = "v0.14.0"

[[dependencies]]
name = "Julia_jll"
type = "builddependency"
version-major = 1
version-minor = 4
version-patch = 1
[[dependencies]]
name = "CGAL_jll"
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0
[[dependencies]]
name = "libcxxwrap_julia_jll"
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["libcgal_julia_exact"]
type = "lib"
variable_name = "libcgal_julia_exact"
[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["libcgal_julia_inexact"]
type = "lib"
variable_name = "libcgal_julia_inexact"

[[sources]]
path = "/home/runner/src/github/rgcv/libcgal-julia"
target = ""
type = "directory"
