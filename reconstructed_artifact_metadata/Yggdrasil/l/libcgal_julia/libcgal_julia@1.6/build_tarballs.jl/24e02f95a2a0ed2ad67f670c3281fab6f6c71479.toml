init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "libcgal_julia"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """## pre-build setup\n# exit on error\nset -eu\n\nmacosflags=\ncase $target in\n  *apple-darwin*)\n    macosflags=\"-DCMAKE_CXX_COMPILER_ID=AppleClang\"\n    macosflags=\"$macosflags -DCMAKE_CXX_COMPILER_VERSION=10.0.0\"\n    macosflags=\"$macosflags -DCMAKE_CXX_STANDARD_COMPUTED_DEFAULT=11\"\n    ;;\nesac\n## configure build\ncmake libcgal-julia \\\n  -B /tmp/build \\\n  `# cmake specific` \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DCMAKE_FIND_ROOT_PATH=$prefix \\\n  -DCMAKE_INSTALL_PREFIX=$prefix \\\n  -DCMAKE_TOOLCHAIN_FILE=$CMAKE_TARGET_TOOLCHAIN \\\n  `# tell jlcxx where julia is` \\\n  -DJulia_PREFIX=$prefix \\\n  $macosflags\n\n## and away we go..\nVERBOSE=ON cmake --build /tmp/build --config Release --target install -- -j$nproc\ninstall_license libcgal-julia/LICENSE\n"""
version = "v0.17.6"

