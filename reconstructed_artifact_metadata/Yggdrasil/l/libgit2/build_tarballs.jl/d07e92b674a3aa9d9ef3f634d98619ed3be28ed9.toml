init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "LibGit2"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/libgit2*/\n\natomic_patch -p1 $WORKSPACE/srcdir/patches/libgit2-agent-nonfatal.patch\natomic_patch -p1 $WORKSPACE/srcdir/patches/libgit2-hostkey.patch\n\nBUILD_FLAGS=(\n    -DCMAKE_BUILD_TYPE=Release\n    -DTHREADSAFE=ON\n    -DUSE_BUNDLED_ZLIB=ON\n    \"-DCMAKE_INSTALL_PREFIX=${prefix}\"\n    \"-DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\"\"\n)\n\n# Special windows flags\nif [[ ${target} == *-mingw* ]]; then\n    BUILD_FLAGS+=(-DWIN32=ON -DMINGW=ON -DBUILD_CLAR=OFF)\n    if [[ ${target} == i686-* ]]; then\n        BUILD_FLAGS+=(-DCMAKE_C_FLAGS=\"-mincoming-stack-boundary=2\")\n    fi\n\n    # For some reason, CMake fails to find libssh2 using pkg-config.\n    BUILD_FLAGS+=(-Dssh2_RESOLVED=${bindir}/libssh2.dll)\nelif [[ ${target} == *linux* ]] || [[ ${target} == *freebsd* ]]; then\n    # If we're on Linux or FreeBSD, explicitly ask for mbedTLS instead of OpenSSL\n    BUILD_FLAGS+=(-DUSE_HTTPS=mbedTLS -DSHA1_BACKEND=CollisionDetection -DCMAKE_INSTALL_RPATH=\"\\$ORIGIN\")\nfi\nexport CFLAGS=\"-I${prefix}/include\"\n\nmkdir build && cd build\n\ncmake .. \"${BUILD_FLAGS[@]}\"\nmake -j${nproc}\nmake install\n"""
version = "v1.2.1"

[[dependencies]]
name = "MbedTLS_jll"
type = "dependency"
version-major = 2
version-minor = 24
version-patch = 0
[[dependencies]]
name = "LibSSH2_jll"
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0

