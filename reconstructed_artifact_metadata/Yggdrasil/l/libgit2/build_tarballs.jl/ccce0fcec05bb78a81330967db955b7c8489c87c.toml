dependencies = ["MbedTLS_jll", "LibSSH2_jll", "LibCURL_jll"]
name = "LibGit2"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libgit2*/\n\natomic_patch -p1 $WORKSPACE/srcdir/patches/libgit2-agent-nonfatal.patch\n\nBUILD_FLAGS=(\n    -DCMAKE_BUILD_TYPE=Release\n    -DTHREADSAFE=ON\n    -DUSE_BUNDLED_ZLIB=ON\n    \"-DCMAKE_INSTALL_PREFIX=${prefix}\"\n    \"-DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\"\"\n)\n\n# Special windows flags\nif [[ ${target} == *-mingw* ]]; then\n    BUILD_FLAGS+=(-DWIN32=ON -DMINGW=ON -DBUILD_CLAR=OFF)\n    if [[ ${target} == i686-* ]]; then\n        BUILD_FLAGS+=(-DCMAKE_C_FLAGS=\"-mincoming-stack-boundary=2\")\n    fi\nelif [[ ${target} == *linux* ]] || [[ ${target} == *freebsd* ]]; then\n    # If we're on Linux or FreeBSD, explicitly ask for mbedTLS instead of OpenSSL\n    BUILD_FLAGS+=(-DUSE_HTTPS=mbedTLS -DSHA1_BACKEND=CollisionDetection -DCMAKE_INSTALL_RPATH=\"\\$ORIGIN\")\nfi\n\nmkdir build && cd build\n\ncmake .. \"${BUILD_FLAGS[@]}\"\nmake -j${nproc}\nmake install\n"""
sources = [{"https://github.com/libgit2/libgit2.git" = "b3e1a56ebb2b9291e82dc027ba9cbcfc3ead54d3"}, "./bundled"]
version = "v0.28.2"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libgit2"]
type = "lib"
variable_name = "libgit2"
