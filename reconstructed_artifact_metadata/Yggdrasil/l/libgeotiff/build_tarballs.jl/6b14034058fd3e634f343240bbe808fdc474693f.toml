init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "libgeotiff"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """\ncd $WORKSPACE/srcdir/libgeotiff-*/\n\n# Who knows why they want to install Windows binaries not build with MSVC to\n# ${prefix} instead of ${prefix}/bin\natomic_patch -p1 ../patches/more-reasonable-default-bin-subdir.patch\n\nmkdir build && cd build\n\n# Hint to find libstc++, required to link against C++ libs when using C compiler\nif [[ \"${target}\" == *-linux-* ]]; then\n    if [[ \"${nbits}\" == 32 ]]; then\n        export CFLAGS=\"-Wl,-rpath-link,/opt/${target}/${target}/lib\"\n    else\n        export CFLAGS=\"-Wl,-rpath-link,/opt/${target}/${target}/lib64\"\n    fi\nfi\n\ncmake -DCMAKE_INSTALL_PREFIX=$prefix \\\n      -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DBUILD_SHARED_LIBS=ON \\\n      ..\n\nmake -j${nproc}\nmake install\n"""
version = "v1.6.0"

