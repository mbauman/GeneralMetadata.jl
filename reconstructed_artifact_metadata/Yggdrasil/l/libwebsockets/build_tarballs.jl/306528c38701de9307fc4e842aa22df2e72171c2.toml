augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "libwebsockets"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/libwebsockets\nexport PKG_CONFIG_ALL_STATIC=1\nEXTRA_SHARED_LDFLAGS=\"\"\nif [[ \"${target}\" == *linux* ]]; then\n    EXTRA_SHARED_LDFLAGS=\"${LDFLAGS} -pthread -ldl -lrt\"\nelif [[ \"${target}\" == *apple-darwin* ]]; then\n    EXTRA_SHARED_LDFLAGS=\"${LDFLAGS}\"\nfi\nexport CMAKE_SHARED_LINKER_FLAGS=\"${EXTRA_SHARED_LDFLAGS}\"\ncmake -B build \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DGENCERTS=OFF \\\n    -DCMAKE_C_FLAGS=\"${CFLAGS} -Duv_poll_init_socket=uv_poll_init\" \\\n    -DZLIB_LIBRARY=${libdir}/libz.${dlext} \\\n    -DZLIB_INCLUDE_DIR=${includedir} \\\n    -DLWS_WITH_ACCESS_LOG=ON \\\n    -DLWS_WITHOUT_EXTENSIONS=OFF \\\n    -DLWS_WITHOUT_TESTAPPS=ON \\\n    -DLWS_WITH_LIBUV=ON \\\n    -DLWS_WITH_EVENT_LIBS=ON \\\n    -DLWS_WITH_EVLIB_PLUGINS=OFF \\\n    -DLWS_WITH_SHARED=ON \\\n    -DLWS_WITH_STATIC=OFF \\\n    -DLWS_WITH_SSL=ON \\\n    -DLWS_WITH_ZLIB=ON \\\n    -DLWS_STATIC_PIC=ON \\\n    -DLWS_WITH_MINIMAL_EXAMPLES=OFF \\\n    -DLWS_LINK_TESTAPPS_DYNAMIC=OFF \\\n    -DCMAKE_FIND_LIBRARY_SUFFIXES=\".a\" \\\n    -DUV_LIBRARY=${libdir}/libuv.a \\\n    -DUV_INCLUDE_DIR=${includedir} \\\n    -DLIBUV_LIBRARIES=${libdir}/libuv.a \\\n    -DLIBUV_INCLUDE_DIRS=${includedir} \\\n    -DLWS_IPV6=ON \\\n    -DLWS_WITH_HTTP2=ON \\\n    -DLWS_WITH_SOCKS5=ON\ncmake --build build --parallel ${nproc}\ncmake --install build\n"""
version = "v4.4.0"

