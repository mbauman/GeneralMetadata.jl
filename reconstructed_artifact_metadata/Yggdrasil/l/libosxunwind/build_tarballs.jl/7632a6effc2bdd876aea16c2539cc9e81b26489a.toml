julia_compat = "1.6"
lazy_artifacts = false
name = "LibOSXUnwind"
platforms = ["x86_64-apple-darwin", "aarch64-apple-darwin"]
script = """cd $WORKSPACE/srcdir/libosxunwind*/\n\nEXTRA_CFLAGS=\"-ggdb3 -O2\"\n\nFLAGS=(\n    CC=\"$CC\"\n    CXX=\"$CXX\"\n    CFLAGS=\"${CFLAGS} -ggdb3 -O2\"\n    CXXFLAGS=\"${CXXFLAGS} -ggdb3 -O2\"\n    PREFIX=\"${prefix}\"\n)\n\n# When all you have is a hammer...\nmake -j${nproc} \"${FLAGS[@]}\"\n\n# Manual installation as the osxunwind `Makefile` doesn't even know how to do this\nmkdir -p ${libdir}\ncp libosxunwind.dylib ${libdir}/\ncp libosxunwind.a ${libdir}/\ncp -aR include ${prefix}/\n"""
version = "v0.0.6"

