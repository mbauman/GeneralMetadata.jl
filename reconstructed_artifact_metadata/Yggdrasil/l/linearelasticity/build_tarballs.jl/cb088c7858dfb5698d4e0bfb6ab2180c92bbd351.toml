lazy_artifacts = false
name = "LinearElasticity"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/Commons\nif [[ \"${target}\" == *mingw* ]]; then\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/Commons.mingw.patch\"\nelif [[ \"${target}\" == *freebsd* ]]; then\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/Commons.freebsd.patch\"\nelse\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/Commons.patch\"\nfi\nmkdir build\ncd build\ncmake .. \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_SHARED_LIBS=ON\nmake -j${nproc}\nmake install\n\ncd ${WORKSPACE}/srcdir/LinearElasticity\nif [[ \"${target}\" == *mingw* ]]; then\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/LinearElasticity.mingw.patch\"\nelse\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/LinearElasticity.patch\"\nfi\nmkdir build\ncd build\ncmake .. \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_C_STANDARD_LIBRARIES=\"${LDFLAGS}\" \\\n    -DBUILD_SHARED_LIBS=ON\nmake -j${nproc}\nmake install\ninstall_license ../LICENSE.md\n"""
version = "v5.0.0"

