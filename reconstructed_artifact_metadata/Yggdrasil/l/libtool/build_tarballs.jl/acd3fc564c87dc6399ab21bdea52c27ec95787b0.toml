augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Libtool"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/libtool-*\nfor patch in ${WORKSPACE}/srcdir/patches/*.patch; do\n    atomic_patch -p1 ${patch}\ndone\n# Prevent `help2man` needing to be run because we patched `libtoolize`\ntouch doc/libtoolize.1\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} SHELL=/bin/bash\nmake\nmake install\n"""
version = "v2.5.4"

[[products]]
paths = ["bin/libtool"]
type = "file"
variable_name = "libtool"
[[products]]
paths = ["bin/libtoolize"]
type = "file"
variable_name = "libtoolize"
[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["libltdl"]
type = "lib"
variable_name = "libltdl"

