name = "libportaudio"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/portaudio\n\n# move the ASIO SDK to where CMake can find it\nif [ -d \"asiosdk2.3.1\" ]; then\n    mv \"asiosdk2.3.1 svnrev312937/ASIOSDK2.3.1\" asiosdk2.3.1\nfi\n\n# apply the patch\natomic_patch -p1 ../patches/win_ds_fix_warning.patch\natomic_patch -p1 ../patches/wasapi-32-bit-windows.patch\n\n# First, build libportaudio\nmkdir build-bb\ncd build-bb\ncmake -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n    -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON \\\n    -DCMAKE_FIND_ROOT_PATH=$prefix \\\n    ..\nmake\nmake install\ninstall_license \"../LICENSE.txt\"\n"""
version = "v19.7.0"

