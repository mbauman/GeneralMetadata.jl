name = "Libcroco"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libcroco-*/\n\nFLAGS=()\nif [[ \"${target}\" == *-apple-* ]]; then\n    # We purposefully use an old binutils, so we must disable -Bsymbolic\n    FLAGS+=(--disable-Bsymbolic)\nfi\n\n./configure --prefix=$prefix --host=$target --disable-gtk-doc \"${FLAGS[@]}\"\nmake -j${nproc}\nmake install\n"""
version = "v0.6.13"

