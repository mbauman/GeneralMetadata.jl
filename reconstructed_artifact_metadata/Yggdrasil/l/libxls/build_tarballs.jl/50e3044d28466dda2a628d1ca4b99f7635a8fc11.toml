dependencies = []
name = "libxls"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libxls-*/\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} \\\n    ac_cv_func_malloc_0_nonnull=yes \\\n    ac_cv_func_realloc_0_nonnull=yes \nmake -j${nproc}\nmake install\n"""
version = "v1.5.2"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libxlsreader"]
type = "lib"
variable_name = "libxlsreader"

[[sources]]
"https://github.com/libxls/libxls/releases/download/v1.5.2/libxls-1.5.2.tar.gz" = "8d7e52d96ccc6c498e5de78c1988d9838d914eeeb94ac60208378340bd6e6aaa"
