augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "libcbor"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/libcbor*\noptions=(\n    -DCMAKE_BUILD_TYPE=Release\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\n    -DCMAKE_PREFIX_PATH=${prefix}\n    -DCMAKE_INSTALL_PREFIX=${prefix}\n    -DCMAKE_INSTALL_LIBDIR=${libdir}\n    -DCMAKE_INSTALL_INCLUDEDIR=${includedir}\n    -DBUILD_SHARED_LIBS=ON\n    -DWITH_EXAMPLES=OFF\n)\n\n# Disable LTO on macOS. It gives an error about trying to use an LLVM 18 file with an LLVM 8 linker:\n# 'Invalid value (Producer: 'LLVM18.1.7' Reader: 'LLVM 8.0.0svn')', using libLTO version 'LLVM version 8.0.0svn' file 'CMakeFiles/cbor.dir/cbor.c.o'\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    options+=(-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF)\nfi\n\nmkdir build\ncd build\ncmake -S .. -B . ${options[@]}\n\nmake -j${nproc}\nmake -j${nproc} install\n"""
version = "v0.12.0"

