lazy_artifacts = false
name = "LLVM"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin14-cxx03", "x86_64-apple-darwin14-cxx11", "x86_64-unknown-freebsd11.1-cxx03", "x86_64-unknown-freebsd11.1-cxx11", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """# First, find (true) LLVM library directory in ~/.artifacts somewhere\nLLVM_ARTIFACT_DIR=$(dirname $(dirname $(realpath ${prefix}/tools/opt${exeext})))\n\n# Clear out our `${prefix}`\nrm -rf ${prefix}/*\n\n# Copy over everything, but eliminate things already put inside `Clang_jll` or `libLLVM_jll`:\nmv -v ${LLVM_ARTIFACT_DIR}/* ${prefix}/\nrm -vrf ${prefix}/include/{clang*,llvm*}\nrm -vrf ${prefix}/tools/{clang*,llvm-config}\nrm -vrf ${libdir}/libclang*.${dlext}*\nrm -vrf ${libdir}/*LLVM*.${dlext}*\nrm -vrf ${prefix}/lib/*LLVM*.a\nrm -vrf ${prefix}/lib/libclang*.a\n"""
sources = []
version = "v9.0.1"

[[dependencies]]
name = "LLVM_full_jll"
type = "builddependency"
uuid = "a3ccf953-465e-511d-b87f-60a6490c289d"
version-major = 9
version-minor = 0
version-patch = 1
[[dependencies]]
name = "libLLVM_jll"
type = "dependency"
uuid = "8f36deef-c2a5-5394-99ed-8e07531fb29a"
version-major = 9
version-minor = 0
version-patch = 1

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = true
libnames = ["LTO", "libLTO"]
type = "lib"
variable_name = "liblto"
[[products]]
binnames = ["opt"]
dir_path = "tools"
type = "exe"
variable_name = "opt"
[[products]]
binnames = ["llc"]
dir_path = "tools"
type = "exe"
variable_name = "llc"
