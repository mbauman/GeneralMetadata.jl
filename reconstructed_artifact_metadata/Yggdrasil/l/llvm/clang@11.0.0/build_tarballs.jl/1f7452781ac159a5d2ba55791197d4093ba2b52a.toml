version-patch = 0
[[dependencies]]
name = "libLLVM_jll"
type = "dependency"
uuid = "8f36deef-c2a5-5394-99ed-8e07531fb29a"
version-major = 11
version-minor = 0
version-patch = 0

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = true
libnames = ["libclang"]
type = "lib"
variable_name = "libclang"
[[products]]
binnames = ["clang"]
dir_path = "tools"
type = "exe"
variable_name = "clang"
