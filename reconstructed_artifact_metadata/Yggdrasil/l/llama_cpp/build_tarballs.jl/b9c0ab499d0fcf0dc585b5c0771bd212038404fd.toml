augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "llama_cpp"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """macos_sdk_version=10.15\nmacosx_deployment_target=10.15\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    # extract the tarball into the sys-root so all compilers pick it up\n    # automatically, and use --warning=no-unknown-keyword to hide harmless\n    # warnings about unsupported pax header keywords like \"SCHILY.fflags\"\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        --warning=no-unknown-keyword \\\n        MacOSX${macos_sdk_version}.sdk/System \\\n        MacOSX${macos_sdk_version}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd $WORKSPACE/srcdir/llama.cpp*\n\n# remove compiler flags forbidden in BinaryBuilder\nsed -i -e 's/-funsafe-math-optimizations//g' CMakeLists.txt\n\n# Fix missing errno include in gguf.cpp (b7813 CI failure on macOS)\nsed -i '1i#include <cerrno>' ggml/src/gguf.cpp\n# Guard Windows thread power throttling API usage for mingw/older SDKs\nsed -i -e 's/#if _WIN32_WINNT >= 0x0602/#if _WIN32_WINNT >= 0x0602 \\&\\& defined(THREAD_POWER_THROTTLING_CURRENT_VERSION)/' ggml/src/ggml-cpu/ggml-cpu.c\n# Avoid forcing -march on riscv64 (BinaryBuilder disallows explicit -march)\nsed -i -e 's/list(APPEND ARCH_FLAGS \"-march=${MARCH_STR}\" -mabi=lp64d)/list(APPEND ARCH_FLAGS -mabi=lp64d)/' ggml/src/ggml-cpu/CMakeLists.txt\nsed -i -e 's/list(APPEND ARCH_FLAGS -march=rv64gc_v -mabi=lp64d)/list(APPEND ARCH_FLAGS -mabi=lp64d)/' ggml/src/ggml-cpu/CMakeLists.txt\n\nEXTRA_CMAKE_ARGS=()\nif [[ \"${target}\" == *-linux-* ]]; then\n    # otherwise we have undefined reference to `clock_gettime' when\n    # linking the `main' example program\n    EXTRA_CMAKE_ARGS+=(-DCMAKE_EXE_LINKER_FLAGS=\"-lrt\")\nfi\n\n# Disable Metal on Intel Apple platforms\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    EXTRA_CMAKE_ARGS+=(-DGGML_METAL=OFF)\nfi\n\n# Enable Metal on Apple Silicon\nif [[ \"${target}\" == aarch64-apple-darwin* ]]; then\n    EXTRA_CMAKE_ARGS+=(-DGGML_METAL=ON)\nfi\n\ncmake -Bbuild -GNinja \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=RELEASE \\\n    -DCMAKE_SKIP_RPATH=ON \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DLLAMA_BUILD_TESTS=OFF \\\n    -DLLAMA_BUILD_EXAMPLES=ON \\\n    -DLLAMA_NATIVE=OFF \\\n    -DLLAMA_ACCELERATE=ON \\\n    -DLLAMA_AVX=ON \\\n    -DLLAMA_AVX2=ON \\\n    -DLLAMA_F16C=ON \\\n    -DLLAMA_FMA=ON \\\n    -DLLAMA_BLAS=OFF \\\n    -DLLAMA_CUBLAS=OFF \\\n    -DLLAMA_CLBLAST=OFF \\\n    \"${EXTRA_CMAKE_ARGS[@]}\"\ncmake --build build\ncmake --install build\ninstall_license LICENSE\n"""
version = "v0.0.19"

