name = "llama_cpp"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """if [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    # Install a newer SDK which supports `std::filesystem`\n    pushd ${WORKSPACE}/srcdir/MacOSX10.*.sdk\n    rm -rf /opt/${target}/${target}/sys-root/System\n    cp -a usr/* \"/opt/${target}/${target}/sys-root/usr/\"\n    cp -a System \"/opt/${target}/${target}/sys-root/\"\n    popd\nfi\n\ncd $WORKSPACE/srcdir/llama.cpp*\n\n# remove compiler flags forbidden in BinaryBuilder\nsed -i -e 's/-funsafe-math-optimizations//g' CMakeLists.txt\n\nEXTRA_CMAKE_ARGS=()\nif [[ \"${target}\" == *-linux-* ]]; then\n    # otherwise we have undefined reference to `clock_gettime' when\n    # linking the `main' example program\n    EXTRA_CMAKE_ARGS+=(-DCMAKE_EXE_LINKER_FLAGS=\"-lrt\")\nfi\n\n# Disable Metal on Intel Apple platforms\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    EXTRA_CMAKE_ARGS+=(-DGGML_METAL=OFF)\nfi\n\ncmake -Bbuild -GNinja \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=RELEASE \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DLLAMA_BUILD_TESTS=OFF \\\n    -DLLAMA_BUILD_EXAMPLES=ON \\\n    -DLLAMA_NATIVE=OFF \\\n    -DLLAMA_ACCELERATE=ON \\\n    -DLLAMA_AVX=ON \\\n    -DLLAMA_AVX2=ON \\\n    -DLLAMA_F16C=ON \\\n    -DLLAMA_FMA=ON \\\n    -DLLAMA_BLAS=OFF \\\n    -DLLAMA_CUBLAS=OFF \\\n    -DLLAMA_CLBLAST=OFF \\\n    \"${EXTRA_CMAKE_ARGS[@]}\"\ncmake --build build\ncmake --install build\ninstall_license LICENSE\n"""
version = "v0.0.17"

