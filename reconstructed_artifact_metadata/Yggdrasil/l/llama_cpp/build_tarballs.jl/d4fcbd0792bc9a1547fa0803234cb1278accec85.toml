augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "llama_cpp"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/llama.cpp*\n\n# remove compiler flags forbidden in BinaryBuilder\nsed -i -e 's/-funsafe-math-optimizations//g' CMakeLists.txt\n\nEXTRA_CMAKE_ARGS=\nif [[ \"${target}\" == *-linux-* ]]; then\n    # otherwise we have undefined reference to `clock_gettime' when\n    # linking the `main' example program\n    EXTRA_CMAKE_ARGS='-DCMAKE_EXE_LINKER_FLAGS=\"-lrt\"'\nfi\n\n# compilation errors using k_quants on armv{6,7}l-linux-*\nif [[ \"${proc_family}\" == \"arm\" && \"${nbits}\" == 32 ]]; then\n    EXTRA_CMAKE_ARGS=\"$EXTRA_CMAKE_ARGS -DLLAMA_K_QUANTS=OFF\"\nelse\n    EXTRA_CMAKE_ARGS=\"$EXTRA_CMAKE_ARGS -DLLAMA_K_QUANTS=ON\"\nfi\n\n# Use Metal on Apple Silicon\nif [[ \"${target}\" == aarch64-apple-darwin* ]]; then\n    EXTRA_CMAKE_ARGS=\"$EXTRA_CMAKE_ARGS -DLLAMA_METAL=ON\"\nfi\n\nmkdir build && cd build\n\ncmake .. \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=RELEASE \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DLLAMA_BUILD_TESTS=OFF \\\n    -DLLAMA_BUILD_EXAMPLES=ON \\\n    -DLLAMA_NATIVE=OFF \\\n    -DLLAMA_ACCELERATE=ON \\\n    -DLLAMA_AVX=ON \\\n    -DLLAMA_AVX2=ON \\\n    -DLLAMA_F16C=ON \\\n    -DLLAMA_FMA=ON \\\n    -DLLAMA_BLAS=OFF \\\n    -DLLAMA_CUBLAS=OFF \\\n    -DLLAMA_CLBLAST=OFF \\\n    $EXTRA_CMAKE_ARGS\nmake -j${nproc}\n\nmake install\n\n# install header files\nfor hdr in ../*.h; do\n    install -Dvm 644 \"${hdr}\" \"${includedir}/$(basename \"${hdr}\")\"\ndone\n\ninstall_license ../LICENSE\n"""
version = "v0.0.13"

