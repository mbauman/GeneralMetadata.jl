dependencies = []
name = "libusb"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\ncd libusb/\n./bootstrap.sh \n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --disable-udev\nmake -j${nproc}\nmake install\ninstall_license COPYING\n"""
version = "v1.0.23"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libusb", "libusb-1", "libusb-1.0"]
type = "lib"
variable_name = "libusb"

[[sources]]
"https://github.com/libusb/libusb.git" = "e782eeb2514266f6738e242cdcb18e3ae1ed06fa"
