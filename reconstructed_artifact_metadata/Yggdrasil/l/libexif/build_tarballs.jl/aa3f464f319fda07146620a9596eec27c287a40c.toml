dependencies = []
name = "libexif"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libexif-*/\nif [[ \"${target}\" == powerpc64le-* ]] || [[ \"${target}\" == *-freebsd* ]]; then\n    # Install `autopoint` and other tools needed by `autoreconf`\n    apk add gettext-dev\n    # Rebuild the configure script to convince it to build the shared library\n    autoreconf -vi\nfi\nupdate_configure_scripts\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\n"""
version = "v0.6.21"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libexif"]
type = "lib"
variable_name = "libexif"

