augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "libyuv"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libyuv\ncmake -B build \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\ncmake --build build --parallel ${nproc}\n\nif [[ ${target} == *-w64-* ]]; then\n    # The install process on Windows is broken; it doesn't know about the `.exe` suffix\n    install -Dvm 755 build/yuvconvert.exe ${bindir}\n    install -Dvm 755 build/libyuv.dll ${libdir}\n    install -Dvm 755 build/libyuv.dll.a ${prefix}/lib\n    install -Dvm 644 include/libyuv.h ${includedir}\n    for file in $(cd include/libyuv && ls *.h); do\n        install -Dvm 644 include/libyuv/${file} ${includedir}/libyuv/${file}\n    done\nelse\n    cmake --install build\n    # Remove the static library (we don't need it)\n    rm ${libdir}/libyuv.a\nfi\n"""
version = "v0.1.0"

