julia_compat = "1.6"
lazy_artifacts = false
name = "libaom"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd ${WORKSPACE}/srcdir/libaom-*\n\nCMAKE_FLAGS=()\nif [[ ${target} = arm-* ]]; then\n    # Not even GCC 13 can compile for 32-bit ARM\n    CMAKE_FLAGS+=(-DAOM_TARGET_CPU=generic)\nelif [[ ${target} = aarch64-*-freebsd* ]]; then\n    # Runtime CPU detection doesn't work\n    CMAKE_FLAGS+=(-DCONFIG_RUNTIME_CPU_DETECT=0)\nfi\n\ncmake -B build-dir -G Ninja \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DENABLE_TESTS=OFF \\\n    ${CMAKE_FLAGS[@]}\ncmake --build build-dir --parallel ${nproc}\ncmake --install build-dir\n"""
version = "v3.14.1"

