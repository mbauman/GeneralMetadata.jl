init_block = ""
julia_compat = "^1.5"
lazy_artifacts = false
name = "LCIO_Julia_Wrapper"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "x86_64-apple-darwin"]
script = """cd ${WORKSPACE}/srcdir/LCIO_Julia_Wrapper/\nmkdir build && cd build\ncmake -DJulia_PREFIX=${prefix} -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_FIND_ROOT_PATH=${libdir}/cmake -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release ..\nmake -j${nproc}\nmake install\ninstall_license $WORKSPACE/srcdir/LCIO_Julia_Wrapper/LICENSE\n"""
version = "v0.13.1"

