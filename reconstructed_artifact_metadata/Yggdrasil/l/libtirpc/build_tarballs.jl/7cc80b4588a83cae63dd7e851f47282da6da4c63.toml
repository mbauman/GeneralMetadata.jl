name = "libtirpc"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/libtirpc-*/\n\ninstall_license COPYING\n\n#musl does not have this header, so we manually carry it around, queue.h file contents taken from https://github.com/dbmail/dbmail/blob/master/compatibility/queue.h\nif [[ ${target} == *-musl* ]]; then\n    mkdir sys\n    cp $WORKSPACE/srcdir/queue.h $WORKSPACE/srcdir/libtirpc-*/sys/\nfi\n\n./configure \\\n--prefix=${prefix} \\\n--build=${MACHTYPE} \\\n--host=${target} \\\n--enable-static=no \\\n--enable-shared=yes \\\n--disable-gssapi\n\nmake -j${nproc}\nmake install\n\n"""
version = "v1.3.7"

