name = "Libiconv"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """VERSION=1.17\ncd $WORKSPACE/srcdir/libiconv-*/\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --enable-static --enable-extra-encodings\nmake -j${nproc}\nmake install\n\n# Add pkg-config file\nmkdir -p \"${prefix}/lib/pkgconfig\"\ncat << EOF > \"${prefix}/lib/pkgconfig/iconv.pc\"\nprefix=${prefix}\nexec_prefix=\\${prefix}\nlibdir=\\${exec_prefix}/$(basename ${libdir})\nsharedlibdir=\\${libdir}\nincludedir=\\${includedir}\n\nName: iconv\nDescription: libiconv\nURL: https://www.gnu.org/software/libiconv/\nVersion: ${VERSION}\n\nRequires:\nLibs: -L\\${libdir} -liconv\nCflags: -I\\${includedir}\nEOF\n"""
version = "v1.17.0"

