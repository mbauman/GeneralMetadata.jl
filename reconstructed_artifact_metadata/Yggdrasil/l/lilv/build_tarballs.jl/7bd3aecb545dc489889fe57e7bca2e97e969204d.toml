name = "Lilv"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/lilv-*\ninstall_license COPYING\n# On FreeBSD the meson-built JLLs (Zix, Serd, lv2, Sord, ...) ship their pkg-config\n# files in libdata/pkgconfig, which is not on the default search path.\nexport PKG_CONFIG_PATH=\"${PKG_CONFIG_PATH:+${PKG_CONFIG_PATH}:}${prefix}/libdata/pkgconfig\"\nmeson setup build --cross-file=\"${MESON_TARGET_TOOLCHAIN}\" --buildtype=release \\\n    -Ddefault_library=shared \\\n    -Dbindings_cpp=disabled -Dbindings_py=disabled -Ddocs=disabled \\\n    -Ddynmanifest=disabled -Dtests=disabled -Dtools=auto\nmeson compile -C build -j${nproc}\nmeson install -C build\n"""
