augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "LLVMLibcxx"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "powerpc64le-linux-gnu"]
script = """cd $WORKSPACE/srcdir/llvm-project/runtimes\n\nexport CXXFLAGS=-pthread\ncmake -B build \\\n    -DCMAKE_INSTALL_PREFIX=${prefix}/libcxx \\\n    -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DLLVM_ENABLE_RUNTIMES='libcxx;libcxxabi' \\\n    -DLIBCXX_INCLUDE_BENCHMARKS=OFF \\\n    -DLIBCXX_HAS_ATOMIC_LIB=NO \\\n    -DLIBCXX_USE_COMPILER_RT=ON \\\n    -DLIBCXX_ENABLE_SHARED=ON \\\n    -DLIBCXX_ENABLE_STATIC=ON \\\n    -DLIBCXX_ENABLE_STATIC_ABI_LIBRARY=ON \\\n    -DLIBCXX_INSTALL_MODULES=ON \\\n    -DLIBCXXABI_USE_COMPILER_RT=ON \\\n    -DLIBCXXABI_USE_LLVM_UNWINDER=OFF\n\ncmake --build build --parallel ${nproc}\ncmake --install build\n\ninstall_license ../LICENSE.TXT\n"""
version = "v18.1.7"

