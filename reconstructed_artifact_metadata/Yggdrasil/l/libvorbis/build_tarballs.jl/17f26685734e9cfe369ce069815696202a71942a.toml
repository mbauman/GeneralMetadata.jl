lazy_artifacts = false
name = "libvorbis"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libvorbis-*\n\n# Patch in explicit dependency on `stdint.h` to fix libogg\n# This will be fixed in a future libogg release:\n# https://github.com/xiph/ogg/commit/c8fca6b4a02d695b1ceea39b330d4406001c03ed\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/stdint.patch\"\n\n# Force `./configure` to repent from using `-ffast-math`\nsed -ie 's/-ffast-math//g' ./configure\n\n./configure --prefix=$prefix --host=$target --build=${MACHTYPE}\nmake -j${nproc}\nmake install\n"""
version = "v1.3.6"

