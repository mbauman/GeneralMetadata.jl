init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "libfreenect"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libfreenect/\natomic_patch -p1 ../patches/libusb_header.patch\nmkdir build && cd build/\nFLAGS=()\nif [[ \"${target}\" == *-mingw* ]]; then\n    # Give a hint about where to find pthread library\n    FLAGS+=(-DTHREADS_PTHREADS_WIN32_LIBRARY=\"/opt/${target}/${target}/sys-root/bin/libwinpthread-1.dll\")\nfi\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_CPP=OFF \\\n    -DBUILD_EXAMPLES=OFF \\\n    -DBUILD_FAKENECT=OFF \\\n    -DBUILD_REDIST_PACKAGE=OFF \\\n    \"${FLAGS[@]}\" \\\n    ..\nmake -j${nproc}\nmake install\ninstall_license ../APACHE20 ../GPL2\n"""
version = "v0.6.1"

