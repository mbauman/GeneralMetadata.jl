init_block = ""
lazy_artifacts = false
name = "librdkafka"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\ncd librdkafka*\nif [[ \"${target}\" != *-freebsd* ]]; then\nrm -f /opt/${target}/${target}/sys-root/usr/lib/libcrypto.*\nrm -f /opt/${target}/${target}/sys-root/usr/lib/libssl.*\nrm -f /opt/${target}/${target}/sys-root/usr/lib/libsasl2.*\nfi\nmkdir build\ncd build/\ncmake -DCMAKE_INSTALL_PREFIX=$prefix -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release -DRDKAFKA_BUILD_EXAMPLES=OFF -DRDKAFKA_BUILD_TESTS=OFF ..\nmake -j${nproc}\nmake install\n"""
version = "v1.5.0"

