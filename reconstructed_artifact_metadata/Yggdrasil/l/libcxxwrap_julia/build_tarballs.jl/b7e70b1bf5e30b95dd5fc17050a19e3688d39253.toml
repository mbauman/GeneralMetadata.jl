lazy_artifacts = false
name = "libcxxwrap_julia"
platforms = ["x86_64-unknown-freebsd11.1-cxx11", "armv7l-linux-gnueabihf-cxx11", "aarch64-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "i686-linux-gnu-cxx11", "x86_64-apple-darwin14-cxx11", "x86_64-w64-mingw32-cxx11", "i686-w64-mingw32-cxx11"]
script = """mkdir build\ncd build\ncmake -DJulia_PREFIX=$prefix -DCMAKE_INSTALL_PREFIX=$prefix -DCMAKE_FIND_ROOT_PATH=$prefix -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release ../libcxxwrap-julia/\nVERBOSE=ON cmake --build . --config Release --target install -- -j${nproc}\ninstall_license $WORKSPACE/srcdir/libcxxwrap-julia*/LICENSE.md\n"""
version = "v0.8.0"

[[dependencies]]
name = "Julia_jll"
type = "builddependency"
version-major = 1
version-minor = 4
version-patch = 1

[[products]]
dir_paths = []
dlopen_flags = ["RTLD_GLOBAL"]
dont_dlopen = false
libnames = ["libcxxwrap_julia"]
type = "lib"
variable_name = "libcxxwrap_julia"
[[products]]
dir_paths = []
dlopen_flags = ["RTLD_GLOBAL"]
dont_dlopen = false
libnames = ["libcxxwrap_julia_stl"]
type = "lib"
variable_name = "libcxxwrap_julia_stl"

