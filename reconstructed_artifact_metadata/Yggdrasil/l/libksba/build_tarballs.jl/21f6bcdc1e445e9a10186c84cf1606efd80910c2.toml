name = "Libksba"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libksba-*/\nif [[ \"${target}\" == x86_64-*-mingw* ]]; then\n    # `gpgrt-config` for this platform returns garbage results.  We replace it with\n    # a simple wrapper around `pkg-config`, so that we can easily build the shared library.\n    FLAGS=(GPG_ERROR_CONFIG=\"../gpgrt-config.sh\" ac_cv_path_GPGRT_CONFIG=\"../gpgrt-config.sh\")\nfi\nexport CPPFLAGS=\"-I${includedir}\"\n./configure --prefix=${prefix} --host=${target} --build=${MACHTYPE} \"${FLAGS[@]}\"\nmake -j${nproc}\nmake install\ninstall_license COPYING*\n"""
version = "v1.5.1"

