augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "libjlnode"
platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "x86_64-apple-darwin", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir\nif [[ $target == *w64* ]]\nthen\n    cd ${target}/*-dist\nmkdir -p ${bindir}\nmv lib/*.dll ${bindir}/\nmv lib ${prefix}/\ncd ../../jlnode-*\ninstall_license ./LICENSE.md\n\nelif [[ $target == *apple* ]]\nthen\n    cd ${target}/*-dist\nmv lib/* ${prefix}/lib/\ncd ../../jlnode-*\ninstall_license ./LICENSE.md\n\nelif [[ $target == *linux* ]]\nthen\n    cd node-addon-api-*\nexport NAPI_INC=`pwd`\n\ncd ../jlnode-*\nmkdir build\ncd build\ncmake .. -G\"Unix Makefiles\" \\\n    -DCMAKE_BUILD_TYPE=\"Release\" \\\n    -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=\"`pwd`/Release\" \\\n    -DCMAKE_JS_INC=\"${prefix}/include/node\" \\\n    -DNAPI_INC=\"$NAPI_INC\" \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\ncmake --build .\ncmake --install .\ninstall_license ../LICENSE.md\n\nfi\n"""
version = "v18.0.0"

