augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "LMDB"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/openldap\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/fix-lmdb-1.0-platform-builds.patch\ncd libraries/liblmdb\n\nmake_args=(CC=${CC} SOEXT=.${dlext})\nif [[ \"${target}\" == *-apple-* ]]; then\n    make_args+=(LDL= VERSION_OPT=\"-Wl,-install_name,@rpath/liblmdb.${dlext} -Wl,-current_version,1.0\")\nelif [[ \"${target}\" == *-mingw* ]]; then\n    make_args+=(LDL= VERSION_OPT=)\nelif [[ \"${target}\" == *-freebsd* ]]; then\n    make_args+=(LDL=)\nfi\n\nmake \"${make_args[@]}\" -j${nproc}\nmake \"${make_args[@]}\" ILIBS=liblmdb.${dlext} prefix=${prefix} install\nif [[ \"${target}\" == *-mingw* ]]; then\n    rm -f \"${libdir}/liblmdb.${dlext}\" \"${libdir}/liblmdb.${dlext}.1\"\n    cp \"liblmdb.${dlext}.1.0\" \"${libdir}/liblmdb.${dlext}\"\n    rm -f \"${libdir}/liblmdb.${dlext}.1.0\"\n    rm -f \"${prefix}/lib/liblmdb.${dlext}\" \"${prefix}/lib/liblmdb.${dlext}.1\" \"${prefix}/lib/liblmdb.${dlext}.1.0\"\nfi\nrm -rf ${prefix}/share\nif [ -n \"${exeext}\" ]; then\n    for f in ${bindir}/mdb_*; do\n        mv \"${f}\" \"${f}${exeext}\"\n    done\nfi\ninstall_license LICENSE\n"""
version = "v1.0.0"

