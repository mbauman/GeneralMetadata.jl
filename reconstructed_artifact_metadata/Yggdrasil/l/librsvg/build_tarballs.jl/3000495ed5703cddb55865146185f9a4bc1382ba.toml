augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Librsvg"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/librsvg-*/\n\nautoreconf -fiv\n\n# Delete misleading libtool files\nrm -vf ${prefix}/lib/*.la\n\n# On most platforms we have to use `${rust_target}` as `host`\nFLAGS=(--host=${rust_target})\nif [[ \"${target}\" == *-mingw* ]]; then\n    # On Windows using `${rust_target}` wouldn't work:\n    #\n    #     Invalid configuration `x86_64-pc-windows-gnu': Kernel `windows' not known to work with OS `gnu'.\n    #\n    # Then we have to use `RUST_TARGET` to set the Rust target.  I haven't found\n    # a combination host and RUST_TARGET that would work on all platforms.  If\n    # you do, let me know!\n    FLAGS=(--host=${target} RUST_TARGET=\"${rust_target}\" LIBS=\"-luserenv -lbcrypt\")\nfi\n\n./configure \\\n    --build=${MACHTYPE} \\\n    --prefix=${prefix} \\\n    --disable-static \\\n    --enable-pixbuf-loader \\\n    --disable-introspection \\\n    --disable-gtk-doc-html \\\n    --enable-shared \\\n    \"${FLAGS[@]}\"\nmake\nmake install\ninstall_license COPYING.LIB\n"""
version = "v2.54.5"

