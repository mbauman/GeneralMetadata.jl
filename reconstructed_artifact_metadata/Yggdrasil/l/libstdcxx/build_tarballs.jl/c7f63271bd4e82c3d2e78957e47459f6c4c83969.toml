julia_compat = "1.6"
lazy_artifacts = false
name = "LibStdCxx"
platforms = ["x86_64-linux-gnu-sanitize+memory"]
products = []
script = """if [[ ${bb_full_target} == *-sanitize* ]]; then\n    cp -rL $prefix/lib/linux/* /opt/x86_64-linux-musl/lib/clang/13.0.1/lib/linux/\nfi\natomic_patch -p0 $WORKSPACE/srcdir/patches/gcc-11-libstdcxx-sanitizers.patch\natomic_patch -p1 -d gcc-*/ $WORKSPACE/srcdir/patches/gcc-11-clang-bug-inline.patch\n\nmkdir -p $WORKSPACE/srcdir/gcc_build\ncd $WORKSPACE/srcdir/gcc_build\n\n$WORKSPACE/srcdir/gcc-*/libstdc++-v3/configure \\\n--prefix=\"${prefix}\" \\\n--target=\"${COMPILER_TARGET}\" \\\n--host=\"${MACHTYPE}\" \\\n--build=\"${MACHTYPE}\" \\\n--disable-multilib \\\n--disable-werror \\\n--enable-shared \\\n--enable-threads=posix \\\n--with-sysroot=\"${sysroot}\" \\\n--program-prefix=\"${COMPILER_TARGET}-\"\n\ncat <<-EOF >> config.h\n#undef _GLIBCXX_USE_C99_FENV_TR1\n#undef _GLIBCXX_X86_RDSEED\n#undef _GLIBCXX_X86_RDRAND\n#undef HAVE_ALIGNED_ALLOC\n#define _GLIBCXX_HAS_GTHREADS 1\nEOF\n\n## Build, build, build!\nmake -j ${nproc}\nmake install\n\ninstall_license /usr/share/licenses/GPL-3.0+\n"""
version = "v11.1.0"

