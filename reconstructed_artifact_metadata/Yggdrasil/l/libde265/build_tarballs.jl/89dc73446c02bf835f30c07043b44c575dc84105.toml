julia_compat = "1.6"
lazy_artifacts = false
name = "libde265"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/libde265-*\n\nmkdir build\n\nargs+=(-DCMAKE_TOOLCHAIN_FILE=$CMAKE_TARGET_TOOLCHAIN)\nargs+=(-DCMAKE_INSTALL_PREFIX=$prefix)\nargs+=(-DCMAKE_BUILD_TYPE=RELEASE)\nargs+=(-DCMAKE_EXE_LINKER_FLAGS=\"-pthread\")\nargs+=(-DCMAKE_SHARED_LINKER_FLAGS=\"-pthread\")\n\ncmake -B build -S . \"${args[@]}\"\n\ncmake --build build --parallel $nproc\ncmake --install build\n\n# The library's soversion was changed from \"\" (nothing) to \"0\" (zero)\n# during a \"maintenance release\". We undo this change to avoid\n# breaking the ABI. We should remove this work-around when the next\n# major version is available.\nif [[ ${target} == *darwin* ]]; then\n    # Remove symbolic links\n    rm ${libdir}/libde265.dylib\n    rm ${libdir}/libde265.0.dylib\n    # Rename file\n    mv ${libdir}/libde265.*.dylib ${libdir}/libde265.dylib\n    # Change install name\n    install_name_tool -id @rpath/libde265.dylib ${libdir}/libde265.dylib\nelif [[ ${target} == *mingw* ]]; then\n    # do nothing\n    :\nelse\n    # Change soname\n    patchelf --set-soname libde265.so ${libdir}/libde265.so\nfi\n"""
version = "v1.1.0"

