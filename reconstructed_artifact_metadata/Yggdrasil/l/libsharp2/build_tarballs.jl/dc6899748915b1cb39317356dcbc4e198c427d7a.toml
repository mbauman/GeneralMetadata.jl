init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "libsharp2"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir\ncd libsharp/\nsed -i 's/LT_INIT.*/LT_INIT\\(\\[win32-dll\\]\\)/g' configure.ac\nsed -i 's/libsharp2_la_LDFLAGS = -version-info 0:0:0/libsharp2_la_LDFLAGS = -version-info 0:0:0 -no-undefined/g' Makefile.am\nautoreconf -i\nif [[ \"${target}\" == x86_64-* ]] && [[ \"${target}\" != *-apple-* ]]; then\n    # Enable runtime multiarch, but not for macOS, see\n    # https://gitlab.mpcdf.mpg.de/mtr/libsharp/-/blob/6374a3a1ffb935443c56f09b371b11cf982a7e28/COMPILE\n    export CFLAGS=\"-DMULTIARCH\"\nfi\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\n"""
version = "v1.0.1"

