julia_compat = "1.6"
lazy_artifacts = false
name = "Libffi"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libffi-*/\natomic_patch -p1 ../patches/0001-libdir-no-touchy.patch\n\n# Required on aarch64-apple-darwin to build with newer versions of LLVM. See:\n# - https://github.com/llvm/llvm-project/issues/72802\n# - Similar issue: https://github.com/libffi/libffi/issues/807\n# - In Julia: https://github.com/JuliaLang/julia/pull/54634\nif [[ ${target} == aarch64-apple-* ]]; then\n    atomic_patch -p1 ../patches/0002-aarch64-llvm18.patch\nfi\n\nupdate_configure_scripts\nautoreconf -f -i\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --disable-static --enable-shared\nmake -j${nproc}\nmake install\n"""
version = "v3.2.2"

