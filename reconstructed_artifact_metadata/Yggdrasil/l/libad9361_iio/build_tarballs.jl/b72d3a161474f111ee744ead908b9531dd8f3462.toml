platforms = ["x86_64-apple-darwin", "aarch64-apple-darwin", "i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd libad9361-iio\n\nmkdir build && cd build\nif [[ \"${target}\" == *-apple-* ]]; then\n    cmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n        -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n        -DCMAKE_BUILD_TYPE=Release \\\n        -DLIBIIO_INCLUDEDIR=${libdir}/iio.framework/Versions/0.23/Headers/ \\\n        -DLibIIO_LIBRARY=${libdir}/iio.framework/Versions/0.23/iio \\\n        ..\n    make -j${nproc}\n    cp -r ad9361.framework ${libdir}\nelse\n    cmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    ..\n    make -j${nproc}\n    make install\nfi\n"""
