script = """cd $WORKSPACE/srcdir/libva\n\nmeson setup builddir \\\n    --cross-file=${MESON_TARGET_TOOLCHAIN} \\\n    --buildtype=release \\\n    -Dc_args=\"-std=gnu99\" \\\n    -Dwith_x11=yes \\\n    -Dwith_wayland=no\n\nmeson compile -C builddir -j${nproc}\nmeson install -C builddir\n\ninstall_license COPYING\n"""
