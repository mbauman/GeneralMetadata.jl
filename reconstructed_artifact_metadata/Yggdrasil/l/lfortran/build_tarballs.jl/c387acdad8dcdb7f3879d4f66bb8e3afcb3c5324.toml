julia_compat = "1.6"
lazy_artifacts = false
name = "LFortran"
platforms = ["x86_64-linux-gnu-cxx11", "x86_64-linux-musl-cxx11"]
script = """cd $WORKSPACE/srcdir/lfortran-*\ncmake -DCMAKE_INSTALL_PREFIX=$prefix -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release -DWITH_LLVM=yes -DCMAKE_C_FLAGS_RELEASE=\"-std=gnu99 -O3 -DNDEBUG\" -DCMAKE_CXX_FLAGS_RELEASE=\"-Wall -Wextra -O3 -funroll-loops -pthread -D__STDC_FORMAT_MACROS -DNDEBUG\" .\nmake -j$nproc\nmake install\ninstall_license LICENSE \ncp src/bin/cpptranslate $bindir/\n"""
version = "v0.16.0"

