init_block = ""
lazy_artifacts = false
name = "libsingular_julia"
platforms = ["x86_64-linux-gnu-cxx11", "x86_64-apple-darwin14-cxx11"]
script = """# remove $libdir from LD_LIBRARY_PATH as this causes issues with perl\nif [[ -n \"$LD_LIBRARY_PATH\" ]]; then\nLD_LIBRARY_PATH=$(echo -n $LD_LIBRARY_PATH | sed -e \"s|[:^]$libdir\\w*|:|g\")\nfi\n\ncmake libsingular-j*/ -B build \\\n   -DJulia_PREFIX=\"$prefix\" \\\n   -DCMAKE_INSTALL_PREFIX=\"$prefix\" \\\n   -DCMAKE_FIND_ROOT_PATH=\"$prefix\" \\\n   -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n   -DCMAKE_CXX_STANDARD=14 \\\n   -DCMAKE_BUILD_TYPE=Release\n\nVERBOSE=ON cmake --build build --config Release --target install -- -j${nproc}\n\ninstall_license $WORKSPACE/srcdir/libsingular-j*/LICENSE.md\n"""
version = "v0.1.0"

