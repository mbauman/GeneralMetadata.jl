name = "Valhalla"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/valhalla/\n\n# Handle Mac SDK <10.12 errors\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    export MACOSX_DEPLOYMENT_TARGET=10.12\nfi\n\ngit submodule update --init --recursive\n\nif [[ \"${target}\" == *freebsd* ]]; then\n    cd third_party/cpp-statsd-client\n    atomic_patch -p1 ${WORKSPACE}/srcdir/patches/cpp-statsd-client.patch\n    cd ../../\nfi\n\nmkdir build && cd build\n\ncmake .. \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DENABLE_DATA_TOOLS=OFF \\\n    -DENABLE_PYTHON_BINDINGS=OFF \\\n    -DENABLE_BENCHMARKS=OFF \\\n    -DENABLE_TESTS=OFF \\\n    -DZLIB_LIBRARY=${libdir}/libz.${dlext} \\\n    -DZLIB_INCLUDE_DIR=${includedir} \\\n    -DProtobuf_INCLUDE_DIR=${includedir} \\\n    -DPROTOBUF_LIBRARY=${libdir}/libprotobuf.${dlext} \\\n    -DENABLE_SERVICES=OFF \\\n    -DENABLE_TOOLS=OFF \\\n    -DENABLE_CCACHE=OFF \\\n    -DENABLE_BENCHMARKS=OFF \\\n    -DProtobuf_PROTOC_EXECUTABLE=${host_bindir}/protoc \\\n    -DLOGGING_LEVEL=DEBUG\n\nmake -j${nproc}\nmake -j${nproc} install\n\ninstall_license ../LICENSE.md\n"""
version = "v3.3.0"

