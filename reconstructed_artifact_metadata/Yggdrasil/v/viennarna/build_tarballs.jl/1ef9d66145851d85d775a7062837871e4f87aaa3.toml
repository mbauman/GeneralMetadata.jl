init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "ViennaRNA"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir\ncd ViennaRNA-2.4.18/\n\n# configure script needs bash\nsed -i -e '1s|#! /bin/sh|#! /bin/bash|' configure\n\n# configure script fails (only in sandbox) without\n# setting ac_cv_func_malloc_0_nonnull=yes ac_cv_func_realloc_0_nonnull=yes\nac_cv_func_malloc_0_nonnull=yes ac_cv_func_realloc_0_nonnull=yes \\\n    ./configure \\\n    --prefix=${prefix} --build=${MACHTYPE} --host=${target} \\\n    --with-pic --disable-c11 \\\n    --without-perl --without-python --without-python3 \\\n    --without-doc --without-tutorial --without-tutorial-pdf \\\n    --without-gsl --without-svm \\\n    --without-forester\n\nmake -j${nproc}\nmake install\n\n# create and install a shared library libRNA\n#cc -shared -o \"${libdir}/libRNA.${dlext}\" -Wl,$(flagon --whole-archive) ./src/ViennaRNA/libRNA.a -Wl,$(flagon --no-whole-archive) -lgsl -lgslcblas -lm -lsvm -lgomp -lgsl -lmpfr\ncc -shared -o \"${libdir}/libRNA.${dlext}\" -Wl,$(flagon --whole-archive) ./src/ViennaRNA/libRNA.a -Wl,$(flagon --no-whole-archive) -lm -lgomp -lmpfr\n"""
version = "v2.4.18"

