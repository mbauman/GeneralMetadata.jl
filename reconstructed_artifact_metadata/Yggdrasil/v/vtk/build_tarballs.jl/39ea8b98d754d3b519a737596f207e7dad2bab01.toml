platforms = ["x86_64-linux-gnu-cxx11-mpi+mpiabi", "aarch64-linux-gnu-cxx11-mpi+mpiabi", "powerpc64le-linux-gnu-cxx11-mpi+mpiabi", "riscv64-linux-gnu-cxx11-mpi+mpiabi", "x86_64-linux-musl-cxx11-mpi+mpiabi", "aarch64-linux-musl-cxx11-mpi+mpiabi", "x86_64-apple-darwin-mpi+mpiabi", "aarch64-apple-darwin-mpi+mpiabi", "x86_64-unknown-freebsd-mpi+mpiabi", "aarch64-unknown-freebsd-mpi+mpiabi", "x86_64-linux-gnu-cxx11-mpi+mpich", "aarch64-linux-gnu-cxx11-mpi+mpich", "powerpc64le-linux-gnu-cxx11-mpi+mpich", "riscv64-linux-gnu-cxx11-mpi+mpich", "x86_64-linux-musl-cxx11-mpi+mpich", "aarch64-linux-musl-cxx11-mpi+mpich", "x86_64-apple-darwin-mpi+mpich", "aarch64-apple-darwin-mpi+mpich", "x86_64-unknown-freebsd-mpi+mpich", "aarch64-unknown-freebsd-mpi+mpich", "x86_64-linux-gnu-cxx11-mpi+openmpi", "aarch64-linux-gnu-cxx11-mpi+openmpi", "powerpc64le-linux-gnu-cxx11-mpi+openmpi", "riscv64-linux-gnu-cxx11-mpi+openmpi", "x86_64-linux-musl-cxx11-mpi+openmpi", "aarch64-linux-musl-cxx11-mpi+openmpi", "x86_64-apple-darwin-mpi+openmpi", "aarch64-apple-darwin-mpi+openmpi", "x86_64-unknown-freebsd-mpi+openmpi", "aarch64-unknown-freebsd-mpi+openmpi"]
script = """macos_sdk_version=10.14\nmacosx_deployment_target=10.14\n# Move the SDK tarball out of `srcdir` on all platforms: any extra entry\n# in there defeats the automatic installation of license files, which\n# expects `srcdir` to contain a single top-level source directory.\nmv ${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz ${WORKSPACE}/\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    # Extract SDK. Also outside of `srcdir`, for the same reason.\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    tar \\\n        --extract \\\n        --file=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=${WORKSPACE} \\\n        --warning=no-unknown-keyword\n    old_sdkroot=${SDKROOT}\n    new_sdkroot=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk\n    # Make sure libc++ header files are available at `usr/include/c++/v1`.\n    # Some SDKs ship their own (e.g. 15.0), which we leave alone; for those\n    # that don't, symlink the ones from the default SDK. Note we symlink\n    # the `v1` subdirectory rather than the whole `c++` directory: some\n    # SDKs (e.g. 10.13) contain `usr/include/c++/4.2.1` (but no `v1`), and\n    # symlinking `c++` onto that existing directory would silently create\n    # a nested `c++/c++` link, so libc++ headers like <new> are not found.\n    if [[ ! -d ${new_sdkroot}/usr/include/c++/v1 ]]; then\n        mkdir -p ${new_sdkroot}/usr/include/c++\n        ln -sT ${old_sdkroot}/usr/include/c++/v1 ${new_sdkroot}/usr/include/c++/v1\n    fi\n    # In the build environment `usr/local` of the default sys-root is a\n    # symlink to the destdir prefix, which puts the header files of the\n    # dependencies on the compilers' default search path. No SDK ships a\n    # `usr/local`, so replicate that symlink in the new SDK. `-T` makes\n    # this fail loudly should some SDK ship a `usr/local` after all,\n    # instead of silently creating a nested `usr/local/local` link.\n    ln -sT ${old_sdkroot}/usr/local ${new_sdkroot}/usr/local\n    # Fix toolchain files\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" ${MESON_TARGET_TOOLCHAIN} ${CMAKE_TARGET_TOOLCHAIN}\n    # Fix compiler wrappers\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" $(find /opt/bin/${target}* -type f -print)\n    SDKROOT=${new_sdkroot}\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd ${WORKSPACE}/srcdir/VTK-*\n\n# We need at least cmake 3.27.1, so we add it as HostBuildDependency below\napk del cmake\n\n# For the record:\n# If we want to build `libproj` ourselves (instead of depending on `PROJ_jll`), then we need the following:\n#     apk add sqlite\n#\n# We also need this patch. (VTK wants to run a target binary. Silly VTK.)\n#     --- a/ThirdParty/libproj/vtklibproj/CMakeLists.txt\n#     +++ b/ThirdParty/libproj/vtklibproj/CMakeLists.txt\n#     @@ -215,7 +215,7 @@\n#        message(SEND_ERROR \"sqlite3 dependency not found!\")\n#      endif()\n#      else ()\n#     -set(EXE_SQLITE3 \"$<TARGET_FILE:VTK::sqlitebin>\")\n#     +set(EXE_SQLITE3 \"/usr/bin/sqlite3\")\n#      set(SQLITE3_FOUND 1)\n#      set(SQLITE3_VERSION 3.36.0) # Might be out-of-sync; update as needed.\n#      endif ()\n\nif [[ ${target} == *mingw* ]]; then\n    apk add sqlite\nfi\n\n# powerpc64le refuses to treat long double multiplication as constexpr\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/long_double.patch\n\n# Build the tools for building VTK\nhost_opts=(\n    -DCMAKE_BUILD_TYPE=Release\n    -DCMAKE_INSTALL_PREFIX=${host_prefix}\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_HOST_TOOLCHAIN}\n    -DVTK_BUILD_COMPILE_TOOLS_ONLY=ON\n)\ncmake -Bhost_build -GNinja ${host_opts[@]}\ncmake --build host_build --parallel ${nproc}\ncmake --install host_build\n\n# For the record:\n# If we want to build `hdf5` ourselves (instead of depending on `HDF5_jll`), then we need the following:\n#     -DH5_PRINTF_LL_TEST_RUN:STRING=0\n#     -DH5_PRINTF_LL_TEST_RUN__TRYRUN_OUTPUT:STRING=9223372036854775807\n#     -DH5_LDOUBLE_TO_LONG_SPECIAL=OFF\n#     -DH5_LONG_TO_LDOUBLE_SPECIAL=OFF\n#     -DH5_LDOUBLE_TO_LLONG_ACCURATE=ON\n#     -DH5_LDOUBLE_TO_LLONG_ACCURATE=ON\n#     -DH5_LLONG_TO_LDOUBLE_CORRECT=ON\n#     -DH5_DISABLE_SOME_LDOUBLE_CONV=OFF\n#     -DH5_NO_ALIGNMENT_RESTRICTIONS=OFF\n\n# Build VTK\nopts=(\n    -DCMAKE_BUILD_TYPE=Release\n    -DCMAKE_INSTALL_PREFIX=${prefix}\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\n    -DVTK_GENERATE_SPDX=ON\n    -DVTK_REQUIRE_LARGE_FILE_SUPPORT=OFF\n    -DVTK_USE_MPI=ON\n    -DTEST_LFS_WORKS_RUN:STRING=0\n    -DHDF5_NO_FIND_PACKAGE_CONFIG_FILE=TRUE\n    -DHDF5_PREFER_PARALLEL=TRUE\n    -DVTK_MODULE_USE_EXTERNAL_VTK_cgns=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_expat=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_exprtk=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_freetype=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_hdf5=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_jpeg=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_libharu=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_libproj=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_libxml2=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_lz4=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_lzma=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_netcdf=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_nlohmannjson=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_ogg=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_png=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_pugixml=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_sqlite=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_tiff=ON\n    -DVTK_MODULE_USE_EXTERNAL_VTK_zlib=ON\n)\nif [[ ${target} == *mingw* ]]; then\n    opts+=(\n        -D_vtk_thread_impl_output=win32\n        -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON\n        -DCMAKE_CXX_VISIBILITY_PRESET=default\n        -DCMAKE_VISIBILITY_INLINES_HIDDEN=OFF\n    )\nfi\ncmake -Bbuild -GNinja ${opts[@]}\ncmake --build build --parallel ${nproc}\ncmake --install build\n"""
