augment_platform_block = ""
init_block = ""
julia_compat = "1.10"
lazy_artifacts = false
name = "vroom"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """macos_sdk_version=15.0\nmacosx_deployment_target=15.0\n# Move the SDK tarball out of `srcdir` on all platforms: any extra entry\n# in there defeats the automatic installation of license files, which\n# expects `srcdir` to contain a single top-level source directory.\nmv ${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz ${WORKSPACE}/\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    # Extract SDK. Also outside of `srcdir`, for the same reason.\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    tar \\\n        --extract \\\n        --file=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=${WORKSPACE} \\\n        --warning=no-unknown-keyword\n    old_sdkroot=${SDKROOT}\n    new_sdkroot=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk\n    # Make sure libc++ header files are available at `usr/include/c++/v1`.\n    # Some SDKs ship their own (e.g. 15.0), which we leave alone; for those\n    # that don't, symlink the ones from the default SDK. Note we symlink\n    # the `v1` subdirectory rather than the whole `c++` directory: some\n    # SDKs (e.g. 10.13) contain `usr/include/c++/4.2.1` (but no `v1`), and\n    # symlinking `c++` onto that existing directory would silently create\n    # a nested `c++/c++` link, so libc++ headers like <new> are not found.\n    if [[ ! -d ${new_sdkroot}/usr/include/c++/v1 ]]; then\n        mkdir -p ${new_sdkroot}/usr/include/c++\n        ln -sT ${old_sdkroot}/usr/include/c++/v1 ${new_sdkroot}/usr/include/c++/v1\n    fi\n    # In the build environment `usr/local` of the default sys-root is a\n    # symlink to the destdir prefix, which puts the header files of the\n    # dependencies on the compilers' default search path. No SDK ships a\n    # `usr/local`, so replicate that symlink in the new SDK. `-T` makes\n    # this fail loudly should some SDK ship a `usr/local` after all,\n    # instead of silently creating a nested `usr/local/local` link.\n    ln -sT ${old_sdkroot}/usr/local ${new_sdkroot}/usr/local\n    # Fix toolchain files\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" ${MESON_TARGET_TOOLCHAIN} ${CMAKE_TARGET_TOOLCHAIN}\n    # Fix compiler wrappers\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" $(find /opt/bin/${target}* -type f -print)\n    SDKROOT=${new_sdkroot}\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd $WORKSPACE/srcdir\n# Windows: no pkg-config for OpenSSL; set include/lib paths\nif [[ ${target} == *-w64-mingw32 ]]; then\n    export CPPFLAGS=\"-I${includedir} ${CPPFLAGS}\"\n    export LDFLAGS=\"-L${libdir} ${LDFLAGS}\"\nfi\ncd vroom\n# https://github.com/VROOM-Project/vroom/pull/1333\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/include-semaphore.patch\ngit submodule init\ngit submodule update\nif [[ ${target} == *-w64-mingw32 ]]; then\n    # There is no pkg-config info for OpenSSL on Windows. The makefile passes -lssl -lcrypto\n    # but not -L and does not use LDFLAGS. On Windows libdir=${prefix}/bin (where DLLs live).\n    export CPPFLAGS=\"-I${includedir} ${CPPFLAGS}\"\n    for f in $(find . \\( -name Makefile -o -name makefile -o -name '*.mk' \\) -type f); do\n        if grep -q 'lssl' \"$f\" 2>/dev/null; then\n            sed -i -e \"s| -lssl| -L${libdir} -lssl|g\" \\\n                   -e \"s| -lcrypto| -L${libdir} -lcrypto -lws2_32 -lmswsock|g\" \"$f\"\n        fi\n    done\nfi\ncd src\n# FreeBSD: use GCC since clang setup is incomplete for this target.\nif [[ \"${target}\" == *-freebsd* ]]; then\n    export CC=gcc\n    export CXX=g++\nfi\n# macOS: use default Apple clang with the macOS 15.0 SDK installed above.\n# libc++ from macOS 15.0 SDK ships `std::format`, required by vroom v1.15.0.\n# Available GCC for aarch64-apple-darwin (GCCBootstrap-12.0.1-iains) lacks\n# `std::format`, so GCC is not an option.\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    # That libc++ (LLVM 18) hides `std::jthread` behind the experimental\n    # library, see `__thread/jthread.h`. It is header-only, so enabling it\n    # does not require linking against libc++experimental.\n    #\n    # asio v1.18.1 only detects `std::invoke_result` for MSVC and otherwise\n    # falls back to `std::result_of`, which libc++ removed in C++20 (but\n    # libstdc++ still provides). Force the `std::invoke_result` code path.\n    #\n    # The makefile assigns `CXXFLAGS` unconditionally, so the flags cannot be\n    # passed through the environment and go through `CXX` instead.\n    export CXX=\"${CXX} -D_LIBCPP_ENABLE_EXPERIMENTAL -DASIO_HAS_STD_INVOKE_RESULT=1\"\nfi\nmake -j${nproc}\ninstall -Dvm 755 ../bin/vroom${exeext} -t ${bindir}\n"""
version = "v1.15.0"

