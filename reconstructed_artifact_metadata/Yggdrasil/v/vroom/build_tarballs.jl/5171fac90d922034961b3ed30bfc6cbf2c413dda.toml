name = "vroom"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir\n# Windows: no pkg-config for OpenSSL; set include/lib paths\nif [[ ${target} == *-w64-mingw32 ]]; then\n    export CPPFLAGS=\"-I${includedir} ${CPPFLAGS}\"\n    export LDFLAGS=\"-L${libdir} ${LDFLAGS}\"\nfi\ncd vroom\ngit submodule init\ngit submodule update\nif [[ ${target} == *-w64-mingw32 ]]; then\n    # There is no pkg-config info for OpenSSL on Windows. The makefile passes -lssl -lcrypto\n    # but not -L and does not use LDFLAGS. On Windows libdir=${prefix}/bin (where DLLs live).\n    export CPPFLAGS=\"-I${includedir} ${CPPFLAGS}\"\n    for f in $(find . \\( -name Makefile -o -name makefile -o -name '*.mk' \\) -type f); do\n        if grep -q 'lssl' \"$f\" 2>/dev/null; then\n            sed -i -e \"s| -lssl| -L${libdir} -lssl|g\" \\\n                   -e \"s| -lcrypto| -L${libdir} -lcrypto -lws2_32 -lmswsock|g\" \"$f\"\n        fi\n    done\nfi\ncd src\n# Use GCC instead of Clang on macOS: Apple's libc++ lacks std::jthread (vroom#1062, pyvroom#106)\n# Override deployment target for GCC compatibility (Runner/default may use 14.5 which GCC rejects).\nif [[ \"${target}\" == *-freebsd* ]] || [[ \"${target}\" == *-apple-* ]]; then\n    export CC=gcc\n    export CXX=g++\n    export MACOSX_DEPLOYMENT_TARGET=10.15\n    export CFLAGS=\"$(echo \" ${CFLAGS}\" | sed 's/ -mmacosx-version-min=[^ ]*//g' | sed 's/^ *//')\"\n    export CXXFLAGS=\"$(echo \" ${CXXFLAGS}\" | sed 's/ -mmacosx-version-min=[^ ]*//g' | sed 's/^ *//')\"\n    export LDFLAGS=\"$(echo \" ${LDFLAGS}\" | sed 's/ -Wl,-sdk_version,[^ ]*//g' | sed 's/^ *//')\"\nfi\nmake -j${nproc}\ninstall -Dvm 755 ../bin/vroom${exeext} -t ${bindir}\n"""
version = "v1.14.0"

