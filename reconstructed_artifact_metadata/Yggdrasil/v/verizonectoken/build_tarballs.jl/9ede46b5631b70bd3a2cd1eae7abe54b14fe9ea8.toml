dependencies = ["OpenSSL_jll"]
name = "VerizonEctoken"
platforms = ["x86_64-linux-gnu"]
script = """cd $WORKSPACE/srcdir\nexport OPENSSL_INCLUDE=\"-I $prefix/include\"\nexport OPENSSL_LIBS=\"-lssl -lcrypto\"\ncd ectoken/c-ectoken/ecencrypt/\ngcc -m64 -O2 -Wall -Werror -std=gnu99 ec_encrypt.c ectoken_v3.c base64.c -o 64/ectoken3 $OPENSSL_LIBS $OPENSSL_INCLUDE -lm -lpthread -ldl\ncp 64/ectoken3 $prefix/bin/\nexit\n\n"""
version = "v0.1.0"

[[products]]
binnames = ["ectoken3"]
type = "exe"
variable_name = "ectoken3"

[[sources]]
"https://github.com/VerizonDigital/ectoken.git" = "7b8812d476f5be5b290fe2832859b9b7636f43ae"
