augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Vim"
platforms = ["i686-w64-mingw32", "x86_64-w64-mingw32", "i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/vim*/\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    atomic_patch -p0 ../patches/windows_build.patch\nfi\n\n# Set environment variables to help configure script during cross-compilation\nexport vim_cv_toupper_broken=no\nexport vim_cv_terminfo=yes\nexport vim_cv_tty_group=tty\nexport vim_cv_getcwd_broken=no\nexport vim_cv_stat_ignores_slash=yes\nexport vim_cv_tgetent=zero\nexport vim_cv_timer_create=no\nexport vim_cv_memmove_handles_overlap=yes\n\n./configure \\\n    --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --with-features=huge \\\n    --enable-multibyte \\\n    --enable-terminal \\\n    --with-tlib=ncursesw \\\n    --enable-gui=no \\\n    --without-x \\\n    --disable-netbeans\n\n# Build and install\nif [[ \"${target}\" == *-mingw* ]]; then\n   cd src \n   make -j${nproc} -f Make_ming.mak\n   cp *.exe ${bindir}\n   cd ..\nelse\n   make -j${nproc}\n   make install\nfi\n"""
version = "v9.1.0"

