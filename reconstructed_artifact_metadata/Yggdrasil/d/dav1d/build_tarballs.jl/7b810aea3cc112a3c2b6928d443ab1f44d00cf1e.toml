name = "dav1d"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/dav1d-*\n\n# Avoid problems with `-Werror=unused-command-line-argument`\nsed -i -e 's!/opt/bin/.*-clang!'${WORKSPACE}/srcdir/files/cc'!' ${MESON_TARGET_TOOLCHAIN}\nsed -i -e 's!/opt/bin/.*-clang[+][+]!'${WORKSPACE}/srcdir/files/c++'!' ${MESON_TARGET_TOOLCHAIN}\n\nflags=\nif [[ ${target} == powerpc64le-* ]]; then\n    # These macros are defined in glibc, but our glibc is too old\n    flags='-DAT_HWCAP2=26 -DPPC_FEATURE2_ARCH_3_00=0x00800000'\nfi\n\nmkdir build && cd build\nmeson setup --cross-file=\"${MESON_TARGET_TOOLCHAIN}\" --buildtype=release -Denable_tests=false -Dc_args=\"${flags}\" -Dcpp_args=\"${flags}\" ..\nninja -j${nproc}\nninja install\ninstall_license ../COPYING\n"""
version = "v1.5.1"

