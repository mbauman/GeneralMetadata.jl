augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Dbus"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """cd ${WORKSPACE}/srcdir/dbus-*\n\n# -Dinotify=enabled ?\noptions=(\n    --buildtype=release\n    --cross-file=${MESON_TARGET_TOOLCHAIN}\n    --prefix=${prefix}\n    -Ddbus_user=messagebus\n    -Dsystem_pid_file=/var/run/dbus.pid\n    -Dverbose_mode=false\n    -Dinotify=auto\n    -Dasserts=false\n    -Duser_session=true\n    -Dsession_socket_dir=/tmp\n    -Dx11_autolaunch=disabled\n    -Dmodular_tests=disabled\n    -Dc_link_args='-lrt'\n)\n\nif [[ ${target} == x86_64-*-freebsd* ]]; then\n    # The symbol `environ` is not provided by a shared library but by `crt1.o`, which is only loaded at run time.\n    # We thus cannot check for undefined references during linking.\n    options+=(-Db_lundef=false)\nfi\n\nmeson setup builddir \"${options[@]}\"\nmeson compile -C builddir\nmeson install -C builddir\n"""
version = "v1.16.2"

