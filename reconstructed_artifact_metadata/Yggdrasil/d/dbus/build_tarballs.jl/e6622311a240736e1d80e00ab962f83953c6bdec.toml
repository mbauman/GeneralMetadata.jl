name = "Dbus"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-unknown-freebsd11.1"]
script = """cd $WORKSPACE/srcdir/dbus-*\n./configure --prefix=${prefix} --host=${target} \\\n    --with-xml=expat \\\n    --with-dbus-user=messagebus \\\n    --with-system-pid-file=/var/run/dbus.pid \\\n    --disable-verbose-mode \\\n    --disable-static \\\n    --enable-inotify \\\n    --disable-dnotify \\\n    --disable-asserts \\\n    --enable-user-session \\\n    --with-session-socket-dir=/tmp \\\n    --with-x\nmake -j${nproc}\nmake install\n"""
version = "v1.12.16"

