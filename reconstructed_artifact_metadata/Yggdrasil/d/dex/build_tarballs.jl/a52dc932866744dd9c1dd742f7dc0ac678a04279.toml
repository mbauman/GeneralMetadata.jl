dependencies = []
lazy_artifacts = false
name = "Dex"
platforms = ["x86_64-linux-musl", "x86_64-linux-gnu"]
script = """cd $WORKSPACE/srcdir\nmkdir -p \"${bindir}\"\ncd dex/\natomic_patch -p1 ../patches/01-allow-optional-github-gitlab-scopes.patch\ninstall_license LICENSE \nmake\nmv bin/dex \"$bindir/dex${exeext}\"\nmv bin/example-app \"$bindir/example-app${exeext}\"\nmv bin/grpc-client \"$bindir/grpc-client${exeext}\"\n"""
version = "v2.23.0"

[[products]]
binnames = ["example-app"]
type = "exe"
variable_name = "exampleapp"
[[products]]
binnames = ["grpc-client"]
type = "exe"
variable_name = "grpcclient"
[[products]]
binnames = ["dex"]
type = "exe"
variable_name = "dex"

