lazy_artifacts = false
name = "dSFMT"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "x86_64-linux-gnu-sanitize+memory"]
script = """cd $WORKSPACE/srcdir/dSFMT\n\nFLAGS=(\n    -O3 -finline-functions -fomit-frame-pointer -fno-strict-aliasing -Wmissing-prototypes -Wall -std=c99\n    -DNDEBUG -DDSFMT_MEXP=19937\n    -fPIC -shared -DDSFMT_SHLIB -DDSFMT_DO_NOT_USE_OLD_NAMES\n)\n\nif [[ ${target} == x86_64* ]]; then\n    FLAGS+=(-msse2 -DHAVE_SSE2)\nfi\n\nmkdir -p \"${libdir}\"\n${CC} ${FLAGS[@]} ${CFLAGS} ${CPPFLAGS} ${LDFLAGS} -o \"${libdir}/libdSFMT.${dlext}\" dSFMT.c\n"""
version = "v2.2.5"

