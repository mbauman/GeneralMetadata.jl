init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "DuckDB"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """macos_sdk_version=14.0\nmacosx_deployment_target=11.0\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    # Extract SDK\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    tar \\\n        --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=${WORKSPACE}/srcdir \\\n        --warning=no-unknown-keyword\n    old_sdkroot=${SDKROOT}\n    new_sdkroot=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk\n    # Point to C++ header files (these are not shipped with the SDK)\n    ln -s ${old_sdkroot}/usr/include/c++ ${new_sdkroot}/usr/include/c++\n    # Fix toolchain files\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" ${MESON_TARGET_TOOLCHAIN} ${CMAKE_TARGET_TOOLCHAIN}\n    # Fix compiler wrappers\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" $(find /opt/bin/${target}* -type f -print)\n    SDKROOT=${new_sdkroot}\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd $WORKSPACE/srcdir/duckdb/\n\nexport DUCKDB_TARGET=\"${target}\"\nif [[ \"${target}\" == \"x86_64-linux-gnu\" ]]; then\n    export DUCKDB_TARGET=\"linux_amd64\"\nelif [[ \"${target}\" == aarch64-linux-gnu ]]; then\n    export DUCKDB_TARGET=\"linux_arm64\"\nelif [[ \"${target}\" == \"x86_64-linux-musl\" ]]; then\n    export DUCKDB_TARGET=\"linux_amd64_musl\"\nelif [[ \"${target}\" == \"x86_64-w64-mingw32\" ]]; then\n    export DUCKDB_TARGET=\"windows_amd64_mingw\"\nelif [[ \"${target}\" == x86_64-apple-* ]]; then\n    export DUCKDB_TARGET=\"osx_amd64\"\nelif [[ \"${target}\" == aarch64-apple-* ]]; then\n    export DUCKDB_TARGET=\"osx_arm64\"\nfi\n\nif [[ \"${bb_full_target}\" == *-cxx03* ]]; then\n    export DUCKDB_TARGET=\"${DUCKDB_TARGET}_gcc4\"\nfi\n\necho \"Compiling for DuckDB Target - $DUCKDB_TARGET\"\n\ncmake -B build \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DENABLE_SANITIZER=FALSE \\\n      -DBUILD_EXTENSIONS='parquet;json' \\\n      -DSKIP_EXTENSIONS=jemalloc \\\n      -DENABLE_EXTENSION_AUTOLOADING=1 \\\n      -DENABLE_EXTENSION_AUTOINSTALL=1 \\\n      -DBUILD_UNITTESTS=FALSE \\\n      -DBUILD_SHELL=TRUE \\\n      -DDUCKDB_EXPLICIT_PLATFORM=${DUCKDB_TARGET}\ncmake --build build --parallel ${nproc}\ncmake --install build\n\nif [[ \"${target}\" == *-mingw32 ]]; then\n    install -Dvm 755 \"build/src/libduckdb.${dlext}\" -t \"${libdir}\"\nfi\n"""
version = "v1.5.4"

