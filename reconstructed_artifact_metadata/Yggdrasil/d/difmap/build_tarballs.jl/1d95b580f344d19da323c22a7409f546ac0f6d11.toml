julia_compat = "1.6"
lazy_artifacts = false
name = "difmap"
platforms = ["x86_64-linux-musl-libgfortran3", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "aarch64-apple-darwin-libgfortran5"]
script = """cd $WORKSPACE/srcdir/uvf_difmap*\n\nfor f in ../patch*; do\n    atomic_patch -p0 \"${f}\"\ndone\n\nif [[ ${target} == *apple* ]]; then\n    # disable GUI support: X11 jlls not available for this platform\n    sed -i 's|^PGPLOT_LIB=\"-lpgplot -lX11\"$|PGPLOT_LIB=\"-lpgplot\"|' configure\n    CC=gcc CXX=g++ CCOMPL=gcc ./configure arm-osx-gcc\nelse\n    ./configure linux-i486-gcc\nfi\n./makeall\ninstall difmap \"${bindir}/difmap\"\ninstall_license ./README\n"""
version = "v2.5.17"

