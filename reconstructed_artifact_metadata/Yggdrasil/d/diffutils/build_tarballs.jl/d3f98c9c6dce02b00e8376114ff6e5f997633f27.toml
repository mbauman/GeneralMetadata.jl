augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "diffutils"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/diffutils-*\n\n# The autoconf test for `strcasecmp` runs code and thus doesn't work\n# when cross-building. We assume that `strcasecmp` is working\n# correctly.\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --disable-dependency-tracking gl_cv_func_strcasecmp_works=yes\n\nmake -j${nproc}\nmake install\n"""
version = "v3.12.0"

[[products]]
binnames = ["cmp"]
type = "exe"
variable_name = "_cmp"
[[products]]
binnames = ["diff"]
type = "exe"
variable_name = "_diff"
[[products]]
binnames = ["diff3"]
type = "exe"
variable_name = "diff3"
[[products]]
binnames = ["sdiff"]
type = "exe"
variable_name = "sdiff"

