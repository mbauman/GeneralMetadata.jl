name = "Darknet"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """OPENMP=1\nGPU=0\ncd $WORKSPACE/srcdir/darknet\n\nif [[ \"${GPU}\" -eq 1 ]]; then\n    ## CUDA setup\n    mkdir -p /usr/local\n    ln -s \"${WORKSPACE}/srcdir/cudnn\" /usr/local/cudnn\n    ln -s ${prefix}/cuda /usr/local/cuda\n\n    export PATH=\"/usr/local/cuda/bin:${PATH}\"\n\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/makefile-fix-cuda-paths.patch\"\nfi\n\n## Note for the future: Supporting AVX will make more sense with microarchitecture support\n# if [[ \"${target}\" = powerpc64le-* ]] || [[ \"${target}\" = arm* ]] || [[ \"${target}\" == aarch* ]] || [[ \"${target}\" == *-mingw* ]] then\n#     # Disable AVX on powerpc, arm, aarch, windows, apple\n#     export AVXENABLE=0\n# else\n#     # Enable everywhere else (linux)\n#     export AVXENABLE=1\n# fi\nexport AVXENABLE=0\n\n# Make sure to have the directories, before building\n# make obj backup results setchmod\nmake -j${nproc} \\\n    libdarknet.${dlext} \\\n    OPTS=\"\" \\\n    LIBNAMESO=\"libdarknet.${dlext}\" \\\n    LIBSO=1 \\\n    GPU=${GPU} \\\n    CUDNN=${GPU} \\\n    CUDNN_HALF=${GPU} \\\n    OPENCV=0 \\\n    DEBUG=0 \\\n    OPENMP=${OPENMP} \\\n    ZED_CAMERA=0 \\\n    AVX=${AVXENABLE}\n\nls -lh\n\nmkdir -p \"${libdir}\"\ncp libdarknet.${dlext} \"${libdir}\"\nmkdir -p ${includedir}\ncp include/* \"${includedir}/.\"\n\ninstall_license LICENSE\n\nrm -rf \"${prefix}/cuda\"\n"""
version = "v2021.10.29"

