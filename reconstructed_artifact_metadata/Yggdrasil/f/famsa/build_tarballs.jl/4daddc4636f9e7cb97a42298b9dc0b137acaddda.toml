lazy_artifacts = false
name = "FAMSA"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin-cxx03", "x86_64-apple-darwin-cxx11", "aarch64-apple-darwin"]
script = """cd $WORKSPACE/srcdir/FAMSA*/\n\natomic_patch -p1 ../patches/fix-makefile-avx2-platform-no-march.patch\n\nPLATFORM=none\nif [[ ${target} == x86_64-* || ${target} == i686-* ]]; then\n    PLATFORM=avx2\nelif [[ ${target} == aarch64-apple-darwin* ]]; then\n    PLATFORM=m1\nelif [[ ${target} == aarch64-linux-* ]]; then\n    PLATFORM=arm8\nelse\n    echo \"WARNING: not using any hardware accelleration, PLATFORM=$PLATFORM\"\nfi\n\nUNAME_S=\nif [[ ${target} == *-apple-darwin* ]]; then\n    UNAME_S=Darwin\nfi\n\nDEFINE_FLAGS=\nif [[ ${target} == *-linux-* ]]; then\n    DEFINE_FLAGS=\"DEFINE_FLAGS=-DUSE_NATIVE_BARRIERS\"\nfi\n\nmake -j${nproc} CC=${CC} CXX=${CXX} PLATFORM=${PLATFORM} UNAME_S=${UNAME_S} ${DEFINE_FLAGS}\ninstall -Dvm 755 \"famsa${exeext}\" \"${bindir}/famsa${exeext}\"\ninstall_license LICENSE\n"""
version = "v2.2.2"

