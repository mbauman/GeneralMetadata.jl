dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "FMUComplianceChecker"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/FMUComplianceChecker*/\natomic_patch -p1 ../patches/forward-cmake-toolchain.patch\natomic_patch -p1 ../patches/windows-lowercase-header-file.patch\nexport CFLAGS=\"-I${includedir}\"\nif [[ \"${target}\" == *-apple-* ]]; then\n    # Replace `/usr/bin/libtool` with `libtool` from our toolchain to fix error\n    #     libtool:   error: unrecognised option: '-static'\n    ln -sf $(which libtool) /usr/bin/libtool\nfi\nmkdir build && cd build\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release ..\nmake -j${nproc}\ninstall -Dm755 fmuCheck.* \"${bindir}/fmuCheck${exeext}\"\n# Delete expat stuff\nrm -rf \"${includedir}\" \"${prefix}/lib\"\ninstall_license \"../LICENSE\"\n"""
version = "v2.0.4"

[[products]]
binnames = ["fmuCheck"]
type = "exe"
variable_name = "fmucheck"

