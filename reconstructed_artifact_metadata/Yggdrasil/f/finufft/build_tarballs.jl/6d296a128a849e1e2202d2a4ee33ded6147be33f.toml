name = "finufft"
platforms = ["x86_64-linux-gnu-march+x86_64", "x86_64-linux-gnu-march+avx", "x86_64-linux-gnu-march+avx2", "x86_64-linux-musl-march+x86_64", "x86_64-linux-musl-march+avx", "x86_64-linux-musl-march+avx2", "x86_64-apple-darwin-march+x86_64", "x86_64-apple-darwin-march+avx", "x86_64-apple-darwin-march+avx2", "x86_64-unknown-freebsd-march+x86_64", "x86_64-unknown-freebsd-march+avx", "x86_64-unknown-freebsd-march+avx2", "x86_64-w64-mingw32-march+x86_64", "x86_64-w64-mingw32-march+avx", "x86_64-w64-mingw32-march+avx2", "i686-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "aarch64-apple-darwin", "i686-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/finufft*/\n# Overwrite LIBSFFT such that we do not require fftw3_threads or fftw3_omp for OMP support. Since the libraries in FFTW_jll already provide for threading, we do not loose anything.\n# Make use of the -DFFTW_PLAN_SAFE flag to allow for multiple threads using finufft at the same time.\nmake lib CFLAGS=\"-fopenmp -fPIC -O3 -funroll-loops -fcx-limited-range -Iinclude\" CXXFLAGS=\"-fopenmp -fPIC -O3 -funroll-loops -fcx-limited-range -Iinclude -std=c++14 -DFFTW_PLAN_SAFE\" LIBSFFT=\"-lfftw3 -lfftw3f -lm\"\nmv lib/libfinufft.so \"${libdir}/libfinufft.${dlext}\"\n"""
version = "v2.0.4"

