name = "FastTransforms"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/FastTransforms/\nif [[ ${target} == x86_64-* ]] || [[ ${target} == i686-* ]]; then\n    export MSSE=-msse\n    export MSSE2=-msse2\n    export MAVX=-mavx\n    export MFMA=-mfma\n    if [[ ${target} == *-w64-mingw32 ]]; then\n        export CFLAGS=\"-O3 -mavx -fno-asynchronous-unwind-tables \"\n    else\n        export CFLAGS=\"-O3 -mavx \"\n        export MAVX512F=-mavx512f\n    fi\nelse\n    export CFLAGS=\"-O3 \"\nfi\nif [[ ${nbits} == 64 ]]; then\n    SYMBOL_DEFS=()\n    SYMBOLS=(dgemv dgemm dtrmm dtrmv dtrsm sgemv sgemm strmm strsm ztrmm)\n    for sym in ${SYMBOLS[@]}; do\n        SYMBOL_DEFS+=(\"-Dcblas_${sym}=cblas_${sym}64_\")\n    done\n    CFLAGS+=${SYMBOL_DEFS[@]}\n    BLAS=openblas64_\nelse\n    BLAS=openblas\nfi\nmake assembly\nmake lib FT_PREFIX=${prefix} FT_BLAS=${BLAS} FT_FFTW_WITH_COMBINED_THREADS=1\nmv -f libfasttransforms.${dlext} ${libdir}\n"""
version = "v0.6.4"

