augment_platform_block = ""
init_block = """  if !Sys.iswindows() && !(get(ENV, \"NEMO_THREADED\", \"\") == \"1\")\n    #to match the global gmp ones\n    fm = dlsym(libflint_handle, :__flint_set_memory_functions)\n    ccall(fm, Nothing,\n      (Ptr{Nothing},Ptr{Nothing},Ptr{Nothing},Ptr{Nothing}),\n        cglobal(:jl_malloc),\n        cglobal(:jl_calloc),\n        cglobal(:jl_realloc),\n        cglobal(:jl_free))\n  end\n"""
julia_compat = "1.6"
lazy_artifacts = false
name = "FLINT"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/flint*\nif [[ ${target} == *musl* ]]; then\n   # because of some ordering issue with pthread.h and sched.h includes\n   export CFLAGS=-D_GNU_SOURCE\nelif [[ ${target} == *mingw* ]]; then\n   extraflags=--reentrant\nfi\n\n# Currently we backport 0292521af462dcd3ba747255a4c5ed9317d911dd\n#                       bfbc1eb206288abe7b9ccd04d3cb104b4a2b3898\n#                       a7a234463c0d4b5730d05ad57ab2798b2df26127\n#                       455d05914b62423b77ba3f39d8e99a549cc2f57e\n#                       ef89816abda221fc40cb4a960430cb570ef0f43c\n#                       1b566bab94d3442e9fcc20c367acc8543a1b07a4\n# in make_flint_great_again.patch\n# Drop once we bump the version to 3.0\nfor f in ${WORKSPACE}/srcdir/patches/*.patch; do\n  atomic_patch -p1 ${f}\ndone\n\n./configure --prefix=$prefix --disable-static --enable-shared --with-gmp=$prefix --with-mpfr=$prefix --with-blas=$prefix ${extraflags}\nmake -j${nproc}\nmake install LIBDIR=$(basename ${libdir})\n"""
version = "v200.900.9"

