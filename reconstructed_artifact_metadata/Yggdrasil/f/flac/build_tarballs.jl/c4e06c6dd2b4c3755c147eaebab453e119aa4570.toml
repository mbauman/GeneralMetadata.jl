dependencies = ["Ogg_jll"]
name = "FLAC"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/flac-*/\n./configure --prefix=$prefix --host=$target\nmake -j${nproc}\nmake install\n"""
version = "v1.3.3"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libFLAC"]
type = "lib"
variable_name = "libflac"
[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libFLAC++"]
type = "lib"
variable_name = "libflacpp"
[[products]]
binnames = ["metaflac"]
type = "exe"
variable_name = "metaflac"
[[products]]
binnames = ["flac"]
type = "exe"
variable_name = "flac"

