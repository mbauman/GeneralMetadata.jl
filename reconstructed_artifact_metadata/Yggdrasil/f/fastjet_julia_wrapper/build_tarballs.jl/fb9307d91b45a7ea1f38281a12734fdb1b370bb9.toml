init_block = ""
julia_compat = "^1.5"
lazy_artifacts = false
name = "FastJet_Julia_Wrapper"
platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "x86_64-apple-darwin"]
script = """cd ${WORKSPACE}/srcdir/FastJet_Julia_Wrapper\nmkdir build && cd build\ncmake -DJulia_PREFIX=${prefix} -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_FIND_ROOT_PATH=${prefix} -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release ..\nmake -j${nproc}\nmake install\ninstall_license $WORKSPACE/srcdir/FastJet_Julia_Wrapper/LICENSE.md\n"""
version = "v0.8.5"

[[dependencies]]
name = "libcxxwrap_julia_jll"
type = "dependency"
version-major = 0
version-minor = 8
version-patch = 5
[[dependencies]]
name = "FastJet_jll"
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0
[[dependencies]]
name = "libjulia_jll"
type = "builddependency"
version-major = 1
version-minor = 5
version-patch = 3

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["libfastjetwrap"]
type = "lib"
variable_name = "libfastjetwrap"

