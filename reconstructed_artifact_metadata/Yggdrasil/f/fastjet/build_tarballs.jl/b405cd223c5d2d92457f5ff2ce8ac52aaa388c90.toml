dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "FastJet"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11", "aarch64-apple-darwin", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11"]
script = """cd $WORKSPACE/srcdir/fastjet-*/\nexport CXXFLAGS=\"-O3 -Wall\"\nexport CFLAGS=\"-O3 -Wall\"\nif [[ \"${target}\" == *-freebsd* ]]; then\n    # Needed to fix the following errors\n    #   undefined reference to `backtrace_symbols'\n    #   undefined reference to `backtrace'\n    export LDFLAGS=\"-lexecinfo\"\nfi\nFLAGS=()\nif [[ \"${target}\" == *-mingw* ]]; then\n    # This is needed in order to build the shared library on Windows when we get\n    #   libtool: warning: undefined symbols not allowed in x86_64-w64-mingw32 shared libraries; building static only\n    FLAGS+=(LDFLAGS=\"-no-undefined\")\nfi\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --disable-auto-ptr --disable-static\nmake -j ${nprocs} \"${FLAGS[@]}\"\nmake install\ntail -n 340 COPYING > LICENSE\ninstall_license LICENSE\ncp include/fastjet/config_win.h ${includedir}/fastjet/\n\ncd $WORKSPACE/srcdir/fjcontrib-*/\nfor name in ClusteringVetoPlugin ConstituentSubtractor EnergyCorrelator FlavorCone GenericSubtractor JetCleanser JetFFMoments JetsWithoutJets LundPlane Nsubjettiness QCDAwarePlugin RecursiveTools ScJet SoftKiller SubjetCounting ValenciaPlugin VariableR\ndo\n    cd $name\n    rm example*\n    c++ -fPIC -shared -I${includedir} -O3 -Wall ${LDFLAGS} [A-Z]*.cc -o \"${libdir}/lib${name}.${dlext}\" -lfastjet -lfastjettools\n    cp [A-Z]*.hh ${includedir}/fastjet\n    cd ..\ndone\n"""
version = "v3.4.0"

