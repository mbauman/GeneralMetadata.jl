augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Poppler"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """macos_sdk_version=14.5\nmacosx_deployment_target=11\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    # extract the tarball into the sys-root so all compilers pick it up\n    # automatically, and use --warning=no-unknown-keyword to hide harmless\n    # warnings about unsupported pax header keywords like \"SCHILY.fflags\"\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        --warning=no-unknown-keyword \\\n        MacOSX${macos_sdk_version}.sdk/System \\\n        MacOSX${macos_sdk_version}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd ${WORKSPACE}/srcdir/poppler-*\n\napk del cmake\n\nif [[ \"${target}\" == \"${MACHTYPE}\" ]]; then\n    # When building for the host platform, the system libexpat is picked up\n    rm /usr/lib/libexpat.so*\nfi\n\nexport PATH=${host_bindir}:${PATH}\n\n# cmake doesn't find FreeType2 without help\nexport FREETYPE_DIR=${prefix}\n\ncmake -B build -G Ninja \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_CPP_TESTS=OFF \\\n    -DBUILD_GTK_TESTS=OFF \\\n    -DBUILD_MANUAL_TESTS=OFF \\\n    -DBUILD_QT5_TESTS=OFF \\\n    -DBUILD_QT6_TESTS=OFF \\\n    -DENABLE_BOOST=OFF \\\n    -DENABLE_CMS=lcms2 \\\n    -DENABLE_GLIB=ON \\\n    -DENABLE_GPGME=OFF \\\n    -DENABLE_NSS3=OFF \\\n    -DENABLE_QT5=OFF \\\n    -DENABLE_QT6=OFF \\\n    -DENABLE_UNSTABLE_API_ABI_HEADERS=ON \\\n    -DWITH_GObjectIntrospection=OFF\ncmake --build build --parallel ${nproc}\ncmake --install build\n"""
version = "v25.10.0"

