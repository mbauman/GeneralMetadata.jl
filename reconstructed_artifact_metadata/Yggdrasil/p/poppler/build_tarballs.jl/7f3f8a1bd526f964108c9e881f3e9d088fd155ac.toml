name = "Poppler"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd ${WORKSPACE}/srcdir/poppler-*\n\nif [[ \"${target}\" == \"${MACHTYPE}\" ]]; then\n    # When building for the host platform, the system libexpat is picked up\n    rm /usr/lib/libexpat.so*\nfi\n\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    pushd ${WORKSPACE}/srcdir/MacOSX10.*.sdk\n    rm -rf /opt/${target}/${target}/sys-root/System\n    cp -ra usr/* \"/opt/${target}/${target}/sys-root/usr/.\"\n    cp -ra System \"/opt/${target}/${target}/sys-root/.\"\n    export MACOSX_DEPLOYMENT_TARGET=10.14\n    popd\nfi\n\nexport PATH=${host_bindir}:${PATH}\n\n# cmake doesn't find FreeType2 without help\nexport FREETYPE_DIR=${prefix}\n\ncmake -B build -G Ninja \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_CPP_TESTS=OFF \\\n    -DBUILD_GTK_TESTS=OFF \\\n    -DBUILD_MANUAL_TESTS=OFF \\\n    -DBUILD_QT5_TESTS=OFF \\\n    -DBUILD_QT6_TESTS=OFF \\\n    -DENABLE_BOOST=OFF \\\n    -DENABLE_CMS=lcms2 \\\n    -DENABLE_GLIB=ON \\\n    -DENABLE_GPGME=OFF \\\n    -DENABLE_NSS3=OFF \\\n    -DENABLE_QT5=OFF \\\n    -DENABLE_QT6=OFF \\\n    -DENABLE_UNSTABLE_API_ABI_HEADERS=ON \\\n    -DWITH_GObjectIntrospection=OFF\ncmake --build build --parallel ${nproc}\ncmake --install build\n"""
version = "v24.6.0"

