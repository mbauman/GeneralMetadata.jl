julia_compat = "1.6"
lazy_artifacts = false
name = "Poppler"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11", "aarch64-apple-darwin"]
script = """cd $WORKSPACE/srcdir/poppler-*/\n\nexport CXXFLAGS=\"-I${prefix}/include/openjpeg-2.3\"\n\nif [[ \"${target}\" == \"${MACHTYPE}\" ]]; then\n    # When building for the host platform, the system libexpat is picked up\n    rm /usr/lib/libexpat.so*\nfi\n\nmkdir build && cd build\ncmake -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_GTK_TESTS=OFF \\\n    -DENABLE_CMS=lcms2 \\\n    -DENABLE_GLIB=ON \\\n    -DENABLE_QT5=OFF \\\n    -DENABLE_BOOST=OFF \\\n    -DENABLE_UNSTABLE_API_ABI_HEADERS=ON \\\n    -DWITH_GObjectIntrospection=OFF \\\n    ..\nmake -j${nproc}\nmake install\n"""
version = "v21.9.0"

