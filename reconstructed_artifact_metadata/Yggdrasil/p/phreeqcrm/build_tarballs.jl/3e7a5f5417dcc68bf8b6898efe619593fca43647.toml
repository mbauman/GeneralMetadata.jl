name = "PhreeqcRM"
platforms = ["i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "armv6l-linux-gnueabihf-libgfortran4", "armv6l-linux-gnueabihf-libgfortran5", "armv7l-linux-gnueabihf-libgfortran4", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran4", "powerpc64le-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran4", "aarch64-linux-musl-libgfortran5", "armv6l-linux-musleabihf-libgfortran4", "armv6l-linux-musleabihf-libgfortran5", "armv7l-linux-musleabihf-libgfortran4", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin-libgfortran4", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran4", "x86_64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran4", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran4", "x86_64-w64-mingw32-libgfortran5"]
script = """\n# so we can use a newer version of cmake\napk del cmake\n\ncd $WORKSPACE/srcdir/phreeqcrm\n\n# Configure\ncmake -B Release \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DPHREEQCRM_BUILD_MPI=OFF \\\n    -DPHREEQCRM_USE_ZLIB=OFF \\\n    -DPHREEQCRM_DISABLE_OPENMP=OFF\n\n# Compile\ncmake --build Release --parallel ${nproc}\n\n# Compile tests\ncd Release/Tests\nmake all\ncd ../..\n\n# Deploy library\ninstall -Dvm 755 \"Release/libPhreeqcRM.${dlext}\" -t \"${libdir}\"\n\n# Deploy test executables\ninstall -Dvm 755 \"Release/libPhreeqcRM.${dlext}\" -t \"${libdir}\"\ninstall -Dvm 755 \"Release/Tests/TestBMIdtor${exeext}\" -t \"${bindir}\"\ninstall -Dvm 755 \"Release/Tests/TestRM${exeext}\" -t \"${bindir}\"\ninstall -Dvm 755 \"Release/Tests/TestRMdtor${exeext}\" -t \"${bindir}\"\n\n# Store header files\ncp irm_dll_export.h.in src/irm_dll_export.h\ninstall -Dvm 644 src/*.h -t \"${includedir}\"\ninstall -Dvm 644 src/IPhreeqcPhast/IPhreeqc/*.h -t \"${includedir}\"\n\n# Store databases\ninstall -Dvm 644 database/*.dat -t \"${prefix}/share/phreeqcrm/database\"\ninstall -Dvm 644 Release/Tests/*.pqi -t \"${prefix}/share/phreeqcrm/test_input\"\ninstall -Dvm 644 Release/Tests/phreeqc.dat -t \"${prefix}/share/phreeqcrm/test_input\"\ninstall_license LICENSE\n\n"""
version = "v3.8.2"

