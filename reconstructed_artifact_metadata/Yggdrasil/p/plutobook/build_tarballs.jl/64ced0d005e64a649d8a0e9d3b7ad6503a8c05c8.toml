augment_platform_block = ""
init_block = ""
julia_compat = "1.10"
lazy_artifacts = false
name = "PlutoBook"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/plutobook/\n\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    rm -rf /opt/${target}/${target}/sys-root/System /opt/${target}/${target}/sys-root/usr/include/libxml2\n    tar --extract --file=${WORKSPACE}/srcdir/MacOSX14.5.tar.xz --directory=\"/opt/${target}/${target}/sys-root/.\" --strip-components=1 MacOSX14.5.sdk/System MacOSX14.5.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=14.5\nfi\n\nmkdir build\ncd build/\nmeson setup .. --cross-file=${MESON_TARGET_TOOLCHAIN} --buildtype=release\nninja -j${nproc}\nninja install\n\ninstall_license ${WORKSPACE}/srcdir/plutobook/LICENSE\n"""
version = "v0.9.0"

