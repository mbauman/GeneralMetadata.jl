dependencies = []
name = "PCRE"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/pcre-*/\n./configure --prefix=$prefix --host=$target --enable-utf8 --enable-unicode-properties\nmake -j${nproc} VERBOSE=1\nmake install VERBOSE=1\n"""
version = "v8.42.0"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libpcre"]
type = "lib"
variable_name = "libpcre"

