dependencies = []
lazy_artifacts = false
name = "PCRE2"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/pcre2-*/\n\n# Update configure scripts\nupdate_configure_scripts\n\n# Force optimization\nexport CFLAGS=\"${CFLAGS} -O3\"\n\n./configure --prefix=${prefix} --host=${target} \\\n    --disable-static \\\n    --enable-utf \\\n    --enable-unicode-properties \\\n    --enable-jit \\\n    --enable-pcre2-16 \\\n    --enable-pcre2-32\n\nmake -j${nproc}\nmake install\n\n# On windows we need libcpre2-8.dll as well\nif [[ ${target} == *mingw* ]]; then\n    ln -s libpcre2-8-0.dll  ${libdir}/libpcre2-8.dll\n    ln -s libpcre2-16-0.dll ${libdir}/libpcre2-16.dll\n    ln -s libpcre2-32-0.dll ${libdir}/libpcre2-32.dll\nfi\n"""
version = "v10.34.0"

