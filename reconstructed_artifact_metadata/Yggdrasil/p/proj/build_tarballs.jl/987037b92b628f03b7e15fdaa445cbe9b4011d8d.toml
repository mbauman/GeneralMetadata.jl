julia_compat = "1.0"
lazy_artifacts = false
name = "PROJ"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/proj-*/\n\n# sqlite needed to build proj.db, so this should not be the\n# cross-compiled one since it needs to be executed on the host\napk add sqlite\n# Get rid of target sqlite3, to avoid it's picked up by the build system\nrm \"${bindir}/sqlite3${exeext}\"\n\nif [[ ${target} == *mingw* ]]; then\n    SQLITE3_LIBRARY=${libdir}/libsqlite3-0.dll\n    CURL_LIBRARY=${libdir}/libcurl-4.dll\n    TIFF_LIBRARY_RELEASE=${libdir}/libtiff-5.dll\nelse\n    SQLITE3_LIBRARY=${libdir}/libsqlite3.${dlext}\n    CURL_LIBRARY=${libdir}/libcurl.${dlext}\n    TIFF_LIBRARY_RELEASE=${libdir}/libtiff.${dlext}\nfi\n\nmkdir build\ncd build\ncmake -DCMAKE_INSTALL_PREFIX=$prefix \\\n      -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DBUILD_SHARED_LIBS=ON \\\n      -DBUILD_TESTING=OFF \\\n      -DSQLITE3_INCLUDE_DIR=$prefix/include \\\n      -DSQLITE3_LIBRARY=$SQLITE3_LIBRARY \\\n      -DCURL_INCLUDE_DIR=$prefix/include \\\n      -DCURL_LIBRARY=$CURL_LIBRARY \\\n      -DTIFF_INCLUDE_DIR=$prefix/include \\\n      -DTIFF_LIBRARY_RELEASE=$TIFF_LIBRARY_RELEASE \\\n      ..\nmake -j${nproc}\nmake install\n"""
version = "v7.2.1"

