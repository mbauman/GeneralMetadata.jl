init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "PTSCOTCH"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/scotch*\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/native_build.patch\"\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/Makefile.patch\"\nif [[ \"${target}\" == *apple* || \"${target}\" == *freebsd* ]]; then\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/OSX_FreeBSD.patch\"\nfi\nif [[ \"${target}\" == *mingw* ]]; then\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/Windows.patch\"\nfi\ncd src\nmake ptscotch\nmake ptesmumps\ncp ../lib/libpt* ${libdir}\ncp ../include/p* ${includedir}\ninstall_license ../LICENSE_en.txt\n"""
version = "v6.1.3"

