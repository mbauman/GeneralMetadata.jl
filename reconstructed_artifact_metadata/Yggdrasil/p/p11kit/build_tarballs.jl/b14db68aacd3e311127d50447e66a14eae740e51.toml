julia_compat = "1.6"
lazy_artifacts = false
name = "P11Kit"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/p11-kit-*\n\n# Update our compiler wrappers.\n# (This prevents compiler warnings that are later treated as errors.)\n# - Only pass linker arguments when linking.\nif [[ ${target} = aarch64-apple-darwin* ]]; then\n    pushd /\n    atomic_patch -p0 ${WORKSPACE}/srcdir/patches/aarch64-apple-clang.patch\n    popd\nfi\nif [[ ${target} = x86_64-apple-darwin* ]]; then\n    pushd /\n    atomic_patch -p0 ${WORKSPACE}/srcdir/patches/x86_64-apple-clang.patch\n    popd\nfi\n\nmeson setup --cross-file=\"${MESON_TARGET_TOOLCHAIN}\" --buildtype=release builddir\nmeson compile -C builddir\nmeson install -C builddir\n"""
version = "v0.25.5"

