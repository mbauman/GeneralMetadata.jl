lazy_artifacts = false
name = "Pango"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/pango-*/\n\n# Remove misleading libtool files\nrm -f ${prefix}/lib/*.la\n\n# Be able to find libffi on ppc64le\nif [[ ${target} == powerpc64le* ]]; then\n    export LDFLAGS=\"${LDFLAGS} -Wl,-rpath-link,${prefix}/lib64\"\nfi\n\n./configure --prefix=$prefix --host=$target \\\n    --disable-introspection \\\n    --disable-gtk-doc-html\n\n# The generated Makefile tries to build some examples in the \"tests\" directory,\n# but this would fail for some unknown reasons.  Let's skip it.\nsed -i 's/^\\(SUBDIRS = .*\\) tests/\\1/' Makefile\nmake -j${nproc}\nmake install\n"""
version = "v1.42.4"

