augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Pango"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """\napk add glib-dev\n\ncd $WORKSPACE/srcdir/pango*\n\nif [[ \"${target}\" == \"${MACHTYPE}\" ]]; then\n    # When building for the host platform, the system libexpat is picked up\n    rm /usr/lib/libexpat.so*\nfi\n\n# If we want libpangoft2 on Windows we need to explicitly enable fontconfig and freetype\n# See <https://gitlab.gnome.org/GNOME/pango/-/blob/main/README.win32.md>.\n\n# We need a newer meson\npython3 -m pip install --upgrade meson\n\n# Fix target toolchain (required by meson 1.11)\nif [[ ${target} == *darwin* ]]; then\n    sed -i \"/\\[host_machine\\]/,/^$/ s/system = 'darwin'/system = 'darwin'\\nsubsystem = 'macos'/\" \"$MESON_TARGET_TOOLCHAIN\"\nfi\n\nmeson setup build \\\n    --cross-file=\"${MESON_TARGET_TOOLCHAIN}\" \\\n    -Dintrospection=disabled \\\n    -Dfontconfig=enabled \\\n    -Dfreetype=enabled\nninja -C build -j${nproc}\nninja -C build install\n\ninstall_license COPYING\n"""
version = "v1.57.1"

