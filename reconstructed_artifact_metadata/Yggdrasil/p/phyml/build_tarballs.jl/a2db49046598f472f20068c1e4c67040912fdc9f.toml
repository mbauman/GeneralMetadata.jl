augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "PhyML"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/phyml\ninstall_license ${WORKSPACE}/srcdir/phyml/COPYING\n\n# disable -march=native flag\nfor f in ${WORKSPACE}/srcdir/patches/*.patch; do\n    atomic_patch -p1 ${f}\ndone    \n\n# generate config scripts\n./autogen.sh\n\n# make single-process version \nac_cv_func_malloc_0_nonnull=yes \\\nac_cv_func_realloc_0_nonnull=yes \\\n./configure --enable-phyml --prefix=$prefix --build=${MACHTYPE} --host=${target}\nmake clean & make -j${nproc}\ninstall -Dvm 755 ./src/phyml${exeext} ${bindir}/phyml${exeext}\n\n# make MPI version\n\nif [[ \"$target\" == *-mingw* ]]; then\n    COMPILER=${target}-gcc\n    EXTRALIBS=\"-lmsmpi -I${includedir} -L${libdir}\"\nelse \n    COMPILER=mpicc\n    EXTRALIBS=\"\" \nfi\n\nac_cv_func_malloc_0_nonnull=yes \\\nac_cv_func_realloc_0_nonnull=yes \\\n./configure --enable-phyml-mpi --prefix=$prefix --build=${MACHTYPE} --host=${target}\nmake clean & make -j${nproc} CC=$COMPILER LIBS=\"${EXTRALIBS}\"\ninstall -Dvm 755 ./src/phyml-mpi${exeext} ${bindir}/phymlMPI${exeext}\n"""
version = "v3.3.20210609"

