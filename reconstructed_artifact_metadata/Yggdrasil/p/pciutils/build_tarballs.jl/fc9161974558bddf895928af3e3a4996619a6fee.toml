augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "pciutils"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-unknown-freebsd"]
script = """cd pciutils\nFLAGS=(\n    PREFIX=${prefix}\n    SHARED=yes\n    SBINDIR=${bindir}\n    CFLAGS='-std=gnu99 -fPIC -O2 -Wall'\n    -j${nproc}\n)\nmake \"${FLAGS[@]}\" install\nmake \"${FLAGS[@]}\" install-lib\n"""
version = "v3.12.0"

[[products]]
binnames = ["lspci"]
type = "exe"
variable_name = "lspci"
[[products]]
binnames = ["setpci"]
type = "exe"
variable_name = "setpci"
[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["libpci"]
type = "lib"
variable_name = "libpci"

