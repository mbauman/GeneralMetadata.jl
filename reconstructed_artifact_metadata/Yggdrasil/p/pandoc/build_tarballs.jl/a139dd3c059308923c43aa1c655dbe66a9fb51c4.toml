lazy_artifacts = false
name = "pandoc"
platforms = ["x86_64-linux-gnu", "x86_64-apple-darwin14", "x86_64-w64-mingw32", "i686-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/\nmkdir -p \"${bindir}\"\nif [[ \"${target}\" != *-mingw* ]]; then\n    subdir=\"bin/\"\nfi\ncp ${target}/pandoc-*/${subdir}pandoc${exeext} ${bindir}\ncp ${target}/pandoc-*/${subdir}pandoc-citeproc${exeext} ${bindir}\nchmod +x ${bindir}/*\ninstall_license COPYRIGHT\ninstall_license COPYING.md\n"""
version = "v2.9.2"

[[dependencies]]
name = "Zlib_jll"
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0
[[dependencies]]
name = "Libiconv_jll"
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0

[[products]]
binnames = ["pandoc"]
type = "exe"
variable_name = "pandoc"
[[products]]
binnames = ["pandoc-citeproc"]
type = "exe"
variable_name = "pandoc_citeproc"

