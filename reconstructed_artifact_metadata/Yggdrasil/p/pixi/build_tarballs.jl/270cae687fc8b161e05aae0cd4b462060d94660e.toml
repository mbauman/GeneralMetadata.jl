augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = true
name = "pixi"
platforms = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-w64-mingw32", "aarch64-linux-gnu", "x86_64-linux-gnu"]
script = """cd $WORKSPACE/srcdir\n\n# unpack and install the binary\nif [[ $target = *-w64-* ]]; then\n    unzip pixi-$target.zip\nelse\n    tar -xzf pixi-$target.tar.gz\nfi\ninstall -Dvm 755 \"pixi${exeext}\" -t \"${bindir}\"\n\n# install the license\ninstall_license repo/pixi/LICENSE\n"""
version = "v0.63.2"

[[products]]
binnames = ["pixi"]
type = "exe"
variable_name = "pixi"

