augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = true
name = "pixi"
platforms = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-w64-mingw32", "aarch64-linux-gnu", "x86_64-linux-gnu", "x86_64-linux-musl", "powerpc64le-linux-gnu"]
script = """cd pixi\n\n# not enough space in /tmp\nexport TMPDIR=$WORKSPACE/tmp\nmkdir $TMPDIR\n\n# the stack-size arg is wrong on windows, because we're using mingw not msvc\nsed -i 's|/STACK:|-Wl,--stack,|' .cargo/config.toml\n\n# build pixi\ncargo build --release\n\n# install pixi\ninstall -Dvm 755 \"target/${rust_target}/release/pixi${exeext}\" \"${bindir}/pixi${exeext}\"\n"""
version = "v0.41.3"

[[products]]
binnames = ["pixi"]
type = "exe"
variable_name = "pixi"

