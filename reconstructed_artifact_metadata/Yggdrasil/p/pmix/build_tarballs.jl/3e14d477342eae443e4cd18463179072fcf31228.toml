augment_platform_block = ""
init_block = """ENV[\"PMIX_PREFIX\"] = artifact_dir\n"""
julia_compat = "1.6"
lazy_artifacts = false
name = "PMIx"
platforms = ["x86_64-linux-gnu", "aarch64-linux-gnu", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "x86_64-linux-musl", "aarch64-linux-musl", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/pmix-*\nif [[ ${target} == *-musl* ]]; then\n   # Help configure find installed packages\n   export CPPFLAGS=-I${includedir}\nelif [[ ${target} == *bsd* ]]; then\n    # nonstandard pthread extensions live in a different header on some BSDs.\n    atomic_patch -p1 ${WORKSPACE}/srcdir/nonstandard_pthreads.patch\nfi\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} \\\n    --enable-shared \\\n    --with-hwloc=${prefix} \\\n    --with-libevent=${prefix} \\\n    --with-zlib=${prefix} \\\n    --without-tests-examples \\\n    --disable-man-pages\nmake -j${nproc}\nmake install\ninstall_license LICENSE\n"""
version = "v6.0.0"

