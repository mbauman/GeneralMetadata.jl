platforms = ["x86_64-linux-gnu", "aarch64-linux-gnu", "powerpc64le-linux-gnu", "x86_64-linux-musl", "aarch64-linux-musl", "x86_64-apple-darwin", "aarch64-apple-darwin"]
script = """cd $WORKSPACE/srcdir/pmix-*\nif [[ ${target} == *-musl* ]]; then\n   # Help configure find installed packages\n   export CPPFLAGS=-I${includedir}\nfi\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} \\\n    --enable-shared \\\n    --with-hwloc=${prefix} \\\n    --with-libevent=${prefix} \\\n    --with-zlib=${prefix} \\\n    --without-tests-examples \\\n    --disable-man-pages\nmake -j${nproc}\nmake install\ninstall_license LICENSE\n"""
