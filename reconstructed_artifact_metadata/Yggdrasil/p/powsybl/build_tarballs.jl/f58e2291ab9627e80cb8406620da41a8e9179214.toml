name = "Powsybl"
platforms = ["x86_64-linux-gnu-cxx11-julia_version+1.10.0", "x86_64-linux-musl-cxx11-julia_version+1.10.0", "x86_64-apple-darwin-julia_version+1.10.0", "aarch64-apple-darwin-julia_version+1.10.0", "x86_64-w64-mingw32-cxx11-julia_version+1.10.0", "x86_64-linux-gnu-cxx11-julia_version+1.11.1", "x86_64-linux-musl-cxx11-julia_version+1.11.1", "x86_64-apple-darwin-julia_version+1.11.1", "aarch64-apple-darwin-julia_version+1.11.1", "x86_64-w64-mingw32-cxx11-julia_version+1.11.1", "x86_64-linux-gnu-cxx11-julia_version+1.12.0", "x86_64-linux-musl-cxx11-julia_version+1.12.0", "x86_64-apple-darwin-julia_version+1.12.0", "aarch64-apple-darwin-julia_version+1.12.0", "x86_64-w64-mingw32-cxx11-julia_version+1.12.0", "x86_64-linux-gnu-cxx11-julia_version+1.13.0", "x86_64-linux-musl-cxx11-julia_version+1.13.0", "x86_64-apple-darwin-julia_version+1.13.0", "aarch64-apple-darwin-julia_version+1.13.0", "x86_64-w64-mingw32-cxx11-julia_version+1.13.0", "x86_64-linux-gnu-cxx11-julia_version+1.14.0", "x86_64-linux-musl-cxx11-julia_version+1.14.0", "x86_64-apple-darwin-julia_version+1.14.0", "aarch64-apple-darwin-julia_version+1.14.0", "x86_64-w64-mingw32-cxx11-julia_version+1.14.0"]
script = """cd $WORKSPACE/srcdir\n\n# Get binary for powsybl-java, generated with GraalVm, install them in ${prefix} path\ncp -rv powsybl-java-${target}/* ${prefix}\n\ncd $WORKSPACE/srcdir/pypowsybl/cpp\ncmake -B build \\\n    ${WORKSPACE}/srcdir/pypowsybl/cpp \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DBUILD_PYPOWSYBL_JAVA=OFF \\\n    -DBUILD_PYTHON_BINDINGS=OFF \\\n    -DPYPOWSYBL_JAVA_LIBRARY_DIR=${prefix}/lib \\\n    -DPYPOWSYBL_JAVA_INCLUDE_DIR=${prefix}/include \\\n    -DCMAKE_INSTALL_PREFIX=${prefix}\ncmake --build build --parallel ${nproc}\ncmake --install build\n\n# Build julia wrapper\ncd $WORKSPACE/srcdir/powsybl.jl\ncmake -B build \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    cpp/powsybljl-cpp \\\n    -DJulia_PREFIX=${prefix} \\\n    -DJlCxx_DIR=${prefix}/lib/cmake/JlCxx \\\n    -DCMAKE_FIND_ROOT_PATH=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_PREFIX_PATH=${prefix} \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DPOWSYBL_INSTALL_DIR=${prefix}\ncmake --build build --parallel ${nproc}\ncmake --install build\n\ninstall_license $WORKSPACE/srcdir/powsybl.jl/LICENSE.md\n"""
version = "v0.3.0"

