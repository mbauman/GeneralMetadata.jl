lazy_artifacts = false
name = "PARMETIS"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1"]
script = """mkdir -p ${libdir}\ncd $WORKSPACE/srcdir/parmetis-4.0.3\n\nfor f in ${WORKSPACE}/srcdir/patches/*.patch; do\n  atomic_patch -p1 ${f}\ndone\n\ncd build\ncmake .. \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DSHARED=1 \\\n    -DGKLIB_PATH=$(realpath ../metis/GKlib) \\\n    -DMETIS_PATH=$(realpath ../metis) \\\n    -DMPI_INCLUDE_PATH=\"${prefix}/include\" \\\n    -DMPI_LIBRARIES=\"mpi\"\nmake -j${nproc}\nmake install\n"""
version = "v4.0.3"

