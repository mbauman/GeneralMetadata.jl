name = "PDAL"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """\ncd $WORKSPACE/srcdir/PDAL*\n\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    # Install a newer SDK which supports `std::filesystem`, taken from HELICS build_tarballs.jl\n    pushd $WORKSPACE/srcdir/MacOSX10.*.sdk\n    rm -rf /opt/${target}/${target}/sys-root/System\n    cp -ra usr/* \"/opt/${target}/${target}/sys-root/usr/.\"\n    cp -ra System \"/opt/${target}/${target}/sys-root/.\"\n    popd\n    export MACOSX_DEPLOYMENT_TARGET=10.15\nfi\n\nmkdir -p build/dimbuilder && cd build/dimbuilder\n\n# Build dimbuilder with the host compiler before main library.\n#see also https://github.com/conda-forge/pdal-feedstock/blob/main/recipe/build.sh\n(\n    cmake ../../dimbuilder -G Ninja \\\n        -DCMAKE_TOOLCHAIN_FILE=${CMAKE_HOST_TOOLCHAIN} \\\n        -DNLOHMANN_INCLUDE_DIR=\"$(realpath ../../vendor/nlohmann)\" \\\n        -DUTFCPP_INCLUDE_DIR=\"$(realpath ../../vendor/utfcpp/source)\" \\\n        -DCMAKE_BUILD_TYPE=Release\n    ninja -j${nproc}\n)\n\n#make sure we're back in source dir\ncd $WORKSPACE/srcdir/PDAL*\ncd build\n\ncmake .. -G Ninja \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_LIBRARY_PATH:FILEPATH=\"${libdir}\" \\\n    -DCMAKE_INCLUDE_PATH:FILEPATH=\"${includedir}\" \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DDIMBUILDER_EXECUTABLE=\"$WORKSPACE/srcdir/PDAL/build/dimbuilder/dimbuilder\" \\\n    -DBUILD_PLUGIN_I3S=OFF \\\n    -DBUILD_PLUGIN_NITF=OFF \\\n    -DBUILD_PLUGIN_TILEDB=OFF \\\n    -DBUILD_PLUGIN_ICEBRIDGE=OFF \\\n    -DBUILD_PLUGIN_HDF=OFF \\\n    -DBUILD_PLUGIN_PGPOINTCLOUD=OFF \\\n    -DBUILD_PLUGIN_E57=OFF \\\n    -DBUILD_PGPOINTCLOUD_TESTS=OFF \\\n    -DBUILD_PGPOINTCLOUD_TESTS=OFF \\\n    -DWITH_ZSTD=ON \\\n    -DWITH_ZLIB=ON \\\n    -DWITH_TESTS=OFF\n\nninja -j${nproc}\nninja install\n"""
version = "v2.6.3"

