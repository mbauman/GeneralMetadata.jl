name = "PHYLIP"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/phylip-*/\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/windows_fixes.patch\"\n\nmkdir -p ${bindir} ${libdir}\n\ncd $WORKSPACE/srcdir/phylip-*/src/\n\nif [[ \"${bb_target}\" == *apple* ]]; then\n    make CC=\"${CC}\" -f Makefile.osx install\n    mv ../exe/lib* ${libdir}/\n    mv ../exe/* ${bindir}/\nelif [[ \"${bb_target}\" == *mingw* ]]; then\n    make CC=\"${CC}\" -f Makefile.cyg install\n    mv ../source/*.dll ${libdir}/\n    mv ../source/* ${bindir}/\nelse\n    make CC=\"${CC}\" -f Makefile.unx install\n    mv ../exe/lib* ${libdir}/\n    mv ../exe/* ${bindir}/\nfi\n\ninstall_license COPYRIGHT\n"""
version = "v3.697.0"

