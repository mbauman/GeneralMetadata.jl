augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "POMDPSolve"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\ncd pomdp-solve/\n\nautoreconf -f -i\n\n./configure --prefix=${prefix} --exec_prefix=${prefix} --build=${MACHTYPE} --host=${target}\n\nmake -j${nprocs}\n\nmake install\n\ninstall_license COPYING\n"""
version = "v5.4.1"

[[products]]
binnames = ["pomdp-tools"]
type = "exe"
variable_name = "pomdptools"
[[products]]
binnames = ["pomdp-solve"]
type = "exe"
variable_name = "pomdpsolve"
[[products]]
binnames = ["pomdp-test"]
type = "exe"
variable_name = "pomdptest"
[[products]]
binnames = ["pomdp-fg"]
type = "exe"
variable_name = "pomdpfg"

