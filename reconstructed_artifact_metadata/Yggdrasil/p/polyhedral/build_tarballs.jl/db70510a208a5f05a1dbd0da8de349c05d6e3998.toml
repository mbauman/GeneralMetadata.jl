julia_compat = "1.6"
lazy_artifacts = false
name = "polyhedral"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd polyhedral_common\ngit submodule update --init --recursive\ncd src_export_oscar\nexport GMP_INCDIR=$includedir\nexport GMP_C_LINK=\"-L$libdir -lgmp\"\n\nexport BOOST_INCDIR=$includedir\nexport BOOST_LINK=\"-L$libdir -lboost_serialization\"\n\nexport EIGEN_PATH=$includedir/eigen3\n\nexport NAUTY_INCLUDE=\"-I$includedir/nauty\"\nexport NAUTY_LINK=\"-L$libdir -lnauty\"\n\nmake\n\ncp GRP_LinPolytope_Automorphism $bindir\ncp GRP_ListMat_Subset_EXT_Isomorphism $bindir\ncp GRP_LinPolytope_Automorphism_GramMat $bindir\ncp GRP_LinPolytope_Isomorphism_GramMat $bindir\ncp GRP_ListMat_Subset_EXT_Automorphism $bindir\ncp GRP_ListMat_Subset_EXT_Invariant $bindir\ncp POLY_dual_description_group $bindir\ncp POLY_cdd_LinearProgramming $bindir\ncp POLY_sampling_facets $bindir\ncp LATT_Automorphism $bindir\ncp LATT_Isomorphism $bindir\ncp IndefiniteReduction $bindir\ncp sv_near $bindir\n"""
version = "v0.2.0"

