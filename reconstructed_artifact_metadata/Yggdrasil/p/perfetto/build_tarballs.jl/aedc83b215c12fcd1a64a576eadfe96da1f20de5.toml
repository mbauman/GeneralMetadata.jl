name = "perfetto"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx03", "riscv64-linux-gnu-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11", "aarch64-apple-darwin"]
script = """apk del cmake\ncd $WORKSPACE/srcdir/perfetto\natomic_patch -p1 ../shared_lib.patch\natomic_patch -p1 ../perfetto_mingw.patch\natomic_patch -p1 ../header_mingw.patch\n\nmkdir build && cd build\nmeson setup .. --cross-file=\"${MESON_TARGET_TOOLCHAIN}\" --buildtype=release\nninja -j${nproc}\nninja install\ninstall -Dvm 644 ../sdk/perfetto.h \"${includedir}/perfetto.h\"\ninstall_license ../LICENSE\n"""
version = "v51.2.0"

