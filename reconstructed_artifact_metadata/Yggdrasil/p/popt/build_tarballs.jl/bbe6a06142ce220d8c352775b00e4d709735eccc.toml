name = "Popt"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir\ncd popt-*\n\nif [[ $target = *-mingw32* ]]; then\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/get-w32-console-maxcols.mingw32.patch\"\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/no-uid-stuff-on.mingw32.patch\"\nfi\n\nLIBS=\nif [[ ${target} = *-musl* ]]; then\n    LIBS='-liconv'\nfi\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --disable-static LIBS=\"${LIBS}\"\nmake -j${nproc}\nmake install\ninstall_license COPYING\n"""
version = "v1.19.0"

