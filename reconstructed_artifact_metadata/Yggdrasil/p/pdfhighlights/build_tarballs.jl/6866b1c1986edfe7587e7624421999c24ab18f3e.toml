init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "PDFHighlights"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/PDFHighlights.jl/deps/\n\nCC=\"gcc\"\nLIB_NAME=\"PDFHighlightsWrapper\"\nOBJECTS=(get_author_title get_lines_comments_pages)\n\nOBJECTS_O=()\nfor index in ${!OBJECTS[@]}; do\n    OBJECTS_O[${index}]=${OBJECTS[${index}]}.o\ndone\n\nINCLUDE_FLAGS=\"`pkg-config --cflags poppler-glib`\"\nLINK_FLAGS=\"-lgio-2.0 `pkg-config --libs poppler-glib`\"\n\nif [[ \"${target}\" == *-darwin* ]]; then\n    OBJ_FLAGS=\"-std=c99 -O3 -fPIC\"\n    LIB_FLAGS=\"-shared\"\nelif [[ \"${target}\" == *-mingw* ]]; then\n    OBJ_FLAGS=\"-std=c99 -O3\"\n    LIB_FLAGS=\"-shared\"\n    LINK_FLAGS=\"${LINK_FLAGS} -Wl,--out-implib,${prefix}/lib/${LIB_NAME}.dll.a\"\nelse\n    OBJ_FLAGS=\"-std=c99 -O3 -fPIC\"\n    LIB_FLAGS=\"-shared -Wl,--no-undefined\"\nfi\n\nfor file in ${OBJECTS[@]}; do\n    ${CC} ${OBJ_FLAGS} -c ${file}.c -o ${file}.o ${INCLUDE_FLAGS}\ndone\n\n${CC} ${LIB_FLAGS} -o ${libdir}/${LIB_NAME}.${dlext} ${OBJECTS_O[@]} ${LINK_FLAGS}\n"""
version = "v0.1.1"

[[dependencies]]
name = "Xorg_xorgproto_jll"
type = "builddependency"
version-major = 0
version-minor = 0
version-patch = 0
[[dependencies]]
name = "Poppler_jll"
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["PDFHighlightsWrapper"]
type = "lib"
variable_name = "PDFHighlightsWrapper"

