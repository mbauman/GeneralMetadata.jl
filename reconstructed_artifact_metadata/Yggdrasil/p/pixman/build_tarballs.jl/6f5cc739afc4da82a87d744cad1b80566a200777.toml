name = "Pixman"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/pixman-*/\n\n# Define `generic_blt`; see\n# <https://lists.freedesktop.org/archives/pixman/2023-February/005002.html>\n# and\n# <https://gitlab.freedesktop.org/rth7680/pixman/-/tree/general>\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/general_blt.patch\n\nargs=(--prefix=${prefix} --build=${MACHTYPE} --host=${target} --disable-static)\nif [[ ${target} == aarch64-apple-darwin* ]]; then\n    # Work around a but; see\n    # <https://lists.freedesktop.org/archives/pixman/2023-February/005002.html>\n    # and\n    # <https://gitlab.freedesktop.org/rth7680/pixman/-/tree/general>\n    args+=(--disable-arm-a64-neon --disable-arm-neon)\nfi\n\n./configure ${args[@]}\nmake -j${nproc}\nmake install\n"""
version = "v0.42.2"

