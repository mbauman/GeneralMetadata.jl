    version-patch = 0
    [[metadata.dependencies]]
    compat = ""
    name = "CUDA_full_jll"
    type = "builddependency"
    version-major = 10
    version-minor = 1
    version-patch = 243

    [[metadata.products]]
    dir_paths = []
    dlopen_flags = []
    dont_dlopen = true
    libnames = ["libscsgpuindir"]
    type = "lib"
    variable_name = "libscsgpuindir"

    [[metadata.sources]]
