[metadata]
init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "SCS_GPU"
platforms = ["x86_64-linux-gnu"]
script = """cd $WORKSPACE/srcdir/scs*\nflags=\"DLONG=0 USE_OPENMP=0 BLAS64=1 BLASSUFFIX=_64_\"\nblasldflags=\"-L${libdir} -lopenblas64_\"\n\nCUDA_PATH=$prefix/cuda make BLASLDFLAGS=\"${blasldflags}\" ${flags} out/libscsgpuindir.${dlext}\n\nmkdir -p ${libdir}\ncp out/libscs*.${dlext} ${libdir}\n"""
version = "v2.1.4"

