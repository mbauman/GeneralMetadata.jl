buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/7ccdd85cfa826a62fe60532f958c841dad0aa061/S/SCS_GPU/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
