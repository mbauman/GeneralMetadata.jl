buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/9d4bffb062f52353f6f3011e16918680e7dedb81/S/s5cmd/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.5.5"

[metadata]
augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "s5cmd"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/s5cmd/\ninstall_license LICENSE\n\nmkdir -p ${bindir}\n\n# the Makefile redefines compiler env vars, so we roll our own invocation\ngo build -o ${bindir} -mod=vendor \\\n         -ldflags \"-X=github.com/peak/s5cmd/version.Version=2.0.0 -X=github.com/peak/s5cmd/version.GitCommit=35bb2fa9ee3d31209a6c6c7de895b888bc35bfd3\"\n"""
version = "v2.0.0"

    [[metadata.products]]
    binnames = ["s5cmd"]
    type = "exe"
    variable_name = "s5cmd"

    [[metadata.sources]]
    hash = "35bb2fa9ee3d31209a6c6c7de895b888bc35bfd3"
    type = "git"
    unpack_target = ""
    url = "https://github.com/peak/s5cmd.git"
