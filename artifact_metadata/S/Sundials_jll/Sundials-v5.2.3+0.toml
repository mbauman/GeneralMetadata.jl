name = "Sundials"
platforms = ["i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran3", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "armv6l-linux-gnueabihf-libgfortran3", "armv6l-linux-gnueabihf-libgfortran4", "armv6l-linux-gnueabihf-libgfortran5", "armv7l-linux-gnueabihf-libgfortran3", "armv7l-linux-gnueabihf-libgfortran4", "armv7l-linux-gnueabihf-libgfortran5", "i686-linux-musl-libgfortran3", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran3", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran3", "aarch64-linux-musl-libgfortran4", "aarch64-linux-musl-libgfortran5", "armv6l-linux-musleabihf-libgfortran3", "armv6l-linux-musleabihf-libgfortran4", "armv6l-linux-musleabihf-libgfortran5", "armv7l-linux-musleabihf-libgfortran3", "armv7l-linux-musleabihf-libgfortran4", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin-libgfortran3", "x86_64-apple-darwin-libgfortran4", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran3", "x86_64-unknown-freebsd-libgfortran4", "x86_64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran3", "i686-w64-mingw32-libgfortran4", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran3", "x86_64-w64-mingw32-libgfortran4", "x86_64-w64-mingw32-libgfortran5"]
script = """cd $WORKSPACE/srcdir/sundials*\n\n# Don't run the KLU and LAPACK tests during build since we are in a cross compile environment\natomic_patch -p1 ../patches/Sundials_NoKLUTest.patch\natomic_patch -p1 ../patches/Sundials_NoLAPACKTest.patch\n\nif [[ ${nbits} == 64 ]]; then\n    atomic_patch -p1 $WORKSPACE/srcdir/patches/Sundials_Fortran.patch\nfi\n\n# Set up CFLAGS\nif [[ \"${target}\" == *-mingw* ]]; then\n    LAPACK_NAME=-lblastrampoline-5\n    atomic_patch -p1 ../patches/Sundials_windows.patch\n    # Work around https://github.com/LLNL/sundials/issues/29\n    export CFLAGS=\"-DBUILD_SUNDIALS_LIBRARY\"\n    # See https://github.com/LLNL/sundials/issues/35\n    atomic_patch -p1 ../patches/Sundials_lapackband.patch\n    # When looking for KLU libraries, CMake searches only for import libraries,\n    # this patch ensures we look also for shared libraries.\n    atomic_patch -p1 ../patches/Sundials_findklu_suffixes.patch\nelse\n    LAPACK_NAME=-lblastrampoline\nfi\n\n# Build\nmkdir build && cd build\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n    -DEXAMPLES_ENABLE_C=OFF \\\n    -DKLU_ENABLE=ON \\\n    -DKLU_INCLUDE_DIR=\"${includedir}/suitesparse\" \\\n    -DKLU_LIBRARY_DIR=\"${libdir}\" \\\n    -DLAPACK_ENABLE=ON \\\n    -DLAPACK_LIBRARIES:STRING=\"${LAPACK_NAME}\" \\\n    ..\nmake -j${nproc}\nmake install\n\n# Move libraries to ${libdir} on Windows\nif [[ \"${target}\" == *-mingw* ]]; then\n    mv ${prefix}/lib/libsundials_*.${dlext} \"${libdir}\"\nfi\n"""
version = "v5.2.3"

