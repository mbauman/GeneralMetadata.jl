buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/b95ae6f0bc7296e25ed966f7ae2da1bccd9d51ba/S/squashfs_tools/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.6.5"

[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "squashfs_tools"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/squashfs-tools/squashfs-tools\n\n# lseek: define SEEK_DATA if not defined by C library\n# Taken from master branch after 4.7.4 release.\natomic_patch -p2 $WORKSPACE/srcdir/patches/lseek.patch\n\nargs=(XZ_SUPPORT=1 LZO_SUPPORT=1 LZ4_SUPPORT=1 ZSTD_SUPPORT=1)\nif [[ \"${target}\" == *-mingw* ]] || [[ \"${target}\" == *-freebsd* ]]; then\n    args+=(XATTR_OS_SUPPORT=0)\nfi\n\nenv CONFIG=1 make -j${nproc} ${args[@]}\ncp mksquashfs unsquashfs ${bindir}\n"""
version = "v4.7.4"

