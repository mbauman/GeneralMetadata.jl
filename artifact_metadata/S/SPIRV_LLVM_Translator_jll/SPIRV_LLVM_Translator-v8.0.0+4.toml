buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/55777a3d0eecb57e7f1362cef33da805c20c9aa2/S/SPIRV_LLVM_Translator/SPIRV_LLVM_Translator@8/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.3.7"

[metadata]
init_block = ""
julia_compat = "~1.4"
lazy_artifacts = false
name = "SPIRV_LLVM_Translator"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd SPIRV-LLVM-Translator\ninstall_license LICENSE.TXT\n\nCMAKE_FLAGS=()\n\n# Release build for best performance\nCMAKE_FLAGS+=(-DCMAKE_BUILD_TYPE=Release)\n\n# Install things into $prefix\nCMAKE_FLAGS+=(-DCMAKE_INSTALL_PREFIX=${prefix})\n\n# Explicitly use our cmake toolchain file and tell CMake we're cross-compiling\nCMAKE_FLAGS+=(-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN})\nCMAKE_FLAGS+=(-DCMAKE_CROSSCOMPILING:BOOL=ON)\n\n# Tell CMake where LLVM is\nCMAKE_FLAGS+=(-DLLVM_DIR=\"${prefix}/lib/cmake/llvm\")\n\n# Build the library\nCMAKE_FLAGS+=(-DBUILD_SHARED_LIBS=ON)\n\ncmake -B build -S . -GNinja ${CMAKE_FLAGS[@]}\nninja -C build -j ${nproc} llvm-spirv install\ninstall -Dm755 build/tools/llvm-spirv/llvm-spirv${exeext} -t ${bindir}\n"""
version = "v8.0.0"

    [[metadata.dependencies]]
    compat = ""
    name = "LLVM_full_jll"
    type = "builddependency"
    version-major = 8
    version-minor = 0
    version-patch = 1

    [[metadata.products]]
    dir_paths = []
    dlopen_flags = []
    dont_dlopen = false
    libnames = ["libLLVMSPIRVLib", "LLVMSPIRVLib"]
    type = "lib"
    variable_name = "libLLVMSPIRV"
    [[metadata.products]]
    binnames = ["llvm-spirv"]
    type = "exe"
    variable_name = "llvm_spirv"

