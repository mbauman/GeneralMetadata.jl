name = "SCALAPACK32"
platforms = ["i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran3", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "armv6l-linux-gnueabihf-libgfortran3", "armv6l-linux-gnueabihf-libgfortran4", "armv6l-linux-gnueabihf-libgfortran5", "armv7l-linux-gnueabihf-libgfortran3", "armv7l-linux-gnueabihf-libgfortran4", "armv7l-linux-gnueabihf-libgfortran5", "i686-linux-musl-libgfortran3", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran3", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran3", "aarch64-linux-musl-libgfortran4", "aarch64-linux-musl-libgfortran5", "armv6l-linux-musleabihf-libgfortran3", "armv6l-linux-musleabihf-libgfortran4", "armv6l-linux-musleabihf-libgfortran5", "armv7l-linux-musleabihf-libgfortran3", "armv7l-linux-musleabihf-libgfortran4", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin-libgfortran3", "x86_64-apple-darwin-libgfortran4", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran3", "x86_64-unknown-freebsd-libgfortran4", "x86_64-unknown-freebsd-libgfortran5"]
script = """mkdir -p ${libdir}\ncd $WORKSPACE/srcdir/scalapack-*\n\n# the patch prevents running foreign executables, which fails on most platforms\n# we instead set CDEFS manually below\nfor f in ${WORKSPACE}/srcdir/patches/*.patch; do\n  atomic_patch -p1 ${f}\ndone\n\nCMAKE_FLAGS=(-DCMAKE_INSTALL_PREFIX=${prefix} \\\n             -DCMAKE_FIND_ROOT_PATH=${prefix} \\\n             -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n             -DCMAKE_BUILD_TYPE=Release \\\n             -DBLAS_LIBRARIES=\"-lopenblas\" \\\n             -DLAPACK_LIBRARIES=\"-lopenblas\" \\\n             -DBUILD_SHARED_LIBS=ON \\\n             -DMPIEXEC=\"${bindir}/mpirun\")\n\nif [[ \"${target}\" == i686-*  ]] || [[ \"${target}\" == x86_64-*  ]]; then\n  CMAKE_FLAGS+=(-DCMAKE_EXE_LINKER_FLAGS=\"-lgfortran -lquadmath\")\nelse\n  CMAKE_FLAGS+=(-DCMAKE_EXE_LINKER_FLAGS=\"-lgfortran\")\nfi\n\nif [[ \"${target}\" == aarch64-apple-darwin* ]]; then\n  CMAKE_FLAGS+=(-DCMAKE_Fortran_FLAGS=\"-fallow-argument-mismatch\")\nfi\n\nexport CDEFS=\"Add_\"\n\nmkdir build\ncd build\ncmake .. \"${CMAKE_FLAGS[@]}\"\n\nmake -j${nproc} all\nmake install\n\nmv -v ${libdir}/libscalapack.${dlext} ${libdir}/libscalapack32.${dlext}\n\nPATCHELF_FLAGS=()\n\n# ppc64le and aarch64 have 64KB page sizes, don't muck up the ELF section load alignment\nif [[ ${target} == aarch64-* || ${target} == powerpc64le-* ]]; then\n  PATCHELF_FLAGS+=(--page-size 65536)\nfi\n\nif [[ ${target} == *linux* ]] || [[ ${target} == *freebsd* ]]; then\n  patchelf ${PATCHELF_FLAGS[@]} --set-soname libscalapack32.${dlext} ${libdir}/libscalapack32.${dlext}\nelif [[ ${target} == *apple* ]]; then\n  install_name_tool -id libscalapack32.${dlext} ${libdir}/libscalapack32.${dlext}\nfi\n"""
version = "v2.1.0"

