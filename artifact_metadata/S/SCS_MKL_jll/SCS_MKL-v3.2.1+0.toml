buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/9ee3d590888b10d62b4962acc9f63442f9304f97/S/SCS_MKL/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.5.3"

[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "SCS_MKL"
platforms = ["x86_64-linux-gnu", "i686-linux-gnu"]
script = """cd $WORKSPACE/srcdir/scs*\nscsflags=\"DLONG=1 USE_OPENMP=0 BLAS32=1 NOBLASSUFFIX=1\"\nmklflags=\"-L${prefix}/lib -Wl,--no-as-needed -lmkl_rt -lmkl_core -lpthread -lm -ldl\"\n\nmake ${scsflags} MKLFLAGS=\"${mklflags}\" out/libscsmkl.${dlext}\n\nmkdir -p ${libdir}\ncp out/libscs*.${dlext} ${libdir}\n"""
version = "v3.2.1"

    [[metadata.dependencies]]
