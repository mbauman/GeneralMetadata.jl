    type = "dependency"
    version-major = 0
    version-minor = 0
    version-patch = 0

    [[metadata.products]]
    dir_paths = []
    dlopen_flags = []
    dont_dlopen = true
    libnames = ["libscsmkl"]
    type = "lib"
    variable_name = "libscsmkl"

    [[metadata.sources]]
    hash = "c785d2fad46a30f1d43764d682509d0b56e5c64f"
    type = "git"
