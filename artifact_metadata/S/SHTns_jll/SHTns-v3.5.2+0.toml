[metadata]
augment_platform_block = """using Base.BinaryPlatforms: arch, arch_march_isa_mapping, CPUID, HostPlatform, Platform\n\nfunction augment_microarchitecture!(platform::Platform)\n    haskey(platform, \"march\") && return platform\n\n    host_arch = arch(HostPlatform())\n    host_isas = arch_march_isa_mapping[host_arch]\n    idx = findlast(((name, isa),) -> isa <= CPUID.cpu_isa(), host_isas)\n    platform[\"march\"] = first(host_isas[idx])\n    return platform\nend\n\nfunction augment_platform!(platform::Platform)\n    # We augment only x86_64\n    @static if Sys.ARCH === :x86_64\n        augment_microarchitecture!(platform)\n    else\n        platform\n    end\nend\n"""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = true
name = "SHTns"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu-march+x86_64", "x86_64-linux-gnu-march+avx", "x86_64-linux-gnu-march+avx2", "x86_64-linux-gnu-march+avx512", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl-march+x86_64", "x86_64-linux-musl-march+avx", "x86_64-linux-musl-march+avx2", "x86_64-linux-musl-march+avx512", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin-march+x86_64", "x86_64-apple-darwin-march+avx", "x86_64-apple-darwin-march+avx2", "x86_64-apple-darwin-march+avx512", "aarch64-apple-darwin", "x86_64-unknown-freebsd-march+x86_64", "x86_64-unknown-freebsd-march+avx", "x86_64-unknown-freebsd-march+avx2", "x86_64-unknown-freebsd-march+avx512", "i686-w64-mingw32", "x86_64-w64-mingw32-march+x86_64", "x86_64-w64-mingw32-march+avx", "x86_64-w64-mingw32-march+avx2", "x86_64-w64-mingw32-march+avx512"]
script = """cd $WORKSPACE/srcdir/shtns/\nexport CFLAGS=\"-fPIC -O3\" #only -fPIC produces slow code on linux x86 and MacOS x86 (maybe others)\n\n#remove lfftw3_omp library references, as FFTW_jll does not provide it\nsed -i -e 's/lfftw3_omp/lfftw3/' configure\n\n./configure --prefix=${prefix} --host=${target} --enable-openmp --enable-kernel-compiler=cc\nmake -j${nproc}\nmake install\n\nmkdir -p ${libdir}\ncc -fopenmp -shared -o \"${libdir}/libshtns.${dlext}\" *.o -lfftw3\nrm \"${prefix}/lib/libshtns_omp.a\"\n\ninstall_license LICENSE\n"""
version = "v3.5.2"

