buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/71e20c0ebe16c762ac9afd6706fd0a0fceda16d4/S/SDL2_ttf/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
system = "Yggdrasil"
version = "0.2.2"

[metadata]
dependencies = ["SDL2_jll", "FreeType2_jll"]
name = "SDL2_ttf"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/SDL2_ttf-*/\n\nFLAGS=()\nif [[ \"${target}\" == *-linux-* ]] || [[ \"${target}\" == *-freebsd* ]]; then\n    FLAGS+=(--with-x)\nfi\n\natomic_patch -p1 ../patches/configure_in-v2.0.15.patch\natomic_patch -p1 ../patches/Makefile_in_dont_build_programs.patch\ntouch NEWS README AUTHORS ChangeLog\n# For some reasons, the first time `autoreconf` may fail,\n# but with some encouragement it can do it\nautoreconf -vi || autoreconf -vi\nexport CPPFLAGS=\"-I${prefix}/include/SDL2\"\n./configure --prefix=${prefix} --host=${target} \\\n    --enable-shared \\\n    --disable-static \\\n    \"${FLAGS[@]}\"\nmake -j${nproc}\nmake install\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    # As usual, build system for Windows is wrecked\n    # and the shared library is not built at all\n    cd ${prefix}/lib\n    ar x libSDL2_ttf.a\n    cc -shared -o ${libdir}/SDL2_ttf.dll SDL_ttf.o ${libdir}/libfreetype-6.dll ${libdir}/SDL2.dll\n    rm SDL_ttf.o\nfi\n"""
sources = [{"https://www.libsdl.org/projects/SDL_ttf/release/SDL2_ttf-2.0.15.tar.gz" = "a9eceb1ad88c1f1545cd7bd28e7cbc0b2c14191d40238f531a15b01b1b22cd33"}, "./bundled"]
version = "v2.0.15"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libSDL2_ttf", "SDL2_ttf"]
    type = "lib"
    variable_name = "libsdl2_ttf"
