buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/d960b095210e9556d53fc46783e94d060d1ab1d9/S/SDL2_ttf/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.2.5"

[metadata]
init_block = ""
lazy_artifacts = false
name = "SDL2_ttf"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/SDL2_ttf-*/\n\natomic_patch -p1 ../patches/configure_in-v2.0.15.patch\natomic_patch -p1 ../patches/Makefile_in_dont_build_programs.patch\ntouch NEWS README AUTHORS ChangeLog\n# For some reasons, the first time `autoreconf` may fail,\n# but with some encouragement it can do it\nautoreconf -vi || autoreconf -vi\nexport CPPFLAGS=\"-I${prefix}/include/SDL2\"\n./configure --prefix=${prefix} --host=${target} \\\n    --enable-shared \\\n    --disable-static \\\n    \"${FLAGS[@]}\"\nmake -j${nproc}\nmake install\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    # As usual, build system for Windows is wrecked\n    # and the shared library is not built at all\n    cd ${prefix}/lib\n    ar x libSDL2_ttf.a\n    cc -shared -o ${libdir}/SDL2_ttf.dll SDL_ttf.o ${libdir}/libfreetype-6.dll ${libdir}/SDL2.dll\n    rm SDL_ttf.o\nfi\n"""
version = "v2.0.15"

