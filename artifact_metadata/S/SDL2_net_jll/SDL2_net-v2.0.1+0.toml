[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "SDL2_net"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/SDL*/\n\nif [[ \"${target}\" == powerpc64le-* ]] || [[ \"${target}\" == *-freebsd* ]]; then\n    # We need to regenerate `configure` for this platforms\n\n    # Include directory with M4 macros\n    atomic_patch -p1 ../patches/configure-add-macro-dir.patch\n    # Create absolutely important files\n    touch AUTHORS NEWS README ChangeLog\n    # Regnerate `configure` script\n    autoreconf -fiv\nfi\n\nmkdir build && cd build\n../configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\n"""
version = "v2.0.1"

