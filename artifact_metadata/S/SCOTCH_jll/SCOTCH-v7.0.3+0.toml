[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "SCOTCH"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/scotch*\n\n# https://github.com/conda-forge/scotch-feedstock\nfor f in ${WORKSPACE}/srcdir/patches/*.patch; do\n  atomic_patch -p1 ${f}\ndone\n\nmkdir -p src/dummysizes/build-host\ncd src/dummysizes/build-host\ncp ${WORKSPACE}/srcdir/patches/CMakeLists-dummysizes.txt ../CMakeLists.txt\n\nCC=${CC_BUILD} cmake .. \\\n    -DBUILD_PTSCOTCH=OFF \\\n    -DCMAKE_BUILD_TYPE=Release\n\nmake -j${nproc}\n\ncd ${WORKSPACE}/srcdir/scotch*\nmkdir build\ncd build\n\nFLAGS=\"\"\nif [[ \"${target}\" == *linux* ]]; then\n    FLAGS=\"-lrt\"\nfi\nif [[ \"${target}\" == *linux-musl* ]]; then\n    FLAGS=\"-lrt -D_GNU_SOURCE\"\nfi\n\nCFLAGS=$FLAGS cmake .. \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DINTSIZE=\"32\" \\\n    -DTHREADS=ON \\\n    -DMPI_THREAD_MULTIPLE=OFF \\\n    -DBUILD_PTSCOTCH=OFF \\\n    -DBUILD_LIBESMUMPS=ON \\\n    -DBUILD_LIBSCOTCHMETIS=ON \\\n    -DBUILD_DUMMYSIZES=OFF \\\n    -DINSTALL_METIS_HEADERS=OFF\n\nmake -j${nproc}\nmake install\n\nif [[ \"${target}\" == *mingw* ]]; then\n    cp bin/*.dll $libdir\nfi\n\ninstall_license ../LICENSE_en.txt\n"""
