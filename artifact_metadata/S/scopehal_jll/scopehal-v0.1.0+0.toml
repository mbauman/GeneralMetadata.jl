name = "scopehal"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "x86_64-apple-darwin-cxx03", "x86_64-apple-darwin-cxx11", "x86_64-unknown-freebsd-cxx03", "x86_64-unknown-freebsd-cxx11", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/scopehal/\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/0001-replace-color-with-string.patch\ngit submodule update --init\ncd xptools\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/0001-musl.patch\ncd ../..\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN%.*}_gcc.cmake \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    .\nmake -j${nproc}\nmake install\ninstall_license scopehal/LICENSE\n"""
