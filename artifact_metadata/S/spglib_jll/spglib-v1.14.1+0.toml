buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/9c7db0ea918be45208beb491055294646b0ec71c/S/spglib/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
metadata_type = "BinaryBuilder --meta-json"
