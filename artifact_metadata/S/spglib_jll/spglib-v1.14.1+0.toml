[metadata]
dependencies = []
name = "spglib"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/spglib-*/\nif [[ ${target} == *-mingw32 ]]; then\n    sed -i -e 's/LIBRARY/RUNTIME/' CMakeLists.txt\nfi\nmkdir _build\ncd _build/\ncmake -DCMAKE_INSTALL_PREFIX=$prefix \\\n      -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n      ../\nmake -j${nproc}\nmake install VERBOSE=1\n"""
version = "v1.14.1"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libsymspg"]
    type = "lib"
    variable_name = "libsymspg"

