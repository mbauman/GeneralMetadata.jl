buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/e91a21754ee31a9c6cbba30babb8392929483076/S/spglib/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.6.5"

[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "spglib"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """# Needs CMake >= 3.25 provided via HostBuildDependency\napk del cmake\n\ncd $WORKSPACE/srcdir/spglib\nargs=\"\"\nif [[ ! -z \"${CMAKE_TARGET_TOOLCHAIN}\" ]]; then\n  args=\"${args} -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\"\nfi\ncmake -B ./build \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DSPGLIB_WITH_TESTS=OFF \\\n      ${args}\ncmake --build ./build -j${nproc}\ncmake --install ./build\n"""
version = "v2.6.0"

    [[metadata.dependencies]]
