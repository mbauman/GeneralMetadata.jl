[metadata]
augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "sshpass"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """cd sshpass-*\n\n# The default configure.ac includes a malloc check that causes failures on\n# ARM/OSX/musl: https://github.com/maxmind/libmaxminddb/pull/152\n# Submitted upstream: https://sourceforge.net/p/sshpass/patches/16/\natomic_patch -p1 ../patches/configure-ac.patch\nautoreconf -i\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\nmake install\n"""
version = "v1.10.0"

