buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/d792b339c8f26c9bcc19091130c8709da8b0db98/A/Arb/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.5.5"

[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Arb"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\ncd arb*/\nif [[ ${target} == *musl* ]]; then\n   export CFLAGS=-D_GNU_SOURCE=1\nelif [[ ${target} == *mingw* ]]; then\n   # /lib is hardcoded in many places\n   sed -i -e \"s#/lib\\>#/$(basename ${libdir})#g\" configure\n   # MSYS_NT-6.3 is not detected as MINGW\n   extraflags=--build=MINGW${nbits}\nfi\n./configure --prefix=$prefix --disable-static --enable-shared --with-gmp=$prefix --with-mpfr=$prefix --with-flint=$prefix ${extraflags}\nmake -j${nproc}\nmake install LIBDIR=$(basename ${libdir})\n"""
version = "v200.2300.0"

