buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/04fc78a66f5149ee7d459e9e5a568dedd2b7214a/A/ABC/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.3.2"

[metadata]
init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "ABC"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin"]
script = """\nEXFLGS=\"-Wall -Wno-unused-function -Wno-write-strings -Wno-sign-compare -DSIZEOF_INT=4 -DABC_USE_CUDD=1 -DABC_USE_PTHREADS -Wno-unused-but-set-variable -fPIC\"\n\nif [[ ${nbits} == 32 ]]; then\n    EXFLGS=\"${EXFLGS} -DSIZEOF_VOID_P=4\"\n    EXFLGS=\"${EXFLGS} -DSIZEOF_LONG=4\"\n    EXFLGS=\"${EXFLGS} -DLIN\"\nelse\n    EXFLGS=\"${EXFLGS} -DSIZEOF_VOID_P=8\"\n    EXFLGS=\"${EXFLGS} -DSIZEOF_LONG=8\"\n    EXFLGS=\"${EXFLGS} -DLIN64\"\nfi\n\n# musl doesn't like readline\nif [[ ${target} != *\"musl\"* ]]; then\n    EXFLGS=\"${EXFLGS} -DABC_READLINE\"\nfi\n\ncd ${WORKSPACE}/srcdir/abc\n\n# it appears necessary to have the file(s) for the FileProduct(s) live in the destdir\ncp abc.rc ${prefix}/.\n\nmake -j${nproc} ABC_USE_STDINT_H=1 CFLAGS+=\"${EXFLGS}\" libabc.so\n# the abc Makefile always makes a .so  Fix that here.\nmv libabc.so libabc.${dlext}\nmkdir -p \"${libdir}\"\ncp libabc.${dlext} ${libdir}\n\nmake -j${nproc} ABC_USE_STDINT_H=1 CFLAGS+=\"${EXFLGS}\"\nmkdir -p \"${bindir}\"\ncp abc${exeext} ${bindir}\nchmod +x ${bindir}/*\ninstall_license copyright.txt\nexit\n"""
version = "v1.1.0"

    [[metadata.dependencies]]
    compat = ""
    name = "Readline_jll"
    type = "dependency"
    version-major = 0
    version-minor = 0
    version-patch = 0

    [[metadata.products]]
    binnames = ["abc"]
    type = "exe"
    variable_name = "abc"
    [[metadata.products]]
    dir_paths = []
    dlopen_flags = []
    dont_dlopen = false
    libnames = ["libabc"]
    type = "lib"
    variable_name = "libabc"
    [[metadata.products]]
    paths = ["abc.rc"]
    type = "file"
    variable_name = "abc_rc"

    [[metadata.sources]]
