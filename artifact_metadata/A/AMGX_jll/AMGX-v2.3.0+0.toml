augment_platform_block = """using Base.BinaryPlatforms\n\ntry\n    using CUDA_Runtime_jll\ncatch\n    # during initial package installation, CUDA_Runtime_jll may not be available.\n    # in that case, we just won't select an artifact.\nend\n\nfunction cuda_comparison_strategy(a::String, b::String, a_requested::Bool, b_requested::Bool)\n    if a == \"none\" || b == \"none\"\n        return false\n    end\n    if a == \"local\" || b == \"local\"\n        return a == b\n    end\n    a = VersionNumber(a)\n    b = VersionNumber(b)\n\n    # If both b and a requested, then we fall back to equality:\n    if a_requested && b_requested\n        return Base.thisminor(a) == Base.thisminor(b)\n    end\n\n    # Otherwise, do the comparison between the the single version cap and the single version:\n    function is_compatible(artifact::VersionNumber, host::VersionNumber)\n        if host >= v\"11.0\"\n            # enhanced compatibility, semver-style\n            artifact.major == host.major &&\n            Base.thisminor(artifact) <= Base.thisminor(host)\n        else\n            Base.thisminor(artifact) == Base.thisminor(host)\n        end\n    end\n    if a_requested\n        is_compatible(b, a)\n    else\n        is_compatible(a, b)\n    end\nend\n\nfunction augment_platform!(platform::Platform)\n    if !@isdefined(CUDA_Runtime_jll)\n        # don't set to nothing or Pkg will download any artifact\n        platform[\"cuda\"] = \"none\"\n    end\n\n    if !haskey(platform, \"cuda\")\n        CUDA_Runtime_jll.augment_platform!(platform)\n    end\n    BinaryPlatforms.set_compare_strategy!(platform, \"cuda\", cuda_comparison_strategy)\n    return platform\nend"""
init_block = ""
julia_compat = "1.7"
lazy_artifacts = true
name = "AMGX"
platforms = ["x86_64-linux-gnu-cuda+10.2", "x86_64-linux-gnu-cuda+11.0"]
script = ["""CUDA_ARCHS=\"35;50;60;70\"\nCXX_STANDARD=11\n# check if we need to use a more recent glibc\nif [[ -f \"$prefix/usr/include/sched.h\" ]]; then\n    GLIBC_ARTIFACT_DIR=$(dirname $(dirname $(dirname $(realpath $prefix/usr/include/sched.h))))\n    rsync --archive ${GLIBC_ARTIFACT_DIR}/ /opt/${target}/${target}/sys-root/\nfi\n\n# nvcc writes to /tmp, which is a small tmpfs in our sandbox.\n# make it use the workspace instead\nexport TMPDIR=${WORKSPACE}/tmpdir\nmkdir ${TMPDIR}\n\ncd ${WORKSPACE}/srcdir/AMGX*\n\n# Apply all our patches\nif [ -d $WORKSPACE/srcdir/patches ]; then\nfor f in $WORKSPACE/srcdir/patches/*.patch; do\n    echo \"Applying patch ${f}\"\n    atomic_patch -p1 ${f}\ndone\nfi\n\ninstall_license LICENSE\n\nmkdir build\ncd build\nCMAKE_POLICY_DEFAULT_CMP0021=OLD \\\nCUDA_BIN_PATH=${prefix}/cuda/bin \\\nCUDA_LIB_PATH=${prefix}/cuda/lib64 \\\nCUDA_INC_PATH=${prefix}/cuda/include \\\ncmake -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_FIND_ROOT_PATH=\"${prefix}\" \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DCMAKE_CXX_STANDARD=${CXX_STANDARD} \\\n      -DCUDA_ARCH=${CUDA_ARCHS} \\\n      -DCUDA_TOOLKIT_ROOT_DIR=\"${prefix}/cuda\" \\\n      -DCMAKE_CUDA_COMPILER=$prefix/cuda/bin/nvcc \\\n      -Wno-dev \\\n      ..\n\nmake -j${nproc} all\nmake install\n\n# clean-up\n## unneeded static libraries\nrm ${libdir}/*.a ${libdir}/sublibs/*.a\n""", """CUDA_ARCHS=\"60;70;80\"\nCXX_STANDARD=14\n# check if we need to use a more recent glibc\nif [[ -f \"$prefix/usr/include/sched.h\" ]]; then\n    GLIBC_ARTIFACT_DIR=$(dirname $(dirname $(dirname $(realpath $prefix/usr/include/sched.h))))\n    rsync --archive ${GLIBC_ARTIFACT_DIR}/ /opt/${target}/${target}/sys-root/\nfi\n\n# nvcc writes to /tmp, which is a small tmpfs in our sandbox.\n# make it use the workspace instead\nexport TMPDIR=${WORKSPACE}/tmpdir\nmkdir ${TMPDIR}\n\ncd ${WORKSPACE}/srcdir/AMGX*\n\n# Apply all our patches\nif [ -d $WORKSPACE/srcdir/patches ]; then\nfor f in $WORKSPACE/srcdir/patches/*.patch; do\n    echo \"Applying patch ${f}\"\n    atomic_patch -p1 ${f}\ndone\nfi\n\ninstall_license LICENSE\n\nmkdir build\ncd build\nCMAKE_POLICY_DEFAULT_CMP0021=OLD \\\nCUDA_BIN_PATH=${prefix}/cuda/bin \\\nCUDA_LIB_PATH=${prefix}/cuda/lib64 \\\nCUDA_INC_PATH=${prefix}/cuda/include \\\ncmake -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_FIND_ROOT_PATH=\"${prefix}\" \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DCMAKE_CXX_STANDARD=${CXX_STANDARD} \\\n      -DCUDA_ARCH=${CUDA_ARCHS} \\\n      -DCUDA_TOOLKIT_ROOT_DIR=\"${prefix}/cuda\" \\\n      -DCMAKE_CUDA_COMPILER=$prefix/cuda/bin/nvcc \\\n      -Wno-dev \\\n      ..\n\nmake -j${nproc} all\nmake install\n\n# clean-up\n## unneeded static libraries\nrm ${libdir}/*.a ${libdir}/sublibs/*.a\n"""]
