name = "Arrow"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """\ncd $WORKSPACE/srcdir/arrow\n\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/boost.patch\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/windows.patch\nif [[ $target == *mingw32* ]]; then\n    # This hard-codes the name and location of the zstd library and\n    # must not be applied on other architectures\n    atomic_patch -p1 ${WORKSPACE}/srcdir/patches/windows-zstd.patch\nfi\n\ncd cpp\n\nCMAKE_FLAGS=(\n    -DCMAKE_BUILD_TYPE=Release\n    -DCMAKE_INSTALL_PREFIX=${prefix}\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\n    -DARROW_BUILD_STATIC=OFF\n    -DARROW_BUILD_UTILITIES=OFF\n    -DARROW_COMPUTE=OFF\n    -DARROW_CXXFLAGS=\"${CXXFLAGS}\"\n    -DARROW_DATASET=ON\n    -DARROW_DEPENDENCY_SOURCE=SYSTEM\n    -DARROW_IPC=OFF\n    -DARROW_JEMALLOC=OFF\n    -DARROW_PARQUET=ON\n    -DARROW_SIMD_LEVEL=NONE\n    -DARROW_THRIFT_USE_SHARED=ON\n    -DARROW_USE_XSIMD=OFF\n    -DARROW_VERBOSE_THIRDPARTY_BUILD=ON\n    -DARROW_WITH_BROTLI=ON\n    -DARROW_WITH_BZ2=ON\n    -DARROW_WITH_LZ4=ON\n    -DARROW_WITH_RE2=OFF\n    -DARROW_WITH_SNAPPY=ON\n    -DARROW_WITH_UTF8PROC=OFF\n    -DARROW_WITH_ZLIB=ON\n    -DARROW_WITH_ZSTD=ON\n    -DPARQUET_BUILD_EXECUTABLES=OFF\n    -Dxsimd_SOURCE=AUTO\n)\n\nif [[ $target == *mingw32* ]]; then\n    # Cmake doesn't find the zstd library on Windows. It does find\n    # zstd, but it somehow can't determine the path to the actual\n    # library.\n    CMAKE_FLAGS+=(-DZSTD_LIB=\"${prefix}/lib/libzstd.dll.a\")\nfi\n\ncmake -B cmake-build \"${CMAKE_FLAGS[@]}\"\ncmake --build cmake-build --parallel ${nproc}\ncmake --install cmake-build\n"""
version = "v18.1.1"

