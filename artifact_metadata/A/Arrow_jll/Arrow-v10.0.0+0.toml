platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """\ncd $WORKSPACE/srcdir/arrow-apache-arrow-*\n\n# Set toolchain for building external deps\nfor f in ${WORKSPACE}/srcdir/patches/*.patch; do\n    atomic_patch -p1 ${f}\ndone\n\ncd cpp && mkdir build_dir && cd build_dir\n\n# Ignore check for availibility on older macOS versions\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    CXXFLAGS=\"${CXXFLAGS} -D_LIBCPP_DISABLE_AVAILABILITY\"\nfi\n\nCMAKE_FLAGS=(-DCMAKE_INSTALL_PREFIX=$prefix\n-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\n-DARROW_CXXFLAGS=\"${CXXFLAGS}\"\n-DCMAKE_BUILD_TYPE=Release\n-DARROW_BUILD_UTILITIES=OFF\n-DARROW_WITH_UTF8PROC=OFF\n-DARROW_DEPENDENCY_SOURCE=SYSTEM\n-DARROW_VERBOSE_THIRDPARTY_BUILD=ON\n-DARROW_BUILD_STATIC=OFF\n-DARROW_DATASET=ON\n-DARROW_COMPUTE=OFF\n-DARROW_WITH_RE2=OFF\n-DARROW_WITH_BZ2=ON\n-DARROW_IPC=OFF\n-DARROW_WITH_LZ4=ON\n-DARROW_WITH_ZSTD=OFF\n-DARROW_WITH_ZLIB=ON\n-DARROW_WITH_SNAPPY=ON\n-DARROW_THRIFT_USE_SHARED=ON\n-DARROW_PARQUET=ON\n-DPARQUET_BUILD_EXECUTABLES=OFF\n-DARROW_SIMD_LEVEL=NONE\n-DARROW_USE_XSIMD=OFF\n-DARROW_JEMALLOC=OFF\n-Dxsimd_SOURCE=AUTO)\n\ncmake .. \"${CMAKE_FLAGS[@]}\"\n\nmake -j${nproc}\n\nmake install\n"""
version = "v10.0.0"

