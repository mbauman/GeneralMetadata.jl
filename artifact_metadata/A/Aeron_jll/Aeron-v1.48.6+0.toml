[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Aeron"
platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin"]
script = """apk update && apk upgrade && apk add openjdk17 && apk del cmake\n\ncd $WORKSPACE/srcdir/aeron\n\nCMAKE_FLAGS=(\n-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\n-DCMAKE_BUILD_TYPE=Release\n# -DC_WARNINGS_AS_ERRORS=ON\n# -DCXX_WARNINGS_AS_ERRORS=ON\n-DAERON_HIDE_DEPRECATION_MESSAGE=ON\n-DBUILD_AERON_DRIVER=ON\n-DBUILD_AERON_ARCHIVE_API=ON\n-DAERON_TESTS=OFF\n-DAERON_SYSTEM_TESTS=OFF\n-DAERON_BUILD_SAMPLES=OFF\n-DAERON_BUILD_DOCUMENTATION=OFF\n-DAERON_INSTALL_TARGETS=ON\n-DCMAKE_INSTALL_PREFIX=$prefix\n)\n\nexport GRADLE_USER_HOME=$WORKSPACE/gradle\n\ncmake -B build \"${CMAKE_FLAGS[@]}\"\ncmake --build build --parallel ${nproc} --clean-first\ncmake --install build\ninstall_license $WORKSPACE/srcdir/aeron/LICENSE\n"""
version = "v1.48.6"

