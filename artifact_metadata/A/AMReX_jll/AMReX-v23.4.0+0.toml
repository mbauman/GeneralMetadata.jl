platforms = ["i686-linux-gnu-cxx03-mpi+mpich", "i686-linux-gnu-cxx11-mpi+mpich", "x86_64-linux-gnu-cxx03-mpi+mpich", "x86_64-linux-gnu-cxx11-mpi+mpich", "aarch64-linux-gnu-cxx03-mpi+mpich", "aarch64-linux-gnu-cxx11-mpi+mpich", "armv6l-linux-gnueabihf-cxx03-mpi+mpich", "armv6l-linux-gnueabihf-cxx11-mpi+mpich", "armv7l-linux-gnueabihf-cxx03-mpi+mpich", "armv7l-linux-gnueabihf-cxx11-mpi+mpich", "powerpc64le-linux-gnu-cxx03-mpi+mpich", "powerpc64le-linux-gnu-cxx11-mpi+mpich", "x86_64-apple-darwin-mpi+mpich", "aarch64-apple-darwin-mpi+mpich", "x86_64-unknown-freebsd-mpi+mpich", "i686-linux-gnu-cxx03-mpi+openmpi", "i686-linux-gnu-cxx11-mpi+openmpi", "x86_64-linux-gnu-cxx03-mpi+openmpi", "x86_64-linux-gnu-cxx11-mpi+openmpi", "aarch64-linux-gnu-cxx03-mpi+openmpi", "aarch64-linux-gnu-cxx11-mpi+openmpi", "armv7l-linux-gnueabihf-cxx03-mpi+openmpi", "armv7l-linux-gnueabihf-cxx11-mpi+openmpi", "powerpc64le-linux-gnu-cxx03-mpi+openmpi", "powerpc64le-linux-gnu-cxx11-mpi+openmpi", "x86_64-apple-darwin-mpi+openmpi", "aarch64-apple-darwin-mpi+openmpi", "x86_64-unknown-freebsd-mpi+openmpi", "i686-w64-mingw32-cxx03-mpi+microsoftmpi", "i686-w64-mingw32-cxx11-mpi+microsoftmpi", "x86_64-w64-mingw32-cxx03-mpi+microsoftmpi", "x86_64-w64-mingw32-cxx11-mpi+microsoftmpi", "i686-linux-gnu-cxx03-mpi+mpitrampoline", "i686-linux-gnu-cxx11-mpi+mpitrampoline", "x86_64-linux-gnu-cxx03-mpi+mpitrampoline", "x86_64-linux-gnu-cxx11-mpi+mpitrampoline", "aarch64-linux-gnu-cxx03-mpi+mpitrampoline", "aarch64-linux-gnu-cxx11-mpi+mpitrampoline", "armv6l-linux-gnueabihf-cxx03-mpi+mpitrampoline", "armv6l-linux-gnueabihf-cxx11-mpi+mpitrampoline", "armv7l-linux-gnueabihf-cxx03-mpi+mpitrampoline", "armv7l-linux-gnueabihf-cxx11-mpi+mpitrampoline", "powerpc64le-linux-gnu-cxx03-mpi+mpitrampoline", "powerpc64le-linux-gnu-cxx11-mpi+mpitrampoline", "x86_64-apple-darwin-mpi+mpitrampoline", "aarch64-apple-darwin-mpi+mpitrampoline"]
script = """cd $WORKSPACE/srcdir\ncd amrex\nmkdir build\ncd build\n\nif [[ \"$target\" == *-apple-* ]]; then\n    if grep -q MPICH_NAME $prefix/include/mpi.h; then\n        # MPICH's pkgconfig file \"mpich.pc\" lists these options:\n        #     Libs:     -framework OpenCL -Wl,-flat_namespace -Wl,-commons,use_dylibs -L${libdir} -lmpi -lpmpi -lm    -lpthread\n        #     Cflags:   -I${includedir}\n        # cmake doesn't know how to handle the \"-framework OpenCL\" option\n        # and wants to use \"-framework\" as a stand-alone option. This fails,\n        # and cmake concludes that MPI is not available.\n        mpiopts=\"-DMPI_C_ADDITIONAL_INCLUDE_DIRS='' -DMPI_C_LIBRARIES='-Wl,-flat_namespace;-Wl,-commons,use_dylibs;-lmpi;-lpmpi' -DMPI_CXX_ADDITIONAL_INCLUDE_DIRS='' -DMPI_CXX_LIBRARIES='-Wl,-flat_namespace;-Wl,-commons,use_dylibs;-lmpi;-lpmpi'\"\n    fi\nelif [[ \"$target\" == x86_64-w64-mingw32 ]]; then\n    mpiopts=\"-DMPI_HOME=$prefix -DMPI_GUESS_LIBRARY_NAME=MSMPI -DMPI_C_LIBRARIES=msmpi64 -DMPI_CXX_LIBRARIES=msmpi64\"\nelif [[ \"$target\" == *-mingw* ]]; then\n    mpiopts=\"-DMPI_HOME=$prefix -DMPI_GUESS_LIBRARY_NAME=MSMPI\"\nelse\n    mpiopts=\nfi\ncmake \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DAMReX_FORTRAN=ON \\\n    -DAMReX_MPI=ON \\\n    -DAMReX_OMP=ON \\\n    -DAMReX_PARTICLES=ON \\\n    -DBUILD_SHARED_LIBS=ON \\\n    ${mpiopts} \\\n    ..\ncmake --build . --config RelWithDebInfo --parallel $nproc\ncmake --build . --config RelWithDebInfo --parallel $nproc --target install\n"""
version = "v23.4.0"

