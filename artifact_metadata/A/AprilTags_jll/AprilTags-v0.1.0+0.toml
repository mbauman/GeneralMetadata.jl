[metadata]
dependencies = []
init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "AprilTags"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/apriltags/\nmkdir build\ncd build/\n\nexport CFLAGS=\"-std=gnu99\"\n\ncmake .. -DCMAKE_INSTALL_PREFIX=$prefix -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_WRAPPER=Off\nmake -j${nproc}\nmake install\n\n# Move dll on windows\nif [[ ${target} == *-mingw32 ]]; then \n    cp -L *.${dlext} ${libdir}\nfi\n"""
version = "v0.1.0"

