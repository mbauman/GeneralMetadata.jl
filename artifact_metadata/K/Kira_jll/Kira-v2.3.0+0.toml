name = "Kira"
platforms = ["aarch64-apple-darwin-mpi+mpich", "x86_64-linux-gnu-cxx03-mpi+mpich", "x86_64-linux-gnu-cxx11-mpi+mpich", "x86_64-apple-darwin-mpi+mpich", "aarch64-apple-darwin-mpi+openmpi", "x86_64-linux-gnu-cxx03-mpi+openmpi", "x86_64-linux-gnu-cxx11-mpi+openmpi", "x86_64-apple-darwin-mpi+openmpi", "aarch64-apple-darwin-mpi+mpitrampoline", "x86_64-linux-gnu-cxx03-mpi+mpitrampoline", "x86_64-linux-gnu-cxx11-mpi+mpitrampoline", "x86_64-apple-darwin-mpi+mpitrampoline"]
script = """pip3 install -U meson\n\nmkdir ${WORKSPACE}/srcdir/Kira-build\ncd ${WORKSPACE}/srcdir/Kira-build/\n\nmeson setup \\\n    -Dfirefly=true \\\n    -Djemalloc=true \\\n    --cross-file=${MESON_TARGET_TOOLCHAIN} \\\n    --buildtype=release \\\n    ${WORKSPACE}/srcdir/kira/ \\\n    ${WORKSPACE}/srcdir/Kira-build/\nsed -i \"s?/workspace/destdir/opt?/opt?g\" build.ninja\n\nmeson install\ninstall_license ${WORKSPACE}/srcdir/kira/COPYING\n"""
