script = """echo ${target}\ncd $WORKSPACE/srcdir/RadeonProRenderSDK/RadeonProRender\nif [[ ${target} == x86_64-linux-gnu ]]; then\n    cp -v binUbuntu*/* ${libdir}/\nelif [[ ${target} == *-apple-darwin* ]]; then\n    cp binMacOS/* ${libdir}/\nelif [[ ${target} == *-mingw* ]]; then\n    cp binWin64/* ${libdir}/\nfi\n\nmkdir -p \"${includedir}\"\ncp -Rv inc/* \"${includedir}\"\n"""
