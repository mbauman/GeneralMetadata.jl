[metadata]
augment_platform_block = """    using Base.BinaryPlatforms\n        # Can't use Preferences since we might be running this very early with a non-existing Manifest\n    MPIPreferences_UUID = Base.UUID(\"3da0fdf6-3ccc-4f1b-acd9-58baa6c99267\")\n    const preferences = Base.get_preferences(MPIPreferences_UUID)\n\n    # Keep logic in sync with MPIPreferences.jl\n    function augment_mpi!(platform)\n        # Doesn't need to be `const` since we depend on MPIPreferences so we\n        # invalidate the cache when it changes.\n        binary = get(preferences, \"binary\", Sys.iswindows() ? \"MicrosoftMPI_jll\" : \"MPICH_jll\")\n\n        abi = if binary == \"system\"\n            let abi = get(preferences, \"abi\", nothing)\n                if abi === nothing\n                    error(\"MPIPreferences: Inconsistent state detected, binary set to system, but no ABI set.\")\n                else\n                    abi\n                end\n            end\n        elseif binary == \"MicrosoftMPI_jll\"\n            \"MicrosoftMPI\"\n        elseif binary == \"MPICH_jll\"\n            \"MPICH\"\n        elseif binary == \"OpenMPI_jll\"\n            \"OpenMPI\"\n        elseif binary == \"MPItrampoline_jll\"\n            \"MPItrampoline\"\n        else\n            error(\"Unknown binary: $binary\")\n        end\n\n        if !haskey(platform, \"mpi\")\n            platform[\"mpi\"] = abi\n        end\n        return platform\n    end\n\n    augment_platform!(platform::Platform) = augment_mpi!(platform)\n"""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = true
name = "RAxML"
platforms = ["i686-linux-gnu-mpi+mpich", "x86_64-linux-gnu-mpi+mpich", "i686-linux-musl-mpi+mpich", "x86_64-linux-musl-mpi+mpich", "x86_64-apple-darwin-mpi+mpich", "x86_64-unknown-freebsd-mpi+mpich", "i686-linux-gnu-mpi+openmpi", "x86_64-linux-gnu-mpi+openmpi", "i686-linux-musl-mpi+openmpi", "x86_64-linux-musl-mpi+openmpi", "x86_64-apple-darwin-mpi+openmpi", "x86_64-unknown-freebsd-mpi+openmpi", "i686-w64-mingw32-mpi+microsoftmpi", "x86_64-w64-mingw32-mpi+microsoftmpi", "i686-linux-gnu-mpi+mpitrampoline", "x86_64-linux-gnu-mpi+mpitrampoline", "x86_64-apple-darwin-mpi+mpitrampoline"]
script = """cd ${WORKSPACE}/srcdir/standard-RAxML\n\n# see section IV in manual for license spec \n# https://github.com/stamatak/standard-RAxML/blob/master/manual/NewManual.pdf\ninstall_license /usr/share/licenses/GPL-3.0+\n\n# Sequential\nmake -f Makefile.gcc -j${nproc}\nrm *.o\nmake -f Makefile.SSE3.gcc -j${nproc}\nrm *.o\nmake -f Makefile.AVX.gcc -j${nproc}\nrm *.o\n\n# PTHREADS\nmake -f Makefile.PTHREADS.gcc -j${nproc}\nrm *.o\nmake -f Makefile.SSE3.PTHREADS.gcc -j${nproc}\nrm *.o\nmake -f Makefile.AVX.PTHREADS.gcc -j${nproc}\nrm *.o\n\n# MPI version\nif [[ \"$target\" == *-mingw* ]]; then\n    GLOBAL_DEPS=\"axml.h globalVariables.h rmq.h rmqs.h ${includedir}/mpi.h\"\n    LIBRARIES=\"-lm -lmsmpi -I${includedir} -L${libdir}\"\n    \n    CFLAGS=\"-D_WAYNE_MPI -D_GNU_SOURCE -fomit-frame-pointer -funroll-loops -O2 -msse -I${includedir} -L${libdir} -lmsmpi\"\n    make -f Makefile.MPI.gcc -j${nproc} \\\n        CC=${target}-gcc \\\n        CFLAGS=\"$CFLAGS\" \\\n        GLOBAL_DEPS=\"${GLOBAL_DEPS}\" \\\n        LIBRARIES=\"${LIBRARIES}\"\n    rm *.o\n    \n    CFLAGS=\"-D_WAYNE_MPI -D__SIM_SSE3 -O2 -D_GNU_SOURCE -msse3 -fomit-frame-pointer -funroll-loops -I${includedir} -L${libdir} -lmsmpi\"\n    make -f Makefile.SSE3.MPI.gcc -j${nproc} \\\n        CC=${target}-gcc \\\n        CFLAGS=\"$CFLAGS\" \\\n        GLOBAL_DEPS=\"${GLOBAL_DEPS}\" \\\n        LIBRARIES=\"${LIBRARIES}\"\n    rm *.o\n\n    CFLAGS=\"-D_WAYNE_MPI -D__SIM_SSE3 -D__AVX -O2 -D_GNU_SOURCE -msse3 -fomit-frame-pointer -funroll-loops -I${includedir} -L${libdir} -lmsmpi\"\n    make -f Makefile.AVX.MPI.gcc -j${nproc} \\\n        CC=${target}-gcc \\\n        CFLAGS=\"$CFLAGS\" \\\n        GLOBAL_DEPS=\"${GLOBAL_DEPS}\" \\\n        LIBRARIES=\"${LIBRARIES}\"\n    rm *.o\nelse\n    make -f Makefile.MPI.gcc -j${nproc}\n    rm *.o\n    make -f Makefile.SSE3.MPI.gcc -j${nproc}\n    rm *.o\n    make -f Makefile.AVX.MPI.gcc -j${nproc}\n    rm *.o\nfi\n\nfor f in raxmlHPC*; do \n    install -Dvm 755 $f ${bindir}/${f}${exeext}; \ndone\n"""
version = "v8.2.13"

