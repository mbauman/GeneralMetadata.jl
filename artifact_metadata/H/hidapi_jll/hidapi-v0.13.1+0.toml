name = "hidapi"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/\nmkdir build\ncd build\n\nif [[ ${target} == *-linux-* ]]; then\n    # We need this only to trick `configure` into thinking that udev is available,\n    # but we aren't going to actually use it\n    apk add eudev-dev\n    linuxflags=\"-DHIDAPI_WITH_HIDRAW=false\"\nfi\n\ncmake  \\\n    ../hidapi \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_SHARED_LIBS=ON \\\n    ${linuxflags} \\\n    ..\n\ncmake --build . --target install\ninstall_license ../hidapi/LICENSE*.txt\n"""
version = "v0.13.1"

