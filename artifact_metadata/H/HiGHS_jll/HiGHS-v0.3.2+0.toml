buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/82bdbb6f9d1ca3dd7a6de0f22caf775ce466457d/H/HiGHS/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.4.0"

[metadata]
init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "HiGHS"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir\nif [[ \"${target}\" == *86*-linux-musl* ]]; then\n    pushd /opt/${target}/lib/gcc/${target}/*/include\n    # Fix bug in Musl C library, see\n    # https://github.com/JuliaPackaging/BinaryBuilder.jl/issues/387\n    atomic_patch -p0 $WORKSPACE/srcdir/patches/mm_malloc.patch\n    popd\nfi\nmkdir -p HiGHS/build\ncd HiGHS/build\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DFAST_BUILD=ON \\\n    -DJULIA=ON \\\n    -DIPX=ON ..\n\nif [[ \"${target}\" == *-linux-* ]]; then\n        make -j ${nproc}\nelse\n    if [[ \"${target}\" == *-mingw* ]]; then\n        cmake --build . --config Release\n    else\n        cmake --build . --config Release --parallel\n    fi\nfi\nmake install\n"""
version = "v0.3.2"

