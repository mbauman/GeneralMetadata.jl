script = """BUILD_SHARED=ON\ncd $WORKSPACE/srcdir\n\nmkdir -p HiGHS/build\ncd HiGHS/build\n\n# Do fully static build only on Windows\nif [[ \"${BUILD_SHARED}\" == \"OFF\" ]] && [[ \"${target}\" == *-mingw* ]]; then\n    export CXXFLAGS=\"-static\"\nfi\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_SHARED_LIBS=${BUILD_SHARED} \\\n    -DFAST_BUILD=ON \\\n    -DJULIA=ON \\\n    -DIPX=ON ..\n\nif [[ \"${target}\" == *-linux-* ]]; then\n        make -j ${nproc}\nelse\n    if [[ \"${target}\" == *-mingw* ]]; then\n        cmake --build . --config Release\n    else\n        cmake --build . --config Release --parallel\n    fi\nfi\nmake install\n\ninstall_license ../LICENSE\n\nif [[ \"${BUILD_SHARED}\" == \"OFF\" ]]; then\n    # Delete the static library to save space\n    rm -r ${prefix}/lib\n    if [[ \"${target}\" == *-mingw* ]]; then\n        # The Windows build ships also GCC runtime, add its license as well\n        install_license /usr/share/licenses/GPL3\n    fi\nfi\n"""
version = "v1.2.1"

