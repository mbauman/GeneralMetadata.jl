buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/409267222921050758da03b88a2fa7d08b428cce/H/HelloWorldC/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.3.0"

[metadata]
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "HelloWorldC"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """mkdir -p ${prefix}/bin\ncc -o ${prefix}/bin/hello_world${exeext} -g -O2 /usr/share/testsuite/c/hello_world/hello_world.c\n\n# Also build with cmake\nmkdir build && cd build\ncmake .. -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release\nmake -j${nproc}\n\ninstall_license /usr/share/licenses/MIT\n"""
version = "v1.1.2"

    [[metadata.products]]
    binnames = ["hello_world"]
    type = "exe"
    variable_name = "hello_world"

    [[metadata.sources]]
    follow_symlinks = false
    path = "./bundled"
    target = ""
    type = "directory"
