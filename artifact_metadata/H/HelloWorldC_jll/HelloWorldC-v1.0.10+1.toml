buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/34077c8fad1b1a9b80183270d28650d29ed554d9/H/HelloWorldC/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.2.5"

[metadata]
dependencies = []
init_block = ""
lazy_artifacts = false
name = "HelloWorldC"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """mkdir -p ${prefix}/bin\ncc -o ${prefix}/bin/hello_world${exeext} -g -O2 /usr/share/testsuite/c/hello_world/hello_world.c\n\n# Also build with cmake\nmkdir build && cd build\ncmake .. -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release\nmake\n\ninstall_license /usr/share/licenses/MIT\n"""
version = "v1.0.10"

    [[metadata.products]]
    binnames = ["hello_world"]
    type = "exe"
    variable_name = "hello_world"

    [[metadata.sources]]
    path = "./bundled"
    target = ""
    type = "directory"
