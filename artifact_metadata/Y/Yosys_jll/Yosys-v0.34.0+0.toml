[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Yosys"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd yosys\n\nif [[ \"${target}\" == *-apple-* ]]; then\n    CONFIG=clang\n    OS=Darwin\nelif [[ \"${target}\" == *-freebsd* ]]; then\n    CONFIG=clang\n    OS=FreeBSD\nelif [[ \"${target}\" == *x86_64-w64-mingw32* ]]; then\n    CONFIG=msys2-64\n    OS=Windows\nelif [[ \"${target}\" == *i686-w64-mingw32* ]]; then\n    CONFIG=msys2-32\n    OS=Windows\nelse\n    CONFIG=gcc\n    OS=Linux\nfi\n\n# TODO: ABC does not build on windows\nif [[ \"${target}\" == *x86_64-w64-mingw32* ]] || [[ \"${target}\" == *i686-w64-mingw32* ]]; then\n    make install ENABLE_LIBYOSYS=1 ENABLE_ABC=0 ENABLE_TCL=0 OS=${OS} CONFIG=${CONFIG} PREFIX=${prefix} TCL_INCLUDE=${libdir} TCL_VERSION=tcl86 LIBDIR=${libdir} -j${nproc}\nelse\n    make install ENABLE_LIBYOSYS=1 OS=${OS} CONFIG=${CONFIG} PREFIX=${prefix} TCL_INCLUDE=${libdir} LIBDIR=${libdir} -j${nproc}\nfi\n\n# everything is a .so even if it is not... so fixup\nmv ${libdir}/libyosys.so  ${libdir}/libyosys.${dlext}\n"""
version = "v0.34.0"

