[metadata]
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Yosys"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin"]
script = """cd yosys\nif [[ \"${target}\" == *-apple-* ]] || [[ \"${target}\" == *-freebsd* ]]; then\n    CONFIG=clang\n    OS=Darwin\nelif [[ \"${target}\" == *-x86_64-w64-mingw32* ]]; then\n    CONFIG=msys2-64\n    OS=Windows\nelif [[ \"${target}\" == *-i686-w64-mingw32* ]]; then\n    CONFIG=msys2-32\n    OS=Windows\nelse\n    CONFIG=gcc\n    OS=Linux\nfi\n# TODO: we need mingw-dlfcn wrappers for windows plugin support\n# TODO: ABC does not build on windows\nmake ENABLE_LIBYOSYS=1 OS=${OS} CONFIG=${CONFIG} PREFIX=${prefix} LIBDIR=${libdir} -j${nproc}\nmake install ENABLE_LIBYOSYS=1 OS=${OS} PREFIX=${prefix} LIBDIR=${libdir}\nif [[ \"${target}\" == *-apple-* ]]; then\n    mv ${prefix}/lib/libyosys.so  ${prefix}/lib/libyosys.dylib\nfi\n"""
version = "v0.11.0"

