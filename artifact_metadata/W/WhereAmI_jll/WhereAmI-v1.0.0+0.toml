script = """cd ${WORKSPACE}/srcdir/whereami/\nmkdir -p \"${libdir}\"\nFLAGS=(-Isrc -O2 -std=c99 -fPIC)\nif [[ \"${target}\" == *-gnu* ]]; then\n    FLAGS+=(-ldl)\nfi\ncc src/whereami.c ${FLAGS[@]} -shared -o \"${libdir}/libwai.${dlext}\"\ninstall -Dvm 644 src/whereami.h \"${includedir}/whereami.h\"\ninstall_license LICENSE.MIT\n"""
version = "v1.0.0"

