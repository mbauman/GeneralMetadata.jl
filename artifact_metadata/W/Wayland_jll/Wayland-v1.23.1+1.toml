[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Wayland"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/wayland-*/\n\nmkdir build-host\ncd build-host\n\n# Hack to make the pkgconfig paths work on the host build\nln -s /workspace /workspace/destdir\n# Avoid parasitic linking on freebsd, somehow $prefix/lib ends up in /opt/x86_64-linux-musl/x86_64-linux-musl/sys-root/usr/local/lib\nmv $prefix/lib $prefix/lib_\n\nmeson .. \\\n    --native-file=\"${MESON_HOST_TOOLCHAIN}\" \\\n    --prefix ${host_prefix} --pkg-config-path ${host_prefix}/lib/pkgconfig \\\n    -Ddocumentation=false\nninja -j${nproc}\nninja install\nrm /workspace/destdir/workspace\ncd ..\n\nmv $prefix/lib_ $prefix/lib\n\nmkdir build-wayland\n\ncd build-wayland\nCMAKE=/usr/bin/cmake meson .. \\\n    --cross-file=\"${MESON_TARGET_TOOLCHAIN}\" \\\n    -Ddocumentation=false\nninja -j${nproc}\nninja install\n"""
version = "v1.23.1"

