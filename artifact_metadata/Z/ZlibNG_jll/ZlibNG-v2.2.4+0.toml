buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/6a07c43438abc10f6edfc8ec7b87c8122b7d9d9e/Z/ZlibNG/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.6.4"

[metadata]
augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "ZlibNG"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/zlib-ng\n# Correct Power build (see <https://github.com/zlib-ng/zlib-ng/issues/1648>)\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/power.patch\ncmake -B build \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DZLIB_ENABLE_TESTS=OFF\ncmake --build build --parallel ${nproc}\ncmake --install build\n"""
version = "v2.2.4"

    [[metadata.products]]
    dir_paths = []
    dlopen_flags = []
    dont_dlopen = false
    libnames = ["libz-ng", "libzlib-ng2"]
    type = "lib"
    variable_name = "libzng"

    [[metadata.sources]]
    hash = "860e4cff7917d93f54f5d7f0bc1d0e8b1a3cb988"
    type = "git"
    unpack_target = ""
    url = "https://github.com/zlib-ng/zlib-ng.git"
    [[metadata.sources]]
    follow_symlinks = false
    path = "bundled"
    target = ""
    type = "directory"
