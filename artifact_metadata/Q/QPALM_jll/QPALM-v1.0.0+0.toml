julia_compat = "1.6"
lazy_artifacts = false
name = "QPALM"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\ncd QPALM\nrmdir LADEL\nmv ../LADEL .\ncmake -Bbuild-jl -SQPALM \\\n    -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n    -DCMAKE_INSTALL_PREFIX:PATH=${prefix} \\\n    -DQPALM_WITH_JULIA:BOOL=On \\\n    -DCMAKE_BUILD_TYPE:STRING=Release \\\n    -DCMAKE_POSITION_INDEPENDENT_CODE:BOOL=On\ncmake --build build-jl -j\ncmake --install build-jl --component julia_modules\nmv LICENSE LICENSE.QPALM\ninstall_license LICENSE.QPALM\nmv LADEL/LICENSE LICENSE.LADEL\ninstall_license LICENSE.LADEL\nmv LADEL/thirdparty/SuiteSparse/AMD/Doc/License.txt LICENSE.AMD\ninstall_license LICENSE.AMD\n"""
version = "v1.0.0"

