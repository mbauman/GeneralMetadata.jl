buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/5d00e9b430a685c212e2206c6571e2490a6c6dac/M/MPFR/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.4.1"

[metadata]
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "MPFR"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/mpfr-*\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --enable-shared --disable-static --with-gmp=${prefix} --enable-thread-safe --enable-shared-cache --disable-float128 --disable-decimal-float\nmake -j${nproc}\nmake install\n\n# On Windows, make sure non-versioned filename exists...\nif [[ ${target} == *mingw* ]]; then\n    cp -v ${prefix}/bin/libmpfr-*.dll ${prefix}/bin/libmpfr.dll\nfi\n"""
version = "v4.1.1"

    [[metadata.dependencies]]
    compat = ""
    name = "GMP_jll"
    type = "dependency"
    version-major = 0
    version-minor = 0
    version-patch = 0

    [[metadata.products]]
    dir_paths = []
    dlopen_flags = []
    dont_dlopen = false
    libnames = ["libmpfr"]
    type = "lib"
    variable_name = "libmpfr"

    [[metadata.sources]]
    hash = "0c98a3f1732ff6ca4ea690552079da9c597872d30e96ec28414ee23c95558a7f"
    type = "archive"
    unpack_target = ""
    url = "https://www.mpfr.org/mpfr-4.1.0/mpfr-4.1.0.tar.xz"
