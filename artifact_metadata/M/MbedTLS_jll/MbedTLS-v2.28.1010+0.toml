[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.9"
lazy_artifacts = false
name = "MbedTLS"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "x86_64-linux-gnu-sanitize+memory"]
script = """shopt -s nullglob\ncd $WORKSPACE/srcdir/mbedtls\n\n# llvm-ranlib gets confused, use the binutils one\nif [[ \"${target}\" == *apple* && -f \"${WORKSPACE}/srcdir/patches/conditional/0001-Remove-flags-not-supported-by-ranlib.patch\" ]]; then\n    ln -sf /opt/${target}/bin/${target}-ranlib /opt/bin/ranlib\n    ln -sf /opt/${target}/bin/${target}-ranlib /opt/bin/${target}-ranlib\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/conditional/0001-Remove-flags-not-supported-by-ranlib.patch\"\nfi\nif [[ ${bb_full_target} == *-sanitize+memory* ]]; then\n    # Install msan runtime (for clang)\n    cp -rL ${libdir}/linux/* /opt/x86_64-linux-musl/lib/clang/*/lib/linux/\nfi\n# Apply patches that differ depending on the version of MbedTLS that we're building\nfor f in ${WORKSPACE}/srcdir/patches/*.patch; do\n    atomic_patch -p1 \"${f}\"\ndone\n\n# enable MD4\nsed \"s|//#define MBEDTLS_MD4_C|#define MBEDTLS_MD4_C|\" -i include/mbedtls/config.h\n\n# Only x86 Linux targets can actually execute the test suite\nif [[ \"${target}\" == *86*-linux-* ]]; then\n    BB_RUN_TESTS=\"On\"\nfi\n\nmkdir build && cd build\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n    -DCMAKE_C_STANDARD=99 \\\n    -DUSE_SHARED_MBEDTLS_LIBRARY=On \\\n    -DMBEDTLS_FATAL_WARNINGS=OFF \\\n    -DENABLE_TESTING=${BB_RUN_TESTS:-Off} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    ..\nmake -j${nproc}\n\nif [[ \"${BB_RUN_TESTS}\" ]]; then\n    make test ARGS=\"--output-on-failure\" || [[ \"${bb_full_target}\" == *-sanitize+memory ]]\nfi\n\nmake install\n\nif [[ \"${target}\" == *mingw* ]]; then\n    # For some reason, the build system doesn't set the `.dll` files as\n    # executable, which prevents them from being loaded.  Also, we need\n    # to explicitly use `${prefix}/lib` here because the build system\n    # is a simple one, and blindly uses `/lib`, even on Windows.\n    chmod +x ${prefix}/lib/*.dll\nfi\n"""
version = "v2.28.1010"

