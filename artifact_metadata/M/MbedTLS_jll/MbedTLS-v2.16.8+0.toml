[metadata]
dependencies = []
init_block = ""
lazy_artifacts = false
name = "MbedTLS"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/mbedtls\nmkdir -p $prefix/lib\n\n# llvm-ranlib gets confused, use the binutils one\nif [[ \"${target}\" == *apple* ]]; then\n    ln -sf /opt/${target}/bin/${target}-ranlib /opt/bin/ranlib\n    ln -sf /opt/${target}/bin/${target}-ranlib /opt/bin/${target}-ranlib\nfi\n\n# enable MD4\nsed \"s|//#define MBEDTLS_MD4_C|#define MBEDTLS_MD4_C|\" -i include/mbedtls/config.h \n\ncmake -DCMAKE_INSTALL_PREFIX=$prefix -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" -DUSE_SHARED_MBEDTLS_LIBRARY=On\nmake -j${nproc} && make install\n"""
version = "v2.16.6"

