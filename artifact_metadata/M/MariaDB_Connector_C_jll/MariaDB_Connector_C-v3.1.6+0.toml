buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/4482eabf0843fd609eb50161d94d498b90b3831d/M/MariaDB_Connector_C/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.2.2"

[metadata]
dependencies = ["LibCURL_jll", "Libiconv_jll", "OpenSSL_jll", "Zlib_jll"]
name = "MariaDB_Connector_C"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/mariadb-*/\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    for p in ../patches/*.patch; do\n        atomic_patch -p1 \"${p}\"\n    done\n    export CFLAGS=\"-std=c99\"\n    # Minimum version of Windows supported by MariaDB is 7,\n    # see tables in https://docs.microsoft.com/en-us/windows/win32/winprog/using-the-windows-headers\n    if [[ \"${nbits}\" == 32 ]]; then\n        export CFLAGS=\"${CFLAGS} -D_WIN32_WINNT=0x0601\"\n    elif [[ \"${nbits}\" == 64 ]]; then\n        export CFLAGS=\"${CFLAGS} -DNTDDI_VERSION=0x06010000\"\n    fi\nelif [[ \"${target}\" == *-apple-* ]]; then\n    # Nuke header files in the sysroot\n    # to avoid they'll be picked up by CMake\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/openssl\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/{iconv.h,libcharset.h,localcharset.h}\n\n    SYMBS_DEFS=()\n    for sym in iconv iconv_close iconv_open; do\n        SYMBS_DEFS+=(-D${sym}=lib${sym})\n    done\n    export CFLAGS=\"${SYMBS_DEFS[@]}\"\nfi\n\nmkdir build && cd build\ncmake .. -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DWITH_MYSQLCOMPAT=OFF \\\n    -DWITH_EXTERNAL_ZLIB=ON \\\n    -DZLIB_FOUND=ON \\\n    -DZLIB_INCLUDE_DIR=${prefix}/include \\\n    -DZLIB_LIBRARY=${libdir}/libz.${dlext} \\\n    -DOPENSSL_FOUND=ON \\\n    -DOPENSSL_CRYPTO_LIBRARY=${libdir}/libcrypto.${dlext} \\\n    -DOPENSSL_SSL_LIBRARY=${libdir}/libssl.${dlext} \\\n    -DICONV_LIBRARIES=${libdir}/libiconv.${dlext} \\\n    -DICONV_INCLUDE_DIR=${prefix}/include\nmake -j${nproc}\nmake install\ninstall_license ../COPYING.LIB\n"""
sources = [{"https://github.com/mariadb-corporation/mariadb-connector-c.git" = "63df45ce3df3fbc04d8fab9bceb77f9d1cccd4aa"}, "./bundled"]
version = "v3.1.6"

    [[metadata.products]]
    dir_paths = ["lib/mariadb"]
    dont_dlopen = false
    libnames = ["libmariadb"]
    type = "lib"
    variable_name = "libmariadb"
