buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/5b82b42a695d8092bcb777412dbea5c0c6274a4a/M/micromamba/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.5.6"

[metadata]
augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = true
name = "micromamba"
platforms = ["x86_64-linux-gnu", "aarch64-linux-gnu", "powerpc64le-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-w64-mingw32"]
script = """echo target=$target\n\n# unpack the tarball (BinaryBuilder does not natively support bzip2 so we do this ourselves)\ncd $WORKSPACE/srcdir\nmkdir micromamba\ncd micromamba\ntar xjf ../micromamba-$target.tar.bz2\n\n# install the binary\nmkdir -p $bindir\nif [[ $target = *-w64-* ]]; then\n    cp Library/bin/micromamba.exe $bindir/micromamba.exe\nelse\n    cp bin/micromamba $bindir/micromamba\nfi\n\n# install the licenses\nmkdir -p $prefix/share/licenses/micromamba\ncp info/licenses/* $prefix/share/licenses/micromamba/\n"""
version = "v1.0.0"

