buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/64a4252c33bb61f9012c4a363e0256df4b9d4f9f/M/micromamba/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.6.5"

[metadata]
augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = true
name = "micromamba"
platforms = ["x86_64-linux-gnu", "aarch64-linux-gnu", "powerpc64le-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-w64-mingw32"]
script = """# Unpack only the tarball for our target\ncd $WORKSPACE/srcdir\nmkdir micromamba\ncd micromamba\ntar xjf ../micromamba-$target.tar.bz2\n\n# install the binary\nif [[ $target = *-w64-* ]]; then\n    install -Dvm 755 Library/bin/micromamba.exe \"${bindir}/micromamba.exe\"\nelse\n    install -Dvm 755 bin/micromamba \"${bindir}/micromamba\"\nfi\n\n# install the licenses\ninstall_license info/licenses/*.txt\ninstall_license info/licenses/mamba/*\n"""
version = "v2.3.1"

