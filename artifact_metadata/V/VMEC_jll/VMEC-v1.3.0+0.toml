augment_platform_block = """    using Base.BinaryPlatforms\n    # Can't use Preferences since we might be running this very early with a non-existing Manifest\nMPIPreferences_UUID = Base.UUID(\"3da0fdf6-3ccc-4f1b-acd9-58baa6c99267\")\nconst preferences = Base.get_preferences(MPIPreferences_UUID)\n\n# Keep logic in sync with MPIPreferences.jl\nfunction augment_mpi!(platform)\n    # Doesn't need to be `const` since we depend on MPIPreferences so we\n    # invalidate the cache when it changes.\n    binary = get(preferences, \"binary\", Sys.iswindows() ? \"MicrosoftMPI_jll\" : \"MPICH_jll\")\n\n    abi = if binary == \"system\"\n        let abi = get(preferences, \"abi\", nothing)\n            if abi === nothing\n                error(\"MPIPreferences: Inconsistent state detected, binary set to system, but no ABI set.\")\n            else\n                abi\n            end\n        end\n    elseif binary == \"MicrosoftMPI_jll\"\n        \"MicrosoftMPI\"\n    elseif binary == \"MPICH_jll\"\n        \"MPICH\"\n    elseif binary == \"OpenMPI_jll\"\n        \"OpenMPI\"\n    elseif binary == \"MPItrampoline_jll\"\n        \"MPItrampoline\"\n    else\n        error(\"Unknown binary: $binary\")\n    end\n\n    if !haskey(platform, \"mpi\")\n        platform[\"mpi\"] = abi\n    end\n    return platform\nend\n\n    function augment_platform!(platform::Platform)\n        augment_mpi!(platform)\n    end\n"""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = true
name = "VMEC"
platforms = ["x86_64-linux-gnu-libgfortran4-mpi+mpich", "x86_64-linux-gnu-libgfortran5-mpi+mpich", "x86_64-apple-darwin-libgfortran4-mpi+mpich", "x86_64-apple-darwin-libgfortran5-mpi+mpich", "x86_64-linux-gnu-libgfortran4-mpi+openmpi", "x86_64-linux-gnu-libgfortran5-mpi+openmpi", "x86_64-apple-darwin-libgfortran4-mpi+openmpi", "x86_64-apple-darwin-libgfortran5-mpi+openmpi", "x86_64-w64-mingw32-libgfortran4-mpi+microsoftmpi", "x86_64-w64-mingw32-libgfortran5-mpi+microsoftmpi", "x86_64-linux-gnu-libgfortran4-mpi+mpitrampoline", "x86_64-linux-gnu-libgfortran5-mpi+mpitrampoline", "x86_64-apple-darwin-libgfortran4-mpi+mpitrampoline", "x86_64-apple-darwin-libgfortran5-mpi+mpitrampoline"]
script = """cd ${WORKSPACE}/srcdir/VMEC*\n# From the SCALAPACK build_tarballs with MPItrampoline\n# We need to specify the MPI libraries explicitly because the\n# CMakeLists.txt doesn't properly add them when linking\nMPILIBS=()\nif grep -q MSMPI_VER \"${prefix}/include/mpi.h\"; then\n    MPILIBS=(-lmsmpifec64 -lmsmpi64)\nelif grep -q MPICH \"${prefix}/include/mpi.h\"; then\n    MPILIBS=(-lmpifort -lmpi)\nelif grep -q MPItrampoline \"${prefix}/include/mpi.h\"; then\n    MPILIBS=(-lmpitrampoline)\n    atomic_patch -p1 ${WORKSPACE}/srcdir/patches/mpi_inc.patch\n    MPIF_PATH=$(find ${libdir} -name 'mpif.h')\n    MPIF_PATH=$(sed \"s:\\/:\\\\\\/:g\" <<< \"$MPIF_PATH\")\n    sed \"s/INCLUDE \\'mpif.h\\'/INCLUDE \\'${MPIF_PATH}\\'/\" Sources/LIBSTELL_minimal/mpi_inc.f | cat > Sources/LIBSTELL_minimal/mpi_inc.patched\n    mv Sources/LIBSTELL_minimal/mpi_inc.patched Sources/LIBSTELL_minimal/mpi_inc.f\nelif grep -q OMPI_MAJOR_VERSION \"$prefix/include/mpi.h\"; then\n    MPILIBS=(-lmpi_usempif08 -lmpi_usempi_ignore_tkr -lmpi_mpifh -lmpi)\nfi\nF_FLAGS=(-O3)\n# Add `-fallow-argument-mismatch` if supported\n: >empty.f\nif gfortran -c -fallow-argument-mismatch empty.f >/dev/null 2>&1; then\n    F_FLAGS+=(-fallow-argument-mismatch)\nfi\nrm -f empty.*\n\nif [[ ${target} == *mingw* ]]; then\n     sed \"s/LT_INIT/LT_INIT(win32-dll)/\" configure.ac | cat > configure.ac.2\n     mv configure.ac.2 configure.ac\n     ./autogen.sh\n     ./configure CC=gcc FC=gfortran F77=gfortran --build=${MACHTYPE} --with-mkl --host=${target} --target=${target} --prefix=${prefix}\n     # Deal with the issue that gcc doesn't accept -no-undefined at configure step\n     sed \"s/AM_LDFLAGS =/AM_LDFLAGS =-no-undefined/\" Makefile | cat > Makefile.2\n     mv Makefile.2 Makefile\n     make && make install && make clean\n\n     ./configure CC=gcc FC=gfortran F77=gfortran --build=${MACHTYPE} --host=${target} --target=${target} --prefix=${prefix}\n     # Deal with the issue that gcc doesn't accept -no-undefined at configure step\n     sed \"s/AM_LDFLAGS =/AM_LDFLAGS =-no-undefined/\" Makefile | cat > Makefile.2\n     mv Makefile.2 Makefile\n     make && make install && make clean\n\nelse\n    ./autogen.sh\n    ./configure CC=mpicc FC=mpifort F77=mpifort FFLAGS=\"${F_FLAGS[*]}\" FCFLAGS=\"${F_FLAGS}\" LIBS=\"${MPILIBS[*]}\" --with-mkl --build=${MACHTYPE} --host=${target} --target=${target} --prefix=${prefix}\n    make && make install && make clean\n\n    ./configure CC=mpicc FC=mpifort F77=mpifort FFLAGS=\"${F_FLAGS[*]}\" FCFLAGS=\"${F_FLAGS[*]}\" LIBS=\"${MPILIBS[*]}\" --build=${MACHTYPE} --host=${target} --target=${target} --prefix=${prefix}\n    make && make install && make clean\nfi\n"""
version = "v1.3.0"

