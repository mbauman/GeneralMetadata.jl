[metadata]
augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "ViennaRNA"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/ViennaRNA*/\n\n# fixes linking errors\natomic_patch -p1 ../patches/fix-ViennaRNA-1.8.5-compile.patch\n\nupdate_configure_scripts --reconf\n\n./configure \\\n    --prefix=${prefix} --build=${MACHTYPE} --host=${target} \\\n    --without-perl \\\n    --with-cluster \\\n    --without-kinfold --without-forester\n\nmake -j${nproc}\nmake install\n\n# create and install a shared library libRNA\n\"${CC}\" -g -O2 \\\n    -shared -o \"${libdir}/libRNA.${dlext}\" \\\n    -Wl,$(flagon --whole-archive) ./lib/libRNA.a -Wl,$(flagon --no-whole-archive)\n\n# install licenses\n# cp RNAforester/COPYING COPYING-RNAforester\n# install_license COPYING-RNAforester\ninstall_license COPYING\n"""
version = "v1.8.5"

