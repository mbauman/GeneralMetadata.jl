name = "DynarePreprocessor"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd ${WORKSPACE}/srcdir/preprocessor\n\n# remove -lstdc++fs in Makefile.am\nsed s/-lstdc++fs// -i src/Makefile.am\n\n# Remove flex from RootFS to let use our flex from `flex_jll`\nrm -f /usr/bin/flex\n\nautoreconf -si\n\nupdate_configure_scripts\n./configure --prefix=$prefix  --build=${MACHTYPE} --host=${target} --disable-doc\nmake -j${nproc}\nmake install\nmkdir -p \"${bindir}\"\nstrip \"src/dynare-preprocessor${exeext}\"\ncp \"src/dynare-preprocessor${exeext}\" \"${bindir}\"\ninstall_license COPYING\n"""
version = "v6.0.2"

