name = "DynarePreprocessor"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd ${WORKSPACE}/srcdir/preprocessor\n\n# Remove flex from RootFS to let use our flex from `flex_jll`\nrm -f /usr/bin/flex\n\nif [[ \"${target}\" == *-freebsd* ]]; then\n    export CPPFLAGS=\"-I${includedir}\"\n    atomic_patch -p1 \"../patches/patches.patch\"\nelif [[ \"${target}\" == *-apple-* ]]; then\n    pushd $WORKSPACE/srcdir/MacOSX11.*.sdk\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    cp -ra usr/* \"/opt/${target}/${target}/sys-root/usr/.\"\n    cp -ra System \"/opt/${target}/${target}/sys-root/.\"\n    export MACOSX_DEPLOYMENT_TARGET=11.3\n    popd\n    atomic_patch -p1 \"../patches/patches.patch\"\nfi\n\nautoreconf -si\n\nupdate_configure_scripts\n./configure --prefix=$prefix  --build=${MACHTYPE} --host=${target} --disable-doc\nmake -j${nproc}\nmake install\nmkdir -p \"${bindir}\"\nstrip \"src/dynare-preprocessor${exeext}\"\ncp \"src/dynare-preprocessor${exeext}\" \"${bindir}\"\ninstall_license COPYING\n"""
version = "v6.1.0"

