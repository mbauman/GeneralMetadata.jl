buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/1a499efa2e07f5cffb5e244f44f5cad9f2c0afb9/D/DataEcon/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.5.6"

[metadata]
augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "DataEcon"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/DataEcon/\nmake -j${nproc} all LIBDE=\"lib/libdaec.${dlext}\"\ninstall_license LICENSE.md\ninstall -Dvm 755 \"bin/sqlite3${exeext}\" \"${bindir}/sqlite3${exeext}\"\ninstall -Dvm 755 \"bin/desh${exeext}\" \"${bindir}/desh${exeext}\"\ninstall -Dvm 755 \"bin/daec2csv${exeext}\" \"${bindir}/daec2csv${exeext}\"\ninstall -Dvm 755 \"lib/libdaec.${dlext}\" \"${libdir}/libdaec.${dlext}\"\ninstall -Dvm 644 \"include/daec.h\" \"${includedir}/daec.h\"\n"""
version = "v0.3.1"

    [[metadata.products]]
    dir_paths = []
    dlopen_flags = []
    dont_dlopen = false
    libnames = ["libdaec", "daec"]
    type = "lib"
    variable_name = "libdaec"
    [[metadata.products]]
    binnames = ["sqlite3"]
    type = "exe"
    variable_name = "sqlite3shell"
    [[metadata.products]]
    binnames = ["desh"]
    type = "exe"
    variable_name = "desh"
    [[metadata.products]]
    binnames = ["daec2csv"]
    type = "exe"
    variable_name = "daec2csv"
    [[metadata.products]]
    paths = ["include/daec.h"]
    type = "file"
    variable_name = "daec_header"

    [[metadata.sources]]
    hash = "d58732b8a1cb3a4d9a82796bce3c5732f74086ca"
    type = "git"
