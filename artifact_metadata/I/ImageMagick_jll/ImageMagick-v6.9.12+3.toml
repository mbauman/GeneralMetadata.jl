script = """cd $WORKSPACE/srcdir/ImageMagick6*/\nif [[ \"${target}\" == *-linux-gnu ]]; then\n    atomic_patch -p1 ../patches/utilities-link-rt.patch\nfi\natomic_patch -p1 ../patches/check-have-clock-realtime.patch\n./configure --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --without-x \\\n    --disable-openmp \\\n    --disable-installed \\\n    --disable-dependency-tracking \\\n    --without-frozenpaths \\\n    --without-perl \\\n    --disable-docs \\\n    --disable-static\nmake -j${nproc}\nmake install\n"""
version = "v6.9.12"

