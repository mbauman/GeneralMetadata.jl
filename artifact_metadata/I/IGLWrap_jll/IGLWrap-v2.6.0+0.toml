buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/5895b65ba800860f89606e6af36343f15372e85e/I/IGLWrap/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.6.4"

[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "IGLWrap"
platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "aarch64-apple-darwin"]
script = """apk del cmake\n\ncd $WORKSPACE/srcdir\nmkdir -p build\ncd build\ncmake \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    `# We can't run try_run in cross-compilation mode, pass the exit code and stdout of the program (the value of __cplusplus macro)` \\\n    -DCGAL_test_cpp_version_RUN_RES=0 \\\n    -DCGAL_test_cpp_version_RUN_RES__TRYRUN_OUTPUT=\"$(c++ -xc++ - -E -dM < /dev/null | grep -oP '__cplusplus \\K.*')\" \\\n    ..\nmake -j${nproc}\nmake install\ninstall_license /usr/share/licenses/GPL-3.0+\n"""
version = "v2.6.0"

    [[metadata.dependencies]]
    compat = ""
    name = "CMake_jll"
    platforms = ["any"]
    top_level = false
    type = "hostdependency"
    version-major = 3
    version-minor = 28
    version-patch = 1

    [[metadata.products]]
    dir_paths = []
    dlopen_flags = ["RTLD_NOW", "RTLD_LOCAL"]
    dont_dlopen = false
    libnames = ["libiglwrap"]
    type = "lib"
    variable_name = "libiglwrap"

    [[metadata.sources]]
    follow_symlinks = false
    path = "./iglwrap"
    target = ""
    type = "directory"
