[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Infernal"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/infernal-*/\n\natomic_patch -p1 ../patches/rmark-missing-gsl-link.patch\n\n# Update the config.sub from infernal.  Otherwise we get an error when running\n# configure: \"Invalid configuration `x86_64-linux-musl'.\"\nupdate_configure_scripts\n\n# generate configure script\nautoreconf -vi\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} \\\n    --enable-pic --enable-threads --with-gsl\n\nmake -j${nproc}\nmake install\n\ncd easel && make install\nmv LICENSE LICENSE.easel\n\ninstall_license LICENSE.easel\ninstall_license ../LICENSE\n"""
version = "v1.1.5"

