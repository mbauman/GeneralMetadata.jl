metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.4.2"

[metadata]
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Infernal"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/infernal-*/\n\nmv ../easel-*/ easel\nmv ../hmmer-*/ hmmer\n\n# Update the config.sub from infernal.  Otherwise we get an error when running\n# configure: \"Invalid configuration `x86_64-linux-musl'.\"\nupdate_configure_scripts\n\n# generate configure script\nautoreconf -vi\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} \\\n    --enable-pic --enable-threads --with-gsl\n\nmake -j${nproc}\nmake install\n\ninstall_license LICENSE\n"""
version = "v1.1.4"

