julia_compat = "1.6"
lazy_artifacts = false
name = "bacnet_stack"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\nfor f in ${WORKSPACE}/srcdir/patches/*.patch; do\n    atomic_patch -p1 ${f}\ndone\ncmake -B build \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DBACNET_STACK_BUILD_APPS=OFF \\\n    -DBACNET_BUILD_SERVER_MINI_APP=OFF \\\n    -DBACNET_BUILD_SERVER_BASIC_APP=OFF \\\n    -DBACNET_BUILD_PIFACE_APP=OFF \\\n    -DBACNET_BUILD_BACPOLL_APP=OFF \\\n    -DBACNET_BUILD_BACDISCOVER_APP=OFF \\\n    bacnet-stack\ncmake -B build bacnet-stack\ncmake --build build --parallel ${nproc}\ncmake --install build\nmkdir -p ${prefix}/share/licenses/bacnet_stack \ncp bacnet-stack/license/* ${prefix}/share/licenses/bacnet_stack\n"""
version = "v1.4.1"

