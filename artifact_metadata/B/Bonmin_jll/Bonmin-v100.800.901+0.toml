[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Bonmin"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/Bonmin\n\nif [[ ${target} == *mingw* ]]; then\n    sed -i s/dllimport/dllexport/ \"${includedir}/coin-or/IpoptConfig.h\"\n    atomic_patch -p1 ${WORKSPACE}/srcdir/patches/fix_dllexport.patch\nfi\n\n# Remove misleading libtool files\nrm -f ${libdir}/*.la\nupdate_configure_scripts\n\n# old and custom autoconf\nsed -i s/elf64ppc/elf64lppc/ configure\n\nexport CPPFLAGS=\"${CPPFLAGS} -I${includedir} -I${includedir}/coin -I${includedir}/coin-or\"\nexport CXXFLAGS=\"${CXXFLAGS} -std=c++11\"\n\nif [[ ${target} == *mingw* ]]; then\n    export LDFLAGS=\"-L${libdir}\"\n    export LT_LDFLAGS=\"-no-undefined\"\nfi\n\n./configure \\\n    --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --disable-pkg-config \\\n    --disable-debug \\\n    --enable-shared \\\n    lt_cv_deplibs_check_method=pass_all \\\n    --with-asl-lib=\"-lasl\" \\\n    --with-coindepend-lib=\"-lCbc -lCgl -lOsiClp -lClp -lOsi -lCoinUtils -lipoptamplinterface -lipopt\"\n\nmake -j${nproc}\nmake install\n\n# Prevent IpoptConfig.h from being included in the tarball after editing it above.\nrm \"${includedir}/coin-or/IpoptConfig.h\"\n"""
version = "v100.800.901"

