name = "x265"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/*x265*/\n# Remove `-march` and `-mcpu` flags\nSED_SCRIPTS=(-e  -e -- 's/-mcpu=native //g')\nfor CMAKE_FILE in source/CMakeLists.txt source/dynamicHDR10/CMakeLists.txt; do\n    sed -i 's/add_definitions(-march=i686)//g' \"${CMAKE_FILE}\"\n    sed -i 's/-mcpu=native //g' \"${CMAKE_FILE}\"\ndone\nmkdir bld && cd bld\nFLAGS=()\nif [[ \"${target}\" == i686-* ]] || [[ \"${target}\" == aarch64-apple-darwin* ]]; then\n    FLAGS+=(-DENABLE_ASSEMBLY=OFF)\nfi\ncmake -DCMAKE_INSTALL_PREFIX=\"${prefix}\" \\\n    -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n    -DENABLE_PIC=ON \\\n    -DENABLE_SHARED=ON \\\n    ${FLAGS[@]} \\\n    ../source\nmake -j${nproc}\nmake install\n# Remove the large static archive\nrm  ${prefix}/lib/libx265.a\n"""
version = "v3.5.0"

