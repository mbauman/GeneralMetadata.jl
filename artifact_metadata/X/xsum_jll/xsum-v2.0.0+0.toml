script = """cd $WORKSPACE/srcdir/xsum\nmkdir -p ${libdir}\nif [[ $target == i686-* ]]; then\n    xsumfpmath=\"-mfpmath=sse\"\nfi\n${CC} -shared -fPIC -O3 -std=c99 ${xsumfpmath} -fno-inline-functions -o ${libdir}/libxsum.${dlext} xsum.c\n"""
version = "v2.0.0"

