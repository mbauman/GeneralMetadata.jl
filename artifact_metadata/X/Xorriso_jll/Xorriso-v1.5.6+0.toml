[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Xorriso"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/xorriso-*\n\n# MacOS specific configuration\nif [[ \"${target}\" == *-apple-* ]]; then\n    export LDFLAGS=\"-L${libdir}\"\n    export LIBS=\"-liconv\"\n    export CPPFLAGS=\"-I${includedir}\"\nfi\n\nupdate_configure_scripts # to add riscv support\n\n./configure --prefix=$prefix --build=${MACHTYPE} --host=${target} --disable-launch-frontend\nmake -j${nproc}\n\ninstall_license COPYING\ninstall -Dvm 755 \"xorriso/xorriso${exeext}\" \"${bindir}/xorriso${exeext}\"\n"""
version = "v1.5.6"

