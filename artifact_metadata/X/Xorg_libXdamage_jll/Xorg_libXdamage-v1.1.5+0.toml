buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/adaaadd8030452ef91feee73de4fb624b323016d/X/Xorg_libXdamage/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.2.2"

[metadata]
dependencies = ["Xorg_damageproto_jll", "Xorg_libXfixes_jll"]
name = "Xorg_libXdamage"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-unknown-freebsd11.1"]
script = """cd $WORKSPACE/srcdir/libXdamage-*/\nCPPFLAGS=\"-I${prefix}/include\"\n# When compiling for things like ppc64le, we need newer `config.sub` files\nupdate_configure_scripts\n./configure --prefix=${prefix} --host=${target} --enable-malloc0returnsnull=no\nmake -j${nproc}\nmake install\n"""
version = "v1.1.5"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libXdamage"]
    type = "lib"
    variable_name = "libXdamage"

    [[metadata.sources]]
