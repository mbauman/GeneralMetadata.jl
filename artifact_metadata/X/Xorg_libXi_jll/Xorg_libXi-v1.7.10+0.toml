buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/adaaadd8030452ef91feee73de4fb624b323016d/X/Xorg_libXi/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.2.2"

[metadata]
dependencies = ["Xorg_inputproto_jll", "Xorg_libXext_jll", "Xorg_libXfixes_jll", "Xorg_util_macros_jll"]
name = "Xorg_libXi"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-unknown-freebsd11.1"]
script = """cd $WORKSPACE/srcdir/libXi-*/\nCPPFLAGS=\"-I${prefix}/include\"\n# When compiling for things like ppc64le, we need newer `config.sub` files\nupdate_configure_scripts\n./configure --prefix=${prefix} --host=${target} --enable-malloc0returnsnull=no\nmake -j${nproc}\nmake install\n"""
version = "v1.7.10"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libXi"]
    type = "lib"
    variable_name = "libXi"

    [[metadata.sources]]
