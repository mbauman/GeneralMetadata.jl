buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/722f0a81f92e0e25d7eeccf465f28efbdc02f8b5/X/XNNPACK/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.5.2"

[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "XNNPACK"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "i686-linux-musl", "x86_64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin"]
script = """cd $WORKSPACE/srcdir/XNNPACK\natomic_patch -p1 ../patches/xnnpack-disable-fast-math.patch\natomic_patch -p1 ../patches/xnnpack-pic.patch\nmkdir build\ncd build\n# Omitted cmake define of CPUINFO_SOURCE_DIR as there is a patch for cpuinfo\ncmake \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_INSTALL_LIBDIR=$libdir \\\n    -DCLOG_SOURCE_DIR=$WORKSPACE/srcdir/cpuinfo \\\n    -DFP16_SOURCE_DIR=$WORKSPACE/srcdir/FP16 \\\n    -DFXDIV_SOURCE_DIR=$WORKSPACE/srcdir/FXdiv \\\n    -DPSIMD_SOURCE_DIR=$WORKSPACE/srcdir/psimd \\\n    -DPTHREADPOOL_SOURCE_DIR=$WORKSPACE/srcdir/pthreadpool \\\n    -DXNNPACK_LIBRARY_TYPE=shared \\\n    -DXNNPACK_BUILD_TESTS=OFF \\\n    -DXNNPACK_BUILD_BENCHMARKS=OFF \\\n    ..\ncmake --build . -- -j $nproc\nmake install\ninstall_license ../LICENSE\n"""
version = "v0.0.20200225"

