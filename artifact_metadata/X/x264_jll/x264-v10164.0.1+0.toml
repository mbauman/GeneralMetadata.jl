julia_compat = "1.6"
lazy_artifacts = false
name = "x264"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/x264*\nif [[ \"${target}\" == x86_64* ]] || [[ \"${target}\" == i686* ]]; then\n    export AS=nasm\nelse\n    export AS=\"${CC}\"\nfi\nif [[ \"${target}\" == riscv64-* ]]; then\n    # Update configure scripts to make riscv64 architecture work: https://code.videolan.org/videolan/x264/-/issues/52\n    update_configure_scripts\nfi\n# Remove `-march` flag from `configure` script\nsed -i 's/ -march=i686//g' configure\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --enable-shared --enable-pic --disable-static\n# Remove unsafe compilation flag\nsed -i 's/ -ffast-math//g' config.mak\nmake -j${nproc}\nmake install\n"""
version = "v10164.0.1"

