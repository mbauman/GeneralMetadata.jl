buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/2aff6fb9c4d5b4ef5434b68fe7a4182071f17467/X/XML2/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
system = "Yggdrasil"
version = "0.2.2"

[metadata]
dependencies = ["Zlib_jll", "Libiconv_jll"]
name = "XML2"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/libxml2-*\n./autogen.sh --prefix=${prefix} --host=${target} \\\n    --without-python \\\n    --with-zlib=${prefix} \\\n    --with-iconv=${prefix}\nmake -j${nproc} install\n"""
version = "v2.9.9"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libxml2"]
    type = "lib"
    variable_name = "libxml2"
    [[metadata.products]]
    binnames = ["xmlcatalog"]
    type = "exe"
    variable_name = "xmlcatalog"
    [[metadata.products]]
    binnames = ["xmllint"]
    type = "exe"
    variable_name = "xmllint"

    [[metadata.sources]]
    "https://github.com/GNOME/libxml2/archive/v2.9.9.tar.gz" = "d673f0284cec867ee00872a8152e0c3c09852f17fd9aa93f07579a37534f0bfe"
