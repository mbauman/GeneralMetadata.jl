augment_platform_block = """    using Base.BinaryPlatforms\n    # Can't use Preferences since we might be running this very early with a non-existing Manifest\nMPIPreferences_UUID = Base.UUID(\"3da0fdf6-3ccc-4f1b-acd9-58baa6c99267\")\nconst preferences = Base.get_preferences(MPIPreferences_UUID)\n\n# Keep logic in sync with MPIPreferences.jl\nfunction augment_mpi!(platform)\n    # Doesn't need to be `const` since we depend on MPIPreferences so we\n    # invalidate the cache when it changes.\n    # Note: MPIPreferences uses `Sys.iswindows()` without the `platform` argument.\n    binary = get(preferences, \"binary\", Sys.iswindows(platform) ? \"MicrosoftMPI_jll\" : \"MPICH_jll\")\n\n    abi = if binary == \"system\"\n        let abi = get(preferences, \"abi\", nothing)\n            if abi === nothing\n                error(\"MPIPreferences: Inconsistent state detected, binary set to system, but no ABI set.\")\n            else\n                abi\n            end\n        end\n    elseif binary == \"MicrosoftMPI_jll\"\n        \"MicrosoftMPI\"\n    elseif binary == \"MPICH_jll\"\n        \"MPICH\"\n    elseif binary == \"OpenMPI_jll\"\n        \"OpenMPI\"\n    elseif binary == \"MPItrampoline_jll\"\n        \"MPItrampoline\"\n    else\n        error(\"Unknown binary: $binary\")\n    end\n\n    if !haskey(platform, \"mpi\")\n        platform[\"mpi\"] = abi\n    end\n    return platform\nend\n\n    augment_platform!(platform::Platform) = augment_mpi!(platform)\n"""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = true
name = "NetCDF"
platforms = ["i686-linux-gnu-mpi+mpich", "x86_64-linux-gnu-mpi+mpich", "aarch64-linux-gnu-mpi+mpich", "armv6l-linux-gnueabihf-mpi+mpich", "armv7l-linux-gnueabihf-mpi+mpich", "powerpc64le-linux-gnu-mpi+mpich", "i686-linux-musl-mpi+mpich", "x86_64-linux-musl-mpi+mpich", "aarch64-linux-musl-mpi+mpich", "armv6l-linux-musleabihf-mpi+mpich", "armv7l-linux-musleabihf-mpi+mpich", "x86_64-apple-darwin-mpi+mpich", "aarch64-apple-darwin-mpi+mpich", "x86_64-unknown-freebsd-mpi+mpich", "i686-linux-gnu-mpi+openmpi", "x86_64-linux-gnu-mpi+openmpi", "aarch64-linux-gnu-mpi+openmpi", "armv7l-linux-gnueabihf-mpi+openmpi", "powerpc64le-linux-gnu-mpi+openmpi", "i686-linux-musl-mpi+openmpi", "x86_64-linux-musl-mpi+openmpi", "aarch64-linux-musl-mpi+openmpi", "armv6l-linux-musleabihf-mpi+openmpi", "armv7l-linux-musleabihf-mpi+openmpi", "x86_64-apple-darwin-mpi+openmpi", "aarch64-apple-darwin-mpi+openmpi", "x86_64-unknown-freebsd-mpi+openmpi", "i686-w64-mingw32-mpi+microsoftmpi", "x86_64-w64-mingw32-mpi+microsoftmpi", "i686-linux-gnu-mpi+mpitrampoline", "x86_64-linux-gnu-mpi+mpitrampoline", "aarch64-linux-gnu-mpi+mpitrampoline", "armv6l-linux-gnueabihf-mpi+mpitrampoline", "armv7l-linux-gnueabihf-mpi+mpitrampoline", "powerpc64le-linux-gnu-mpi+mpitrampoline", "x86_64-apple-darwin-mpi+mpitrampoline", "aarch64-apple-darwin-mpi+mpitrampoline"]
script = """cd $WORKSPACE/srcdir/netcdf-c*\n\nexport CPPFLAGS=\"-I${includedir}\"\nexport LDFLAGS=\"-L${libdir}\"\nexport LDFLAGS_MAKE=\"${LDFLAGS}\"\nCONFIGURE_OPTIONS=\"\"\n\n# Apply patch https://github.com/Unidata/netcdf-c/pull/2690\natomic_patch -p1 ../patches/0001-curl-cainfo.patch\n\nif [[ ${target} == *-mingw* ]]; then\n    # we should determine the dll version (?) automatically\n    export LIBS=\"-lhdf5-310 -lhdf5_hl-310 -lcurl-4 -lz\"\n    # linking fails with: \"libtool:   error: can't build x86_64-w64-mingw32 shared library unless -no-undefined is specified\"\n    # unless -no-undefined is added to LDFLAGS\n    LDFLAGS_MAKE=\"${LDFLAGS} ${LIBS} -no-undefined -Wl,--export-all-symbols\"\n\n    # additional configure options from\n    # https://github.com/Unidata/netcdf-c/blob/5df5539576c5b2aa8f31d4b50c4f8258925589dd/.github/workflows/run_tests_win_mingw.yml#L38\n    CONFIGURE_OPTIONS=\"--disable-byterange\"\nfi\n\nif [[ ${target} -ne x86_64-linux-gnu ]]; then\n    # utilities are necessary to run the tests\n    CONFIGURE_OPTIONS=\"$CONFIGURE_OPTIONS --disable-utilities\"\nfi\n\n\nif [[ ${target} == x86_64-linux-musl ]]; then\n    # see\n    # https://github.com/JuliaPackaging/Yggdrasil/blob/48af117395188f48d361a46ea929ee7563d9c2e4/A/ADIOS2/build_tarballs.jl\n\n    # HDF5 needs libcurl, and it needs to be the BinaryBuilder libcurl, not the system libcurl.\n    # MPI needs libevent, and it needs to be the BinaryBuilder libevent, not the system libevent.\n    rm /usr/lib/libcurl.*\n    rm /usr/lib/libevent*\n    rm /usr/lib/libnghttp2.*\nfi\n\nif [[ ${target} == x86_64-unknown-freebsd* ]]; then\n     # based on the output of mpicc --showme\n     export LIBS=\"-lmpi -lm -lexecinfo -lutil -lz\"\nfi\n\n\n./configure --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --enable-shared \\\n    --disable-static \\\n    --disable-dap-remote-tests \\\n    --disable-plugins \\\n    $CONFIGURE_OPTIONS\n\nmake LDFLAGS=\"${LDFLAGS_MAKE}\" -j${nproc}\n\nif [[ ${target} == x86_64-linux-gnu ]]; then\n   make check\nfi\n\nmake install\n\nnc-config --all\n"""
version = "v400.902.211"

