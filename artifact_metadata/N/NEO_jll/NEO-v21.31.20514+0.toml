buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/b99675253062a4b5ea42da78d490a21b52a86b11/N/NEO/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
