[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Notcurses"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/notcurses*\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/repent.patch\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/0001-also-look-for-shared-libraries-on-Windows.patch\n\nif [[ $target == *mingw* ]]; then\n    export CFLAGS=\"${CFLAGS} -D_WIN32_WINNT=0x0600\"\n    cp ${WORKSPACE}/srcdir/headers/pthread_time.h /opt/${target}/${target}/sys-root/include/pthread_time.h\nfi\n\nmultimedia=ffmpeg\nif [[ ${target} == *mingw* ]]; then\n    # FFMpeg is not found (why?)\n    # We patch CMakelists.txt for shared libraries in Windows, maybe this goes wrong?\n    multimedia=none\nfi\n\nFLAGS=(\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\n    -DCMAKE_INSTALL_PREFIX=${prefix}\n    -DCMAKE_BUILD_TYPE=Release\n    -DBUILD_EXECUTABLES=ON\n    -DBUILD_SHARED_LIBS=ON\n    -DUSE_CXX=OFF\n    -DUSE_DOCTEST=OFF\n    -DUSE_MULTIMEDIA=${multimedia}\n    -DUSE_PANDOC=OFF\n    -DUSE_POC=OFF\n    -DUSE_QRCODEGEN=OFF\n    -DUSE_STATIC=OFF\n)\n\nif [[ ${target} == x86_64-linux-musl ]]; then\n    # Remove some host files that confuse the build system\n    rm /usr/lib/libncurses*\n    rm /usr/lib/libexpat.*\nfi\n\nif [[ ${target} == aarch64-apple-* ]]; then\n    # Linking FFMPEG requires the function `__divdc3`, which is implemented in\n    # `libclang_rt.osx.a` from LLVM compiler-rt.\n    FLAGS+=(\n        -DCMAKE_SHARED_LINKER_FLAGS=\"-L${libdir}/darwin -lclang_rt.osx\"\n        -DCMAKE_EXE_LINKER_FLAGS=\"-L${libdir}/darwin -lclang_rt.osx\"\n    )\nfi\n\nif [[ ${target} == *mingw* ]]; then\n    # Allow multiple definitions of symbols. This is needed as\n    # band-aid because many our dependencies (at least libexpat,\n    # libharfbuzz, libintl, libunistring) re-export multi-byte string\n    # functions (`mbrtowc` and friends) that are defined in a system\n    # library. We could fix all these libraries (see `Ncurses` for a\n    # fix), but this is easier.\n    FLAGS+=(\n        -DCMAKE_SHARED_LINKER_FLAGS=\"-Wl,--allow-multiple-definition\"\n    )\nfi\n\ncmake -B build \"${FLAGS[@]}\"\ncmake --build build --parallel ${nproc}\ncmake --install build\ninstall_license COPYRIGHT\n"""
version = "v3.0.17"

