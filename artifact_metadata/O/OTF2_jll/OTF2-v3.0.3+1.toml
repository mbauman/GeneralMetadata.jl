julia_compat = "1.6"
lazy_artifacts = false
name = "OTF2"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd ${WORKSPACE}/srcdir/otf2-*\n\n# The build system of this package is completely broken, in cross-compilation mode it\n# confuses host and build platforms, so we set `{CC,CXX}_FOR_BUILD` to the target\n# cross-compilers because life is horrible.  We use the absolute path just to be extra sure\n# we're pointing to the intended compilers.  Also, below we need to set\n# `ac_scorep_cross_compiling=yes` explicitly because the broken build system can't even\n# detect cross-compilation mode sensibly.\nCC=$(realpath $(which ${CC}))\nCXX=$(realpath $(which ${CXX}))\nCC_FOR_BUILD=${CC}\nCXX_FOR_BUILD=${CXX}\n\nautoreconf -fvi\n./configure \\\n    --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --enable-shared \\\n    --disable-static \\\n    --without-python \\\n    --disable-doc \\\n    --disable-doxygen-doc \\\n    --disable-doxygen-dot \\\n    --disable-doxygen-html \\\n    --disable-doxygen-rtf \\\n    --disable-silent-rules \\\n    --target=${target} \\\n    ac_scorep_cross_compiling=yes\n\nmake -j${nproc}\nmake install V=1\n"""
version = "v3.0.3"

