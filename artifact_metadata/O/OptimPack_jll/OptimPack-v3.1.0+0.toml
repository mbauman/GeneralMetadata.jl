buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/e91d0520780678139f8d5bf758dcc0944e39c07b/O/OptimPack/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
system = "Yggdrasil"
version = "0.2.2"

[metadata]
dependencies = []
name = "OptimPack"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/optimpack-*\n./configure --prefix=$prefix --host=$target --enable-shared=yes --enable-static=no\nFLAGS=()\nif [[ \"${target}\" == *-mingw* ]]; then\n    # This is needed in order to build the shared library on Windows\n    FLAGS+=(LDFLAGS=\"-no-undefined\")\nfi\nmake -j${nproc} \"${FLAGS[@]}\"\nmake install\n"""
version = "v3.1.0"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libopk"]
    type = "lib"
    variable_name = "libopk"
    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libcobyla"]
    type = "lib"
    variable_name = "libcobyla"
    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libbobyqa"]
    type = "lib"
    variable_name = "libbobyqa"
    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libnewuoa"]
    type = "lib"
    variable_name = "libnewuoa"

    [[metadata.sources]]
    "https://github.com/emmt/OptimPack/releases/download/v3.1.0/optimpack-3.1.0.tar.gz" = "fa1efdbebf6efa42a1d6b4f6223c7ca0b871fad5c0b53f7dc9be296e4c766190"
