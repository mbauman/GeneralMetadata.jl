    version-major = 0
    version-minor = 0
    version-patch = 0

    [[metadata.products]]
    dir_paths = []
    dlopen_flags = []
    dont_dlopen = false
    libnames = ["libOpenCL", "OpenCL"]
    type = "lib"
    variable_name = "libocl_icd"
    [[metadata.products]]
    paths = ["include/ocl_icd.h"]
    type = "file"
    variable_name = "ocl_icd_h"

