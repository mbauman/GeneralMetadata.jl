platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-apple-darwin"]
script = """cd $WORKSPACE/srcdir/oneTBB/\n\n# Adapt patch from\n# https://github.com/oneapi-src/oneTBB/pull/203\natomic_patch -p1 ../patches/musl.patch\n\nmkdir build && cd build/\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DTBB_TEST=OFF \\\n    -DTBB_EXAMPLES=OFF \\\n    ..\nmake -j${nproc}\nmake install\n"""
