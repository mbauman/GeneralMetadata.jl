platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx03", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/oneTBB*\n\nif [[ ${target} == *mingw* ]]; then\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/mingw.patch\"\n\n    # `CreateSemaphoreEx` requires at least Windows Vista/Server 2008:\n    # https://docs.microsoft.com/en-us/windows/win32/api/winbase/nf-winbase-createsemaphoreexa\n    export CXXFLAGS=\"-D_WIN32_WINNT=0x0600\"\nfi\n\nif [[ ${target} == i686-linux-musl* ]]; then\n    # Disable strong stack protection. Our musl version doesn't\n    # provide the symbol `__stack_chk_fail_local` in the way GCC expects.\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/i686-musl.patch\"\nfi\n\nif [[ \"${target}\" == *-freebsd* ]]; then\n    # Follow oneTBB makefile fix for missing symbols error: https://cgit.freebsd.org/ports/commit/?id=3677983542cc09a0e5f085e463a895e9e4dce9aa\n    export LDFLAGS=\"${LDFLAGS} -Wl,--undefined-version\"\nfi\n\ncmake -B build -G Ninja \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DTBB_STRICT=OFF \\\n    -DTBB_TEST=OFF \\\n    -DTBB_EXAMPLES=OFF\ncmake --build build --parallel ${nproc}\ncmake --install build\n"""
version = "v2022.0.0"

