buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/82a8c70a06c6af2f3fdbd3ca1502bde8d7fc20d5/O/OpenLibm/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
system = "Yggdrasil"
version = "0.2.6"

[metadata]
dependencies = []
init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "OpenLibm"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """# Enter the funzone\ncd ${WORKSPACE}/srcdir/openlibm*\n\n# Install into output\nflags=(\"prefix=${prefix}\")\n\n# Build ARCH from ${target}\nflags+=(\"ARCH=${target%-*-*}\")\n\n# OpenLibm build system doesn't recognize our windows cross compilers properly\nif [[ ${target} == *mingw* ]]; then\n    flags+=(\"OS=WINNT\")\nfi\n\n# Add `CC` override, since OpenLibm seems to think it knows best:\nflags+=(\"CC=$CC\")\n\n# Build the library\nmake \"${flags[@]}\" -j${nproc}\n\n# Install the library\nmake \"${flags[@]}\" install\n\ninstall_license ./LICENSE.md\n"""
version = "v0.7.1"

    [[metadata.products]]
    dir_paths = []
    dlopen_flags = []
    dont_dlopen = false
    libnames = ["libopenlibm"]
    type = "lib"
    variable_name = "libopenlibm"

