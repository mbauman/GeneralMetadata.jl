buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/3c2c7ec4213a2ba8128f7663817cea2ffa3f9a7f/O/OpenLibm/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.6.0"

[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "OpenLibm"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "x86_64-linux-gnu-sanitize+memory"]
script = """# Enter the funzone\ncd ${WORKSPACE}/srcdir/openlibm*\n\n# Install into output\nflags=(\"prefix=${prefix}\")\n\n# Build ARCH from ${target}\nflags+=(\"ARCH=${target%-*-*}\")\n\n# OpenLibm build system doesn't recognize our windows cross compilers properly\nif [[ ${target} == *mingw* ]]; then\n    flags+=(\"OS=WINNT\")\nfi\n\nif [[ ${bb_full_target} == *-sanitize+memory* ]]; then\n    # Install msan runtime (for clang)\n    cp -rL ${libdir}/linux/* /opt/x86_64-linux-musl/lib/clang/*/lib/linux/\nfi\n\n# Add `CC` override, since OpenLibm seems to think it knows best:\nflags+=(\"CC=$CC\")\n\n# Build the library\nmake \"${flags[@]}\" -j${nproc}\n\n# Install the library\nmake \"${flags[@]}\" install\n\ninstall_license ./LICENSE.md\n"""
version = "v0.8.4"

