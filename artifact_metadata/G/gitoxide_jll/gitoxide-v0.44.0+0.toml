[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "gitoxide"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/gitoxide*/\nif [[ \"${target}\" == *-apple-* ]]; then\n    # Help the linker find `libclang_rt.osx.a`\n    export RUSTFLAGS=\"-Clink-args=-L${libdir}/darwin\"\nfi\ncargo build --release\ninstall -Dvm 755 \"target/${rust_target}/release/ein${exeext}\" \"${bindir}/ein${exeext}\"\ninstall -Dvm 755 \"target/${rust_target}/release/gix${exeext}\" \"${bindir}/gix${exeext}\"\ninstall_license LICENSE-*\n"""
version = "v0.44.0"

