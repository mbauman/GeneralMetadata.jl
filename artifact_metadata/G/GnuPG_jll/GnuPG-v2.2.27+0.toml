metadata_version = "0.3.1"

[metadata]
init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "GnuPG"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/gnupg-*/\nif [[ \"${target}\" != ${MACHTYPE} ]]; then\n    # Delete `gpg-error-config` of the host to prevent it from being picked up\n    # when configuring the package\n    rm \"${host_bindir}/gpg-error-config\"\n    # Use Windows LDAP\n    FLAGS=(LDAPLIBS=\"-lwldap32\")\nfi\nif [[ \"${target}\" == *86*-linux-gnu ]]; then\n    # We have an old glibc which doesn't have `IN_EXCL_UNLINK`\n    FLAGS=(ac_cv_func_inotify_init=no)\n    # Add -lrt dependency to fix the error\n    #     undefined reference to `clock_gettime'\n    atomic_patch -p1 ../patches/intel-linux-gnu-add-rt-lib.patch\nfi\n./configure --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    \"${FLAGS[@]}\"\nmake -j${nproc}\nmake install\n"""
version = "v2.2.27"

