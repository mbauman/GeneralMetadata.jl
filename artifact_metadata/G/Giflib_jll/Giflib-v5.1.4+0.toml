buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/2348ffead948edc0dc2d1166a0fe0924aa6cd585/G/Giflib/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
system = "Yggdrasil"
version = "0.2.2"

[metadata]
dependencies = []
name = "Giflib"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/giflib-*/\natomic_patch -p1 ../debian/patches/CVE-2016-3977.patch\nupdate_configure_scripts\n./configure --prefix=${prefix} --host=${target}\nmake -j${nproc}\nmake install\n\n# The configure script doesn't want to build the shared library for PowerPC\nif [[ \"${target}\" == powerpc64le-* ]]; then\n    cd ${libdir}\n    ${AR} x libgif.a\n    cc -shared -o libgif.so *.o\nfi\n"""
version = "v5.1.4"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libgif"]
    type = "lib"
    variable_name = "libgif"

    [[metadata.sources]]
    "https://downloads.sourceforge.net/project/giflib/giflib-5.1.4.tar.bz2" = "df27ec3ff24671f80b29e6ab1c4971059c14ac3db95406884fc26574631ba8d5"
