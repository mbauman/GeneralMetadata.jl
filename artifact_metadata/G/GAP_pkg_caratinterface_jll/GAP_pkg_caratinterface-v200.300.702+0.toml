[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.10"
lazy_artifacts = false
name = "GAP_pkg_caratinterface"
platforms = ["x86_64-linux-gnu", "aarch64-linux-gnu", "powerpc64le-linux-gnu", "x86_64-linux-musl", "aarch64-linux-musl", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "riscv64-linux-gnu"]
script = """cd CaratInterface*\n\ntar pzxf carat.tgz\ncd carat\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/macos.patch\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --with-gmp=${prefix}\nmake -j${nproc}\ncd ..\n\ncd carat/tables\ntar pzxf qcatalog.tar.gz\nrm -f qcatalog.tar.gz\ncd ../..\n\n\n# copy the executable\nmkdir -p ${prefix}/bin/\ncp -R carat/bin/* ${prefix}/bin/\n\n# copy the tables\nmkdir -p ${prefix}/share/carat/\nmv carat/tables ${prefix}/share/carat/\n\ninstall_license GPL\n"""
version = "v200.300.702"

