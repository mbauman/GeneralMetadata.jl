[metadata]
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Ghostscript"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/ghostscript*\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    # Patches adapted from\n    # https://github.com/msys2/MINGW-packages/tree/d87e68ae356d773901e5c477854312e5de0548cf/mingw-w64-ghostscript\n    # (we don't need to patch configure.ac)\n    atomic_patch -p1 ../patches/001-mingw-build.patch\n    atomic_patch -p1 ../patches/003-libspectre.patch\nfi\n\n# Specify the native compiler for the programs that need to be run on the host\nexport CCAUX=${CC_BUILD}\n\n# configure the Makefiles.  Note we disable Tesseract because we don't need it\n# at the moment, it requires a C++17 compiler, and configure for Windows fails\n# because it doesn't find \"threading\".\n./configure --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --without-x \\\n    --disable-contrib \\\n    --disable-cups \\\n    --without-tesseract\n\n# create the binaries\nmake -j${nproc}\n\n# install to prefixes\nmake install\n"""
version = "v9.55.0"

