script = """# HACK WORKAROUND GAP_jll deficiencies\n# must add -lgap to the linker flags used by gac\nperl -pi -e 's/c_addlibs=\"\"/c_addlibs=\"-lgap\"/' ${prefix}/bin/gac\ncd float*\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --with-gaproot=${prefix}/lib/gap\nmake -j${nproc}\n\n# copy the loadable module\nmkdir -p ${prefix}/lib/gap\ncp bin/*/*.so ${prefix}/lib/gap/\n\ninstall_license COPYING\n"""
