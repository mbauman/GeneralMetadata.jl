buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/adaaadd8030452ef91feee73de4fb624b323016d/G/GLEW/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
system = "Yggdrasil"
version = "0.2.2"

[metadata]
dependencies = ["Libglvnd_jll", "X11_jll"]
name = "GLEW"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/glew-*\nEXTRA_VARS=()\nif [[ \"${target}\" == *-linux-* ]] || [[ \"${target}\" == *-freebsd* ]]; then\n    # On Linux and FreeBSD this variable by default does `-L/usr/lib`\n    EXTRA_VARS+=(LDFLAGS.EXTRA=\"\")\nfi\nmake INCLUDE=\"-Iinclude -I${prefix}/include\" \\\n    GLEW_DEST=\"${prefix}\" \\\n    \"${EXTRA_VARS[@]}\" \\\n    install\n"""
version = "v2.1.0"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libGLEW", "glew32"]
    type = "lib"
    variable_name = "libGLEW"

    [[metadata.sources]]
    "https://github.com/nigels-com/glew/releases/download/glew-2.1.0/glew-2.1.0.tgz" = "04de91e7e6763039bc11940095cd9c7f880baba82196a7765f727ac05a993c95"
