    version-minor = 0
    version-patch = 0
    [[metadata.dependencies]]
    compat = "~400.1201.100"
    name = "GAP_lib_jll"
    platforms = ["any"]
    top_level = false
    type = "dependency"
    version-major = 0
    version-minor = 0
    version-patch = 0

    [[metadata.products]]
    paths = ["lib/gap/io.so"]
