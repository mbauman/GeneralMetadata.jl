buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/d25be274d176aeb874c9d85201b5f822ac379ad8/G/GTK3/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
system = "Yggdrasil"
version = "0.2.2"

[metadata]
dependencies = ["Glib_jll", "Cairo_jll", "Pango_jll", "FriBidi_jll", "FreeType2_jll", "gdk_pixbuf_jll", "Libepoxy_jll", "ATK_jll", "HarfBuzz_jll", "xkbcommon_jll", "iso_codes_jll", "Wayland_jll", "Xorg_libXrandr_jll", "Xorg_libX11_jll", "Xorg_libXrender_jll", "Xorg_libXi_jll", "Xorg_libXext_jll", "Xorg_libXcursor_jll", "Xorg_libXdamage_jll", "Xorg_libXfixes_jll", "Xorg_libXcomposite_jll", "Xorg_libXinerama_jll", "Fontconfig_jll", "at_spi2_atk_jll"]
name = "GTK3"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/gtk+-*/\n\n# We need to run some commands with a native Glib\napk add glib-dev gtk+3.0\n\nif [[ \"${target}\" == *-linux-* ]]; then\n    # We need to run `wayland-scanner` on the build system only when Wayland is\n    # available, i.e. only on Linux\n    apk add wayland-dev\nfi\n\n# This is awful, I know\nln -sf /usr/bin/glib-compile-resources ${prefix}/bin/glib-compile-resources\nln -sf /usr/bin/glib-compile-schemas ${prefix}/bin/glib-compile-schemas\nln -sf /usr/bin/gdk-pixbuf-pixdata ${prefix}/bin/gdk-pixbuf-pixdata\n# Remove wayland-scanner when present, so that we can call the native one\nrm -f ${prefix}/bin/wayland-scanner\n\natomic_patch -p1 $WORKSPACE/srcdir/patches/gdkwindow-quartz_c.patch\natomic_patch -p1 $WORKSPACE/srcdir/patches/meson_build.patch\n\nFLAGS=()\nif [[ \"${target}\" == *-apple-* ]]; then\n    FLAGS+=(-Dx11_backend=false -Dwayland_backend=false)\nelif [[ \"${target}\" == *-freebsd* ]]; then\n    FLAGS+=(-Dwayland_backend=false)\nfi\n\nmkdir build-gtk && cd build-gtk\nmeson .. \\\n    -Dintrospection=false \\\n    -Ddemos=false \\\n    -Dexamples=false \\\n    -Dtests=false \\\n    \"${FLAGS[@]}\" \\\n    --cross-file=\"${MESON_TARGET_TOOLCHAIN}\"\nninja -j${nproc}\nninja install\n\n# Remove temporary links\nrm ${prefix}/bin/gdk-pixbuf-pixdata ${prefix}/bin/glib-compile-{resources,schemas}\n"""
sources = [{"http://ftp.gnome.org/pub/gnome/sources/gtk+/3.24/gtk+-3.24.11.tar.xz" = "dba7658d0a2e1bfad8260f5210ca02988f233d1d86edacb95eceed7eca982895"}, "./bundled"]
version = "v3.24.11"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libgailutil-3"]
    type = "lib"
    variable_name = "libgailutil3"
    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libgdk-3"]
    type = "lib"
    variable_name = "libgdk3"
    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libgtk-3"]
    type = "lib"
    variable_name = "libgtk3"
