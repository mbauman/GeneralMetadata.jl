name = "gmime"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/gmime*\necho '#define ICONV_ISO_INT_FORMAT \"iso-%u-%u\"' > iconv-detect.h\necho '#define ICONV_ISO_STR_FORMAT \"iso-%u-%s\"' >> iconv-detect.h\necho '#define ICONV_SHIFT_JIS \"shift-jis\"' >> iconv-detect.h\necho '#define ICONV_10646 \"UCS-4BE\"' >> iconv-detect.h\n\nif [[ \"${target}\" == *-apple-* ]]; then\n   # Help the linker prefer our libiconv over system's libiconv.\n   export LDFLAGS=\"-L${libdir}\"\nfi\n\n./configure --prefix=${prefix} \\\n            --build=${MACHTYPE} \\\n            --host=${target} \\\n            --enable-static=no \\\n            --with-libiconv=gnu \\\n            ac_cv_have_iconv_detect_h=yes\nmake -j${nproc}\nmake install\n"""
version = "v3.2.15"

