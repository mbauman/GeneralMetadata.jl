name = "gobject_introspection"
platforms = ["x86_64-linux-gnu"]
script = """# We need to run some commands with a native Python\napk add python3-dev\n\n# We use the build system's version of gi-scanner to generate XML for glib\napk add gobject-introspection-dev\n\ncd $WORKSPACE/srcdir/gobject-*/\n\nmkdir build-gi\n\ncd build-gi\nmeson .. \\\n    --cross-file=\"${MESON_TARGET_TOOLCHAIN}\" \\\n    -Dgi_cross_use_prebuilt_gi=true\nninja -j${nproc}\nninja install\n"""
version = "v1.72.0"

