buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/4dd53a5ea3df104aa9f3f8f4cd9996568871d2af/E/Elfutils/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.2.2"

[metadata]
dependencies = ["Zlib_jll", "Bzip2_jll", "XZ_jll"]
name = "Elfutils"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-unknown-freebsd11.1"]
script = """cd $WORKSPACE/srcdir/elfutils-*/\nCFLAGS=\"-Wno-error=unused-result\" CPPFLAGS=\"-I${prefix}/include\" ./configure --prefix=${prefix} --host=${target}\nmake -j${nproc}\nmake install\n"""
version = "v0.177.0"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libasm"]
    type = "lib"
    variable_name = "libasm"
    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libdw"]
    type = "lib"
    variable_name = "libdw"
    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libelf"]
    type = "lib"
    variable_name = "libelf"

    [[metadata.sources]]
