buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/ff783d4de309ff9b32fb4405be4c38b0e7301516/E/Elfutils/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.5.5"

[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Elfutils"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/elfutils-*/\nif [[ ${target} = *-musl* ]] ; then\n    for patchfile in $WORKSPACE/srcdir/patches/*; do\n        atomic_patch -p1 $patchfile\n    done\n    cp $WORKSPACE/srcdir/error.h src/\n    cp $WORKSPACE/srcdir/error.h lib/\n\n    apk add bsd-compat-headers\n    # /usr/include isn't in search path of cross-cc, so copy cdefs.h\n    mkdir -p $prefix/include/sys\n    # Skip warning macro at top of file\n    tail -n +2 /usr/include/sys/cdefs.h >$prefix/include/sys/cdefs.h\n    autoreconf -vif\nfi\nexport CC=gcc\nexport CXX=g++\nCFLAGS=\"-Wno-error=unused-result\" CPPFLAGS=\"-I${prefix}/include\" ./configure \\\n    --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --disable-debuginfod \\\n    --disable-libdebuginfod\nmake -j${nproc}\nmake install\nrm -f \"${includedir}/sys/cdefs.h\"\ninstall_license COPYING*\n"""
version = "v0.182.0"

