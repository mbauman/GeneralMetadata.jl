name = "Extrae"
platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03-cuda+10.2", "x86_64-linux-gnu-cxx03-cuda+11.0", "x86_64-linux-gnu-cxx11-cuda+10.2", "x86_64-linux-gnu-cxx11-cuda+11.0", "powerpc64le-linux-gnu-cxx03-cuda+11.0", "powerpc64le-linux-gnu-cxx11-cuda+11.0", "aarch64-linux-gnu-cxx03-cuda+10.2", "aarch64-linux-gnu-cxx03-cuda+11.0", "aarch64-linux-gnu-cxx11-cuda+10.2", "aarch64-linux-gnu-cxx11-cuda+11.0"]
script = """cd ${WORKSPACE}/srcdir/extrae\n\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/0001-autoconf-replace-pointer-size-check-by-AC_CHECK_SIZE.patch\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/0002-autoconf-use-simpler-endianiness-check.patch\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/0003-autoconf-support-powerpc64le-cross-compilation.patch\n\nif [[ $bb_target = aarch64* ]]; then\n    export ENABLE_ARM64=1\nfi\n\nif [[ $bb_target = powerpc64le* ]]; then\n    export ENABLE_POWERPC64LE=1\nfi\n\nif [[ $bb_full_target = *cuda* ]]; then\n    export ENABLE_CUDA=1\nfi\n\nautoreconf -fvi\n./configure \\\n    --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    ${ENABLE_ARM64:+--enable-arm64} \\\n    ${ENABLE_POWERPC64LE:+--enable-powerpc64le} \\\n    --without-dyninst \\\n    --disable-openmp \\\n    --disable-nanos \\\n    --disable-smpss \\\n    --without-mpi \\\n    ${ENABLE_CUDA:+--with-cuda=$prefix/cuda} \\\n    --with-binutils=$prefix \\\n    --with-unwind=$prefix \\\n    --with-xml-prefix=$prefix \\\n    --with-papi=$prefix\n\nmake -j${nproc}\nmake install\n"""
version = "v4.0.2"

