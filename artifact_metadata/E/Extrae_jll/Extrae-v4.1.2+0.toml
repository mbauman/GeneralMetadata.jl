name = "Extrae"
platforms = ["x86_64-linux-gnu-cxx03-cuda+11.4", "x86_64-linux-gnu-cxx11-cuda+11.4", "powerpc64le-linux-gnu-cxx03-cuda+11.4", "powerpc64le-linux-gnu-cxx11-cuda+11.4", "x86_64-linux-gnu-cxx03-cuda+12.0", "x86_64-linux-gnu-cxx11-cuda+12.0", "powerpc64le-linux-gnu-cxx03-cuda+12.0", "powerpc64le-linux-gnu-cxx11-cuda+12.0", "x86_64-linux-gnu-cxx03-cuda+none", "x86_64-linux-gnu-cxx11-cuda+none", "powerpc64le-linux-gnu-cxx03-cuda+none", "powerpc64le-linux-gnu-cxx11-cuda+none", "aarch64-linux-gnu-cxx03-cuda+none", "aarch64-linux-gnu-cxx11-cuda+none"]
script = """cd ${WORKSPACE}/srcdir/extrae-*\n\n# check if we need to use a more recent glibc\nif [[ -f \"${prefix}/usr/include/bits/mman-linux.h\" ]]; then\n    GLIBC_ARTIFACT_DIR=$(dirname $(dirname $(dirname $(dirname $(realpath \"${prefix}/usr/include/bits/mman-linux.h\")))))\n    rsync --archive ${GLIBC_ARTIFACT_DIR}/ /opt/${target}/${target}/sys-root/\nfi\n\n# Work around https://github.com/bsc-performance-tools/extrae/issues/103\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/0001-Add-missing-XML2_CFLAGS.patch\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/0002-Add-missing-lxml2.patch\n\nif [[ $bb_target = aarch64* ]]; then\n    export ENABLE_ARM64=1\nfi\n\nif [[ $bb_target = powerpc64le* ]]; then\n    export ENABLE_POWERPC64LE=1\nfi\n\nif [[ $bb_full_target = *cuda\\+[0-9]* ]]; then\n    export ENABLE_CUDA=1\n    export CPPFLAGS=\"-I${prefix}/cuda/include\"\nfi\n\nautoreconf -fvi\n./configure \\\n    --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    ${ENABLE_ARM64:+--enable-arm64} \\\n    ${ENABLE_POWERPC64LE:+--enable-powerpc64le} \\\n    --without-dyninst \\\n    --disable-openmp \\\n    --disable-nanos \\\n    --disable-smpss \\\n    --without-mpi \\\n    ${ENABLE_CUDA:+--with-cuda=$prefix/cuda} \\\n    --with-binutils=$prefix \\\n    --with-unwind=$prefix \\\n    --with-xml-prefix=$prefix \\\n    --with-papi=$prefix\n\nmake -j${nproc}\nmake install\n"""
version = "v4.1.2"

