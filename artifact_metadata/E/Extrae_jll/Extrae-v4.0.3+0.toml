[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Extrae"
platforms = ["x86_64-linux-gnu-cuda+10.2", "x86_64-linux-gnu-cuda+11.0", "x86_64-linux-gnu-cuda+none", "powerpc64le-linux-gnu-cuda+none", "aarch64-linux-gnu-cuda+none"]
script = """cd ${WORKSPACE}/srcdir/extrae-*\n\natomic_patch -p0 ${WORKSPACE}/srcdir/patches/0004-cuda-cupti-undefined-structs-since-v12.patch\n\nif [[ $bb_target = aarch64* ]]; then\n    export ENABLE_ARM64=1\nfi\n\nif [[ $bb_target = powerpc64le* ]]; then\n    export ENABLE_POWERPC64LE=1\nfi\n\nif [[ $bb_full_target = *cuda\\+[0-9]* ]]; then\n    export ENABLE_CUDA=1\nfi\n\nautoreconf -fvi\n./configure \\\n    --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    ${ENABLE_ARM64:+--enable-arm64} \\\n    ${ENABLE_POWERPC64LE:+--enable-powerpc64le} \\\n    --without-dyninst \\\n    --disable-openmp \\\n    --disable-nanos \\\n    --disable-smpss \\\n    --without-mpi \\\n    ${ENABLE_CUDA:+--with-cuda=$prefix/cuda} \\\n    --with-binutils=$prefix \\\n    --with-unwind=$prefix \\\n    --with-xml-prefix=$prefix \\\n    --with-papi=$prefix\n\nmake -j${nproc}\nmake install\n"""
version = "v4.0.3"

