augment_platform_block = """using Base.BinaryPlatforms\n\ntry\n    using CUDA_Runtime_jll\ncatch\n    # during initial package installation, CUDA_Runtime_jll may not be available.\n    # in that case, we just won't select an artifact.\nend\n\n# can't use Preferences for the same reason\nconst CUDA_Runtime_jll_uuid = Base.UUID(\"76a88914-d11a-5bdc-97e0-2f5a05c973a2\")\nconst preferences = Base.get_preferences(CUDA_Runtime_jll_uuid)\nBase.record_compiletime_preference(CUDA_Runtime_jll_uuid, \"version\")\nBase.record_compiletime_preference(CUDA_Runtime_jll_uuid, \"local\")\nconst local_toolkit = something(tryparse(Bool, get(preferences, \"local\", \"false\")), false)\n\nfunction cuda_comparison_strategy(_a::String, _b::String, a_requested::Bool, b_requested::Bool)\n    # if we're using a local toolkit, we can't use artifacts\n    if local_toolkit\n        return false\n    end\n\n    # if either isn't a version number (e.g. \"none\"), perform a simple equality check\n    a = tryparse(VersionNumber, _a)\n    b = tryparse(VersionNumber, _b)\n    if a === nothing || b === nothing\n        return _a == _b\n    end\n\n    # if both b and a requested, then we fall back to equality\n    if a_requested && b_requested\n        return Base.thisminor(a) == Base.thisminor(b)\n    end\n\n    # otherwise, do the comparison between the the single version cap and the single version:\n    function is_compatible(artifact::VersionNumber, host::VersionNumber)\n        if host >= v\"11.0\"\n            # enhanced compatibility, semver-style\n            artifact.major == host.major &&\n            Base.thisminor(artifact) <= Base.thisminor(host)\n        else\n            Base.thisminor(artifact) == Base.thisminor(host)\n        end\n    end\n    if a_requested\n        is_compatible(b, a)\n    else\n        is_compatible(a, b)\n    end\nend\n\nfunction augment_platform!(platform::Platform)\n    if !@isdefined(CUDA_Runtime_jll)\n        # don't set to nothing or Pkg will download any artifact\n        platform[\"cuda\"] = \"none\"\n    end\n\n    if !haskey(platform, \"cuda\")\n        CUDA_Runtime_jll.augment_platform!(platform)\n    end\n    BinaryPlatforms.set_compare_strategy!(platform, \"cuda\", cuda_comparison_strategy)\n\n    return platform\nend"""
init_block = ""
julia_compat = "1.9"
lazy_artifacts = true
name = "Faiss_CUDA"
platforms = ["x86_64-linux-gnu-cuda+11.8", "aarch64-linux-gnu-cuda_platform+jetson-cuda+11.8", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+11.8", "x86_64-linux-gnu-cuda+12.1", "aarch64-linux-gnu-cuda_platform+jetson-cuda+12.1", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+12.1", "powerpc64le-linux-gnu-cuda+11.8", "powerpc64le-linux-gnu-cuda+12.1"]
script = """apk del cmake # Need CMake >= 3.30 for BLA_VENDOR=libblastrampoline\n\ncd faiss\n\natomic_patch -p1 ../patches/faiss-cmake-mkl-optional.patch\natomic_patch -p1 ../patches/faiss-install-faiss_c.patch\natomic_patch -p1 ../patches/faiss-mingw32-cmake.patch\natomic_patch -p1 ../patches/faiss-mingw32-InvertedListsIOHook.patch\natomic_patch -p1 ../patches/faiss-mingw32.patch\natomic_patch -p1 ../patches/gpu-shared_library.patch\n\ncmake_extra_args=()\n\ncuda_version=$(echo $bb_full_target | sed -E 's/.*-cuda\\+([^-]+).*/\\1/')\nif [[ $bb_full_target == *cuda* ]]; then\n    if [[ $cuda_version == \"11.8\" ]]; then\n        cuda_archs=\"60-real;61-real;62-real;70-real;72-real;75-real;80;86-real;87-real;89-real;90\"\n    elif [[ $cuda_version == \"12.1\" ]]; then\n        cuda_archs=\"70-real;72-real;75-real;80;86-real;87-real;89-real;90\"\n    else\n        false # Fail for unexpected CUDA version\n    fi\n\n    # CUDA compilation can run out of storage\n    mkdir $WORKSPACE/tmpdir\n    export TMPDIR=$WORKSPACE/tmpdir\n\n    export CUDA_PATH=$prefix/cuda\n    ln -s $prefix/cuda/lib $prefix/cuda/lib64\n    cmake_extra_args+=(\n        -DFAISS_BUILD_GPU_SHARED_LIBS=ON\n        -DFAISS_ENABLE_GPU=ON\n        -DCUDAToolkit_ROOT=$CUDA_PATH\n        -DCMAKE_CUDA_ARCHITECTURES=$cuda_archs\n    )\nfi\n\nif $USE_CCACHE; then\n    export CMAKE_CUDA_COMPILER_LAUNCHER=ccache\nfi\n\nif [[ $bb_full_target == *cuda* && $target != x86_64-linux-gnu* ]]; then\n    # Add /usr/lib/csl-glibc-x86_64 to LD_LIBRARY_PATH to be able to run host `nvcc`/`ptxas`/`fatbinary`\n    # while keeping the default /usr/lib/csl-musl-x86_64,\n    export LD_LIBRARY_PATH=/usr/lib/csl-musl-x86_64:/usr/lib/csl-glibc-x86_64:$LD_LIBRARY_PATH\n\n    # Make sure the host CUDA executables are used by copying from the host (x86_64) nvcc redist\n    NVCC_DIR=(/workspace/srcdir/cuda_nvcc-linux-$(arch)-${cuda_version}*-archive)\n    rm -rfv $prefix/cuda/bin\n    cp -av ${NVCC_DIR}/bin $prefix/cuda/bin\n    \n    rm -rfv $prefix/cuda/nvvm/bin\n    cp -av ${NVCC_DIR}/nvvm/bin $prefix/cuda/nvvm/bin\nfi\n\ncmake -B build \\\n    -DBLA_VENDOR=libblastrampoline \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DBUILD_TESTING=OFF \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DFAISS_ENABLE_C_API=ON \\\n    -DFAISS_ENABLE_GPU=OFF \\\n    -DFAISS_ENABLE_MKL=OFF \\\n    -DFAISS_ENABLE_PYTHON=OFF \\\n    ${cmake_extra_args[@]}\ncmake --build build --parallel ${nproc}\ncmake --install build\n\nif [[ $bb_full_target == *cuda* ]]; then\n    unlink $prefix/cuda/lib64\nfi\n"""
version = "v1.9.0"

