name = "FFMPEG"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\ncd ffmpeg-*/\nsed -i 's/-lflite\"/-lflite -lasound\"/' configure\napk add coreutils yasm\n\nif [[ \"${target}\" == *-linux-* ]]; then\n    export ccOS=\"linux\"\nelif [[ \"${target}\" == *-apple-* ]]; then\n    export ccOS=\"darwin\"\nelif [[ \"${target}\" == *-w32-* ]]; then\n    export ccOS=\"mingw32\"\nelif [[ \"${target}\" == *-w64-* ]]; then\n    export ccOS=\"mingw64\"\nelif [[ \"${target}\" == *-unknown-freebsd* ]]; then\n    export ccOS=\"freebsd\"\nelse\n    export ccOS=\"linux\"\nfi\n\nif [[ \"${target}\" == x86_64-* ]]; then\n    export ccARCH=\"x86_64\"\nelif [[ \"${target}\" == i686-* ]]; then\n    export ccARCH=\"i686\"\nelif [[ \"${target}\" == arm-* ]]; then\n    export ccARCH=\"arm\"\nelif [[ \"${target}\" == aarch64-* ]]; then\n    export ccARCH=\"aarch64\"\nelif [[ \"${target}\" == powerpc64le-* ]]; then\n    export ccARCH=\"powerpc64le\"\nelse\n    export ccARCH=\"x86_64\"\nfi\n\nif [[ \"${target}\" == arm-* ]]; then\n    export CUDA_ARGS=\"\"\nelif [[ \"${target}\" == *-apple-* ]]; then\n    export CUDA_ARGS=\"\"\nelif [[ \"${target}\" == *-unknown-freebsd* ]]; then\n    export CUDA_ARGS=\"\"\nelse\n    export CUDA_ARGS=\"--enable-nvenc --enable-cuda-llvm\"\nfi\n\npkg-config --list-all\n\n./configure            \\\n  --enable-cross-compile \\\n  --cross-prefix=/opt/${target}/bin/${target}- \\\n  --arch=${ccARCH}     \\\n  --target-os=${ccOS}  \\\n  --cc=\"${CC}\"         \\\n  --cxx=\"${CXX}\"       \\\n  --dep-cc=\"${CC}\"     \\\n  --ar=ar              \\\n  --nm=nm              \\\n  --objcc=\"${OBJC}\"    \\\n  --sysinclude=${prefix}/include \\\n  --pkg-config=$(which pkg-config) \\\n  --pkg-config-flags=--static \\\n  --prefix=$prefix     \\\n  --sysroot=/opt/${target}/${target}/sys-root \\\n  --extra-libs=-lpthread \\\n  --enable-gpl         \\\n  --enable-version3    \\\n  --enable-nonfree     \\\n  --disable-static     \\\n  --enable-shared      \\\n  --enable-pic         \\\n  --disable-debug      \\\n  --disable-doc        \\\n  --enable-avresample  \\\n  --enable-libass      \\\n  --enable-libfdk-aac  \\\n  --enable-libfreetype \\\n  --enable-libmp3lame  \\\n  --enable-libopus     \\\n  --enable-libvorbis   \\\n  --enable-libx264     \\\n  --enable-libx265     \\\n  --enable-libvpx      \\\n  --enable-encoders    \\\n  --enable-decoders    \\\n  --enable-muxers      \\\n  --enable-demuxers    \\\n  --enable-parsers     \\\n  --enable-openssl     \\\n  --disable-schannel   \\\n  --extra-cflags=\"-I${prefix}/include\" \\\n  --extra-ldflags=\"-L${libdir}\" ${CUDA_ARGS}\nmake -j${nproc}\nmake install\ninstall_license LICENSE.md COPYING.*\n"""
version = "v4.3.1"

