buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/1725ab5b921e75608126a5ff9644b6a29eed53a1/F/FLINT/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.4.1"

[metadata]
init_block = """  if !Sys.iswindows() && !(get(ENV, \"NEMO_THREADED\", \"\") == \"1\")\n    #to match the global gmp ones\n    fm = dlsym(libflint_handle, :__flint_set_memory_functions)\n    ccall(fm, Nothing,\n      (Ptr{Nothing},Ptr{Nothing},Ptr{Nothing},Ptr{Nothing}),\n        cglobal(:jl_malloc),\n        cglobal(:jl_calloc),\n        cglobal(:jl_realloc),\n        cglobal(:jl_free))\n  end\n"""
julia_compat = "1.6"
lazy_artifacts = false
name = "FLINT"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/flint*\nif [[ ${target} == *musl* ]]; then\n   # because of some ordering issue with pthread.h and sched.h includes\n   export CFLAGS=-D_GNU_SOURCE\nelif [[ ${target} == *mingw* ]]; then\n   extraflags=--reentrant\nfi\n\nfor f in ${WORKSPACE}/srcdir/patches/*.patch; do\n  atomic_patch -p1 ${f}\ndone\n\n./configure --prefix=$prefix --disable-static --enable-shared --with-gmp=$prefix --with-mpfr=$prefix ${extraflags}\nmake -j${nproc}\nmake install LIBDIR=$(basename ${libdir})\n"""
version = "v200.800.101"

