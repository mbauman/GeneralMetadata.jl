init_block = """  if !Sys.iswindows() && !(get(ENV, \"NEMO_THREADED\", \"\") == \"1\")\n    #to match the global gmp ones\n    fm = dlsym(libflint_handle, :__flint_set_memory_functions)\n    ccall(fm, Nothing,\n      (Ptr{Nothing},Ptr{Nothing},Ptr{Nothing},Ptr{Nothing}),\n        cglobal(:jl_malloc),\n        cglobal(:jl_calloc),\n        cglobal(:jl_realloc),\n        cglobal(:jl_free))\n  end\n"""
julia_compat = "1.6"
lazy_artifacts = false
name = "FLINT"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/flint*\n\n# for f in ${WORKSPACE}/srcdir/patches/*.patch; do\n#    atomic_patch -p1 ${f}\n# done\n\nif [[ ${target} == *musl* ]]; then\n   # because of some ordering issue with pthread.h and sched.h includes\n   export CFLAGS=-D_GNU_SOURCE\nelif [[ ${target} == *mingw* ]]; then\n   extraflags=--enable-reentrant\nfi\n\n./bootstrap.sh\n./configure --host=${target} --prefix=$prefix --disable-static --enable-shared --with-gmp=$prefix --with-mpfr=$prefix --with-blas=$prefix ${extraflags}\nmake -j${nproc}\nmake install\n"""
