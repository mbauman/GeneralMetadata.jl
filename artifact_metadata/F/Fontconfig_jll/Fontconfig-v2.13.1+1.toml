buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/58f3598577b1747f27ca28341087fcc26e964d1c/F/Fontconfig/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
system = "Yggdrasil"
version = "0.2.2"

[metadata]
dependencies = ["FreeType2_jll", "Bzip2_jll", "Zlib_jll", "Libuuid_jll", "Expat_jll"]
name = "Fontconfig"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1"]
script = """cd $WORKSPACE/srcdir/fontconfig-*/\n\napk add gperf\n\n# Ensure that `${prefix}/include` is..... included\nexport CPPFLAGS=\"-I${prefix}/include\"\n\natomic_patch -p1 ../patches/configure_freetype2_version.patch\nautoreconf\n./configure --prefix=$prefix --host=$target --disable-docs\n\nmake -j${nproc}\nmake install\n"""
sources = [{"https://www.freedesktop.org/software/fontconfig/release/fontconfig-2.13.1.tar.bz2" = "f655dd2a986d7aa97e052261b36aa67b0a64989496361eca8d604e6414006741"}, "./bundled"]
version = "v2.13.1"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libfontconfig"]
    type = "lib"
    variable_name = "libfontconfig"
