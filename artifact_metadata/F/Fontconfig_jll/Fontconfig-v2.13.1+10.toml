buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/811ec274c027d60afa991fd36283f975626ba188/F/Fontconfig/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.2.2"

[metadata]
dependencies = ["FreeType2_jll", "Bzip2_jll", "Zlib_jll", "Libuuid_jll", "Expat_jll"]
name = "Fontconfig"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/fontconfig-*/\n\napk add gperf\n\n# Ensure that `${prefix}/include` is..... included\nexport CPPFLAGS=\"-I${prefix}/include\"\n\nFLAGS=()\nif [[ \"${target}\" == *-linux-* ]] || [[ \"${target}\" == *-freebsd* ]]; then\n    FLAGS+=(--with-add-fonts=\"/usr/local/share/fonts\")\n    if [[ \"${target}\" == *-linux-* ]]; then\n        FLAGS+=(--with-cache-dir=\"/var/cache/fontconfig\")\n    elif [[ \"${target}\" == *-freebsd* ]]; then\n        FLAGS+=(--with-cache-dir=\"/var/db/fontconfig\")\n    fi\nelif [[ \"${target}\" == *-apple-* ]]; then\n    FLAGS+=(--with-add-fonts=\"/System/Library/Fonts,/Library/Fonts,~/Library/Fonts,/System/Library/Assets/com_apple_MobileAsset_Font4,/System/Library/Assets/com_apple_MobileAsset_Font5\")\nfi\n\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/0001-fix-config-linking.all.patch\"\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/0002-fix-mkdir.mingw.patch\"\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/0004-fix-mkdtemp.mingw.patch\"\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/0005-fix-setenv.mingw.patch\"\nautoreconf\n./configure --prefix=$prefix --build=${MACHTYPE} --host=$target --disable-docs \"${FLAGS[@]}\"\n\n# Disable tests\nsed -i 's,all-am: Makefile $(PROGRAMS),all-am:,' test/Makefile\n\nmake -j${nproc}\nmake install\n"""
sources = [{"https://www.freedesktop.org/software/fontconfig/release/fontconfig-2.13.1.tar.bz2" = "f655dd2a986d7aa97e052261b36aa67b0a64989496361eca8d604e6414006741"}, "./bundled"]
version = "v2.13.1"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libfontconfig"]
    type = "lib"
    variable_name = "libfontconfig"
    [[metadata.products]]
    binnames = ["fc-cache"]
    type = "exe"
    variable_name = "fc_cache"
    [[metadata.products]]
    binnames = ["fc-cat"]
    type = "exe"
    variable_name = "fc_cat"
    [[metadata.products]]
    binnames = ["fc-conflist"]
    type = "exe"
    variable_name = "fc_conflist"
    [[metadata.products]]
    binnames = ["fc-list"]
    type = "exe"
    variable_name = "fc_list"
    [[metadata.products]]
    binnames = ["fc-match"]
    type = "exe"
    variable_name = "fc_match"
    [[metadata.products]]
    binnames = ["fc-pattern"]
    type = "exe"
    variable_name = "fc_pattern"
    [[metadata.products]]
    binnames = ["fc-query"]
    type = "exe"
    variable_name = "fc_query"
    [[metadata.products]]
    binnames = ["fc-scan"]
    type = "exe"
    variable_name = "fc_scan"
    [[metadata.products]]
    binnames = ["fc-validate"]
    type = "exe"
    variable_name = "fc_validate"
    [[metadata.products]]
    paths = ["etc/fonts/fonts.conf"]
    type = "file"
    variable_name = "fonts_conf"
