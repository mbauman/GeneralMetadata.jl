buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/c052b00ddbc1a9062f25d01c6a04677ebc076899/F/finufft/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
