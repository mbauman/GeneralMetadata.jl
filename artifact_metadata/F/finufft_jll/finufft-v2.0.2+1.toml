[metadata]
init_block = ""
lazy_artifacts = false
name = "finufft"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/finufft/\n# Overwrite LIBSFFT such that we do not require fftw3_threads or fftw3_omp for OMP support. Since the libraries in FFTW_jll already provide for threading, we do not loose anything.\nmake lib -j${nproc} CFLAGS=\"-fPIC -O3 -funroll-loops -fcx-limited-range\" LIBSFFT=\"-lfftw3 -lfftw3f -lm\"\ncp lib/libfinufft.so \"${libdir}/libfinufft.${dlext}\"\n"""
version = "v1.1.2"

