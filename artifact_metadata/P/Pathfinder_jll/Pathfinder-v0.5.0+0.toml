buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/c1b0b54677e75b80921a5c23fede4071b411cf3c/P/Pathfinder/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.5.3"

[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Pathfinder"
platforms = ["x86_64-linux-gnu", "aarch64-linux-gnu", "powerpc64le-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/pathfinder*\n\n# by default, pathfinder will compile to a static library,\n# so we change \"staticlib\" to \"cdylib\" to compile to a dynamic library\natomic_patch -p1 ../patches/Compile-to-dynamic-lib.patch\n\n# we need cbindgen to generate the header file\ncargo install cbindgen --force --target \"${rust_host}\"\n\ncd c\n\n# generate the header file\ncbindgen \\\n    --lang c \\\n    --crate pathfinder_c \\\n    --config cbindgen.toml \\\n    --output \"${includedir}/pathfinder.h\"\n\n# build pathfinder\ncargo build --release --lib --target=${rust_target}\n\n# On windows the generated .dll doesn't start with lib\nif [[ \"${target}\" == *-mingw* ]]; then\n    cp \\\n        ../target/${rust_target}/release/pathfinder.dll \\\n        ../target/${rust_target}/release/libpathfinder.dll\nfi\n\n# install the library\ninstall -D -m 755 \"../target/${rust_target}/release/libpathfinder.${dlext}\" \"${libdir}/libpathfinder.${dlext}\"\n\n# install the licenses\ninstall_license ../LICENSE-APACHE ../LICENSE-MIT\n"""
version = "v0.5.0"

