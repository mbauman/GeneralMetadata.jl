[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "procps"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu"]
script = """cd $WORKSPACE/srcdir\nfor f in ${WORKSPACE}/srcdir/patches/*.patch; do\n    atomic_patch -p1 ${f}\ndone\ncd procps/\napk update && apk add gettext-dev\n./autogen.sh\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --disable-pidwait LDFLAGS=\"-lrt\"\nmake -j${nproc} install\n"""
version = "v4.0.5"

