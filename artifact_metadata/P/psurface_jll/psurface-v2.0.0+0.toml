platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11", "aarch64-apple-darwin", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11"]
script = """cd $WORKSPACE/srcdir/psurface-*\n\n#this is fixed on master, if a new tag is released this can probably be removed\nsed -i 's/isnan/std::isnan/g' NormalProjector.cpp\nsed -i 's/isinf/std::isinf/g' NormalProjector.cpp\n\n#these patches are derived directly from commits already merged on master, if a new tag is released these can probaly be removed\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/use-std-array-not-tr1-array.patch\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/use-std-shared-ptr.patch\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/make-without-hdf5-work.patch\n\nif [[ ${target} == *mingw* ]]; then\n    sed -i 's/LT_INIT/LT_INIT([win32-dll])/' configure.ac;\n    sed -i '/^libpsurface_la_LDFLAGS/ s/$/ -no-undefined/' Makefile.am;\nfi\n\nautoreconf -vi\n\n./configure \\\n--prefix=${prefix} \\\n--build=${MACHTYPE} \\\n--host=${target} \\\n--enable-static=no \\\n--enable-shared=yes \\\n--without-amiramesh \\\n--without-hdf5\n\nmake -j${nproc}\nmake install\n\n"""
version = "v2.0.0"

