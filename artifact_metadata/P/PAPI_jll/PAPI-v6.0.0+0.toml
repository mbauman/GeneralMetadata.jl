buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/b5acf06be4f952f790d68c3e87d2c75f1a6d1c9e/P/PAPI/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.4.1"

[metadata]
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "PAPI"
platforms = ["x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir\ncd papi/src\nif [[ \"${target}\" == *-musl* ]]; then\n    CFLAGS=\"-D_GNU_SOURCE\"\nfi\nexport CFLAGS\nbash ./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --with-ffsll --with-perf-events --with-walltimer=gettimeofday --with-tls=__thread --with-virtualtimer=times --with-nativecc=${CC_FOR_BUILD}\nmake -j ${nproc}\nmake install\n"""
version = "v6.0.0"

    [[metadata.products]]
    dir_paths = []
    dlopen_flags = []
    dont_dlopen = false
    libnames = ["libpapi"]
    type = "lib"
    variable_name = "libpapi"

