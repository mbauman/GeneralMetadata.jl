script = ["""mkdir -p ${libdir} ${prefix}/include\n\ncd ${WORKSPACE}/srcdir\nif [[ ${target} == *-linux-gnu ]]; then\n    cd libcutensor*\n    find .\n\n    install_license LICENSE\n\n    mv lib/10.2/libcutensor.so* ${libdir}\n    mv lib/10.2/libcutensorMg.so* ${libdir}\n    mv include/* ${prefix}/include\nelif [[ ${target} == x86_64-w64-mingw32 ]]; then\n    cd libcutensor*\n    find .\n\n    install_license LICENSE\n\n    mv lib/10.2/cutensor.dll ${libdir}\n    mv lib/10.2/cutensorMg.dll ${libdir}\n    mv include/* ${prefix}/include\n\n    # fixup\n    chmod +x ${libdir}/*.dll\nfi\n""", """mkdir -p ${libdir} ${prefix}/include\n\ncd ${WORKSPACE}/srcdir\nif [[ ${target} == *-linux-gnu ]]; then\n    cd libcutensor*\n    find .\n\n    install_license LICENSE\n\n    mv lib/11.0/libcutensor.so* ${libdir}\n    mv lib/11.0/libcutensorMg.so* ${libdir}\n    mv include/* ${prefix}/include\nelif [[ ${target} == x86_64-w64-mingw32 ]]; then\n    cd libcutensor*\n    find .\n\n    install_license LICENSE\n\n    mv lib/11.0/cutensor.dll ${libdir}\n    mv lib/11.0/cutensorMg.dll ${libdir}\n    mv include/* ${prefix}/include\n\n    # fixup\n    chmod +x ${libdir}/*.dll\nfi\n""", """mkdir -p ${libdir} ${prefix}/include\n\ncd ${WORKSPACE}/srcdir\nif [[ ${target} == *-linux-gnu ]]; then\n    cd libcutensor*\n    find .\n\n    install_license LICENSE\n    mv lib/11/libcutensor.so* ${libdir}\n    mv lib/11/libcutensorMg.so* ${libdir}\n    mv include/* ${prefix}/include\nelif [[ ${target} == x86_64-w64-mingw32 ]]; then\n    cd libcutensor*\n    find .\n\n    install_license LICENSE\n\n    mv lib/11/cutensor.dll ${libdir}\n    mv lib/11/cutensorMg.dll ${libdir}\n    mv include/* ${prefix}/include\n\n    # fixup\n    chmod +x ${libdir}/*.dll\nfi\n"""]
