buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/798607ecaea27bcab4d3624725abb91f9bbce686/C/CGAL/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.2.2"

[metadata]
dependencies = ["boost_jll", "GMP_jll", "MPFR_jll"]
name = "CGAL"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "arm-linux-gnueabihf-cxx03", "arm-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "arm-linux-musleabihf-cxx03", "arm-linux-musleabihf-cxx11", "x86_64-apple-darwin14-cxx03", "x86_64-apple-darwin14-cxx11", "x86_64-unknown-freebsd11.1-cxx03", "x86_64-unknown-freebsd11.1-cxx11", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """## pre-build setup\n# exit on error\nset -eu\n\n# check c++ standard reported by the compiler\n# CGAL uses CMake's try_run to check if it needs to link with Boost.Thread\n# depending on the c++ standard supported by the compiler.\n__cplusplus=$($CXX -x c++ -dM -E - </dev/null | grep __cplusplus | grep -o '[0-9]*')\n\n## configure build\ncd \"$WORKSPACE/srcdir\"/CGAL-*/\nmkdir build && cd build\n\ncmake .. \\\n  `# cmake specific` \\\n  -DCMAKE_TOOLCHAIN_FILE=\"$CMAKE_TARGET_TOOLCHAIN\"\\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DCMAKE_INSTALL_PREFIX=\"$prefix\" \\\n  -DCMAKE_FIND_ROOT_PATH=\"$prefix\" \\\n  `# cgal specific` \\\n  -DCGAL_HEADER_ONLY=OFF \\\n  -DWITH_CGAL_Core=ON \\\n  -DWITH_CGAL_ImageIO=OFF \\\n  -DWITH_CGAL_Qt5=OFF \\\n  `# 'try_run' won't run the produced executable in a cross-compilation` \\\n  `# environment. Hence, this is required` \\\n  -DCGAL_test_cpp_version_RUN_RES__TRYRUN_OUTPUT=$__cplusplus\n\n## and away we go..\ncmake --build . --config Release --target install\n"""
version = "v5.0.0"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libCGAL"]
    type = "lib"
    variable_name = "libCGAL"
    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libCGAL_Core"]
    type = "lib"
    variable_name = "libCGAL_Core"

