name = "CUDNN_CUDA101"
platforms = ["x86_64-linux-gnu", "x86_64-w64-mingw32", "x86_64-apple-darwin14"]
script = """cd ${WORKSPACE}/srcdir\nif [[ ${target} == x86_64-linux-gnu ]]; then\n    cd cuda\n    find .\n\n    install_license NVIDIA_SLA_cuDNN_Support.txt\n\n    mv lib64/libcudnn.so* ${libdir}\n    mv include/* ${prefix}/include\nelif [[ ${target} == x86_64-w64-mingw32 ]]; then\n    cd cuda\n    find .\n\n    install_license NVIDIA_SLA_cuDNN_Support.txt\n\n    mv bin/cudnn64_*.dll ${libdir}\n    mv include/* ${prefix}/include\nelif [[ ${target} == x86_64-apple-darwin* ]]; then\n    cd cuda\n    find .\n\n    install_license NVIDIA_SLA_cuDNN_Support.txt\n\n    mv lib/libcudnn.*dylib ${libdir}\n    mv include/* ${prefix}/include\nfi\n"""
version = "v7.6.5"

