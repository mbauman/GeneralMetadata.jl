buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/d4a964554c3682eb28a6a3a336fe676b4d64397c/C/cminpack/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.5.8"

[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.9"
lazy_artifacts = false
name = "cminpack"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """\n# We need a newer version of CMake to support libblastrampoline\napk del cmake\n\ncd $WORKSPACE/srcdir/cminpack\n\n# Build single precision library\nmkdir build_s\ncmake -B build_s/ -S . \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DCMINPACK_PRECISION=\"s\" \\\n    -DBUILD_EXAMPLES=OFF \\\n    -DBLA_VENDOR=libblastrampoline \\\n    -DUSE_BLAS=ON\ncmake --build build_s/ --parallel ${nproc}\ncmake --install build_s/\n\n# Build double precision library\nmkdir build_d\ncmake -B build_d/ -S . \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DCMINPACK_PRECISION=\"d\" \\\n    -DBUILD_EXAMPLES=OFF \\\n    -DBLA_VENDOR=libblastrampoline \\\n    -DUSE_BLAS=ON\ncmake --build build_d/ --parallel ${nproc}\ncmake --install build_d/\n\ninstall_license CopyrightMINPACK.txt\n"""
version = "v1.3.9"

