buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/ecf381d13d56dcd18065db68e466ecbcfb36f4fa/C/Calcium/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.3.3"

[metadata]
init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "Calcium"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\ncd calcium*/\n\nif [[ ${target} == *musl* ]]; then\n   export CFLAGS=-D_GNU_SOURCE=1\nelif [[ ${target} == *mingw* ]]; then\n   # /lib is hardcoded in many places\n   sed -i -e \"s#/lib\\>#/$(basename ${libdir})#g\" configure\n   # MSYS_NT-6.3 is not detected as MINGW\n   extraflags=--build=MINGW${nbits}\nfi\n\n./configure --prefix=$prefix --disable-static --enable-shared --with-gmp=$prefix --with-mpfr=$prefix --with-flint=$prefix --with-arb=$prefix --with-antic=$prefix ${extraflags}\nmake -j${nproc}\nmake install LIBDIR=$(basename ${libdir})\n"""
version = "v0.300.0"

