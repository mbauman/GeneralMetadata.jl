[metadata]
augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "CPUInfo"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\ncd cpuinfo\nif [[ $target == *-w64-mingw32 ]]; then\n    atomic_patch -p1 ../patches/lowercase-windows-include.patch\nfi\nmkdir build\ncd build\ncmake \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_INSTALL_LIBDIR=$libdir \\\n    -DCPUINFO_BUILD_UNIT_TESTS=OFF \\\n    -DCPUINFO_BUILD_MOCK_TESTS=OFF \\\n    -DCPUINFO_BUILD_BENCHMARKS=OFF \\\n    -DCPUINFO_LIBRARY_TYPE=shared \\\n    ..\ncmake --build . -- -j $nproc\nmake install\nif [[ $target == *-w64-mingw32 ]]; then\n    install -Dvm 755 libcpuinfo.dll \"${libdir}/libcpuinfo.dll\"\nfi\n"""
version = "v0.0.20200122"

