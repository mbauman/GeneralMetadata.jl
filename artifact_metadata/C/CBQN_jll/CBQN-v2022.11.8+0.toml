platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/CBQN/\n\natomic_patch -p1 ../patches/library-extension.patch\n\n# Yes, the build systems fiddles with git remotes names, so we need to make it happy.  Sigh.\ngit remote rename origin bb\ngit remote add origin https://github.com/dzaima/CBQN.git\ngit fetch origin\n\nFLAGS=()\nif [[ \"${target}\" == *-apple-* ]]; then\n    FLAGS+=(NO_DYNAMIC_LIST=1)\nfi\n\nmake shared-o3 C_INCLUDE_PATH=\"${includedir}\" LIBRARY_PATH=\"${libdir}\" \"${FLAGS[@]}\"\ninstall -Dvm 0755 \"libcbqn.${dlext}\" \"${libdir}/libcbqn.${dlext}\"\n"""
version = "v2022.11.8"

