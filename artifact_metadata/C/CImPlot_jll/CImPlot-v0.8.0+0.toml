name = "CImPlot"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir\nmv cmake/CMakeLists.txt ./cimplot/\nmv implot cimplot/\ncd cimplot/\nmkdir build && cd build\ncmake .. -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DCMAKE_BUILD_TYPE=Release\nmake -j${nproc}\nmake install\nmkdir -p ${prefix}/share/licenses/${SRC_NAME}\nmv ../LICENSE ${prefix}/share/licenses/${SRC_NAME}/LICENSE_cimplot\nmv ../implot/LICENSE ${prefix}/share/licenses/${SRC_NAME}/LICENSE_implot\n"""
version = "v0.4.0"

