[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Ccluster"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/Ccluster*/\nif [[ ${target} == *musl* ]]; then\n    export CFLAGS=\"-D_GNU_SOURCE=1 -std=c99 -O2 -funroll-loops -g\"\nelif [[ ${target} == *mingw* ]]; then\n    sed -i -e \"s#/lib\\>#/$(basename ${libdir})#g\" configure; extraflags=--build=MINGW${nbits}\nfi\n./configure --prefix=$prefix \\\n    --disable-pthread \\\n    --disable-static \\\n    --enable-shared \\\n    --with-gmp=$prefix \\\n    --with-mpfr=$prefix \\\n    --with-flint=$prefix \\\n    --with-arb=$prefix \\\n    ${extraflags}\nmake library -j${nproc}\nmake install LIBDIR=$(basename ${libdir})\nexit\n"""
version = "v1.1.8"

