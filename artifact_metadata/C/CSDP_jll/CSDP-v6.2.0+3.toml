buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/15ffe930b12b47de4878c2840426deaea42e2a1b/./C/Coin-OR/CSDP/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
