[metadata]
lazy_artifacts = false
name = "Cairo"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/cairo-*/\n\n# Because `zlib` doesn't have a proper `.pc` file, configure fails to find.\nexport CPPFLAGS=\"-I${prefix}/include\"\n\nif [[ \"${target}\" == *-apple-* ]]; then\n    BACKEND_OPTIONS=\"--enable-quartz --enable-quartz-image --disable-xcb --disable-xlib\"\nelif [[ \"${target}\" == *-mingw* ]]; then\n    BACKEND_OPTIONS=\"--enable-win32 --disable-xcb --disable-xlib\"\nelif [[ \"${target}\" == *-linux-* ]] || [[ \"${target}\" == *freebsd* ]]; then\n    BACKEND_OPTIONS=\"--enable-xlib --enable-xcb --enable-xlib-xcb\"\nfi\n\n./configure --prefix=${prefix} --host=${target} \\\n    --disable-static \\\n    --enable-ft \\\n    --enable-tee \\\n    --enable-svg \\\n    --enable-ps \\\n    --enable-pdf \\\n    --enable-gobject \\\n    --disable-dependency-tracking \\\n    ${BACKEND_OPTIONS}\nmake -j${nproc}\nmake install\n"""
version = "v1.16.0"

