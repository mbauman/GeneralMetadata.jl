[metadata]
lazy_artifacts = false
name = "Chafa"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1"]
script = """cd ${WORKSPACE}/srcdir/chafa-*/\n\nif [[ \"${target}\" == *darwin* ]]; then\n    # For some reason building with Clang for macOS doesn't work\n    export CC=gcc\nfi\nif [[ \"${proc_family}\" == intel ]]; then\n    BUILTIN_FUNCS=yes\nelse\n    BUILTIN_FUNCS=no\nfi\n./autogen.sh \\\n    --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    ax_cv_gcc_check_x86_cpu_init=\"${BUILTIN_FUNCS}\" \\\n    ax_cv_gcc_check_x86_cpu_supports=\"${BUILTIN_FUNCS}\"\nmake -j${nproc}\nmake install\n"""
version = "v1.4.1"

