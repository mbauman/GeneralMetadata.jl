buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/59a590c9d4ddab2c61bc554f95df9136095f84a2/C/Chafa/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
