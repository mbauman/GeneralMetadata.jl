buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/1abb48b27c1d9ebb9aa5e677dbd92614116a4b48/C/CUDA/CUDA_Driver/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
