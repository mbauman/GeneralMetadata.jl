buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/6a44c412294be31ff9a078d630ab624d70070b66/L/libass/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.2.2"

[metadata]
dependencies = ["FreeType2_jll", "FriBidi_jll", "Bzip2_jll", "Zlib_jll"]
name = "libass"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libass-*\napk add nasm\n./configure --prefix=$prefix --host=$target --disable-require-system-font-provider\nmake -j${nproc}\nmake install\n"""
version = "v0.14.0"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libass"]
    type = "lib"
    variable_name = "libass"

    [[metadata.sources]]
