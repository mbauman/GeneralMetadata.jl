buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/8fbe1e32405124cb6ef93e8077f4fc165adae8f0/L/libserialport/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
system = "Yggdrasil"
version = "0.2.2"

[metadata]
dependencies = []
name = "libserialport"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libserialport-*/\n\n./configure --prefix=$prefix --host=$target --with-include-path=$prefix/include\nmake -j${nproc}\nmake install\n"""
version = "v0.1.1"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libserialport"]
    type = "lib"
    variable_name = "libserialport"

    [[metadata.sources]]
    "http://sigrok.org/download/source/libserialport/libserialport-0.1.1.tar.gz" = "4a2af9d9c3ff488e92fb75b4ba38b35bcf9b8a66df04773eba2a7bbf1fa7529d"
