buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/8b4f14ea446f208a970bf72930acb9f03558e2fd/L/LAME/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.2.2"

[metadata]
dependencies = []
name = "LAME"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/lame-*\nsed -i '2d' include/libmp3lame.sym\napk add nasm\nif [[ $(uname -m) == i?86 ]]; then\n    sed -i -e 's/<xmmintrin.h/&.nouse/' configure\nfi\n./configure --prefix=$prefix --host=$target\nmake -j${nproc}\nmake install\n"""
version = "v3.100.0"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libmp3lame"]
    type = "lib"
    variable_name = "libmp3lame"

    [[metadata.sources]]
    "https://downloads.sourceforge.net/lame/lame-3.100.tar.gz" = "ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e"
