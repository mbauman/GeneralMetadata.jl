[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "libcleri"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libcleri/\natomic_patch -p1 ../patches/cc-compiler.patch\nexport CFLAGS=$(pcre2-config --cflags)\nexport LDFLAGS=$(pcre2-config --libs8)\nmake -C Release FN=\"libcleri.${dlext}\"\nmake -C Release FN=\"libcleri.${dlext}\" install INSTALL_PATH=${prefix}\nif [[ \"${target}\" == *-apple-* ]]; then\n    install_name_tool -id @rpath/libcleri.dylib.0 ${libdir}/libcleri.dylib\nfi\nif [[ \"${target}\" == *-mingw* ]]; then\n    chmod a+x ${prefix}/lib/libcleri.${dlext}\nfi\n"""
version = "v0.12.1"

