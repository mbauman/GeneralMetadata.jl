    version-minor = 0
    version-patch = 0
    [[metadata.dependencies]]
    compat = ""
    name = "PCRE_jll"
    platforms = ["i686-w64-mingw32", "x86_64-w64-mingw32"]
    top_level = false
    type = "dependency"
    version-major = 0
    version-minor = 0
    version-patch = 0

