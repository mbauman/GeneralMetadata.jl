buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/c9c727fb250292796fd9d412e783e71cb03fddfc/L/LiquidDSP/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.6.6"

[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.7"
lazy_artifacts = false
name = "LiquidDSP"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/liquid-dsp\n\n#need to explicitly call patching\natomic_patch -p1 ../patches/NoPrint.patch\natomic_patch -p1 ../patches/FixWinCMAKE.patch\n\nmkdir build\ncd build \n\n#for all builds, disable simd and any/all testing. \n#not ideal with respect to simd but a complicated cmake otherwise. \n#need to set flags for aarch64-apple. \n\nif [[ \"${target}\" == *aarch64-apple* ]]; then \n   cmake .. -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_BUILD_TYPE=Release \\\n            -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n            -DCMAKE_EXE_LINKER_FLAGS=\"-L/opt/aarch64-apple-darwin20/aarch64-apple-darwin20/lib -lgcc_s.1.1\" \\\n            -DCMAKE_SHARED_LINKER_FLAGS=\"-L/opt/aarch64-apple-darwin20/aarch64-apple-darwin20/lib -lgcc_s.1.1\" \\\n            -DFIND_SIMD=OFF -DENABLE_SIMD=OFF \\\n            -DBUILD_EXAMPLES=OFF -DBUILD_AUTOTESTS=OFF -DBUILD_BENCHMARKS=OFF\nelse \n   cmake .. -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_BUILD_TYPE=Release \\\n            -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n            -DFIND_SIMD=OFF -DENABLE_SIMD=OFF \\\n            -DBUILD_EXAMPLES=OFF -DBUILD_AUTOTESTS=OFF -DBUILD_BENCHMARKS=OFF \\\n            -DCMAKE_C_STANDARD_LIBRARIES=\"\" \\\n            -DCMAKE_CXX_STANDARD_LIBRARIES=\"\"\nfi\n\nmake -j${nproc}\nmake install\n\n#need to specify license location\ninstall_license ${WORKSPACE}/srcdir/liquid-dsp/LICENSE\n\n"""
version = "v1.7.0"

