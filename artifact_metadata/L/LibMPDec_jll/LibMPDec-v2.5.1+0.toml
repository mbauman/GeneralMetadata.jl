julia_compat = "1.6"
lazy_artifacts = false
name = "LibMPDec"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/mpdecimal*/\n\n# Give somewhat reasonable names to libraries for Windows\natomic_patch -p1 ../patches/01-libname-windows.patch\n# By default use `${CC}` as linker\natomic_patch -p1 ../patches/02-linker-cc.patch\nautoreconf -fiv\n\nexport CFLAGS=\"-std=gnu99\"\n./configure --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --disable-cxx\nmake -j${nproc}\nmake install\n"""
version = "v2.5.1"

