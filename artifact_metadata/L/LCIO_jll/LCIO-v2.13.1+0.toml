buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/b105ceebd13829e7ec1f9edfa90bdda1cbcd45f3/L/LCIO/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
system = "Yggdrasil"
version = "0.2.2"

[metadata]
dependencies = ["Zlib_jll"]
name = "LCIO"
platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "x86_64-apple-darwin14-cxx03", "x86_64-apple-darwin14-cxx11"]
script = """cd $WORKSPACE/srcdir/LCIO-*/\nmkdir build && cd build\n\ncmake .. -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release\nmake -j${nproc}\nmake install\n"""
version = "v2.13.1"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["liblcio"]
    type = "lib"
    variable_name = "liblcio"
    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libsio"]
    type = "lib"
    variable_name = "libsio"

    [[metadata.sources]]
