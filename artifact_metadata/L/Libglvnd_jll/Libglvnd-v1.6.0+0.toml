script = """cd $WORKSPACE/srcdir/libglvnd-*/\nmkdir build && cd build\nFLAGS=()\nif [[ \"${target}\" == *musl* ]]; then\n    FLAGS=(-Dtls=false)\nfi\nmeson --cross-file=\"${MESON_TARGET_TOOLCHAIN}\" --buildtype=release \"${FLAGS[@]}\" ..\nninja -j${nproc}\nninja install\n# The license is embedded in the README file\ninstall_license ../README.md\n"""
