version = "0.6.4"

[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Libglvnd"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/libglvnd-*/\n\nif [[ \"${target}\" == *freebsd* ]]; then\n    sysprefix=/usr/local\nelse\n    sysprefix=/usr\nfi\n\nmkdir build && cd build\nFLAGS=()\nif [[ \"${target}\" == *musl* ]]; then\n    FLAGS=(-Dtls=false)\nfi\nmeson setup . .. \\\n    --cross-file=\"${MESON_TARGET_TOOLCHAIN}\" \\\n    --buildtype=release \\\n    --prefix=$sysprefix \\\n    --libdir=${libdir} \\\n    --includedir=${includedir} \\\n    \"${FLAGS[@]}\"\nninja -j${nproc}\nninja install\n# The license is embedded in the README file\ninstall_license ../README.md\n"""
version = "v1.7.1"

