[metadata]
augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "libimagequant"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libimagequant/\n\n# patch to create a dynamic library\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/cdylib.patch\n\ncd $WORKSPACE/srcdir/libimagequant/imagequant-sys\n\n# avoid 'cannot create cdylib' error on musl targets\n# see https://github.com/rust-lang/cargo/issues/8607\n#     https://github.com/rust-lang/rust/issues/59302\nif [[ \"${target}\" == *-musl* ]]; then\n    export RUSTFLAGS=\"-C target-feature=-crt-static\"\nfi\n\ncargo build --release\ninstall_license COPYRIGHT\n\n# Install under a consistent name\ninstall -Dvm 755 ../target/${rust_target}/release/*imagequant_sys.${dlext} \"${libdir}/libimagequant.${dlext}\"\n\n# Install the C header\ninstall -Dvm 644 libimagequant.h ${includedir}/libimagequant.h\n"""
version = "v4.4.1"

