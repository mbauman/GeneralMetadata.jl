buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/332c9c800b32ea7455a7931b53db69ffaafe5e5f/L/Libiconv/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.3.7"

[metadata]
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Libiconv"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "aarch64-apple-darwin", "armv6l-linux-gnueabihf", "armv6l-linux-musleabihf"]
script = """VERSION=1.16\ncd $WORKSPACE/srcdir/libiconv-*/\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --disable-static --enable-extra-encodings\nmake -j${nproc}\nmake install\n\n# Add pkg-config file\nmkdir -p \"${prefix}/lib/pkgconfig\"\ncat << EOF > \"${prefix}/lib/pkgconfig/iconv.pc\"\nprefix=${prefix}\nexec_prefix=\\${prefix}\nlibdir=\\${exec_prefix}/$(basename ${libdir})\nsharedlibdir=\\${libdir}\nincludedir=\\${includedir}\n\nName: iconv\nDescription: libiconv\nURL: https://www.gnu.org/software/libiconv/\nVersion: ${VERSION}\n\nRequires:\nLibs: -L\\${libdir} -liconv\nCflags: -I\\${includedir}\nEOF\n"""
version = "v1.16.1"

