[metadata]
dependencies = []
name = "Libiconv"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libiconv-*/\n./configure --prefix=$prefix --host=$target\nmake -j${nproc}\nmake install\n"""
version = "v1.16.0"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libiconv"]
    type = "lib"
    variable_name = "libiconv"

    [[metadata.sources]]
    "https://ftp.gnu.org/pub/gnu/libiconv/libiconv-1.16.tar.gz" = "e6a1b1b589654277ee790cce3734f07876ac4ccfaecbee8afa0b649cf529cc04"
