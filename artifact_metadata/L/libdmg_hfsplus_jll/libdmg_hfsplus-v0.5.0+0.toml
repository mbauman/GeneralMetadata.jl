[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "libdmg_hfsplus"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """    cd $WORKSPACE/srcdir/libdmg-hfsplus\n\n    cmake -B build \\\n        -DCMAKE_INSTALL_PREFIX=${prefix} \\\n        -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n        -DCMAKE_BUILD_TYPE=Release \\\n        -DZLIB_INCLUDE_DIR=${includedir} \\\n        -DZLIB_LIBRARY=\"${libdir}/libz.${dlext}\" \\\n        -DBZIP2_INCLUDE_DIR=${includedir}  \\\n        -DBZIP2_LIBRARIES=\"${libdir}/libbz2.${dlext}\" \\\n        -DLIBLZMA_INCLUDE_DIR=${includedir} \\\n        -DLIBLZMA_LIBRARY=\"${libdir}/liblzma.${dlext}\" \\\n        -DOPENSSL_INCLUDE_DIR=${includedir} \\\n        -DOPENSSL_CRYPTO_LIBRARY=\"${libdir}/libcrypto.${dlext}\" \\\n        -DLZFSE_INCLUDE_DIR=${includedir} \\\n        -DLZFSE_LIBRARY=\"${libdir}/liblzfse.${dlext}\"\n \n    cmake --build build --parallel ${nproc}\n\n    install -Dvm 755 \"build/dmg/dmg${exeext}\" \"${bindir}/dmg${exeext}\"\n    install -Dvm 755 \"build/hdutil/hdutil${exeext}\" \"${bindir}/hdutil${exeext}\"\n    install -Dvm 755 \"build/hfs/hfsplus${exeext}\" \"${bindir}/hfsplus${exeext}\"\n    install_license LICENSE \n"""
version = "v0.5.0"

