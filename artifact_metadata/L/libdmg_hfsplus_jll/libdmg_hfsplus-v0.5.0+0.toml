buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/18d90dc4084ef86dcd03cbebeeb2cbaba53c1de4/L/libdmg_hfsplus/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
