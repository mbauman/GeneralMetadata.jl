[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "LAGraph"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/LAGraph\ninstall_license LICENSE\n# x86 glibc builds throw \"undefined reference to 'clock_gettime' and 'clock_settime'\" errors if -lrt isn't set\nif [[ \"${target}\" == *86*-linux-gnu ]]; then\n\tatomic_patch -p1 ../patches/lrt-flag.patch\nfi\ncd build\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n      -DGRAPHBLAS_INCLUDE_DIR=${includedir} \\\n      -DCMAKE_BUILD_TYPE=Release ..\ncmake --build . --parallel ${nproc} --target all\ncmake --build . --target install\n"""
version = "v1.0.2"

