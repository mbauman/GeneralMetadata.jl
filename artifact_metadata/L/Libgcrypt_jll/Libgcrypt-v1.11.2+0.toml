buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/ce7bede362deb1ac4d5ca5fe9195f6487795a4ad/L/Libgcrypt/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.6.5"

[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Libgcrypt"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libgcrypt-*\n\nBUILD_FLAGS=(--disable-padlock-support --disable-asm)\n\nif [[ \"${target}\" == *linux* ]]; then\n    # on our old glibc, we don't have getentropy\n    BUILD_FLAGS+=(--enable-random=linux)\nfi\n\nif [[ \"${target}\" == *mingw* ]]; then\n    # Work around JuliaPackaging/Yggdrasil#9687\n    sed -i 's/CLOCK_REALTIME/0/g' random/jitterentropy-base-user.h\nfi\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} \"${BUILD_FLAGS[@]}\"\n\nmake -j${nproc}\nmake install\n"""
version = "v1.11.2"

