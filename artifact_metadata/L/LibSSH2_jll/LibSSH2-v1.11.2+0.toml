[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.10"
lazy_artifacts = false
name = "LibSSH2"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "x86_64-linux-gnu-sanitize+memory"]
script = """cd $WORKSPACE/srcdir/libssh2*/\n\n# https://github.com/libssh2/libssh2/pull/1291\natomic_patch -p1 ../patches/0001-src-add-strict-KEX-to-fix-CVE-2023-48795-Terrapin-At.patch\n\nif [[ ${bb_full_target} == *-sanitize+memory* ]]; then\n    # Install msan runtime (for clang)\n    cp -rL ${libdir}/linux/* /opt/x86_64-linux-musl/lib/clang/*/lib/linux/\nfi\n\nBUILD_FLAGS=(\n    -DCMAKE_BUILD_TYPE=Release\n    -DBUILD_SHARED_LIBS=ON\n    -DBUILD_STATIC_LIBS=OFF\n    -DBUILD_EXAMPLES=OFF\n    -DBUILD_TESTING=OFF\n    -DENABLE_ZLIB_COMPRESSION=OFF\n    -DCMAKE_INSTALL_PREFIX=${prefix}\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\n)\n\n# Use native backend on Windows, OpenSSL on others\nif [[ ${target} == *-mingw* ]]; then\n    BUILD_FLAGS+=(-DCRYPTO_BACKEND=WinCNG)\nelse\n    BUILD_FLAGS+=(-DCRYPTO_BACKEND=OpenSSL)\nfi\n\nmkdir build && cd build\n\ncmake .. \"${BUILD_FLAGS[@]}\"\nmake -j${nproc}\nmake install\n"""
version = "v1.11.2"

