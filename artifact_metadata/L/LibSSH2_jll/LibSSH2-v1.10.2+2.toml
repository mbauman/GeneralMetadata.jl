buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/0aafcb84be4a0964dff65417c3073d957d004d55/L/LibSSH2/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.5.5"

[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.8"
lazy_artifacts = false
name = "LibSSH2"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32", "x86_64-linux-gnu-sanitize+memory"]
script = """cd $WORKSPACE/srcdir/libssh2*/\n\n# Apply patch to fix v1.10.0 CVE (https://github.com/libssh2/libssh2/issues/649), drop with v1.11\natomic_patch -p1 ../patches/0001-userauth-check-for-too-large-userauth_kybd_auth_name.patch\n# Fix import lib name on windows: `liblibssh2.dll.a` ==> `libssh2.dll.a`\n# Drop this when a new release contains: https://github.com/libssh2/libssh2/pull/711\natomic_patch -p1 ../patches/0002-libssh2-fix-import-lib-name.patch\n\nif [[ ${bb_full_target} == *-sanitize+memory* ]]; then\n    # Install msan runtime (for clang)\n    cp -rL ${libdir}/linux/* /opt/x86_64-linux-musl/lib/clang/*/lib/linux/\nfi\n\nBUILD_FLAGS=(\n    -DCMAKE_BUILD_TYPE=Release\n    -DCRYPTO_BACKEND=mbedTLS\n    -DBUILD_SHARED_LIBS=ON\n    -DBUILD_EXAMPLES=OFF\n    -DBUILD_TESTING=OFF\n    -DENABLE_ZLIB_COMPRESSION=OFF\n    -DCMAKE_INSTALL_PREFIX=${prefix}\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\n)\n\nmkdir build && cd build\n\ncmake .. \"${BUILD_FLAGS[@]}\"\nmake -j${nproc}\nmake install\n"""
version = "v1.10.2"

