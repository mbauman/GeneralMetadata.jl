buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/ca16f09925f0970c1922539a8a0d8af40a785b80/L/LibSSH2/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
system = "Yggdrasil"
version = "0.2.2"

[metadata]
dependencies = ["MbedTLS_jll"]
name = "LibSSH2"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libssh2*/\n\nBUILD_FLAGS=(\n    -DCMAKE_BUILD_TYPE=Release\n    -DCRYPTO_BACKEND=mbedTLS\n    -DBUILD_SHARED_LIBS=ON\n    -DBUILD_EXAMPLES=OFF\n    -DBUILD_TESTING=OFF\n    -DENABLE_ZLIB_COMPRESSION=OFF\n    \"-DCMAKE_INSTALL_PREFIX=${prefix}\"\n    \"-DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\"\"\n)\n\nmkdir build && cd build\n\ncmake .. \"${BUILD_FLAGS[@]}\"\nmake -j${nproc}\nmake install\n"""
version = "v1.9.0"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libssh2"]
    type = "lib"
    variable_name = "libssh2"

    [[metadata.sources]]
    "https://github.com/libssh2/libssh2/releases/download/libssh2-1.9.0/libssh2-1.9.0.tar.gz" = "d5fb8bd563305fd1074dda90bd053fb2d29fc4bce048d182f96eaa466dfadafd"
