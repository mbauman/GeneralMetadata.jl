buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/b39ae021c4451e9468ca0bad3a907b55e9226796/L/Libtiff/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.2.2"

[metadata]
dependencies = ["JpegTurbo_jl", "Zlib_jl", "Zstd_jll"]
name = "Libtiff"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/tiff-*/\nCPPFLAGS=\"-I${prefix}/include\"\n\nif [[ \"${target}\" == *-apple-* ]]; then\n    AR=/opt/${target}/bin/${target}-ar\nfi\n\n./configure --prefix=$prefix --host=$target\nmake -j${nproc}\nmake install\n"""
version = "v4.0.10"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libtiff"]
    type = "lib"
    variable_name = "libtiff"

    [[metadata.sources]]
    "https://download.osgeo.org/libtiff/tiff-4.0.10.tar.gz" = "2c52d11ccaf767457db0c46795d9c7d1a8d8f76f68b0b800a3dfe45786b996e4"
