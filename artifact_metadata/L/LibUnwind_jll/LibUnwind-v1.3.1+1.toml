buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/de9cb76d1defaab63e384f1f879737856e93c02b/L/LibUnwind/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.2.3"

[metadata]
lazy_artifacts = false
name = "LibUnwind"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-unknown-freebsd11.1"]
script = """cd $WORKSPACE/srcdir/libunwind*/\n\n# We need to massage configure script to convince it to build the shared library\n# for PowerPC.\nif [[ \"${target}\" == powerpc64le-* ]]; then\n    autoreconf -vi\nfi\n\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/libunwind-prefer-extbl.patch\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/libunwind-static-arm.patch\natomic_patch -p0 ${WORKSPACE}/srcdir/patches/libunwind-configure-ppc64le.patch\natomic_patch -p0 ${WORKSPACE}/srcdir/patches/libunwind-configure-static-lzma.patch\n\nCFLAGS=\"${CFLAGS} -DPI -fPIC -I${prefix}/include\"\n./configure --prefix=$prefix --host=$target CFLAGS=\"${CFLAGS}\" --libdir=${libdir} --enable-minidebuginfo --disable-tests\nmake -j${nproc}\nmake install\n\n# Shoe-horn liblzma.a into libunwind.a\nmkdir -p unpacked/{liblzma,libunwind}\n(cd unpacked/liblzma; ar -x ${prefix}/lib/liblzma.a)\n(cd unpacked/libunwind; ar -x ${prefix}/lib/libunwind.a)\nrm -f ${prefix}/lib/libunwind.a\nar -qc ${prefix}/lib/libunwind.a unpacked/**/*\n"""
version = "v1.3.1"

    [[metadata.dependencies]]
    name = "XZ_jll"
    type = "builddependency"
    version-major = 0
    version-minor = 0
    version-patch = 0

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libunwind"]
    type = "lib"
    variable_name = "libunwind"

