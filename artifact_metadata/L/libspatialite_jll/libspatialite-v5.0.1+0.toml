name = "libspatialite"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/libspatialite-*\n\n# Detection of MinGW and macOS is totally wrong: `target_alias` is empty.  We\n# could use `host_alias` (why not `host`?), but we should do regex matching,\n# which doesn't work very well with Alpine's (da)sh, easiest thing is to check\n# `uname -s`, which is easier to test.\natomic_patch -p1 ../patches/configure-ac-system-detection.patch\n\nupdate_configure_scripts\nautoreconf -vi\n\nif [[ ${target} == *-linux-musl* ]] || [[ ${target} == *-freebsd* ]]; then\n    #help find sqlite.h header usually\n    export CPPFLAGS=\"-I${includedir}\"\n\nelif [[ \"${target}\" == *-mingw* ]]; then\n\n    atomic_patch -p1 ${WORKSPACE}/srcdir/patches/mingw-lowercase-include.patch\n\nfi\n\n./configure \\\n    --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --includedir=${includedir} \\\n    --libdir=${libdir} \\\n    --enable-shared=yes \\\n    --enable-static=no \\\n    --enable-geocallbacks=yes \\\n    --enable-knn=yes \\\n    --enable-proj=yes \\\n    --enable-iconv=yes \\\n    --enable-freexl=no \\\n    --enable-epsg=yes \\\n    --enable-geos=yes \\\n    --enable-geosadvanced=yes \\\n    --enable-geosreentrant=yes \\\n    --enable-geos370=yes \\\n    --enable-gcp=no \\\n    --enable-rttopo=no \\\n    --enable-libxml2=yes \\\n    --enable-minizip=no \\\n    --enable-geopackage=yes \\\n    --enable-gcov=no \\\n    --enable-examples=no \\\n    --enable-module-only=no\n\nmake -j${nproc}\nmake install\n\nif [[ \"${target}\" == *-darwin* ]]; then\n    # I have no idea how they managed to get the extension wrong only for mod_spatialite,\n    # but they did.  Let's rename everything manually, sigh.\n    mv \"${libdir}/mod_spatialite.7.so\" \"${libdir}/mod_spatialite.7.${dlext}\"\n    rm \"${libdir}/mod_spatialite.so\"\n    ln -s \"mod_spatialite.7.${dlext}\" \"${libdir}/mod_spatialite.${dlext}\"\n    sed -i \"s/\\.so/.${dlext}/g\" ${libdir}/mod_spatialite.la\nfi\n"""
version = "v5.0.1"

