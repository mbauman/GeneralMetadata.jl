[metadata]
dependencies = []
name = "lm_Sensors"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf"]
script = """cd $WORKSPACE/srcdir/lm-sensors-*/\nmake -j${nproc} PREFIX=${prefix}\nmake install PREFIX=${prefix}\n"""
version = "v3.5.0"

    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["libsensors"]
    type = "lib"
    variable_name = "libsensors"
    [[metadata.products]]
    binnames = ["sensors"]
    type = "exe"
    variable_name = "sensors"

    [[metadata.sources]]
    "https://github.com/lm-sensors/lm-sensors/archive/V3-5-0.tar.gz" = "f671c1d63a4cd8581b3a4a775fd7864a740b15ad046fe92038bcff5c5134d7e0"
