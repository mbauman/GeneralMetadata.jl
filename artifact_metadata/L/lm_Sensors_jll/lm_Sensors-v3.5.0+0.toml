buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/f4df6525c1f08b1ec3c4db5015ab2b8a358fc344/./L/lm_sensors/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
metadata_type = "BinaryBuilder --meta-json"
