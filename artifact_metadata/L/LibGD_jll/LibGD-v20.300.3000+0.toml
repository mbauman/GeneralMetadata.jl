buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/7fb87ce13de73a8dd0c90819b77a581ed8007317/L/LibGD/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
metadata_type = "BinaryBuilder --meta-json"
