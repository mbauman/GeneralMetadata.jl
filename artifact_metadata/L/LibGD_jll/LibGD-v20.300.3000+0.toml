[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "LibGD"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libgd-*\n\n# for release 2.3.3, remove in 2.3.4 (adapted from https://github.com/libgd/libgd/pull/828)\natomic_patch -p1 -l ${WORKSPACE}/srcdir/patches/allow-mingw-for-webpng.patch\n\nmkdir build\n\nargs+=(-DCMAKE_TOOLCHAIN_FILE=$CMAKE_TARGET_TOOLCHAIN)\nargs+=(-DCMAKE_INSTALL_PREFIX=$prefix)\nargs+=(-DCMAKE_BUILD_TYPE=RELEASE)\n\nargs+=(-DENABLE_FONTCONFIG=1)\nargs+=(-DENABLE_GD_FORMATS=1)\nargs+=(-DENABLE_FREETYPE=1)\nargs+=(-DENABLE_ICONV=1)\nargs+=(-DENABLE_JPEG=1)\nargs+=(-DENABLE_TIFF=1)\nargs+=(-DENABLE_HEIF=1)\nargs+=(-DENABLE_AVIF=0)  # FIXME: fails\nargs+=(-DENABLE_WEBP=1)\nargs+=(-DENABLE_PNG=1)\n\ncmake -B build -S . \"${args[@]}\"\n\ncmake --build build --parallel $nproc\ncmake --install build\n\ninstall_license COPYING\n"""
version = "v20.300.3000"

