[metadata]
init_block = ""
julia_compat = "1.0"
lazy_artifacts = false
name = "LibGD"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libgd-*/\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\n# For some reasons (something must be off in the configure script), on some\n# platforms the build system tries to use iconv but without adding the `-liconv`\n# flag.  Give a hint to make to use the right flag everywhere\nmake -j${nproc} LIBICONV=\"-liconv\" LTLIBICONV=\"-liconv\"\nmake install\n"""
version = "v2.3.0"

