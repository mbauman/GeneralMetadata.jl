buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/ea823275c7b91d1eb849e1acf1fe35ef3c7e20d2/L/Lua/build_tarballs.jl"
metadata_source = "retrospective (by timestamp)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.2.2"

[metadata]
dependencies = ["Readline_jll"]
name = "Lua"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/lua-*\n\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/src_Makefile.patch\"\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/src_lauxlib.c.patch\"\n\nif [[ ${target} == *-apple-* ]]; then\n    MAKE_TARGET=macosx\nelif [[ ${target} == *-freebsd* ]]; then\n    # NOTE: The FreeBSD ports build also uses the bsd instead of the freebsd target,\n    # since it hard-codes fewer things, apparently\n    MAKE_TARGET=bsd\nelif [[ ${target} == *-mingw* ]]; then\n    MAKE_TARGET=mingw\nelse\n    MAKE_TARGET=linux\n    export CPPFLAGS=\"-I${prefix}/include\"\nfi\n\n# XXX: Work around Lua apparently not understanding its own Windows setup\nif [[ ${target} == *-mingw* ]]; then\n    TO_BIN=\"lua.exe luac.exe\"\n    TO_LIB=\"lua53.dll\"\nelse\n    TO_BIN=\"lua luac\"\n    TO_LIB=\"liblua.${dlext}\"\nfi\n\nmake -j${nproc} ${MAKE_TARGET} DLEXT=\"${dlext}\"\nmake install INSTALL_TOP=\"${prefix}\" INSTALL_LIB=\"${libdir}\" TO_BIN=\"${TO_BIN}\" TO_LIB=\"${TO_LIB}\"\n\ninstall_license \"${WORKSPACE}/srcdir/LICENSE\"\n"""
sources = [{"https://www.lua.org/ftp/lua-5.3.5.tar.gz" = "0c2eed3f960446e1a3e4b9a1ca2f3ff893b6ce41942cf54d5dd59ab4b3b058ac"}, "./bundled"]
version = "v5.3.5"

    [[metadata.products]]
    binnames = ["lua"]
    type = "exe"
    variable_name = "lua"
    [[metadata.products]]
    binnames = ["luac"]
    type = "exe"
    variable_name = "luac"
    [[metadata.products]]
    dir_paths = []
    dont_dlopen = false
    libnames = ["liblua", "lua53"]
    type = "lib"
    variable_name = "liblua"
