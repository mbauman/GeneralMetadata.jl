platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """\ncd $WORKSPACE/srcdir/Triangle\n\nmkdir -p \"${libdir}\"\n\nGENERICFLAGS=(-DREAL=double  -DTRILIBRARY  -DNDEBUG -DNO_TIMER -DEXTERNAL_TEST)\n\nif [[ \"${target}\" == x86_64-w64-mingw32 ]]; then\n    ARCHFLAGS=(-DULONG=\"unsigned long long\")\nelse\n    ARCHFLAGS=(-DULONG=\"unsigned long\" -fPIC)\nfi\n\n$CC \"${ARCHFLAGS[@]}\"  \"${GENERICFLAGS[@]}\" -O3  --shared -o \"${libdir}/libtriangle.${dlext}\" triangle.c triwrapjulia.c\n\ninstall_license README\n"""
version = "v1.6.2"

