[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Tk"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """macos_sdk_version=12.3\nmacosx_deployment_target=12.3\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    # extract the tarball into the sys-root so all compilers pick it up\n    # automatically, and use --warning=no-unknown-keyword to hide harmless\n    # warnings about unsupported pax header keywords like \"SCHILY.fflags\"\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        --warning=no-unknown-keyword \\\n        MacOSX${macos_sdk_version}.sdk/System \\\n        MacOSX${macos_sdk_version}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\nif [[ \"${target}\" == *-mingw* ]]; then\n    cd $WORKSPACE/srcdir/tk/win/\nelse\n    cd $WORKSPACE/srcdir/tk/unix/\nfi\n\nexport CFLAGS=\"-I${prefix}/include ${CFLAGS}\"\n\nFLAGS=(--disable-zipfs --enable-threads --disable-rpath)\nif [[ \"${target}\" == x86_64-* ]] || [[ \"${target}\" == aarch64-* ]]; then\n    FLAGS+=(--enable-64bit)\nfi\nif [[ \"${target}\" == *-apple-* ]]; then\n    FLAGS+=(--with-x=no)\n    FLAGS+=(--enable-aqua=yes)\n\n    # The following patch replaces the hard-coded path of Cocoa framework\n    # with the actual path on our system.\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/apple_cocoa_configure.patch\"\n\n    export LDFLAGS=\"-framework UniformTypeIdentifiers -L${libdir}/darwin -lclang_rt.osx ${LDFLAGS}\"\nfi\nif [[ \"${target}\" == *mingw* ]]; then\n    FLAGS+=(--with-x=no)\n\n    # `windres` invocations don't get the proper tk include path; just hack it in\n    atomic_patch -p2 \"${WORKSPACE}/srcdir/patches/win_tk_rc_include.patch\"\nfi\n# Enable Xft for TrueType font support on X11 platforms\nif [[ \"${target}\" == *-linux-* ]] || [[ \"${target}\" == *-freebsd* ]]; then\n    FLAGS+=(--enable-xft)\nfi\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} \"${FLAGS[@]}\"\n\nmake -j${nproc}\nmake install\nmake install-private-headers\n\n# Install license file\ninstall_license $WORKSPACE/srcdir/tk/license.terms\n"""
version = "v9.0.3"

