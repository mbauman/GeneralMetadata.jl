name = "TVMFFI"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/tvm-ffi\ngit submodule update --init\ncmake \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DTVM_FFI_ATTACH_DEBUG_SYMBOLS=ON \\\n    -DTVM_FFI_BUILD_TESTS=OFF \\\n    -DTVM_FFI_BUILD_PYTHON_MODULE=OFF \\\n    -DTVM_FFI_BACKTRACE_ON_SEGFAULT=OFF \\\n    -B ../../build\ncmake --build ../../build\ncmake --install ../../build\ninstall_license LICENSE\n"""
version = "v0.1.5"

