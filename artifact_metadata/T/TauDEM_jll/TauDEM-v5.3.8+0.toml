platforms = ["i686-linux-gnu-cxx03-mpi+mpich", "i686-linux-gnu-cxx11-mpi+mpich", "x86_64-linux-gnu-cxx03-mpi+mpich", "x86_64-linux-gnu-cxx11-mpi+mpich", "aarch64-linux-gnu-cxx03-mpi+mpich", "aarch64-linux-gnu-cxx11-mpi+mpich", "armv6l-linux-gnueabihf-cxx03-mpi+mpich", "armv6l-linux-gnueabihf-cxx11-mpi+mpich", "armv7l-linux-gnueabihf-cxx03-mpi+mpich", "armv7l-linux-gnueabihf-cxx11-mpi+mpich", "powerpc64le-linux-gnu-cxx03-mpi+mpich", "powerpc64le-linux-gnu-cxx11-mpi+mpich", "i686-linux-musl-cxx03-mpi+mpich", "i686-linux-musl-cxx11-mpi+mpich", "x86_64-linux-musl-cxx03-mpi+mpich", "x86_64-linux-musl-cxx11-mpi+mpich", "aarch64-linux-musl-cxx03-mpi+mpich", "aarch64-linux-musl-cxx11-mpi+mpich", "armv6l-linux-musleabihf-cxx03-mpi+mpich", "armv6l-linux-musleabihf-cxx11-mpi+mpich", "armv7l-linux-musleabihf-cxx03-mpi+mpich", "armv7l-linux-musleabihf-cxx11-mpi+mpich", "x86_64-apple-darwin-mpi+mpich", "aarch64-apple-darwin-mpi+mpich", "x86_64-unknown-freebsd-mpi+mpich", "i686-w64-mingw32-cxx03-mpi+microsoftmpi", "i686-w64-mingw32-cxx11-mpi+microsoftmpi", "x86_64-w64-mingw32-cxx03-mpi+microsoftmpi", "x86_64-w64-mingw32-cxx11-mpi+microsoftmpi", "i686-linux-gnu-cxx03-mpi+mpitrampoline", "i686-linux-gnu-cxx11-mpi+mpitrampoline", "x86_64-linux-gnu-cxx03-mpi+mpitrampoline", "x86_64-linux-gnu-cxx11-mpi+mpitrampoline", "aarch64-linux-gnu-cxx03-mpi+mpitrampoline", "aarch64-linux-gnu-cxx11-mpi+mpitrampoline", "armv6l-linux-gnueabihf-cxx03-mpi+mpitrampoline", "armv6l-linux-gnueabihf-cxx11-mpi+mpitrampoline", "armv7l-linux-gnueabihf-cxx03-mpi+mpitrampoline", "armv7l-linux-gnueabihf-cxx11-mpi+mpitrampoline", "powerpc64le-linux-gnu-cxx03-mpi+mpitrampoline", "powerpc64le-linux-gnu-cxx11-mpi+mpitrampoline", "x86_64-apple-darwin-mpi+mpitrampoline", "aarch64-apple-darwin-mpi+mpitrampoline"]
script = """cd $WORKSPACE/srcdir/TauDEM-*\n\n#this has been added on master, so can probably get rid of next version release\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/add-cxx-standard.patch\n# Explicitly cast initial values of `float` array to `float` values\natomic_patch -p1 ../patches/float-list-init.patch\n# Replace MPI 1 calls that were removed from MPI 3\natomic_patch -p1 ../patches/mpi3.patch\n# Fix linking to MPI libraries\natomic_patch -p1 ../patches/cmake-link-mpi.patch\n\ncd src\nmkdir build && cd build\n\n# Adapted from Erik Schnetter's build for AMReX\nARGS=()\nif [[ \"$target\" == *-apple-* ]]; then\n    if grep -q MPICH_NAME ${prefix}/include/mpi.h; then\n        # MPICH's pkgconfig file \"mpich.pc\" lists these options:\n        #     Libs:     -framework OpenCL -Wl,-flat_namespace -Wl,-commons,use_dylibs -L${libdir} -lmpi -lpmpi -lm    -lpthread\n        #     Cflags:   -I${includedir}\n        # cmake doesn't know how to handle the \"-framework OpenCL\" option\n        # and wants to use \"-framework\" as a stand-alone option. This fails,\n        # and cmake concludes that MPI is not available.\n        for lang in C CXX; do\n            ARGS+=(\n                -DMPI_${lang}_ADDITIONAL_INCLUDE_DIRS=''\n                -DMPI_${lang}_LIBRARIES='-Wl,-flat_namespace;-Wl,-commons,use_dylibs;-lmpi;-lpmpi'\n            )\n        done\n    elif grep -q MPItrampoline ${prefix}/include/mpi.h; then\n        for lang in C CXX; do\n            ARGS+=(\n                -DMPI_${lang}_ADDITIONAL_INCLUDE_DIRS=''\n                -DMPI_${lang}_LIBRARIES='-lmpitrampoline'\n            )\n        done\n    fi\nelif [[ \"$target\" == x86_64-w64-mingw32 ]]; then\n    ARGS+=(\n        -DMPI_HOME=${prefix}\n        -DMPI_GUESS_LIBRARY_NAME=MSMPI\n    )\n    if [[ \"${target}\" == x86_64-* ]]; then\n        for lang in C CXX; do\n            ARGS+=(-DMPI_${lang}_LIBRARIES=msmpi64)\n        done\n    fi\nfi\n\ncmake .. \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    \"${ARGS[@]}\"\n\nmake -j${nproc}\nmake install\n"""
version = "v5.3.8"

