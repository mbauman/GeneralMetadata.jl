[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "tectonic"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
script = """cd ${WORKSPACE}/srcdir/tectonic\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    export RUSTFLAGS=\"-Clink-args=-L${libdir}\"\nfi\n\ncargo build --release --locked --features external-harfbuzz\ninstall -Dvm 755 \"target/${rust_target}/release/tectonic${exeext}\" \"${bindir}/tectonic${exeext}\"\n"""
version = "v0.15.0"

