buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/b8cf9dbe8cd45816a34087c862744c5528834e38/T/TDLib/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
system = "Yggdrasil"
version = "0.6.4"

[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "TDLib"
platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11"]
script = """cd td/\ninstall_license LICENSE_1_0.txt\nsed -i 's|TD_HAS_MMSG 1|TD_HAS_MMSG 0|' tdutils/td/utils/port/config.h  # otherwise not compatible with old glibc\nmkdir build\ncd build\ncmake -DCMAKE_BUILD_TYPE=Release -DZLIB_LIBRARY=$libdir -DZLIB_INCLUDE_DIR=$includedir ..\nfor f in $(grep -l $(find . -name link.txt) -e 'opt/bin\\S*/c++')\ndo\n    # without this flag it cannot find libz\n    sed -i ' 1 s/$/ -lz/' $f\ndone\ncmake --build . -j${nproc}\ncp libtdjson.${dlext} $libdir/libtdjson.${dlext}\n"""
version = "v1.8.46"

