[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.8"
lazy_artifacts = false
name = "TDLib"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd ${WORKSPACE}/srcdir/td/\n\ninstall_license LICENSE_1_0.txt\n\nmkdir build_native && cd build_native\ncmake \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_INSTALL_PREFIX=$host_prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_HOST_TOOLCHAIN} \\\n    -DZLIB_LIBRARY=\"${host_libdir}/libz.a\" \\\n    -DZLIB_INCLUDE_DIR=\"${host_includedir}\" \\\n    -DOPENSSL_CRYPTO_LIBRARY=\"${host_libdir}/libcrypto.so\" \\\n    -DOPENSSL_SSL_LIBRARY=\"${host_libdir}/libssl.so\" \\\n    -DOPENSSL_INCLUDE_DIR=\"${host_includedir}\" \\\n    ..\ncmake --build . --target prepare_cross_compiling -j${nproc}\n\ncd ../\nmkdir build-cross && cd build-cross\ncmake \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DNATIVE_BUILD_DIR=${WORKSPACE}/srcdir/td/build_native \\\n    ..\ncmake --build . --target tdjson -j${nproc}\ncmake --build . --target tdjson_static -j${nproc}\ncmake --install .\n"""
version = "v1.8.61"

