platforms = ["x86_64-linux-gnu-cuda+11.0", "x86_64-w64-mingw32-cuda+11.0", "x86_64-linux-gnu-cuda+12.0", "x86_64-w64-mingw32-cuda+12.0", "aarch64-linux-gnu-cuda_platform+jetson-cuda+12.0", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+12.0"]
script = """mkdir -p $bindir $includedir $libdir\n\ncd $WORKSPACE/srcdir\n\ncd TensorRT*\nif [[ \"$target\" == x86_64-w64-mingw32 ]]; then\n    chmod +x bin/*.exe lib/*.dll\nfi\nmv -v bin/* $bindir\nmv -v include/* $includedir\nmv -v lib/*.${dlext}* $libdir\nif [[ \"$target\" == *-linux-gnu ]]; then\n    mv -v lib/stubs $libdir\nfi\ninstall_license doc/Acknowledgements.txt\n"""
