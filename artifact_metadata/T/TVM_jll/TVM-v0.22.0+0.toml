script = ["""if [[ \"${target}\" == x86_64-apple-darwin* ]]; then\nmacos_sdk=10.14\n    echo \"Extracting MacOSX${macos_sdk}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        MacOSX${macos_sdk}.sdk/System \\\n        MacOSX${macos_sdk}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macos_sdk}\nfi\ncd $WORKSPACE/srcdir/tvm\ninstall_license LICENSE \ngit submodule update --init --recursive\n# setup LLVM_LIBS manually for non-Linux OS\nif [[ \"$target\" == *darwin* ]]; then\n    export LLVM_LIBS=\"${libdir}/libLLVM-15.0.dylib\"\nelif [[ \"$target\" == *mingw* ]]; then\n    export LLVM_LIBS=\"${bindir}/libLLVM-15jl.dll\"\nelse\n    export LLVM_LIBS=\"${libdir}/libLLVM-15jl.so\"\nfi\ncmake -B ../../build -DCMAKE_INSTALL_PREFIX=${prefix} \\\n         -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n         -DUSE_ALTERNATIVE_LINKER=OFF \\\n         -DCMAKE_BUILD_TYPE=Release \\\n         -DUSE_LLVM=ON \\\n         -DLLVM_LIBS=${LLVM_LIBS} \\\n         -G Ninja\nninja -C ../../build\nninja -C ../../build install\n""", """if [[ \"${target}\" == x86_64-apple-darwin* ]]; then\nmacos_sdk=10.14\n    echo \"Extracting MacOSX${macos_sdk}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        MacOSX${macos_sdk}.sdk/System \\\n        MacOSX${macos_sdk}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macos_sdk}\nfi\ncd $WORKSPACE/srcdir/tvm\ninstall_license LICENSE \ngit submodule update --init --recursive\n# setup LLVM_LIBS manually for non-Linux OS\nif [[ \"$target\" == *darwin* ]]; then\n    export LLVM_LIBS=\"${libdir}/libLLVM-16.0.dylib\"\nelif [[ \"$target\" == *mingw* ]]; then\n    export LLVM_LIBS=\"${bindir}/libLLVM-16jl.dll\"\nelse\n    export LLVM_LIBS=\"${libdir}/libLLVM-16jl.so\"\nfi\ncmake -B ../../build -DCMAKE_INSTALL_PREFIX=${prefix} \\\n         -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n         -DUSE_ALTERNATIVE_LINKER=OFF \\\n         -DCMAKE_BUILD_TYPE=Release \\\n         -DUSE_LLVM=ON \\\n         -DLLVM_LIBS=${LLVM_LIBS} \\\n         -G Ninja\nninja -C ../../build\nninja -C ../../build install\n""", """if [[ \"${target}\" == x86_64-apple-darwin* ]]; then\nmacos_sdk=10.14\n    echo \"Extracting MacOSX${macos_sdk}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        MacOSX${macos_sdk}.sdk/System \\\n        MacOSX${macos_sdk}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macos_sdk}\nfi\ncd $WORKSPACE/srcdir/tvm\ninstall_license LICENSE \ngit submodule update --init --recursive\n# setup LLVM_LIBS manually for non-Linux OS\nif [[ \"$target\" == *darwin* ]]; then\n    export LLVM_LIBS=\"${libdir}/libLLVM-18.1.dylib\"\nelif [[ \"$target\" == *mingw* ]]; then\n    export LLVM_LIBS=\"${bindir}/libLLVM-18jl.dll\"\nelse\n    export LLVM_LIBS=\"${libdir}/libLLVM-18jl.so\"\nfi\ncmake -B ../../build -DCMAKE_INSTALL_PREFIX=${prefix} \\\n         -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n         -DUSE_ALTERNATIVE_LINKER=OFF \\\n         -DCMAKE_BUILD_TYPE=Release \\\n         -DUSE_LLVM=ON \\\n         -DLLVM_LIBS=${LLVM_LIBS} \\\n         -G Ninja\nninja -C ../../build\nninja -C ../../build install\n""", """if [[ \"${target}\" == x86_64-apple-darwin* ]]; then\nmacos_sdk=10.14\n    echo \"Extracting MacOSX${macos_sdk}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        MacOSX${macos_sdk}.sdk/System \\\n        MacOSX${macos_sdk}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macos_sdk}\nfi\ncd $WORKSPACE/srcdir/tvm\ninstall_license LICENSE \ngit submodule update --init --recursive\n# setup LLVM_LIBS manually for non-Linux OS\nif [[ \"$target\" == *darwin* ]]; then\n    export LLVM_LIBS=\"${libdir}/libLLVM-20.1.dylib\"\nelif [[ \"$target\" == *mingw* ]]; then\n    export LLVM_LIBS=\"${bindir}/libLLVM-20jl.dll\"\nelse\n    export LLVM_LIBS=\"${libdir}/libLLVM-20jl.so\"\nfi\ncmake -B ../../build -DCMAKE_INSTALL_PREFIX=${prefix} \\\n         -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n         -DUSE_ALTERNATIVE_LINKER=OFF \\\n         -DCMAKE_BUILD_TYPE=Release \\\n         -DUSE_LLVM=ON \\\n         -DLLVM_LIBS=${LLVM_LIBS} \\\n         -G Ninja\nninja -C ../../build\nninja -C ../../build install\n"""]
