[metadata]
lazy_artifacts = false
name = "Tcl"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """if [[ \"${target}\" == *-mingw* ]]; then\n    cd $WORKSPACE/srcdir/tcl*/win/\n    # `make install` calls `tclsh` on Windows\n    apk add tcl\nelse\n    cd $WORKSPACE/srcdir/tcl*/unix/\nfi\n\nFLAGS=()\nif [[ \"${target}\" == x86_64-* ]]; then\n    FLAGS+=(--enable-64bit)\nfi\n./configure --prefix=${prefix} --host=${target} \"${FLAGS[@]}\"\nmake -j${nproc}\nmake install\n# Tk needs private headers\nmake install-private-headers\n\n# Install license file\ninstall_license $WORKSPACE/srcdir/tcl*/license.terms\n"""
version = "v8.6.9"

