name = "Tar"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd"]
script = """cd $WORKSPACE/srcdir/tar-*/\nexport FORCE_UNSAFE_CONFIGURE=1\nconfigure_flags=()\nif [[ ${nbits} == 32 ]]; then\n   # We disable the year 2038 check because we don't have an alternative on the affected systems\n   configure_flags+=(--disable-year2038)\nfi\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} ${configure_flags[@]}\nmake -j${nproc}\nmake install\n"""
version = "v1.35.0"

