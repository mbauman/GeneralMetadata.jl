buildscript = "https://github.com/JuliaPackaging/Yggdrasil/tree/f728798883e8ae2df46cfe8ffd4615cfc8cee54e/T/TulipIndicators/build_tarballs.jl"
metadata_source = "retrospective (by README link)"
metadata_type = "BinaryBuilder --meta-json"
metadata_version = "0.5.5"

[metadata]
augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "TulipIndicators"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """if ! command -v tclsh &> /dev/null\nthen\n\tcd ${host_bindir}\n\tln -s tclsh* tclsh\nfi\ncd $WORKSPACE/srcdir/tulipindicators\nmake tiamalgamation.c\nmkdir -p ${libdir}\ncc -fPIC -shared -Wall -Wextra -Wshadow -Wconversion -std=c99 -pedantic -O2 -g tiamalgamation.c -o ${libdir}/libindicators.${dlext}\n"""
version = "v0.9.1"

    [[metadata.dependencies]]
    compat = ""
    name = "Tcl_jll"
