    type = "hostdependency"
    version-major = 0
    version-minor = 0
    version-patch = 0

    [[metadata.products]]
    dir_paths = []
    dlopen_flags = []
    dont_dlopen = false
    libnames = ["libindicators"]
    type = "lib"
    variable_name = "libindicators"

