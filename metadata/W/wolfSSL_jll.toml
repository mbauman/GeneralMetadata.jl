        script = """macos_sdk_version=10.14\nmacosx_deployment_target=10.14\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    # extract the tarball into the sys-root so all compilers pick it up\n    # automatically, and use --warning=no-unknown-keyword to hide harmless\n    # warnings about unsupported pax header keywords like \"SCHILY.fflags\"\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        --warning=no-unknown-keyword \\\n        MacOSX${macos_sdk_version}.sdk/System \\\n        MacOSX${macos_sdk_version}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd $WORKSPACE/srcdir/wolfssl*\n\n./autogen.sh\n\n# NOTE: some non-x86_64 CPUs support AES-NI as well, but provided assembly seems x86_64-specific\n# NOTE: assembly code has some ELF-specific instructions and doesn't compile for Windows\nif [[ ${target} == x86_64-* ]] && [[ ${target} != *-w64-* ]]; then\n    ARCHFLAGS=\"--enable-aesni --enable-intelasm\"\nelse\n    ARCHFLAGS=\"\"\nfi\nCFLAGS=-DLARGE_STATIC_BUFFERS ./configure \\\n    --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --disable-crypttests \\\n    --disable-examples \\\n    --enable-maxfragment \\\n    $ARCHFLAGS\n\nmake -j${nproc}\nmake install\n\ninstall_license LICENSING\n"""
