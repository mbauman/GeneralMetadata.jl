        ["1.12.0+0".artifact_metadata.metadata]
        augment_platform_block = ""
        init_block = ""
        julia_compat = "1.6"
        lazy_artifacts = false
        name = "HiGHSstatic"
        platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
        script = """BUILD_SHARED=OFF\nBUILD_STATIC=ON\ncd $WORKSPACE/srcdir/HiGHS\n\n# Remove system CMake to use the jll version\napk del cmake\n\nmkdir -p build\ncd build\n\n# Do fully static build only on Windows\nif [[ \"${BUILD_SHARED}\" == \"OFF\" ]] && [[ \"${target}\" == *-mingw* ]]; then\n    export CXXFLAGS=\"-static\"\nfi\n\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_SHARED_LIBS=${BUILD_SHARED} \\\n    -DZLIB_USE_STATIC_LIBS=${BUILD_STATIC} \\\n    -DHIPO=ON \\\n    -DBLAS_LIBRARIES=\"${libdir}/libopenblas.${dlext}\" \\\n    -DMETIS_ROOT=${prefix} \\\n    ..\n\nif [[ \"${target}\" == *-linux-* ]]; then\n        make -j ${nproc}\nelse\n    if [[ \"${target}\" == *-mingw* ]]; then\n        cmake --build . --config Release\n    else\n        cmake --build . --config Release --parallel\n    fi\nfi\nmake install\n\ninstall_license ../LICENSE.txt\n\nif [[ \"${BUILD_SHARED}\" == \"OFF\" ]]; then\n    # Delete the static library to save space\n    rm -r ${prefix}/lib\n    if [[ \"${target}\" == *-mingw* ]]; then\n        # The Windows build ships also GCC runtime, add its license as well\n        install_license /usr/share/licenses/GPL-3.0+\n    fi\nfi\n"""
