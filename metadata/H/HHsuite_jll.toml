        ["3.3.0+0".artifact_metadata.metadata]
        init_block = ""
        julia_compat = "1.6"
        lazy_artifacts = false
        name = "HHsuite"
        platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd"]
        script = """cd ${WORKSPACE}/srcdir/hh-suite-*/\n\n# patch CMakeLists.txt so it doesn't set -march unnecessarily on ARM\natomic_patch -p1 ../patches/arm-simd-march-cmakefile.patch\n\n# macos: use gcc/g++ so we can use openmp\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    CMAKE_TARGET_TOOLCHAIN=\"${CMAKE_TARGET_TOOLCHAIN/%.cmake/_gcc.cmake}\"\n    echo \"[INFO] setting CMAKE_TARGET_TOOLCHAIN = ${CMAKE_TARGET_TOOLCHAIN}\"\nfi\n\nexport CPPFLAGS=\"-I${includedir}\"\nexport LDFLAGS=\"-L${libdir}\"\n\narch_opts=\nif [[ ${target} == x86_64-* ]]; then\n    arch_opts=\"-DHAVE_SSE2=ON -DHAVE_SSE4_1=ON -DHAVE_AVX2=ON\"\nelif [[ ${target} == aarch64-* ]]; then\n    arch_opts=\"-DHAVE_ARM8=ON\"\nelif [[ ${target} == powerpc64le-* ]]; then\n    arch_opts=\"-DHAVE_POWER8=ON -DHAVE_POWER9=ON\"\nfi\n\nmkdir build && cd build\ncmake .. \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DNATIVE_ARCH=OFF \\\n    ${arch_opts}\nmake -j${nproc}\nmake install\n\ninstall_license ../LICENSE\n"""
        version = "v3.3.0"

