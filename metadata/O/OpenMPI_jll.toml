        ["5.0.9+0".artifact_metadata.metadata]
        augment_platform_block = """    using Base.BinaryPlatforms\n    # Can't use Preferences since we might be running this very early with a non-existing Manifest\nMPIPreferences_UUID = Base.UUID(\"3da0fdf6-3ccc-4f1b-acd9-58baa6c99267\")\nconst preferences = Base.get_preferences(MPIPreferences_UUID)\n\n# Keep logic in sync with MPIPreferences.jl\nfunction augment_mpi!(platform)\n    # Doesn't need to be `const` since we depend on MPIPreferences so we\n    # invalidate the cache when it changes.\n    # Note: MPIPreferences uses `Sys.iswindows()` without the `platform` argument.\n    binary = get(preferences, \"binary\", Sys.iswindows(platform) ? \"MicrosoftMPI_jll\" : \"MPICH_jll\")\n\n    abi = if binary == \"system\"\n        let abi = get(preferences, \"abi\", nothing)\n            if abi === nothing\n                error(\"MPIPreferences: Inconsistent state detected, binary set to system, but no ABI set.\")\n            else\n                abi\n            end\n        end\n    elseif binary == \"MicrosoftMPI_jll\"\n        \"MicrosoftMPI\"\n    elseif binary == \"MPICH_jll\"\n        \"MPICH\"\n    elseif binary == \"MPICH_CUDA_jll\"\n        \"MPICH\"\n    elseif binary == \"OpenMPI_jll\"\n        \"OpenMPI\"\n    elseif binary == \"MPItrampoline_jll\"\n        \"MPItrampoline\"\n    else\n        error(\"Unknown binary: $binary\")\n    end\n\n    if !haskey(platform, \"mpi\")\n        platform[\"mpi\"] = abi\n    end\n    return platform\nend\n\n    augment_platform!(platform::Platform) = augment_mpi!(platform)\n"""
        init_block = """ENV[\"OPAL_PREFIX\"] = artifact_dir\n"""
        julia_compat = "1.6"
        lazy_artifacts = true
        name = "OpenMPI"
        platforms = ["x86_64-linux-gnu-libgfortran5-mpi+openmpi", "aarch64-linux-gnu-libgfortran5-mpi+openmpi", "powerpc64le-linux-gnu-libgfortran5-mpi+openmpi", "riscv64-linux-gnu-libgfortran5-mpi+openmpi", "x86_64-linux-musl-libgfortran5-mpi+openmpi", "aarch64-linux-musl-libgfortran5-mpi+openmpi", "x86_64-apple-darwin-libgfortran5-mpi+openmpi", "aarch64-apple-darwin-libgfortran5-mpi+openmpi"]
        script = """################################################################################\n# Install OpenMPI\n################################################################################\n\n# Enter the funzone\ncd ${WORKSPACE}/srcdir/openmpi-*\n\nif [[ \"${target}\" == aarch64-apple-* ]]; then\n    # Build internal `libevent` without `-Wl,--no-undefined`\n    # (taken from `L/libevent/build_tarballs.jl`)\n\n    # Expand libevent tarball so that we can patch it\n    pushd 3rd-party\n    tar xzf libevent-2.1.12-stable-ompi.tar.gz\n    cd libevent-2.1.12-stable-ompi\n    atomic_patch -p1 ${WORKSPACE}/srcdir/patches/build_with_no_undefined.patch\n    popd\nfi\n\n# Autotools doesn't add `${includedir}` as an include directory on some platforms\nexport CPPFLAGS=\"-I${includedir}\"\n\n# The configure scripts doesn't link against `libdl` by itself on many platforms\nexport LIBS='-ldl'\n\n# We use `--enable-script-wrapper-compilers` to turn the compiler\n# wrappers (`mpicc` etc.) into scripts instead of binaries. As scripts,\n# they can be run in a cross-compiling environment, and cmake can\n# infer the MPI options. Otherwise, the MPI options need to be\n# specified manually for OpenMPI to work.\n\n./configure \\\n    --build=${MACHTYPE} \\\n    --enable-mpi-fortran=usempif08 \\\n    --enable-script-wrapper-compilers \\\n    --enable-shared=yes \\\n    --enable-static=no \\\n    --host=${target} \\\n    --prefix=${prefix} \\\n    --docdir=/tmp \\\n    --infodir=/tmp \\\n    --mandir=/tmp \\\n    --with-cross=${WORKSPACE}/srcdir/files/${target} \\\n    --with-libevent=internal \\\n    --without-cs-fs\n\n# Build the library\nmake -j${nproc}\n\n# Install the library\nmake install\n\n################################################################################\n# Install licenses\n################################################################################\n\ninstall_license $WORKSPACE/srcdir/openmpi*/LICENSE\n"""
