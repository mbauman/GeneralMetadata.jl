86-linux-gnu-cxx03-julia_version+1.11.1", "i686-linux-gnu-cxx11-julia_version+1.11.1", "x86_64-linux-gnu-cxx03-julia_version+1.11.1", "x86_64-linux-gnu-cxx11-julia_version+1.11.1", "aarch64-linux-gnu-cxx03-julia_version+1.11.1", "aarch64-linux-gnu-cxx11-julia_version+1.11.1", "powerpc64le-linux-gnu-cxx03-julia_version+1.11.1", "powerpc64le-linux-gnu-cxx11-julia_version+1.11.1", "x86_64-apple-darwin-julia_version+1.11.1", "aarch64-apple-darwin-julia_version+1.11.1", "x86_64-unknown-freebsd-julia_version+1.11.1", "i686-w64-mingw32-cxx03-julia_version+1.11.1", "i686-w64-mingw32-cxx11-julia_version+1.11.1", "x86_64-w64-mingw32-cxx03-julia_version+1.11.1", "x86_64-w64-mingw32-cxx11-julia_version+1.11.1", "i686-linux-gnu-cxx03-julia_version+1.12.0", "i686-linux-gnu-cxx11-julia_version+1.12.0", "x86_64-linux-gnu-cxx03-julia_version+1.12.0", "x86_64-linux-gnu-cxx11-julia_version+1.12.0", "aarch64-linux-gnu-cxx03-julia_version+1.12.0", "aarch64-linux-gnu-cxx11-julia_version+1.12.0", "powerpc64le-linux-gnu-cxx03-julia_version+1.12.0", "powerpc64le-linux-gnu-cxx11-julia_version+1.12.0", "x86_64-apple-darwin-julia_version+1.12.0", "aarch64-apple-darwin-julia_version+1.12.0", "x86_64-unknown-freebsd-julia_version+1.12.0", "i686-w64-mingw32-cxx03-julia_version+1.12.0", "i686-w64-mingw32-cxx11-julia_version+1.12.0", "x86_64-w64-mingw32-cxx03-julia_version+1.12.0", "x86_64-w64-mingw32-cxx11-julia_version+1.12.0"]
        script = """cd $WORKSPACE/srcdir\n\n# Apply patch for BB specific CMake changes\ncd opencv_contrib\ngit apply ../patches/opencv-julia-cmake.patch\ngit apply ../patches/opencv-julia-code.patch\ncd ..\n\nmkdir build && cd build\nexport USE_QT=\"ON\"\n\n# Patch a minor clang issue\nif [[ \"${target}\" == *-apple-* ]] || [[ \"${target}\" == *-freebsd* ]]; then\n    atomic_patch -p1 -d../opencv ../patches/atomic_fix.patch\nfi\n\nif [[ \"${target}\" == *-apple-* ]]; then\n    # Newer SDK for recent video codecs\n    if [[ \"${target}\" == x86_64-apple-* ]]; then\n        export MACOSX_DEPLOYMENT_TARGET=10.13 \n        pushd ${WORKSPACE}/srcdir/MacOSX10.*.sdk \n        rm -rf /opt/${target}/${target}/sys-root/System \n        cp -a usr/* \"/opt/${target}/${target}/sys-root/usr/\" \n        cp -a System \"/opt/${target}/${target}/sys-root/\" \n        popd\n    fi\n    # We want to use OpenBLAS over Accelerate framework...\n    export OpenBLAS_HOME=${prefix}\n    export CXXFLAGS=\"\"\n    # ...but we also need to rename quite a few symbols\n    for symbol in sgemm dgemm cgemm zgemm; do\n        # Rename CBLAS symbols for ILP64\n        CXXFLAGS=\"${CXXFLAGS} -Dcblas_${symbol}=cblas_${symbol}64_\"\n    done\n    for symbol in sgesv_ sposv_ spotrf_ sgesdd_ sgeqrf_ sgels_ dgeqrf_ dgesdd_ sgetrf_ dgesv_ dposv_ dgels_ dgetrf_ dpotrf_ dgeev_; do\n        # Rename LAPACK symbols for ILP64\n        CXXFLAGS=\"${CXXFLAGS} -D${symbol}=${symbol}64_\"\n    done\n    # Apply patch to help CMake find our 64-bit OpenBLAS\n    atomic_patch -p1 -d../opencv ../patches/find-openblas64.patch\n\n    # Disable QT\n    export USE_QT=\"OFF\"\nelif [[ \"${target}\" == *-w64-* ]]; then\n    # Needed for mingw compilation of big files\n    export CXXFLAGS=\"-Wa,-mbig-obj\"\n    export USE_QT=\"OFF\"\nfi\n\ncmake -DCMAKE_FIND_ROOT_PATH=${prefix} \\\n      -DJulia_PREFIX=${prefix} \\\n      -DWITH_JULIA=ON \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DCMAKE_CXX_STANDARD=11 \\\n      -DBUILD_TESTS=OFF \\\n      -DBUILD_PERF_TESTS=OFF \\\n      -DBUILD_EXAMPLES=OFF \\\n      -DHAVE_CXX_FVISIBILITY_HIDDEN=OFF \\\n      -DHAVE_CXX_FVISIBILITY_INLINES_HIDDEN=OFF \\\n      -DWITH_QT=${USE_QT} \\\n      -DOPENCV_EXTRA_MODULES_PATH=../opencv_contrib/modules \\\n      -DBUILD_LIST=core,imgproc,imgcodecs,highgui,videoio,dnn,features2d,objdetect,calib3d,video,gapi,stitching,julia \\\n      ../opencv/\n\nmake -j${nproc}\nmake install\n\n# Install also libopencv_julia\ncp lib/libopencv_julia.* ${libdir}/.\n\n# Move julia bindings to the prefix\ncp -R OpenCV ${prefix}\n\ninstall_license ../opencv/{LICENSE,COPYRIGHT}\n"""
