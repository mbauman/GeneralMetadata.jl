        augment_platform_block = """    using Base.BinaryPlatforms\n        # Can't use Preferences since we might be running this very early with a non-existing Manifest\n    MPIPreferences_UUID = Base.UUID(\"3da0fdf6-3ccc-4f1b-acd9-58baa6c99267\")\n    const preferences = Base.get_preferences(MPIPreferences_UUID)\n\n    # Keep logic in sync with MPIPreferences.jl\n    function augment_mpi!(platform)\n        # Doesn't need to be `const` since we depend on MPIPreferences so we\n        # invalidate the cache when it changes.\n        binary = get(preferences, \"binary\", Sys.iswindows() ? \"MicrosoftMPI_jll\" : \"MPICH_jll\")\n\n        abi = if binary == \"system\"\n            let abi = get(preferences, \"abi\", nothing)\n                if abi === nothing\n                    error(\"MPIPreferences: Inconsistent state detected, binary set to system, but no ABI set.\")\n                else\n                    abi\n                end\n            end\n        elseif binary == \"MicrosoftMPI_jll\"\n            \"MicrosoftMPI\"\n        elseif binary == \"MPICH_jll\"\n            \"MPICH\"\n        elseif binary == \"OpenMPI_jll\"\n            \"OpenMPI\"\n        elseif binary == \"MPItrampoline_jll\"\n            \"MPItrampoline\"\n        else\n            error(\"Unknown binary: $binary\")\n        end\n\n        if !haskey(platform, \"mpi\")\n            platform[\"mpi\"] = abi\n        end\n        return platform\n    end\n\n    augment_platform!(platform::Platform) = augment_mpi!(platform)\n"""
        init_block = ""
        julia_compat = "1.6"
        lazy_artifacts = true
        name = "OpenFOAM"
        platforms = ["x86_64-linux-gnu-cxx03-mpi+mpich", "x86_64-linux-gnu-cxx11-mpi+mpich", "x86_64-linux-gnu-cxx03-mpi+openmpi", "x86_64-linux-gnu-cxx11-mpi+openmpi", "x86_64-linux-gnu-cxx03-mpi+mpitrampoline", "x86_64-linux-gnu-cxx11-mpi+mpitrampoline"]
        script = """SCOTCH_VERSION=6.1.0\ncd ${WORKSPACE}/srcdir/OpenFOAM*\natomic_patch -p1 ../patches/etc-bashrc.patch\n\n# Set rpath-link in all C/C++ compilers\nLDFLAGS=\"\"\nfor dir in \"\" \"/dummy\" \"/mpi-system\"; do\n    LDFLAGS=\"${LDFLAGS} -Wl,-rpath-link=${PWD}/platforms/linux64GccDPInt32Opt/lib${dir}\"\ndone\nsed -i \"s?-m64?-m64 ${LDFLAGS}?g\" wmake/rules/*/c*\n\n# Set version of Scotch\necho \"export SCOTCH_VERSION=${SCOTCH_VERSION}\" > etc/config.sh/scotch\necho \"export SCOTCH_ARCH_PATH=${prefix}\"      >> etc/config.sh/scotch\n\n# Set up to use our MPI\nsed -i 's/WM_MPLIB=SYSTEMOPENMPI/WM_MPLIB=SYSTEMMPI/g' etc/bashrc\nexport MPI_ROOT=\"${prefix}\"\nexport MPI_ARCH_FLAGS=\"\"\nexport MPI_ARCH_INC=\"-I${includedir}\"\nif grep -q MPICH_NAME $prefix/include/mpi.h; then\n    export MPI_ARCH_LIBS=\"-L${libdir} -lmpi\"\nelif grep -q MPItrampoline $prefix/include/mpi.h; then\n    export MPI_ARCH_LIBS=\"-L${libdir} -lmpitrampoline\"\nelif grep -q OMPI_MAJOR_VERSION $prefix/include/mpi.h; then\n    export MPI_ARCH_LIBS=\"-L${libdir} -lmpi\"\nfi\n\n# Set up the environment.  Note, this script may internally have some failing command, which\n# would spring our traps, so we have to allow failures, sigh\nsource etc/bashrc || true\n\n# Build!\n./Allwmake -j${nproc}\n\n# Highly advanced installation process (inspired by Debian:\n# https://salsa.debian.org/science-team/openfoam/-/tree/master/debian)\nmkdir -p \"${libdir}\" \"${bindir}\" \"${prefix}/share/openfoam\"\ncp platforms/linux64GccDPInt32Opt/lib/{,dummy/,mpi-system/}*.${dlext}* \"${libdir}/.\"\ncp platforms/linux64GccDPInt32Opt/bin/* \"${bindir}/.\"\ncp -r etc/ \"${prefix}/share/openfoam/.\"\n"""
