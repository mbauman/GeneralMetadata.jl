        name = "OpenSSL"
        platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
        script = """cd $WORKSPACE/srcdir/openssl-*/\n\n# This build system does not like llvm-ranlib\nif [[ ${target} == *darwin* ]]; then\n    export RANLIB=/opt/${target}/bin/${target}-ranlib\nfi\n\n# Manual translation of BB $target to Configure-target, see `./Configure --help`\nfunction translate_target()\n{\n    if [[ ${target} == x86_64-linux* ]]; then\n        echo linux-x86_64\n    elif [[ ${target} == i686-linux* ]]; then\n        echo linux-x86\n    elif [[ ${target} == arm-linux* ]]; then\n        echo linux-armv4\n    elif [[ ${target} == aarch64-linux* ]]; then\n        echo linux-aarch64\n    elif [[ ${target} == powerpc64le-linux* ]]; then\n        echo linux-ppc64le\n    elif [[ ${target} == x86_64-apple-darwin* ]]; then\n        echo darwin64-x86_64-cc\n    elif [[ ${target} == aarch64-apple-darwin* ]]; then\n        echo darwin64-arm64-cc\n    elif [[ ${target} == x86_64-unknown-freebsd* ]]; then\n        echo BSD-x86_64\n    elif [[ ${target} == x86_64*mingw* ]]; then\n        echo mingw64\n    elif [[ ${target} == i686*mingw* ]]; then\n        echo mingw\n    else\n        if [[ ${nbits} == 32 ]]; then\n            echo linux-generic32\n        else\n            echo linux-generic64\n        fi\n    fi\n}\n\n./Configure shared --prefix=$prefix $(translate_target)\nmake -j${nproc}\nmake install_sw\n"""
        version = "v1.1.17"

