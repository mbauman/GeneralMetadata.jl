rpc64le-linux-gnu-cxx03-julia_version+1.9.0-mpi+mpitrampoline", "powerpc64le-linux-gnu-cxx11-julia_version+1.9.0-mpi+mpitrampoline", "x86_64-apple-darwin-julia_version+1.9.0-mpi+mpitrampoline", "aarch64-apple-darwin-julia_version+1.9.0-mpi+mpitrampoline", "i686-linux-gnu-cxx03-julia_version+1.10.0-mpi+mpitrampoline", "i686-linux-gnu-cxx11-julia_version+1.10.0-mpi+mpitrampoline", "x86_64-linux-gnu-cxx03-julia_version+1.10.0-mpi+mpitrampoline", "x86_64-linux-gnu-cxx11-julia_version+1.10.0-mpi+mpitrampoline", "aarch64-linux-gnu-cxx03-julia_version+1.10.0-mpi+mpitrampoline", "aarch64-linux-gnu-cxx11-julia_version+1.10.0-mpi+mpitrampoline", "powerpc64le-linux-gnu-cxx03-julia_version+1.10.0-mpi+mpitrampoline", "powerpc64le-linux-gnu-cxx11-julia_version+1.10.0-mpi+mpitrampoline", "x86_64-apple-darwin-julia_version+1.10.0-mpi+mpitrampoline", "aarch64-apple-darwin-julia_version+1.10.0-mpi+mpitrampoline"]
        script = """# Log which MPI implementation is actually used\ngrep -iq MPICH ${includedir}/mpi.h && echo 'MPI: MPICH'\ngrep -iq MPItrampoline ${includedir}/mpi.h && echo 'MPI: MPItrampoline'\ngrep -iq MSMPI_VER ${includedir}/mpi.h && echo 'MPI: MicrosoftMPI'\ngrep -iq OpenMPI ${includedir}/mpi.h && echo 'MPI: OpenMPI'\n\ncd ${WORKSPACE}/srcdir\ncd openPMD-api\n\nmkdir build\ncd build\n\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    # Work around the issue\n    #     /workspace/srcdir/SHOT/src/Model/../Model/Simplifications.h:1370:26: error: 'value' is unavailable: introduced in macOS 10.14\n    #                     optional.value()->coefficient *= -1.0;\n    #                              ^\n    #     /opt/x86_64-apple-darwin14/x86_64-apple-darwin14/sys-root/usr/include/c++/v1/optional:947:27: note: 'value' has been explicitly marked unavailable here\n    #         constexpr value_type& value() &\n    #                               ^\n    export MACOSX_DEPLOYMENT_TARGET=10.15\n    # ...and install a newer SDK which supports `std::filesystem`\n    pushd ${WORKSPACE}/srcdir/MacOSX10.*.sdk\n    rm -rf /opt/${target}/${target}/sys-root/System\n    cp -a usr/* \"/opt/${target}/${target}/sys-root/usr/\"\n    cp -a System \"/opt/${target}/${target}/sys-root/\"\n    popd\nfi\n\narchopts=()\nif [[ \"${target}\" == x86_64-w64-mingw32 ]]; then\n    # Microsoft MPI\n    archopts+=(\n        -DMPI_C_ADDITIONAL_INCLUDE_DIRS=\n        -DMPI_C_LIBRARIES=${libdir}/msmpi.dll\n        -DMPI_CXX_ADDITIONAL_INCLUDE_DIRS=\n        -DMPI_CXX_LIBRARIES=${libdir}/msmpi.dll)\nfi\nif [[ \"${target}\" == *-mingw32 ]]; then\n    # Windows\n    archopts+=(-DopenPMD_USE_HDF5=OFF)\nelse\n    archopts+=(-DopenPMD_USE_HDF5=ON)\nfi\n\ncmake \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_FIND_ROOT_PATH=${prefix} \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DBUILD_CLI_TOOLS=OFF \\\n    -DBUILD_EXAMPLES=OFF \\\n    -DBUILD_TESTING=OFF \\\n    -DJulia_PREFIX=${prefix} \\\n    -DopenPMD_USE_Julia=ON \\\n    -DopenPMD_USE_MPI=ON \\\n    -DMPI_HOME=${prefix} \\\n    ${archopts[@]} \\\n    ..\n\ncmake --build . --config RelWithDebInfo --parallel ${nproc}\ncmake --build . --config RelWithDebInfo --parallel ${nproc} --target install\ninstall_license ../COPYING*\n"""
        version = "v0.16.0"

