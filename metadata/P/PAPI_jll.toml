        ["7.0.0+2".artifact_metadata.metadata]
        augment_platform_block = """using Base.BinaryPlatforms\n\ntry\n    using CUDA_Runtime_jll\ncatch\n    # during initial package installation, CUDA_Runtime_jll may not be available.\n    # in that case, we just won't select an artifact.\nend\n\nfunction cuda_comparison_strategy(a::String, b::String, a_requested::Bool, b_requested::Bool)\n    if a == \"none\" || b == \"none\"\n        return a == b\n    end\n    if a == \"local\" || b == \"local\"\n        return a == b\n    end\n    a = VersionNumber(a)\n    b = VersionNumber(b)\n\n    # If both b and a requested, then we fall back to equality:\n    if a_requested && b_requested\n        return Base.thisminor(a) == Base.thisminor(b)\n    end\n\n    # Otherwise, do the comparison between the the single version cap and the single version:\n    function is_compatible(artifact::VersionNumber, host::VersionNumber)\n        if host >= v\"11.0\"\n            # enhanced compatibility, semver-style\n            artifact.major == host.major &&\n            Base.thisminor(artifact) <= Base.thisminor(host)\n        else\n            Base.thisminor(artifact) == Base.thisminor(host)\n        end\n    end\n    if a_requested\n        is_compatible(b, a)\n    else\n        is_compatible(a, b)\n    end\nend\n\nfunction augment_platform!(platform::Platform)\n    if !@isdefined(CUDA_Runtime_jll)\n        # don't set to nothing or Pkg will download any artifact\n        platform[\"cuda\"] = \"none\"\n    end\n\n    if !haskey(platform, \"cuda\")\n        CUDA_Runtime_jll.augment_platform!(platform)\n    end\n    BinaryPlatforms.set_compare_strategy!(platform, \"cuda\", cuda_comparison_strategy)\n    return platform\nend"""
        init_block = ""
        julia_compat = "1.6"
        lazy_artifacts = true
        name = "PAPI"
        platforms = ["x86_64-linux-gnu-cuda+10.2", "powerpc64le-linux-gnu-cuda+10.2", "x86_64-linux-gnu-cuda+11.0", "x86_64-linux-gnu-cuda+none", "aarch64-linux-gnu-cuda+none", "armv7l-linux-gnueabihf-cuda+none", "powerpc64le-linux-gnu-cuda+none", "x86_64-linux-musl-cuda+none", "aarch64-linux-musl-cuda+none", "armv7l-linux-musleabihf-cuda+none"]
        script = """cd $WORKSPACE/srcdir/papi\n\n# Apply all our patches\nif [ -d $WORKSPACE/srcdir/patches ]; then\nfor f in $WORKSPACE/srcdir/patches/*.patch; do\n    echo \"Applying patch ${f}\"\n    atomic_patch -p1 ${f}\ndone\nfi\n\ncd src\nif [[ \"${target}\" == *-musl* ]]; then\n    CFLAGS=\"-D_GNU_SOURCE\"\nfi\n\nCOMPONENTS=()\nif [[ -d \"${prefix}/cuda\" ]]; then\n    export PAPI_CUDA_ROOT=\"${prefix}/cuda\"\n    COMPONENTS+=(cuda nvml)\nfi\n\nif [[ ${target} == powerpc64le-* ]]; then\n  CPU=POWER8\nelif [[ ${target} == x86_64-* || ${target} == i686-* ]]; then\n  CPU=x86\nelse\n  CPU=arm\nfi\n\necho \"Building components: ${COMPONENTS[@]}\"\nexport CFLAGS\nbash ./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} \\\n    --with-ffsll \\\n    --with-perf-events \\\n    --with-walltimer=gettimeofday \\\n    --with-tls=__thread \\\n    --with-virtualtimer=times \\\n    --with-shared-lib \\\n    --with-nativecc=${CC_FOR_BUILD} \\\n    --with-components=\"${COMPONENTS[@]}\" \\\n    --with-CPU=\"${CPU}\"\n\nmake -j ${nproc}\nmake install\n"""
