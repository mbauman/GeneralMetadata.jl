        script = """cd $WORKSPACE/srcdir/papi\n\n# Apply all our patches\nif [ -d $WORKSPACE/srcdir/patches ]; then\nfor f in $WORKSPACE/srcdir/patches/*.patch; do\n    echo \"Applying patch ${f}\"\n    atomic_patch -p1 ${f}\ndone\nfi\n\ncd src\nif [[ \"${target}\" == *-musl* ]]; then\n    CFLAGS=\"-D_GNU_SOURCE\"\nfi\n\nCOMPONENTS=()\nif [[ -d \"${prefix}/cuda\" ]]; then\n    COMPONENTS+=(cuda)\n    export PAPI_CUDA_ROOT=\"${prefix}/cuda\"\nfi\n\nif [[ ${target} == powerpc64le-* ]]; then\n  CPU=POWER8\nelif [[ ${target} == x86_64-* || ${target} == i686-* ]]; then\n  CPU=x86\nelse\n  CPU=arm\nfi\n\necho \"Building components: ${COMPONENTS[@]}\"\nexport CFLAGS\nbash ./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} \\\n    --with-ffsll \\\n    --with-perf-events \\\n    --with-walltimer=gettimeofday \\\n    --with-tls=__thread \\\n    --with-virtualtimer=times \\\n    --with-shared-lib \\\n    --with-nativecc=${CC_FOR_BUILD} \\\n    --with-components=\"${COMPONENTS[@]}\" \\\n    --with-CPU=\"${CPU}\"\n\nmake -j ${nproc}\nmake install\n"""
        version = "v7.1.0"

