        ["2.8.1+2".artifact_metadata.metadata]
        augment_platform_block = """    using Base.BinaryPlatforms\n    # Can't use Preferences since we might be running this very early with a non-existing Manifest\nMPIPreferences_UUID = Base.UUID(\"3da0fdf6-3ccc-4f1b-acd9-58baa6c99267\")\nconst preferences = Base.get_preferences(MPIPreferences_UUID)\n\n# Keep logic in sync with MPIPreferences.jl\nfunction augment_mpi!(platform)\n    # Doesn't need to be `const` since we depend on MPIPreferences so we\n    # invalidate the cache when it changes.\n    binary = get(preferences, \"binary\", Sys.iswindows() ? \"MicrosoftMPI_jll\" : \"MPICH_jll\")\n\n    abi = if binary == \"system\"\n        let abi = get(preferences, \"abi\", nothing)\n            if abi === nothing\n                error(\"MPIPreferences: Inconsistent state detected, binary set to system, but no ABI set.\")\n            else\n                abi\n            end\n        end\n    elseif binary == \"MicrosoftMPI_jll\"\n        \"MicrosoftMPI\"\n    elseif binary == \"MPICH_jll\"\n        \"MPICH\"\n    elseif binary == \"OpenMPI_jll\"\n        \"OpenMPI\"\n    elseif binary == \"MPItrampoline_jll\"\n        \"MPItrampoline\"\n    else\n        error(\"Unknown binary: $binary\")\n    end\n\n    if !haskey(platform, \"mpi\")\n        platform[\"mpi\"] = abi\n    end\n    return platform\nend\n\n    augment_platform!(platform::Platform) = augment_mpi!(platform)\n"""
        init_block = ""
        julia_compat = "1.6"
        lazy_artifacts = true
        name = "P4est"
        platforms = ["i686-linux-gnu-mpi+mpich", "x86_64-linux-gnu-mpi+mpich", "aarch64-linux-gnu-mpi+mpich", "armv6l-linux-gnueabihf-mpi+mpich", "armv7l-linux-gnueabihf-mpi+mpich", "powerpc64le-linux-gnu-mpi+mpich", "i686-linux-musl-mpi+mpich", "x86_64-linux-musl-mpi+mpich", "aarch64-linux-musl-mpi+mpich", "armv6l-linux-musleabihf-mpi+mpich", "armv7l-linux-musleabihf-mpi+mpich", "x86_64-apple-darwin-mpi+mpich", "aarch64-apple-darwin-mpi+mpich", "x86_64-unknown-freebsd-mpi+mpich", "x86_64-w64-mingw32-mpi+microsoftmpi", "i686-linux-gnu-mpi+mpitrampoline", "x86_64-linux-gnu-mpi+mpitrampoline", "aarch64-linux-gnu-mpi+mpitrampoline", "armv6l-linux-gnueabihf-mpi+mpitrampoline", "armv7l-linux-gnueabihf-mpi+mpitrampoline", "powerpc64le-linux-gnu-mpi+mpitrampoline", "x86_64-apple-darwin-mpi+mpitrampoline", "aarch64-apple-darwin-mpi+mpitrampoline"]
        script = """cd p4est-*\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/mpi-constants.patch\"\n\nif [[ \"${target}\" == *-freebsd* ]]; then\n  export LIBS=\"-lm\"\nelif [[ \"${target}\" == x86_64-linux-musl ]]; then\n  # We can't run Fortran programs for the native platform, so a check that the\n  # Fortran compiler works would fail.  Small hack: swear that we're\n  # cross-compiling.  See:\n  # https://github.com/JuliaPackaging/BinaryBuilderBase.jl/issues/50.\n  sed -i 's/cross_compiling=no/cross_compiling=yes/' configure\n  sed -i 's/cross_compiling=no/cross_compiling=yes/' sc/configure\nfi\n\n# Set default preprocessor and linker flags\nexport CPPFLAGS=\"-I${includedir}\"\nexport LDFLAGS=\"-L${libdir}\"\n\n# Special Windows treatment\nFLAGS=()\nif [[ \"${target}\" == *-mingw* ]]; then\n  # Set linker flags only at build time (see https://docs.binarybuilder.org/v0.3/troubleshooting/#Windows)\n  FLAGS+=(LDFLAGS=\"$LDFLAGS -no-undefined\")\n  # Configure does not find the correct Fortran compiler\n  export F77=\"f77\"\n  # Link against ws2_32 to use the htonl function from winsock2.h\n  export LIBS=\"-lmsmpi -lws2_32\"\n  # Disable MPI I/O on Windows since it causes p4est to crash\n  mpiopts=\"--enable-mpi --disable-mpiio\"\n  # Linker looks for libmsmpi instead of msmpi, copy existing symlink\n  cp -d ${libdir}/msmpi.dll ${libdir}/libmsmpi.dll\nelse\n  # Use MPI including MPI I/O on all other platforms\n  export CC=\"mpicc\"\n  export CXX=\"mpic++\"\n  mpiopts=\"--enable-mpi\"\nfi\n\n# Configure, build, install\n# Note: BLAS is disabled since it is only needed for SC if it is used outside of p4est\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} --disable-static --without-blas ${mpiopts}\nmake -j${nproc} \"${FLAGS[@]}\"\nmake install\n"""
