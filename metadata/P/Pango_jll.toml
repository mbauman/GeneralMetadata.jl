        ["1.57.0+0".artifact_metadata.metadata]
        augment_platform_block = ""
        init_block = ""
        julia_compat = "1.6"
        lazy_artifacts = false
        name = "Pango"
        platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
        script = """\napk add glib-dev\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    cd $WORKSPACE/srcdir/mingw*/mingw-w64-headers\n    ./configure --prefix=/opt/$target/$target/sys-root --enable-sdk=all --host=$target\n    make install\n\n    cd ../mingw-w64-crt/\n    if [ ${target} == \"i686-w64-mingw32\" ]; then\n        _crt_configure_args=\"--disable-lib64 --enable-lib32\"\n    elif [ ${target} == \"x86_64-w64-mingw32\" ]; then\n        _crt_configure_args=\"--disable-lib32 --enable-lib64\"\n    fi\n    ./configure --prefix=/opt/$target/$target/sys-root --enable-sdk=all --host=$target --enable-wildcard ${_crt_configure_args}\n    make -j${nproc}\n    make install\nfi\n\ncd $WORKSPACE/srcdir/pango*\n\nif [[ \"${target}\" == \"${MACHTYPE}\" ]]; then\n    # When building for the host platform, the system libexpat is picked up\n    rm /usr/lib/libexpat.so*\nfi\n\n# If we want libpangoft2 on Windows we need to explicitly enable fontconfig and freetype\n# See <https://gitlab.gnome.org/GNOME/pango/-/blob/main/README.win32.md>.\n\n# We need to update pip\npython3 -m pip install --upgrade pip setuptools wheel\npip3 install gi-docgen\n# We need a newer meson\npython3 -m pip install --upgrade meson\n\nmkdir build && cd build\nmeson --cross-file=\"${MESON_TARGET_TOOLCHAIN}\" \\\n    -Dintrospection=disabled \\\n    -Dfontconfig=enabled \\\n    -Dfreetype=enabled \\\n    ..\nninja -j${nproc}\nninja install\n\ninstall_license ../COPYING\n"""
        version = "v1.57.0"

