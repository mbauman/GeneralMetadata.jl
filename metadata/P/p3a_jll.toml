        ["1.0.2+0".artifact_metadata.metadata]
        init_block = ""
        julia_compat = "1.6"
        lazy_artifacts = false
        name = "p3a"
        platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11", "aarch64-apple-darwin"]
        script = """cd $WORKSPACE/srcdir/p3a/\nmkdir build && cd build\n\nCMAKE_FLAGS=()\n\n#help find mpi on mingw, subset of https://github.com/JuliaPackaging/Yggdrasil/blob/b4fdb545c3954cff218051d7520c7418991d3416/T/TauDEM/build_tarballs.jl#L28-L53\nif [[ \"$target\" == x86_64-w64-mingw32 ]]; then\n    CMAKE_FLAGS+=(\n        -DMPI_HOME=${prefix}\n        -DMPI_GUESS_LIBRARY_NAME=MSMPI\n        -DMPI_C_LIBRARIES=msmpi64\n        -DMPI_CXX_LIBRARIES=msmpi64\n    )\nelif [[ ${target} == *-apple-* ]]; then\n    CMAKE_FLAGS+=(\n        -DMPI_C_ADDITIONAL_INCLUDE_DIRS='' \n        -DMPI_C_LIBRARIES='-Wl,-flat_namespace;-Wl,-commons,use_dylibs;-lmpi;-lpmpi' \n        -DMPI_CXX_ADDITIONAL_INCLUDE_DIRS='' \n        -DMPI_CXX_LIBRARIES='-Wl,-flat_namespace;-Wl,-commons,use_dylibs;-lmpi;-lpmpi'\n    )\nfi\n\ncmake .. \\\n-DCMAKE_INSTALL_PREFIX=$prefix \\\n-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n-DCMAKE_BUILD_TYPE=Release \\\n-DBUILD_TESTING=OFF \\\n-DBUILD_SHARED_LIBS=ON \\\n-DKokkos_COMPILE_LANGUAGE=CXX \\\n\"${CMAKE_FLAGS[@]}\"\n\nmake -j${nproc}\nmake install\n\n"""
        version = "v1.0.2"

