        init_block = ""
        julia_compat = "1.6"
        lazy_artifacts = false
        name = "MPICH"
        platforms = ["i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran3", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "armv7l-linux-gnueabihf-libgfortran3", "armv7l-linux-gnueabihf-libgfortran4", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran3", "powerpc64le-linux-gnu-libgfortran4", "powerpc64le-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran3", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran3", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran3", "aarch64-linux-musl-libgfortran4", "aarch64-linux-musl-libgfortran5", "armv7l-linux-musleabihf-libgfortran3", "armv7l-linux-musleabihf-libgfortran4", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin-libgfortran3", "x86_64-apple-darwin-libgfortran4", "x86_64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran3", "x86_64-unknown-freebsd-libgfortran4", "x86_64-unknown-freebsd-libgfortran5", "aarch64-apple-darwin-libgfortran5", "armv6l-linux-gnueabihf-libgfortran3", "armv6l-linux-gnueabihf-libgfortran4", "armv6l-linux-gnueabihf-libgfortran5", "armv6l-linux-musleabihf-libgfortran3", "armv6l-linux-musleabihf-libgfortran4", "armv6l-linux-musleabihf-libgfortran5"]
        script = """################################################################################\n# Install MPICH\n################################################################################\n\n# Enter the funzone\ncd ${WORKSPACE}/srcdir/mpich*\n\nEXTRA_FLAGS=()\nif [[ \"${target}\" != i686-linux-gnu ]] || [[ \"${target}\" != x86_64-linux-* ]]; then\n    # Define some obscure undocumented variables needed for cross compilation of\n    # the Fortran bindings.  See for example\n    # * https://stackoverflow.com/q/56759636/2442087\n    # * https://github.com/pmodels/mpich/blob/d10400d7a8238dc3c8464184238202ecacfb53c7/doc/installguide/cfile\n    export CROSS_F77_SIZEOF_INTEGER=4\n    export CROSS_F77_TRUE_VALUE=1\n    export CROSS_F77_FALSE_VALUE=0\n\n    export CROSS_F90_ADDRESS_KIND=8\n    export CROSS_F90_OFFSET_KIND=8\n    export CROSS_F90_INTEGER_KIND=4\n    export CROSS_F90_DOUBLE_MODEL=15,307\n    export CROSS_F90_REAL_MODEL=6,37\n\n    if [[ \"${target}\" == i686-linux-musl ]]; then\n        # Our `i686-linux-musl` platform is a bit rotten: it can run C programs,\n        # but not C++ or Fortran.  `configure` runs a C program to determine\n        # whether it's cross-compiling or not, but when it comes to running\n        # Fortran programs, it fails.  In addition, `configure` ignores the\n        # above exported variables if it believes it's doing a native build.\n        # Small hack: edit `configure` script to force `cross_compiling` to be\n        # always \"yes\".\n        sed -i 's/cross_compiling=no/cross_compiling=yes/g' configure\n        EXTRA_FLAGS+=(ac_cv_sizeof_bool=\"1\")\n    fi\nfi\n\nif [[ \"${target}\" == aarch64-apple-* ]]; then\n    export FFLAGS=-fallow-argument-mismatch\nfi\n\n./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} \\\n    --enable-shared=yes --enable-static=no \\\n    --with-device=ch3 --disable-dependency-tracking \\\n    --docdir=/tmp \\\n    \"${EXTRA_FLAGS[@]}\"\n\n# Remove empty `-l` flags from libtool\n# (Why are they there? They should not be.)\n# Run the command several times to handle multiple (overlapping) occurrences.\nsed -i 's/\"-l /\"/g;s/ -l / /g;s/-l\"/\"/g' libtool\nsed -i 's/\"-l /\"/g;s/ -l / /g;s/-l\"/\"/g' libtool\nsed -i 's/\"-l /\"/g;s/ -l / /g;s/-l\"/\"/g' libtool\n\n# Build the library\nmake -j${nproc}\n\n# Install the library\nmake install\n\n################################################################################\n# Install MPIconstants\n################################################################################\n\ncd ${WORKSPACE}/srcdir/MPIconstants*\nmkdir build\ncd build\n# Yes, this is tedious. No, without being this explicit, cmake will\n# not properly auto-detect the MPI libraries.\nif [ -f ${prefix}/lib/libpmpi.${dlext} ]; then\n    cmake \\\n        -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n        -DCMAKE_FIND_ROOT_PATH=${prefix} \\\n        -DCMAKE_INSTALL_PREFIX=${prefix} \\\n        -DBUILD_SHARED_LIBS=ON \\\n        -DMPI_C_COMPILER=cc \\\n        -DMPI_C_LIB_NAMES='mpi;pmpi' \\\n        -DMPI_mpi_LIBRARY=${prefix}/lib/libmpi.${dlext} \\\n        -DMPI_pmpi_LIBRARY=${prefix}/lib/libpmpi.${dlext} \\\n        ..\nelse\n    cmake \\\n        -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n        -DCMAKE_FIND_ROOT_PATH=${prefix} \\\n        -DCMAKE_INSTALL_PREFIX=${prefix} \\\n        -DBUILD_SHARED_LIBS=ON \\\n        -DMPI_C_COMPILER=cc \\\n        -DMPI_C_LIB_NAMES='mpi' \\\n        -DMPI_mpi_LIBRARY=${prefix}/lib/libmpi.${dlext} \\\n        ..\nfi\n\ncmake --build . --config RelWithDebInfo --parallel $nproc\ncmake --build . --config RelWithDebInfo --parallel $nproc --target install\n\n################################################################################\n# Install licenses\n################################################################################\n\ninstall_license $WORKSPACE/srcdir/mpich*/COPYRIGHT $WORKSPACE/srcdir/MPIconstants-*/LICENSE.md\n"""
        version = "v3.4.2"

