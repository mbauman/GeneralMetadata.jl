        name = "MAGMA"
        platforms = ["x86_64-linux-gnu-cxx03-cuda+11.3", "x86_64-linux-gnu-cxx11-cuda+11.3"]
        script = """cd $WORKSPACE/srcdir/magma*\n\nexport CUDADIR=${WORKSPACE}/destdir/cuda\nexport PATH=${PATH}:${CUDADIR}\ncp ../make.inc .\n# reduce parallelism since otherwise the builder may OOM.\n(( nproc=1+nproc/3 ))\nmake -j${nproc} sparse-shared\nmake install prefix=${prefix}\ninstall_license COPYRIGHT\n"""
