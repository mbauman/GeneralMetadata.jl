        ["3.24.11+5".artifact_metadata.metadata]
        init_block = ""
        julia_compat = "1.0"
        lazy_artifacts = false
        name = "GTK3"
        platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
        script = """cd $WORKSPACE/srcdir/gtk+-*/\n\n# Temporary workaround #1 issue with apk\napk add samurai\n\n# Temporary workaround #2: `util-linux` has a file, `/usr/bin/wall`, owned by\n# `root:tty`, but `apk` can't chown the file to the `tty` group because it\n# doesn't exist in our environment.  New `apk` has the option `--no-chown`, so\n# let's upgrade `apk` before going on\napk add --upgrade apk-tools --repository=http://dl-cdn.alpinelinux.org/alpine/edge/main\n\n# We need to run some commands with a native Glib\napk add --no-chown glib-dev gtk+3.0\n\nif [[ \"${target}\" == *-linux-* ]]; then\n    # We need to run `wayland-scanner` on the build system only when Wayland is\n    # available, i.e. only on Linux\n    apk add wayland-dev\nfi\n\n# This is awful, I know\nln -sf /usr/bin/glib-compile-resources ${prefix}/bin/glib-compile-resources\nln -sf /usr/bin/glib-compile-schemas ${prefix}/bin/glib-compile-schemas\nln -sf /usr/bin/gdk-pixbuf-pixdata ${prefix}/bin/gdk-pixbuf-pixdata\n# Remove wayland-scanner when present, so that we can call the native one\nrm -f ${prefix}/bin/wayland-scanner\n\natomic_patch -p1 $WORKSPACE/srcdir/patches/gdkwindow-quartz_c.patch\natomic_patch -p1 $WORKSPACE/srcdir/patches/meson_build.patch\n# The `meson.build` file has the wrong version number in 3.24.11.\natomic_patch -p1 $WORKSPACE/srcdir/patches/meson_build_version_3.24.11.patch\n\nFLAGS=()\nif [[ \"${target}\" == *-apple-* ]]; then\n    FLAGS+=(-Dx11_backend=false -Dwayland_backend=false)\nelif [[ \"${target}\" == *-freebsd* ]]; then\n    FLAGS+=(-Dwayland_backend=false)\nfi\n\nmkdir build-gtk && cd build-gtk\nmeson .. \\\n    -Dintrospection=false \\\n    -Ddemos=false \\\n    -Dexamples=false \\\n    -Dtests=false \\\n    \"${FLAGS[@]}\" \\\n    --cross-file=\"${MESON_TARGET_TOOLCHAIN}\"\nninja -j${nproc}\nninja install\n\n# Remove temporary links\nrm ${prefix}/bin/gdk-pixbuf-pixdata ${prefix}/bin/glib-compile-{resources,schemas}\n"""
        version = "v3.24.11"

