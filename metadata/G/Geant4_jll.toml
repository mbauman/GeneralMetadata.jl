        ["11.3.2+1".artifact_metadata.metadata]
        augment_platform_block = ""
        init_block = ""
        julia_compat = "1.6"
        lazy_artifacts = false
        name = "Geant4"
        platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
        script = """cd $WORKSPACE/srcdir/geant4-*/\n\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    # Install a newer SDK which supports `std::filesystem`\n    pushd $WORKSPACE/srcdir/MacOSX10.*.sdk\n    rm -rf /opt/${target}/${target}/sys-root/System\n    cp -ra usr/* \"/opt/${target}/${target}/sys-root/usr/.\"\n    cp -ra System \"/opt/${target}/${target}/sys-root/.\"\n    export MACOSX_DEPLOYMENT_TARGET=10.15\n    popd\nfi\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    atomic_patch -p1 ../patches/windows.patch\nfi\n\nmkdir build && cd build\nFLAGS=()\nif [[ \"${target}\" != *-w64-* && \"${target}\" != *-apple-* ]]; then\n    FLAGS+=(-DGEANT4_USE_OPENGL_X11=ON)\nfi\nif [[ \"${target}\" == *-apple-* ]]; then\n    FLAGS+=(-DGEANT4_USE_SYSTEM_ZLIB=ON)\nfi\nif [[ \"${target}\" == *-w64-* ]]; then\n    FLAGS+=(-DGEANT4_BUILD_MULTITHREADED=OFF)\nfi\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DCMAKE_CXX_STANDARD=17 \\\n      -DGEANT4_INSTALL_DATA=ON \\\n      -DGEANT4_USE_GDML=ON \\\n      -DGEANT4_BUILD_TLS_MODEL=global-dynamic \\\n      \"${FLAGS[@]}\" \\\n    ..\nmake -j${nproc}\nmake install\n\ninstall_license ../LICENSE\n"""
        version = "v11.3.2"

