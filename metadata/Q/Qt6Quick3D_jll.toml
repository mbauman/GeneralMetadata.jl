        platforms = ["x86_64-apple-darwin", "aarch64-apple-darwin", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-unknown-freebsd"]
        script = ["""macos_sdk_version=14.0\nmacosx_deployment_target=12\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    # extract the tarball into the sys-root so all compilers pick it up\n    # automatically, and use --warning=no-unknown-keyword to hide harmless\n    # warnings about unsupported pax header keywords like \"SCHILY.fflags\"\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        --warning=no-unknown-keyword \\\n        MacOSX${macos_sdk_version}.sdk/System \\\n        MacOSX${macos_sdk_version}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\n# Need newer cmake from JLL\napk del cmake\n\ncd $WORKSPACE/srcdir\n\nmkdir build\ncd build/\nqtsrcdir=`ls -d ../qtquick3d-*`\n\natomic_patch -p1 -d \"${qtsrcdir}\" ../patches/assimp-6.patch\n\nif [[ $bb_full_target == *\"musl\"* ]]; then\n    # secure_getenv is undefined on the musl platforms\n    sed -i \"s/HAVE_SECURE_GETENV//\" $qtsrcdir/src/3rdparty/openxr/CMakeLists.txt\nfi\n\ncase \"$bb_full_target\" in\n\n    x86_64-linux-musl-libgfortran5-cxx11)\n        cmake -G Ninja \\\n            -DCMAKE_INSTALL_PREFIX=${prefix} \\\n            -DCMAKE_FIND_ROOT_PATH=$prefix \\\n            -DCMAKE_BUILD_TYPE=Release \\\n            $qtsrcdir\n    ;;\n\n    *apple-darwin*)\n        apple_sdk_root=$WORKSPACE/srcdir/MacOSX14.0.sdk\n        sed -i \"s!/opt/$target/$target/sys-root!$apple_sdk_root!\" $CMAKE_TARGET_TOOLCHAIN\n        sed -i \"s!/opt/$target/$target/sys-root!$apple_sdk_root!\" /opt/bin/$bb_full_target/$target-clang++\n        export MACOSX_DEPLOYMENT_TARGET=12\n        export OBJCFLAGS=\"-D__ENVIRONMENT_OS_VERSION_MIN_REQUIRED__=120000\"\n        export OBJCXXFLAGS=$OBJCFLAGS\n        export CXXFLAGS=$OBJCFLAGS\n        cmake -G Ninja \\\n            -DQT_HOST_PATH=$host_prefix \\\n            -DPython_ROOT_DIR=/usr \\\n            -DCMAKE_INSTALL_PREFIX=${prefix} \\\n            -DCMAKE_PREFIX_PATH=$host_prefix \\\n            -DCMAKE_FIND_ROOT_PATH=$prefix \\\n            -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n            -DCMAKE_SYSROOT=$apple_sdk_root \\\n            -DCMAKE_FRAMEWORK_PATH=$apple_sdk_root/System/Library/Frameworks \\\n            -DCMAKE_OSX_DEPLOYMENT_TARGET=11 \\\n            -DQT_NO_APPLE_SDK_AND_XCODE_CHECK=ON \\\n            -DCMAKE_BUILD_TYPE=Release \\\n            $qtsrcdir\n    ;;\n\n    *)\n        cmake -G Ninja \\\n            -DQT_HOST_PATH=$host_prefix \\\n            -DCMAKE_INSTALL_PREFIX=${prefix} \\\n            -DCMAKE_FIND_ROOT_PATH=$prefix \\\n            -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n            -DCMAKE_BUILD_TYPE=Release \\\n            $qtsrcdir\n    ;;\n\nesac\n\ncmake --build . --parallel ${nproc}\ncmake --install .\ninstall_license $WORKSPACE/srcdir/qt*-src-*/LICENSES/GPL-3.0-only.txt\n""", """# Need newer cmake from JLL\napk del cmake\n\ncd $WORKSPACE/srcdir\n\nmkdir build\ncd build/\nqtsrcdir=`ls -d ../qtquick3d-*`\n\natomic_patch -p1 -d \"${qtsrcdir}\" ../patches/assimp-6.patch\n\nif [[ $bb_full_target == *\"musl\"* ]]; then\n    # secure_getenv is undefined on the musl platforms\n    sed -i \"s/HAVE_SECURE_GETENV//\" $qtsrcdir/src/3rdparty/openxr/CMakeLists.txt\nfi\n\ncase \"$bb_full_target\" in\n\n    x86_64-linux-musl-libgfortran5-cxx11)\n        cmake -G Ninja \\\n            -DCMAKE_INSTALL_PREFIX=${prefix} \\\n            -DCMAKE_FIND_ROOT_PATH=$prefix \\\n            -DCMAKE_BUILD_TYPE=Release \\\n            $qtsrcdir\n    ;;\n\n    *apple-darwin*)\n        apple_sdk_root=$WORKSPACE/srcdir/MacOSX14.0.sdk\n        sed -i \"s!/opt/$target/$target/sys-root!$apple_sdk_root!\" $CMAKE_TARGET_TOOLCHAIN\n        sed -i \"s!/opt/$target/$target/sys-root!$apple_sdk_root!\" /opt/bin/$bb_full_target/$target-clang++\n        export MACOSX_DEPLOYMENT_TARGET=12\n        export OBJCFLAGS=\"-D__ENVIRONMENT_OS_VERSION_MIN_REQUIRED__=120000\"\n        export OBJCXXFLAGS=$OBJCFLAGS\n        export CXXFLAGS=$OBJCFLAGS\n        cmake -G Ninja \\\n            -DQT_HOST_PATH=$host_prefix \\\n            -DPython_ROOT_DIR=/usr \\\n            -DCMAKE_INSTALL_PREFIX=${prefix} \\\n            -DCMAKE_PREFIX_PATH=$host_prefix \\\n            -DCMAKE_FIND_ROOT_PATH=$prefix \\\n            -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n            -DCMAKE_SYSROOT=$apple_sdk_root \\\n            -DCMAKE_FRAMEWORK_PATH=$apple_sdk_root/System/Library/Frameworks \\\n            -DCMAKE_OSX_DEPLOYMENT_TARGET=11 \\\n            -DQT_NO_APPLE_SDK_AND_XCODE_CHECK=ON \\\n            -DCMAKE_BUILD_TYPE=Release \\\n            $qtsrcdir\n    ;;\n\n    *)\n        cmake -G Ninja \\\n            -DQT_HOST_PATH=$host_prefix \\\n            -DCMAKE_INSTALL_PREFIX=${prefix} \\\n            -DCMAKE_FIND_ROOT_PATH=$prefix \\\n            -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n            -DCMAKE_BUILD_TYPE=Release \\\n            $qtsrcdir\n    ;;\n\nesac\n\ncmake --build . --parallel ${nproc}\ncmake --install .\ninstall_license $WORKSPACE/srcdir/qt*-src-*/LICENSES/GPL-3.0-only.txt\n"""]
