        script = ["""macos_sdk_version=14.0\nmacosx_deployment_target=12\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    # extract the tarball into the sys-root so all compilers pick it up\n    # automatically, and use --warning=no-unknown-keyword to hide harmless\n    # warnings about unsupported pax header keywords like \"SCHILY.fflags\"\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        --warning=no-unknown-keyword \\\n        MacOSX${macos_sdk_version}.sdk/System \\\n        MacOSX${macos_sdk_version}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\n# Need newer cmake from JLL\napk del cmake\n\ncd $WORKSPACE/srcdir\n\nBIN_DIR=\"/opt/bin/${bb_full_target}\"\n\nmkdir build\ncd build/\n\nqtsrcdir=`ls -d ../qtbase-everywhere-src-*`\n\natomic_patch -p1 -d \"${qtsrcdir}\" ../patches/mingw-mac.patch\n\ncommonoptions=\" \\\n-opensource -confirm-license \\\n-openssl-linked  -nomake examples -release \\\n\"\n\ncommoncmakeoptions=\"-DCMAKE_PREFIX_PATH=${prefix} -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DQT_HOST_PATH=$host_prefix -DQT_FEATURE_openssl_linked=ON -DWaylandScanner_EXECUTABLE=$host_bindir/wayland-scanner\"\n\nexport LD_LIBRARY_PATH=$host_libdir:$host_prefix/lib64:$LD_LIBRARY_PATH\nexport OPENSSL_LIBS=\"-L${libdir} -lssl -lcrypto\"\n\n# temporarily allow march during configure\nsed -i 's/exit 1/#exit 1/' /opt/bin/$bb_full_target/$target-g++\n\ncase \"$bb_full_target\" in\n\n    x86_64-linux-musl-libgfortran5-cxx11)\n        sed -i 's/exit 1/#exit 1/' $HOSTCXX\n        ../qtbase-everywhere-src-*/configure -prefix $prefix \\\n            $commonoptions \\\n            -fontconfig \\\n            -- \\\n            -DCMAKE_PREFIX_PATH=${prefix} \\\n            -DCMAKE_TOOLCHAIN_FILE=${CMAKE_HOST_TOOLCHAIN} \\\n            -DQT_FEATURE_xcb=ON\n        sed -i 's/#exit 1/exit 1/' $HOSTCXX\n    ;;\n\n    *mingw*)\n        ../qtbase-everywhere-src-*/configure -prefix $prefix \\\n            -opensource -confirm-license \\\n            -nomake examples -release \\\n            -opengl dynamic \\\n            -- -DCMAKE_PREFIX_PATH=${prefix} \\\n            -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n            -DQT_HOST_PATH=$host_prefix\n    ;;\n\n    *apple-darwin*)\n        export LDFLAGS=\"-L${libdir}/darwin -lclang_rt.osx\"\n        export OBJCFLAGS=\"-D__ENVIRONMENT_OS_VERSION_MIN_REQUIRED__=120000\"\n        export OBJCXXFLAGS=$OBJCFLAGS\n        export CXXFLAGS=$OBJCFLAGS\n        sed -i 's/exit 1/#exit 1/' /opt/bin/$bb_full_target/$target-clang++\n        ../qtbase-everywhere-src-*/configure -prefix $prefix \\\n            $commonoptions \\\n            -- $commoncmakeoptions \\\n            -DQT_INTERNAL_APPLE_SDK_VERSION=14 \\\n            -DQT_INTERNAL_XCODE_VERSION=15 \\\n            -DQT_FEATURE_vulkan=OFF\n        sed -i 's/#exit 1/exit 1/' /opt/bin/$bb_full_target/$target-clang++\n    ;;\n\n    *freebsd*)\n        sed -i 's/-Wl,--no-undefined//' $qtsrcdir/mkspecs/freebsd-clang/qmake.conf\n        sed -i 's/-Wl,--no-undefined//' $qtsrcdir/cmake/QtFlagHandlingHelpers.cmake\n        sed -i 's/exit 1/#exit 1/' /opt/bin/$bb_full_target/$target-clang++\n        ../qtbase-everywhere-src-*/configure -prefix $prefix \\\n            $commonoptions \\\n            -fontconfig \\\n            -- $commoncmakeoptions \\\n            -DQT_PLATFORM_DEFINITION_DIR=$host_prefix/mkspecs/freebsd-clang \\\n            -DQT_FEATURE_xcb=ON\n        sed -i 's/#exit 1/exit 1/' /opt/bin/$bb_full_target/$target-clang++\n    ;;\n\n    *i686-linux-musl*)\n        ../qtbase-everywhere-src-*/configure -prefix $prefix \\\n            $commonoptions \\\n             -verbose \\\n            -fontconfig \\\n            -no-stack-protector \\\n            -- $commoncmakeoptions \\\n            -DQT_FEATURE_xcb=ON\n    ;;\n\n    *)\n        echo \"#define ELFOSABI_GNU 3\" >> /opt/$target/$target/sys-root/usr/include/elf.h\n        echo \"#define EM_AARCH64 183\" >> /opt/$target/$target/sys-root/usr/include/elf.h\n        echo \"#define EM_BLACKFIN 106\" >> /opt/$target/$target/sys-root/usr/include/elf.h\n        ../qtbase-everywhere-src-*/configure -prefix $prefix \\\n            -verbose \\\n            $commonoptions \\\n            -fontconfig \\\n            -- $commoncmakeoptions \\\n            -DQT_FEATURE_xcb=ON\n    ;;\nesac\n\n# reinstate march restriction for build\nsed -i 's/#exit 1/exit 1/' /opt/bin/$bb_full_target/$target-g++\n\ncmake --build . --parallel ${nproc}\ncmake --install .\ninstall_license $WORKSPACE/srcdir/qtbase-everywhere-src-*/LICENSES/LGPL-3.0-only.txt\n""", """# Need newer cmake from JLL\napk del cmake\n\ncd $WORKSPACE/srcdir\n\nBIN_DIR=\"/opt/bin/${bb_full_target}\"\n\nmkdir build\ncd build/\n\nqtsrcdir=`ls -d ../qtbase-everywhere-src-*`\n\natomic_patch -p1 -d \"${qtsrcdir}\" ../patches/mingw-mac.patch\n\ncommonoptions=\" \\\n-opensource -confirm-license \\\n-openssl-linked  -nomake examples -release \\\n\"\n\ncommoncmakeoptions=\"-DCMAKE_PREFIX_PATH=${prefix} -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} -DQT_HOST_PATH=$host_prefix -DQT_FEATURE_openssl_linked=ON -DWaylandScanner_EXECUTABLE=$host_bindir/wayland-scanner\"\n\nexport LD_LIBRARY_PATH=$host_libdir:$host_prefix/lib64:$LD_LIBRARY_PATH\nexport OPENSSL_LIBS=\"-L${libdir} -lssl -lcrypto\"\n\n# temporarily allow march during configure\nsed -i 's/exit 1/#exit 1/' /opt/bin/$bb_full_target/$target-g++\n\ncase \"$bb_full_target\" in\n\n    x86_64-linux-musl-libgfortran5-cxx11)\n        sed -i 's/exit 1/#exit 1/' $HOSTCXX\n        ../qtbase-everywhere-src-*/configure -prefix $prefix \\\n            $commonoptions \\\n            -fontconfig \\\n            -- \\\n            -DCMAKE_PREFIX_PATH=${prefix} \\\n            -DCMAKE_TOOLCHAIN_FILE=${CMAKE_HOST_TOOLCHAIN} \\\n            -DQT_FEATURE_xcb=ON\n        sed -i 's/#exit 1/exit 1/' $HOSTCXX\n    ;;\n\n    *mingw*)\n        ../qtbase-everywhere-src-*/configure -prefix $prefix \\\n            -opensource -confirm-license \\\n            -nomake examples -release \\\n            -opengl dynamic \\\n            -- -DCMAKE_PREFIX_PATH=${prefix} \\\n            -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n            -DQT_HOST_PATH=$host_prefix\n    ;;\n\n    *apple-darwin*)\n        export LDFLAGS=\"-L${libdir}/darwin -lclang_rt.osx\"\n        export OBJCFLAGS=\"-D__ENVIRONMENT_OS_VERSION_MIN_REQUIRED__=120000\"\n        export OBJCXXFLAGS=$OBJCFLAGS\n        export CXXFLAGS=$OBJCFLAGS\n        sed -i 's/exit 1/#exit 1/' /opt/bin/$bb_full_target/$target-clang++\n        ../qtbase-everywhere-src-*/configure -prefix $prefix \\\n            $commonoptions \\\n            -- $commoncmakeoptions \\\n            -DQT_INTERNAL_APPLE_SDK_VERSION=14 \\\n            -DQT_INTERNAL_XCODE_VERSION=15 \\\n            -DQT_FEATURE_vulkan=OFF\n        sed -i 's/#exit 1/exit 1/' /opt/bin/$bb_full_target/$target-clang++\n    ;;\n\n    *freebsd*)\n        sed -i 's/-Wl,--no-undefined//' $qtsrcdir/mkspecs/freebsd-clang/qmake.conf\n        sed -i 's/-Wl,--no-undefined//' $qtsrcdir/cmake/QtFlagHandlingHelpers.cmake\n        sed -i 's/exit 1/#exit 1/' /opt/bin/$bb_full_target/$target-clang++\n        ../qtbase-everywhere-src-*/configure -prefix $prefix \\\n            $commonoptions \\\n            -fontconfig \\\n            -- $commoncmakeoptions \\\n            -DQT_PLATFORM_DEFINITION_DIR=$host_prefix/mkspecs/freebsd-clang \\\n            -DQT_FEATURE_xcb=ON\n        sed -i 's/#exit 1/exit 1/' /opt/bin/$bb_full_target/$target-clang++\n    ;;\n\n    *i686-linux-musl*)\n        ../qtbase-everywhere-src-*/configure -prefix $prefix \\\n            $commonoptions \\\n             -verbose \\\n            -fontconfig \\\n            -no-stack-protector \\\n            -- $commoncmakeoptions \\\n            -DQT_FEATURE_xcb=ON\n    ;;\n\n    *)\n        echo \"#define ELFOSABI_GNU 3\" >> /opt/$target/$target/sys-root/usr/include/elf.h\n        echo \"#define EM_AARCH64 183\" >> /opt/$target/$target/sys-root/usr/include/elf.h\n        echo \"#define EM_BLACKFIN 106\" >> /opt/$target/$target/sys-root/usr/include/elf.h\n        ../qtbase-everywhere-src-*/configure -prefix $prefix \\\n            -verbose \\\n            $commonoptions \\\n            -fontconfig \\\n            -- $commoncmakeoptions \\\n            -DQT_FEATURE_xcb=ON\n    ;;\nesac\n\n# reinstate march restriction for build\nsed -i 's/#exit 1/exit 1/' /opt/bin/$bb_full_target/$target-g++\n\ncmake --build . --parallel ${nproc}\ncmake --install .\ninstall_license $WORKSPACE/srcdir/qtbase-everywhere-src-*/LICENSES/LGPL-3.0-only.txt\n"""]
