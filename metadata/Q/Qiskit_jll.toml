        ["2.3.0+0".artifact_metadata.metadata]
        augment_platform_block = ""
        init_block = ""
        julia_compat = "1.6"
        lazy_artifacts = false
        name = "Qiskit"
        platforms = ["x86_64-linux-gnu", "x86_64-linux-musl", "aarch64-linux-gnu", "aarch64-linux-musl", "aarch64-apple-darwin"]
        script = """macos_sdk_version=11.0\nmacosx_deployment_target=11.0\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    # extract the tarball into the sys-root so all compilers pick it up\n    # automatically, and use --warning=no-unknown-keyword to hide harmless\n    # warnings about unsupported pax header keywords like \"SCHILY.fflags\"\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        --warning=no-unknown-keyword \\\n        MacOSX${macos_sdk_version}.sdk/System \\\n        MacOSX${macos_sdk_version}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd $WORKSPACE/srcdir/qiskit\nexport PYO3_PYTHON=${host_bindir}/python3\nexport PYO3_CROSS_LIB_DIR=$WORKSPACE/destdir/lib\nexport RUSTFLAGS=\"-L ${libdir}\"\n\n# not enough space in /tmp\nexport TMPDIR=$WORKSPACE/tmp\nmkdir $TMPDIR\n\n# avoid 'cannot create cdylib' error on musl targets\n# see https://github.com/rust-lang/cargo/issues/8607\n#     https://github.com/rust-lang/rust/issues/59302\nif [[ \"${target}\" == *-musl* ]]; then\n    export RUSTFLAGS=\"${RUSTFLAGS} -C target-feature=-crt-static\"\nfi\n\n# The current Qiskit C API build instructions say to use a Makefile that is\n# improperly formed and not suitable for cross compilation.  So, instead,\n# we invoke Cargo directly and copy the handful of files that result to their\n# proper location.\ncargo rustc --release --crate-type cdylib -p qiskit-cext\ninstall -Dvm 755 \"target/${rust_target}/release/libqiskit_cext.${dlext}\" \"${libdir}/libqiskit.${dlext}\"\nmkdir -p \"${includedir}/qiskit\"\ncp -v target/qiskit.h \"${includedir}\"\ncp -vr crates/cext/include/qiskit/* \"${includedir}/qiskit\"\ninstall_license LICENSE.txt\n"""
        version = "v2.3.0"

