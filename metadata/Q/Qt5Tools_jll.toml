        lazy_artifacts = false
        name = "Qt5Tools"
        platforms = ["aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-unknown-freebsd", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-apple-darwin"]
        script = """cd $WORKSPACE/srcdir\nmkdir build\ncd build/\n\nqtsrcdir=`ls -d ../qttools-*`\n\ncase \"$target\" in\n    *apple-darwin*)\n        ln -s $libdir/QtCore.framework/Headers $includedir/QtCore\n        ;;\n    *freebsd*)\n        echo \"LIBS += -lxml2 -lz -liconv\" >> $qtsrcdir/src/qdoc/qdoc.pro\n        ;;\nesac\n\nexport LLVM_INSTALL_DIR=/opt/x86_64-linux-musl\nexport QDOC_USE_STATIC_LIBCLANG=true\n\nqmake $qtsrcdir\nmake -j${nproc}\n\n# It appends the root path here with the qmake dir, which is /workspace/artifacts/blah...\nmake INSTALL_ROOT=$PWD/dummyroot install\nrsync -ua dummyroot/workspace/*/artifacts/*/* $prefix\n\ninstall_license $qtsrcdir/LICENSE.LGPL3\n\ncase \"$target\" in\n    *apple-darwin*)\n        rm $includedir/QtCore\n        ;;\n    *mingw*)\n        chmod +x $bindir/*.exe\n        ;;\nesac\n"""
        version = "v5.15.2"

