        julia_compat = "1.6"
        lazy_artifacts = false
        name = "Blosc2"
        platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
        script = """cd $WORKSPACE/srcdir/c-blosc2\n\n# Blosc2 mis-detects whether the system headers provide `_xsetbv`\n# (probably on several platforms), and on `x86_64-w64-mingw32` the\n# functions have incompatible return types (although both are 64-bit\n# integers).\natomic_patch -p1 ../patches/_xsetbv.patch\n\n# Clang on Apple does not (yet?) properly support `__builtin_cpu_supports`.\n# The symbol `__cpu_model` is not provided by any standard library.\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    perl -pi -e 's/#define HAVE_CPU_FEAT_INTRIN/#undef HAVE_CPU_FEAT_INTRIN/' blosc/shuffle.c\nfi\n\ncmake -B build -G Ninja \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_BENCHMARKS=OFF \\\n    -DBUILD_EXAMPLES=OFF \\\n    -DBUILD_STATIC=OFF \\\n    -DBUILD_TESTS=OFF \\\n    -DPREFER_EXTERNAL_LZ4=ON  \\\n    -DPREFER_EXTERNAL_ZLIB=ON \\\n    -DPREFER_EXTERNAL_ZSTD=ON\ncmake --build build --parallel ${nproc}\ncmake --install build\ninstall_license LICENSES/*.txt\n"""
