ibvpx      \\\n  --enable-encoders    \\\n  --enable-decoders    \\\n  --enable-muxers      \\\n  --enable-demuxers    \\\n  --enable-parsers     \\\n  --enable-openssl     \\\n  --disable-schannel   \\\n  --extra-cflags=\"-I${prefix}/include\" \\\n  --extra-ldflags=\"-L${prefix}/lib\"\nmake -j${nproc}\nmake install\n"""
