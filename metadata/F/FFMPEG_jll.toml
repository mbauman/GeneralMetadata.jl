        ["6.1.2+0".artifact_metadata.metadata]
        augment_platform_block = ""
        init_block = ""
        julia_compat = "1.6"
        lazy_artifacts = false
        name = "FFMPEG"
        platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
        script = """FFPLAY=false\ncd $WORKSPACE/srcdir\ncd ffmpeg-*/\nsed -i 's/-lflite\"/-lflite -lasound\"/' configure\n\nif [[ \"${target}\" == *-linux-* ]]; then\n    export ccOS=\"linux\"\nelif [[ \"${target}\" == *-apple-* ]]; then\n    export ccOS=\"darwin\"\nelif [[ \"${target}\" == *-w32-* ]]; then\n    export ccOS=\"mingw32\"\nelif [[ \"${target}\" == *-w64-* ]]; then\n    export ccOS=\"mingw64\"\nelif [[ \"${target}\" == *-unknown-freebsd* ]]; then\n    export ccOS=\"freebsd\"\nelse\n    export ccOS=\"linux\"\nfi\n\nif [[ \"${target}\" == x86_64-* ]]; then\n    export ccARCH=\"x86_64\"\nelif [[ \"${target}\" == i686-* ]]; then\n    export ccARCH=\"i686\"\nelif [[ \"${target}\" == arm-* ]]; then\n    export ccARCH=\"arm\"\nelif [[ \"${target}\" == aarch64-* ]]; then\n    export ccARCH=\"aarch64\"\nelif [[ \"${target}\" == powerpc64le-* ]]; then\n    export ccARCH=\"powerpc64le\"\nelse\n    export ccARCH=\"x86_64\"\nfi\n\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then \n    export MACOSX_DEPLOYMENT_TARGET=10.13 \n    pushd ${WORKSPACE}/srcdir/MacOSX10.*.sdk \n    rm -rf /opt/${target}/${target}/sys-root/System \n    cp -a usr/* \"/opt/${target}/${target}/sys-root/usr/\" \n    cp -a System \"/opt/${target}/${target}/sys-root/\" \n    popd\nfi \n\nexport CUDA_ARGS=\"\"\n\nEXTRA_FLAGS=()\nif [[ \"${target}\" == *-darwin* ]]; then\n    EXTRA_FLAGS+=(--objcc=\"${CC} -x objective-c\")\nfi\nif [[ \"${FFPLAY}\" == \"true\" ]]; then\n    EXTRA_FLAGS+=(\"--enable-ffplay\")\nfi\n\n# Remove `-march` flags\nsed -i 's/cpuflags=\"-march=$cpu\"/cpuflags=\"\"/g' configure\n\n./configure            \\\n  --enable-cross-compile \\\n  --cross-prefix=/opt/${target}/bin/${target}- \\\n  --arch=${ccARCH}     \\\n  --target-os=${ccOS}  \\\n  --cc=\"${CC}\"         \\\n  --cxx=\"${CXX}\"       \\\n  --dep-cc=\"${CC}\"     \\\n  --ar=ar              \\\n  --nm=nm              \\\n  --sysinclude=${prefix}/include \\\n  --pkg-config=$(which pkg-config) \\\n  --pkg-config-flags=--static \\\n  --prefix=$prefix     \\\n  --sysroot=/opt/${target}/${target}/sys-root \\\n  --extra-libs=-lpthread \\\n  --enable-gpl         \\\n  --enable-version3    \\\n  --enable-nonfree     \\\n  --disable-static     \\\n  --enable-shared      \\\n  --enable-pic         \\\n  --disable-debug      \\\n  --disable-doc        \\\n  --enable-libaom      \\\n  --enable-libass      \\\n  --enable-libfdk-aac  \\\n  --enable-libfreetype \\\n  --enable-libmp3lame  \\\n  --enable-libopus     \\\n  --enable-libvorbis   \\\n  --enable-libx264     \\\n  --enable-libx265     \\\n  --enable-libvpx      \\\n  --enable-encoders    \\\n  --enable-decoders    \\\n  --enable-muxers      \\\n  --enable-demuxers    \\\n  --enable-parsers     \\\n  --enable-openssl     \\\n  --disable-schannel   \\\n  --extra-cflags=\"-I${prefix}/include\" \\\n  --extra-ldflags=\"-L${libdir}\" ${CUDA_ARGS} \\\n  \"${EXTRA_FLAGS[@]}\"\nmake -j${nproc}\nif [[ \"${FFPLAY}\" == \"true\" ]]; then\n    # Manually install only the FFplay binary\n    install -Dvm 755 \"ffplay${exeext}\" \"${bindir}/ffplay${exeext}\"\nelse\n    # Install all FFMPEG stuff: libraries, executables, header files, etc...\n    make install\nfi\ninstall_license LICENSE.md COPYING.*\n"""
        version = "v6.1.2"

