        platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
        script = """FFPLAY=false\nGPL=false\nmacos_sdk_version=10.13\nmacosx_deployment_target=10.13\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    # extract the tarball into the sys-root so all compilers pick it up\n    # automatically, and use --warning=no-unknown-keyword to hide harmless\n    # warnings about unsupported pax header keywords like \"SCHILY.fflags\"\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        --warning=no-unknown-keyword \\\n        MacOSX${macos_sdk_version}.sdk/System \\\n        MacOSX${macos_sdk_version}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd $WORKSPACE/srcdir\ncd ffmpeg-*/\nsed -i 's/-lflite\"/-lflite -lasound\"/' configure\n\nif [[ \"${target}\" == *-linux-* ]]; then\n    export ccOS=\"linux\"\nelif [[ \"${target}\" == *-apple-* ]]; then\n    export ccOS=\"darwin\"\nelif [[ \"${target}\" == *-w32-* ]]; then\n    export ccOS=\"mingw32\"\nelif [[ \"${target}\" == *-w64-* ]]; then\n    export ccOS=\"mingw64\"\nelif [[ \"${target}\" == *-unknown-freebsd* ]]; then\n    export ccOS=\"freebsd\"\nelse\n    export ccOS=\"linux\"\nfi\n\nif [[ \"${target}\" == x86_64-* ]]; then\n    export ccARCH=\"x86_64\"\nelif [[ \"${target}\" == i686-* ]]; then\n    export ccARCH=\"i686\"\nelif [[ \"${target}\" == arm-* ]]; then\n    export ccARCH=\"arm\"\nelif [[ \"${target}\" == aarch64-* ]]; then\n    export ccARCH=\"aarch64\"\nelif [[ \"${target}\" == powerpc64le-* ]]; then\n    export ccARCH=\"powerpc64le\"\nelif [[ \"${target}\" == riscv64-* ]]; then\n    export ccARCH=\"riscv64\"\nelse\n    export ccARCH=\"x86_64\"\nfi\n\nexport CUDA_ARGS=\"\"\n\nEXTRA_FLAGS=()\nif [[ \"${target}\" == *-darwin* ]]; then\n    EXTRA_FLAGS+=(--objcc=\"${CC} -x objective-c\")\n    # Enable VideoToolbox hardware acceleration on macOS\n    EXTRA_FLAGS+=(\"--enable-videotoolbox\")\nfi\nif [[ \"${FFPLAY}\" == \"true\" ]]; then\n    EXTRA_FLAGS+=(\"--enable-ffplay\")\nfi\n# On Windows, use Schannel instead of OpenSSL\nif [[ \"${target}\" == *-mingw* ]]; then\n    EXTRA_FLAGS+=(\"--disable-openssl\" \"--enable-schannel\")\n    # Enable D3D11VA and DXVA2 hardware acceleration on Windows\n    EXTRA_FLAGS+=(\"--enable-d3d11va\" \"--enable-dxva2\")\nelse\n    EXTRA_FLAGS+=(\"--enable-openssl\" \"--disable-schannel\")\nfi\n\n# Enable VAAPI hardware acceleration on Linux/FreeBSD\nif [[ \"${target}\" == *-linux-* ]] || [[ \"${target}\" == *-freebsd* ]]; then\n    EXTRA_FLAGS+=(\"--enable-vaapi\")\nfi\n\n# GPL and nonfree libraries\nif [[ \"${GPL}\" == \"true\" ]]; then\n    EXTRA_FLAGS+=(\"--enable-gpl\" \"--enable-nonfree\")\n    EXTRA_FLAGS+=(\"--enable-libfdk-aac\" \"--enable-libx264\" \"--enable-libx265\")\nfi\n\n# Remove `-march` flags\nsed -i 's/cpuflags=\"-march=$cpu\"/cpuflags=\"\"/g' configure\n\n./configure            \\\n  --enable-cross-compile \\\n  --cross-prefix=/opt/${target}/bin/${target}- \\\n  --arch=${ccARCH}     \\\n  --target-os=${ccOS}  \\\n  --cc=\"${CC}\"         \\\n  --cxx=\"${CXX}\"       \\\n  --host-cc=\"${CC_BUILD}\" \\\n  --dep-cc=\"${CC}\"     \\\n  --ar=ar              \\\n  --nm=nm              \\\n  --sysinclude=${prefix}/include \\\n  --pkg-config=$(which pkg-config) \\\n  --pkg-config-flags=--static \\\n  --prefix=$prefix     \\\n  --sysroot=/opt/${target}/${target}/sys-root \\\n  --extra-libs=-lpthread \\\n  --enable-version3    \\\n  --disable-static     \\\n  --enable-shared      \\\n  --enable-pic         \\\n  --disable-debug      \\\n  --disable-doc        \\\n  --enable-libaom      \\\n  --enable-libass      \\\n  --enable-libfreetype \\\n  --enable-libmp3lame  \\\n  --enable-libopus     \\\n  --enable-libvorbis   \\\n  --enable-libvpx      \\\n  --enable-encoders    \\\n  --enable-decoders    \\\n  --enable-muxers      \\\n  --enable-demuxers    \\\n  --enable-parsers     \\\n  --extra-cflags=\"-I${prefix}/include\" \\\n  --extra-ldflags=\"-L${libdir}\" ${CUDA_ARGS} \\\n  \"${EXTRA_FLAGS[@]}\"\nmake -j${nproc}\nif [[ \"${FFPLAY}\" == \"true\" ]]; then\n    # Manually install only the FFplay binary\n    install -Dvm 755 \"ffplay${exeext}\" \"${bindir}/ffplay${exeext}\"\nelse\n    # Install all FFMPEG stuff: libraries, executables, header files, etc...\n    make install\nfi\ninstall_license LICENSE.md COPYING.*\n"""
