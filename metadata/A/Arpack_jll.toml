        platforms = ["i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran3", "aarch64-linux-gnu-libgfortran4", "aarch64-linux-gnu-libgfortran5", "arm-linux-gnueabihf-libgfortran3", "arm-linux-gnueabihf-libgfortran4", "arm-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran3", "powerpc64le-linux-gnu-libgfortran4", "powerpc64le-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran3", "i686-linux-musl-libgfortran4", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran3", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran3", "aarch64-linux-musl-libgfortran4", "aarch64-linux-musl-libgfortran5", "arm-linux-musleabihf-libgfortran3", "arm-linux-musleabihf-libgfortran4", "arm-linux-musleabihf-libgfortran5", "x86_64-apple-darwin14-libgfortran3", "x86_64-apple-darwin14-libgfortran4", "x86_64-apple-darwin14-libgfortran5", "x86_64-unknown-freebsd11.1-libgfortran3", "x86_64-unknown-freebsd11.1-libgfortran4", "x86_64-unknown-freebsd11.1-libgfortran5", "i686-w64-mingw32-libgfortran3", "i686-w64-mingw32-libgfortran4", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran3", "x86_64-w64-mingw32-libgfortran4", "x86_64-w64-mingw32-libgfortran5"]
        script = """mkdir ${WORKSPACE}/srcdir/arpack-build\n\n# arpack tests require finding libgfortran when linking with C linkers,\n# and gcc doesn't automatically add that search path.  So we do it for it with `rpath-link`.\nEXE_LINK_FLAGS=()\nif [[ ${target} != *darwin* ]]; then\n    EXE_LINK_FLAGS+=(\"-Wl,-rpath-link,/opt/${target}/${target}/lib\")\n    EXE_LINK_FLAGS+=(\"-Wl,-rpath-link,/opt/${target}/${target}/lib64\")\nfi\n\n# Symbols that have float32, float64, complexf32, and complexf64 support\nSDCZ_SYMBOLS=(\n    axpy copy gemv geqr2 lacpy lahqr lanhs larnv lartg\n    lascl laset scal trevc trmm trsen gbmv gbtrf gbtrs\n    gttrf gttrs pttrf pttrs\n)\n\n# All symbols that have float32/float64 support (including the SDCZ_SYMBOLS above)\nSD_SYMBOLS=(\n    ${SDCZ_SYMBOLS[@]}\n    dot ger labad laev2 lamch lanst lanv2\n    lapy2 larf larfg lasr nrm2 orm2r rot steqr swap\n)\n\n# All symbols that have complexf32/complexf64 support (including the SDCZ_SYMBOLS above)\nCZ_SYMBOLS=(${SDCZ_SYMBOLS[@]} dotc geru unm2r)\n\n# Add in (s|d)*_64 symbol remappings:\nSYMBOL_DEFS=()\nfor sym in ${SD_SYMBOLS[@]}; do\n    SYMBOL_DEFS+=(\"-Ds${sym}=s${sym}_64\" \"-Dd${sym}=d${sym}_64\")\ndone\n\n# Add in (c|z)*_64 symbol remappings:\nfor sym in ${CZ_SYMBOLS[@]}; do\n    SYMBOL_DEFS+=(\"-Dc${sym}=c${sym}_64\" \"-Dz${sym}=z${sym}_64\")\ndone\n\n# Add one-off symbol mappings; things that don't fit into any other bucket:\nfor sym in scnrm2 dznrm2 csscal zdscal dgetrf dgetrs; do\n    SYMBOL_DEFS+=(\"-D${sym}=${sym}_64\")\ndone\n\n# Set up not only lowercase symbol remappings, but uppercase as well:\nSYMBOL_DEFS+=(${SYMBOL_DEFS[@]^^})\n\nFFLAGS=\"${FFLAGS} -O2 -fPIC -ffixed-line-length-none -cpp\"\nLIBOPENBLAS=openblas\nif [[ ${nbits} == 64 ]] && [[ ${target} != aarch64* ]]; then\n    LIBOPENBLAS=openblas64_\n    FFLAGS=\"${FFLAGS} -fdefault-integer-8 ${SYMBOL_DEFS[@]}\"\nfi\n\ncd ${WORKSPACE}/srcdir/arpack-build\nexport LDFLAGS=\"${EXE_LINK_FLAGS[@]} -L$prefix/lib -lpthread\"\ncmake ../arpack-ng-* -DCMAKE_INSTALL_PREFIX=\"$prefix\" \\\n    -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DBLAS_LIBRARIES=\"-l${LIBOPENBLAS}\" \\\n    -DLAPACK_LIBRARIES=\"-l${LIBOPENBLAS}\" \\\n    -DCMAKE_Fortran_FLAGS=\"${FFLAGS}\"\n\nmake -j${nproc} VERBOSE=1\nmake install VERBOSE=1\n\n# Arpack links against a _very_ specific version of OpenBLAS on macOS by default:\nif [[ ${target} == *apple* ]]; then\n    # Rewrite it to be more accomodating\n    install_name_tool -change libopenblas64_0.3.7.dylib libopenblas64_.dylib ${prefix}/lib/libarpack.2.0.0.dylib\nfi\n"""
        version = "v3.5.0"

