-libgfortran3-cxx11-mpi+microsoftmpi", "x86_64-w64-mingw32-libgfortran4-cxx11-mpi+microsoftmpi", "x86_64-w64-mingw32-libgfortran5-cxx11-mpi+microsoftmpi", "x86_64-linux-gnu-libgfortran3-cxx03-mpi+mpitrampoline", "x86_64-linux-gnu-libgfortran4-cxx03-mpi+mpitrampoline", "x86_64-linux-gnu-libgfortran5-cxx03-mpi+mpitrampoline", "x86_64-linux-gnu-libgfortran3-cxx11-mpi+mpitrampoline", "x86_64-linux-gnu-libgfortran4-cxx11-mpi+mpitrampoline", "x86_64-linux-gnu-libgfortran5-cxx11-mpi+mpitrampoline", "aarch64-linux-gnu-libgfortran3-cxx03-mpi+mpitrampoline", "aarch64-linux-gnu-libgfortran4-cxx03-mpi+mpitrampoline", "aarch64-linux-gnu-libgfortran5-cxx03-mpi+mpitrampoline", "aarch64-linux-gnu-libgfortran3-cxx11-mpi+mpitrampoline", "aarch64-linux-gnu-libgfortran4-cxx11-mpi+mpitrampoline", "aarch64-linux-gnu-libgfortran5-cxx11-mpi+mpitrampoline", "powerpc64le-linux-gnu-libgfortran3-cxx03-mpi+mpitrampoline", "powerpc64le-linux-gnu-libgfortran4-cxx03-mpi+mpitrampoline", "powerpc64le-linux-gnu-libgfortran5-cxx03-mpi+mpitrampoline", "powerpc64le-linux-gnu-libgfortran3-cxx11-mpi+mpitrampoline", "powerpc64le-linux-gnu-libgfortran4-cxx11-mpi+mpitrampoline", "powerpc64le-linux-gnu-libgfortran5-cxx11-mpi+mpitrampoline", "x86_64-apple-darwin-libgfortran3-mpi+mpitrampoline", "x86_64-apple-darwin-libgfortran4-mpi+mpitrampoline", "x86_64-apple-darwin-libgfortran5-mpi+mpitrampoline", "aarch64-apple-darwin-libgfortran5-mpi+mpitrampoline"]
        script = """cd $WORKSPACE/srcdir\ncd ADIOS2\n# Don't define clock_gettime on macOS\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/clock_gettime.patch\n\nmkdir build\ncd build\n\nif [[ ${target} == x86_64-linux-musl ]]; then\n    # HDF5 needs libcurl, and it needs to be the BinaryBuilder libcurl, not the system libcurl.\n    rm /usr/lib/libcurl.*\n    rm /usr/lib/libnghttp2.*\nfi\n\narchopts=()\n\nif grep -q MSMPI_VER ${includedir}/mpi.h; then\n    # Microsoft MPI\n    archopts+=(-DMPI_C_ADDITIONAL_INCLUDE_DIRS= -DMPI_C_LIBRARIES=$libdir/msmpi.dll\n               -DMPI_CXX_ADDITIONAL_INCLUDE_DIRS= -DMPI_CXX_LIBRARIES=$libdir/msmpi.dll\n               -DMPI_Fortran_ADDITIONAL_INCLUDE_DIRS= -DMPI_Fortran_LIBRARIES=$libdir/msmpi.dll)\nfi\n\nif [[ \"$target\" == *-mingw* ]]; then\n    # Windows: Some options do not build\n    # Enabling HDF5 leads to the error: `H5VolReadWrite.c:(.text+0x5eb): undefined reference to `H5Pget_fapl_mpio'`\n    archopts+=(-DADIOS2_USE_DataMan=OFF -DADIOS2_USE_HDF5=OFF -DADIOS2_USE_SST=OFF)\nelse\n    archopts+=(-DADIOS2_USE_DataMan=ON -DADIOS2_USE_HDF5=ON -DADIOS2_USE_SST=ON)\nfi\n\nif grep -q MPICH_NAME $prefix/include/mpi.h && ls /usr/include/*/sys/queue.hh >/dev/null 2>&1; then\n    # This feature only works with MPICH\n    archopts+=(-DADIOS2_HAVE_MPI_CLIENT_SERVER_EXITCODE=0 -DADIOS2_HAVE_MPI_CLIENT_SERVER_EXITCODE__TRYRUN_OUTPUT=)\nelse\n    archopts+=(-DADIOS2_HAVE_MPI_CLIENT_SERVER_EXITCODE=1 -DADIOS2_HAVE_MPI_CLIENT_SERVER_EXITCODE__TRYRUN_OUTPUT=)\nfi\n\n# Fortran is not supported with Clang\ncmake \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_FIND_ROOT_PATH=$prefix \\\n    -DBUILD_TESTING=OFF \\\n    -DADIOS2_BUILD_EXAMPLES=OFF \\\n    -DADIOS2_HAVE_ZFP_CUDA=OFF \\\n    -DADIOS2_USE_Blosc2=ON \\\n    -DADIOS2_USE_CUDA=OFF \\\n    -DADIOS2_USE_Fortran=OFF \\\n    -DADIOS2_USE_MPI=ON \\\n    -DADIOS2_USE_PNG=ON \\\n    -DADIOS2_USE_SZ=ON \\\n    -DADIOS2_USE_ZeroMQ=ON \\\n    -DMPI_HOME=$prefix \\\n    ${archopts[@]} \\\n    -DADIOS2_INSTALL_GENERATE_CONFIG=OFF \\\n    -DCMAKE_INSTALL_PREFIX=$prefix \\\n    ..\ncmake --build . --config RelWithDebInfo --parallel $nproc\ncmake --build . --config RelWithDebInfo --parallel $nproc --target install\ninstall_license ../Copyright.txt ../LICENSE\n"""
