        lazy_artifacts = false
        name = "Valhalla"
        platforms = ["i686-linux-gnu-cxx03", "i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx03", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx03", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx03", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx03", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
        script = """cd $WORKSPACE/srcdir/valhalla/\n\n# Handle Mac SDK <10.14 errors\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    # Install a newer SDK which supports C++20\n    pushd $WORKSPACE/srcdir/MacOSX12.*.sdk\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/*\n    cp -ra usr/* \"/opt/${target}/${target}/sys-root/usr/.\"\n    cp -ra System \"/opt/${target}/${target}/sys-root/.\"\n    popd\n    export MACOSX_DEPLOYMENT_TARGET=12.3\nfi\n\ngit submodule update --init --recursive\n\n# Help cmake find protoc exec for host, protoc libs for target\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/protoc-find-exec.patch\n\n# Improve compatibility with more recent CXX20 oriented gcc version\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/fix-template-id-cdtor-error.patch\n\nif [[ \"${target}\" == *freebsd* ]]; then\n    cd third_party/cpp-statsd-client\n    atomic_patch -p1 ${WORKSPACE}/srcdir/patches/cpp-statsd-client.patch\n    cd ../../\nfi\n\nif [[ \"${target}\" == *freebsd* ]] || [[ \"${target}\" == *mingw* ]]; then\n    # FreeBSD, Mingw don't seem to ship a lz4.pc file\n    mv ${WORKSPACE}/srcdir/patches/liblz4.pc ${prefix}/lib/pkgconfig/\nfi\n\nmkdir build && cd build\n\nCMAKE_FLAGS=(\n    -DCMAKE_INSTALL_PREFIX=$prefix\n    -DCMAKE_BUILD_TYPE=Release\n    -DCMAKE_PREFIX_PATH=${prefix}\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\n    -DBUILD_SHARED_LIBS=ON\n    -DENABLE_SERVICES=OFF\n    -DENABLE_TOOLS=ON\n    -DENABLE_CCACHE=OFF\n    -DENABLE_DATA_TOOLS=OFF\n    -DENABLE_PYTHON_BINDINGS=OFF\n    -DENABLE_BENCHMARKS=OFF\n    -DENABLE_TESTS=OFF\n    -DENABLE_GDAL=OFF\n    -DPROTOBUF_INCLUDE_DIRS=${includedir}\n    -DPROTOBUF_LIBRARIES=${libdir}/libprotobuf.${dlext}\n    -DPROTOBUF_PROTOC_LIBRARIES=${libdir}/libprotoc.${dlext}\n    -DProtobuf_LITE_LIBRARIES=${libdir}/libprotobuf-lite.${dlext}\n    -DPROTOBUF_PROTOC_EXECUTABLE=${host_bindir}/protoc\n    -DLOGGING_LEVEL=DEBUG\n    -DCMAKE_CXX_STANDARD=17\n)\n\ncmake \"${CMAKE_FLAGS[@]}\" ..\n\nmake -j${nproc}\nmake -j${nproc} install\n\ninstall_license ../LICENSE.md\n"""
        version = "v3.5.1"

