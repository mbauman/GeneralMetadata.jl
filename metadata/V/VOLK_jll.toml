        ["2.5.0+0".artifact_metadata.metadata]
        init_block = ""
        julia_compat = "1.6"
        lazy_artifacts = false
        name = "VOLK"
        platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
        script = """cd $WORKSPACE/srcdir/volk-*\n\nif [[ ${target} == *-freebsd* ]]; then\n    #this is not in 0.6.0 release, but has been added on master, can probably remove after next release\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/add-freebsd-macros.patch\"\nelif [[ ${target} == x86_64-w64-mingw* ]]; then\n    #disable avx512 on x86_64-mingw to avoid \"Error: invalid register for .seh_savexmm\". This is not needed on i686-mingw for some reason?\n    #copied from https://github.com/xianyi/OpenBLAS/issues/1801 \n    export CFLAGS=\"${CFLAGS} -fno-asynchronous-unwind-tables\"\nfi\n\nmkdir build\ncd build/\n\npip install mako\n\ncmake .. \\\n-DCMAKE_INSTALL_PREFIX=${prefix} \\\n-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n-DCMAKE_BUILD_TYPE=Release \\\n-DCROSSCOMPILE_MULTILIB=true \\\n-DENABLE_TESTING=OFF \\\n-DENABLE_MODTOOL=OFF\n\n\nmake -j${nproc}\nmake install\n\n"""
        version = "v2.5.0"

