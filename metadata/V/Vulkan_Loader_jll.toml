        ["1.3.243+0".artifact_metadata.metadata]
        augment_platform_block = ""
        init_block = ""
        julia_compat = "1.6"
        lazy_artifacts = false
        name = "Vulkan_Loader"
        platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
        script = """\nif [[ \"${target}\" == *-mingw* ]]; then\n    cd $WORKSPACE/srcdir/mingw*/mingw-w64-headers\n    ./configure --prefix=/opt/$target/$target/sys-root --enable-sdk=all --host=$target\n    make install\n\n    cd ../mingw-w64-crt/\n    if [ ${target} == \"i686-w64-mingw32\" ]; then\n        _crt_configure_args=\"--disable-lib64 --enable-lib32\"\n    elif [ ${target} == \"x86_64-w64-mingw32\" ]; then\n        _crt_configure_args=\"--disable-lib32 --enable-lib64\"\n    fi\n    ./configure --prefix=/opt/$target/$target/sys-root --enable-sdk=all --host=$target --enable-wildcard ${_crt_configure_args}\n    make -j${nproc}\n    make install\n\n    cd ../mingw-w64-libraries/winpthreads\n    ./configure --prefix=/opt/$target/$target/sys-root --host=$target --enable-static --enable-shared\n    make -j${nproc}\n    make install\n\n    cd $WORKSPACE/srcdir\nfi\n\ncd Vulkan-Loader\n\ninstall_license LICENSE.txt\n\nCMAKE_FLAGS=()\n\n# Setup cross-compilation toolchain\nCMAKE_FLAGS+=(-DCMAKE_PREFIX_PATH=${prefix} -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN})\n\n# Release build\nCMAKE_FLAGS+=(-DCMAKE_BUILD_TYPE=Release)\n\n# Install things into $prefix\nCMAKE_FLAGS+=(-DCMAKE_INSTALL_PREFIX=${prefix})\n\n# Install things into $prefix\nCMAKE_FLAGS+=(-DCMAKE_INSTALL_LIBDIR=${libdir})\n\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    CMAKE_FLAGS+=(-DUSE_MASM=OFF)\nelif [[ \"${target}\" == aarch64-linux-* ]]; then\n    CMAKE_FLAGS+=(-DUSE_GAS=OFF)\nelif [[ \"${target}\" == *-mingw* ]]; then\n    CMAKE_FLAGS+=(-DUSE_MASM=OFF -DENABLE_WERROR=OFF)\nfi\n\ncmake -B build -S . -GNinja ${CMAKE_FLAGS[@]}\nninja -C build -j ${nproc} install\n"""
        version = "v1.3.243"

