        script = """macos_sdk_version=10.13\nmacosx_deployment_target=10.13\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    # extract the tarball into the sys-root so all compilers pick it up\n    # automatically, and use --warning=no-unknown-keyword to hide harmless\n    # warnings about unsupported pax header keywords like \"SCHILY.fflags\"\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        --warning=no-unknown-keyword \\\n        MacOSX${macos_sdk_version}.sdk/System \\\n        MacOSX${macos_sdk_version}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd scipoptsuite*\n\n# for soplex threadlocal\nexport CXXFLAGS=\"-DTHREADLOCAL=''\"\n\n# Enable large file support on mingw\nif [[ \"${target}\" == *-mingw* ]]; then\n    export CXXFLAGS=\"-Wa,-mbig-obj\"\nfi\n\n# Patch to fix linking with gfortran's library on mingw\n# https://github.com/JuliaPackaging/Yggdrasil/pull/8224#issuecomment-2034941690\natomic_patch -p0 $WORKSPACE/srcdir/patches/papilo_cmake.patch\n\nmkdir build\ncd build/\ncmake -DCMAKE_INSTALL_PREFIX=$prefix\\\n  -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\\\n  -DCMAKE_BUILD_TYPE=Release\\\n  -DZIMPL=OFF\\\n  -DUG=0\\\n  -DAMPL=0\\\n  -DGCG=0\\\n  -DBOOST=ON\\\n  -DMPFR=ON\\\n  -DSYM=snauty\\\n  -DTPI=tny\\\n  -DIPOPT_DIR=${prefix} \\\n  -DIPOPT_LIBRARIES=${libdir} \\\n  -DBLISS_INCLUDE_DIR=${includedir} \\\n  -DBLISS_LIBRARY=bliss \\\n  -DBUILD_TESTING=OFF \\\n  ..\nmake -j${nproc} scip\nmake papilo-executable\n\nmake install\ncp bin/papilo${exeext} \"${bindir}/papilo${exeext}\"\n\nmkdir -p ${prefix}/share/licenses/SCIP_PaPILO\nfor dir in scip soplex gcg papilo; do\n    cp $WORKSPACE/srcdir/scipoptsuite*/${dir}/LICENSE ${prefix}/share/licenses/SCIP_PaPILO/LICENSE_${dir}\ndone\n"""
