        ["1000.0.2+0".artifact_metadata.metadata]
        augment_platform_block = ""
        init_block = ""
        julia_compat = "1.9"
        lazy_artifacts = false
        name = "SCIP"
        platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
        script = """macos_sdk_version=10.13\nmacosx_deployment_target=10.13\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    # extract the tarball into the sys-root so all compilers pick it up\n    # automatically, and use --warning=no-unknown-keyword to hide harmless\n    # warnings about unsupported pax header keywords like \"SCHILY.fflags\"\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        --warning=no-unknown-keyword \\\n        MacOSX${macos_sdk_version}.sdk/System \\\n        MacOSX${macos_sdk_version}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\n# needed for now\n# clock_gettime requires linking to librt -lrt with old glibc\n# remove when CMake accounts for this\nif [[ \"${target}\" == *86*-linux-gnu ]]; then\n   export LDFLAGS=\"-lrt\"\nelif [[ \"${target}\" == *-mingw* ]]; then\n   # this is required to link to bliss on mingw\n   export LDFLAGS=-L${libdir}\nfi\n\ncd scipoptsuite*\n\nmkdir build\ncd build/\ncmake -DCMAKE_INSTALL_PREFIX=$prefix\\\n  -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\\\n  -DCMAKE_BUILD_TYPE=Release\\\n  -DPAPILO=0\\\n  -DZIMPL=OFF\\\n  -DGCG=0\\\n  -DUG=0\\\n  -DAMPL=0\\\n  -DBOOST=ON\\\n  -DMPFR=ON\\\n  -DSYM=snauty\\\n  -DTPI=tny\\\n  -DIPOPT_DIR=${prefix} \\\n  -DIPOPT_LIBRARIES=${libdir} \\\n  ..\nmake -j${nproc}\nmake install\n\nmkdir -p ${prefix}/share/licenses/SCIP\n# Move all licenses installed by SCIP to the correct folder for the JLL\nmv -v ${prefix}/share/licenses/scip ${prefix}/share/licenses/SCIP\nmv -v ${prefix}/share/licenses/soplex ${prefix}/share/licenses/SCIP\n"""
        version = "v1000.0.2"

