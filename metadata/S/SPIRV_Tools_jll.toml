        ["2025.4.0+0".artifact_metadata.metadata]
        augment_platform_block = ""
        init_block = ""
        julia_compat = "1.6"
        lazy_artifacts = false
        name = "SPIRV_Tools"
        platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
        script = """# use CMake from JLLs\napk del cmake\n\n# put vendored dependencies in places they will be picked up by the build system\nmv effcee SPIRV-Tools/external/effcee\nmv re2 SPIRV-Tools/external/re2\nmv googletest SPIRV-Tools/external/googletest\nmv SPIRV-Headers SPIRV-Tools/external/spirv-headers\n\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    pushd $WORKSPACE/srcdir/MacOSX10.*.sdk\n    rm -rf /opt/${target}/${target}/sys-root/System\n    cp -ra usr/* \"/opt/${target}/${target}/sys-root/usr/.\"\n    cp -ra System \"/opt/${target}/${target}/sys-root/.\"\n    export MACOSX_DEPLOYMENT_TARGET=10.15\n    popd\nfi\n\ncd SPIRV-Tools\ninstall_license LICENSE\n\nCMAKE_FLAGS=()\n\n# Release build for best performance\nCMAKE_FLAGS+=(-DCMAKE_BUILD_TYPE=Release)\n\n# Build all shared libraries (downstream projects seem to depend on it)\nCMAKE_FLAGS+=(-DBUILD_SHARED_LIBS=ON)\nCMAKE_FLAGS+=(-DSPIRV_TOOLS_BUILD_STATIC=OFF)\n\n# Install things into $prefix\nCMAKE_FLAGS+=(-DCMAKE_INSTALL_PREFIX=${prefix})\n\n# Explicitly use our cmake toolchain file\nCMAKE_FLAGS+=(-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN})\n\n# Skip tests\nCMAKE_FLAGS+=(-DSPIRV_SKIP_TESTS=ON)\n\n# Don't use -Werror\nCMAKE_FLAGS+=(-DSPIRV_WERROR=OFF)\n\ncmake -B build -S . -GNinja ${CMAKE_FLAGS[@]}\nninja -C build -j ${nproc} install\n\n# Remove unwanted static libraries\nrm -f $prefix/lib/*.a\n"""
        version = "v2025.4.0"

