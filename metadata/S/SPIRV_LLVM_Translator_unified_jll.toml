        script = ["""cd SPIRV-LLVM-Translator\ninstall_license LICENSE.TXT\n\nCMAKE_FLAGS=()\n\n# Release build for best performance\nCMAKE_FLAGS+=(-DCMAKE_BUILD_TYPE=Release)\n\n# Install things into $prefix\nCMAKE_FLAGS+=(-DCMAKE_INSTALL_PREFIX=${prefix})\n\n# Explicitly use our cmake toolchain file and tell CMake we're cross-compiling\nCMAKE_FLAGS+=(-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN})\nCMAKE_FLAGS+=(-DCMAKE_CROSSCOMPILING:BOOL=ON)\n\n# Tell CMake where LLVM is\nCMAKE_FLAGS+=(-DLLVM_DIR=\"${prefix}/lib/cmake/llvm\")\n\n# Build the library\nCMAKE_FLAGS+=(-DBUILD_SHARED_LIBS=ON)\n\n# Use our LLVM version\nCMAKE_FLAGS+=(-DBASE_LLVM_VERSION=13.0.0)\n\n# Suppress certain errors\nCMAKE_FLAGS+=(-DCMAKE_CXX_FLAGS=\"-Wno-enum-constexpr-conversion\")\n\ncmake -B build -S . -GNinja ${CMAKE_FLAGS[@]}\nninja -C build -j ${nproc} llvm-spirv install\ninstall -Dm755 build/tools/llvm-spirv/llvm-spirv${exeext} -t ${bindir}\n""", """cd SPIRV-LLVM-Translator\ninstall_license LICENSE.TXT\n\nCMAKE_FLAGS=()\n\n# Release build for best performance\nCMAKE_FLAGS+=(-DCMAKE_BUILD_TYPE=Release)\n\n# Install things into $prefix\nCMAKE_FLAGS+=(-DCMAKE_INSTALL_PREFIX=${prefix})\n\n# Explicitly use our cmake toolchain file and tell CMake we're cross-compiling\nCMAKE_FLAGS+=(-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN})\nCMAKE_FLAGS+=(-DCMAKE_CROSSCOMPILING:BOOL=ON)\n\n# Tell CMake where LLVM is\nCMAKE_FLAGS+=(-DLLVM_DIR=\"${prefix}/lib/cmake/llvm\")\n\n# Build the library\nCMAKE_FLAGS+=(-DBUILD_SHARED_LIBS=ON)\n\n# Use our LLVM version\nCMAKE_FLAGS+=(-DBASE_LLVM_VERSION=14.0.0)\n\n# Suppress certain errors\nCMAKE_FLAGS+=(-DCMAKE_CXX_FLAGS=\"-Wno-enum-constexpr-conversion\")\n\ncmake -B build -S . -GNinja ${CMAKE_FLAGS[@]}\nninja -C build -j ${nproc} llvm-spirv install\ninstall -Dm755 build/tools/llvm-spirv/llvm-spirv${exeext} -t ${bindir}\n""", """cd SPIRV-LLVM-Translator\ninstall_license LICENSE.TXT\n\nCMAKE_FLAGS=()\n\n# Release build for best performance\nCMAKE_FLAGS+=(-DCMAKE_BUILD_TYPE=Release)\n\n# Install things into $prefix\nCMAKE_FLAGS+=(-DCMAKE_INSTALL_PREFIX=${prefix})\n\n# Explicitly use our cmake toolchain file and tell CMake we're cross-compiling\nCMAKE_FLAGS+=(-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN})\nCMAKE_FLAGS+=(-DCMAKE_CROSSCOMPILING:BOOL=ON)\n\n# Tell CMake where LLVM is\nCMAKE_FLAGS+=(-DLLVM_DIR=\"${prefix}/lib/cmake/llvm\")\n\n# Build the library\nCMAKE_FLAGS+=(-DBUILD_SHARED_LIBS=ON)\n\n# Use our LLVM version\nCMAKE_FLAGS+=(-DBASE_LLVM_VERSION=15.0.0)\n\n# Suppress certain errors\nCMAKE_FLAGS+=(-DCMAKE_CXX_FLAGS=\"-Wno-enum-constexpr-conversion\")\n\ncmake -B build -S . -GNinja ${CMAKE_FLAGS[@]}\nninja -C build -j ${nproc} llvm-spirv install\ninstall -Dm755 build/tools/llvm-spirv/llvm-spirv${exeext} -t ${bindir}\n""", """cd SPIRV-LLVM-Translator\ninstall_license LICENSE.TXT\n\nCMAKE_FLAGS=()\n\n# Release build for best performance\nCMAKE_FLAGS+=(-DCMAKE_BUILD_TYPE=Release)\n\n# Install things into $prefix\nCMAKE_FLAGS+=(-DCMAKE_INSTALL_PREFIX=${prefix})\n\n# Explicitly use our cmake toolchain file and tell CMake we're cross-compiling\nCMAKE_FLAGS+=(-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN})\nCMAKE_FLAGS+=(-DCMAKE_CROSSCOMPILING:BOOL=ON)\n\n# Tell CMake where LLVM is\nCMAKE_FLAGS+=(-DLLVM_DIR=\"${prefix}/lib/cmake/llvm\")\n\n# Build the library\nCMAKE_FLAGS+=(-DBUILD_SHARED_LIBS=ON)\n\n# Use our LLVM version\nCMAKE_FLAGS+=(-DBASE_LLVM_VERSION=16.0.0)\n\n# Suppress certain errors\nCMAKE_FLAGS+=(-DCMAKE_CXX_FLAGS=\"-Wno-enum-constexpr-conversion\")\n\ncmake -B build -S . -GNinja ${CMAKE_FLAGS[@]}\nninja -C build -j ${nproc} llvm-spirv install\ninstall -Dm755 build/tools/llvm-spirv/llvm-spirv${exeext} -t ${bindir}\n""", """cd SPIRV-LLVM-Translator\ninstall_license LICENSE.TXT\n\nCMAKE_FLAGS=()\n\n# Release build for best performance\nCMAKE_FLAGS+=(-DCMAKE_BUILD_TYPE=Release)\n\n# Install things into $prefix\nCMAKE_FLAGS+=(-DCMAKE_INSTALL_PREFIX=${prefix})\n\n# Explicitly use our cmake toolchain file and tell CMake we're cross-compiling\nCMAKE_FLAGS+=(-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN})\nCMAKE_FLAGS+=(-DCMAKE_CROSSCOMPILING:BOOL=ON)\n\n# Tell CMake where LLVM is\nCMAKE_FLAGS+=(-DLLVM_DIR=\"${prefix}/lib/cmake/llvm\")\n\n# Build the library\nCMAKE_FLAGS+=(-DBUILD_SHARED_LIBS=ON)\n\n# Use our LLVM version\nCMAKE_FLAGS+=(-DBASE_LLVM_VERSION=17.0.0)\n\n# Suppress certain errors\nCMAKE_FLAGS+=(-DCMAKE_CXX_FLAGS=\"-Wno-enum-constexpr-conversion\")\n\ncmake -B build -S . -GNinja ${CMAKE_FLAGS[@]}\nninja -C build -j ${nproc} llvm-spirv install\ninstall -Dm755 build/tools/llvm-spirv/llvm-spirv${exeext} -t ${bindir}\n"""]
