        name = "ITK"
        platforms = ["x86_64-linux-gnu-cxx03", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx03", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx03", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx03", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx03", "powerpc64le-linux-gnu-cxx11", "aarch64-linux-musl-cxx03", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx03", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx03", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-w64-mingw32-cxx03", "x86_64-w64-mingw32-cxx11"]
        script = """if [[ \"${target}\" == *x86_64-w64-mingw32* ]]; then\n    CONFIG=msys2-64\n    OS=Windows\n    # Add Windows-specific flags\n    export CXXFLAGS=\"-DITK_LEGACY_REMOVE=OFF -DVNL_DLL_DATA= -DITK_EXPORTS ${CXXFLAGS}\"\n    export CFLAGS=\"${CFLAGS} -DVNL_DLL_DATA= -DITK_EXPORTS\"\nelse\n    export CXXFLAGS=\"-DITK_LEGACY_REMOVE=OFF ${CXXFLAGS}\"\nfi\n\nexport LDFLAGS=\"-L${libdir}\"\n\ncd $WORKSPACE/srcdir/ITK*\nmkdir build/\ncmake -B build -S . \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DBUILD_SHARED_LIBS:BOOL=ON \\\n    -DITK_USE_SYSTEM_EXPAT:BOOL=ON \\\n    -DITK_USE_SYSTEM_FFTW:BOOL=ON \\\n    -DITK_USE_SYSTEM_HDF5:BOOL=ON \\\n    -DITK_USE_SYSTEM_JPEG:BOOL=ON \\\n    -DITK_USE_SYSTEM_TIFF:BOOL=ON \\\n    -DITK_USE_SYSTEM_PNG:BOOL=ON \\\n    -DITK_USE_SYSTEM_EIGEN:BOOL=ON \\\n    -DITK_USE_SYSTEM_ZLIB:BOOL=ON \\\n    -DQNANHIBIT_VALUE:BOOL=0 \\\n    -DQNANHIBIT_VALUE__TRYRUN_OUTPUT:STRING=0 \\\n    -DVXL_HAS_SSE2_HARDWARE_SUPPORT:STRING=1 \\\n    -DVCL_HAS_LFS:STRING=1 \\\n    -DDOUBLE_CONVERSION_CORRECT_DOUBLE_OPERATIONS:STRING=1 \\\n    -DHAVE_CLOCK_GETTIME_RUN:STRING=0 \\\n    -D_libcxx_run_result:STRING=0 \\\n    -D_libcxx_run_result__TRYRUN_OUTPUT:STRING=0 \\\n    -DITK_LEGACY_REMOVE=OFF \\\n    -DITK_BUILD_TESTING=OFF \\\n    -DBUILD_TESTING=OFF \\\n    -DITK_USE_WIN32_LIBS=ON \\\n    -DITK_SKIP_PATH_LENGTH_CHECKS=ON\n\ncmake --build build --parallel ${nproc}\ncmake --install build\ninstall_license ${WORKSPACE}/srcdir/ITK/LICENSE\n\nif [[ \"${target}\" == *x86_64-w64-mingw32* ]]; then\nmkdir -pv ${libdir}\nfind \"${prefix}/lib\" -name \"*.${dlext}\" -exec mv -v {} ${libdir} \\;\nfi\n"""
