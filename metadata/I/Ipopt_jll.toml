        script = """cd $WORKSPACE/srcdir/Ipopt*\n\n# Remove misleading libtool files\nrm -f ${prefix}/lib/*.la\n\nLIBASL=\"-lasl\"\nif [[ \"${target}\" == *-linux-* ]]; then\n  LIBASL=\"${LIBASL} -lrt\"\nfi\n\nexport CPPFLAGS=\"${CPPFLAGS} -I${includedir} -I${includedir}/coin\"\n\nif [[ ${target} == *mingw* ]]; then\n    export LDFLAGS=\"-L${libdir}\"\nfi\n\n# BLAS and LAPACK\nif [[ \"${target}\" == *mingw* ]]; then\n  LBT=\"-lblastrampoline-5\"\nelse\n  LBT=\"-lblastrampoline\"\nfi\n\n./configure \\\n    CFLAGS=\"-O3 -DNDEBUG\" \\\n    CXXFLAGS=\"-O3 -DNDEBUG\" \\\n    FFLAGS=\"-O3\" \\\n    FCFLAGS=\"-O3\" \\\n    --prefix=${prefix} \\\n    --build=${MACHTYPE} \\\n    --host=${target} \\\n    --enable-shared \\\n    --enable-static \\\n    --with-pic \\\n    --disable-dependency-tracking \\\n    lt_cv_deplibs_check_method=pass_all \\\n    --with-lapack-lflags=\"-L${libdir} ${LBT}\" \\\n    --with-mumps-cflags=\"-I${includedir}\" \\\n    --with-mumps-lflags=\"-L${libdir} -ldmumps\" \\\n    --with-spral-cflags=\"-I${includedir}\" \\\n    --with-spral-lflags=\"-L${libdir} -lspral\" \\\n    --with-asl-lflags=\"-L${libdir} ${LIBASL}\"\n\nmake -j${nproc}\nmake install\n"""
        version = "v300.1400.1300"

