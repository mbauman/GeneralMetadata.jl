        ["1.18.5+1".artifact_metadata.metadata]
        augment_platform_block = ""
        init_block = ""
        julia_compat = "1.6"
        lazy_artifacts = false
        name = "Cairo"
        platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
        script = """cd $WORKSPACE/srcdir/cairo*\n\n# Add nipc_rmid_deferred_release = false for non linux builds to avoid running test\nif [[ \"${target}\" != x86_64-linux-* ]]; then\n    sed -i -e \"s~cmake_defaults = .*~cmake_defaults = false\\nipc_rmid_deferred_release = false~\" ${MESON_TARGET_TOOLCHAIN}\nelif [[ \"${target}\" == \"${MACHTYPE}\" ]]; then\n    # Remove system libexpat to avoid confusion\n    rm /usr/lib/libexpat.so*\nfi\n\nif [[ \"${target}\" == *-freebsd* ]]; then\n    # Fix the error: undefined reference to `backtrace_symbols'\n    sed -i -e \"s~c_link_args = .*~c_link_args = ['-L${includedir}', '-lexecinfo']~\" ${MESON_TARGET_TOOLCHAIN}\n    sed -i -e \"s~cpp_link_args = .*~cpp_link_args = ['-L${libdir}', '-lexecinfo']~\" ${MESON_TARGET_TOOLCHAIN}\nfi\n\nmkdir output && cd output\n\nmeson .. --cross-file=${MESON_TARGET_TOOLCHAIN} \\\n    -Dfreetype=enabled \\\n    -Dfontconfig=enabled \\\n    -Dtee=enabled \\\n    -Dpng=enabled \\\n    -Dzlib=enabled \\\n    -Dglib=enabled \\\n    -Ddefault_library=shared \\\n    -Dtests=disabled \\\n    -Ddwrite=disabled\n\nif [[ \"${target}\" == *apple* ]]; then\n    # Fix the error: undefined reference to `backtrace_symbols'\n    sed -i -e \"s~HAVE_CXX11_ATOMIC_PRIMITIVES~HAVE_OS_ATOMIC_OPS~\" config.h\n    echo \"#define SIZEOF_VOID_P 8\" >> config.h\n    echo \"#define HAVE_UINT64_T 1\" >> config.h\n    echo \"#define HAVE_FT_SVG_DOCUMENT 1\" >> config.h\nfi\n\nninja -j${nproc}\nninja install\n"""
        version = "v1.18.5"

