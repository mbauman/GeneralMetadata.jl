fix}/cuda/lib/x64/*.lib; do\n        [[ ${lib} == *cudadevrt.lib ]] && continue\n        rm ${lib}\n    done\n\n    # fixup\n    chmod +x ${prefix}/cuda/bin/*.{exe,dll}\n\n    # clean-up\n    rm ${prefix}/cuda/*.nvi\nfi\n\nrm -rf ${temp}\n\ncd ${prefix}/cuda\ninstall_license EULA.txt\n"""
