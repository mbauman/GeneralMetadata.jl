        platforms = ["x86_64-linux-gnu", "x86_64-apple-darwin", "x86_64-w64-mingw32", "aarch64-linux-gnu"]
        products = []
        script = """if [[ ${target} == aarch64-linux-gnu ]]; then\n    echo \"cuda-license-10-2_10.2.89-1_arm64.deb\ncuda-nvdisasm-10-2_10.2.89-1_arm64.deb\ncuda-cuobjdump-10-2_10.2.89-1_arm64.deb\ncuda-gdb-10-2_10.2.89-1_arm64.deb\ncuda-nvprof-10-2_10.2.89-1_arm64.deb\ncuda-memcheck-10-2_10.2.89-1_arm64.deb\ncuda-cudart-10-2_10.2.89-1_arm64.deb\ncuda-driver-dev-10-2_10.2.89-1_arm64.deb\ncuda-cudart-dev-10-2_10.2.89-1_arm64.deb\ncuda-misc-headers-10-2_10.2.89-1_arm64.deb\ncuda-nvcc-10-2_10.2.89-1_arm64.deb\ncuda-cupti-10-2_10.2.89-1_arm64.deb\ncuda-cupti-dev-10-2_10.2.89-1_arm64.deb\ncuda-nvtx-10-2_10.2.89-1_arm64.deb\ncuda-command-line-tools-10-2_10.2.89-1_arm64.deb\ncuda-nvprune-10-2_10.2.89-1_arm64.deb\ncuda-compiler-10-2_10.2.89-1_arm64.deb\ncuda-cufft-10-2_10.2.89-1_arm64.deb\ncuda-cufft-dev-10-2_10.2.89-1_arm64.deb\ncuda-curand-10-2_10.2.89-1_arm64.deb\ncuda-curand-dev-10-2_10.2.89-1_arm64.deb\ncuda-cusolver-10-2_10.2.89-1_arm64.deb\ncuda-cusolver-dev-10-2_10.2.89-1_arm64.deb\ncuda-cusparse-10-2_10.2.89-1_arm64.deb\ncuda-cusparse-dev-10-2_10.2.89-1_arm64.deb\ncuda-nvrtc-10-2_10.2.89-1_arm64.deb\ncuda-nvrtc-dev-10-2_10.2.89-1_arm64.deb\nlibcublas10_10.2.2.89-1_arm64.deb\nlibcublas-dev_10.2.2.89-1_arm64.deb\ncuda-npp-10-2_10.2.89-1_arm64.deb\ncuda-npp-dev-10-2_10.2.89-1_arm64.deb\ncuda-nvgraph-10-2_10.2.89-1_arm64.deb\ncuda-nvgraph-dev-10-2_10.2.89-1_arm64.deb\ncuda-libraries-10-2_10.2.89-1_arm64.deb\ncuda-libraries-dev-10-2_10.2.89-1_arm64.deb\ncuda-nvml-dev-10-2_10.2.89-1_arm64.deb\ncuda-tools-10-2_10.2.89-1_arm64.deb\ncuda-toolkit-10-2_10.2.89-1_arm64.deb\" >> ${WORKSPACE}/srcdir/aarch64-linux-gnu_install.manifest\nfi\ncd ${WORKSPACE}/srcdir\n\n# use a temporary directory to avoid running out of tmpfs in srcdir on Travis\ntemp=${WORKSPACE}/tmpdir\nmkdir ${temp}\n\napk add p7zip\n\nmkdir ${prefix}/cuda\nif [[ ${target} == x86_64-linux-gnu ]]; then\n    sh installer.run --tmpdir=\"${temp}\" --target \"${temp}\" --noexec\n    cd ${temp}/builds/cuda-toolkit\n    find .\n\n    # clean-up\n    rm -r libnsight libnvvp nsightee_plugins nsight-compute-2019.5.0 nsight-systems-2019.5.2 doc\n\n    mv * ${prefix}/cuda\nelif [[ ${target} == x86_64-apple-darwin* ]]; then\n    7z x installer.dmg 5.hfs -o${temp}\n    cd ${temp}\n    7z x 5.hfs\n    tar -zxf CUDAMacOSXInstaller/CUDAMacOSXInstaller.app/Contents/Resources/payload/cuda_mac_installer_tk.tar.gz\n    cd Developer/NVIDIA/CUDA-*/\n    find .\n\n    # clean-up\n    rm -r libnsight libnvvp nsightee_plugins nsight-compute-2019.5.0 NsightSystems-2019.5.2.16 doc\n\n    mv * ${prefix}/cuda\nelif [[ ${target} == x86_64-w64-mingw32 ]]; then\n    7z x installer.exe -o${temp}\n    cd ${temp}\n    find .\n\n    mv EULA.txt ${prefix}/cuda\n\n    for project in cuobjdump memcheck nvcc cupti nvdisasm curand cusparse npp cufft \\\n                   cublas cudart cusolver nvrtc nvgraph nvprof nvprune; do\n        [[ -d ${project} ]] || { echo \"${project} does not exist!\"; exit 1; }\n        cp -a ${project}/* ${prefix}/cuda\n    done\n\n    # NVIDIA Tools Extension Library\n    7z x \"CUDAVisualStudioIntegration/NVIDIA NVTX Installer.x86_64\".*.msi -o${temp}/nvtx_installer\n    find nvtx_installer\n    for file in nvtx_installer/*.*_*; do\n        mv $file $(echo $file | sed 's/\\.\\(\\w*\\)_.*/.\\1/')\n    done\n    mv nvtx_installer/*.dll ${prefix}/cuda/bin\n    mv nvtx_installer/*64_*.lib ${prefix}/cuda/lib/x64\n    mv nvtx_installer/*32_*.lib ${prefix}/cuda/lib/Win32\n    mv nvtx_installer/*.h ${prefix}/cuda/include\n\n    # fixup\n    chmod +x ${prefix}/cuda/bin/*.{exe,dll}\n\n    # clean-up\n    rm ${prefix}/cuda/*.nvi\nelif [[ ${target} == aarch64-linux-gnu ]]; then\n    apk add dpkg\n    cat ${target}_install.manifest | xargs -t -Ideb_file dpkg-deb -x deb_file $temp\n    find $temp\n    mv $temp/usr/local/cuda-10.2/* ${prefix}/cuda\n\n    # Fix location of include/cuda/std\n    mv ${prefix}/cuda/include/cuda/std ${prefix}/cuda/include/cuda/std_\n    mv ${prefix}/cuda/include/cuda/std_/std ${prefix}/cuda/include/cuda/std\n    rmdir ${prefix}/cuda/include/cuda/std_\n\n    rsync -aOv --remove-source-files $temp/usr/include/ ${prefix}/cuda/targets/aarch64-linux/include/\n    rsync -aOv --remove-source-files $temp/usr/lib/$target/ ${prefix}/cuda/targets/aarch64-linux/lib/\n\n    # Move CUPTI into same paths as CUPTI on x86_64-linux-gnu\n    mkdir $prefix/cuda/extras/CUPTI/{include,lib64}\n    CUDA_TARGETS_REGEX='./usr/local/cuda-10.2/(targets/[^ ]+).*$'\n    CUPTI_PKGS=\"cuda-cupti-10-2 cuda-cupti-dev-10-2\"\n    CUPTI_PATHS=\"\"\n    for CUPTI_PKG in $CUPTI_PKGS; do\n        CUPTI_PATHS+=\" \"`dpkg-deb -c $CUPTI_PKG* | grep -E \"$CUDA_TARGETS_REGEX\" | sed -E -e \"s#.*$CUDA_TARGETS_REGEX#\\1#\"`\n    done\n    for CUPTI_PATH in $CUPTI_PATHS; do\n        CUPTI_PATH=$prefix/cuda/$CUPTI_PATH\n        [ -f $CUPTI_PATH ] || [ -L $CUPTI_PATH ] && [[ $CUPTI_PATH == */include* ]] && mv -nv $CUPTI_PATH $prefix/cuda/extras/CUPTI/include\n        [ -f $CUPTI_PATH ] || [ -L $CUPTI_PATH ] && [[ $CUPTI_PATH == */lib* ]] && mv -nv $CUPTI_PATH $prefix/cuda/extras/CUPTI/lib64\n    done\n\n    mv ${prefix}/cuda/doc/EULA.txt ${prefix}/cuda\n    rmdir ${prefix}/cuda/doc\nfi\n\ncd ${prefix}/cuda\ninstall_license EULA.txt\n"""
