        ["3.7.1+0".artifact_metadata.metadata]
        augment_platform_block = ""
        init_block = ""
        julia_compat = "1.9"
        lazy_artifacts = false
        name = "casacore"
        platforms = ["i686-linux-gnu-libgfortran5-cxx11", "x86_64-linux-gnu-libgfortran5-cxx11", "aarch64-linux-gnu-libgfortran5-cxx11", "armv6l-linux-gnueabihf-libgfortran5-cxx11", "armv7l-linux-gnueabihf-libgfortran5-cxx11", "powerpc64le-linux-gnu-libgfortran5-cxx11", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5"]
        script = """cd $WORKSPACE/srcdir/casacore\n\napk del cmake\n\nmkdir build && cd build\nCMAKE_FLAGS=()\n\n# Release build for best performance\nCMAKE_FLAGS+=(-DCMAKE_BUILD_TYPE=Release)\n\n# Install things into $prefix\nCMAKE_FLAGS+=(-DCMAKE_INSTALL_PREFIX=${prefix})\n\n# Set the toolchain\nCMAKE_FLAGS+=(-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN})\n\n# Disable OpenMP, it'll probably interfere with Julia's threads\nCMAKE_FLAGS+=(-DUSE_OPENMP=OFF)\n\n# Don't build python hooks\nCMAKE_FLAGS+=(-DBUILD_PYTHON3=OFF)\n\n# Build \"portable\" code\nCMAKE_FLAGS+=(-DPORTABLE=ON)\n\n# Stock FFTW3 has threads already baked in\nCMAKE_FLAGS+=(-DFFTW3_DISABLE_THREADS=yes)\n\n# linux builds need to link against rt (they don't do this for some reason)\nif [[ ${target} == *-linux-* ]]; then\n    CMAKE_FLAGS+=(-DCASACORE_ARCH_LIBS=\"-lrt\")\nfi\n\n# Explicitly link BLAS to LBT\nCMAKE_FLAGS+=(-DBLA_VENDOR=\"libblastrampoline\")\n\n# Configure\n${host_bindir}/cmake ${CMAKE_FLAGS[@]} ..\n\n# Make and install\nmake -j${nproc}\nmake install\nexit\n"""
        version = "v3.7.1"

