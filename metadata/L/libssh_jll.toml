        ["0.10.6+0".artifact_metadata.metadata]
        augment_platform_block = ""
        init_block = ""
        julia_compat = "1.6"
        lazy_artifacts = false
        name = "libssh"
        platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
        script = """# Necessary for cmake to find openssl on Windows\nif [[ ${target} == x86_64-*-mingw* ]]; then\n    export OPENSSL_ROOT_DIR=${prefix}/lib64\nfi\n\nDOC_DIR=${prefix}/usr/share/doc/libssh\n\n# Build and install library\ncd $WORKSPACE/srcdir/libssh-*\nmkdir build\ncd build/\n\n# Kerberos_krb5_jll is only built for Linux and FreeBSD, so GSSAPI support is\n# only available on those platforms.\nif [[ ${target} == *linux* || ${target} == *freebsd* ]]; then\n    export GSSAPI_ENABLED=ON\nelse\n    export GSSAPI_ENABLED=OFF\nfi\n\ncmake -DCMAKE_INSTALL_PREFIX=$prefix -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n                                     -DCMAKE_BUILD_TYPE=Release \\\n                                     -DWITH_GSSAPI=${GSSAPI_ENABLED} \\\n                                     -DWITH_EXAMPLES=OFF \\\n                                     -DDOXYGEN_GENERATE_TAGFILE='tags.xml' ..\nmake -j${nproc}\nmake docs install\n\n# Install Doxygen tagfile\nmkdir -p ${DOC_DIR}\ninstall -Dv ../doc/tags.xml \"${DOC_DIR}/tags.xml\"\n"""
        version = "v0.10.6"

