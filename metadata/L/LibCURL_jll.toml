install only `curl`\n    install -Dm 755 \"src/.libs/curl${exeext}\" \"${bindir}/curl${exeext}\"\nelse\n    # Install everything...\n    make install\n    # ...but remove `curl`\n    rm \"${bindir}/curl${exeext}\"\nfi\ninstall_license COPYING\n"""
