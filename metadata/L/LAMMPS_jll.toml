        script = """# For this specific target during the audit liblammps.so fails to find libgfortran.so\n# This is the same hack as used by MPITrampoline:\n# <https://github.com/JuliaPackaging/Yggdrasil/pull/5028#issuecomment-1166388492>\nif [[ \"${target}\" == x86_64-linux-gnu-cxx11-mpi+mpitrampoline ]]; then\n    INSTALL_RPATH=(-DCMAKE_INSTALL_RPATH='$ORIGIN')\nelse\n    INSTALL_RPATH=()\nfi\n\ncd $WORKSPACE/srcdir/lammps/\nmkdir build && cd build/\ncmake -C ../cmake/presets/most.cmake -C ../cmake/presets/nolib.cmake ../cmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    \"${INSTALL_RPATH[@]}\" \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DLAMMPS_EXCEPTIONS=ON \\\n    -DBUILD_MPI=ON \\\n    -DPKG_EXTRA-FIX=ON \\\n    -DPKG_ML-SNAP=ON \\\n    -DPKG_ML-PACE=ON \\\n    -DPKG_ML-POD=ON \\\n    -DPKG_DPD-BASIC=ON \\\n    -DPKG_DPD-MESO=ON \\\n    -DPKG_DPD-REACT=ON \\\n    -DPKG_DPD-SMOOTH=ON \\\n    -DPKG_USER-MESODPD=ON \\\n    -DPKG_USER-DPD=ON \\\n    -DPKG_USER-SDPD=ON \\\n    -DPKG_MANYBODY=ON \\\n    -DPKG_MOLECULE=ON \\\n    -DPKG_REPLICA=ON \\\n    -DPKG_SHOCK=ON \\\n    -DLEPTON_ENABLE_JIT=no\n\nmake -j${nproc}\nmake install\n\nif [[ \"${target}\" == *mingw* ]]; then\n    cp *.dll ${prefix}/bin/\nfi\n"""
