        name = "Electron"
        platforms = ["x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv7l-linux-gnueabihf-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-w64-mingw32", "i686-w64-mingw32"]
        script = """cd ${WORKSPACE}/srcdir/${target}\n\n# Function to copy critical resource files required for Electron to function\ncopy_electron_resources() {\n    local dest_dir=\"$1\"\n    for file in icudtl.dat v8_context_snapshot.bin snapshot_blob.bin *.pak; do\n        if [[ -f \"$file\" ]]; then\n            cp \"$file\" \"${dest_dir}/$file\"\n        fi\n    done\n}\n\n# Function to copy license files\ncopy_licenses() {\n    if [[ -f \"LICENSE\" ]]; then\n        install_license LICENSE\n    elif [[ -f \"LICENSES.chromium.html\" ]]; then\n        install_license LICENSES.chromium.html\n    fi\n}\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    # Windows structure\n    install -Dvm 0755 \"electron.exe\" \"${bindir}/electron${exeext}\"\n\n    # Copy all necessary DLLs and resources\n    cp -r resources \"${prefix}/resources\"\n    for dll in *.dll; do\n        if [[ -f \"$dll\" ]]; then\n            install -Dvm 0755 \"$dll\" \"${bindir}/$dll\"\n        fi\n    done\n\n    copy_electron_resources \"${bindir}\"\n\n    copy_licenses\n    if [[ -f \"version\" ]]; then\n        cp \"version\" \"${prefix}/version\"\n    fi\nelif [[ \"${target}\" == *-apple-* ]]; then\n    # macOS structure - Electron.app bundle\n    # Note: All resource files (icudtl.dat, v8_context_snapshot.bin, snapshot_blob.bin, *.pak)\n    # are already included in the .app bundle at\n    # Electron.app/Contents/Frameworks/Electron Framework.framework/Versions/A/Resources/\n    if [[ -d \"Electron.app\" ]]; then\n        cp -r Electron.app \"${prefix}/Electron.app\"\n        # Create a wrapper script\n        mkdir -p \"${bindir}\"\n        cat > \"${bindir}/electron\" << 'EOF'\n#!/bin/bash\nDIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")/..\" && pwd)\"\nexec \"$DIR/Electron.app/Contents/MacOS/Electron\" \"$@\"\nEOF\n        chmod +x \"${bindir}/electron\"\n    fi\n\n    copy_licenses\nelse\n    # Linux structure\n    install -Dvm 0755 \"electron\" \"${bindir}/electron${exeext}\"\n\n    # Copy all necessary shared libraries and resources\n    cp -r resources \"${prefix}/resources\"\n    for so in *.so*; do\n        if [[ -f \"$so\" ]]; then\n            install -Dvm 0755 \"$so\" \"${libdir}/$so\"\n        fi\n    done\n\n    copy_electron_resources \"${bindir}\"\n\n    copy_licenses\n    if [[ -f \"version\" ]]; then\n        cp \"version\" \"${prefix}/version\"\n    fi\n    if [[ -d \"locales\" ]]; then\n        cp -r locales \"${prefix}/locales\"\n    fi\nfi\n"""
