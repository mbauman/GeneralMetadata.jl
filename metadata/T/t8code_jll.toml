        script = """macos_sdk_version=14.0\nmacosx_deployment_target=10.14\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    # extract the tarball into the sys-root so all compilers pick it up\n    # automatically, and use --warning=no-unknown-keyword to hide harmless\n    # warnings about unsupported pax header keywords like \"SCHILY.fflags\"\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        --warning=no-unknown-keyword \\\n        MacOSX${macos_sdk_version}.sdk/System \\\n        MacOSX${macos_sdk_version}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd $WORKSPACE/srcdir/t8code\n\n# fetch sc and p4est\ngit submodule init\ngit submodule update\n\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/mpi-constants.patch\"\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/inttypes.patch\"\n\n# Microsoft MPI is still 2.0 but has the required features; remove the strict 3.0 requirement\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/mpi2.patch\"\n\n# Fixes for mingw, which is WIN32 for cmake, but uses Linux syntax\natomic_patch -p1 \"${WORKSPACE}/srcdir/patches/mingw.patch\"\n\n# Show CMake where to find `mpiexec`.\nif [[ \"${target}\" == *-mingw* ]]; then\n  ln -s $(which mpiexec.exe) /workspace/destdir/bin/mpiexec\nfi\n\ncmake . \\\n      -B build \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n      -DCMAKE_CXX_FLAGS=\"-std=c++20\" \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DBUILD_TESTING=OFF \\\n      -DP4EST_BUILD_TESTING=OFF \\\n      -DSC_BUILD_TESTING=OFF \\\n      -DINSTALL_GTEST=OFF \\\n      -DT8CODE_BUILD_BENCHMARKS=OFF \\\n      -DT8CODE_BUILD_DOCUMENTATION=OFF \\\n      -DT8CODE_BUILD_EXAMPLES=OFF \\\n      -DT8CODE_BUILD_FORTRAN_INTERFACE=OFF \\\n      -DT8CODE_BUILD_TESTS=OFF \\\n      -DT8CODE_BUILD_TUTORIALS=OFF \\\n      -DT8CODE_ENABLE_MPI=ON\n\nmake -C build -j ${nproc}\nmake -C build -j ${nproc} install\n"""
