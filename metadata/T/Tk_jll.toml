        script = """macos_sdk_version=11.0\nmacosx_deployment_target=11.0\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    rm -rf /opt/${target}/${target}/sys-root/System\n    rm -rf /opt/${target}/${target}/sys-root/usr/include/libxml2/libxml\n    # extract the tarball into the sys-root so all compilers pick it up\n    # automatically, and use --warning=no-unknown-keyword to hide harmless\n    # warnings about unsupported pax header keywords like \"SCHILY.fflags\"\n    tar --extract \\\n        --file=${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=\"/opt/${target}/${target}/sys-root/.\" \\\n        --strip-components=1 \\\n        --warning=no-unknown-keyword \\\n        MacOSX${macos_sdk_version}.sdk/System \\\n        MacOSX${macos_sdk_version}.sdk/usr\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\nif [[ \"${target}\" == *-mingw* ]]; then\n    cd $WORKSPACE/srcdir/tk/win/\nelse\n    cd $WORKSPACE/srcdir/tk/unix/\nfi\n\nexport CFLAGS=\"-I${prefix}/include ${CFLAGS}\"\n\nFLAGS=(--disable-zipfs --enable-threads --disable-rpath)\nif [[ \"${target}\" == x86_64-* ]] || [[ \"${target}\" == aarch64-* ]]; then\n    FLAGS+=(--enable-64bit)\nfi\nif [[ \"${target}\" == *-apple-* ]]; then\n    FLAGS+=(--with-x=no)\n    FLAGS+=(--enable-aqua=yes)\n\n    # The following patch replaces the hard-coded path of Cocoa framework\n    # with the actual path on our system.\n    atomic_patch -p1 \"${WORKSPACE}/srcdir/patches/apple_cocoa_configure.patch\"\n\n    export LDFLAGS=\"-framework UniformTypeIdentifiers -Wl,-U,___isPlatformVersionAtLeast ${LDFLAGS}\"\nfi\nif [[ \"${target}\" == *mingw* ]]; then\n    FLAGS+=(--with-x=no)\n\n    # `windres` invocations don't get the proper tk include path; just hack it in\n    atomic_patch -p2 \"${WORKSPACE}/srcdir/patches/win_tk_rc_include.patch\"\nfi\n# Enable Xft for TrueType font support on 